name: Beach Auto-Curate

# External runner for the weekly_beach_auto_curate orch_jobs catalog row.
# Runs scripts/auto_curate.py across all active gold beaches, picking the
# top N=6 best+diverse photos via get_beach_photos_diverse + stamping
# curated_at + curated_by = 'Curated:AI'.
#
# Why GH Actions and not orch sql_function:
#   The selector function `get_beach_photos_diverse` uses pg_temp._cand
#   (per-call DROP/CREATE), which accumulates relation-level locks
#   within a single transaction. A PL/pgSQL loop calling it 3700 times
#   blows past max_locks_per_transaction. The Python driver works around
#   this by chunk-committing every 25 fids. See
#   [[get-beach-photos-diverse-temp-table-lock-leak]].
#
# Triggers:
#   - workflow_dispatch (manual + dispatched by the Supabase orch_jobs
#     `dispatch-github-workflow` edge function)
#
# Required repo secrets:
#   SUPABASE_URL, SUPABASE_SERVICE_KEY, SUPABASE_DB_PASSWORD,
#   ANTHROPIC_API_KEY (unused here but loaded by .env), ADMIN_SECRET
#
# Cost: DB CPU only. No LLM. ~6-8 min wall.

on:
  workflow_dispatch:
    inputs:
      n:
        description: 'Photos per beach (default 6)'
        required: false
        default: '6'
      state:
        description: 'Limit to one state (blank = all)'
        required: false
        default: ''
      skip_if_fresh_within:
        description: 'Skip beaches auto-curated within N days (default 7)'
        required: false
        default: '7'

concurrency:
  group: beach-auto-curate
  cancel-in-progress: false

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: Write env file
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          ADMIN_SECRET:         ${{ secrets.ADMIN_SECRET }}
        run: |
          mkdir -p scripts/pipeline
          cat > scripts/pipeline/.env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY
          SUPABASE_DB_PASSWORD=$SUPABASE_DB_PASSWORD
          ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY
          ADMIN_SECRET=$ADMIN_SECRET
          EOF
          mkdir -p supabase/.temp
          PROJECT_REF=ehlzbwtrsxaaukurekau
          echo "postgresql://postgres.${PROJECT_REF}@aws-1-us-east-1.pooler.supabase.com:5432/postgres" \
            > supabase/.temp/pooler-url

      - name: Run auto_curate.py
        env:
          N_PHOTOS:             ${{ inputs.n || '6' }}
          STATE_SCOPE:          ${{ inputs.state || '' }}
          SKIP_FRESH_WITHIN:    ${{ inputs.skip_if_fresh_within || '7' }}
        run: |
          set -e
          ARGS="--n $N_PHOTOS --chunk 25 --skip-if-fresh-within $SKIP_FRESH_WITHIN"
          if [ -n "$STATE_SCOPE" ]; then
            ARGS="$ARGS --state $STATE_SCOPE"
          fi
          echo "Running: python scripts/auto_curate.py $ARGS"
          python scripts/auto_curate.py $ARGS
