name: Deploy Supabase Edge Functions

# Triggers on any push to main that touches supabase/functions/. Re-deploys
# every function under supabase/functions/ with --no-verify-jwt — the only
# correct deploy flag for this project. The sb_publishable_ anon key (used
# by both the browser AND by cron's pg_net.http_post) is NOT a JWT, so any
# function deployed WITHOUT --no-verify-jwt returns 401
# UNAUTHORIZED_INVALID_JWT_FORMAT on every call.
#
# History: prior versions of this workflow hardcoded only 4 functions, and
# daily-beach-refresh was missing the --no-verify-jwt flag — every push that
# touched supabase/functions/** silently reverted daily-beach-refresh to
# JWT-verifying mode, including the 2026-05-30 push that took the function
# out for 4 days. Now we deploy every function under supabase/functions/*/
# with the correct flag, matching scripts/deploy_edge_function.sh --all.

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy every function under supabase/functions/ with --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for d in supabase/functions/*/; do
            fn="$(basename "$d")"
            [ "$fn" = "_shared" ] && continue
            echo "→ deploying $fn (--no-verify-jwt)"
            supabase functions deploy "$fn" \
              --no-verify-jwt \
              --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"
          done
