<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rain cautions — beaches + dog parks</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    #map { height: 100vh; width: 100vw; }
    .status {
      position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
      background: white; padding: 6px 12px; border-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      font-size: 13px; z-index: 1000; max-width: 80vw;
    }
    .legend {
      background: white; padding: 10px 14px; border-radius: 6px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.3); font-size: 12px; line-height: 1.6;
      min-width: 200px;
    }
    .legend-title { font-weight: 700; font-size: 13px; margin-bottom: 8px; color: #0f172a; }
    .legend-row { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
    .legend-swatch { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0,0,0,0.2); }
    .legend-counts { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e2e8f0; color: #475569; font-size: 11px; }
    .filter-row { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e2e8f0; }
    .filter-row label { display: block; font-size: 11px; color: #64748b; margin-bottom: 2px; }
    .filter-row select { width: 100%; padding: 4px 6px; font-size: 12px; border: 1px solid #cbd5e1; border-radius: 4px; }
    .info-panel {
      background: white; padding: 10px 12px; border-radius: 4px;
      font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      max-width: 280px;
    }
    .info-panel .name { font-weight: 700; font-size: 13px; color: #0f172a; }
    .info-panel .meta { color: #64748b; font-size: 11px; margin-top: 2px; }
    .info-panel .value { color: #b91c1c; font-weight: 600; margin-top: 4px; }
  </style>
</head>
<body>
<div id="status" class="status">Loading…</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SUPABASE_URL = 'https://ehlzbwtrsxaaukurekau.supabase.co';
const ANON_KEY     = 'sb_publishable_lAg7YdZ3w7S5fN8jgiExKQ_3-KtW3xk';

function todayISO() { return new Date().toISOString().slice(0, 10); }
function plusDays(iso, n) {
  const d = new Date(iso + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}

async function pgrest(path) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` },
  });
  if (!r.ok) throw new Error(`${r.status} ${path}: ${(await r.text()).slice(0,200)}`);
  return r.json();
}

(async function init() {
  const statusEl = document.getElementById('status');
  const map = L.map('map').setView([35.0, -98.0], 4);  // continental US view
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OSM &copy; CARTO',
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(map);

  // Layer groups for the two caution kinds.
  const beachLayer = L.layerGroup().addTo(map);
  const parkLayer  = L.layerGroup().addTo(map);

  // Severity colors for bacteria_risk
  function bacteriaColor(risk) {
    return risk === 'high'     ? '#b91c1c'   // red
         : risk === 'moderate' ? '#f59e0b'   // amber
         : '#94a3b8';                        // fallback
  }
  const mudColor = '#92400e';                // brown

  // Controls
  const legend = L.control({ position: 'topright' });
  legend.onAdd = function () {
    const div = L.DomUtil.create('div', 'legend');
    div.innerHTML = `
      <div class="legend-title">Rain cautions · <span id="date-label">${todayISO()}</span></div>
      <div class="legend-row"><span class="legend-swatch" style="background:#b91c1c"></span>Bacteria — high</div>
      <div class="legend-row"><span class="legend-swatch" style="background:#f59e0b"></span>Bacteria — moderate</div>
      <div class="legend-row"><span class="legend-swatch" style="background:#92400e"></span>Dog park — mud alert</div>
      <div class="legend-counts" id="counts">Loading…</div>
      <div class="filter-row">
        <label for="date-pick">Date</label>
        <select id="date-pick">
          ${[0,1,2,3,4,5,6].map(n => {
            const d = plusDays(todayISO(), n);
            const label = n === 0 ? `${d} (today)` : d;
            return `<option value="${d}"${n===0?' selected':''}>${label}</option>`;
          }).join('')}
        </select>
      </div>`;
    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  legend.addTo(map);

  async function loadDate(date) {
    statusEl.textContent = `Loading ${date}…`;
    document.getElementById('date-label').textContent = date;
    beachLayer.clearLayers();
    parkLayer.clearLayers();

    // ── Bacteria-caution beaches ──────────────────────────────────────
    // No FK from beach_day_recommendations to beaches_gold, so we do two
    // calls + client-side join on arena_group_id == beaches_gold.fid.
    let bacBeaches = [];
    try {
      const recs = await pgrest(
        `beach_day_recommendations?select=arena_group_id,local_date,bacteria_risk,precip_72h_mm`
        + `&local_date=eq.${date}`
        + `&bacteria_risk=in.(moderate,high)`
      );
      if (recs.length > 0) {
        const fids = [...new Set(recs.map(r => r.arena_group_id).filter(x => x != null))];
        const beaches = await pgrest(
          `beaches_gold?select=fid,display_name,name,state,latitude,longitude`
          + `&fid=in.(${fids.join(',')})`
        );
        const byFid = new Map(beaches.map(b => [b.fid, b]));
        bacBeaches = recs
          .map(r => ({ ...r, beach: byFid.get(r.arena_group_id) }))
          .filter(r => r.beach && r.beach.latitude != null && r.beach.longitude != null);
      }
    } catch (e) {
      statusEl.textContent = `Bacteria fetch failed: ${e.message}`;
      console.error(e);
    }

    let beachCount = 0;
    for (const r of bacBeaches) {
      const b = r.beach;
      const m = L.circleMarker([b.latitude, b.longitude], {
        radius: 7,
        fillColor: bacteriaColor(r.bacteria_risk),
        color: '#fff',
        weight: 1.5,
        fillOpacity: 0.85,
      });
      const name = b.display_name || b.name;
      m.bindTooltip(
        `<div class="name">${name}</div>` +
        `<div class="meta">${b.state || ''} · fid ${b.fid}</div>` +
        `<div class="value">${r.bacteria_risk.toUpperCase()} bacteria — ${r.precip_72h_mm}mm / 72h</div>`,
        { className: 'leaflet-tooltip', sticky: true }
      );
      m.on('click', () => {
        window.open(`../beach.html?fid=${b.fid}`, '_blank', 'noopener');
      });
      m.addTo(beachLayer);
      beachCount += 1;
    }

    // ── Mud-caution dog parks ─────────────────────────────────────────
    // dog_park_day_recommendations.risk_reason_codes is jsonb. Filter
    // via PostgREST jsonb containment: risk_reason_codes=cs.["muddy_surface"]
    let mudParks = [];
    try {
      mudParks = await pgrest(
        `dog_park_day_recommendations?select=dog_park_fid,local_date,risk_reason_codes,park:dog_parks_gold!inner(fid,display_name,name,state,lat,lng,surface)`
        + `&local_date=eq.${date}`
        + `&risk_reason_codes=cs.%5B%22muddy_surface%22%5D`
      );
    } catch (e) {
      statusEl.textContent = `Mud fetch failed: ${e.message}`;
      console.error(e);
    }

    let parkCount = 0;
    for (const r of mudParks) {
      const p = r.park;
      if (!p || p.lat == null || p.lng == null) continue;
      const m = L.circleMarker([p.lat, p.lng], {
        radius: 7,
        fillColor: mudColor,
        color: '#fff',
        weight: 1.5,
        fillOpacity: 0.85,
      });
      const name = p.display_name || p.name;
      m.bindTooltip(
        `<div class="name">${name}</div>` +
        `<div class="meta">${p.state || ''} · ${p.surface} · fid ${p.fid}</div>` +
        `<div class="value">MUD ALERT</div>`,
        { className: 'leaflet-tooltip', sticky: true }
      );
      m.on('click', () => {
        window.open(`../dog-park.html?fid=${p.fid}`, '_blank', 'noopener');
      });
      m.addTo(parkLayer);
      parkCount += 1;
    }

    document.getElementById('counts').textContent =
      `${beachCount} beaches · ${parkCount} dog parks`;
    statusEl.textContent = `${date} · ${beachCount + parkCount} total`;
  }

  // Wire date picker
  document.body.addEventListener('change', (e) => {
    if (e.target && e.target.id === 'date-pick') loadDate(e.target.value);
  });

  await loadDate(todayISO());
})();
</script>
</body>
</html>
