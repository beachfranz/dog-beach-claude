<!DOCTYPE html>
<!--
  admin/coord-audit.html — Coord divergence curator.

  Queues divergent (our coord vs external source coord) pairs from the
  coord_audit_pairs view. Curator sees ours (blue, draggable) and theirs
  (red, reference) on a map; saves write back to beaches_gold.lat/lon
  via admin-update-beaches-gold.

  Patterns reused from curate.html: JWT anon key, admin-secret in
  localStorage, Leaflet map, URL-hash persistence, Prev/Save/Skip/Next.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coord audit — Dog Beach Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #f8fafc; --card: #fff; --text: #0f2742; --muted: #64748b;
    --border: #e2e8f0; --accent: #1d4ed8; --green: #15803d; --red: #b91c1c;
    --amber: #b45309;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif;
         background: var(--bg); color: var(--text); }
  header.bar {
    padding: 12px 16px; background: #0f2742; color: #fff;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 100;
  }
  .bar-title { font-weight: 700; font-size: 15px; }
  .bar select {
    font-family: inherit; font-size: 13px; padding: 6px 10px;
    border-radius: 6px; border: 1px solid #1e3a5f;
    background: #1e293b; color: #fff; min-width: 380px;
  }
  .bar .progress { font-size: 12px; opacity: 0.7; }
  .bar button {
    font-family: inherit; font-size: 13px; padding: 6px 12px;
    border-radius: 6px; border: 0; background: var(--accent); color: #fff;
    cursor: pointer; font-weight: 600;
  }
  .bar button[disabled] { opacity: 0.4; cursor: not-allowed; }
  .bar button.danger { background: var(--red); }
  .bar button.success { background: var(--green); }
  .bar button.warn { background: var(--amber); }

  /* Login screen */
  #login {
    max-width: 360px; margin: 80px auto; padding: 24px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px;
  }
  #login h1 { margin: 0 0 16px; font-size: 18px; }
  #login label {
    display: block; font-size: 12px; font-weight: 600;
    color: var(--muted); margin: 12px 0 4px;
  }
  #login input {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-family: inherit; font-size: 14px;
  }
  #login button {
    margin-top: 16px; width: 100%; padding: 10px;
    background: var(--accent); color: white; border: 0;
    border-radius: 6px; font-weight: 600; cursor: pointer;
  }
  #login .err {
    color: var(--red); font-size: 13px; margin-top: 12px; min-height: 18px;
  }

  main { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .header-row { margin-bottom: 12px; }
  .beach-name {
    font-size: 22px; font-weight: 700; margin: 0;
    cursor: pointer; transition: color 0.15s;
  }
  .beach-name:hover { color: var(--accent); text-decoration: underline; }
  .beach-name::after {
    content: ' ↗'; font-size: 14px; color: var(--muted); font-weight: 400;
  }
  .beach-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
  .beach-sub .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700; margin-left: 6px;
    background: rgba(29,78,216,0.1); color: var(--accent);
  }
  .beach-sub .pill.warn { background: rgba(180,83,9,0.1); color: var(--amber); }
  .beach-sub .pill.muted { background: rgba(100,116,139,0.15); color: var(--muted); }

  #coord-map { height: 540px; width: 100%;
               border-radius: 10px; overflow: hidden;
               border: 1px solid var(--border); margin: 14px 0;
               background: #1e293b; }
  .legend {
    display: flex; gap: 20px; font-size: 13px; align-items: center;
    margin: 6px 0; color: var(--muted);
  }
  .legend .swatch {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.4);
    margin-right: 6px; vertical-align: middle;
  }
  .legend .swatch.ours { background: var(--accent); }
  .legend .swatch.theirs { background: var(--red); }
  .legend .delta { color: var(--text); font-weight: 600; }

  .coord-display { font-family: 'DM Mono', monospace; font-size: 12px;
                   color: var(--muted); margin: 4px 0; }
  .coord-display .diff { color: var(--amber); margin-left: 8px; }
  .coord-display .moved { color: var(--accent); margin-left: 8px; font-weight: 600; }

  .action-row {
    display: flex; gap: 10px; margin: 14px 0;
  }
  .action-row button {
    font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 10px 16px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); cursor: pointer;
  }
  .action-row button.primary { background: var(--green); color: #fff; border: 0; }
  .action-row button.primary[disabled] { opacity: 0.4; }
  .action-row button.danger { background: var(--red); color: #fff; border: 0; }

  .external-link {
    display: inline-block; font-size: 12px; color: var(--accent);
    margin-left: 10px;
  }
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--text); color: #fff; padding: 10px 18px;
    border-radius: 8px; font-size: 14px;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 1000;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--red); }
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <h1>Coord audit</h1>
  <label for="u">Username</label>
  <input id="u" autocomplete="username">
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password">
  <button id="login-btn" type="button">Sign in</button>
  <div class="err" id="login-err"></div>
</div>

<!-- App -->
<header class="bar" style="display:none" id="app-bar">
  <div class="bar-title">Coord audit</div>
  <select id="sel-pair"></select>
  <span class="progress" id="progress"></span>
  <button id="btn-logout" type="button" class="danger" style="margin-left:auto">Logout</button>
</header>

<main id="app" style="display:none">
  <div class="header-row">
    <h2 class="beach-name" id="beach-name">—</h2>
    <div class="beach-sub" id="beach-sub"></div>
  </div>

  <div class="legend">
    <span><span class="swatch ours"></span>Ours (draggable) <span id="badge-source"></span></span>
    <span><span class="swatch theirs"></span>Theirs (reference)</span>
    <span class="delta" id="delta-label"></span>
  </div>
  <div id="coord-map"></div>
  <div class="coord-display" id="coord-display"></div>

  <div class="action-row">
    <button id="btn-prev" type="button">‹ Prev</button>
    <button id="btn-skip" type="button">Skip →</button>
    <button id="btn-revert" type="button">Revert drag</button>
    <button id="btn-save" class="primary" type="button" disabled>Save & Next →</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://ehlzbwtrsxaaukurekau.supabase.co';
const ANON_KEY     = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVobHpid3Ryc3hhYXVrdXJla2F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2OTc0MDYsImV4cCI6MjA5MTI3MzQwNn0.BKGWJWwX99a39vzvpzFXduBn0vwHykKYliGlB2Ov0UU';

const SS_TOKEN = 'curator_token';
let token = sessionStorage.getItem(SS_TOKEN);
let queue = [];        // [{fid, beach_name, county, is_active, scoring_tier, tier, our_lat, our_lon, source, their_lat, their_lng, their_name, their_url, divergence_m}]
let qIdx = -1;
let movedLat = null, movedLng = null;  // pending drag changes

const loginBox = document.getElementById('login');
const errEl = document.getElementById('login-err');
document.getElementById('login-btn').addEventListener('click', login);
document.getElementById('p').addEventListener('keydown', e => { if (e.key==='Enter') login(); });

async function login() {
  errEl.textContent = '';
  const u = document.getElementById('u').value.trim();
  const p = document.getElementById('p').value;
  if (!u || !p) { errEl.textContent = 'Both fields required.'; return; }
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/verify-curator-login`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${ANON_KEY}`, 'apikey': ANON_KEY,
                 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p }),
    });
    if (!res.ok) {
      const j = await res.json().catch(()=>({error:'login failed'}));
      errEl.textContent = j.error || `HTTP ${res.status}`;
      return;
    }
    const { token: t } = await res.json();
    token = t;
    sessionStorage.setItem(SS_TOKEN, t);
    showApp();
  } catch (e) { errEl.textContent = String(e); }
}

document.getElementById('btn-logout').addEventListener('click', () => {
  sessionStorage.removeItem(SS_TOKEN);
  token = null;
  loginBox.style.display = '';
  document.getElementById('app').style.display = 'none';
  document.getElementById('app-bar').style.display = 'none';
});
if (token) showApp();

async function showApp() {
  loginBox.style.display = 'none';
  document.getElementById('app-bar').style.display = '';
  document.getElementById('app').style.display = '';
  await loadQueue();
}

// ─── Queue ────────────────────────────────────────────────────────
async function loadQueue() {
  const url = `${SUPABASE_URL}/rest/v1/coord_audit_pairs`
            + `?select=*&is_active=eq.true&scoring_tier=in.(daily,hourly)`
            + `&order=divergence_m.desc&limit=500`;
  const res = await fetch(url, { headers: {
    apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` } });
  queue = res.ok ? await res.json() : [];

  // Populate dropdown
  const sel = document.getElementById('sel-pair');
  sel.innerHTML = '';
  queue.forEach((p, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = `${i+1}. ${p.beach_name} — ${p.county_name} (${p.divergence_m}m off · ${p.tier})`;
    sel.appendChild(opt);
  });
  sel.onchange = () => goto(parseInt(sel.value, 10));

  // Land on URL-hash fid or first row
  const hashFid = parseHashFid();
  let startIdx = 0;
  if (hashFid) {
    const i = queue.findIndex(p => p.fid === hashFid);
    if (i >= 0) startIdx = i;
  }
  goto(startIdx);
}

function parseHashFid() {
  const m = (location.hash || '').match(/#fid=(\d+)/);
  return m ? parseInt(m[1], 10) : null;
}
function writeHashFid(fid) {
  history.replaceState(null, '', `#fid=${fid}`);
}

function goto(idx) {
  if (idx < 0 || idx >= queue.length) return;
  qIdx = idx;
  movedLat = null; movedLng = null;
  document.getElementById('btn-save').disabled = true;
  document.getElementById('sel-pair').value = String(idx);
  document.getElementById('progress').textContent =
    `${idx+1}/${queue.length}`;
  document.getElementById('btn-prev').disabled = idx === 0;
  const p = queue[idx];
  writeHashFid(p.fid);
  renderBeach(p);
}

document.getElementById('btn-prev').onclick = () => goto(qIdx - 1);
document.getElementById('btn-skip').onclick = () => goto(qIdx + 1);
document.getElementById('btn-save').onclick = () => savePair();
document.getElementById('btn-revert').onclick = () => {
  if (qIdx >= 0) {
    movedLat = null; movedLng = null;
    document.getElementById('btn-save').disabled = true;
    renderBeach(queue[qIdx]);
  }
};

function escHtml(s) {
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderBeach(p) {
  const nameEl = document.getElementById('beach-name');
  nameEl.textContent = p.beach_name;
  nameEl.title = `Open in beach-editor-gold (fid ${p.fid})`;
  nameEl.onclick = () => {
    const w = window.open(`beach-editor-gold.html?fid=${p.fid}`, 'beach-editor-gold');
    if (w) w.focus();
  };

  const sub = document.getElementById('beach-sub');
  sub.innerHTML =
    `fid ${p.fid} · ${escHtml(p.county_name || '')}, ${escHtml(p.state || 'CA')}` +
    ` <span class="pill">${escHtml(p.tier || '-')}</span>` +
    ((p.scoring_tier === 'daily' || p.scoring_tier === 'hourly') ? ' <span class="pill">scoreable</span>' :
                      ' <span class="pill muted">not scoreable</span>') +
    ` <span class="pill warn">${p.divergence_m}m divergence</span>`;

  // Source link
  const srcLabel = document.getElementById('badge-source');
  if (p.their_url) {
    srcLabel.innerHTML = ` (<a href="${escHtml(p.their_url)}" target="_blank" rel="noopener">${escHtml(p.source)}: ${escHtml(p.their_name || '')}</a>)`;
  } else {
    srcLabel.textContent = ` (${p.source}: ${p.their_name || ''})`;
  }

  document.getElementById('delta-label').textContent = `Δ ${p.divergence_m} m`;

  updateCoordDisplay(p, null, null);
  renderMap(p);
}

function updateCoordDisplay(p, mLat, mLng) {
  const lines = [
    `ours:   ${p.our_lat.toFixed(6)}, ${p.our_lon.toFixed(6)}`,
    `theirs: ${p.their_lat.toFixed(6)}, ${p.their_lng.toFixed(6)}`,
  ];
  if (mLat != null && mLng != null) {
    lines.push(`<span class="moved">moved: ${mLat.toFixed(6)}, ${mLng.toFixed(6)}</span>`);
  }
  document.getElementById('coord-display').innerHTML = lines.join('<br>');
}

// ─── Map ─────────────────────────────────────────────────────────
let _map = null, _ours = null, _theirs = null, _line = null;
function ensureMap() {
  if (_map) return _map;
  _map = L.map('coord-map', { zoomControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
    maxZoom: 20,
    attribution: '&copy; OpenStreetMap France | &copy; OpenStreetMap contributors',
    subdomains: 'abc',
  }).addTo(_map);
  _map.setView([37.5, -120], 6);
  return _map;
}

function renderMap(p) {
  const map = ensureMap();
  if (_ours) { map.removeLayer(_ours); _ours = null; }
  if (_theirs) { map.removeLayer(_theirs); _theirs = null; }
  if (_line) { map.removeLayer(_line); _line = null; }

  // Ours — blue, draggable
  _ours = L.circleMarker([p.our_lat, p.our_lon], {
    radius: 9, fillColor: '#1d4ed8', color: '#fff',
    weight: 3, fillOpacity: 1, opacity: 1,
  }).addTo(map);
  _ours.bindTooltip('Ours (draggable)', {
    permanent: true, direction: 'top', offset: [0, -10],
  });
  // Build draggable marker on top of the dot for grip
  const dragMarker = L.marker([p.our_lat, p.our_lon],
    { draggable: true, opacity: 0 }).addTo(map);
  _ours._dragMarker = dragMarker;
  dragMarker.on('drag dragend', (e) => {
    const ll = e.target.getLatLng();
    _ours.setLatLng(ll);
    movedLat = ll.lat; movedLng = ll.lng;
    document.getElementById('btn-save').disabled = false;
    updateCoordDisplay(p, movedLat, movedLng);
    if (_line) {
      _line.setLatLngs([[movedLat, movedLng], [p.their_lat, p.their_lng]]);
    }
  });

  // Theirs — red, reference
  _theirs = L.circleMarker([p.their_lat, p.their_lng], {
    radius: 9, fillColor: '#b91c1c', color: '#fff',
    weight: 3, fillOpacity: 1, opacity: 1,
  }).addTo(map);
  _theirs.bindTooltip(`Theirs (${p.source})`, {
    permanent: true, direction: 'top', offset: [0, -10],
  });

  // Line connecting them
  _line = L.polyline([[p.our_lat, p.our_lon], [p.their_lat, p.their_lng]], {
    color: '#b45309', weight: 2, dashArray: '6 6', opacity: 0.7,
  }).addTo(map);

  // Fit both
  map.fitBounds([[p.our_lat, p.our_lon], [p.their_lat, p.their_lng]],
                { padding: [60, 60], maxZoom: 18 });
  setTimeout(() => map.invalidateSize(), 50);
}

// ─── Save ────────────────────────────────────────────────────────
async function savePair() {
  if (qIdx < 0 || movedLat == null || movedLng == null) return;
  const p = queue[qIdx];
  document.getElementById('btn-save').disabled = true;
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-update-beaches-gold`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${ANON_KEY}`, 'apikey': ANON_KEY,
                 'Content-Type': 'application/json', 'x-admin-secret': token },
      body: JSON.stringify({
        fid: p.fid,
        fields: { lat: movedLat, lon: movedLng },
      }),
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      showToast(`Save failed: ${j.error || res.status}`, true);
      document.getElementById('btn-save').disabled = false;
      return;
    }
    showToast(`Saved fid ${p.fid}`);
    // Optimistic: update in-memory queue so re-visits show new ours
    p.our_lat = movedLat; p.our_lon = movedLng;
    p.divergence_m = Math.round(haversineKm(movedLat, movedLng, p.their_lat, p.their_lng) * 1000);
    goto(qIdx + 1);
  } catch (e) {
    showToast(`Save error: ${e}`, true);
    document.getElementById('btn-save').disabled = false;
  }
}

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLon = (lon2 - lon1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 +
            Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) *
            Math.sin(dLon/2)**2;
  return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
</body>
</html>
