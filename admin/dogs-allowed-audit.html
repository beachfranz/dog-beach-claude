const POLY_COLORS = {
  yes: '#15803d', restricted: '#fbbf24', seasonal: '#fb923c',
  mixed: '#a78bfa', no: '#ef4444', unknown: '#94a3b8',
};

const ZONE_STYLES = {
  pet_allowed_carveout:      { color: '#15803d', weight: 2, dashArray: '5 5', fillColor: '#15803d', fillOpacity: 0.10 },
  pet_prohibited_zone:       { color: '#b91c1c', weight: 2, dashArray: '5 5', fillColor: '#b91c1c', fillOpacity: 0.10 },
  wildlife_critical_habitat: { color: '#d97706', weight: 2, dashArray: '2 6', fillColor: '#d97706', fillOpacity: 0.08 },
  seasonal_closure:          { color: '#ea580c', weight: 2, dashArray: '2 6', fillColor: '#ea580c', fillOpacity: 0.08 },
};

async function fetchPolicyZones() {
  if (_zonesCache) return _zonesCache;
  const r = await fetch(
    `${SUPABASE_URL}/rest/v1/dog_policy_zones_geojson?select=id,category,name,species,source_agency,source_url,effective_dates,notes,geom`,
    { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` } }
  );
  if (!r.ok) return [];
  _zonesCache = await r.json();
  return _zonesCache;
}

function ensureMiniMap() {
  if (_miniMap) return _miniMap;
  _miniMap = L.map('map-pane', { zoomControl: true, preferCanvas: true })
    .setView([35.5, -120.0], 6);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri', maxZoom: 19,
  }).addTo(_miniMap);
  return _miniMap;
}

async function loadPolygonForBeach(b) {
  const map = ensureMiniMap();
  if (_miniLayer) { map.removeLayer(_miniLayer); _miniLayer = null; }
  _miniZoneLayers.forEach(l => map.removeLayer(l));
  _miniZoneLayers = [];
  document.getElementById('poly-meta').textContent = 'Loading polygon…';

  try {
    const [polyRes, zones] = await Promise.all([
      fetch(`${SUPABASE_URL}/rest/v1/beach_polygons_geojson?fid=eq.${b.fid}`,
        { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` } }),
      fetchPolicyZones(),
    ]);
    if (!polyRes.ok) throw new Error(`REST ${polyRes.status}`);
    const rows = await polyRes.json();

    // Render policy zones first (so beach polygon draws on top)
    let intersectingZones = [];
    if (rows.length) {
      const beachBounds = L.geoJSON(rows[0].geom).getBounds();
      const beachCenter = beachBounds.getCenter();
      // Crude proximity filter: zones within ~10km of beach center
      zones.forEach(z => {
        const zoneBounds = L.geoJSON(z.geom).getBounds();
        if (beachCenter.distanceTo(zoneBounds.getCenter()) < 20000) {
          const layer = L.geoJSON(z.geom, { style: ZONE_STYLES[z.category] || ZONE_STYLES.pet_allowed_carveout });
          const dates = z.effective_dates
            ? ` · ${z.effective_dates.start}–${z.effective_dates.end}` : '';
          layer.bindTooltip(
            `<strong>${escapeHtml(z.name)}</strong><br>${escapeHtml(z.category)} · ${escapeHtml(z.source_agency)}${dates}`,
            { direction: 'top', sticky: true }
          );
          layer.bindPopup(`
            <div style="font-size:12px; line-height:1.4; min-width:220px;">
              <div style="font-weight:700; margin-bottom:4px;">${escapeHtml(z.name)}</div>
              <div style="font-size:11px; color:#64748b;">
                ${escapeHtml(z.category)} · ${escapeHtml(z.source_agency)}
              </div>
              ${z.species ? `<div style="margin-top:4px;">species: <strong>${escapeHtml(z.species)}</strong></div>` : ''}
              ${z.effective_dates ? `<div style="margin-top:4px;">dates: ${escapeHtml(JSON.stringify(z.effective_dates))}</div>` : ''}
              ${z.notes ? `<div style="margin-top:4px; font-size:11px;">${escapeHtml(z.notes)}</div>` : ''}
              ${z.source_url ? `<div style="margin-top:4px; font-size:10px;"><a href="${escapeHtml(z.source_url)}" target="_blank">source</a></div>` : ''}
            </div>
          `);
          layer.addTo(map);
          _miniZoneLayers.push(layer);
          intersectingZones.push(z);
        }
      });
    }

    if (!rows.length) {
      document.getElementById('poly-meta').textContent = 'No polygon for this fid';
      map.setView([35.5, -120], 6);
      return;
    }
    const poly = rows[0];
    const status = b.consumer?.dogs_allowed ?? 'unknown';
    const fill = POLY_COLORS[status] || POLY_COLORS.unknown;
    const baseStyle = { color: fill, weight: 1.5, opacity: 0.9, fillColor: fill };
    const style = poly.source_tier === 'osm'
      ? { ...baseStyle, fillOpacity: 0.4 }
      : poly.source_tier === 'cpad'
        ? { ...baseStyle, fillOpacity: 0.18, dashArray: '4 4' }
        : { ...baseStyle, fillOpacity: 0.10, dashArray: '2 4' };

    _miniLayer = L.geoJSON(poly.geom, { style }).addTo(map);
    const tierLabel = poly.source_tier === 'osm' ? 'OSM beach polygon (true beach footprint)'
                    : poly.source_tier === 'cpad' ? 'CPAD managing unit (broader than the actual sand)'
                    : '250m buffered point (last-resort placeholder)';
    _miniLayer.bindTooltip(
      `<strong>${escapeHtml(b.name)}</strong> · ${poly.source_tier}`,
      { direction: 'top', sticky: true }
    );
    _miniLayer.bindPopup(`
      <div style="font-size:12px; line-height:1.4; min-width:220px;">
        <div style="font-weight:700; font-size:13px; margin-bottom:4px;">${escapeHtml(b.name)}</div>
        <div style="font-size:11px; color:#64748b;">fid=${b.fid} · ${escapeHtml(b.county || '')}</div>
        <div style="margin-top:4px;"><strong>polygon:</strong> ${poly.source_tier}</div>
        <div style="font-size:11px; color:#64748b; font-style:italic;">${tierLabel}</div>
        <div style="margin-top:4px;"><strong>area:</strong> ${(poly.area_m2/1000).toFixed(0)}K m²</div>
        ${poly.is_split_loser ? '<div style="margin-top:4px; color:#6b21a8;"><strong>⚠ split-loser:</strong> a sibling beach won the OSM polygon arbitration; this polygon is the cpad/buffer fallback</div>' : ''}
        <div style="margin-top:4px;"><strong>dogs_allowed:</strong> ${escapeHtml(status)}</div>
      </div>
    `);
    map.fitBounds(_miniLayer.getBounds(), { maxZoom: 16, padding: [12, 12] });

    const split = poly.is_split_loser ? ' · ⚠ split-loser (sibling won OSM arbitration)' : '';
    const zoneNote = intersectingZones.length
      ? ` · 🟢 ${intersectingZones.length} policy zone${intersectingZones.length > 1 ? 's' : ''} nearby`
      : '';
    document.getElementById('poly-meta').innerHTML =
      `<strong>${poly.source_tier}</strong>${split} · area ${(poly.area_m2/1000).toFixed(0)}K m²${zoneNote}`;
  } catch (e) {
    document.getElementById('poly-meta').textContent = 'ERROR: ' + e.message;
  }
}

function init() {
  const picker = document.getElementById('beach-picker');

  // Group beaches by verdict; order: false-allow, false-deny, loose, missing, match
  const byVerdict = {};
  AUDIT_DATA.beaches.forEach(b => {
    (byVerdict[b.verdict] ??= []).push(b);
  });

  VERDICT_ORDER.forEach(v => {
    if (!byVerdict[v]) return;
    const grp = document.createElement('optgroup');
    grp.label = `${VERDICT_LABEL[v]} (${byVerdict[v].length})`;
    byVerdict[v]
      .sort((a, b) => a.name.localeCompare(b.name))
      .forEach(b => {
        const opt = document.createElement('option');
        opt.value = b.fid;
        opt.textContent = `fid=${b.fid} · ${b.name} · ${b.county}`;
        grp.appendChild(opt);
      });
    picker.appendChild(grp);
  });

  picker.addEventListener('change', () => loadBeach(parseInt(picker.value)));

  // Default: first beach in first verdict group with content
  const first = (byVerdict.false_allow || byVerdict.false_deny ||
                 byVerdict.match_loose || byVerdict.match || [])[0];
  if (first) {
    picker.value = first.fid;
    loadBeach(first.fid);
  }
}

      <div><span style="display:inline-block; width:10px; height:10px; background:#ef4444; border-radius:50%; margin-right:3px; vertical-align:middle;"></span>no</div>
      <div><span style="display:inline-block; width:10px; height:10px; background:#94a3b8; border-radius:50%; margin-right:3px; vertical-align:middle;"></span>unknown</div>
      <div style="font-weight: 700; margin-top: 5px; margin-bottom: 3px;">POLICY ZONES</div>
      <div><span style="display:inline-block; width:12px; height:6px; background:#15803d; opacity:0.4; border:1px dashed #15803d; margin-right:3px; vertical-align:middle;"></span>pet-allowed carve-out</div>
      <div><span style="display:inline-block; width:12px; height:6px; background:#b91c1c; opacity:0.4; border:1px dashed #b91c1c; margin-right:3px; vertical-align:middle;"></span>pet-prohibited zone</div>
      <div><span style="display:inline-block; width:12px; height:6px; background:#d97706; opacity:0.4; border:1px dashed #d97706; margin-right:3px; vertical-align:middle;"></span>wildlife habitat</div>
    </div>
    <div id="poly-meta" style="font-size:11px; color:var(--text-muted); margin-top:4px;"></div>
  `;
  left.appendChild(mapBlock);

  // Re-init map (since the map-pane element is freshly recreated each load).
  // Tear down the prior Leaflet instance to avoid leaking the layer cache.
  if (_miniMap) {
    try { _miniMap.remove(); } catch (e) {}
    _miniMap = null;
  }
  _miniLayer = null;
  _miniZoneLayers = [];
  loadPolygonForBeach(b);

  left.appendChild(renderFieldTable(b));

  const h2 = document.createElement('h2');
  h2.textContent = 'Zone rules (text_repass_v1)';
  left.appendChild(h2);
  left.appendChild(renderZones(b));

  // Right pane — evidence (gold block + evidence cards)
  const ev = document.getElementById('evidence-cards');
  ev.innerHTML = '';
  ev.appendChild(renderGoldBlock(b));
  (b.evidence || []).forEach(e => ev.appendChild(renderEvidenceCard(e)));
}

// ============================================================================
function renderFieldTable(b) {
  const tbl = document.createElement('table');
  tbl.className = 'field-table';
  tbl.innerHTML = `
    <thead>
      <tr>
        <th>Field</th>
        <th>Ground truth (gold_set)</th>
        <th>Consumer (beach_dog_policy)</th>
        <th>Verdict</th>
      </tr>
    </thead>
    <tbody></tbody>`;
  const tb = tbl.querySelector('tbody');

  // dogs_allowed (the audited field)
  const truth = b.gold?.verified_value ?? null;
  const actual = b.consumer?.dogs_allowed ?? null;
  const cls = b.verdict === 'false_allow' ? 'row-allow' :
              b.verdict === 'false_deny'  ? 'row-deny'  :
              b.verdict === 'match'       ? 'row-match' : 'row-mismatch';
  const isAudited = b.verdict !== 'match';
  tb.appendChild(rowEl({
    field: 'dogs_allowed',
    truth: truth, actual: actual,
    rowClass: cls,
    verdict: VERDICT_LABEL[b.verdict],
    truthMeta: b.gold ? `verified ${b.gold.verified_at} by ${b.gold.verified_by}` : null,
    actualMeta: b.consumer
      ? `${b.consumer.source ?? '—'} · conf ${(+b.consumer.consensus_confidence || 0).toFixed(2)}${b.consumer.disagreement_flag ? ' · ⚠ disagreement' : ''}`
      : null,
  }));

  // Other beach-level consumer fields (no truth side, just informational)
  const otherFields = [
    ['leash_policy', b.consumer?.leash_policy],
    ['off_leash_flag', b.consumer?.off_leash_flag],
    ['dogs_prohibited_start', b.consumer?.dogs_prohibited_start],
    ['dogs_prohibited_end', b.consumer?.dogs_prohibited_end],
    ['dogs_allowed_areas', b.consumer?.dogs_allowed_areas],
    ['access_rule', b.consumer?.access_rule],
    ['notes', b.consumer?.notes],
  ];
  otherFields.forEach(([f, val]) => {
    if (val == null || val === '') return;
    tb.appendChild(rowEl({ field: f, truth: null, actual: val, rowClass: '' }));
  });

  return tbl;
}

function rowEl({ field, truth, actual, rowClass, verdict, truthMeta, actualMeta }) {
  const tr = document.createElement('tr');
  if (rowClass) tr.className = rowClass;
  tr.innerHTML = `
    <td class="field-name">${escapeHtml(field)}</td>
    <td>${valueCell(truth, truthMeta)}</td>
    <td>${valueCell(actual, actualMeta)}</td>
    <td>${verdict ? `<span class="value-pill pill-${field === 'dogs_allowed' && verdict.includes('false-allow') ? 'no' : 'default'}">${escapeHtml(verdict)}</span>` : ''}</td>
  `;
  return tr;
}

function valueCell(val, meta) {
  if (val == null || val === '') return `<span class="field-value empty">—</span>`;
  const cls = ['yes','no','mixed','seasonal','restricted'].includes(String(val))
    ? `pill-${val}` : 'pill-default';
  const isPill = ['yes','no','mixed','seasonal','restricted'].includes(String(val))
    || typeof val === 'boolean';
  let html = isPill
    ? `<span class="value-pill ${cls}">${escapeHtml(String(val))}</span>`
    : `<span class="field-value">${escapeHtml(String(val))}</span>`;
  if (meta) html += `<div class="field-meta">${escapeHtml(meta)}</div>`;
  return html;
}

// ============================================================================
function renderZones(b) {
  const root = document.createElement('div');
  // Normalize: new shape has seasons[] at top; legacy has regions[] at top.
  const seasons = b.zone_rules?.seasons
    || (b.zone_rules?.regions
        ? [{ name: null, months: null, regions: b.zone_rules.regions }]
        : null);
  if (!seasons || !seasons.length) {
    root.innerHTML = `<div class="empty-zones">No zone_rules data
      (no text_repass_v1 row for this fid).</div>`;
    return root;
  }
  const renderRegions = (regionList) => regionList.forEach(region => {
    const card = document.createElement('div');
    card.className = 'region';
    const nm = document.createElement('div');
    nm.className = 'region-name' + (region.name ? '' : ' unnamed');
    nm.textContent = region.name || '(default region — whole beach)';
    card.appendChild(nm);

    if (region.time_windows || region.seasonal || region.evidence) {
      const mods = document.createElement('div');
      mods.className = 'region-mods';
      (region.time_windows || []).forEach(tw => {
        const m = document.createElement('span');
        m.className = 'mod';
        m.textContent = `⏰ ${tw.start}-${tw.end} ${tw.rule}`;
        mods.appendChild(m);
      });
      (region.seasonal || []).forEach(s => {
        const m = document.createElement('span');
        m.className = 'mod';
        m.textContent = `🟠 ${s.months}${s.reason ? ' · ' + s.reason : ''}`;
        mods.appendChild(m);
      });
      card.appendChild(mods);
    }

    Object.entries(region.sections || {}).forEach(([sec, secObj]) => {
      const row = document.createElement('div');
      row.className = 'section-row';
      const extras = [];
      (secObj.time_windows || []).forEach(tw => extras.push(`⏰ ${tw.start}-${tw.end} ${tw.rule}`));
      (secObj.seasonal || []).forEach(s => extras.push(`🟠 ${s.months}`));
      (secObj.sub_zones || []).forEach(sz => extras.push(`📍 ${sz.name} (${sz.rule})`));
      if (secObj.evidence) extras.push(`📌 evidence pinned`);
      row.innerHTML = `
        <span class="section-icon">${SECTION_ICON[sec] || '?'}</span>
        <span class="section-name">${escapeHtml(SECTION_LABEL[sec] || sec)}</span>
        <span class="section-rule rule-${secObj.rule || 'unknown'}">${escapeHtml(secObj.rule || 'unknown')}</span>
        <span class="section-extras">${extras.map(e => `<span class="pill">${escapeHtml(e)}</span>`).join('')}</span>
      `;
      card.appendChild(row);
    });

    root.appendChild(card);
  });

  // For each season: header (if multi-season or non-default name) + its regions
  seasons.forEach(season => {
    const showHeader = seasons.length > 1
      || (season.name && season.name !== 'All year' && season.name !== null);
    if (showHeader) {
      const sh = document.createElement('div');
      sh.style.cssText = 'background: #fef3c7; border: 1px solid #fbbf24; padding: 6px 10px; border-radius: 4px; margin: 8px 0 4px; font-size: 11px; font-weight: 600; color: #854d0e;';
      let bound = '';
      if (season.dates && typeof season.dates === 'object' && season.dates !== null) {
        bound = ` · ${season.dates.start} → ${season.dates.end}`;
      } else if (season.months) {
        bound = typeof season.months === 'string'
          ? ` · ${season.months}`
          : ` · months ${JSON.stringify(season.months)}`;
      }
      sh.textContent = `🟠 ${season.name || 'All year'}${bound}`;
      root.appendChild(sh);
    }
    renderRegions(season.regions || []);
  });

  if (b.zone_rules.global_notes) {
    const notes = document.createElement('div');
    notes.style.cssText = 'font-size: 11px; color: var(--text-muted); margin-top: 6px; padding: 6px 8px; background: var(--gray-bg); border-radius: 4px;';
    notes.innerHTML = `<strong>global_notes:</strong> ${escapeHtml(b.zone_rules.global_notes)}`;
    root.appendChild(notes);
  }
  return root;
}

// ============================================================================
function renderGoldBlock(b) {
  const card = document.createElement('div');
  card.className = 'gold-block';
  if (!b.gold) {
    card.innerHTML = `<h3>📋 Ground truth</h3><div class="footnote">No gold-set entry for this fid.</div>`;
    return card;
  }
  card.innerHTML = `
    <h3>📋 Ground truth</h3>
    <div><strong>verified_value:</strong>
      <span class="value-pill pill-${b.gold.verified_value || 'default'}">${escapeHtml(b.gold.verified_value || '—')}</span></div>
    <div style="margin-top:3px;"><strong>verified_by:</strong> ${escapeHtml(b.gold.verified_by || '—')}</div>
    <div><strong>verified_at:</strong> ${escapeHtml(b.gold.verified_at || '—')}</div>
    ${b.gold.notes ? `<div style="margin-top:4px;"><strong>notes:</strong> ${escapeHtml(b.gold.notes)}</div>` : ''}
    ${b.gold.source_url ? `<div class="evidence-url" style="margin-top:3px;">${escapeHtml(b.gold.source_url)}</div>` : ''}
  `;
  return card;
}

function renderEvidenceCard(ev) {
  const card = document.createElement('div');
  card.className = 'evidence-card' + (ev.is_canonical ? ' canonical' : '');
  const claims = [];
  if (ev.allowed) claims.push(`<span class="pill">allowed: ${escapeHtml(ev.allowed)}</span>`);
  if (ev.leash) claims.push(`<span class="pill">leash: ${escapeHtml(ev.leash)}</span>`);
  card.innerHTML = `
    <div class="evidence-head">
      <span class="evidence-source ${ev.is_canonical ? 'canonical' : ''}">📄 ${escapeHtml(ev.source)}${ev.is_canonical ? ' ★' : ''}</span>
      <span class="evidence-conf">conf ${(+ev.confidence || 0).toFixed(2)}</span>
    </div>
    ${claims.length ? `<div class="evidence-claims">${claims.join('')}</div>` : ''}
    <div class="evidence-quote">"${escapeHtml(ev.quote || '')}"</div>
    ${ev.source_url ? `<div class="evidence-url">${escapeHtml(ev.source_url)}</div>` : ''}
  `;
  return card;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

init();
</script>

</html>
