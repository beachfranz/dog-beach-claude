<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beach — Dog Beach Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/photo-block.css">
<link rel="stylesheet" href="src/zone-rules-block.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f2742;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --accent: #1d4ed8;
    --green: #16a34a;
    --red:   #dc2626;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .page { max-width: 1200px; margin: 0 auto; }
  .body-grid {
    display: grid;
    grid-template-columns: 1fr;  /* mobile default — single column, stacked */
    gap: 0;
  }
  @media (min-width: 900px) {
    .body-grid {
      grid-template-columns: minmax(260px, 30%) 1fr;  /* 30% left rail / 70% main */
      gap: 16px;
      padding: 0 16px;
    }
    .body-grid > main { padding: 0; }
    .body-grid > aside#left-rail {
      position: sticky;
      top: 96px;  /* below sticky hero */
      align-self: start;
      padding-top: 12px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
    }
    /* Narrow-column overrides for blocks designed for wider layouts. */
    #left-rail .amenity-grid { grid-template-columns: repeat(2, 1fr); }
    #left-rail .zr-sections  { grid-template-columns: 1fr; }
    #left-rail .zr-card { margin: 8px 0; padding: 10px 12px; }
  }
  header.hero {
    padding: 24px 20px 16px; background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .hero-main { flex: 1; min-width: 0; }
  .beach-name {
    font-family: 'Outfit', sans-serif;
    font-size: 24px; font-weight: 700; color: var(--text);
    margin: 0 0 6px;
  }
  /* Your-Fit overall as a colored badge to the left of the name.
   * 20% smaller than the h1 (24px → 19px) per Franz; colored by
   * the same go/caution/no_go threshold the bar chart uses. */
  .fit-badge {
    display: inline-block;
    font-size: 19px; font-weight: 700; line-height: 1.1;
    padding: 1px 9px; border-radius: 999px;
    color: white;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.04em;
    margin-right: 4px;
  }
  .fit-badge-go      { background: #16a34a; }
  .fit-badge-caution { background: #f59e0b; }
  .fit-badge-no_go   { background: #dc2626; }
  /* City · state inlined into the h1 — same font/size/weight,
   * lighter color so it reads as supporting info to the name. */
  .beach-region {
    color: var(--text-muted);
    margin-left: 0.4em;
    font-weight: 600;
  }
  .beach-address {
    font-size: 13px; color: var(--text); display: flex;
    align-items: center; gap: 6px;
  }
  .beach-address a {
    color: var(--accent); text-decoration: none;
  }
  .beach-address a:hover { text-decoration: underline; }
  .copy-btn {
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--card);
    font-size: 11px; color: var(--text-muted);
    transition: all 0.15s;
  }
  .copy-btn:hover { background: var(--bg); color: var(--text); }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }
  .close-btn {
    color: var(--text-muted); text-decoration: none;
    font-size: 22px; line-height: 1; padding: 4px 6px;
    border-radius: 6px; flex-shrink: 0;
  }
  .close-btn:hover { background: var(--bg); }

  section.card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; margin: 8px 16px;
  }
  /* Tooltips on [data-tip] — subtle pill above the element with a
   * 200ms hover-in delay (much faster than the native ~600ms) and
   * an instant hover-out. */
  [data-tip] { position: relative; }
  [data-tip]::after {
    content: attr(data-tip);
    position: absolute;
    left: 50%; bottom: calc(100% + 4px);
    transform: translateX(-50%);
    background: rgba(15,23,42,0.78);
    color: rgba(255,255,255,0.95);
    padding: 4px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 500; line-height: 1.35;
    width: max-content; max-width: 220px;
    text-align: center;
    z-index: 1000; pointer-events: none;
    opacity: 0;
    transition: opacity 80ms ease-out 0s;
  }
  [data-tip]:hover::after {
    opacity: 1;
    transition-delay: 200ms;
  }
  section.card h2 {
    font-size: 14px; font-weight: 700; margin: 0 0 8px;
    color: var(--text);
  }

  /* Map block */
  #map {
    height: 200px; border-radius: 8px; border: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .map-actions {
    display: flex; flex-direction: column; gap: 8px;
  }
  .directions-btn {
    background: var(--accent); color: white; padding: 10px 14px;
    border-radius: 8px; text-decoration: none; font-weight: 600;
    font-size: 14px; text-align: center; display: block;
  }
  .directions-btn:hover { opacity: 0.92; }
  .map-address {
    font-size: 12px; color: var(--text-muted);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }

  /* Hours */
  .hours-grid {
    display: grid; grid-template-columns: max-content 1fr;
    gap: 6px 16px; font-size: 13px;
  }
  .hours-grid dt { color: var(--text-muted); font-weight: 500; }
  .hours-grid dd { margin: 0; color: var(--text); }
  .hours-range { font-size: 14px; font-weight: 600; color: var(--text); margin: 0; }
  .hours-dogs-prohibited { margin: 8px 0 0; font-size: 13px; color: var(--text); }
  .hours-dogs-suggest    { margin: 2px 0 0; font-size: 13px; color: var(--text-muted); }

  /* Amenities — first card on the LHS, "Amenities" h2 should sit at
   * the same baseline as the first line of Beach text in the main
   * column (which has margin-top 28). With tightened card
   * padding (12) + h2 line-height, this lands ≈ y=28. */
  .amenities-card { margin-top: 16px; }
  .amenities-card h2 { margin-bottom: 6px; }
  .amenity-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  }
  @media (min-width: 480px) {
    .amenity-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .amenity {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px;
    background: var(--card);
  }
  .amenity-icon { font-size: 14px; flex-shrink: 0; }
  .amenity-text { display: flex; flex-direction: column; line-height: 1.2; }
  .amenity-sub {
    font-size: 10px; color: var(--text-muted); font-weight: 500;
    margin-top: 1px;
  }
  .amenity-grid { gap: 4px; }
  /* Long labels wrap inside the narrow 2-col cell. */
  .amenity-label { white-space: normal; line-height: 1.2; }
  /* Tiles tinted by dog-policy rule when the section has one. */
  .amenity.rule-off_leash   { background: rgba(34,197,94,0.45); border-color: rgba(21,128,61,0.42); }
  .amenity.rule-on_leash    { background: rgba(251,191,36,0.53); border-color: rgba(180,83,9,0.42); }
  .amenity.rule-not_allowed { background: rgba(239,68,68,0.45); border-color: rgba(153,27,27,0.42); }
  .amenity.rule-unknown     { background: rgba(0,0,0,0.04); }
  /* Zone-name sub-header inside the unified Amenities card (multi-zone beaches). */
  .amenity-zone-header {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-muted);
    margin: 8px 0 4px;
  }
  .amenity-zone-header:first-child { margin-top: 0; }
  /* .amenity.absent and .amenity.unknown no longer rendered — both
   * filter out at the JS layer until the user-feedback affordance
   * lands (project_amenity_user_feedback.md). */

  /* Weather card — compact icon + chips row, mimics index.html. */
  .weather-card .weather-now {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 4px 0 2px;
  }
  .weather-now-cond {
    font-size: 36px; line-height: 1;
  }
  .weather-chips {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 6px 8px;
  }
  .weather-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; padding: 3px 8px;
    border-radius: 999px;
    background: rgba(0,0,0,0.05); color: var(--text);
  }
  .weather-loading { color: var(--text-muted); font-size: 12px; padding: 8px 0; }

  /* Hourly score bar — ported from detail.html. Renders inside
   * the Best Window card. */
  .score-row {
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px 56px 0; margin-top: 10px;
    border-top: 1px solid var(--border);
  }
  .score-row-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 500;
    color: var(--text-muted); letter-spacing: 0.04em;
  }
  .score-bars-wrap {
    display: flex; align-items: flex-end; gap: 3px;
    height: 58px;
  }
  .score-bar-col {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; flex: 1; min-width: 0;
  }
  .score-bar-value {
    font-family: 'DM Mono', monospace;
    font-size: 9px; color: var(--text-muted);
    white-space: nowrap; line-height: 1;
  }
  .score-bar-dog { font-size: 10px; line-height: 1; min-height: 12px; }
  .score-bar {
    width: 100%; border-radius: 3px 3px 0 0;
    min-height: 4px; transition: opacity 0.15s;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* Stacked segments — same palette as the Your-Fit bar so the two
   * surfaces share visual language. Weather on top, then amenities,
   * then access at the bottom. */
  .score-bar-seg { width: 100%; flex-shrink: 0; }
  .score-bar-seg-weather   { background: #f59e0b; }
  .score-bar-seg-amenities { background: #0ea5e9; }
  .score-bar-seg-access    { background: #16a34a; }
  .score-bar-seg-excluded  { background: rgba(239,68,68,0.45); width: 100%; }
  .score-x-axis { display: flex; gap: 3px; padding: 2px 0 0; }
  .score-x-label {
    flex: 1; text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 9px; color: var(--text-muted);
    white-space: nowrap; overflow: hidden;
  }

  /* Best-time card — same header shape as the Your-Fit card: title
   * left, headline right (the time-range). When hourly detail is
   * available, the headline becomes a clickable affordance that opens
   * the per-hour modal. */
  .besttime-card h2 {
    font-size: 16px; font-weight: 700; margin: 0; color: var(--text);
  }
  .besttime-header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px;
  }
  .besttime-headline {
    font-size: 28px; font-weight: 700; color: var(--text);
    letter-spacing: -0.02em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .besttime-card.clickable .besttime-headline {
    cursor: pointer;
    text-decoration: underline; text-decoration-color: rgba(0,0,0,0.18);
    text-underline-offset: 2px;
  }
  .besttime-card.clickable .besttime-headline:hover {
    text-decoration-color: var(--text);
  }

  /* Detail modal — iframe overlay opened from the Best Window card. */
  .detail-modal {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.72);
    display: none;
    z-index: 9999;
    padding: 24px;
    align-items: center; justify-content: center;
  }
  .detail-modal.open { display: flex; }
  .detail-modal-inner {
    position: relative;
    background: var(--bg);
    width: 100%; max-width: 900px; height: 90vh;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .detail-modal-inner iframe { width: 100%; height: 100%; border: 0; }
  .detail-modal-close {
    position: absolute; top: 10px; right: 12px;
    background: rgba(0,0,0,0.55); color: white;
    border: 0; width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; font-size: 16px; line-height: 1;
    z-index: 1;
  }

  /* Scout blurb — now nested inside the Best Time card. Paragraph
   * narrative; fades in when LLM call returns. */
  #scout-blurb {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; line-height: 1.55;
    color: var(--text);
    margin-top: 8px;
    opacity: 0.55;
    transition: opacity 0.15s;
  }
  #scout-blurb.loaded { opacity: 1; }

  /* Advisories list — per-metric advisory/caution/no_go rows.
   * Severity tinting per row (advisory blue / caution amber / no_go red). */
  .cautions-card ul.advisory-list {
    list-style: none; padding: 0; margin: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
  }
  .advisory-row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 8px; border-radius: 0 4px 4px 0;
    border-left: 3px solid var(--border);
    font-size: 12px; line-height: 1.3; color: var(--text);
  }
  .advisory-icon { font-size: 14px; line-height: 1.3; flex-shrink: 0; }
  .advisory-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .advisory-headline { display: flex; align-items: baseline; gap: 6px; }
  .advisory-label { font-weight: 600; }
  .advisory-value { font-size: 11px; color: var(--text-muted); }
  .advisory-time  { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  /* Conditions domain: burnt-amber (amber-500 nudged ~7% toward red) for
   * caution; distinct from the amber-400 (yellow-leaning) used by
   * Amenities on_leash tiles so the two domains never collide visually. */
  .advisory-advisory { background: rgba(37,99,235,0.08); border-left-color: #1d4ed8; }
  .advisory-caution  { background: rgba(247,140,18,0.53); border-left-color: rgba(180,83,9,0.58); }
  .advisory-no_go    { background: rgba(239,68,68,0.45);  border-left-color: rgba(153,27,27,0.42); }

  /* Tide card — one smooth line, hi/lo bubbles, NOW dot. */
  .weather-card svg.tide-curve {
    display: block; width: 80%; height: 120px;
    margin: 0 auto;
    border-radius: 8px;
    background: transparent;
  }
  /* Smooth gradient fill under the curve — light at top, deep at bottom */
  .weather-card .tide-fill { fill: url(#tide-grad); }
  .weather-card .tide-stroke {
    fill: none; stroke: #0369a1; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  /* Hi/lo markers — text only, no bubble border */
  .weather-card .tide-marker-arrow { fill: #0369a1; font-size: 11px; font-weight: 700; }
  .weather-card .tide-marker-text  { fill: #0f2742; font-size: 11px; font-weight: 700; }
  /* Zero-tide reference line — dashed charcoal at v=0ft */
  .weather-card .tide-zero-line {
    stroke: rgba(15,39,66,0.55); stroke-width: 1; stroke-dasharray: 3 3;
  }
  .weather-card .tide-zero-label {
    font-size: 9px; fill: rgba(15,39,66,0.55); font-weight: 600;
  }
  /* Hour-scale labels along the bottom */
  .weather-card .tide-hour-axis-label {
    font-size: 9px; fill: rgba(15,39,66,0.55); font-weight: 600;
  }
  /* Hover zones — 48 invisible rects across the chart, each carrying
   * a native SVG <title>. Browser shows a system tooltip on hover. */
  .weather-card .tide-hover-zone { fill: rgba(0,0,0,0); cursor: help; }
  /* NOW marker — vertical line + label at top */
  .weather-card .tide-now-line {
    stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 3 2;
  }
  .weather-card .tide-now-dot { fill: #f59e0b; stroke: #fff; stroke-width: 2; }
  .weather-card .tide-now-label {
    font-size: 10px; font-weight: 700; fill: #92400e;
  }
  /* Hour ticks along the bottom */
  .weather-card .tide-hour-tick   { stroke: rgba(2,132,199,0.18); stroke-width: 1; }
  .weather-card .tide-hour-label  { font-size: 9px; fill: rgba(15,39,66,0.55); }

  .weather-card .tide-events {
    display: flex; flex-wrap: wrap; gap: 4px 10px;
    font-size: 11px; color: var(--text-muted); margin-top: 8px;
  }
  .weather-card .tide-events strong { color: var(--text); font-weight: 600; }
  .weather-card .tide-empty { color: var(--text-muted); font-size: 12px; font-style: italic; }

  /* Alternatives card — shows on beaches where dogs aren't allowed
   * or where sand/water access is prohibited. Mirrors detail.html's
   * "Try these instead" card. */
  .alt-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .alt-card-header {
    font-size: 14px; font-weight: 700; color: var(--text);
    margin-bottom: 4px;
  }
  .alt-card-reason {
    font-size: 12px; color: var(--text-muted); margin-bottom: 10px;
  }
  .alt-list { display: flex; flex-direction: column; gap: 8px; }
  .alt-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    text-decoration: none; color: inherit;
    transition: background 0.1s;
  }
  .alt-row:hover { background: rgba(0,0,0,0.02); }
  .alt-row-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .alt-name { font-weight: 600; font-size: 13px; color: var(--text); }
  .alt-meta { font-size: 11px; color: var(--text-muted); }
  .alt-row-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  /* Zone-rules styles now in src/zone-rules-block.css (shared block) */

  /* Links block */
  .link-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; text-decoration: none; color: var(--text);
    font-size: 13px; margin-bottom: 8px;
    transition: background 0.1s;
  }
  .link-row:hover { background: var(--bg); }
  .link-row .arrow { margin-left: auto; color: var(--text-muted); }

  /* Loading / error */
  .state {
    display: flex; flex-direction: column; align-items: center;
    padding: 80px 20px; gap: 12px; color: var(--text-muted);
  }
  .state-icon { font-size: 36px; }

  /* Details narrative — structured / curated facts (zone_rules.global_notes).
     Dimmer than .beach-description so the LLM-generated description at
     top carries the page; details supplement, don't compete. */
  .details-prose {
    font-size: 13px; color: var(--text-muted); line-height: 1.55;
    white-space: pre-wrap;
  }

  /* Beach description (LLM-generated, voice-led) */
  .beach-description {
    /* legacy class kept for any inline use; the overview card supersedes it. */
    font-size: 14px; color: var(--text); line-height: 1.55;
  }
  /* Appeal card — stacked horizontal bar of contributions (Access +
   * Amenities + Weather), summing to Overall. Empty tail = unfilled
   * potential. Legend below names the segments + raw weighted values. */
  .appeal-card h2 {
    font-size: 16px; font-weight: 700; margin: 0; color: var(--text);
  }
  .appeal-card .appeal-pref {
    font-size: 12px; font-weight: 500; color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .appeal-header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px;
  }
  .appeal-overall { font-variant-numeric: tabular-nums; line-height: 1; }
  .appeal-overall-num {
    font-size: 28px; font-weight: 700; color: var(--text);
    letter-spacing: -0.02em;
  }
  .appeal-overall-max {
    font-size: 13px; font-weight: 500; color: var(--text-muted);
    margin-left: 1px;
  }
  /* Pack list — chip strip showing rule-derived gear to bring.
   * Hover/long-press a chip for its reason (sunscreen because UV X). */
  .packlist-card h2 {
    font-size: 16px; font-weight: 700; margin: 0 0 10px; color: var(--text);
  }
  .packlist-chips {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  }
  .packlist-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 999px;
    background: rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.06);
    font-size: 13px; color: var(--text);
    cursor: help;
  }
  .packlist-icon { font-size: 15px; line-height: 1; }
  .packlist-label { font-weight: 500; }

  /* Beach text — bare prose at top of main column, no card chrome.
   * Same edge padding as cards so it lines up vertically. */
  .overview-blurb {
    font-size: 14px; color: var(--text); line-height: 1.55;
    margin: 28px 16px 16px;
  }
  /* Scout blurb — uniform 14px / 1.55 line-height. */
  .scout-card #scout-blurb {
    font-size: 14px; line-height: 1.55;
    color: var(--text);
    margin: 0; padding: 0;
    opacity: 1;
  }
  /* Today's activities — deterministic prose, lives below the Scout
   * blurb inside the same card. Small top margin separates them. */
  .activities-prose {
    font-size: 14px; line-height: 1.55; color: var(--text);
    margin: 8px 0 0;
  }
  /* Scout CTA — "Wanna go? Drive ~XX min. [Send directions →]" */
  .scout-cta {

const escHtml = s => String(s ?? '')

function _currentLocalHour(timezone) {
  const tz = timezone || 'America/Los_Angeles';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: '2-digit', hour12: false,
  }).formatToParts(new Date());
  const h = parts.find(p => p.type === 'hour')?.value;
  return h != null ? (parseInt(h, 10) % 24) : null;
}

function _currentLocalMinutes(timezone) {
  const tz = timezone || 'America/Los_Angeles';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false,
  }).formatToParts(new Date());
  const h = parseInt(parts.find(p => p.type === 'hour')?.value || '0', 10) % 24;
  const m = parseInt(parts.find(p => p.type === 'minute')?.value || '0', 10);
  return h * 60 + m;
}

// If the beach allows dogs today but the user is currently inside the
// prohibition window (and the window ends later today, not after midnight),
// return a "Come back after Xpm" suggestion. Returns '' otherwise.
function _suggestPostProhibitionTime(start, end, timezone) {
  if (!start || !end) return '';
  const toMin = s => {
    const [h, m] = String(s).split(':').map(Number);
    return h * 60 + (m || 0);
  };
  const startM = toMin(start);
  const endM   = toMin(end);
  // Wrap-around (overnight) and end-of-day midnight windows: no useful
  // same-day suggestion — punt.
  if (endM === 0 || endM <= startM) return '';
  const nowM = _currentLocalMinutes(timezone);
  if (nowM < startM || nowM >= endM) return '';
  const eh = Math.floor(endM / 60), em = endM % 60;
  const ap = eh >= 12 ? 'pm' : 'am';
  const h12 = eh === 0 ? 12 : eh > 12 ? eh - 12 : eh;
  const label = em ? `${h12}:${String(em).padStart(2,'0')}${ap}` : `${h12}${ap}`;
  return `<p class="hours-dogs-suggest">Come back after ${label} now.</p>`;
}

async function load() {

    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/beaches_gold?select=fid&location_id=eq.${encodeURIComponent(locationId)}&limit=1`,
      { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` }});
    const rows = await r.json();
    if (!rows?.[0]?.fid) return showError('Beach not found.');
    resolvedFid = rows[0].fid;
  }

  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_beach_info`, {
      method: 'POST',
      headers: {
        apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_fid: parseInt(resolvedFid, 10) }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    if (!data?.beach) return showError('Beach not found.');
    render(data, resolvedFid);
  } catch (err) {

  }
}

// ─── Hours harmonization ────────────────────────────────────────────
// Pick ONE open/close time per beach from the available sources, in
// priority order:
//   1. beach.open_time / close_time (structured, non-default)
//   2. Parse amenities.hours_text for an "8am-6pm" style range
//   3. Detect "sunrise/sunset/dawn/dusk" in hours_text and substitute
//      computed sun times for the beach's lat/lng and today's date
//   4. Else fall through to the raw prose
// Output format: "6:00AM - 8:00PM".

function _fmt12(hour24, minute) {
  const ap = hour24 >= 12 ? 'PM' : 'AM';
  const h12 = hour24 === 0 ? 12 : hour24 > 12 ? hour24 - 12 : hour24;
  return `${h12}:${String(minute || 0).padStart(2, '0')}${ap}`;
}

function _hhmmToFmt(hhmm) {
  const [h, m] = String(hhmm).split(':').map(n => parseInt(n, 10));
  if (Number.isNaN(h)) return null;
  return _fmt12(h % 24, m || 0);
}

// Sunrise / sunset for a lat/lng on a given date, returned as
// { sunriseMin, sunsetMin, dawnMin, duskMin } where each is minutes
// after local midnight. Civil dawn/dusk = sun -6° below horizon
// (~30 min before sunrise / after sunset). Standard NOAA solar
// position math, ±2 min accuracy. Honors beach timezone.
function _sunTimes(lat, lng, dateObj, timezone) {
  if (lat == null || lng == null) return null;
  const rad = Math.PI / 180;
  const start = new Date(dateObj.getFullYear(), 0, 0);
  const doy = Math.floor((dateObj - start) / 86400000);
  const B = rad * (360 / 365) * (doy - 81);
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const decl = 23.45 * rad * Math.sin(rad * (360 / 365) * (doy - 81));
  const latRad = lat * rad;
  // Sunrise/sunset (sun at horizon, refraction-corrected ≈ -0.833°)
  const computeMin = (zenithDeg) => {
    const cosHa = (Math.cos(zenithDeg * rad) - Math.sin(latRad) * Math.sin(decl))
                / (Math.cos(latRad) * Math.cos(decl));
    if (cosHa > 1 || cosHa < -1) return null;
    return Math.acos(cosHa) * 4 / rad;  // minutes (4 min/degree)
  };
  const haRise  = computeMin(90.833);
  const haCivil = computeMin(96);  // civil twilight
  if (haRise == null) return null;
  // Tz offset for the beach (minutes east of UTC). Use Intl trick.
  const tzMinutes = (() => {
    try {
      const local = new Date(dateObj.toLocaleString('en-US', { timeZone: timezone }));
      const utc   = new Date(dateObj.toLocaleString('en-US', { timeZone: 'UTC' }));
      return Math.round((local - utc) / 60000);
    } catch { return -lng * 4; } // fallback: longitude → minutes east of UTC
  })();
  // Solar noon (local minutes after midnight)
  const noonMin = 12 * 60 - eot + tzMinutes + 4 * lng;
  return {
    sunriseMin: Math.round(noonMin - haRise),
    sunsetMin:  Math.round(noonMin + haRise),
    dawnMin:    haCivil != null ? Math.round(noonMin - haCivil) : null,
    duskMin:    haCivil != null ? Math.round(noonMin + haCivil) : null,
  };
}

function _minutesToFmt(min) {
  if (min == null || !Number.isFinite(min)) return null;
  // Wrap into 0-1439 just in case.
  const wrapped = ((min % 1440) + 1440) % 1440;
  return _fmt12(Math.floor(wrapped / 60), wrapped % 60);
}

// Try to derive a single (openLabel, closeLabel) from the available sources.
function _harmonizedHours(beach, amenities) {
  const open = beach.open_time, close = beach.close_time;
  const isDefault = open === '05:00' && close === '22:00';
  if (open && close && !isDefault) {
    return { openLabel: _hhmmToFmt(open), closeLabel: _hhmmToFmt(close) };
  }
  const text = (amenities?.hours_text || '').trim();
  if (!text) return null;

  // Pattern: explicit HH(:MM)? am/pm – HH(:MM)? am/pm
  const rangeRe = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)\s*(?:[-–—]|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i;
  const m = text.match(rangeRe);
  if (m) {
    const to24 = (h, ap) => {
      h = parseInt(h, 10);
      if (/pm/i.test(ap) && h < 12) h += 12;
      if (/am/i.test(ap) && h === 12) h = 0;
      return h;
    };
    return {
      openLabel:  _fmt12(to24(m[1], m[3]), parseInt(m[2] || '0', 10)),
      closeLabel: _fmt12(to24(m[4], m[6]), parseInt(m[5] || '0', 10)),
    };
  }

  // Pattern: sunrise/sunset/dawn/dusk substitution. Look up actual
  // times from the beach lat/lng and today's date.
  const sun = _sunTimes(beach.lat, beach.lng, new Date(), beach.timezone);
  if (sun) {
    const subst = (label) => {
      if (/sunrise/i.test(label)) return _minutesToFmt(sun.sunriseMin);
      if (/sunset/i.test(label))  return _minutesToFmt(sun.sunsetMin);
      if (/dawn/i.test(label))    return _minutesToFmt(sun.dawnMin);
      if (/dusk/i.test(label))    return _minutesToFmt(sun.duskMin);
      return null;
    };
    // "Xam-sunset" / "sunrise-Ypm" / "dawn-dusk" etc.
    const sideRe = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:[-–—]|to)\s*(sunset|sunrise|dawn|dusk)/i;
    const m2 = text.match(sideRe);
    if (m2) {
      const to24 = (h, ap) => {
        h = parseInt(h, 10);
        if (ap && /pm/i.test(ap) && h < 12) h += 12;
        if (ap && /am/i.test(ap) && h === 12) h = 0;
        return h;
      };
      return {
        openLabel:  _fmt12(to24(m2[1], m2[3]), parseInt(m2[2] || '0', 10)),
        closeLabel: subst(m2[4]),
      };
    }
    const sideRe2 = /(sunset|sunrise|dawn|dusk)\s*(?:[-–—]|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i;
    const m3 = text.match(sideRe2);
    if (m3) {
      const to24 = (h, ap) => {
        h = parseInt(h, 10);
        if (ap && /pm/i.test(ap) && h < 12) h += 12;
        if (ap && /am/i.test(ap) && h === 12) h = 0;
        return h;
      };
      return {
        openLabel:  subst(m3[1]),
        closeLabel: _fmt12(to24(m3[2], m3[4]), parseInt(m3[3] || '0', 10)),
      };
    }
    const bothRe = /(sunrise|dawn)\s*(?:[-–—]|to)\s*(sunset|dusk)/i;
    const m4 = text.match(bothRe);
    if (m4) return { openLabel: subst(m4[1]), closeLabel: subst(m4[2]) };
  }

  return null;
}

function buildHoursSection(beach, amenities, dogPolicy) {
  const harmonized = _harmonizedHours(beach, amenities);
  const hoursText = amenities?.hours_text;
  const rangeLabel = harmonized
    ? `${harmonized.openLabel || '?'} - ${harmonized.closeLabel || '?'}`
    : (hoursText || null);
  if (!rangeLabel) {
    // Still render the dogs-prohibited block on its own if applicable.
    const prohibStart = dogPolicy?.dogs_prohibited_start;
    const prohibEnd   = dogPolicy?.dogs_prohibited_end;
    if (!prohibStart || !prohibEnd) return '';
  }
  const prohibStart = dogPolicy?.dogs_prohibited_start;
  const prohibEnd   = dogPolicy?.dogs_prohibited_end;
  const prohibNote  = (prohibStart && prohibEnd)
    ? `<p class="hours-dogs-prohibited"><strong>Dogs not allowed ${escHtml(prohibStart)}–${escHtml(prohibEnd)}</strong></p>`
      + _suggestPostProhibitionTime(prohibStart, prohibEnd, beach.timezone)
    : '';
  const rangeHtml = rangeLabel
    ? `<p class="hours-range">${escHtml(rangeLabel)}</p>`
    : '';
  return `<section class="card">
    <h2>Hours</h2>
    ${rangeHtml}
    ${prohibNote}
  </section>`;
}
