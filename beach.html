  // Pattern: explicit HH(:MM)? am/pm – HH(:MM)? am/pm
  const rangeRe = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)\s*(?:[-–—]|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i;
  const m = text.match(rangeRe);
  if (m) {
    const to24 = (h, ap) => {
      h = parseInt(h, 10);
      if (/pm/i.test(ap) && h < 12) h += 12;
      if (/am/i.test(ap) && h === 12) h = 0;
      return h;
    };
    return {
      openLabel:  _fmt12(to24(m[1], m[3]), parseInt(m[2] || '0', 10)),
      closeLabel: _fmt12(to24(m[4], m[6]), parseInt(m[5] || '0', 10)),
    };
  }

  // Pattern: sunrise/sunset/dawn/dusk substitution. Look up actual
  // times from the beach lat/lng and today's date.
  const sun = _sunTimes(beach.lat, beach.lng, new Date(), beach.timezone);
  if (sun) {
    const subst = (label) => {
      if (/sunrise/i.test(label)) return _minutesToFmt(sun.sunriseMin);
      if (/sunset/i.test(label))  return _minutesToFmt(sun.sunsetMin);
      if (/dawn/i.test(label))    return _minutesToFmt(sun.dawnMin);
      if (/dusk/i.test(label))    return _minutesToFmt(sun.duskMin);
      return null;
    };
    // "Xam-sunset" / "sunrise-Ypm" / "dawn-dusk" etc.
    const sideRe = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:[-–—]|to)\s*(sunset|sunrise|dawn|dusk)/i;
    const m2 = text.match(sideRe);
    if (m2) {
      const to24 = (h, ap) => {
        h = parseInt(h, 10);
        if (ap && /pm/i.test(ap) && h < 12) h += 12;
        if (ap && /am/i.test(ap) && h === 12) h = 0;
        return h;
      };
      return {
        openLabel:  _fmt12(to24(m2[1], m2[3]), parseInt(m2[2] || '0', 10)),
        closeLabel: subst(m2[4]),
      };
    }
    const sideRe2 = /(sunset|sunrise|dawn|dusk)\s*(?:[-–—]|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i;
    const m3 = text.match(sideRe2);
    if (m3) {
      const to24 = (h, ap) => {
        h = parseInt(h, 10);
        if (ap && /pm/i.test(ap) && h < 12) h += 12;
        if (ap && /am/i.test(ap) && h === 12) h = 0;
        return h;
      };
      return {
        openLabel:  subst(m3[1]),
        closeLabel: _fmt12(to24(m3[2], m3[4]), parseInt(m3[3] || '0', 10)),
      };
    }
    const bothRe = /(sunrise|dawn)\s*(?:[-–—]|to)\s*(sunset|dusk)/i;
    const m4 = text.match(bothRe);
    if (m4) return { openLabel: subst(m4[1]), closeLabel: subst(m4[2]) };
  }

  return null;
}

function buildHoursSection(beach, amenities, dogPolicy) {
  const harmonized = _harmonizedHours(beach, amenities);
  const hoursText = amenities?.hours_text;
  const rangeLabel = harmonized
    ? `${harmonized.openLabel || '?'} - ${harmonized.closeLabel || '?'}`
    : (hoursText || null);
  if (!rangeLabel) {
    // Still render the dogs-prohibited block on its own if applicable.
    const prohibStart = dogPolicy?.dogs_prohibited_start;
    const prohibEnd   = dogPolicy?.dogs_prohibited_end;
    if (!prohibStart || !prohibEnd) return '';
  }
  const prohibStart = dogPolicy?.dogs_prohibited_start;
  const prohibEnd   = dogPolicy?.dogs_prohibited_end;
  // Format raw HH:MM(:SS) → "10am" / "5:30pm" via existing _hhmmToFmt
  // (Franz 2026-05-20 — was rendering raw "10:00:00–17:00:00").
  const prohibStartFmt = prohibStart ? _hhmmToFmt(String(prohibStart).slice(0,5)) : null;
  const prohibEndFmt   = prohibEnd   ? _hhmmToFmt(String(prohibEnd  ).slice(0,5)) : null;
  // Suppress the "Dogs not allowed X-Y" + "come back after Y" block when the
  // window spans the entire day (00:00–23:59). Such a window is never useful
  // to display: either it's a sentinel meaning "no time-of-day restriction"
  // OR it's a regional plover-style closure that the promoter mis-collapsed
  // to a whole-beach flat field. The dog-policy section conveys access state
  // separately. Per Franz 2026-06-04 — Oceano Dunes case (the page was saying
  // "come back after 11:59pm now").
  const isFullDayProhib = (
    String(prohibStart || '').slice(0,5) === '00:00' &&
    String(prohibEnd   || '').slice(0,5) === '23:59'
  );
  const prohibNote  = (prohibStartFmt && prohibEndFmt && !isFullDayProhib)
    ? `<p class="hours-dogs-prohibited"><strong>Dogs not allowed ${escHtml(prohibStartFmt)}–${escHtml(prohibEndFmt)}</strong></p>`
      + _suggestPostProhibitionTime(prohibStart, prohibEnd, beach.timezone)
    : '';
  const rangeHtml = rangeLabel
    ? `<p class="hours-range">${escHtml(rangeLabel)}</p>`
    : '';
  return `<section class="card">
    <h2>Hours</h2>
    ${rangeHtml}
    ${prohibNote}
  </section>`;
}

const AMENITY_DEFS = [
  { key: 'has_parking',         icon: '🅿️',  label: 'Parking' },
  { key: 'has_restrooms',       icon: '🚻',  label: 'Restrooms' },
  { key: 'has_showers',         icon: '🚿',  label: 'Showers' },
  { key: 'has_drinking_water',  icon: '💧',  label: 'Drinking water' },
  { key: 'has_picnic_area',     icon: '🧺',  label: 'Picnic area' },
  { key: 'has_fire_pits',       icon: '🔥',  label: 'Fire pits' },
  { key: 'has_lifeguards',      icon: '🛟',  label: 'Lifeguards' },
  { key: 'has_disabled_access', icon: '♿',  label: 'Accessibility' },
];

// Phase 4 of [[dwell-ada-crowd-autocurate]] (revised 2026-06-07): the rich
// accessibility detail lives in its own dedicated card (buildAccessibilityCard)
// just above Pack List. The amenity tile in the left-rail stays simple; the
// overview card carries a one-sentence summary. Helpers below feed all three
// surfaces from the same beach_amenities.accessibility_features JSONB.
const _PATH_TO_SAND_LABEL = {
  boardwalk:   'Wheelchair-accessible boardwalk to sand',
  ramp:        'Wheelchair-accessible ramp to sand',
  mat:         'Beach mat (Mobi-Mat) over sand',
  stairs_only: 'Stairs only — no wheelchair path',
  none:        'No accessible path to sand',
};

// Structured list of accessibility items for the dedicated card. Each item
// has an icon + label; the card renders them as rows.
function _accessibilityFeatureItems(features) {
  if (!features || typeof features !== 'object') return [];
  const items = [];
  if (features.path_to_sand && _PATH_TO_SAND_LABEL[features.path_to_sand]) {
    items.push({ icon: '♿', label: _PATH_TO_SAND_LABEL[features.path_to_sand] });
  }
  if (features.beach_mat === true && features.path_to_sand !== 'mat') {
    items.push({ icon: '♿', label: 'Beach mat available' });
  }
  if (features.boardwalk === true && features.path_to_sand !== 'boardwalk') {
    items.push({ icon: '🪵', label: 'Boardwalk' });
  }
  if (features.wheelchair_rental && features.wheelchair_rental.available === true) {
    const provider = features.wheelchair_rental.provider;
    items.push({ icon: '🦽',
                 label: provider ? `Beach wheelchair rental — ${provider}` : 'Beach wheelchair rental available',
                 url: features.wheelchair_rental.url || null });
  }
  if (features.beach_wheelchair_program && features.beach_wheelchair_program.available === true) {
    const provider = features.beach_wheelchair_program.provider;
    const phone    = features.beach_wheelchair_program.phone;
    const resUrl   = features.beach_wheelchair_program.reservation_url;
    let label = provider ? `Wheelchair program — ${provider}` : 'Wheelchair program available';
    if (phone) label += ` · ${phone}`;
    items.push({ icon: '🦽', label, url: resUrl });
  }
  if (features.accessible_restrooms === true) items.push({ icon: '🚻', label: 'Accessible restrooms' });
  if (features.accessible_parking   === true) items.push({ icon: '🅿️', label: 'Accessible parking' });
  if (features.accessible_viewing   === true) items.push({ icon: '👁️', label: 'Accessible viewing platform' });
  return items;
}

// One-sentence summary for the overview card. Picks the strongest known
// feature and leads with it. Returns null when no actionable feature exists.
function _accessibilityOverviewLine(features) {
  if (!features || typeof features !== 'object') return null;
  if (features.path_to_sand === 'boardwalk') return 'This beach has a wheelchair-accessible boardwalk to the sand.';
  if (features.path_to_sand === 'ramp')      return 'This beach has a wheelchair-accessible ramp to the sand.';
  if (features.path_to_sand === 'mat')       return 'This beach has a beach mat for wheelchair access to the sand.';
  if ((features.wheelchair_rental && features.wheelchair_rental.available === true) ||
      (features.beach_wheelchair_program && features.beach_wheelchair_program.available === true)) {
    return 'This beach has a beach wheelchair available for visitors.';
  }
  if (features.accessible_restrooms === true || features.accessible_parking === true ||
      features.accessible_viewing === true || features.boardwalk === true) {
    return 'This beach has accessibility features — see the Accessibility card for details.';
  }
  if (features.path_to_sand === 'stairs_only') return 'Beach access is stairs-only; no wheelchair path to the sand.';
  return null;
}

// Back-compat alias kept for the surfacing check in _visibleAmenityTiles
// (any item present ⇒ tile renders).
function _accessibilityHasContent(features) {
  return _accessibilityFeatureItems(features).length > 0;
}

const PARKING_TYPE_LABEL = {
  lot: 'Lot', mixed: 'Mixed', metered: 'Metered',
  street: 'Street', none: 'No parking',
};
// OSM-style subtypes — used when parking_type is missing but
// parking_subtype is present (OSM emitter pathway).
const PARKING_SUBTYPE_LABEL = {
  surface: 'Lot', street_side: 'Street', 'multi-storey': 'Garage',
  multi_storey: 'Garage', underground: 'Garage', carports: 'Carport',
  rooftop: 'Rooftop',
};

function _parkingTypeLabel(amenities) {
  // Prefer the LLM enum; fall back to OSM-style subtype mapping.
  if (amenities.parking_type) return PARKING_TYPE_LABEL[amenities.parking_type] || '';
  if (amenities.parking_subtype) return PARKING_SUBTYPE_LABEL[amenities.parking_subtype] || '';
  return '';
}

function _parkingCostLabel(amenities) {
  // Structured signal wins: parking_fee = true → Paid, false → Free.
  if (amenities.parking_fee === true)  return 'Paid';
  if (amenities.parking_fee === false) return 'Free';
  // Fallback: metered is always paid by definition.
  if (amenities.parking_type === 'metered') return 'Paid';
  // Last resort: regex parking_notes prose (LLM-supplied "$5/day" etc).
  const n = String(amenities.parking_notes || '');
  if (/\$|\bfee\b|\bpaid\b/i.test(n)) return 'Paid';
  if (/\bfree\b/i.test(n))           return 'Free';
  return '';
}

const _RULE_TOOLTIP = {
  off_leash:   'Dogs off-leash welcome here',
  on_leash:    'Dogs on-leash here',
  not_allowed: 'Dogs not allowed in this zone',
  unknown:     'Rule unclear — verify on-site',
};

function _amenityTooltip(def, rule) {
  const ruleNote = rule ? ` · ${_RULE_TOOLTIP[rule] || rule}` : '';
  return `${def.label}${ruleNote}`;
}

// m² → acres with sensible precision across our distribution
// (median 2.3 acres, p90 53 acres, max 3,043 acres).
function _formatAcres(m2) {
  if (!m2 || m2 <= 0) return '';
  const acres = m2 * 0.000247105;
  if (acres < 0.1) return '<0.1';
  if (acres < 10)  return acres.toFixed(1);
  return Math.round(acres).toLocaleString('en-US');
}

// Build the data-attrs string for clickable amenity buttons. Keeps the
// content-vs-copy split: structural data on the button, body text built
// at click time from a copy lookup (so iterating on phrasing doesn't
// require re-rendering tiles).
function _amenityButtonAttrs(def, rule, opts) {
  const o = opts || {};
  const parts = [];
  parts.push(`type="button"`);
  parts.push(`data-key="${escHtml(def.key || '')}"`);
  if (def.sectionName) parts.push(`data-section="${escHtml(def.sectionName)}"`);
  if (rule)           parts.push(`data-rule="${escHtml(rule)}"`);
  if (o.value)        parts.push(`data-value="${escHtml(o.value)}"`);
  if (o.sub)          parts.push(`data-sub="${escHtml(o.sub)}"`);
  parts.push(`aria-expanded="false"`);
  return parts.join(' ');
}

function _renderParkingTile(def, type, subtype, fee, ruleClass, rule) {
  const typeLabel = PARKING_TYPE_LABEL[type] || PARKING_SUBTYPE_LABEL[subtype] || '';
  const costLabel = fee === true ? 'Paid' : fee === false ? 'Free' : '';
  const sub = [typeLabel, costLabel].filter(Boolean).join(' · ');
  const tip = _amenityTooltip(def, rule) + (sub ? ` · ${sub}` : '');
  const attrs = _amenityButtonAttrs(def, rule, { value: sub, sub });
  return `<button class="amenity${ruleClass || ''}" ${attrs} data-tip="${escHtml(tip)}">
    <span class="amenity-icon">${def.icon}</span>
    <span class="amenity-text">
      <span class="amenity-label">${def.label}</span>
      ${sub ? `<span class="amenity-sub">${escHtml(sub)}</span>` : ''}
    </span>
  </button>`;
}

function _renderAmenityTile(def, amenities) {
  return _renderAmenityTileWithRule(def, amenities, null);
}

// Section-tile and amenity-tile renderer with optional rule color.
// rule: 'off_leash' | 'on_leash' | 'not_allowed' | 'unknown' | null
// Tiles are <button> elements; click reveals a concise detail panel
// below the amenities grid (mirrors the Cautions card pattern). Data
// attrs hold the structural facts; body copy is built at click time.
function _renderAmenityTileWithRule(def, amenities, rule) {
  const ruleClass = rule ? ` rule-${rule}` : '';
  const tip = _amenityTooltip(def, rule);
  const attrs = _amenityButtonAttrs(def, rule);
  // Sand + Water claim a full grid row so their tile + any time-window
  // chips read top-down vertically rather than getting wedged into the
  // 2-col / 3-col grid alongside other amenities.
  const fwClass = (def.sectionName === 'sand' || def.sectionName === 'water')
    ? ' amenity-fullwidth' : '';
  // Section-only tile (e.g. Sand, Trails) — no amenity boolean,
  // just emoji + label + rule color.
  if (def.sectionName) {
    return `<button class="amenity${ruleClass}${fwClass}" ${attrs} data-tip="${escHtml(tip)}">
      <span class="amenity-icon">${def.icon}</span>
      <span class="amenity-label">${def.label}</span>
    </button>`;
  }
  if (def.key === 'has_parking') {
    if (Array.isArray(amenities?.parking_options) && amenities.parking_options.length > 0) {
      return amenities.parking_options
        .map(opt => _renderParkingTile(def, opt.type, opt.subtype, opt.fee, ruleClass, rule))
        .join('');
    }
    return _renderParkingTile(def,
      amenities?.parking_type, amenities?.parking_subtype,
      _parkingCostLabel(amenities) === 'Paid' ? true
        : _parkingCostLabel(amenities) === 'Free' ? false : null,
      ruleClass, rule);
  }
  // Accessibility tile: simple tooltip. Rich detail lives in the dedicated
  // Accessibility card above Pack List (Franz 2026-06-07 revision).
  if (def.key === 'has_disabled_access') {
    const hasJsonb = _accessibilityHasContent(amenities?.accessibility_features);
    const finalTip = hasJsonb ? `${def.label} — see Accessibility card below` : tip;
    return `<button class="amenity${ruleClass}" ${attrs} data-tip="${escHtml(finalTip)}">
      <span class="amenity-icon">${def.icon}</span>
      <span class="amenity-label">${def.label}</span>
    </button>`;
  }
  // Lifeguards always render with the "Seasonal" sublabel — staffing is
  // seasonal at almost every US beach, never year-round (see
  // [[lifeguards-seasonal-not-on-duty]]).
  if (def.key === 'has_lifeguards') {
    const lgAttrs = _amenityButtonAttrs(def, rule, { sub: 'Seasonal' });
    return `<button class="amenity${ruleClass}" ${lgAttrs} data-tip="${escHtml(tip + ' · seasonal, typically Memorial Day–Labor Day')}">
      <span class="amenity-icon">${def.icon}</span>
      <span class="amenity-text">
        <span class="amenity-label">${def.label}</span>
        <span class="amenity-sub">Seasonal</span>
      </span>
    </button>`;
  }
  return `<button class="amenity${ruleClass}" ${attrs} data-tip="${escHtml(tip)}">
    <span class="amenity-icon">${def.icon}</span>
    <span class="amenity-label">${def.label}</span>
  </button>`;
}

// Map zone-rules section names to amenity keys when they refer to the
// same physical thing. Used for dedup when merging the two lists.
const _SECTION_TO_AMENITY = {
  parking_lot:       'has_parking',
  restrooms:         'has_restrooms',
  restrooms_showers: 'has_restrooms',
  showers:           'has_showers',
  picnic_area:       'has_picnic_area',
};
// Zone-rules sections that aren't represented in AMENITY_DEFS. Each
// gets its own tile, sourced from zone_rules with the dog-policy rule
// as the background color.
const _SECTION_TILE = {
  sand:           { icon: '🏖️', label: 'Sand' },
  trails:         { icon: '🥾', label: 'Trails' },
  // Water — canonical key is `water` (matches SECTION_NOUN above).
  // `water_swim` and `swimming_beach` are zone_rules synonyms that
  // 20260611i_canonicalize_water_sections.sql collapses to `water`.
  // Aliases retained here as belt-and-suspenders for any rows that
  // miss the canonicalization sweep.
  water:           { icon: '🌊', label: 'Water' },
  water_swim:      { icon: '🌊', label: 'Water' },
  swimming_beach:  { icon: '🌊', label: 'Water' },
  dunes:          { icon: '🏜️', label: 'Dunes' },
  bluff:          { icon: '🏔️', label: 'Bluff' },
  boardwalk:      { icon: '🚶', label: 'Boardwalk' },
  campground:     { icon: '🏕️', label: 'Campground' },
  playground:     { icon: '🤸', label: 'Playground' },
  tide_pools:     { icon: '🐚', label: 'Tide pools' },
  nesting_zones:  { icon: '🪺', label: 'Nesting zones' },
};

// ─── Section ↔ today's-hazard signal mapping ────────────────────────
// Water hazards: any of these advisory event_types active today fires
// the Water-tile overlay (worst-severity wins). Mirrors the 8 BHS-
// extracted categories landed in 20260611e + the marine threshold
// advisories from 20260606l + the rip merge from 20260611e.
const _WATER_HAZARD_EVENT_TYPES = new Set([
  'rip_current_risk', 'sneaker_wave_risk', 'high_surf_risk',
  'longshore_current_risk', 'cold_water_shock_risk', 'shore_break_risk',
  'pier_hazard_risk', 'bacteria_risk', 'too_cold_swim', 'swim_advisory',
  'powerful_surf', 'strong_drift',
]);
// Hazards that also reach the sand edge (sneaker waves / shore break
// wash people off rocks + sand). Demoted one tier on the Sand tile
// (severe→moderate, moderate→none) since most of the dry sand is safe.
const _SAND_EDGE_EVENT_TYPES = new Set([
  'sneaker_wave_risk', 'shore_break_risk',
]);
// Sand temperature thresholds (°F).
const _SAND_TEMP_SEVERE = 125;
const _SAND_TEMP_MODERATE = 115;
// Wind sandblast thresholds (mph).
const _WIND_SANDBLAST_SEVERE = 25;
const _WIND_SANDBLAST_MODERATE = 19;
// Severity rank — used for max-wins logic across signals.
const _HAZ_RANK = { severe: 2, moderate: 1 };
const _RANK_TO_SEV = { 2: 'severe', 1: 'moderate' };

// Per-section hazard signal aggregator. Returns:
//   { severity:'severe'|'moderate'|null, summary:string, impactText:string }
// summary  — short chip text for tooltip (e.g. "rip current High")
// impactText — the rich dog_impact_text from the most-severe advisory,
//   OR a synthesized one for sand_temp / wind. This is the primary body
//   string used in the click-detail panel.
function _sectionHazardSignal(sectionName, advisories, hoursToday) {
  const advs = Array.isArray(advisories) ? advisories : [];
  const hours = Array.isArray(hoursToday) ? hoursToday : [];
  let rank = 0;
  let bestImpactText = '';
  const parts = [];

  if (sectionName === 'water') {
    for (const a of advs) {
      if (!_WATER_HAZARD_EVENT_TYPES.has(a.event_type)) continue;
      const r = _HAZ_RANK[a.severity] || 0;
      if (r === 0) continue;
      if (r > rank || (r === rank && !bestImpactText && a.dog_impact_text)) {
        rank = r;
        bestImpactText = a.dog_impact_text || bestImpactText;
      }
      const lbl = a.label || a.event_type.replace(/_risk$/, '').replace(/_/g, ' ');
      const val = a.value ? ` ${a.value}` : '';
      parts.push(`${lbl}${val}`);
    }
  } else if (sectionName === 'sand') {
    let maxSand = -Infinity;
    let maxWind = -Infinity;
    for (const h of hours) {
      if (h?.sand_temp != null && h.sand_temp > maxSand) maxSand = h.sand_temp;
      if (h?.wind_speed != null && h.wind_speed > maxWind) maxWind = h.wind_speed;
    }
    const sandPhrases = [];
    if (maxSand >= _SAND_TEMP_SEVERE) {
      rank = Math.max(rank, 2);
      parts.push(`sand peak ${Math.round(maxSand)}°F`);
      sandPhrases.push(`Dangerous sand temp ${Math.round(maxSand)}°F — risk of paw burns. Keep her off dry sand at midday or use booties.`);
    } else if (maxSand >= _SAND_TEMP_MODERATE) {
      rank = Math.max(rank, 1);
      parts.push(`sand peak ${Math.round(maxSand)}°F`);
      sandPhrases.push(`Hot sand peaks at ${Math.round(maxSand)}°F today — paw discomfort likely. Walk her early or late.`);
    }
    if (maxWind >= _WIND_SANDBLAST_SEVERE) {
      rank = Math.max(rank, 2);
      parts.push(`gusty wind ${Math.round(maxWind)}mph`);
      sandPhrases.push(`Gusty winds to ${Math.round(maxWind)}mph today — blowing sand can irritate her eyes and ears.`);
    } else if (maxWind >= _WIND_SANDBLAST_MODERATE) {
      rank = Math.max(rank, 1);
      parts.push(`breezy ${Math.round(maxWind)}mph`);
      sandPhrases.push(`Breezy at ${Math.round(maxWind)}mph today — some sand blowing on the beach.`);
    }
    // sand-edge hazards demoted one tier
    for (const a of advs) {
      if (!_SAND_EDGE_EVENT_TYPES.has(a.event_type)) continue;
      const r = _HAZ_RANK[a.severity] || 0;
      if (r >= 2) {
        rank = Math.max(rank, 1);
        const lbl = a.label || a.event_type.replace(/_risk$/, '').replace(/_/g, ' ');
        parts.push(`${lbl} reaches sand`);
        if (a.dog_impact_text) sandPhrases.push(a.dog_impact_text);
      }
    }
    bestImpactText = sandPhrases.join(' ');
  }

  if (rank === 0) return { severity: null, summary: '', impactText: '' };
  const seen = new Set();
  const unique = parts.filter(p => { if (seen.has(p)) return false; seen.add(p); return true; });
  return {
    severity:   _RANK_TO_SEV[rank],
    summary:    unique.join(' · '),
    impactText: bestImpactText,
  };
}

// Module-level stash for re-rendering when async advisories arrive.
// Set in the main render path; updated in loadWaterConditionAdvisories.
let _advisoriesForOverlay = [];
let _hoursForOverlay = [];
// Stash beach.area_m2 (single number per page load) so the click-detail
// body for the synthetic area tile can format m² with full precision.
let _currentBeachAreaM2 = null;

// Walk all rendered amenity buttons with data-section + apply overlay
// classes, corner badges, and extended tooltips. Re-entrant — safe to
// call multiple times as data arrives.
function _applyAmenityHazardOverlays() {
  document.querySelectorAll('.amenity[data-section]').forEach(el => {
    const sec = el.getAttribute('data-section');
    if (!sec) return;
    const sig = _sectionHazardSignal(sec, _advisoriesForOverlay, _hoursForOverlay);
    el.classList.remove('haz-severe', 'haz-moderate');
    const oldBadge = el.querySelector('.haz-badge');
    if (oldBadge) oldBadge.remove();
    delete el.dataset.hazSummary;
    delete el.dataset.hazImpact;
    if (!sig.severity) return;
    el.classList.add(`haz-${sig.severity}`);
    const badge = document.createElement('span');
    badge.className = 'haz-badge';
    badge.setAttribute('aria-label', `today's hazard: ${sig.severity}`);
    badge.textContent = '⚠';
    el.appendChild(badge);
    el.dataset.hazSummary = sig.summary;
    el.dataset.hazImpact  = sig.impactText || '';
  });
}

// Walk zone_rules and return a map of {sectionName -> mostRestrictiveRule}.
// "Most restrictive" priority: not_allowed > on_leash > off_leash > unknown.
// Multi-region beaches collapse to one rule per section using this priority.
//
// Extended rule values (off_leash_voice_control, on_leash_or_voice) collapse
// to their visual class before ranking. Per Franz 2026-05-21.
function _ruleMapFromZoneRules(zr) {
  const RANK = { not_allowed: 3, on_leash: 2, off_leash: 1, unknown: 0 };
  const COERCE = {
    off_leash_voice_control: 'off_leash',
    on_leash_or_voice:       'on_leash',
  };
  const out = {};
  const seasons = (Array.isArray(zr?.seasons) && zr.seasons.length)
    ? zr.seasons
    : (Array.isArray(zr?.regions) ? [{ regions: zr.regions }] : []);
  for (const s of seasons) {
    const regs = Array.isArray(s.regions) ? s.regions : [];
    for (const r of regs) {
      const secs = r?.sections || {};
      for (const [name, sec] of Object.entries(secs)) {
        const raw = sec?.rule || 'unknown';
        const rule = COERCE[raw] || raw;
        if (!out[name] || (RANK[rule] ?? 0) > (RANK[out[name]] ?? 0)) {
          out[name] = rule;
        }
      }
    }
  }
  return out;
}

// Get the list of regions from zone_rules. Returns [] if none.
function _zrRegions(zr) {
  if (!zr) return [];
  const seasons = (Array.isArray(zr.seasons) && zr.seasons.length)
    ? zr.seasons
    : (Array.isArray(zr.regions) ? [{ regions: zr.regions }] : []);
  const out = [];
  for (const s of seasons) {
    const regs = Array.isArray(s.regions) ? s.regions : [];
    for (const r of regs) out.push(r);
  }
  return out;
}

// Filter the visible AMENITY_DEFS list (the has_X=true / parking-data
// tiles) into one flat array.
function _visibleAmenityTiles(amenities) {
  if (!amenities) return [];
  return AMENITY_DEFS.map((d, i) => ({ ...d, _i: i })).filter(d => {
    if (amenities[d.key] === true) return true;
    if (d.key === 'has_parking') {
      return (Array.isArray(amenities.parking_options) && amenities.parking_options.length > 0)
          || (amenities.parking_fee != null) || amenities.parking_subtype
          || amenities.parking_type || amenities.parking_notes;
    }
    // Phase 4 of [[dwell-ada-crowd-autocurate]]: surface the Accessibility
    // tile when JSONB has any known feature, even if the legacy boolean is
    // null/false. Lets new evidence (LLM-extracted, CCC-derived) reach the
    // consumer surface without requiring the cascade to also set the boolean.
    if (d.key === 'has_disabled_access' && _accessibilityHasContent(amenities.accessibility_features)) {
      return true;
    }
    return false;
  });
}

// Render a tile array. Sort: sand always first, water always second
// (Franz 2026-06-11 — these are the load-bearing "what is this beach"
// signals and belong at the top regardless of dog rule). After that:
// most-favorable-to-dogs first (off_leash → on_leash → unknown/no-rule
// → not_allowed), parking first within the same favorability bucket,
// then label length.
const _DOG_FAVOR = { off_leash: 0, on_leash: 1, unknown: 2, not_allowed: 3 };
const _PINNED_SECTION_ORDER = { sand: 0, water: 1 };  // sand first, water second
function _renderTileSet(tiles, amenities, ruleFor) {
  const decorated = tiles.map(d => ({
    d,
    rule: ruleFor ? ruleFor(d) : null,
    favor: _DOG_FAVOR[(ruleFor ? ruleFor(d) : null) ?? 'unknown'] ?? 2,
    pin:   _PINNED_SECTION_ORDER[d.sectionName] ?? 99,
  }));
  decorated.sort((a, b) => {
    if (a.pin !== b.pin) return a.pin - b.pin;
    if (a.favor !== b.favor) return a.favor - b.favor;
    if (a.d.key === 'has_parking') return -1;
    if (b.d.key === 'has_parking') return 1;
    const la = a.d.label.length, lb = b.d.label.length;
    return la === lb ? a.d._i - b.d._i : la - lb;
  });
  return decorated.map(x => _renderAmenityTileWithRule(x.d, amenities, x.rule)).join('');
}

// Per-section per-time-window tiles. One tile per unique time bucket,
// rendered in the same .amenity-grid as other amenity tiles (Franz
// 2026-05-20). Includes anchor-based windows (sunrise/sunset) that the
// old pills helper dropped.
const _TW_RULE_COERCE = {
  off_leash_voice_control: 'off_leash',
  on_leash_or_voice:       'on_leash',
};
// Anchor → minutes-after-midnight using _sunTimes for today at this beach
// (Franz 2026-05-20). Replaces literal "sunrise"/"sunset" labels with
// actual local times so the tile reads "5pm-8pm" not "5pm-sunset".
function _anchorToMin(anchor, sun) {
  if (!sun) return null;
  if (anchor === 'dawn'  ) return sun.dawnMin    ?? sun.sunriseMin;
  if (anchor === 'dusk'  ) return sun.duskMin    ?? sun.sunsetMin;
  if (anchor === 'sunrise') return sun.sunriseMin;
  if (anchor === 'sunset' ) return sun.sunsetMin;
  return null;
}

function _formatWindowRange(tw, sun) {
  const minToFmt = (min) => {
    if (min == null || !Number.isFinite(min)) return '?';
    const r = (((min / 60) % 24) + 24) % 24;
    const h = Math.floor(r);
    const hh = h === 0 ? 12 : h > 12 ? h - 12 : h;
    return `${hh}${h >= 12 ? 'pm' : 'am'}`;
  };
  const fmt = (t, anchor) => {
    if (t) {
      const [h, m] = String(t).split(':').map(Number);
      return minToFmt((h || 0) * 60 + (m || 0));
    }
    const anchorMin = _anchorToMin(anchor, sun);
    if (anchorMin != null) return minToFmt(anchorMin);
    // No sun data — fall back to symbolic label.
    if (anchor === 'dawn' || anchor === 'sunrise') return 'sunrise';
    if (anchor === 'dusk' || anchor === 'sunset' ) return 'sunset';
    return '?';
  };
  return `${fmt(tw.start, tw.season_anchor_start)}-${fmt(tw.end, tw.season_anchor_end)}`;
}

function _renderTimeBucketTile(sectionName, tw, sectionRuleFallback, sun) {
  const sectionLabel = (window.ZoneRulesBlock?.SECTION_LABEL || {})[sectionName] || sectionName;
  const parts = sectionLabel.split(' ');
  const icon = parts[0];
  const label = parts.slice(1).join(' ') || sectionName;
  const rawRule = tw.rule || sectionRuleFallback || 'unknown';
  const coerced = _TW_RULE_COERCE[rawRule] || rawRule;
  const rule = (coerced === 'off_leash' || coerced === 'on_leash' || coerced === 'not_allowed')
    ? coerced : 'unknown';
  const range = _formatWindowRange(tw, sun);
  const ruleLabel = ({off_leash:'Off-leash', on_leash:'On-leash', not_allowed:'Not allowed'})[rule] || rule;
  const tip = `${label} · ${ruleLabel} · ${range}`;
  return `<div class="amenity rule-${rule}" data-tip="${escHtml(tip)}">
            <span class="amenity-icon">${icon}</span>
            <span class="amenity-text">
              <span class="amenity-label">${escHtml(label)}</span>
              <span class="amenity-sub">${escHtml(range)}</span>
            </span>
          </div>`;
}

// For a region: convert all time_windows to (startMin, endMin, rule)
// using sun-time substitution, then merge overlapping intervals per
// (section, rule). One tile per merged bucket. Avila example collapses
// 8 raw windows to 3 buckets (dawn-10am, 10am-5pm, 5pm-dusk).
// Franz 2026-05-20.
function _regionTimeBucketTiles(reg, beach) {
  const sun = beach
    ? _sunTimes(beach.lat, beach.lng, new Date(), beach.timezone)
    : null;
  // Anchor → minutes via existing sun helper; missing data returns null.
  const anchorMin = (a) => _anchorToMin(a, sun);
  const tToMin = (t) => {
    if (!t) return null;
    const [h, m] = String(t).split(':').map(Number);
    return (h || 0) * 60 + (m || 0);
  };

  // Build per-minute effective rule per section. Two key semantics
  // (Franz 2026-05-21 supersedes_baseline fix):
  //   1. WINDOWS OVERRIDE BASE: a time_window is a carve-out from the
  //      section's default rule. At any minute covered by a window, the
  //      window WINS regardless of restrictiveness. Base rule applies
  //      only to minutes with NO window.
  //   2. MULTIPLE WINDOWS AT SAME MINUTE: most-restrictive among the
  //      windows wins (binding restrictions take precedence).
  //   3. SEASONAL FILTERING: windows with season constraints (anchors
  //      like labor_day_after, or eff_from/eff_to MM-DD bounds) are
  //      skipped if today is not in season.
  const RANK = { not_allowed: 3, on_leash: 2, off_leash: 1, unknown: 0 };
  // Compute named-anchor dates for today's year. Returns MM-DD strings.
  const today = new Date();
  const _firstMondayOfSep = (y) => {
    const d = new Date(y, 8, 1);
    return new Date(y, 8, 1 + ((1 - d.getDay() + 7) % 7));
  };
  const _lastMondayOfMay = (y) => {
    const d = new Date(y, 4, 31);
    return new Date(y, 4, 31 - ((d.getDay() - 1 + 7) % 7));
  };
  const _mdStr = (d) => `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const todayMd = _mdStr(today);
  const y = today.getFullYear();
  const ANCHOR_MD = {
    labor_day:        _mdStr(_firstMondayOfSep(y)),
    labor_day_after:  _mdStr(new Date(y, 8, _firstMondayOfSep(y).getDate() + 1)),
    memorial_day:     _mdStr(_lastMondayOfMay(y)),
    memorial_day_after: _mdStr(new Date(y, 4, _lastMondayOfMay(y).getDate() + 1)),
  };
  const _resolveSeasonMd = (val) => {
    if (!val) return null;
    const s = String(val).toLowerCase();
    if (s.match(/^\d{2}-\d{2}$/)) return s;
    return ANCHOR_MD[s] || null;
  };
  // Is `md` in the inclusive range [startMd, endMd]? Wraps around year-end.
  const _inSeason = (md, startMd, endMd) => {
    if (!startMd && !endMd) return true;
    if (!startMd) return md <= endMd;
    if (!endMd)   return md >= startMd;
    if (startMd <= endMd) return md >= startMd && md <= endMd;
    return md >= startMd || md <= endMd;  // wraps year-end (e.g. Sep→Jun)
  };

  // Amenity-class sections (parking, restrooms, walkway, etc.) render
  // as amenity tiles colored by rule — the time-bucket chip is redundant
  // since their rule doesn't change by hour. Skip them here. Franz 2026-05-21.
  const AMENITY_SECTIONS_FOR_CHIPS = new Set([
    'parking_lot','walkway','restrooms','showers','restrooms_showers',
    'picnic_area','fire_pits','playground','campground'
  ]);
  // Operating hours (open/close) for clipping chip ranges. If beach has
  // the placeholder default (05:00–22:00) OR no hours set, fall back
  // to today's sunrise/sunset.
  const _toMin = (t) => {
    if (!t) return null;
    const [h, m] = String(t).slice(0,5).split(':').map(Number);
    return (h || 0) * 60 + (m || 0);
  };
  let openMin = _toMin(beach?.open_time);
  let closeMin = _toMin(beach?.close_time);
  const isPlaceholder = (openMin === 5*60 && closeMin === 22*60);
  // Sunrise/sunset fallback for beaches with no explicit hours.
  // Round to nearest hour for a clean display (Franz 2026-05-21).
  const _roundHour = (min) => Math.round(min / 60) * 60;
  if ((openMin == null || closeMin == null || isPlaceholder) && sun) {
    if (sun.sunriseMin != null) openMin = _roundHour(sun.sunriseMin);
    if (sun.sunsetMin  != null) closeMin = _roundHour(sun.sunsetMin);
  }

  const merged = [];
  // 'global' is a meta-section in the DEFAULT (unnamed) region, but in
  // a NAMED region it IS the area's rule (e.g. Habitat Restoration Area
  // with global=not_allowed). Render it in named regions, skip in default.
  const isDefaultRegion = (reg?.name == null);
  for (const [sn, sd] of Object.entries(reg?.sections || {})) {
    if (sn === 'global' && isDefaultRegion) continue;
    // Skip amenity-class sections — rule is constant, amenity tile renders it.
    if (AMENITY_SECTIONS_FOR_CHIPS.has(sn)) continue;
    const baseRawRule = sd.rule || 'unknown';
    const baseCoerced = _TW_RULE_COERCE[baseRawRule] || baseRawRule;
    const baseCls = (baseCoerced === 'off_leash' || baseCoerced === 'on_leash' || baseCoerced === 'not_allowed')
      ? baseCoerced : (baseCoerced === 'unknown' ? null : null);

    const tws = sd?.time_windows || [];
    // Filter windows by season (today-in-season check).
    const activeTws = tws.filter(tw => {
      const startMd = _resolveSeasonMd(tw.effective_from_md) || _resolveSeasonMd(tw.season_anchor_start);
      const endMd   = _resolveSeasonMd(tw.effective_to_md)   || _resolveSeasonMd(tw.season_anchor_end);
      // If anchors look like time-of-day (dawn/dusk) rather than season,
      // they don't constrain season — keep the window.
      const isTimeAnchor = (a) => a === 'dawn' || a === 'dusk' || a === 'sunrise' || a === 'sunset';
      const startEff = isTimeAnchor(tw.season_anchor_start) ? null : startMd;
      const endEff   = isTimeAnchor(tw.season_anchor_end)   ? null : endMd;
      return _inSeason(todayMd, startEff, endEff);
    });

    if (!activeTws.length && !baseCls) continue;
    const intervals = [];
    for (const tw of activeTws) {
      const rawRule = tw.rule || sd.rule || 'unknown';
      const coerced = _TW_RULE_COERCE[rawRule] || rawRule;
      const cls = (coerced === 'off_leash' || coerced === 'on_leash' || coerced === 'not_allowed')
        ? coerced : 'unknown';
      // Daily-time bounds for this minute-window (ignore season anchors here).
      const isTimeAnchor = (a) => a === 'dawn' || a === 'dusk' || a === 'sunrise' || a === 'sunset';
      let sMin = tToMin(tw.start);
      let eMin = tToMin(tw.end);
      if (sMin == null && isTimeAnchor(tw.season_anchor_start)) sMin = anchorMin(tw.season_anchor_start);
      if (eMin == null && isTimeAnchor(tw.season_anchor_end))   eMin = anchorMin(tw.season_anchor_end);
      if (eMin === 23 * 60 + 59) eMin = 24 * 60;
      // For seasonal-only windows (no daily time), the window covers
      // the whole day during its season.
      if (sMin == null && eMin == null) {
        sMin = 0; eMin = 24 * 60;
      } else {
        if (sMin == null) sMin = 0;
        if (eMin == null) eMin = 24 * 60;
      }
      if (sMin > eMin) {
        intervals.push({ sMin, eMin: 24 * 60, cls });
        intervals.push({ sMin: 0,   eMin,        cls });
      } else {
        intervals.push({ sMin, eMin, cls });
      }
    }
    // Build window minutes; track whether ANY window rule differs
    // from the section's base rule. Franz 2026-05-21:
    //   - No variation (all windows match base, or no windows at all):
    //     skip chip rendering — bare tile carries the constant rule.
    //   - Variation present: chips cover the full day (variations
    //     where windows apply, base-rule fill for the rest), so the
    //     user sees both the carve-outs AND the surrounding default.
    const winMinutes = new Array(24 * 60).fill(null);
    let hasVariation = false;
    for (const iv of intervals) {
      if (iv.cls !== baseCls) hasVariation = true;
      for (let m = Math.max(0, iv.sMin); m < Math.min(24 * 60, iv.eMin); m++) {
        const cur = winMinutes[m];
        if (cur == null || (RANK[iv.cls] ?? 0) > (RANK[cur] ?? 0)) {
          winMinutes[m] = iv.cls;
        }
      }
    }
    if (!hasVariation) continue;  // bare tile handles constant-rule sections
    const minutes = winMinutes.map(c => c != null ? c : baseCls);
    // RLE.
    let runStart = null, runCls = null;
    for (let m = 0; m < 24 * 60; m++) {
      const c = minutes[m];
      if (c === runCls) continue;
      if (runCls != null) merged.push({ section: sn, cls: runCls, sMin: runStart, eMin: m });
      runStart = m;
      runCls = c;
    }
    if (runCls != null) merged.push({ section: sn, cls: runCls, sMin: runStart, eMin: 24 * 60 });
  }
  // Sort tiles: earliest start first; off-leash before not_allowed on tie.
  const FAVOR = { off_leash: 0, on_leash: 1, unknown: 2, not_allowed: 3 };
  merged.sort((a, b) => {
    if (a.sMin !== b.sMin) return a.sMin - b.sMin;
    return (FAVOR[a.cls] ?? 9) - (FAVOR[b.cls] ?? 9);
  });

  // Format a merged interval. If endpoints coincide with dawn/dusk, use
  // those labels (e.g. "sunrise-10am" instead of "12am-10am") since the
  // operator's intent was daylight-only.
  const minToFmt = (min) => {
    if (min == null) return '?';
    const r = (((min / 60) % 24) + 24) % 24;
    const h = Math.floor(r);
    const hh = h === 0 ? 12 : h > 12 ? h - 12 : h;
    return `${hh}${h >= 12 ? 'pm' : 'am'}`;
  };
  const fmtEdge = (min, isStart) => {
    // Substitute sentinel endpoints (0 / 1440) with dawn/dusk when
    // sun data available — captures the operator's "open hours" intent.
    if (sun) {
      if (isStart && min === 0 && sun.sunriseMin != null) min = sun.sunriseMin;
      if (!isStart && min === 24*60 && sun.sunsetMin != null) min = sun.sunsetMin;
    }
    return minToFmt(min);
  };

  // Sort: sand first, water second, everything else in stable order.
  // This keeps the water/sand hour chips pinned at the top of the grid
  // alongside their full-width row treatment.
  const _SEC_PIN = { sand: 0, water: 1 };
  const sortedMerged = [...merged].sort((a, b) =>
    (_SEC_PIN[a.section] ?? 99) - (_SEC_PIN[b.section] ?? 99)
  );
  return sortedMerged.map(it => {
    // Display range:
    //   1. Sentinel endpoints (0 / 1440) substitute to operating hours
    //      (openMin/closeMin), which already fall back to sunrise/sunset
    //      when hours are at the placeholder default.
    //   2. Non-sentinel endpoints still get clipped to operating hours
    //      so windows extending beyond can't render out-of-hours.
    //   3. Skip if remaining range < 30 min (degenerate).
    let dispStart = (it.sMin === 0)     ? (openMin  ?? 0)
                                        : Math.max(it.sMin, openMin  ?? 0);
    let dispEnd   = (it.eMin === 24*60) ? (closeMin ?? 24*60)
                                        : Math.min(it.eMin, closeMin ?? 24*60);
    if (dispEnd - dispStart < 30) return '';
    const range = `${minToFmt(dispStart)}-${minToFmt(dispEnd)}`;
    const sectionLabel = (window.ZoneRulesBlock?.SECTION_LABEL || {})[it.section] || it.section;
    const parts = sectionLabel.split(' ');
    const icon = parts[0];
    const label = parts.slice(1).join(' ') || it.section;
    const ruleLabel = ({off_leash:'Off-leash', on_leash:'On-leash', not_allowed:'Not allowed'})[it.cls] || it.cls;
    const tip = `${label} · ${ruleLabel} · ${range}`;
    // Sand + Water hour chips claim a full grid row (vertical stack).
    const fw = (it.section === 'sand' || it.section === 'water')
      ? ' amenity-fullwidth' : '';
    return `<div class="amenity rule-${it.cls}${fw}" data-tip="${escHtml(tip)}">
              <span class="amenity-icon">${icon}</span>
              <span class="amenity-text">
                <span class="amenity-label">${escHtml(label)}</span>
                <span class="amenity-sub">${escHtml(range)}</span>
              </span>
            </div>`;
  }).join('');
}

// (legacy pill helper kept as no-op shim — callers updated to use the
// tile path above. Remove once detail.html is updated.)
function _amenityTimePillsHtml(reg) {
  const RULE_COERCE = _TW_RULE_COERCE;
  const FAVOR = { off_leash: 0, on_leash: 1, unknown: 2, not_allowed: 3 };
  const secs = reg?.sections || {};
  const wins = new Map();
  for (const sec of Object.values(secs)) {
    for (const tw of (sec?.time_windows || [])) {
      if (!tw.start || !tw.end) continue;
      const key = `${tw.start}|${tw.end}`;
      if (!wins.has(key)) wins.set(key, { start: tw.start, end: tw.end, counts: {} });
      const w = wins.get(key);
      const raw = tw.rule || sec?.rule || 'unknown';
      const coerced = RULE_COERCE[raw] || raw;
      const cls = (coerced === 'off_leash' || coerced === 'on_leash' || coerced === 'not_allowed')
        ? coerced : 'unknown';
      w.counts[cls] = (w.counts[cls] || 0) + 1;
    }
  }
  // No time windows — no pill row (section tiles carry the constant rule).
  // The "All day" fallback was dropped 2026-05-20 because multi-section
  // regions like Kayak Point (sand=on_leash, water=not_allowed, …) can't
  // be honestly summarized by one pill.
  if (wins.size === 0) return '';
  const toMin = s => { const [h, m] = String(s).split(':').map(Number); return (h||0)*60 + (m||0); };
  const roundHour = s => {
    const [h, m] = String(s).split(':').map(Number);
    const r = ((h || 0) + Math.round((m || 0) / 60)) % 24;
    const hh = r === 0 ? 12 : r > 12 ? r - 12 : r;
    return `${hh}${r >= 12 ? 'pm' : 'am'}`;
  };
  const arr = Array.from(wins.values()).sort((a, b) => toMin(a.start) - toMin(b.start));
  const pills = arr.map(w => {
    const dominant = Object.keys(w.counts).sort((a, b) => (FAVOR[a]??9) - (FAVOR[b]??9))[0] || 'unknown';
    const range = `${roundHour(w.start)}-${roundHour(w.end)}`;
    return `<span class="amenity-time-pill rule-${dominant}">
              <span class="amenity-time-icon">🏖️</span>
              <span>${escHtml(range)}</span>
            </span>`;
  }).join('');
  return `<div class="amenity-time-row">${pills}</div>`;
}

// Collapse named regions that describe THIS beach (region name contains
// the beach's display name, case-insensitive) into the unnamed default
// (Franz 2026-05-20). Substring match catches Rosie's variants like
// "Rosie's Dog Beach Dog Zone" / "Rosie's Dog Beach off-leash zone" /
// "Rosie's Dog Beach — between Granada Avenue and Roycroft Avenue".
// Sub-features like "Bluebird Park" on Fisherman's Cove don't contain
// the beach name and stay as separate regions.
function _collapseSelfNamedRegions(regions, beachName) {
  if (!beachName || !Array.isArray(regions) || regions.length < 2) return regions;
  const nameLower = String(beachName).toLowerCase().trim();
  if (nameLower.length < 4) return regions;  // too short — would false-positive
  const out = [];
  let defaultReg = null;
  for (const r of regions) {
    if (!r) continue;
    if (r.name == null) {
      defaultReg = { ...r, sections: { ...(r.sections || {}) } };
      out.push(defaultReg);
    } else if (r.name.toLowerCase().includes(nameLower)) {
      // Merge this region's sections (and time_windows) into default.
      // Concat time_windows so the merged region carries the union;
      // _regionTimeBucketTiles will then dedupe + merge intervals.
      if (!defaultReg) {
        defaultReg = { name: null, sections: { ...(r.sections || {}) } };
        out.push(defaultReg);
      } else {
        for (const [sn, sd] of Object.entries(r.sections || {})) {
          if (!defaultReg.sections[sn]) {
            defaultReg.sections[sn] = sd;
          } else {
            const existing = defaultReg.sections[sn];
            const mergedTws = [
              ...(existing.time_windows || []),
              ...(sd.time_windows || []),
            ];
            defaultReg.sections[sn] = {
              ...existing,
              time_windows: mergedTws.length ? mergedTws : undefined,
            };
          }
        }
      }
    } else {
      out.push(r);
    }
  }
  return out;
}

function buildAmenitiesSection(amenities, dogPolicy, beach) {
  if (!amenities && !dogPolicy?.zone_rules) return '';

  // Codifier gap (Franz 2026-06-11): 68% of ocean beaches (1,940 of
  // 2,849) have a `sand` section but no `water` section in zone_rules.
  // Source ordinances mostly treat the whole beach as one zone, so the
  // codifier extracted sand but never wrote a separate water rule.
  // Intent for those beaches is "water inherits the sand rule." Synthesize
  // a water section mirroring sand when water is absent. Render path then
  // picks it up via the normal _SECTION_TILE iteration so the 🌊 Water
  // tile + hazard overlay both work. No data mutation.
  const _synthesizeWaterFromSand = (zr) => {
    if (!zr || (!zr.regions && !zr.seasons)) return zr;
    const clone = JSON.parse(JSON.stringify(zr));
    const visitRegions = (regs) => {
      for (const reg of (regs || [])) {
        const secs = reg?.sections;
        if (secs && secs.sand && !secs.water) {
          secs.water = JSON.parse(JSON.stringify(secs.sand));
        }
      }
    };
    if (Array.isArray(clone.seasons)) {
      for (const s of clone.seasons) visitRegions(s.regions);
    } else if (Array.isArray(clone.regions)) {
      visitRegions(clone.regions);
    }
    return clone;
  };
  const effectiveZoneRules = _synthesizeWaterFromSand(dogPolicy?.zone_rules);

  let regions = _zrRegions(effectiveZoneRules);
  regions = _collapseSelfNamedRegions(regions, beach?.display_name || beach?.name);

  // Build the all-zones amenity tiles (has_X=true items not tied to
  // a specific zone) — lifeguards, drinking_water, fire_pits, food,
  // ADA. Zone-tied amenities (parking, restrooms, showers, picnic_area)
  // appear under their zones; pull them out here.
  const zoneTiedKeys = new Set(Object.values(_SECTION_TO_AMENITY));
  const allAmenityTiles = _visibleAmenityTiles(amenities);
  // Synthetic area tile from beach.area_m2 (mirrors dog-park.html:1281).
  // Only renders when populated — ~53% of beaches today via the OSM
  // polygon backfill. _i: -1 sorts it ahead of rule-tied amenities so
  // it sits near Sand + Water (the pinned section tiles) visually.
  if (beach?.area_m2 > 0) {
    _currentBeachAreaM2 = beach.area_m2;
    allAmenityTiles.push({
      key:   'area',
      icon:  '📐',
      label: `${_formatAcres(beach.area_m2)} acres`,
      _i:    -1,
    });
  } else {
    _currentBeachAreaM2 = null;
  }
  const sharedAmenityTiles = allAmenityTiles.filter(t => !zoneTiedKeys.has(t.key));
  const zoneTiedAmenityTiles = allAmenityTiles.filter(t => zoneTiedKeys.has(t.key));

  // SINGLE-ZONE (or no zone_rules) — collapse to one grid.
  if (regions.length <= 1) {
    const ruleMap = _ruleMapFromZoneRules(effectiveZoneRules || {});
    // Render bare tile when section has NO time variation (or no
    // windows). When there's variation, chips cover the full day
    // including base-rule portions — bare tile would be redundant.
    // Franz 2026-05-21.
    const sectionHasVariation = {};
    for (const reg of regions) {
      for (const [sn, sd] of Object.entries(reg?.sections || {})) {
        const baseR = sd?.rule;
        const baseCoercedX = _TW_RULE_COERCE[baseR] || baseR;
        for (const tw of (sd?.time_windows || [])) {
          const twR = tw.rule || baseR;
          const twCoerced = _TW_RULE_COERCE[twR] || twR;
          if (twCoerced !== baseCoercedX) { sectionHasVariation[sn] = true; break; }
        }
      }
    }
    const sectionTiles = [];
    for (const [secName, rule] of Object.entries(ruleMap)) {
      if (_SECTION_TO_AMENITY[secName]) continue;
      const tile = _SECTION_TILE[secName];
      if (!tile) continue;
      if (sectionHasVariation[secName]) continue;  // chips cover this
      sectionTiles.push({
        key: `section:${secName}`, icon: tile.icon, label: tile.label,
        sectionName: secName,
        _i: 100 + Object.keys(_SECTION_TILE).indexOf(secName),
      });
    }
    const all = [...allAmenityTiles, ...sectionTiles];
    if (!all.length) return '';
    const ruleFor = d => {
      if (d.sectionName) return ruleMap[d.sectionName];
      const matching = Object.entries(_SECTION_TO_AMENITY)
        .find(([sec, key]) => key === d.key)?.[0];
      return matching ? ruleMap[matching] : null;
    };
    const timeBuckets = regions.length === 1 ? _regionTimeBucketTiles(regions[0], beach) : '';
    if (!all.length && !timeBuckets) return '';
    const cells = _renderTileSet(all, amenities, ruleFor);
    // timeBuckets render FIRST so sand+water time chips (sorted to
    // start of timeBuckets) land at the very top of the grid. Bare
    // amenity cells follow underneath.
    return `<section class="card amenities-card">
      <h2>Amenities</h2>
      <div class="amenity-grid">${timeBuckets}${cells}</div>
      <div class="amenity-detail" id="amenity-detail" hidden></div>
    </section>`;
  }

  // MULTI-ZONE: shared amenities at top, then per-zone groups with
  // header labels. Zone-tied amenities (parking/restrooms/showers/
  // picnic_area) appear under each zone that has the matching section.
  const blocks = [];
  if (sharedAmenityTiles.length) {
    blocks.push(`<div class="amenity-grid">${_renderTileSet(sharedAmenityTiles, amenities, null)}</div>`);
  }
  const _RULE_COERCE = {
    off_leash_voice_control: 'off_leash',
    on_leash_or_voice:       'on_leash',
  };
  for (const reg of regions) {
    const secs = reg?.sections || {};
    const secEntries = Object.entries(secs);
    if (!secEntries.length) continue;
    const ruleHere = name => {
      const raw = secs[name]?.rule || 'unknown';
      return _RULE_COERCE[raw] || raw;
    };
    // Tiles for THIS region only:
    //  - zone-tied amenity tiles where the matching section is in this region
    //  - section-only tiles for everything else in this region
    const tilesForRegion = [];
    for (const t of zoneTiedAmenityTiles) {
      const matchingSection = Object.entries(_SECTION_TO_AMENITY)
        .find(([sec, key]) => key === t.key)?.[0];
      if (matchingSection && secs[matchingSection]) tilesForRegion.push(t);
    }
    // Bare tile only when section has NO time variation TODAY (i.e.
    // among in-season windows). Match the chip path's season filter so
    // chip/tile decisions align — out-of-season windows mustn't cause
    // the tile to be hidden when their rule won't render today.
    const _coerce = (r) => {
      const c = ({off_leash_voice_control:'off_leash', on_leash_or_voice:'on_leash'})[r] || r;
      return ['off_leash','on_leash','not_allowed'].includes(c) ? c : 'unknown';
    };
    const _todayDate = new Date();
    const _todayMd = `${String(_todayDate.getMonth()+1).padStart(2,'0')}-${String(_todayDate.getDate()).padStart(2,'0')}`;
    const _firstMonSep = (y) => { const d=new Date(y,8,1); return new Date(y,8,1+((1-d.getDay()+7)%7)); };
    const _lastMonMay  = (y) => { const d=new Date(y,4,31); return new Date(y,4,31-((d.getDay()-1+7)%7)); };
    const _mdStr = (d) => `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const _yr = _todayDate.getFullYear();
    const _ANCH = {
      labor_day: _mdStr(_firstMonSep(_yr)),
      labor_day_after: _mdStr(new Date(_yr, 8, _firstMonSep(_yr).getDate()+1)),
      memorial_day: _mdStr(_lastMonMay(_yr)),
      memorial_day_after: _mdStr(new Date(_yr, 4, _lastMonMay(_yr).getDate()+1)),
    };
    const _resolveMd = (v) => {
      if (!v) return null;
      const s = String(v).toLowerCase();
      if (s.match(/^\d{2}-\d{2}$/)) return s;
      return _ANCH[s] || null;
    };
    const _inSeason = (md, startMd, endMd) => {
      if (!startMd && !endMd) return true;
      if (!startMd) return md <= endMd;
      if (!endMd)   return md >= startMd;
      if (startMd <= endMd) return md >= startMd && md <= endMd;
      return md >= startMd || md <= endMd;
    };
    const _isTimeAnchor = (a) => a === 'dawn' || a === 'dusk' || a === 'sunrise' || a === 'sunset';
    const _activeToday = (tws) => (tws || []).filter(tw => {
      const sMd = _resolveMd(tw.effective_from_md) || _resolveMd(tw.season_anchor_start);
      const eMd = _resolveMd(tw.effective_to_md)   || _resolveMd(tw.season_anchor_end);
      const sEff = _isTimeAnchor(tw.season_anchor_start) ? null : sMd;
      const eEff = _isTimeAnchor(tw.season_anchor_end)   ? null : eMd;
      return _inSeason(_todayMd, sEff, eEff);
    });

    const isNamedReg = (reg?.name != null);
    for (const [name, sec] of secEntries) {
      if (_SECTION_TO_AMENITY[name]) continue;
      const isGlobalInNamed = (name === 'global' && isNamedReg);
      const t = isGlobalInNamed ? { icon: '⛳', label: 'Area' } : _SECTION_TILE[name];
      if (!t) continue;
      const baseC = _coerce(sec?.rule);
      const activeTws = _activeToday(sec?.time_windows || []);
      const hasVar = activeTws.some(tw => _coerce(tw.rule || sec?.rule) !== baseC);
      if (hasVar) continue;
      tilesForRegion.push({
        key: `section:${name}`, icon: t.icon, label: t.label,
        sectionName: name,
        _i: isGlobalInNamed ? 50 : 100 + Object.keys(_SECTION_TILE).indexOf(name),
      });
    }
    const hasAnyTimeWindow = Object.values(secs).some(s => Array.isArray(s?.time_windows) && s.time_windows.length > 0);
    if (!tilesForRegion.length && !hasAnyTimeWindow) continue;
    const zoneName = reg.name || 'Whole beach';
    const ruleFor = d => {
      if (d.sectionName) return ruleHere(d.sectionName);
      const matching = Object.entries(_SECTION_TO_AMENITY)
        .find(([sec, key]) => key === d.key)?.[0];
      return matching ? ruleHere(matching) : null;
    };
    const tileCells = _renderTileSet(tilesForRegion, amenities, ruleFor);
    const timeBuckets = _regionTimeBucketTiles(reg, beach);
    // timeBuckets first — sand+water chips sort to front + claim full
    // rows, so they land at the top of each zone block.
    const tileGrid = (tileCells || timeBuckets)
      ? `<div class="amenity-grid">${timeBuckets}${tileCells}</div>`
      : '';
    blocks.push(`
      <div class="amenity-zone-header">${escHtml(zoneName)}</div>
      ${tileGrid}`);
  }

  if (!blocks.length) return '';
  return `<section class="card amenities-card">
    <h2>Amenities</h2>
    ${blocks.join('')}
    <div class="amenity-detail" id="amenity-detail" hidden></div>
  </section>`;
}

// Compose the detail panel body for a clicked amenity button.
// Reads structural facts from the button's data-* attrs; copy lives
// in this function so iterating on phrasing doesn't require re-render.
//
// When a hazard fires on the tile, the rich dog_impact_text from the
// most-severe advisory (or the synthesized sand/wind one) is the
// PRIMARY body. The dog-policy phrase becomes a secondary "normally"
// line below it. When no hazard, only the policy phrase shows.
function _amenityDetailBody(btn) {
  const key        = btn.dataset.key || '';
  const sec        = btn.dataset.section || '';
  const rule       = btn.dataset.rule || '';
  const value      = btn.dataset.value || '';
  const hazImpact  = btn.dataset.hazImpact || '';
  const hazSummary = btn.dataset.hazSummary || '';
  const label      = btn.querySelector('.amenity-label')?.textContent || '';

  // Concise rule phrasings — no "Dogs" prefix, no "allowed" filler.
  const policyForWater = ({
    off_leash:               'Off-leash for swimming.',
    on_leash:                'On-leash in the water.',
    on_leash_or_voice:       'On-leash in the water (voice control where posted).',
    off_leash_voice_control: 'Off-leash under voice control.',
    not_allowed:             'Dogs not allowed in the water.',
    unknown:                 'Swim policy unknown.',
  })[rule] || 'Swim section.';
  const policyForSand = ({
    off_leash:               'Off-leash on the sand.',
    on_leash:                'On-leash on the sand.',
    on_leash_or_voice:       'On-leash on the sand (voice control where posted).',
    off_leash_voice_control: 'Off-leash under voice control.',
    not_allowed:             'Dogs not allowed on the sand.',
    unknown:                 'Sand policy unknown.',
  })[rule] || 'Sand section.';
  const policyGeneric = ({
    off_leash:               'Off-leash in this area.',
    on_leash:                'On-leash in this area.',
    on_leash_or_voice:       'On-leash (voice control where posted).',
    off_leash_voice_control: 'Off-leash under voice control.',
    not_allowed:             'Dogs not allowed in this area.',
    unknown:                 'Dog rule unknown for this area.',
  })[rule] || '';

  let primaryBody = '';
  let secondaryBody = '';

  if (sec === 'water') {
    if (hazImpact) {
      primaryBody = hazImpact;
      secondaryBody = `Normally: ${policyForWater.toLowerCase()}`;
    } else {
      primaryBody = policyForWater;
    }
  } else if (sec === 'sand') {
    if (hazImpact) {
      primaryBody = hazImpact;
      secondaryBody = `Normally: ${policyForSand.toLowerCase()}`;
    } else {
      primaryBody = policyForSand;
    }
  } else if (sec === 'trails') {
    primaryBody = ({
      off_leash:    'Off-leash on the trails.',
      on_leash:     'On-leash on the trails.',
      not_allowed:  'Dogs not allowed on the trails.',
    })[rule] || policyGeneric || 'Trails section.';
  } else if (sec === 'boardwalk') {
    primaryBody = ({
      off_leash:    'Off-leash on the boardwalk.',
      on_leash:     'On-leash on the boardwalk.',
      not_allowed:  'Dogs not allowed on the boardwalk.',
    })[rule] || policyGeneric || 'Boardwalk section.';
  } else if (sec === 'global') {
    primaryBody = policyGeneric.replace('this area', 'this beach') || 'Whole beach.';
  } else if (sec) {
    // dunes / bluff / campground / playground / tide_pools / nesting_zones
    primaryBody = policyGeneric || label;
  } else if (key === 'has_parking') {
    primaryBody = value ? `Parking: ${value}.` : 'Parking on site.';
  } else if (key === 'has_restrooms') {
    primaryBody = 'Restrooms on site.';
  } else if (key === 'has_showers') {
    primaryBody = 'Outdoor rinse showers on site.';
  } else if (key === 'has_drinking_water') {
    primaryBody = 'Drinking water on site.';
  } else if (key === 'has_lifeguards') {
    primaryBody = 'Lifeguards on duty seasonally (Memorial Day–Labor Day).';
  } else if (key === 'has_picnic_area') {
    primaryBody = 'Picnic area on site.';
  } else if (key === 'has_fire_pits') {
    primaryBody = 'Fire pits on site (check local rules for use).';
  } else if (key === 'has_food') {
    primaryBody = 'Food / concessions on site.';
  } else if (key === 'has_disabled_access') {
    primaryBody = 'Accessible features available — see the Accessibility card below.';
  } else if (key === 'area') {
    const m2Str = _currentBeachAreaM2
      ? Math.round(_currentBeachAreaM2).toLocaleString('en-US')
      : '';
    primaryBody = m2Str
      ? `Beach footprint, from OSM polygon (${m2Str} m²).`
      : 'Beach footprint, from OSM polygon.';
  } else {
    primaryBody = label;
  }

  const valueHtml = value
    ? `<span class="amenity-detail-value">${escHtml(value)}</span>`
    : '';
  const hazHeadlineHtml = (hazImpact && hazSummary)
    ? `<div class="amenity-detail-haz">⚠ ${escHtml(hazSummary)}</div>`
    : '';
  const secondaryHtml = secondaryBody
    ? `<div style="color:var(--text-muted); font-size:11px; margin-top:3px;">${escHtml(secondaryBody)}</div>`
    : '';

  return `
    <div class="amenity-detail-label">${escHtml(label)}${valueHtml}</div>
    ${hazHeadlineHtml}
    <div>${escHtml(primaryBody)}</div>
    ${secondaryHtml}
  `;
}

// Event-delegated click handler for amenity tiles. Single-select:
// opening one closes any other open tile. Mirrors the cautions card
// pattern (lines 4225+). Wired once at top-level via setupAmenityDetailDelegation.
function setupAmenityDetailDelegation() {
  if (window.__amenityDetailWired) return;
  window.__amenityDetailWired = true;
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.amenities-card .amenity[data-key], .amenities-card .amenity[data-section]');
    if (!btn) return;
    e.preventDefault();
    const card = btn.closest('.amenities-card');
    if (!card) return;
    const detail = card.querySelector('#amenity-detail');
    if (!detail) return;
    const wasOpen = btn.getAttribute('aria-expanded') === 'true';
    card.querySelectorAll('.amenity[aria-expanded="true"]')
        .forEach(t => t.setAttribute('aria-expanded', 'false'));
    if (wasOpen) {
      detail.hidden = true;
      detail.innerHTML = '';
      return;
    }
    btn.setAttribute('aria-expanded', 'true');
    detail.innerHTML = _amenityDetailBody(btn);
    detail.hidden = false;
  });
}



// _renderSectionPill / _renderTimeCell / _renderZoneCard /
// buildZoneRulesSection / time-tab handler all moved to
// src/zone-rules-block.js (shared with detail.html).

// ─── Weather card ────────────────────────────────────────────────
// Live against Open-Meteo (forecast) + NOAA CO-OPS (tides). No cache.
// Renders empty mount; loadWeather() fills it after fetch.

// WMO weather code → emoji + label.
const WMO_ICON = {
  0:['☀️','Clear'], 1:['🌤️','Mostly sunny'], 2:['⛅','Partly cloudy'], 3:['☁️','Overcast'],
  45:['🌫️','Fog'], 48:['🌫️','Fog'],
  51:['🌦️','Drizzle'], 53:['🌦️','Drizzle'], 55:['🌦️','Drizzle'],
  61:['🌧️','Light rain'], 63:['🌧️','Rain'], 65:['🌧️','Heavy rain'],
  71:['🌨️','Snow'], 73:['🌨️','Snow'], 75:['🌨️','Heavy snow'],
  80:['🌧️','Showers'], 81:['🌧️','Showers'], 82:['🌧️','Heavy showers'],
  95:['⛈️','Thunderstorm'], 96:['⛈️','Thunderstorm'], 99:['⛈️','Thunderstorm'],
};
function wmoIcon(code) { return (WMO_ICON[code] || ['🌡️','—'])[0]; }
function wmoLabel(code) { return (WMO_ICON[code] || ['🌡️','—'])[1]; }

function buildWeatherSection(beach) {
  const tideMount = beach.noaa_station_id
    ? `<div id="tide-mount" class="weather-loading">Loading tides…</div>`
    : '';
  return `<section class="card weather-card">
    <h2>Weather and Tides</h2>
    <div id="weather-mount" class="weather-loading">Loading conditions…</div>
    ${tideMount}
  </section>`;
}

function _fmtTideTime(iso) {
  const d = new Date(iso);
  const hh = d.getHours(), mm = d.getMinutes();
  const h = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh;
  const ap = hh >= 12 ? 'pm' : 'am';
  return mm ? `${h}:${String(mm).padStart(2,'0')}${ap}` : `${h}${ap}`;
}

function _renderWeatherToday(forecast) {
  const mount = document.getElementById('weather-mount');
  if (!mount) return;
  const f = forecast;
  const code  = f.current?.weather_code ?? f.daily.weather_code[0];
  const temp  = f.current?.temperature_2m != null
    ? Math.round(f.current.temperature_2m)
    : Math.round(f.daily.temperature_2m_max[0]);
  const wind  = f.current?.wind_speed_10m != null
    ? Math.round(f.current.wind_speed_10m)
    : Math.round(f.daily.wind_speed_10m_max[0]);
  const uvMax = f.daily.uv_index_max?.[0];
  const uvNow = f.current?.uv_index;
  const uv    = uvNow != null ? uvNow : uvMax;
  const chips = [
    `<span class="weather-chip">🌡 ${temp}°</span>`,
    `<span class="weather-chip">💨 ${wind} mph</span>`,
    uv != null ? `<span class="weather-chip">☀️ UV ${parseFloat(uv).toFixed(1)}</span>` : '',
  ].filter(Boolean).join('');
  mount.innerHTML = `<div class="weather-now">
    <div class="weather-now-cond" title="${escHtml(wmoLabel(code))}"
         aria-label="${escHtml(wmoLabel(code))}">${wmoIcon(code)}</div>
    <div class="weather-chips">${chips}</div>
  </div>`;
  mount.classList.remove('weather-loading');
}

function _renderTidesToday(tides, forecast) {
  const mount = document.getElementById('tide-mount');
  if (!mount) return;
  // Filter to the REQUESTED day's prefix (window.__beachSelectedDate) so
  // the polyline doesn't wrap around if hours bleed into next day. Use
  // browser's local today only as the fallback for the no-?date= path.
  // Mirrors the same fix in _deriveTideCurveFromHours line 3137 — both
  // sides of the filter must agree on which day the curve represents.
  let _todayStr = window.__beachSelectedDate;
  if (!_todayStr || !/^\d{4}-\d{2}-\d{2}$/.test(_todayStr)) {
    const _today = new Date();
    _todayStr = `${_today.getFullYear()}-${String(_today.getMonth()+1).padStart(2,'0')}-${String(_today.getDate()).padStart(2,'0')}`;
  }
  const hourly = (tides?.hourly || []).filter(p => p?.t && p.t.startsWith(_todayStr));
  const hilo   = (tides?.hilo   || []).filter(p => p?.t && p.t.startsWith(_todayStr));
  if (!Array.isArray(hourly) || hourly.length === 0) {
    // Fall back to hilo-only text if we got hilo but no hourly.
    if (Array.isArray(hilo) && hilo.length) {
      const rows = hilo.slice(0,4).map(p => `
        <span>${p.type === 'H' ? '⬆' : '⬇'} <strong>${_fmtTideTime(p.t.replace(' ','T'))}</strong> · ${parseFloat(p.v).toFixed(1)}ft</span>`).join('');
      mount.innerHTML = `<div class="tide-events">${rows}</div>`;
    } else {
      mount.innerHTML = `<div class="tide-empty">Tide predictions unavailable.</div>`;
    }
    mount.classList.remove('weather-loading');
    return;
  }

  // Infographic SVG: one tide line, hi/lo text markers, NOW dot,
  // zero-ft reference, hour axis at bottom. Hover anywhere on the
  // curve to see exact time + height (interactive crosshair).
  const W = 280, H = 130, padTop = 22, padBottom = 24;
  const minV = Math.min(...hourly.map(p => parseFloat(p.v)));
  const maxV = Math.max(...hourly.map(p => parseFloat(p.v)));
  const rng  = Math.max(maxV - minV, 0.5);

  const xOf = (t) => {
    const hh = parseInt(t.slice(11,13), 10);
    const mm = parseInt(t.slice(14,16), 10);
    return ((hh + mm/60) / 24) * W;
  };
  const yOf = (v) => H - padBottom - ((parseFloat(v) - minV) / rng) * (H - padTop - padBottom);

  // Single smooth polyline through the hourly points. Tides are
  // naturally smooth so straight segments + stroke-linejoin:round
  // look very close to a sine curve without bezier artifacts.
  const pts = hourly.map(p => ({ x: xOf(p.t), y: yOf(p.v) }));
  const line = 'M ' + pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L ');

  // Hi/lo markers — borderless text only. Includes a <title> for
  // native browser hover showing time + height.
  const markersHtml = Array.isArray(hilo) ? hilo.slice(0,4).map(p => {
    const x = xOf(p.t), y = yOf(p.v);
    const arrow = p.type === 'H' ? '↑' : '↓';
    const heightStr = `${parseFloat(p.v).toFixed(1)}ft`;
    const timeStr = _fmtTideTime(p.t.replace(' ','T'));
    const txtY = p.type === 'H' ? Math.max(y - 6, padTop) : Math.min(y + 14, H - padBottom - 4);
    return `
      <text x="${x.toFixed(1)}" y="${txtY.toFixed(1)}" text-anchor="middle">
        <title>${p.type === 'H' ? 'High tide' : 'Low tide'} · ${escHtml(timeStr)} · ${heightStr}</title>
        <tspan class="tide-marker-arrow">${arrow}</tspan>
        <tspan class="tide-marker-text" dx="2">${heightStr}</tspan>
      </text>`;
  }).join('') : '';

  // Zero-tide horizontal reference line (only if 0 is within the
  // visible range; some lake beaches sit far above MLLW).
  const zeroY = yOf(0);
  const zeroLine = (zeroY >= padTop && zeroY <= H - padBottom)
    ? `<line x1="0" y1="${zeroY.toFixed(1)}" x2="${W}" y2="${zeroY.toFixed(1)}" class="tide-zero-line"/>
       <text x="${W - 4}" y="${(zeroY - 2).toFixed(1)}" text-anchor="end" class="tide-zero-label">0 ft</text>`
    : '';

  // Hour scale along the bottom (12am, 6am, 12pm, 6pm)
  const hourLabels = [0, 6, 12, 18].map(h => {
    const x = (h / 24) * W;
    const lbl = h === 0 ? '12am' : h === 12 ? '12pm' : (h < 12 ? `${h}am` : `${h-12}pm`);
    const anchor = h === 0 ? 'start' : (h === 18 ? 'end' : 'middle');
    return `<text x="${x.toFixed(1)}" y="${H - 4}" text-anchor="${anchor}" class="tide-hour-axis-label">${lbl}</text>`;
  }).join('');

  // NOW marker only on today's view. On future-day-pill clicks the
  // marker would point at a meaningless x-position (browser's current
  // hour overlaid on tomorrow's tide curve).
  const _isTodayTide = window.__beachIsToday !== false;
  let nowMarker = '';
  if (_isTodayTide) {
    const now = new Date();
    const nowHour = now.getHours() + now.getMinutes()/60;
    const nowX = (nowHour / 24) * W;
    const iLo = Math.floor(nowHour);
    const iHi = Math.min(iLo + 1, pts.length - 1);
    const frac = nowHour - iLo;
    const nowY = (pts[iLo]?.y ?? padTop) * (1 - frac) + (pts[iHi]?.y ?? padTop) * frac;
    const nowHeight = (parseFloat(hourly[iLo]?.v ?? 0) * (1 - frac)
                    + parseFloat(hourly[iHi]?.v ?? 0) * frac).toFixed(1);
    nowMarker = `
      <circle cx="${nowX.toFixed(1)}" cy="${nowY.toFixed(1)}" r="4" class="tide-now-dot">
        <title>Now · ${nowHeight}ft</title>
      </circle>
      <text x="${nowX.toFixed(1)}" y="${(nowY - 9).toFixed(1)}" text-anchor="middle" class="tide-now-label">NOW</text>`;
  }

  // Precompute 48 static hover zones (one per 30-min bucket). Each
  // is an invisible rect carrying a native SVG <title> with the
  // bucket-center time + interpolated tide height. Zero JS handlers,
  // zero per-frame compute — browser handles the tooltip natively.
  const zonesHtml = (() => {
    const out = [];
    const zoneW = W / 48;
    for (let z = 0; z < 48; z++) {
      const hourFloat = z * 0.5;             // 0.0, 0.5, 1.0, ... 23.5
      const iLo = Math.min(Math.floor(hourFloat), pts.length - 1);
      const iHi = Math.min(iLo + 1, pts.length - 1);
      const f   = hourFloat - iLo;
      const v   = parseFloat(hourly[iLo].v) * (1 - f) + parseFloat(hourly[iHi].v) * f;
      const hh  = Math.floor(hourFloat);
      const mm  = (hourFloat % 1) === 0 ? 0 : 30;
      const ap  = hh >= 12 ? 'pm' : 'am';
      const h12 = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh;
      const tip = `${h12}:${String(mm).padStart(2,'0')}${ap} · ${v.toFixed(1)}ft`;
      out.push(`<rect x="${(z * zoneW).toFixed(2)}" y="${padTop}"
                      width="${zoneW.toFixed(2)}" height="${H - padTop - padBottom}"
                      class="tide-hover-zone"><title>${tip}</title></rect>`);
    }
    return out.join('');
  })();

  mount.innerHTML = `
    <svg class="tide-curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${zeroLine}
      <path d="${line}" class="tide-stroke"/>
      ${markersHtml}
      ${nowMarker}
      ${hourLabels}
      ${zonesHtml}
    </svg>`;
  mount.classList.remove('weather-loading');
}

async function loadWeather(beach, hoursToday) {
  const weatherMount = document.getElementById('weather-mount');
  const tideMount    = document.getElementById('tide-mount');
  if (!weatherMount || beach.lat == null || beach.lng == null) {
    if (weatherMount) weatherMount.parentElement.remove();
    if (tideMount)    tideMount.parentElement.remove();
    return;
  }
  const tz = beach.timezone || 'auto';
  // Today only — drop forecast_days to 1.
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${beach.lat}&longitude=${beach.lng}`
    + `&current=temperature_2m,weather_code,wind_speed_10m,uv_index`
    + `&daily=temperature_2m_max,temperature_2m_min,weather_code,wind_speed_10m_max,precipitation_sum,uv_index_max`
    + `&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch`
    + `&timezone=${encodeURIComponent(tz)}&forecast_days=1`;
  // Tides now derive from hours_today.tide_height (already in the
  // get_beach_info payload; populated by daily-beach-refresh from the
  // weekly NOAA pull). No browser→NOAA fetch.
  const tides = tideMount ? _deriveTideCurveFromHours(hoursToday) : null;
  try {
    const forecast = await fetch(url).then(r => r.json());
    _renderWeatherToday(forecast);
    if (tideMount) _renderTidesToday(tides, forecast);
  } catch (e) {
    console.warn('weather fetch failed:', e);
    weatherMount.textContent = 'Weather unavailable right now.';
    // Tides can still render even if Open-Meteo fails.
    if (tideMount && tides) _renderTidesToday(tides, null);
  }
}

// Build the {hourly, hilo} shape _renderTidesToday expects, derived
// from hours_today.tide_height. Local minima/maxima of the 24-point
// array become hi/lo events. Replaces the previous NOAA fetch.
function _deriveTideCurveFromHours(hoursToday) {
  if (!Array.isArray(hoursToday)) return null;
  // datePrefix must reflect the REQUESTED day (window.__beachSelectedDate),
  // not the browser's wall clock. On a future-day-pill click, the
  // hours_today rows are for that future day; stamping them with the
  // browser's today (the old behavior) caused the tide curve to render
  // with today's timestamps overlaid on tomorrow's heights — wonky.
  // Per Franz 2026-06-07.
  let datePrefix = window.__beachSelectedDate;
  if (!datePrefix || !/^\d{4}-\d{2}-\d{2}$/.test(datePrefix)) {
    const _t = new Date();
    datePrefix = `${_t.getFullYear()}-${String(_t.getMonth() + 1).padStart(2, '0')}-${String(_t.getDate()).padStart(2, '0')}`;
  }
  const hourly = hoursToday
    .filter(h => h && h.tide_height != null && h.local_hour != null)
    .sort((a, b) => a.local_hour - b.local_hour)
    .map(h => ({
      t: `${datePrefix} ${String(h.local_hour).padStart(2, '0')}:00`,
      v: String(h.tide_height),
    }));
  if (hourly.length < 3) return { hourly, hilo: [] };
  const hilo = [];
  for (let i = 1; i < hourly.length - 1; i++) {
    const prev = parseFloat(hourly[i - 1].v);
    const cur  = parseFloat(hourly[i].v);
    const next = parseFloat(hourly[i + 1].v);
    if (cur > prev && cur > next) {
      hilo.push({ t: hourly[i].t, v: hourly[i].v, type: 'H' });
    } else if (cur < prev && cur < next) {
      hilo.push({ t: hourly[i].t, v: hourly[i].v, type: 'L' });
    }
  }
  // Cap to 4 (typical day = 2 highs + 2 lows). Hourly resolution
  // means timing precision is to-the-hour, not minutes like NOAA's
  // native 6-min predictions — acceptable for an at-a-glance display.
  return { hourly, hilo: hilo.slice(0, 4) };
}

// Beach overview card. Title = beach display name. Carries the
// LLM static description + async Scout narrative. The best-window
// info lives in its own card (buildBestTimeCard).
function buildOverviewCard(beach, description, amenities) {
  const blurb = description?.text;
  const accLine = _accessibilityOverviewLine(amenities?.accessibility_features);
  if (!blurb && !accLine) return '';
  // Beach text — bare prose, no card chrome, no title. Beach name
  // already appears in the page header next to the Your-Fit badge.
  // Accessibility one-liner appended when JSONB present; full detail
  // lives in the dedicated Accessibility card above Pack List.
  const blurbHtml = blurb ? `<p class="overview-blurb">${escHtml(blurb)}</p>` : '';
  const accHtml = accLine ? `<p class="overview-accessibility">${escHtml(accLine)}</p>` : '';
  return blurbHtml + accHtml;
}

// Best-window card — standalone, all black text. Status pill keeps
// its tinted background for the at-a-glance signal but pill text is
// black for typographic consistency.
// Hourly score bar — ports detail.html's score row exactly: one
// .score-bar-col per hour with the score value above, dog icon for
// hours in the best window, status-color fill, and x-axis labels
// every other hour.
// Best-fit "from" / "to" hours for the chart x-axis. Priority:
//   1. Gate hours (beach.open_time/close_time, non-default seed)
//   2. Posted prose parse (regex out an "8am-6pm" style range from
//      amenities.hours_text)
//   3. Standard fallback 05:00–22:00 (matches the universal seed)
function _parseHoursText(text) {
  if (!text) return null;
  const m = String(text).match(
    /(\d{1,2})(?::(\d{2}))?\s*(am|pm)\s*(?:[-–]|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
  if (!m) return null;
  const to24 = (h, ap) => {
    h = parseInt(h, 10);
    if (/pm/i.test(ap) && h < 12) h += 12;
    if (/am/i.test(ap) && h === 12) h = 0;
    return h;
  };
  return { startH: to24(m[1], m[3]), endH: to24(m[4], m[6]) };
}
function _hoursWindowForChart(beach, amenities) {
  const open  = beach?.open_time;
  const close = beach?.close_time;
  const isDefault = open === '05:00' && close === '22:00';
  if (open && close && !isDefault) {
    return { startH: parseInt(open.slice(0,2), 10),
             endH:   parseInt(close.slice(0,2), 10) };
  }
  const parsed = _parseHoursText(amenities?.hours_text);
  if (parsed) return parsed;
  return { startH: 5, endH: 22 };
}

function _renderScoreBars(hoursToday, beach, amenities, dogPolicy) {
  if (!Array.isArray(hoursToday) || hoursToday.length === 0) return '';
  const { startH, endH } = _hoursWindowForChart(beach, amenities);
  // One bar per hour in the open window. Null-score hours inside the
  // window (dog-prohibition zones, pre-sunrise, etc.) render as no_go
  // red so the chart stays continuous instead of leaving gaps.
  const hours = hoursToday
    .filter(h => h.local_hour >= startH && h.local_hour <= endH)
    .sort((a, b) => a.local_hour - b.local_hour);
  if (hours.length === 0) return '';

  // Bars display the per-hour appeal Overall (same 60/20/20 mix as the
  // page-level Your-Fit card), STACKED into Access / Amenities /
  // Weather segments — same visual language as the Your-Fit bar.
  // Tall bar = high overall; structural colors signal category.
  const amenitiesScore = _amenitiesScore(amenities);
  const contribsFor = h => {
    if (h.hour_score == null) return null;
    let avail = _hourlyAvailability(h.local_hour, dogPolicy?.zone_rules, USER_PREF);
    if (avail == null) avail = _availabilityFromFlags(dogPolicy, USER_PREF);
    const access  = Math.round(0.60 * avail);
    const amen    = Math.round(0.20 * amenitiesScore);
    const wx      = Math.round(0.20 * h.hour_score);
    return { access, amen, wx, overall: access + amen + wx };
  };

  // Best-window indicator derives from the SAME from-now window the
  // row label + Scout blurb use. Used for the 🐶 emphasis on bars
  // inside the window.
  const nowWindow = _bestWindowFromNow(hoursToday, beach, amenities, dogPolicy);
