<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beach — Dog Beach Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/photo-block.css">
<link rel="stylesheet" href="src/zone-rules-block.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f2742;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --accent: #1d4ed8;
    --green: #16a34a;
    --red:   #dc2626;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .page { max-width: 1200px; margin: 0 auto; }
  .body-grid {
    display: grid;
    grid-template-columns: 1fr;  /* mobile default — single column, stacked */
    gap: 0;
  }
  @media (min-width: 900px) {
    .body-grid {
      grid-template-columns: minmax(260px, 30%) 1fr;  /* 30% left rail / 70% main */
      gap: 16px;
      padding: 0 16px;
    }
    .body-grid > main { padding: 0; }
    .body-grid > aside#left-rail {
      position: sticky;
      top: 96px;  /* below sticky hero */
      align-self: start;
      padding-top: 12px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
    }
    /* Narrow-column overrides for blocks designed for wider layouts. */
    #left-rail .amenity-grid { grid-template-columns: repeat(2, 1fr); }
    #left-rail .zr-sections  { grid-template-columns: 1fr; }
    #left-rail .zr-card { margin: 8px 0; padding: 10px 12px; }
  }
  header.hero {
    padding: 24px 20px 16px; background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .hero-main { flex: 1; min-width: 0; }
  .beach-name {
    font-family: 'Outfit', sans-serif;
    font-size: 24px; font-weight: 700; color: var(--text);
    margin: 0 0 6px;
  }
  /* City · state inlined into the h1 — same font/size/weight,
   * lighter color so it reads as supporting info to the name. */
  .beach-region {
    color: var(--text-muted);
    margin-left: 0.4em;
    font-weight: 600;
  }
  .beach-address {
    font-size: 13px; color: var(--text); display: flex;
    align-items: center; gap: 6px;
  }
  .beach-address a {
    color: var(--accent); text-decoration: none;
  }
  .beach-address a:hover { text-decoration: underline; }
  .copy-btn {
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--card);
    font-size: 11px; color: var(--text-muted);
    transition: all 0.15s;
  }
  .copy-btn:hover { background: var(--bg); color: var(--text); }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }
  .close-btn {
    color: var(--text-muted); text-decoration: none;
    font-size: 22px; line-height: 1; padding: 4px 6px;
    border-radius: 6px; flex-shrink: 0;
  }
  .close-btn:hover { background: var(--bg); }

  section.card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin: 12px 16px;
  }
  section.card h2 {
    font-size: 14px; font-weight: 700; margin: 0 0 10px;
    color: var(--text);
  }

  /* Map block */
  #map {
    height: 200px; border-radius: 8px; border: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .map-actions {
    display: flex; flex-direction: column; gap: 8px;
  }
  .directions-btn {
    background: var(--accent); color: white; padding: 10px 14px;
    border-radius: 8px; text-decoration: none; font-weight: 600;
    font-size: 14px; text-align: center; display: block;
  }
  .directions-btn:hover { opacity: 0.92; }
  .map-address {
    font-size: 12px; color: var(--text-muted);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }

  /* Hours */
  .hours-grid {
    display: grid; grid-template-columns: max-content 1fr;
    gap: 6px 16px; font-size: 13px;
  }
  .hours-grid dt { color: var(--text-muted); font-weight: 500; }
  .hours-grid dd { margin: 0; color: var(--text); }
  .hours-dogs-prohibited { margin: 8px 0 0; font-size: 13px; color: var(--text); }
  .hours-dogs-suggest    { margin: 2px 0 0; font-size: 13px; color: var(--text-muted); }

  /* Amenities */
  .amenity-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  }
  @media (min-width: 480px) {
    .amenity-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .amenity {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px;
    background: var(--card);
  }
  .amenity-icon { font-size: 14px; flex-shrink: 0; }
  .amenity-text { display: flex; flex-direction: column; line-height: 1.2; }
  .amenity-sub {
    font-size: 10px; color: var(--text-muted); font-weight: 500;
    margin-top: 1px;
  }
  .amenity-grid { gap: 4px; }
  /* Long labels wrap inside the narrow 2-col cell. */
  .amenity-label { white-space: normal; line-height: 1.2; }
  /* Tiles tinted by dog-policy rule when the section has one. */
  .amenity.rule-off_leash   { background: rgba(34,197,94,0.45); border-color: rgba(21,128,61,0.42); }
  .amenity.rule-on_leash    { background: rgba(251,191,36,0.53); border-color: rgba(180,83,9,0.42); }
  .amenity.rule-not_allowed { background: rgba(239,68,68,0.45); border-color: rgba(153,27,27,0.42); }
  .amenity.rule-unknown     { background: rgba(0,0,0,0.04); }
  /* Zone-name sub-header inside the unified Amenities card (multi-zone beaches). */
  .amenity-zone-header {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-muted);
    margin: 8px 0 4px;
  }
  .amenity-zone-header:first-child { margin-top: 0; }
  /* .amenity.absent and .amenity.unknown no longer rendered — both
   * filter out at the JS layer until the user-feedback affordance
   * lands (project_amenity_user_feedback.md). */

  /* Weather card — compact icon + chips row, mimics index.html. */
  .weather-card .weather-now {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 4px 0 2px;
  }
  .weather-now-cond {
    font-size: 36px; line-height: 1;
  }
  .weather-chips {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 6px 8px;
  }
  .weather-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; padding: 3px 8px;
    border-radius: 999px;
    background: rgba(0,0,0,0.05); color: var(--text);
  }
  .weather-loading { color: var(--text-muted); font-size: 12px; padding: 8px 0; }

  /* Hourly score bar — ported from detail.html. Renders inside
   * the Best Window card. */
  .score-row {
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px 56px 0; margin-top: 10px;
    border-top: 1px solid var(--border);
  }
  .score-row-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 500;
    color: var(--text-muted); letter-spacing: 0.04em;
  }
  .score-bars-wrap {
    display: flex; align-items: flex-end; gap: 3px;
    height: 36px;
  }
  .score-bar-col {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; flex: 1; min-width: 0;
  }
  .score-bar-value {
    font-family: 'DM Mono', monospace;
    font-size: 9px; color: var(--text-muted);
    white-space: nowrap; line-height: 1;
  }
  .score-bar-dog { font-size: 10px; line-height: 1; min-height: 12px; }
  .score-bar {
    width: 100%; border-radius: 3px 3px 0 0;
    min-height: 4px; transition: opacity 0.15s;
  }
  .score-x-axis { display: flex; gap: 3px; padding: 2px 0 0; }
  .score-x-label {
    flex: 1; text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 9px; color: var(--text-muted);
    white-space: nowrap; overflow: hidden;
  }

  /* Best-window card — title + time + status pill, all black text.
   * Pill backgrounds retain status color for at-a-glance signal.
   * When hourly detail is available, the title + row become a
   * clickable affordance (cursor + underline-on-hover) that opens
   * a modal with the per-hour bar charts. */
  .besttime-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 16px; font-weight: 600; color: var(--text);
  }
  .besttime-time { color: var(--text); }
  .besttime-card.clickable h2,
  .besttime-card.clickable .besttime-time {
    cursor: pointer;
    text-decoration: underline; text-decoration-color: rgba(0,0,0,0.18);
    text-underline-offset: 2px;
  }
  .besttime-card.clickable h2:hover,
  .besttime-card.clickable .besttime-time:hover {
    text-decoration-color: var(--text);
  }

  /* Detail modal — iframe overlay opened from the Best Window card. */
  .detail-modal {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.72);
    display: none;
    z-index: 9999;
    padding: 24px;
    align-items: center; justify-content: center;
  }
  .detail-modal.open { display: flex; }
  .detail-modal-inner {
    position: relative;
    background: var(--bg);
    width: 100%; max-width: 900px; height: 90vh;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .detail-modal-inner iframe { width: 100%; height: 100%; border: 0; }
  .detail-modal-close {
    position: absolute; top: 10px; right: 12px;
    background: rgba(0,0,0,0.55); color: white;
    border: 0; width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; font-size: 16px; line-height: 1;
    z-index: 1;
  }
  /* Best-window header — time (big) - label (smaller, black). Status
   * signal lives on the score bars below, not in this header line. */
  .besttime-sep   { color: var(--text); font-weight: 500; }
  .besttime-text  { font-size: 13px; font-weight: 500; color: var(--text); }

  /* Scout blurb — now nested inside the Best Time card. Paragraph
   * narrative; fades in when LLM call returns. */
  #scout-blurb {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; line-height: 1.55;
    color: var(--text);
    margin-top: 8px;
    opacity: 0.55;
    transition: opacity 0.15s;
  }
  #scout-blurb.loaded { opacity: 1; }

  /* Advisories list — per-metric advisory/caution/no_go rows.
   * Severity tinting per row (advisory blue / caution amber / no_go red). */
  .cautions-card ul.advisory-list {
    list-style: none; padding: 0; margin: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
  }
  .advisory-row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 8px; border-radius: 0 4px 4px 0;
    border-left: 3px solid var(--border);
    font-size: 12px; line-height: 1.3; color: var(--text);
  }
  .advisory-icon { font-size: 14px; line-height: 1.3; flex-shrink: 0; }
  .advisory-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .advisory-headline { display: flex; align-items: baseline; gap: 6px; }
  .advisory-label { font-weight: 600; }
  .advisory-value { font-size: 11px; color: var(--text-muted); }
  .advisory-time  { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  /* Conditions domain: burnt-amber (amber-500 nudged ~7% toward red) for
   * caution; distinct from the amber-400 (yellow-leaning) used by
   * Amenities on_leash tiles so the two domains never collide visually. */
  .advisory-advisory { background: rgba(37,99,235,0.08); border-left-color: #1d4ed8; }
  .advisory-caution  { background: rgba(247,140,18,0.53); border-left-color: rgba(180,83,9,0.58); }
  .advisory-no_go    { background: rgba(239,68,68,0.45);  border-left-color: rgba(153,27,27,0.42); }

  /* Tide card — one smooth line, hi/lo bubbles, NOW dot. */
  .weather-card svg.tide-curve {
    display: block; width: 80%; height: 120px;
    margin: 0 auto;
    border-radius: 8px;
    background: transparent;
  }
  /* Smooth gradient fill under the curve — light at top, deep at bottom */
  .weather-card .tide-fill { fill: url(#tide-grad); }
  .weather-card .tide-stroke {
    fill: none; stroke: #0369a1; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  /* Hi/lo markers — text only, no bubble border */
  .weather-card .tide-marker-arrow { fill: #0369a1; font-size: 11px; font-weight: 700; }
  .weather-card .tide-marker-text  { fill: #0f2742; font-size: 11px; font-weight: 700; }
  /* Zero-tide reference line — dashed charcoal at v=0ft */
  .weather-card .tide-zero-line {
    stroke: rgba(15,39,66,0.55); stroke-width: 1; stroke-dasharray: 3 3;
  }
  .weather-card .tide-zero-label {
    font-size: 9px; fill: rgba(15,39,66,0.55); font-weight: 600;
  }
  /* Hour-scale labels along the bottom */
  .weather-card .tide-hour-axis-label {
    font-size: 9px; fill: rgba(15,39,66,0.55); font-weight: 600;
  }
  /* Hover zones — 48 invisible rects across the chart, each carrying
   * a native SVG <title>. Browser shows a system tooltip on hover. */
  .weather-card .tide-hover-zone { fill: rgba(0,0,0,0); cursor: help; }
  /* NOW marker — vertical line + label at top */
  .weather-card .tide-now-line {
    stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 3 2;
  }
  .weather-card .tide-now-dot { fill: #f59e0b; stroke: #fff; stroke-width: 2; }
  .weather-card .tide-now-label {
    font-size: 10px; font-weight: 700; fill: #92400e;
  }
  /* Hour ticks along the bottom */
  .weather-card .tide-hour-tick   { stroke: rgba(2,132,199,0.18); stroke-width: 1; }
  .weather-card .tide-hour-label  { font-size: 9px; fill: rgba(15,39,66,0.55); }

  .weather-card .tide-events {
    display: flex; flex-wrap: wrap; gap: 4px 10px;
    font-size: 11px; color: var(--text-muted); margin-top: 8px;
  }
  .weather-card .tide-events strong { color: var(--text); font-weight: 600; }
  .weather-card .tide-empty { color: var(--text-muted); font-size: 12px; font-style: italic; }

  /* Alternatives card — shows on beaches where dogs aren't allowed
   * or where sand/water access is prohibited. Mirrors detail.html's
   * "Try these instead" card. */
  .alt-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .alt-card-header {
    font-size: 14px; font-weight: 700; color: var(--text);
    margin-bottom: 4px;
  }
  .alt-card-reason {
    font-size: 12px; color: var(--text-muted); margin-bottom: 10px;
  }
  .alt-list { display: flex; flex-direction: column; gap: 8px; }
  .alt-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    text-decoration: none; color: inherit;
    transition: background 0.1s;
  }
  .alt-row:hover { background: rgba(0,0,0,0.02); }
  .alt-row-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .alt-name { font-weight: 600; font-size: 13px; color: var(--text); }
  .alt-meta { font-size: 11px; color: var(--text-muted); }
  .alt-row-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  /* Zone-rules styles now in src/zone-rules-block.css (shared block) */

  /* Links block */
  .link-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; text-decoration: none; color: var(--text);
    font-size: 13px; margin-bottom: 8px;
    transition: background 0.1s;
  }
  .link-row:hover { background: var(--bg); }
  .link-row .arrow { margin-left: auto; color: var(--text-muted); }

  /* Loading / error */
  .state {
    display: flex; flex-direction: column; align-items: center;
    padding: 80px 20px; gap: 12px; color: var(--text-muted);
  }
  .state-icon { font-size: 36px; }

  /* Details narrative — structured / curated facts (zone_rules.global_notes).
     Dimmer than .beach-description so the LLM-generated description at
     top carries the page; details supplement, don't compete. */
  .details-prose {
    font-size: 13px; color: var(--text-muted); line-height: 1.55;
    white-space: pre-wrap;
  }

  /* Beach description (LLM-generated, voice-led) */
  .beach-description {
    /* legacy class kept for any inline use; the overview card supersedes it. */
    font-size: 14px; color: var(--text); line-height: 1.55;
  }
  /* Overview card — beach name title + uniform 14px body text
   * (blurb prose, best-window row, scout blurb) so the card reads
   * as one typographic block. */
  .overview-card h2 {
    font-size: 18px; font-weight: 700; margin: 0 0 10px;
    color: var(--text); letter-spacing: -0.01em;
  }
  .overview-blurb {
    font-size: 14px; color: var(--text); line-height: 1.55;
    margin: 0 0 12px;
  }
  /* Scout blurb now lives inside the Best Time card. Black text,
   * uniform 14px / 1.55 line-height — matches the overview blurb. */
  .besttime-card #scout-blurb {
    font-size: 14px; line-height: 1.55;
    color: var(--text);
    margin: 10px 0 0; padding: 0;
    opacity: 1;
  }

  /* Hero photo block — shared component in src/photo-block.css. The
     wrapper just provides page-edge gutter; sizing/layout is owned by
     .photo-block in the shared sheet. */
  .photo-block-wrap { margin: 0 16px 12px; }

  /* Location card — full-width map in main content. */
  .location-card #map {
    height: 360px; border-radius: 8px; border: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .location-card .directions-btn {
    background: var(--accent); color: white; padding: 10px 14px;
    border-radius: 6px; text-decoration: none; font-weight: 600;
    font-size: 14px; text-align: center; display: inline-block;
    margin-right: 8px;
  }
  .location-card .map-address {
    font-size: 12px; color: var(--text-muted); display: inline-flex;
    align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1.3;
    margin-top: 6px;
  }
</style>
</head>
<body>

<div class="page">
  <header class="hero">
    <div class="hero-main">
      <h1 class="beach-name" id="beach-name">Loading...</h1>
      <div class="beach-address" id="beach-address"></div>
    </div>
    <a class="close-btn" id="close-btn" href="index.html">✕</a>
  </header>

  <div class="body-grid" id="body-grid">
    <aside id="left-rail"></aside>
    <main id="main-content">
      <div class="state">
        <div class="state-icon">🏖️</div>
        <div>Loading beach info…</div>
      </div>
    </main>
  </div>
</div>

<script src="src/photo-block.js"></script>
<script src="src/zone-rules-block.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script>
const SUPABASE_URL = 'https://ehlzbwtrsxaaukurekau.supabase.co';
const ANON_KEY     = 'sb_publishable_lAg7YdZ3w7S5fN8jgiExKQ_3-KtW3xk';

const params       = new URLSearchParams(location.search);
const fid          = params.get('fid');
const locationId   = params.get('location_id');
const dateFromQs   = params.get('date');

document.getElementById('close-btn').href =
  fid ? `index.html?fid=${fid}` : (locationId ? `index.html?location=${locationId}` : 'index.html');

// Zone-rules constants + helpers + renderers now live in
// src/zone-rules-block.js (window.ZoneRulesBlock). escHtml is kept here
// because it's used throughout beach.html.

const escHtml = s => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function _currentLocalHour(timezone) {
  const tz = timezone || 'America/Los_Angeles';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: '2-digit', hour12: false,
  }).formatToParts(new Date());
  const h = parts.find(p => p.type === 'hour')?.value;
  return h != null ? (parseInt(h, 10) % 24) : null;
}

function _currentLocalMinutes(timezone) {
  const tz = timezone || 'America/Los_Angeles';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false,
  }).formatToParts(new Date());
  const h = parseInt(parts.find(p => p.type === 'hour')?.value || '0', 10) % 24;
  const m = parseInt(parts.find(p => p.type === 'minute')?.value || '0', 10);
  return h * 60 + m;
}

// If the beach allows dogs today but the user is currently inside the
// prohibition window (and the window ends later today, not after midnight),
// return a "Come back after Xpm" suggestion. Returns '' otherwise.
function _suggestPostProhibitionTime(start, end, timezone) {
  if (!start || !end) return '';
  const toMin = s => {
    const [h, m] = String(s).split(':').map(Number);
    return h * 60 + (m || 0);
  };
  const startM = toMin(start);
  const endM   = toMin(end);
  // Wrap-around (overnight) and end-of-day midnight windows: no useful
  // same-day suggestion — punt.
  if (endM === 0 || endM <= startM) return '';
  const nowM = _currentLocalMinutes(timezone);
  if (nowM < startM || nowM >= endM) return '';
  const eh = Math.floor(endM / 60), em = endM % 60;
  const ap = eh >= 12 ? 'pm' : 'am';
  const h12 = eh === 0 ? 12 : eh > 12 ? eh - 12 : eh;
  const label = em ? `${h12}:${String(em).padStart(2,'0')}${ap}` : `${h12}${ap}`;
  return `<p class="hours-dogs-suggest">Come back after ${label} today.</p>`;
}

async function load() {
  if (!fid && !locationId) return showError('No beach specified.');
  let resolvedFid = fid;
  // Resolve location_id → fid by hitting beaches_gold via PostgREST
  if (!resolvedFid && locationId) {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/beaches_gold?select=fid&location_id=eq.${encodeURIComponent(locationId)}&limit=1`,
      { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` }});
    const rows = await r.json();
    if (!rows?.[0]?.fid) return showError('Beach not found.');
    resolvedFid = rows[0].fid;
  }

  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_beach_info`, {
      method: 'POST',
      headers: {
        apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_fid: parseInt(resolvedFid, 10) }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    if (!data?.beach) return showError('Beach not found.');
    render(data, resolvedFid);
  } catch (err) {
    console.error(err);
    showError(`Failed to load: ${err.message}`);
  }
}

function showError(msg) {
  document.getElementById('beach-name').textContent = 'Beach';
  document.getElementById('main-content').innerHTML = `
    <div class="state"><div class="state-icon">🐕</div><div>${escHtml(msg)}</div></div>`;
}

function render(data, beachFid) {
  const { beach, dog_policy, amenities } = data;
  document.title = `${beach.display_name} — Dog Beach Scout`;
  // Beach name + inline region (city · state) — same h1, lighter color.
  const nameEl = document.getElementById('beach-name');
  nameEl.textContent = beach.display_name;
  const regionParts = [];
  if (beach.county) regionParts.push(beach.county);
  if (beach.state)  regionParts.push(beach.state);
  if (regionParts.length) {
    const span = document.createElement('span');
    span.className = 'beach-region';
    span.textContent = regionParts.join(' · ');
    nameEl.appendChild(span);
  }

  // Address with copy button + native maps deep-link.
  // No address → no row (lat/lng fallback retired).
  const addrEl = document.getElementById('beach-address');
  if (beach.address) {
    const mapsUrl = buildMapsUrl(beach);
    addrEl.innerHTML = `📍 <a href="${escHtml(mapsUrl)}" target="_blank" rel="noopener">${escHtml(beach.address)}</a>
      <button class="copy-btn" type="button" data-copy="${escHtml(beach.address)}">Copy</button>`;
  } else {
    addrEl.style.display = 'none';
  }

  // Two-column layout (desktop):
  //   LEFT RAIL (30%): at-a-glance compact info — amenities + zone rules.
  //   MAIN  (70%): description, photos, hours, MAP, details, links.
  // Mobile collapses to a single stacked column (left rail first).
  // Description = LLM-generated Scout-voice prose.
  // Details = structured / curated facts (currently from
  // dog_policy.zone_rules.global_notes; hidden when empty).
  // Two distinct things — Franz, 2026-05-10.
  // LEFT RAIL (top → bottom):
  //   Amenities (merged with Dog Policy section-tiles — rule color
  //   tints them in place), Hours, Weather and Tides (one card),
  //   Advisories.
  const leftRail = [];
  leftRail.push(buildAmenitiesSection(amenities, dog_policy));
  leftRail.push(buildHoursSection(beach, amenities, dog_policy));
  leftRail.push(buildWeatherSection(beach));
  leftRail.push(buildCautionsSection(data.today, dog_policy, data.hours_today));
  document.getElementById('left-rail').innerHTML = leftRail.filter(Boolean).join('');

  // MAIN (top → bottom):
  //   Alternatives (if triggered), Photos (only when present), Overview,
  //   Best Window, Location, Details, Links
  const hasPhotos = Array.isArray(data.photos) && data.photos.length > 0;
  const main = [];
  main.push(buildAlternativesSection(dog_policy, data.alternatives));
  if (hasPhotos) main.push('<div class="photo-block-wrap" id="photo-block-mount"></div>');
  main.push(buildOverviewCard(beach, data.description));
  main.push(buildBestTimeCard(data.today, dog_policy, beachFid, data.hours_today));
  main.push(buildLocationSection(beach));
  main.push(buildDetailsSection(dog_policy));
  main.push(buildLinksSection(beach, beachFid));
  document.getElementById('main-content').innerHTML = main.filter(Boolean).join('');

  // Shared photo block — 1 hero + 5 thumbs + view-all (src/photo-block.js).
  // Mount AFTER the section HTML has been injected so the target exists.
  if (hasPhotos) {
    PhotoBlock.render(
      document.getElementById('photo-block-mount'),
      data.photos,
      { viewAllHref: `gallery.html?fid=${beachFid}` }
    );
  }

  wireCopyButtons();
  initMap(beach);

  // Fire async loads after DOM is mounted.
  loadScoutBlurb(beach, data.today, dog_policy);
  loadWeather(beach);
  _wireBestTimeClick();
}

function buildMapsUrl(beach) {
  const dest = beach.address
    ? encodeURIComponent(beach.address)
    : `${beach.lat},${beach.lng}`;
  return `https://www.google.com/maps/dir/?api=1&destination=${dest}`;
}

function buildDescriptionSection(description) {
  if (!description?.text) return '';
  return `<div class="beach-description">${escHtml(description.text)}</div>`;
}

function buildLocationSection(beach) {
  if (beach.lat == null || beach.lng == null) return '';
  const directionsUrl = buildMapsUrl(beach);
  const addrLine = beach.address
    ? `<span>${escHtml(beach.address)}</span>
       <button class="copy-btn" type="button" data-copy="${escHtml(beach.address)}">Copy</button>`
    : `<span>${beach.lat.toFixed(4)}°, ${beach.lng.toFixed(4)}°</span>`;
  return `<section class="card location-card">
    <h2>Location</h2>
    <div id="map"></div>
    <a class="directions-btn" href="${escHtml(directionsUrl)}" target="_blank" rel="noopener">📍 Get directions</a>
    <div class="map-address">${addrLine}</div>
  </section>`;
}

function buildHoursSection(beach, amenities, dogPolicy) {
  const hoursText = amenities?.hours_text;
  const open = beach.open_time, close = beach.close_time;
  // beaches_gold.open_time/close_time is 05:00–22:00 for 1,868 of 1,873
  // scoreable beaches — a universal default seed, not real beach hours.
  // Treat that exact pair as "no data" and rely on Posted hours_text
  // instead. Any non-default pair renders alongside Posted prose; both
  // surface when both are populated, since the structured window is
  // useful at-a-glance even if the prose carries the nuance.
  const isDefault = open === '05:00' && close === '22:00';
  const showStructured = (open || close) && !isDefault;
  if (!hoursText && !showStructured) return '';
  const rows = [];
  if (hoursText) rows.push(`<dt>Posted</dt><dd>${escHtml(hoursText)}</dd>`);
  if (showStructured) {
    const range = (open && close) ? `${escHtml(open)} – ${escHtml(close)}`
                : (open ? `Opens ${escHtml(open)}` : `Closes ${escHtml(close)}`);
    rows.push(`<dt>Gate hours</dt><dd>${range}</dd>`);
  }
  const prohibStart = dogPolicy?.dogs_prohibited_start;
  const prohibEnd   = dogPolicy?.dogs_prohibited_end;
  const prohibNote  = (prohibStart && prohibEnd)
    ? `<p class="hours-dogs-prohibited"><strong>Dogs not allowed ${escHtml(prohibStart)}–${escHtml(prohibEnd)}</strong></p>`
      + _suggestPostProhibitionTime(prohibStart, prohibEnd, beach.timezone)
    : '';
  return `<section class="card">
    <h2>Hours</h2>
    <dl class="hours-grid">${rows.join('')}</dl>
    ${prohibNote}
  </section>`;
}

const AMENITY_DEFS = [
  { key: 'has_parking',         icon: '🅿️',  label: 'Parking' },
  { key: 'has_restrooms',       icon: '🚻',  label: 'Restrooms' },
  { key: 'has_showers',         icon: '🚿',  label: 'Showers' },
  { key: 'has_drinking_water',  icon: '💧',  label: 'Drinking water' },
  { key: 'has_picnic_area',     icon: '🧺',  label: 'Picnic area' },
  { key: 'has_fire_pits',       icon: '🔥',  label: 'Fire pits' },
  { key: 'has_lifeguards',      icon: '🛟',  label: 'Lifeguards' },
  { key: 'has_food',            icon: '🍔',  label: 'Food / concessions' },
  { key: 'has_disabled_access', icon: '♿',  label: 'ADA access' },
];

const PARKING_TYPE_LABEL = {
  lot: 'Lot', mixed: 'Mixed', metered: 'Metered',
  street: 'Street', none: 'No parking',
};
// OSM-style subtypes — used when parking_type is missing but
// parking_subtype is present (OSM emitter pathway).
const PARKING_SUBTYPE_LABEL = {
  surface: 'Lot', street_side: 'Street', 'multi-storey': 'Garage',
  multi_storey: 'Garage', underground: 'Garage', carports: 'Carport',
  rooftop: 'Rooftop',
};

function _parkingTypeLabel(amenities) {
  // Prefer the LLM enum; fall back to OSM-style subtype mapping.
  if (amenities.parking_type) return PARKING_TYPE_LABEL[amenities.parking_type] || '';
  if (amenities.parking_subtype) return PARKING_SUBTYPE_LABEL[amenities.parking_subtype] || '';
  return '';
}

function _parkingCostLabel(amenities) {
  // Structured signal wins: parking_fee = true → Paid, false → Free.
  if (amenities.parking_fee === true)  return 'Paid';
  if (amenities.parking_fee === false) return 'Free';
  // Fallback: metered is always paid by definition.
  if (amenities.parking_type === 'metered') return 'Paid';
  // Last resort: regex parking_notes prose (LLM-supplied "$5/day" etc).
  const n = String(amenities.parking_notes || '');
  if (/\$|\bfee\b|\bpaid\b/i.test(n)) return 'Paid';
  if (/\bfree\b/i.test(n))           return 'Free';
  return '';
}

function _renderParkingTile(def, type, subtype, fee, ruleClass) {
  const typeLabel = PARKING_TYPE_LABEL[type] || PARKING_SUBTYPE_LABEL[subtype] || '';
  const costLabel = fee === true ? 'Paid' : fee === false ? 'Free' : '';
  const sub = [typeLabel, costLabel].filter(Boolean).join(' · ');
  return `<div class="amenity${ruleClass || ''}">
    <span class="amenity-icon">${def.icon}</span>
    <span class="amenity-text">
      <span class="amenity-label">${def.label}</span>
      ${sub ? `<span class="amenity-sub">${escHtml(sub)}</span>` : ''}
    </span>
  </div>`;
}

function _renderAmenityTile(def, amenities) {
  return _renderAmenityTileWithRule(def, amenities, null);
}

// Section-tile and amenity-tile renderer with optional rule color.
// rule: 'off_leash' | 'on_leash' | 'not_allowed' | 'unknown' | null
function _renderAmenityTileWithRule(def, amenities, rule) {
  const ruleClass = rule ? ` rule-${rule}` : '';
  // Section-only tile (e.g. Sand, Trails) — no amenity boolean,
  // just emoji + label + rule color.
  if (def.sectionName) {
    return `<div class="amenity${ruleClass}">
      <span class="amenity-icon">${def.icon}</span>
      <span class="amenity-label">${def.label}</span>
    </div>`;
  }
  if (def.key === 'has_parking') {
    if (Array.isArray(amenities?.parking_options) && amenities.parking_options.length > 0) {
      return amenities.parking_options
        .map(opt => _renderParkingTile(def, opt.type, opt.subtype, opt.fee, ruleClass))
        .join('');
    }
    return _renderParkingTile(def,
      amenities?.parking_type, amenities?.parking_subtype,
      _parkingCostLabel(amenities) === 'Paid' ? true
        : _parkingCostLabel(amenities) === 'Free' ? false : null,
      ruleClass);
  }
  // Lifeguards always render with the "Seasonal" sublabel — staffing is
  // seasonal at almost every US beach, never year-round (see
  // [[lifeguards-seasonal-not-on-duty]]).
  if (def.key === 'has_lifeguards') {
    return `<div class="amenity${ruleClass}">
      <span class="amenity-icon">${def.icon}</span>
      <span class="amenity-text">
        <span class="amenity-label">${def.label}</span>
        <span class="amenity-sub">Seasonal</span>
      </span>
    </div>`;
  }
  return `<div class="amenity${ruleClass}">
    <span class="amenity-icon">${def.icon}</span>
    <span class="amenity-label">${def.label}</span>
  </div>`;
}

// Map zone-rules section names to amenity keys when they refer to the
// same physical thing. Used for dedup when merging the two lists.
const _SECTION_TO_AMENITY = {
  parking_lot:       'has_parking',
  restrooms:         'has_restrooms',
  restrooms_showers: 'has_restrooms',
  showers:           'has_showers',
  picnic_area:       'has_picnic_area',
};
// Zone-rules sections that aren't represented in AMENITY_DEFS. Each
// gets its own tile, sourced from zone_rules with the dog-policy rule
// as the background color.
const _SECTION_TILE = {
  sand:           { icon: '🏖️', label: 'Sand' },
  trails:         { icon: '🥾', label: 'Trails' },
  water_swim:     { icon: '🌊', label: 'Water' },
  dunes:          { icon: '🏜️', label: 'Dunes' },
  bluff:          { icon: '🏔️', label: 'Bluff' },
  boardwalk:      { icon: '🚶', label: 'Boardwalk' },
  campground:     { icon: '🏕️', label: 'Campground' },
  playground:     { icon: '🤸', label: 'Playground' },
  tide_pools:     { icon: '🐚', label: 'Tide pools' },
  nesting_zones:  { icon: '🪺', label: 'Nesting zones' },
};

// Walk zone_rules and return a map of {sectionName -> mostRestrictiveRule}.
// "Most restrictive" priority: not_allowed > on_leash > off_leash > unknown.
// Multi-region beaches collapse to one rule per section using this priority.
function _ruleMapFromZoneRules(zr) {
  const RANK = { not_allowed: 3, on_leash: 2, off_leash: 1, unknown: 0 };
  const out = {};
  const seasons = (Array.isArray(zr?.seasons) && zr.seasons.length)
    ? zr.seasons
    : (Array.isArray(zr?.regions) ? [{ regions: zr.regions }] : []);
  for (const s of seasons) {
    const regs = Array.isArray(s.regions) ? s.regions : [];
    for (const r of regs) {
      const secs = r?.sections || {};
      for (const [name, sec] of Object.entries(secs)) {
        const rule = sec?.rule || 'unknown';
        if (!out[name] || (RANK[rule] ?? 0) > (RANK[out[name]] ?? 0)) {
          out[name] = rule;
        }
      }
    }
  }
  return out;
}

// Get the list of regions from zone_rules. Returns [] if none.
function _zrRegions(zr) {
  if (!zr) return [];
  const seasons = (Array.isArray(zr.seasons) && zr.seasons.length)
    ? zr.seasons
    : (Array.isArray(zr.regions) ? [{ regions: zr.regions }] : []);
  const out = [];
  for (const s of seasons) {
    const regs = Array.isArray(s.regions) ? s.regions : [];
    for (const r of regs) out.push(r);
  }
  return out;
}

// Filter the visible AMENITY_DEFS list (the has_X=true / parking-data
// tiles) into one flat array.
function _visibleAmenityTiles(amenities) {
  if (!amenities) return [];
  return AMENITY_DEFS.map((d, i) => ({ ...d, _i: i })).filter(d => {
    if (amenities[d.key] === true) return true;
    if (d.key === 'has_parking') {
      return (Array.isArray(amenities.parking_options) && amenities.parking_options.length > 0)
          || (amenities.parking_fee != null) || amenities.parking_subtype
          || amenities.parking_type || amenities.parking_notes;
    }
    return false;
  });
}

// Render a tile array. Sort: most-favorable-to-dogs first
// (off_leash → on_leash → unknown/no-rule → not_allowed), parking
// first within the same favorability bucket, then label length.
const _DOG_FAVOR = { off_leash: 0, on_leash: 1, unknown: 2, not_allowed: 3 };
function _renderTileSet(tiles, amenities, ruleFor) {
  const decorated = tiles.map(d => ({
    d,
    rule: ruleFor ? ruleFor(d) : null,
    favor: _DOG_FAVOR[(ruleFor ? ruleFor(d) : null) ?? 'unknown'] ?? 2,
  }));
  decorated.sort((a, b) => {
    if (a.favor !== b.favor) return a.favor - b.favor;
    if (a.d.key === 'has_parking') return -1;
    if (b.d.key === 'has_parking') return 1;
    const la = a.d.label.length, lb = b.d.label.length;
    return la === lb ? a.d._i - b.d._i : la - lb;
  });
  return decorated.map(x => _renderAmenityTileWithRule(x.d, amenities, x.rule)).join('');
}

function buildAmenitiesSection(amenities, dogPolicy) {
  if (!amenities && !dogPolicy?.zone_rules) return '';
  const regions = _zrRegions(dogPolicy?.zone_rules);

  // Build the all-zones amenity tiles (has_X=true items not tied to
  // a specific zone) — lifeguards, drinking_water, fire_pits, food,
  // ADA. Zone-tied amenities (parking, restrooms, showers, picnic_area)
  // appear under their zones; pull them out here.
  const zoneTiedKeys = new Set(Object.values(_SECTION_TO_AMENITY));
  const allAmenityTiles = _visibleAmenityTiles(amenities);
  const sharedAmenityTiles = allAmenityTiles.filter(t => !zoneTiedKeys.has(t.key));
  const zoneTiedAmenityTiles = allAmenityTiles.filter(t => zoneTiedKeys.has(t.key));

  // SINGLE-ZONE (or no zone_rules) — collapse to one grid.
  if (regions.length <= 1) {
    const ruleMap = _ruleMapFromZoneRules(dogPolicy?.zone_rules || {});
    const sectionTiles = [];
    for (const [secName, rule] of Object.entries(ruleMap)) {
      if (_SECTION_TO_AMENITY[secName]) continue;
      const tile = _SECTION_TILE[secName];
      if (!tile) continue;
      sectionTiles.push({
        key: `section:${secName}`, icon: tile.icon, label: tile.label,
        sectionName: secName,
        _i: 100 + Object.keys(_SECTION_TILE).indexOf(secName),
      });
    }
    const all = [...allAmenityTiles, ...sectionTiles];
    if (!all.length) return '';
    const ruleFor = d => {
      if (d.sectionName) return ruleMap[d.sectionName];
      const matching = Object.entries(_SECTION_TO_AMENITY)
        .find(([sec, key]) => key === d.key)?.[0];
      return matching ? ruleMap[matching] : null;
    };
    const cells = _renderTileSet(all, amenities, ruleFor);
    return `<section class="card">
      <h2>Amenities</h2>
      <div class="amenity-grid">${cells}</div>
    </section>`;
  }

  // MULTI-ZONE: shared amenities at top, then per-zone groups with
  // header labels. Zone-tied amenities (parking/restrooms/showers/
  // picnic_area) appear under each zone that has the matching section.
  const blocks = [];
  if (sharedAmenityTiles.length) {
    blocks.push(`<div class="amenity-grid">${_renderTileSet(sharedAmenityTiles, amenities, null)}</div>`);
  }
  for (const reg of regions) {
    const secs = reg?.sections || {};
    const secEntries = Object.entries(secs);
    if (!secEntries.length) continue;
    const ruleHere = name => secs[name]?.rule || 'unknown';
    // Tiles for THIS region only:
    //  - zone-tied amenity tiles where the matching section is in this region
    //  - section-only tiles for everything else in this region
    const tilesForRegion = [];
    for (const t of zoneTiedAmenityTiles) {
      const matchingSection = Object.entries(_SECTION_TO_AMENITY)
        .find(([sec, key]) => key === t.key)?.[0];
      if (matchingSection && secs[matchingSection]) tilesForRegion.push(t);
    }
    for (const [name] of secEntries) {
      if (_SECTION_TO_AMENITY[name]) continue;
      const t = _SECTION_TILE[name];
      if (!t) continue;
      tilesForRegion.push({
        key: `section:${name}`, icon: t.icon, label: t.label,
        sectionName: name,
        _i: 100 + Object.keys(_SECTION_TILE).indexOf(name),
      });
    }
    if (!tilesForRegion.length) continue;
    const zoneName = reg.name || 'Whole beach';
    const ruleFor = d => {
      if (d.sectionName) return ruleHere(d.sectionName);
      const matching = Object.entries(_SECTION_TO_AMENITY)
        .find(([sec, key]) => key === d.key)?.[0];
      return matching ? ruleHere(matching) : null;
    };
    blocks.push(`
      <div class="amenity-zone-header">${escHtml(zoneName)}</div>
      <div class="amenity-grid">${_renderTileSet(tilesForRegion, amenities, ruleFor)}</div>`);
  }

  if (!blocks.length) return '';
  return `<section class="card">
    <h2>Amenities</h2>
    ${blocks.join('')}
  </section>`;
}


// _renderSectionPill / _renderTimeCell / _renderZoneCard /

// ─── Weather card ────────────────────────────────────────────────
// Live against Open-Meteo (forecast) + NOAA CO-OPS (tides). No cache.
// Renders empty mount; loadWeather() fills it after fetch.

// WMO weather code → emoji + label.
const WMO_ICON = {
  0:['☀️','Clear'], 1:['🌤️','Mostly sunny'], 2:['⛅','Partly cloudy'], 3:['☁️','Overcast'],
  45:['🌫️','Fog'], 48:['🌫️','Fog'],
  51:['🌦️','Drizzle'], 53:['🌦️','Drizzle'], 55:['🌦️','Drizzle'],
  61:['🌧️','Light rain'], 63:['🌧️','Rain'], 65:['🌧️','Heavy rain'],
  71:['🌨️','Snow'], 73:['🌨️','Snow'], 75:['🌨️','Heavy snow'],
  80:['🌧️','Showers'], 81:['🌧️','Showers'], 82:['🌧️','Heavy showers'],
  95:['⛈️','Thunderstorm'], 96:['⛈️','Thunderstorm'], 99:['⛈️','Thunderstorm'],
};
function wmoIcon(code) { return (WMO_ICON[code] || ['🌡️','—'])[0]; }
function wmoLabel(code) { return (WMO_ICON[code] || ['🌡️','—'])[1]; }

function buildWeatherSection(beach) {
  const tideMount = beach.noaa_station_id
    ? `<div id="tide-mount" class="weather-loading">Loading tides…</div>`
    : '';
  return `<section class="card weather-card">
    <h2>Weather and Tides</h2>
    <div id="weather-mount" class="weather-loading">Loading conditions…</div>
    ${tideMount}
  </section>`;
}

function _fmtTideTime(iso) {
  const d = new Date(iso);
  const hh = d.getHours(), mm = d.getMinutes();
  const h = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh;
  const ap = hh >= 12 ? 'pm' : 'am';
  return mm ? `${h}:${String(mm).padStart(2,'0')}${ap}` : `${h}${ap}`;
}

function _renderWeatherToday(forecast) {
  const mount = document.getElementById('weather-mount');
  if (!mount) return;
  const f = forecast;
  const code  = f.current?.weather_code ?? f.daily.weather_code[0];
  const temp  = f.current?.temperature_2m != null
    ? Math.round(f.current.temperature_2m)
    : Math.round(f.daily.temperature_2m_max[0]);
  const wind  = f.current?.wind_speed_10m != null
    ? Math.round(f.current.wind_speed_10m)
    : Math.round(f.daily.wind_speed_10m_max[0]);
  const uvMax = f.daily.uv_index_max?.[0];
  const uvNow = f.current?.uv_index;
  const uv    = uvNow != null ? uvNow : uvMax;
  const chips = [
    `<span class="weather-chip">🌡 ${temp}°</span>`,
    `<span class="weather-chip">💨 ${wind} mph</span>`,
    uv != null ? `<span class="weather-chip">☀️ UV ${parseFloat(uv).toFixed(1)}</span>` : '',
  ].filter(Boolean).join('');
  mount.innerHTML = `<div class="weather-now">
    <div class="weather-now-cond" title="${escHtml(wmoLabel(code))}"
         aria-label="${escHtml(wmoLabel(code))}">${wmoIcon(code)}</div>
    <div class="weather-chips">${chips}</div>
  </div>`;
  mount.classList.remove('weather-loading');
}

function _renderTidesToday(tides, forecast) {
  const mount = document.getElementById('tide-mount');
  if (!mount) return;
  // NOAA can return predictions that include trailing hours from the
  // next day. Filter to today's local date prefix so the polyline
  // doesn't wrap around (a 24th point dated tomorrow lands back at
  // x=0 and produces a stray diagonal across the whole chart).
  const _today = new Date();
  const _y = _today.getFullYear(),
        _m = String(_today.getMonth()+1).padStart(2,'0'),
        _d = String(_today.getDate()).padStart(2,'0');
  const _todayStr = `${_y}-${_m}-${_d}`;
  const hourly = (tides?.hourly || []).filter(p => p?.t && p.t.startsWith(_todayStr));
  const hilo   = (tides?.hilo   || []).filter(p => p?.t && p.t.startsWith(_todayStr));
  if (!Array.isArray(hourly) || hourly.length === 0) {
    // Fall back to hilo-only text if we got hilo but no hourly.
    if (Array.isArray(hilo) && hilo.length) {
      const rows = hilo.slice(0,4).map(p => `
        <span>${p.type === 'H' ? '⬆' : '⬇'} <strong>${_fmtTideTime(p.t.replace(' ','T'))}</strong> · ${parseFloat(p.v).toFixed(1)}ft</span>`).join('');
      mount.innerHTML = `<div class="tide-events">${rows}</div>`;
    } else {
      mount.innerHTML = `<div class="tide-empty">Tide predictions unavailable.</div>`;
    }
    mount.classList.remove('weather-loading');
    return;
  }

  // Infographic SVG: one tide line, hi/lo text markers, NOW dot,
  // zero-ft reference, hour axis at bottom. Hover anywhere on the
  // curve to see exact time + height (interactive crosshair).
  const W = 280, H = 130, padTop = 22, padBottom = 24;
  const minV = Math.min(...hourly.map(p => parseFloat(p.v)));
  const maxV = Math.max(...hourly.map(p => parseFloat(p.v)));
  const rng  = Math.max(maxV - minV, 0.5);

  const xOf = (t) => {
    const hh = parseInt(t.slice(11,13), 10);
    const mm = parseInt(t.slice(14,16), 10);
    return ((hh + mm/60) / 24) * W;
  };
  const yOf = (v) => H - padBottom - ((parseFloat(v) - minV) / rng) * (H - padTop - padBottom);

  // Single smooth polyline through the hourly points. Tides are
  // naturally smooth so straight segments + stroke-linejoin:round
  // look very close to a sine curve without bezier artifacts.
  const pts = hourly.map(p => ({ x: xOf(p.t), y: yOf(p.v) }));
  const line = 'M ' + pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L ');

  // Hi/lo markers — borderless text only. Includes a <title> for
  // native browser hover showing time + height.
  const markersHtml = Array.isArray(hilo) ? hilo.slice(0,4).map(p => {
    const x = xOf(p.t), y = yOf(p.v);
    const arrow = p.type === 'H' ? '↑' : '↓';
    const heightStr = `${parseFloat(p.v).toFixed(1)}ft`;
    const timeStr = _fmtTideTime(p.t.replace(' ','T'));
    const txtY = p.type === 'H' ? Math.max(y - 6, padTop) : Math.min(y + 14, H - padBottom - 4);
    return `
      <text x="${x.toFixed(1)}" y="${txtY.toFixed(1)}" text-anchor="middle">
        <title>${p.type === 'H' ? 'High tide' : 'Low tide'} · ${escHtml(timeStr)} · ${heightStr}</title>
        <tspan class="tide-marker-arrow">${arrow}</tspan>
        <tspan class="tide-marker-text" dx="2">${heightStr}</tspan>
      </text>`;
  }).join('') : '';

  // Zero-tide horizontal reference line (only if 0 is within the
  // visible range; some lake beaches sit far above MLLW).
  const zeroY = yOf(0);
  const zeroLine = (zeroY >= padTop && zeroY <= H - padBottom)
    ? `<line x1="0" y1="${zeroY.toFixed(1)}" x2="${W}" y2="${zeroY.toFixed(1)}" class="tide-zero-line"/>
       <text x="${W - 4}" y="${(zeroY - 2).toFixed(1)}" text-anchor="end" class="tide-zero-label">0 ft</text>`
    : '';

  // Hour scale along the bottom (12am, 6am, 12pm, 6pm)
  const hourLabels = [0, 6, 12, 18].map(h => {
    const x = (h / 24) * W;
    const lbl = h === 0 ? '12am' : h === 12 ? '12pm' : (h < 12 ? `${h}am` : `${h-12}pm`);
    const anchor = h === 0 ? 'start' : (h === 18 ? 'end' : 'middle');
    return `<text x="${x.toFixed(1)}" y="${H - 4}" text-anchor="${anchor}" class="tide-hour-axis-label">${lbl}</text>`;
  }).join('');

  // NOW marker — filled dot + "NOW" label, with hover title.
  const now = new Date();
  const nowHour = now.getHours() + now.getMinutes()/60;
  const nowX = (nowHour / 24) * W;
  const iLo = Math.floor(nowHour);
  const iHi = Math.min(iLo + 1, pts.length - 1);
  const frac = nowHour - iLo;
  const nowY = (pts[iLo]?.y ?? padTop) * (1 - frac) + (pts[iHi]?.y ?? padTop) * frac;
  const nowHeight = (parseFloat(hourly[iLo]?.v ?? 0) * (1 - frac)
                  + parseFloat(hourly[iHi]?.v ?? 0) * frac).toFixed(1);
  const nowMarker = `
    <circle cx="${nowX.toFixed(1)}" cy="${nowY.toFixed(1)}" r="4" class="tide-now-dot">
      <title>Now · ${nowHeight}ft</title>
    </circle>
    <text x="${nowX.toFixed(1)}" y="${(nowY - 9).toFixed(1)}" text-anchor="middle" class="tide-now-label">NOW</text>`;

  // Precompute 48 static hover zones (one per 30-min bucket). Each
  // is an invisible rect carrying a native SVG <title> with the
  // bucket-center time + interpolated tide height. Zero JS handlers,
  // zero per-frame compute — browser handles the tooltip natively.
  const zonesHtml = (() => {
    const out = [];
    const zoneW = W / 48;
    for (let z = 0; z < 48; z++) {
      const hourFloat = z * 0.5;             // 0.0, 0.5, 1.0, ... 23.5
      const iLo = Math.min(Math.floor(hourFloat), pts.length - 1);
      const iHi = Math.min(iLo + 1, pts.length - 1);
      const f   = hourFloat - iLo;
      const v   = parseFloat(hourly[iLo].v) * (1 - f) + parseFloat(hourly[iHi].v) * f;
      const hh  = Math.floor(hourFloat);
      const mm  = (hourFloat % 1) === 0 ? 0 : 30;
      const ap  = hh >= 12 ? 'pm' : 'am';
      const h12 = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh;
      const tip = `${h12}:${String(mm).padStart(2,'0')}${ap} · ${v.toFixed(1)}ft`;
      out.push(`<rect x="${(z * zoneW).toFixed(2)}" y="${padTop}"
                      width="${zoneW.toFixed(2)}" height="${H - padTop - padBottom}"
                      class="tide-hover-zone"><title>${tip}</title></rect>`);
    }
    return out.join('');
  })();

  mount.innerHTML = `
    <svg class="tide-curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${zeroLine}
      <path d="${line}" class="tide-stroke"/>
      ${markersHtml}
      ${nowMarker}
      ${hourLabels}
      ${zonesHtml}
    </svg>`;
  mount.classList.remove('weather-loading');
}

async function loadWeather(beach) {
  const weatherMount = document.getElementById('weather-mount');
  const tideMount    = document.getElementById('tide-mount');
  if (!weatherMount || beach.lat == null || beach.lng == null) {
    if (weatherMount) weatherMount.parentElement.remove();
    if (tideMount)    tideMount.parentElement.remove();
    return;
  }
  const tz = beach.timezone || 'auto';
  // Today only — drop forecast_days to 1.
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${beach.lat}&longitude=${beach.lng}`
    + `&current=temperature_2m,weather_code,wind_speed_10m,uv_index`
    + `&daily=temperature_2m_max,temperature_2m_min,weather_code,wind_speed_10m_max,precipitation_sum,uv_index_max`
    + `&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch`
    + `&timezone=${encodeURIComponent(tz)}&forecast_days=1`;
  try {
    const [forecast, tides] = await Promise.all([
      fetch(url).then(r => r.json()),
      beach.noaa_station_id ? _fetchTides(beach.noaa_station_id) : Promise.resolve(null),
    ]);
    _renderWeatherToday(forecast);
    if (tideMount) _renderTidesToday(tides, forecast);
  } catch (e) {
    console.warn('weather fetch failed:', e);
    weatherMount.textContent = 'Weather unavailable right now.';
  }
}

async function _fetchTides(stationId) {
  // Fetch BOTH the hourly height curve and the hi/lo event markers
  // for today (24h). Hourly drives the SVG curve; hilo drives the
  // text-event row + the marker dots.
  const today = new Date();
  const y = today.getFullYear(), m = String(today.getMonth()+1).padStart(2,'0'), d = String(today.getDate()).padStart(2,'0');
  const base = `https://api.tidesandcurrents.noaa.gov/api/prod/datagetter`
    + `?station=${encodeURIComponent(stationId)}&product=predictions`
    + `&begin_date=${y}${m}${d}&range=24&datum=MLLW&units=english&time_zone=lst_ldt&format=json`;
  try {
    const [hourly, hilo] = await Promise.all([
      fetch(`${base}&interval=h`).then(r => r.ok ? r.json() : null).catch(() => null),
      fetch(`${base}&interval=hilo`).then(r => r.ok ? r.json() : null).catch(() => null),
    ]);
    return {
      hourly: hourly?.predictions ?? null,
      hilo:   hilo?.predictions   ?? null,
    };
  } catch { return null; }
}

// Beach overview card. Title = beach display name. Carries the
// LLM static description + async Scout narrative. The best-window
// info lives in its own card (buildBestTimeCard).
function buildOverviewCard(beach, description) {
  const blurb = description?.text;
  if (!blurb) return '';
  return `<section class="card overview-card">
    <h2>${escHtml(beach.display_name || beach.name || 'Beach')}</h2>
    <div class="overview-blurb">${escHtml(blurb)}</div>
  </section>`;
}

// Best-window card — standalone, all black text. Status pill keeps
// its tinted background for the at-a-glance signal but pill text is
// black for typographic consistency.
// Hourly score bar — ports detail.html's score row exactly: one
// .score-bar-col per hour with the score value above, dog icon for
// hours in the best window, status-color fill, and x-axis labels
// every other hour.
function _renderScoreBars(hoursToday) {
  if (!Array.isArray(hoursToday) || hoursToday.length === 0) return '';
  // Filter to daylight hours only — show hours that have a real
  // computed status. Sort by hour ASC.
  const hours = hoursToday
    .filter(h => h.hour_status && h.hour_score != null)
    .sort((a, b) => a.local_hour - b.local_hour);
  if (hours.length === 0) return '';

  const MAX_PX = 22; // bar max height in CSS px
  const scores = hours.map(h => h.hour_score);
  const maxV = Math.max(...scores, 1);
  // Three colors only. Conditions-domain amber is burnt (amber-500
  // nudged ~7% toward red) so it's visually distinct from the amber-400
  // (yellow-leaning) the Amenities on_leash tile uses. Best-window
  // hours share the same green hue but solid, for emphasis.
  const colorFor = h => h.hour_status === 'no_go'   ? 'rgba(239,68,68,0.45)'
                     : h.hour_status === 'caution' ? 'rgba(247,140,18,0.53)'
                     : h.is_in_best_window         ? 'rgba(34,197,94,1.0)'
                     :                               'rgba(34,197,94,0.45)';
  const fmtHour = hh => {
    const ap = hh >= 12 ? 'pm' : 'am';
    const h12 = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh;
    return `${h12}${ap}`;
  };

  const barsHtml = hours.map(h => {
    const pct = Math.max(h.hour_score / maxV, 0.05);
    const px  = Math.round(pct * MAX_PX);
    const dog = h.is_in_best_window ? '🐶' : '';
    return `
      <div class="score-bar-col" title="${fmtHour(h.local_hour)} · ${Math.round(h.hour_score)} · ${h.hour_status}">
        <div class="score-bar-dog">${dog}</div>
        <div class="score-bar-value">${Math.round(h.hour_score)}</div>
        <div class="score-bar" style="height:${px}px; background:${colorFor(h)};"></div>
      </div>`;
  }).join('');

  const xAxisHtml = hours.map((h, i) =>
    `<div class="score-x-label">${(i % 2 === 0) ? fmtHour(h.local_hour) : ''}</div>`
  ).join('');

  return `<div class="score-row">
    <div class="score-row-label">Score</div>
    <div class="score-bars-wrap">${barsHtml}</div>
    <div class="score-x-axis">${xAxisHtml}</div>
  </div>`;
}

function buildBestTimeCard(today, dogPolicy, beachFid, hoursToday) {
  const hasWindow = today && today.best_window_label;
  const isNoDogs = !!dogPolicy && (
    dogPolicy.dogs_allowed === 'no' ||
    (dogPolicy.has_on_leash === false && dogPolicy.has_off_leash === false)
  );
  const isSandWaterProhibited = _sandOrWaterProhibited(dogPolicy?.zone_rules);
  // Card shows when there's a window OR an apology to convey.
  if (!hasWindow && !isNoDogs && !isSandWaterProhibited) return '';

  // Clickable when hourly detail is available. day_status presence
  // implies the hourly_scores row was computed, so detail.html will
  // render. Skip the clickable affordance when there's no hourly.
  const clickable = !!(today && today.day_status);
  const clickAttr = clickable ? ' data-open-detail="1"' : '';

  let headerRow = '';
  if (hasWindow) {
    headerRow = `<div class="besttime-row">
      <span class="besttime-time"${clickAttr}>${escHtml(today.best_window_label)}</span>
      <span class="besttime-sep">-</span>
      <span class="besttime-text">Best Times Today</span>
    </div>`;
  }
  const scoreBars = _renderScoreBars(hoursToday);
  return `<section class="card besttime-card${clickable ? ' clickable' : ''}" data-fid="${beachFid}">
    ${headerRow}
    <div id="scout-blurb">…</div>
    ${scoreBars}
  </section>`;
}

// Lazily-mounted detail modal — iframe to detail.html for the per-hour
// bar charts. One modal element reused across clicks; appended to body
// the first time we need it.
function _ensureDetailModal() {
  let m = document.getElementById('detail-modal');
  if (m) return m;
  m = document.createElement('div');
  m.id = 'detail-modal';
  m.className = 'detail-modal';
  m.innerHTML = `
    <div class="detail-modal-inner">
      <button class="detail-modal-close" type="button" aria-label="Close">×</button>
      <iframe src="about:blank" loading="lazy"></iframe>
    </div>`;
  document.body.appendChild(m);
  const close = () => {
    m.classList.remove('open');
    // Blank the iframe so audio/animations stop.
    m.querySelector('iframe').src = 'about:blank';
  };
  m.querySelector('.detail-modal-close').addEventListener('click', close);
  m.addEventListener('click', e => { if (e.target === m) close(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && m.classList.contains('open')) close();
  });
  return m;
}

function _wireBestTimeClick() {
  const card = document.querySelector('.besttime-card.clickable');
  if (!card) return;
  const fid = card.dataset.fid;
  const open = (e) => {
    if (!e.target.closest('[data-open-detail]')) return;
    e.preventDefault();
    const today = new Date().toISOString().slice(0, 10);
    const m = _ensureDetailModal();
    m.querySelector('iframe').src = `detail.html?fid=${fid}&date=${today}&embed=charts`;
    m.classList.add('open');
  };
  card.addEventListener('click', open);
}

// Advisories card — per-metric advisory/caution/no_go time blocks
// derived from hours_today. Ports detail.html's status-board logic
// into a left-rail card with consistent style. Also surfaces day-level
// signals (bacteria_risk, seasonal dog closure) at the top.
function buildCautionsSection(today, dogPolicy, hoursToday) {
  // Day-level signals (already aggregated by daily-refresh)
  const dayItems = [];
  if (today?.bacteria_risk && today.bacteria_risk !== 'none' && today.bacteria_risk !== 'low') {
    dayItems.push({ status: 'caution', icon: '🦠', label: 'Bacteria',
                    value: today.bacteria_risk, time: '' });
  }
  if (dogPolicy?.dogs_prohibited_start && dogPolicy?.dogs_prohibited_end) {
    dayItems.push({ status: 'no_go', icon: '🚫', label: 'Dogs prohibited',
                    value: `${dogPolicy.dogs_prohibited_start}–${dogPolicy.dogs_prohibited_end}`, time: '' });
  }

  // Per-metric time-block items from hours_today
  const METRICS = [
    { icon: '🌊',  label: 'Tide',    statusKey: 'tide_status',    valueKey: 'tide_height',    fmt: v => v != null ? `${v.toFixed(1)} ft` : '—' },
    { icon: '💨',  label: 'Wind',    statusKey: 'wind_status',    valueKey: 'wind_speed',     fmt: v => v != null ? `${Math.round(v)} mph` : '—' },
    { icon: '🌧️', label: 'Rain',    statusKey: 'rain_status',    valueKey: 'precip_chance',  fmt: v => v != null ? `${Math.round(v)}%` : '—' },
    { icon: '👥',  label: 'Crowd',   statusKey: 'crowd_status',   valueKey: 'busyness_score', fmt: v => v != null ? `${Math.round(v)}/100` : '—' },
    { icon: '🌡',  label: 'Temp',    statusKey: 'temp_status',    valueKey: 'temp_air',       fmt: v => v != null ? `${Math.round(v)}°F` : '—' },
    { icon: '☀️',  label: 'UV',      statusKey: 'uv_status',      valueKey: 'uv_index',       fmt: v => v != null ? `UV ${v.toFixed(1)}` : '—' },
    { icon: '🏖️', label: 'Sand',    statusKey: 'sand_status',    valueKey: 'sand_temp',      fmt: v => v != null ? `${Math.round(v)}°F` : '—' },
    { icon: '🚶',  label: 'Asphalt', statusKey: 'asphalt_status', valueKey: 'asphalt_temp',   fmt: v => v != null ? `${Math.round(v)}°F` : '—' },
  ];
  const STATUS_RANK = { no_go: 3, caution: 2, advisory: 1 };
  const fmtH = h => h === 0 ? '12am' : h === 12 ? '12pm' : (h < 12 ? `${h}am` : `${h-12}pm`);
  const getBlocks = flagged => {
    if (!flagged.length) return [];
    const blocks = [[flagged[0]]];
    for (let i = 1; i < flagged.length; i++) {
      if (flagged[i].local_hour === flagged[i-1].local_hour + 1) blocks[blocks.length-1].push(flagged[i]);
      else blocks.push([flagged[i]]);
    }
    return blocks;
  };

  const metricItems = [];
  if (Array.isArray(hoursToday) && hoursToday.length) {
    for (const m of METRICS) {
      // Cautions card surfaces only caution + no_go (advisory excluded).
      const flagged = hoursToday.filter(h => h[m.statusKey] === 'caution' || h[m.statusKey] === 'no_go');
      if (!flagged.length) continue;
      let blocks = getBlocks(flagged);
      if (blocks.length >= 3) {
        blocks = blocks.slice().sort((a,b) => b.length - a.length).slice(0, 2)
                       .sort((a,b) => a[0].local_hour - b[0].local_hour);
      }
      const allHours = blocks.flat();
      const worst = allHours.reduce((w, h) => {
        const s = h[m.statusKey];
        return (STATUS_RANK[s] ?? 0) > (STATUS_RANK[w] ?? 0) ? s : w;
      }, 'caution');
      const vals = allHours.map(h => h[m.valueKey]).filter(v => v != null);
      const worstVal = vals.length
        ? (m.label === 'Temp' ? vals.reduce((a, b) => Math.abs(b - 72) > Math.abs(a - 72) ? b : a, vals[0])
                              : Math.max(...vals))
        : null;
      const times = blocks.map(b => `${fmtH(b[0].local_hour)}–${fmtH(b[b.length-1].local_hour + 1)}`).join(', ');
      metricItems.push({ status: worst, icon: m.icon, label: m.label,
                         value: m.fmt(worstVal), time: times });
    }
  }

  // Combined list, sorted: highest severity first, then label alphabetical.
  const items = [...dayItems, ...metricItems].sort(
    (a, b) => (STATUS_RANK[b.status] ?? 0) - (STATUS_RANK[a.status] ?? 0)
           || a.label.localeCompare(b.label));
  if (!items.length) return '';
  const rows = items.map(it => `
    <li class="advisory-row advisory-${it.status}">
      <span class="advisory-icon">${it.icon}</span>
      <span class="advisory-body">
        <span class="advisory-headline">
          <span class="advisory-label">${escHtml(it.label)}</span>
          <span class="advisory-value">${escHtml(it.value)}</span>
        </span>
        ${it.time ? `<span class="advisory-time">${escHtml(it.time)}</span>` : ''}
      </span>
    </li>`).join('');
  return `<section class="card cautions-card">
    <h2>Cautions</h2>
    <ul class="advisory-list">${rows}</ul>
  </section>`;
}

// Scout blurb — narrative paragraph from beach-chat (Anthropic LLM)
// describing today's conditions. Short-circuits to canned apologies
// when dogs aren't allowed / sand prohibited / no good windows.
async function loadScoutBlurb(beach, today, dogPolicy) {
  const el = document.getElementById('scout-blurb');
  if (!el) return;

  const isNoDogs = !!dogPolicy && (
    dogPolicy.dogs_allowed === 'no' ||
    (dogPolicy.has_on_leash === false && dogPolicy.has_off_leash === false)
  );
  const isSandWaterProhibited = _sandOrWaterProhibited(dogPolicy?.zone_rules);
  const noGoodWindows = today && today.day_status === 'no_go';

  if (isNoDogs) {
    el.textContent = "Sorry bud — dogs aren't allowed here. Check the alternatives below for a nearby spot that welcomes pups.";
    el.classList.add('loaded'); return;
  }
  if (isSandWaterProhibited) {
    el.textContent = "Sorry bud — dogs aren't allowed on the sand or in the water here. Check the alternatives below for a beach where pups can actually hit the surf.";
    el.classList.add('loaded'); return;
  }
  if (!today) {
    // Non-scoreable / no recommendation today. The element lives
    // inside the Best Time card; leave a soft note when present.
    el.textContent = '';
    return;
  }
  if (noGoodWindows) {
    el.textContent = "Today's looking rough at this beach — no go-quality hours. Check the alternatives below if you can travel.";
    el.classList.add('loaded'); return;
  }

  const windowLabel  = today.best_window_label  ?? 'the best window';
  const windowStatus = today.best_window_status ?? 'go';
  const signals = [
    today.lowest_tide_height != null ? `tide ${parseFloat(today.lowest_tide_height).toFixed(1)}ft` : null,
    today.avg_wind  != null ? `wind ${Math.round(today.avg_wind)}mph` : null,
    today.avg_temp  != null ? `temp ${Math.round(today.avg_temp)}°F` : null,
    today.avg_uv    != null ? `UV index ${parseFloat(today.avg_uv).toFixed(1)}` : null,
    today.busyness_category ? `crowds: ${today.busyness_category}` : null,
    today.bacteria_risk && today.bacteria_risk !== 'none' ? `bacteria risk: ${today.bacteria_risk}` : null,
  ].filter(Boolean).join(', ');

  const question =
    `Best window: ${windowLabel} (${windowStatus}). Conditions: ${signals}. ` +
    `Write 1-2 short sentences of flowing prose — no headers, no bullets, no lists, no pack list, no gear recommendations: ` +
    `Sentence 1: when the best window is and the main reason why, using vivid descriptive language not raw numbers. ` +
    `Sentence 2 (optional, skip if conditions are clean): any cautions or advisories during that window. ` +
    `STRICT: respect the DOG POLICY ZONE RULES in the system prompt. Never describe activities (fetch, swim, splashing, off-leash play) in sections marked not_allowed.`;

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/beach-chat`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ arena_group_id: beach.fid, question, conversation_history: [] }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { answer } = await res.json();
    el.textContent = answer || '';
    el.classList.add('loaded');
  } catch (e) {
    console.warn('scout blurb fetch failed:', e);
    el.textContent = '';
  }
}

// True if zone_rules says any of sand/water/dunes/tide_pools is
// 'not_allowed' — the "trails-only beach" pattern.
function _sandOrWaterProhibited(zr) {
  if (!zr || typeof zr !== 'object') return false;
  const seasons = (Array.isArray(zr.seasons) && zr.seasons.length)
    ? zr.seasons
    : (Array.isArray(zr.regions) ? [{ regions: zr.regions }] : []);
  const blocked = ['sand', 'water_swim', 'dunes', 'tide_pools'];
  for (const s of seasons) {
    const regions = Array.isArray(s.regions) ? s.regions : [];
    for (const reg of regions) {
      const sections = reg.sections || {};
      for (const name of blocked) {
        if (sections[name]?.rule === 'not_allowed') return true;
      }
    }
  }
  return false;
}

// Alternatives card — renders when (a) dogs not allowed here, or
// (b) sand/water prohibited (trails-only). Lists top 3 nearby beaches
// from the alternatives array returned by get_beach_info.
function buildAlternativesSection(dogPolicy, alternatives) {
  if (!Array.isArray(alternatives) || alternatives.length === 0) return '';
  const isNoDogs = !!dogPolicy && (
    dogPolicy.dogs_allowed === 'no' ||
    (dogPolicy.has_on_leash === false && dogPolicy.has_off_leash === false)
  );
  const isSandWaterProhibited = _sandOrWaterProhibited(dogPolicy?.zone_rules);
  if (!isNoDogs && !isSandWaterProhibited) return '';

  const alts = alternatives.slice(0, 3);
  const reason = isNoDogs
    ? "Dogs aren't allowed at this beach. Try one of these nearby spots instead."
    : "Dogs can't go on the sand or in the water at this beach. These nearby spots welcome pups in the surf.";

  const rows = alts.map(a => {
    const miles = (a.distance_km || 0) * 0.621371;
    const modes = [];
    if (a.has_off_leash === true) modes.push('off-leash');
    if (a.has_on_leash  === true) modes.push('on-leash');
    return `
      <a class="alt-row" href="beach.html?fid=${a.fid}">
        <div class="alt-row-left">
          <div class="alt-name">${escHtml(a.name)}</div>
          <div class="alt-meta">${miles.toFixed(1)} mi away · ${modes.join(' + ') || 'dogs allowed'}</div>
        </div>
      </a>`;
  }).join('');

  return `<section class="card alt-card">
    <div class="alt-card-header">🐾 Try these instead</div>
    <div class="alt-card-reason">${escHtml(reason)}</div>
    <div class="alt-list">${rows}</div>
  </section>`;
}

function buildDetailsSection(dogPolicy) {
  // Bottom-of-page Details card. Structured / curated facts about the
  // beach. Currently sourced from dog_policy.zone_rules.global_notes
  // (operator + ordinance + sibling context). Distinct from
  // .beach-description which carries the LLM-generated Scout-voice
  // prose at the top of the page.
  const text = dogPolicy?.zone_rules?.global_notes;
  if (!text) return '';
  return `<section class="card">
    <h2>Details</h2>
    <div class="details-prose">${escHtml(text)}</div>
  </section>`;
}

function buildLinksSection(beach, beachFid) {
  const rows = [];
  if (!rows.length) return '';
  return `<section class="card"><h2>More info</h2>${rows.join('')}</section>`;
}


function wireCopyButtons() {
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        btn.classList.add('copied');
        const t = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.classList.remove('copied'); btn.textContent = t; }, 1500);
      } catch {}
    });
  });
}

// Time-window tab click handler now in src/zone-rules-block.js

function initMap(beach) {
  if (beach.lat == null || beach.lng == null) return;
  const map = L.map('map', {
    zoomControl: true, scrollWheelZoom: false,
  }).setView([beach.lat, beach.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a>',
    maxZoom: 19,
  }).addTo(map);
  if (beach.geom?.type === 'Polygon' || beach.geom?.type === 'MultiPolygon') {
    const layer = L.geoJSON(beach.geom, {
      style: { color: '#1d4ed8', weight: 2, fillOpacity: 0.15 },
    }).addTo(map);
    map.fitBounds(layer.getBounds(), { padding: [16, 16] });
  } else {
    L.marker([beach.lat, beach.lng]).addTo(map);
  }
}

load();
