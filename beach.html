const PARKING_TYPE_LABEL = {
  lot: 'Lot', mixed: 'Mixed', metered: 'Metered',
  street: 'Street', none: 'No parking',
};
// OSM-style subtypes — used when parking_type is missing but
// parking_subtype is present (OSM emitter pathway).
const PARKING_SUBTYPE_LABEL = {
  surface: 'Lot', street_side: 'Street', 'multi-storey': 'Garage',
  multi_storey: 'Garage', underground: 'Garage', carports: 'Carport',
  rooftop: 'Rooftop',
};

function _parkingTypeLabel(amenities) {
  // Prefer the LLM enum; fall back to OSM-style subtype mapping.
  if (amenities.parking_type) return PARKING_TYPE_LABEL[amenities.parking_type] || '';
  if (amenities.parking_subtype) return PARKING_SUBTYPE_LABEL[amenities.parking_subtype] || '';
  return '';
}

function _parkingCostLabel(amenities) {
  // Structured signal wins: parking_fee = true → Paid, false → Free.
  if (amenities.parking_fee === true)  return 'Paid';
  if (amenities.parking_fee === false) return 'Free';
  // Fallback: metered is always paid by definition.
  if (amenities.parking_type === 'metered') return 'Paid';
  // Last resort: regex parking_notes prose (LLM-supplied "$5/day" etc).
  const n = String(amenities.parking_notes || '');
  if (/\$|\bfee\b|\bpaid\b/i.test(n)) return 'Paid';
  if (/\bfree\b/i.test(n))           return 'Free';
  return '';
}

const _RULE_TOOLTIP = {
  off_leash:   'Dogs off-leash welcome here',
  on_leash:    'Dogs on-leash here',
  not_allowed: 'Dogs not allowed in this zone',
  unknown:     'Rule unclear — verify on-site',
};

function _amenityTooltip(def, rule) {
  const ruleNote = rule ? ` · ${_RULE_TOOLTIP[rule] || rule}` : '';
  return `${def.label}${ruleNote}`;
}

function _renderParkingTile(def, type, subtype, fee, ruleClass, rule) {
  const typeLabel = PARKING_TYPE_LABEL[type] || PARKING_SUBTYPE_LABEL[subtype] || '';
  const costLabel = fee === true ? 'Paid' : fee === false ? 'Free' : '';
  const sub = [typeLabel, costLabel].filter(Boolean).join(' · ');
  const tip = _amenityTooltip(def, rule) + (sub ? ` · ${sub}` : '');
  return `<div class="amenity${ruleClass || ''}" data-tip="${escHtml(tip)}">
    <span class="amenity-icon">${def.icon}</span>
    <span class="amenity-text">
      <span class="amenity-label">${def.label}</span>
      ${sub ? `<span class="amenity-sub">${escHtml(sub)}</span>` : ''}
    </span>
  </div>`;
}

function _renderAmenityTile(def, amenities) {
  return _renderAmenityTileWithRule(def, amenities, null);
}

// Section-tile and amenity-tile renderer with optional rule color.
// rule: 'off_leash' | 'on_leash' | 'not_allowed' | 'unknown' | null
function _renderAmenityTileWithRule(def, amenities, rule) {
  const ruleClass = rule ? ` rule-${rule}` : '';
  const tip = _amenityTooltip(def, rule);
  // Section-only tile (e.g. Sand, Trails) — no amenity boolean,
  // just emoji + label + rule color.
  if (def.sectionName) {
    return `<div class="amenity${ruleClass}" data-tip="${escHtml(tip)}">
      <span class="amenity-icon">${def.icon}</span>
      <span class="amenity-label">${def.label}</span>
    </div>`;
  }
  if (def.key === 'has_parking') {
    if (Array.isArray(amenities?.parking_options) && amenities.parking_options.length > 0) {
      return amenities.parking_options
        .map(opt => _renderParkingTile(def, opt.type, opt.subtype, opt.fee, ruleClass, rule))
        .join('');
    }
    return _renderParkingTile(def,
      amenities?.parking_type, amenities?.parking_subtype,
      _parkingCostLabel(amenities) === 'Paid' ? true
        : _parkingCostLabel(amenities) === 'Free' ? false : null,
      ruleClass, rule);
  }
  // Lifeguards always render with the "Seasonal" sublabel — staffing is
  // seasonal at almost every US beach, never year-round (see
  // [[lifeguards-seasonal-not-on-duty]]).
  if (def.key === 'has_lifeguards') {
    return `<div class="amenity${ruleClass}" data-tip="${escHtml(tip + ' · seasonal, typically Memorial Day–Labor Day')}">
      <span class="amenity-icon">${def.icon}</span>
      <span class="amenity-text">
        <span class="amenity-label">${def.label}</span>
        <span class="amenity-sub">Seasonal</span>
      </span>
    </div>`;
  }
  return `<div class="amenity${ruleClass}" data-tip="${escHtml(tip)}">
    <span class="amenity-icon">${def.icon}</span>
    <span class="amenity-label">${def.label}</span>
  </div>`;
}

// Map zone-rules section names to amenity keys when they refer to the
// same physical thing. Used for dedup when merging the two lists.
const _SECTION_TO_AMENITY = {
  parking_lot:       'has_parking',
  restrooms:         'has_restrooms',
  restrooms_showers: 'has_restrooms',
  showers:           'has_showers',
  picnic_area:       'has_picnic_area',
};
// Zone-rules sections that aren't represented in AMENITY_DEFS. Each
// gets its own tile, sourced from zone_rules with the dog-policy rule
// as the background color.
const _SECTION_TILE = {
  sand:           { icon: '🏖️', label: 'Sand' },
  trails:         { icon: '🥾', label: 'Trails' },
  water_swim:     { icon: '🌊', label: 'Water' },
  dunes:          { icon: '🏜️', label: 'Dunes' },
  bluff:          { icon: '🏔️', label: 'Bluff' },
  boardwalk:      { icon: '🚶', label: 'Boardwalk' },
  campground:     { icon: '🏕️', label: 'Campground' },
  playground:     { icon: '🤸', label: 'Playground' },
  tide_pools:     { icon: '🐚', label: 'Tide pools' },
  nesting_zones:  { icon: '🪺', label: 'Nesting zones' },
};

// Walk zone_rules and return a map of {sectionName -> mostRestrictiveRule}.
// "Most restrictive" priority: not_allowed > on_leash > off_leash > unknown.
// Multi-region beaches collapse to one rule per section using this priority.
function _ruleMapFromZoneRules(zr) {
  const RANK = { not_allowed: 3, on_leash: 2, off_leash: 1, unknown: 0 };
  const out = {};
  const seasons = (Array.isArray(zr?.seasons) && zr.seasons.length)
    ? zr.seasons
    : (Array.isArray(zr?.regions) ? [{ regions: zr.regions }] : []);
  for (const s of seasons) {
    const regs = Array.isArray(s.regions) ? s.regions : [];
    for (const r of regs) {
      const secs = r?.sections || {};
      for (const [name, sec] of Object.entries(secs)) {
        const rule = sec?.rule || 'unknown';
        if (!out[name] || (RANK[rule] ?? 0) > (RANK[out[name]] ?? 0)) {
          out[name] = rule;
        }
      }
    }
  }
  return out;
}

// Get the list of regions from zone_rules. Returns [] if none.
function _zrRegions(zr) {
  if (!zr) return [];
  const seasons = (Array.isArray(zr.seasons) && zr.seasons.length)
    ? zr.seasons
    : (Array.isArray(zr.regions) ? [{ regions: zr.regions }] : []);
  const out = [];
  for (const s of seasons) {
    const regs = Array.isArray(s.regions) ? s.regions : [];
    for (const r of regs) out.push(r);
  }
  return out;
}

// Filter the visible AMENITY_DEFS list (the has_X=true / parking-data
// tiles) into one flat array.
function _visibleAmenityTiles(amenities) {
  if (!amenities) return [];
  return AMENITY_DEFS.map((d, i) => ({ ...d, _i: i })).filter(d => {
    if (amenities[d.key] === true) return true;
    if (d.key === 'has_parking') {
      return (Array.isArray(amenities.parking_options) && amenities.parking_options.length > 0)
          || (amenities.parking_fee != null) || amenities.parking_subtype
          || amenities.parking_type || amenities.parking_notes;
    }
    return false;
  });
}

// Render a tile array. Sort: most-favorable-to-dogs first
// (off_leash → on_leash → unknown/no-rule → not_allowed), parking
// first within the same favorability bucket, then label length.
const _DOG_FAVOR = { off_leash: 0, on_leash: 1, unknown: 2, not_allowed: 3 };
function _renderTileSet(tiles, amenities, ruleFor) {
  const decorated = tiles.map(d => ({
    d,
    rule: ruleFor ? ruleFor(d) : null,
    favor: _DOG_FAVOR[(ruleFor ? ruleFor(d) : null) ?? 'unknown'] ?? 2,
  }));
  decorated.sort((a, b) => {
    if (a.favor !== b.favor) return a.favor - b.favor;
    if (a.d.key === 'has_parking') return -1;
    if (b.d.key === 'has_parking') return 1;
    const la = a.d.label.length, lb = b.d.label.length;
    return la === lb ? a.d._i - b.d._i : la - lb;
  });
  return decorated.map(x => _renderAmenityTileWithRule(x.d, amenities, x.rule)).join('');
}

function buildAmenitiesSection(amenities, dogPolicy) {
  if (!amenities && !dogPolicy?.zone_rules) return '';
  const regions = _zrRegions(dogPolicy?.zone_rules);

  // Build the all-zones amenity tiles (has_X=true items not tied to
  // a specific zone) — lifeguards, drinking_water, fire_pits, food,
  // ADA. Zone-tied amenities (parking, restrooms, showers, picnic_area)
  // appear under their zones; pull them out here.
  const zoneTiedKeys = new Set(Object.values(_SECTION_TO_AMENITY));
  const allAmenityTiles = _visibleAmenityTiles(amenities);
  const sharedAmenityTiles = allAmenityTiles.filter(t => !zoneTiedKeys.has(t.key));
  const zoneTiedAmenityTiles = allAmenityTiles.filter(t => zoneTiedKeys.has(t.key));

  // SINGLE-ZONE (or no zone_rules) — collapse to one grid.
  if (regions.length <= 1) {
    const ruleMap = _ruleMapFromZoneRules(dogPolicy?.zone_rules || {});
    const sectionTiles = [];
    for (const [secName, rule] of Object.entries(ruleMap)) {
      if (_SECTION_TO_AMENITY[secName]) continue;
      const tile = _SECTION_TILE[secName];
      if (!tile) continue;
      sectionTiles.push({
        key: `section:${secName}`, icon: tile.icon, label: tile.label,
        sectionName: secName,
        _i: 100 + Object.keys(_SECTION_TILE).indexOf(secName),
      });
    }
    const all = [...allAmenityTiles, ...sectionTiles];
    if (!all.length) return '';
    const ruleFor = d => {
      if (d.sectionName) return ruleMap[d.sectionName];
      const matching = Object.entries(_SECTION_TO_AMENITY)
        .find(([sec, key]) => key === d.key)?.[0];
      return matching ? ruleMap[matching] : null;
    };
    const cells = _renderTileSet(all, amenities, ruleFor);
    return `<section class="card amenities-card">
      <h2>Amenities</h2>
      <div class="amenity-grid">${cells}</div>
    </section>`;
  }

  // MULTI-ZONE: shared amenities at top, then per-zone groups with
  // header labels. Zone-tied amenities (parking/restrooms/showers/
  // picnic_area) appear under each zone that has the matching section.
  const blocks = [];
  if (sharedAmenityTiles.length) {
    blocks.push(`<div class="amenity-grid">${_renderTileSet(sharedAmenityTiles, amenities, null)}</div>`);
  }
  for (const reg of regions) {
    const secs = reg?.sections || {};
    const secEntries = Object.entries(secs);
    if (!secEntries.length) continue;
    const ruleHere = name => secs[name]?.rule || 'unknown';
    // Tiles for THIS region only:
    //  - zone-tied amenity tiles where the matching section is in this region
    //  - section-only tiles for everything else in this region
    const tilesForRegion = [];
    for (const t of zoneTiedAmenityTiles) {
      const matchingSection = Object.entries(_SECTION_TO_AMENITY)
        .find(([sec, key]) => key === t.key)?.[0];
      if (matchingSection && secs[matchingSection]) tilesForRegion.push(t);
    }
    for (const [name] of secEntries) {
      if (_SECTION_TO_AMENITY[name]) continue;
      const t = _SECTION_TILE[name];
      if (!t) continue;
      tilesForRegion.push({
        key: `section:${name}`, icon: t.icon, label: t.label,
        sectionName: name,
        _i: 100 + Object.keys(_SECTION_TILE).indexOf(name),
      });
    }
    if (!tilesForRegion.length) continue;
    const zoneName = reg.name || 'Whole beach';
    const ruleFor = d => {
      if (d.sectionName) return ruleHere(d.sectionName);
      const matching = Object.entries(_SECTION_TO_AMENITY)
        .find(([sec, key]) => key === d.key)?.[0];
      return matching ? ruleHere(matching) : null;
    };
    blocks.push(`
      <div class="amenity-zone-header">${escHtml(zoneName)}</div>
      <div class="amenity-grid">${_renderTileSet(tilesForRegion, amenities, ruleFor)}</div>`);
  }

  if (!blocks.length) return '';
  return `<section class="card amenities-card">
    <h2>Amenities</h2>
    ${blocks.join('')}
  </section>`;
}


// _renderSectionPill / _renderTimeCell / _renderZoneCard /
// buildZoneRulesSection / time-tab handler all moved to
// src/zone-rules-block.js (shared with detail.html).

// ─── Weather card ────────────────────────────────────────────────
// Live against Open-Meteo (forecast) + NOAA CO-OPS (tides). No cache.
// Renders empty mount; loadWeather() fills it after fetch.

// WMO weather code → emoji + label.
const WMO_ICON = {
  0:['☀️','Clear'], 1:['🌤️','Mostly sunny'], 2:['⛅','Partly cloudy'], 3:['☁️','Overcast'],
  45:['🌫️','Fog'], 48:['🌫️','Fog'],
  51:['🌦️','Drizzle'], 53:['🌦️','Drizzle'], 55:['🌦️','Drizzle'],
  61:['🌧️','Light rain'], 63:['🌧️','Rain'], 65:['🌧️','Heavy rain'],
  71:['🌨️','Snow'], 73:['🌨️','Snow'], 75:['🌨️','Heavy snow'],
  80:['🌧️','Showers'], 81:['🌧️','Showers'], 82:['🌧️','Heavy showers'],
  95:['⛈️','Thunderstorm'], 96:['⛈️','Thunderstorm'], 99:['⛈️','Thunderstorm'],
};
function wmoIcon(code) { return (WMO_ICON[code] || ['🌡️','—'])[0]; }
function wmoLabel(code) { return (WMO_ICON[code] || ['🌡️','—'])[1]; }

function buildWeatherSection(beach) {
  const tideMount = beach.noaa_station_id
    ? `<div id="tide-mount" class="weather-loading">Loading tides…</div>`
    : '';
  return `<section class="card weather-card">
    <h2>Weather and Tides</h2>
    <div id="weather-mount" class="weather-loading">Loading conditions…</div>
    ${tideMount}
  </section>`;
}

function _fmtTideTime(iso) {
  const d = new Date(iso);
  const hh = d.getHours(), mm = d.getMinutes();
  const h = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh;
  const ap = hh >= 12 ? 'pm' : 'am';
  return mm ? `${h}:${String(mm).padStart(2,'0')}${ap}` : `${h}${ap}`;
}

function _renderWeatherToday(forecast) {
  const mount = document.getElementById('weather-mount');
  if (!mount) return;
  const f = forecast;
  const code  = f.current?.weather_code ?? f.daily.weather_code[0];
  const temp  = f.current?.temperature_2m != null
    ? Math.round(f.current.temperature_2m)
    : Math.round(f.daily.temperature_2m_max[0]);
  const wind  = f.current?.wind_speed_10m != null
    ? Math.round(f.current.wind_speed_10m)
    : Math.round(f.daily.wind_speed_10m_max[0]);
  const uvMax = f.daily.uv_index_max?.[0];
  const uvNow = f.current?.uv_index;
  const uv    = uvNow != null ? uvNow : uvMax;
  const chips = [
    `<span class="weather-chip">🌡 ${temp}°</span>`,
    `<span class="weather-chip">💨 ${wind} mph</span>`,
    uv != null ? `<span class="weather-chip">☀️ UV ${parseFloat(uv).toFixed(1)}</span>` : '',
  ].filter(Boolean).join('');
  mount.innerHTML = `<div class="weather-now">
    <div class="weather-now-cond" title="${escHtml(wmoLabel(code))}"
         aria-label="${escHtml(wmoLabel(code))}">${wmoIcon(code)}</div>
    <div class="weather-chips">${chips}</div>
  </div>`;
  mount.classList.remove('weather-loading');
}

function _renderTidesToday(tides, forecast) {
  const mount = document.getElementById('tide-mount');
  if (!mount) return;
  // NOAA can return predictions that include trailing hours from the
  // next day. Filter to today's local date prefix so the polyline
  // doesn't wrap around (a 24th point dated tomorrow lands back at
  // x=0 and produces a stray diagonal across the whole chart).
  const _today = new Date();
  const _y = _today.getFullYear(),
        _m = String(_today.getMonth()+1).padStart(2,'0'),
        _d = String(_today.getDate()).padStart(2,'0');
  const _todayStr = `${_y}-${_m}-${_d}`;
  const hourly = (tides?.hourly || []).filter(p => p?.t && p.t.startsWith(_todayStr));
  const hilo   = (tides?.hilo   || []).filter(p => p?.t && p.t.startsWith(_todayStr));
  if (!Array.isArray(hourly) || hourly.length === 0) {
    // Fall back to hilo-only text if we got hilo but no hourly.
    if (Array.isArray(hilo) && hilo.length) {
      const rows = hilo.slice(0,4).map(p => `
        <span>${p.type === 'H' ? '⬆' : '⬇'} <strong>${_fmtTideTime(p.t.replace(' ','T'))}</strong> · ${parseFloat(p.v).toFixed(1)}ft</span>`).join('');
      mount.innerHTML = `<div class="tide-events">${rows}</div>`;
    } else {
      mount.innerHTML = `<div class="tide-empty">Tide predictions unavailable.</div>`;
    }
    mount.classList.remove('weather-loading');
    return;
  }

  // Infographic SVG: one tide line, hi/lo text markers, NOW dot,
  // zero-ft reference, hour axis at bottom. Hover anywhere on the
  // curve to see exact time + height (interactive crosshair).
  const W = 280, H = 130, padTop = 22, padBottom = 24;
  const minV = Math.min(...hourly.map(p => parseFloat(p.v)));
  const maxV = Math.max(...hourly.map(p => parseFloat(p.v)));
  const rng  = Math.max(maxV - minV, 0.5);

  const xOf = (t) => {
    const hh = parseInt(t.slice(11,13), 10);
    const mm = parseInt(t.slice(14,16), 10);
    return ((hh + mm/60) / 24) * W;
  };
  const yOf = (v) => H - padBottom - ((parseFloat(v) - minV) / rng) * (H - padTop - padBottom);

  // Single smooth polyline through the hourly points. Tides are
  // naturally smooth so straight segments + stroke-linejoin:round
  // look very close to a sine curve without bezier artifacts.
  const pts = hourly.map(p => ({ x: xOf(p.t), y: yOf(p.v) }));
  const line = 'M ' + pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L ');

  // Hi/lo markers — borderless text only. Includes a <title> for
  // native browser hover showing time + height.
  const markersHtml = Array.isArray(hilo) ? hilo.slice(0,4).map(p => {
    const x = xOf(p.t), y = yOf(p.v);
    const arrow = p.type === 'H' ? '↑' : '↓';
    const heightStr = `${parseFloat(p.v).toFixed(1)}ft`;
    const timeStr = _fmtTideTime(p.t.replace(' ','T'));
    const txtY = p.type === 'H' ? Math.max(y - 6, padTop) : Math.min(y + 14, H - padBottom - 4);
    return `
      <text x="${x.toFixed(1)}" y="${txtY.toFixed(1)}" text-anchor="middle">
        <title>${p.type === 'H' ? 'High tide' : 'Low tide'} · ${escHtml(timeStr)} · ${heightStr}</title>
        <tspan class="tide-marker-arrow">${arrow}</tspan>
        <tspan class="tide-marker-text" dx="2">${heightStr}</tspan>
      </text>`;
  }).join('') : '';

  // Zero-tide horizontal reference line (only if 0 is within the
  // visible range; some lake beaches sit far above MLLW).
  const zeroY = yOf(0);
  const zeroLine = (zeroY >= padTop && zeroY <= H - padBottom)
    ? `<line x1="0" y1="${zeroY.toFixed(1)}" x2="${W}" y2="${zeroY.toFixed(1)}" class="tide-zero-line"/>
       <text x="${W - 4}" y="${(zeroY - 2).toFixed(1)}" text-anchor="end" class="tide-zero-label">0 ft</text>`
    : '';

  // Hour scale along the bottom (12am, 6am, 12pm, 6pm)
  const hourLabels = [0, 6, 12, 18].map(h => {
    const x = (h / 24) * W;
    const lbl = h === 0 ? '12am' : h === 12 ? '12pm' : (h < 12 ? `${h}am` : `${h-12}pm`);
    const anchor = h === 0 ? 'start' : (h === 18 ? 'end' : 'middle');
    return `<text x="${x.toFixed(1)}" y="${H - 4}" text-anchor="${anchor}" class="tide-hour-axis-label">${lbl}</text>`;
  }).join('');

  // NOW marker — filled dot + "NOW" label, with hover title.
  const now = new Date();
  const nowHour = now.getHours() + now.getMinutes()/60;
  const nowX = (nowHour / 24) * W;
  const iLo = Math.floor(nowHour);
  const iHi = Math.min(iLo + 1, pts.length - 1);
  const frac = nowHour - iLo;
  const nowY = (pts[iLo]?.y ?? padTop) * (1 - frac) + (pts[iHi]?.y ?? padTop) * frac;
  const nowHeight = (parseFloat(hourly[iLo]?.v ?? 0) * (1 - frac)
                  + parseFloat(hourly[iHi]?.v ?? 0) * frac).toFixed(1);
  const nowMarker = `
    <circle cx="${nowX.toFixed(1)}" cy="${nowY.toFixed(1)}" r="4" class="tide-now-dot">
      <title>Now · ${nowHeight}ft</title>
    </circle>
    <text x="${nowX.toFixed(1)}" y="${(nowY - 9).toFixed(1)}" text-anchor="middle" class="tide-now-label">NOW</text>`;

  // Precompute 48 static hover zones (one per 30-min bucket). Each
  // is an invisible rect carrying a native SVG <title> with the
  // bucket-center time + interpolated tide height. Zero JS handlers,
  // zero per-frame compute — browser handles the tooltip natively.
  const zonesHtml = (() => {
    const out = [];
    const zoneW = W / 48;
    for (let z = 0; z < 48; z++) {
      const hourFloat = z * 0.5;             // 0.0, 0.5, 1.0, ... 23.5
      const iLo = Math.min(Math.floor(hourFloat), pts.length - 1);
      const iHi = Math.min(iLo + 1, pts.length - 1);
      const f   = hourFloat - iLo;
      const v   = parseFloat(hourly[iLo].v) * (1 - f) + parseFloat(hourly[iHi].v) * f;
      const hh  = Math.floor(hourFloat);
      const mm  = (hourFloat % 1) === 0 ? 0 : 30;
      const ap  = hh >= 12 ? 'pm' : 'am';
      const h12 = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh;
      const tip = `${h12}:${String(mm).padStart(2,'0')}${ap} · ${v.toFixed(1)}ft`;
      out.push(`<rect x="${(z * zoneW).toFixed(2)}" y="${padTop}"
                      width="${zoneW.toFixed(2)}" height="${H - padTop - padBottom}"
                      class="tide-hover-zone"><title>${tip}</title></rect>`);
    }
    return out.join('');
  })();

  mount.innerHTML = `
    <svg class="tide-curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${zeroLine}
      <path d="${line}" class="tide-stroke"/>
      ${markersHtml}
      ${nowMarker}
      ${hourLabels}
      ${zonesHtml}
    </svg>`;
  mount.classList.remove('weather-loading');
}

async function loadWeather(beach, hoursToday) {
  const weatherMount = document.getElementById('weather-mount');
  const tideMount    = document.getElementById('tide-mount');
  if (!weatherMount || beach.lat == null || beach.lng == null) {
    if (weatherMount) weatherMount.parentElement.remove();
    if (tideMount)    tideMount.parentElement.remove();
    return;
  }
  const tz = beach.timezone || 'auto';
  // Today only — drop forecast_days to 1.
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${beach.lat}&longitude=${beach.lng}`
    + `&current=temperature_2m,weather_code,wind_speed_10m,uv_index`
    + `&daily=temperature_2m_max,temperature_2m_min,weather_code,wind_speed_10m_max,precipitation_sum,uv_index_max`
    + `&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch`
    + `&timezone=${encodeURIComponent(tz)}&forecast_days=1`;
  // Tides now derive from hours_today.tide_height (already in the
  // get_beach_info payload; populated by daily-beach-refresh from the
  // weekly NOAA pull). No browser→NOAA fetch.
  const tides = tideMount ? _deriveTideCurveFromHours(hoursToday) : null;
  try {
    const forecast = await fetch(url).then(r => r.json());
    _renderWeatherToday(forecast);
    if (tideMount) _renderTidesToday(tides, forecast);
  } catch (e) {
    console.warn('weather fetch failed:', e);
    weatherMount.textContent = 'Weather unavailable right now.';
    // Tides can still render even if Open-Meteo fails.
    if (tideMount && tides) _renderTidesToday(tides, null);
  }
}

// Build the {hourly, hilo} shape _renderTidesToday expects, derived
// from hours_today.tide_height. Local minima/maxima of the 24-point
// array become hi/lo events. Replaces the previous NOAA fetch.
function _deriveTideCurveFromHours(hoursToday) {
  if (!Array.isArray(hoursToday)) return null;
  const _t = new Date();
  const _y = _t.getFullYear();
  const _m = String(_t.getMonth() + 1).padStart(2, '0');
  const _d = String(_t.getDate()).padStart(2, '0');
  const datePrefix = `${_y}-${_m}-${_d}`;
  const hourly = hoursToday
    .filter(h => h && h.tide_height != null && h.local_hour != null)
    .sort((a, b) => a.local_hour - b.local_hour)
    .map(h => ({
      t: `${datePrefix} ${String(h.local_hour).padStart(2, '0')}:00`,
      v: String(h.tide_height),
    }));
  if (hourly.length < 3) return { hourly, hilo: [] };
  const hilo = [];
  for (let i = 1; i < hourly.length - 1; i++) {
    const prev = parseFloat(hourly[i - 1].v);
    const cur  = parseFloat(hourly[i].v);
    const next = parseFloat(hourly[i + 1].v);
    if (cur > prev && cur > next) {
      hilo.push({ t: hourly[i].t, v: hourly[i].v, type: 'H' });
    } else if (cur < prev && cur < next) {
      hilo.push({ t: hourly[i].t, v: hourly[i].v, type: 'L' });
    }
  }
  // Cap to 4 (typical day = 2 highs + 2 lows). Hourly resolution
  // means timing precision is to-the-hour, not minutes like NOAA's
  // native 6-min predictions — acceptable for an at-a-glance display.
  return { hourly, hilo: hilo.slice(0, 4) };
}

// Beach overview card. Title = beach display name. Carries the
// LLM static description + async Scout narrative. The best-window
// info lives in its own card (buildBestTimeCard).
function buildOverviewCard(beach, description) {
  const blurb = description?.text;
  if (!blurb) return '';
  // Beach text — bare prose, no card chrome, no title. Beach name
  // already appears in the page header next to the Your-Fit badge.
  return `<p class="overview-blurb">${escHtml(blurb)}</p>`;
}

// Best-window card — standalone, all black text. Status pill keeps
// its tinted background for the at-a-glance signal but pill text is
// black for typographic consistency.
// Hourly score bar — ports detail.html's score row exactly: one
// .score-bar-col per hour with the score value above, dog icon for
// hours in the best window, status-color fill, and x-axis labels
// every other hour.
// Best-fit "from" / "to" hours for the chart x-axis. Priority:
//   1. Gate hours (beach.open_time/close_time, non-default seed)
//   2. Posted prose parse (regex out an "8am-6pm" style range from
//      amenities.hours_text)
//   3. Standard fallback 05:00–22:00 (matches the universal seed)
function _parseHoursText(text) {
  if (!text) return null;
  const m = String(text).match(
    /(\d{1,2})(?::(\d{2}))?\s*(am|pm)\s*(?:[-–]|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
  if (!m) return null;
  const to24 = (h, ap) => {
    h = parseInt(h, 10);
    if (/pm/i.test(ap) && h < 12) h += 12;
    if (/am/i.test(ap) && h === 12) h = 0;
    return h;
  };
  return { startH: to24(m[1], m[3]), endH: to24(m[4], m[6]) };
}
function _hoursWindowForChart(beach, amenities) {
  const open  = beach?.open_time;
  const close = beach?.close_time;
  const isDefault = open === '05:00' && close === '22:00';
  if (open && close && !isDefault) {
    return { startH: parseInt(open.slice(0,2), 10),
             endH:   parseInt(close.slice(0,2), 10) };
  }
  const parsed = _parseHoursText(amenities?.hours_text);
  if (parsed) return parsed;
  return { startH: 5, endH: 22 };
}

function _renderScoreBars(hoursToday, beach, amenities, dogPolicy) {
  if (!Array.isArray(hoursToday) || hoursToday.length === 0) return '';
  const { startH, endH } = _hoursWindowForChart(beach, amenities);
  // One bar per hour in the open window. Null-score hours inside the
  // window (dog-prohibition zones, pre-sunrise, etc.) render as no_go
  // red so the chart stays continuous instead of leaving gaps.
  const hours = hoursToday
    .filter(h => h.local_hour >= startH && h.local_hour <= endH)
    .sort((a, b) => a.local_hour - b.local_hour);
  if (hours.length === 0) return '';

  // Bars display the per-hour appeal Overall (same 60/20/20 mix as the
  // page-level Your-Fit card), STACKED into Access / Amenities /
  // Weather segments — same visual language as the Your-Fit bar.
  // Tall bar = high overall; structural colors signal category.
  const amenitiesScore = _amenitiesScore(amenities);
  const contribsFor = h => {
    if (h.hour_score == null) return null;
    let avail = _hourlyAvailability(h.local_hour, dogPolicy?.zone_rules, USER_PREF);
    if (avail == null) avail = _availabilityFromFlags(dogPolicy, USER_PREF);
    const access  = Math.round(0.60 * avail);
    const amen    = Math.round(0.20 * amenitiesScore);
    const wx      = Math.round(0.20 * h.hour_score);
    return { access, amen, wx, overall: access + amen + wx };
  };

  // Best-window indicator derives from the SAME from-now window the
  // row label + Scout blurb use. Used for the 🐶 emphasis on bars
  // inside the window.
  const nowWindow = _bestWindowFromNow(hoursToday, beach, amenities, dogPolicy);
  const inWindow = h => nowWindow != null
    && h.local_hour >= nowWindow.start && h.local_hour < nowWindow.end;

  const MAX_PX = 35; // bar max height in CSS px (was 22; +60%)
  const fmtHour = hh => {
    const ap = hh >= 12 ? 'pm' : 'am';
    const h12 = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh;
    return `${h12}${ap}`;
  };

  const contribs = hours.map(contribsFor);
  const overalls = contribs.map(c => c?.overall ?? null);
  const maxV = Math.max(...overalls.filter(v => v != null), 1);
  const pxFor = v => Math.max(Math.round((v / maxV) * MAX_PX), 0);

  const barsHtml = hours.map((h, i) => {
    const c = contribs[i];
    const noScore = c == null;
    const dog  = !noScore && inWindow(h) ? '🐶' : '';
    const valueLabel = noScore ? '' : c.overall;
    const title = noScore
      ? `${fmtHour(h.local_hour)} · not allowed`
      : `${fmtHour(h.local_hour)} · ${c.overall} (access ${c.access} + amen ${c.amen} + wx ${c.wx})`;
    // Excluded hours render a single full-height red bar (no segments).
    const innerHtml = noScore
      ? `<div class="score-bar-seg-excluded" style="height:${MAX_PX}px"></div>`
      : `<div class="score-bar-seg score-bar-seg-weather"   style="height:${pxFor(c.wx)}px"></div>
         <div class="score-bar-seg score-bar-seg-amenities" style="height:${pxFor(c.amen)}px"></div>
         <div class="score-bar-seg score-bar-seg-access"    style="height:${pxFor(c.access)}px"></div>`;
    return `
      <div class="score-bar-col" title="${title}">
        <div class="score-bar-dog">${dog}</div>
        <div class="score-bar-value">${valueLabel}</div>
        <div class="score-bar">${innerHtml}</div>
      </div>`;
  }).join('');

  const xAxisHtml = hours.map((h, i) =>
    `<div class="score-x-label">${(i % 2 === 0) ? fmtHour(h.local_hour) : ''}</div>`
  ).join('');

  return `<div class="score-row">
    <div class="score-row-label">Score</div>
    <div class="score-bars-wrap">${barsHtml}</div>
    <div class="score-x-axis">${xAxisHtml}</div>
  </div>`;
}

// Find the longest contiguous block of "good" hours (per-hour Overall
// >= threshold) starting from the current local hour forward.
// User-pref-aware, time-of-day-aware. Returns {start, end} hour ints
// (end is exclusive), or null if no good window remains today.
function _bestWindowFromNow(hoursToday, beach, amenities, dogPolicy, threshold = 70) {
  if (!Array.isArray(hoursToday) || hoursToday.length === 0) return null;
  const nowH = _currentLocalHour(beach?.timezone);
  if (nowH == null) return null;
  const amenitiesScore = _amenitiesScore(amenities);
  const marked = hoursToday
    .filter(h => h && h.local_hour != null && h.local_hour >= nowH && h.hour_score != null)
    .sort((a, b) => a.local_hour - b.local_hour)
    .map(h => {
      let avail = _hourlyAvailability(h.local_hour, dogPolicy?.zone_rules, USER_PREF);
      if (avail == null) avail = _availabilityFromFlags(dogPolicy, USER_PREF);
      const overall = Math.round(0.60 * avail + 0.20 * amenitiesScore + 0.20 * h.hour_score);
      return { local_hour: h.local_hour, good: overall >= threshold };
    });
  let best = null;
  let cur = null;
  const seal = () => {
    if (cur && (!best || (cur.end - cur.start) > (best.end - best.start))) best = cur;
    cur = null;
  };
  for (const m of marked) {
    if (m.good) {
      if (!cur) cur = { start: m.local_hour, end: m.local_hour + 1 };
      else if (m.local_hour === cur.end) cur.end = m.local_hour + 1;
      else { seal(); cur = { start: m.local_hour, end: m.local_hour + 1 }; }
    } else { seal(); }
  }
  seal();
  return best;
}

function _formatHourRange(startH, endH) {
  const fmt = hh => {
    const ap = hh >= 12 ? 'pm' : 'am';
    const h12 = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh;
    return `${h12}${ap}`;
  };
  return `${fmt(startH)}–${fmt(endH)}`;
}

function buildBestTimeCard(today, dogPolicy, beachFid, hoursToday, beach, amenities) {
  // Time-aware best window — recomputed from current local hour
  // forward, using the same per-hour Overall the bar chart uses.
  const nowWindow = _bestWindowFromNow(hoursToday, beach, amenities, dogPolicy);
  const windowLabel = nowWindow ? _formatHourRange(nowWindow.start, nowWindow.end) : null;
  const hasWindow = !!windowLabel;
  const isNoDogs = !!dogPolicy && (
    dogPolicy.dogs_allowed === 'no' ||
    (dogPolicy.has_on_leash === false && dogPolicy.has_off_leash === false)
  );
  const isSandWaterProhibited = _sandOrWaterProhibited(dogPolicy?.zone_rules);
  // Card shows when there's a window OR an apology to convey.
  if (!hasWindow && !isNoDogs && !isSandWaterProhibited) return '';

  // Clickable when hourly detail is available. day_status presence
  // implies the hourly_scores row was computed, so detail.html will
  // render. Skip the clickable affordance when there's no hourly.
  const clickable = !!(today && today.day_status);
  const clickAttr = clickable ? ' data-open-detail="1"' : '';

  // Compact summary header: title left, time-range right. Hourly bars
  // and Scout blurb moved to their own sibling card below.
  const headlineText = windowLabel || (isNoDogs ? 'Not allowed' : 'No window');
  return `<section class="card besttime-card${clickable ? ' clickable' : ''}" data-fid="${beachFid}">
    <div class="besttime-header">
      <h2>Best Time</h2>
      <div class="besttime-headline"${clickAttr}>${escHtml(headlineText)}</div>
    </div>
  </section>`;
}

// Scout blurb card — hourly bar chart retired 2026-05-15 (Franz call,
// "it pains me"). _renderScoreBars + window-filter helpers stay in
// the codebase for now in case they come back. Activities prose
// renders statically below the async Scout blurb — the deterministic
// "what to do" sentence is the backbone; Scout adds today-flavor.
function buildScoutCard(today, beach, dogPolicy, amenities, hoursToday) {
  if (!today) return '';
  // Single corpus: activities + pack-list now fold INTO Scout's blurb
  // (LLM weaves them naturally). CTA mount sits below; fills async
  // once user location is known. Both surfaces collapse if data
  // is missing rather than blocking.
  return `<section class="card scout-card">
    <div id="scout-blurb">…</div>
    <div id="scout-cta" class="scout-cta"></div>
  </section>`;
}

// Lazily-mounted detail modal — iframe to detail.html for the per-hour
// bar charts. One modal element reused across clicks; appended to body
// the first time we need it.
function _ensureDetailModal() {
  let m = document.getElementById('detail-modal');
  if (m) return m;
  m = document.createElement('div');
  m.id = 'detail-modal';
  m.className = 'detail-modal';
  m.innerHTML = `
    <div class="detail-modal-inner">
      <button class="detail-modal-close" type="button" aria-label="Close">×</button>
      <iframe src="about:blank" loading="lazy"></iframe>
    </div>`;
  document.body.appendChild(m);
  const close = () => {
    m.classList.remove('open');
    // Blank the iframe so audio/animations stop.
    m.querySelector('iframe').src = 'about:blank';
  };
  m.querySelector('.detail-modal-close').addEventListener('click', close);
  m.addEventListener('click', e => { if (e.target === m) close(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && m.classList.contains('open')) close();
  });
  return m;
}

function _wireBestTimeClick() {
  const card = document.querySelector('.besttime-card.clickable');
  if (!card) return;
  const fid = card.dataset.fid;
  const open = (e) => {
    if (!e.target.closest('[data-open-detail]')) return;
    e.preventDefault();
    const today = new Date().toISOString().slice(0, 10);
    const m = _ensureDetailModal();
    m.querySelector('iframe').src = `detail.html?fid=${fid}&date=${today}&embed=charts`;
    m.classList.add('open');
  };
  card.addEventListener('click', open);
}

// Advisories card — per-metric advisory/caution/no_go time blocks
// derived from hours_today. Ports detail.html's status-board logic
// into a left-rail card with consistent style. Also surfaces day-level
// signals (bacteria_risk, seasonal dog closure) at the top.
function buildCautionsSection(today, dogPolicy, hoursToday) {
  // Day-level signals (already aggregated by daily-refresh)
  const dayItems = [];
  if (today?.bacteria_risk && today.bacteria_risk !== 'none' && today.bacteria_risk !== 'low') {
    dayItems.push({ status: 'caution', icon: '🦠', label: 'Bacteria',
                    value: today.bacteria_risk, time: '' });
  }
  if (dogPolicy?.dogs_prohibited_start && dogPolicy?.dogs_prohibited_end) {
    dayItems.push({ status: 'no_go', icon: '🚫', label: 'Dogs prohibited',
                    value: `${dogPolicy.dogs_prohibited_start}–${dogPolicy.dogs_prohibited_end}`, time: '' });
  }

  // Per-metric time-block items from hours_today
  const METRICS = [
    { icon: '🌊',  label: 'Tide',    statusKey: 'tide_status',    valueKey: 'tide_height',    fmt: v => v != null ? `${v.toFixed(1)} ft` : '—' },
    { icon: '💨',  label: 'Wind',    statusKey: 'wind_status',    valueKey: 'wind_speed',     fmt: v => v != null ? `${Math.round(v)} mph` : '—' },
    { icon: '🌧️', label: 'Rain',    statusKey: 'rain_status',    valueKey: 'precip_chance',  fmt: v => v != null ? `${Math.round(v)}%` : '—' },
    { icon: '👥',  label: 'Crowd',   statusKey: 'crowd_status',   valueKey: 'busyness_score', fmt: v => v != null ? `${Math.round(v)}/100` : '—' },
    { icon: '🌡',  label: 'Temp',    statusKey: 'temp_status',    valueKey: 'temp_air',       fmt: v => v != null ? `${Math.round(v)}°F` : '—' },
    { icon: '☀️',  label: 'UV',      statusKey: 'uv_status',      valueKey: 'uv_index',       fmt: v => v != null ? `UV ${v.toFixed(1)}` : '—' },
    { icon: '🏖️', label: 'Sand',    statusKey: 'sand_status',    valueKey: 'sand_temp',      fmt: v => v != null ? `${Math.round(v)}°F` : '—' },
    { icon: '🚶',  label: 'Asphalt', statusKey: 'asphalt_status', valueKey: 'asphalt_temp',   fmt: v => v != null ? `${Math.round(v)}°F` : '—' },
  ];
  const STATUS_RANK = { no_go: 3, caution: 2, advisory: 1 };
  const fmtH = h => h === 0 ? '12am' : h === 12 ? '12pm' : (h < 12 ? `${h}am` : `${h-12}pm`);
  const getBlocks = flagged => {
    if (!flagged.length) return [];
    const blocks = [[flagged[0]]];
    for (let i = 1; i < flagged.length; i++) {
      if (flagged[i].local_hour === flagged[i-1].local_hour + 1) blocks[blocks.length-1].push(flagged[i]);
      else blocks.push([flagged[i]]);
    }
    return blocks;
  };

  const metricItems = [];
  if (Array.isArray(hoursToday) && hoursToday.length) {
    for (const m of METRICS) {
      // Cautions card surfaces only caution + no_go (advisory excluded).
      const flagged = hoursToday.filter(h => h[m.statusKey] === 'caution' || h[m.statusKey] === 'no_go');
      if (!flagged.length) continue;
      let blocks = getBlocks(flagged);
      if (blocks.length >= 3) {
        blocks = blocks.slice().sort((a,b) => b.length - a.length).slice(0, 2)
                       .sort((a,b) => a[0].local_hour - b[0].local_hour);
      }
      const allHours = blocks.flat();
      const worst = allHours.reduce((w, h) => {
        const s = h[m.statusKey];
        return (STATUS_RANK[s] ?? 0) > (STATUS_RANK[w] ?? 0) ? s : w;
      }, 'caution');
      const vals = allHours.map(h => h[m.valueKey]).filter(v => v != null);
      const worstVal = vals.length
        ? (m.label === 'Temp' ? vals.reduce((a, b) => Math.abs(b - 72) > Math.abs(a - 72) ? b : a, vals[0])
                              : Math.max(...vals))
        : null;
      const times = blocks.map(b => `${fmtH(b[0].local_hour)}–${fmtH(b[b.length-1].local_hour + 1)}`).join(', ');
      metricItems.push({ status: worst, icon: m.icon, label: m.label,
                         value: m.fmt(worstVal), time: times });
    }
  }

  // Per-metric tooltip strings — explain what trips a caution.
  const CAUTION_TIPS = {
    Tide:    'Caution when high tide ≥ 5.0 ft — limited beach access',
    Wind:    'Caution when sustained wind ≥ 15 mph',
    Rain:    'Caution on high precipitation chance / severe weather codes',
    Crowd:   'Caution when busyness 61-84 (packed beach)',
    Temp:    'Caution outside 50-75°F — too cold or too hot',
    UV:      'Caution when UV index ≥ 8',
    Sand:    'Caution when sand temperature ≥ 115°F — paw burn risk',
    Asphalt: 'Caution when asphalt ≥ 115°F — paw burn risk',
    Bacteria:           "Water-quality risk — avoid letting your dog swim or drink seawater",
    'Dogs prohibited':  "Dogs aren't allowed at this beach during these hours",
  };

  // Combined list, sorted: highest severity first, then label alphabetical.
  const items = [...dayItems, ...metricItems].sort(
    (a, b) => (STATUS_RANK[b.status] ?? 0) - (STATUS_RANK[a.status] ?? 0)
           || a.label.localeCompare(b.label));
  if (!items.length) return '';
  const rows = items.map(it => {
    const tip = CAUTION_TIPS[it.label] || it.label;
    return `
    <li class="advisory-row advisory-${it.status}" data-tip="${escHtml(tip)}">
      <span class="advisory-icon">${it.icon}</span>
      <span class="advisory-body">
        <span class="advisory-headline">
          <span class="advisory-label">${escHtml(it.label)}</span>
          <span class="advisory-value">${escHtml(it.value)}</span>
        </span>
        ${it.time ? `<span class="advisory-time">${escHtml(it.time)}</span>` : ''}
      </span>
    </li>`;
  }).join('');
  return `<section class="card cautions-card">
    <h2>Cautions</h2>
    <ul class="advisory-list">${rows}</ul>
  </section>`;
}

// Scout blurb — narrative paragraph from beach-chat (Anthropic LLM)
// describing today's conditions. Short-circuits to canned apologies
// when dogs aren't allowed / sand prohibited / no good windows.
async function loadScoutBlurb(beach, today, dogPolicy, hoursToday, amenities) {
  const el = document.getElementById('scout-blurb');
  if (!el) return;

  const isNoDogs = !!dogPolicy && (
    dogPolicy.dogs_allowed === 'no' ||
    (dogPolicy.has_on_leash === false && dogPolicy.has_off_leash === false)
  );
  const isSandWaterProhibited = _sandOrWaterProhibited(dogPolicy?.zone_rules);
  const noGoodWindows = today && today.day_status === 'no_go';

  if (isNoDogs) {
    el.textContent = "Sorry bud — dogs aren't allowed here. Check the alternatives below for a nearby spot that welcomes pups.";
    el.classList.add('loaded'); return;
  }
  if (isSandWaterProhibited) {
    el.textContent = "Sorry bud — dogs aren't allowed on the sand or in the water here. Check the alternatives below for a beach where pups can actually hit the surf.";
    el.classList.add('loaded'); return;
  }
  if (!today) {
    // Non-scoreable / no recommendation today. The element lives
    // inside the Best Time card; leave a soft note when present.
    el.textContent = '';
    return;
  }
  if (noGoodWindows) {
    el.textContent = "Today's looking rough at this beach — no go-quality hours. Check the alternatives below if you can travel.";
    el.classList.add('loaded'); return;
  }

  // Time-aware window: only consider hours from the current local hour
  // forward, using the same per-hour Overall the bar chart uses. If the
  // morning best window already passed, Scout should talk about what's
  // LEFT today, not what was great at 6am.
  const nowWindow = _bestWindowFromNow(hoursToday, beach, amenities, dogPolicy);
  if (!nowWindow) {
    el.textContent = "Today's good windows have already passed at this beach — check back tomorrow morning.";
    el.classList.add('loaded'); return;
  }
  const windowLabel  = _formatHourRange(nowWindow.start, nowWindow.end);
  const windowStatus = today.best_window_status ?? 'go';
  const signals = [
    today.lowest_tide_height != null ? `tide ${parseFloat(today.lowest_tide_height).toFixed(1)}ft` : null,
    today.avg_wind  != null ? `wind ${Math.round(today.avg_wind)}mph` : null,
    today.avg_temp  != null ? `temp ${Math.round(today.avg_temp)}°F` : null,
    today.avg_uv    != null ? `UV index ${parseFloat(today.avg_uv).toFixed(1)}` : null,
    today.busyness_category ? `crowds: ${today.busyness_category}` : null,
    today.bacteria_risk && today.bacteria_risk !== 'none' ? `bacteria risk: ${today.bacteria_risk}` : null,
  ].filter(Boolean).join(', ');

  const nowH = _currentLocalHour(beach?.timezone);
  const nowLabel = nowH != null
    ? (nowH === 0 ? '12am' : nowH > 12 ? `${nowH - 12}pm` : nowH === 12 ? '12pm' : `${nowH}am`)
    : null;

  const actPhrases  = _activityPhrases(beach, dogPolicy, amenities, hoursToday);
  const packPhrases = _packListPhrases(beach, dogPolicy, amenities, hoursToday);

  const question =
    `Current local time: ${nowLabel || 'now'}. Best window remaining: ${windowLabel} (${windowStatus}). Conditions: ${signals}. ` +
    `Activities the zone rules ALLOW today (weave 2-3 of these naturally — DON'T invent, DON'T list all): ${actPhrases.join(' · ')}. ` +
    `Pack items to mention concretely (weave 2-3 of these into the prose — DON'T invent gear): ${packPhrases.join(' · ')}. ` +
    `Write ONE flowing conversational paragraph (3-4 sentences). LEAD WITH THE FUN — frame the window as a stoke moment, not a forecast. ` +
    `BOLD THE TIME WINDOW by wrapping it in **markdown asterisks**, e.g. **${windowLabel}**. Don't bold anything else. ` +
    `Address active cautions for BOTH the dog AND the kahu with CONCRETE practical guidance. Examples of the framing we want: ` +
    `high tide → "tide's running high, less sand exposed — stick to the upper beach and watch for kids and dogs getting pushed toward the cliffs/rocks"; ` +
    `high UV (≥8) → "sun's punching hard — sunscreen for you and a shade break, pup's coat is its sunscreen"; ` +
    `high wind (≥15mph) → "wind's blowing through, secure hats and treats, your pup will want shelter"; ` +
    `bacteria → "water quality's iffy — keep your dog out of the surf and don't let them drink seawater". ` +
    `STRICT: respect the DOG POLICY ZONE RULES in the system prompt. Never describe activities in sections marked not_allowed. Never reference times before the current local time. Use only the activities + pack items provided above — don't invent gear or activities.`;

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/beach-chat`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ arena_group_id: beach.fid, question, conversation_history: [] }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { answer } = await res.json();
    // Escape HTML first, then convert **markdown bold** to <strong>.
    // No other markdown is accepted from the model.
    const safe = escHtml(answer || '');
    el.innerHTML = safe.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
    el.classList.add('loaded');
  } catch (e) {
    console.warn('scout blurb fetch failed:', e);
    el.textContent = '';
  }
  _renderScoutCTA(beach);
}

// ─── Scout CTA ───────────────────────────────────────────────────────
// "Wanna go? Drive ~XX min. [Send directions →]" — drive estimate from
// browser geolocation (one-shot, cached in localStorage for a day).
// Falls back to no-drive-time if user denies or geolocation absent.
async function _renderScoutCTA(beach) {
  const ctaEl = document.getElementById('scout-cta');
  if (!ctaEl || beach.lat == null || beach.lng == null) return;
  const mapsUrl = buildMapsUrl(beach);
  const dirsBtn = `<a class="scout-cta-btn" href="${escHtml(mapsUrl)}" target="_blank" rel="noopener">Send directions →</a>`;
  // Render the button immediately; drive time fills in if available.
  ctaEl.innerHTML = `<span class="scout-cta-text">Wanna go?</span> ${dirsBtn}`;
  const user = await _getUserLocation();
  if (!user) return;
  const minutes = _estimateDriveMinutes(user, beach);
  if (!Number.isFinite(minutes) || minutes <= 0) return;
  ctaEl.innerHTML = `<span class="scout-cta-text">Wanna go? Drive ~${minutes} min.</span> ${dirsBtn}`;
}

function _haversineMiles(a, b) {
  const R = 3958.8;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const s = Math.sin(dLat / 2) ** 2 + Math.sin(dLng / 2) ** 2 * Math.cos(lat1) * Math.cos(lat2);
  return 2 * R * Math.asin(Math.sqrt(s));
}

function _estimateDriveMinutes(user, beach) {
  const miles = _haversineMiles(user, { lat: beach.lat, lng: beach.lng });
  // 1.8 min/mile: mix of freeway + surface streets with mild traffic.
  return Math.round(miles * 1.8);
}

async function _getUserLocation() {
  // Never auto-prompt for browser geolocation on this page. Drive time
  // is opt-in — only surfaces when location is already known via:
  //   1. URL param: ?user_lat=…&user_lng=…
  //   2. localStorage cache from a prior session/other page (find.html
  //      already prompts when the user explicitly asks for distance sort)
  const qp = new URLSearchParams(location.search);
  const ulat = parseFloat(qp.get('user_lat'));
  const ulng = parseFloat(qp.get('user_lng'));
  if (Number.isFinite(ulat) && Number.isFinite(ulng)) return { lat: ulat, lng: ulng };
  try {
    const raw = localStorage.getItem('dogbeach.user_loc');
    if (raw) {
      const cached = JSON.parse(raw);
      if (cached && Number.isFinite(cached.lat) && Number.isFinite(cached.lng)) return cached;
    }
  } catch {}
  return null;
}

// True ONLY if dogs have no sand/water access anywhere on the beach —
// every region's sand/water_swim/dunes/tide_pools section is not_allowed
// AND no time_window inside those sections permits dogs. If ANY region
// or time_window permits dog access to sand/water, this returns false
// (Franz rule 2026-05-15: any zone with dog access means the beach is
// not a no-go).
function _sandOrWaterProhibited(zr) {
  if (!zr || typeof zr !== 'object') return false;
  const seasons = (Array.isArray(zr.seasons) && zr.seasons.length)
    ? zr.seasons
    : (Array.isArray(zr.regions) ? [{ regions: zr.regions }] : []);
  const blocked = ['sand', 'water_swim', 'dunes', 'tide_pools'];
  let sawAnyBlockedSection = false;
  for (const s of seasons) {
    const regions = Array.isArray(s.regions) ? s.regions : [];
    for (const reg of regions) {
      const sections = reg.sections || {};
      for (const name of blocked) {
        const sec = sections[name];
        if (!sec) continue;
        sawAnyBlockedSection = true;
        if (sec.rule && sec.rule !== 'not_allowed') return false;
        const tws = Array.isArray(sec.time_windows) ? sec.time_windows : [];
        if (tws.some(tw => tw.rule && tw.rule !== 'not_allowed')) return false;
      }
    }
  }
  return sawAnyBlockedSection;
}

// ─── Appeal scoring (v1, client-side) ─────────────────────────────
// User-pref-aware fit score for the beach. Three components weighted
// 60/20/20: availability fit (does the beach permit the user's
// preferred leash mode), amenities (dog-relevant facilities),
// weather (best hour today). Page-level aggregate uses MAX across
// daylight hours for hourly components.
//
// Pref source priority: ?pref= URL param, then localStorage, else
// default 'off_leash'. Values: 'off_leash' | 'on_leash' | 'either'.

const USER_PREF = (() => {
  const valid = new Set(['off_leash', 'on_leash', 'either']);
  const qp = new URLSearchParams(location.search).get('pref');
  if (qp && valid.has(qp)) {
    try { localStorage.setItem('dogbeach.user_pref', qp); } catch {}
    return qp;
  }
  try {
    const ls = localStorage.getItem('dogbeach.user_pref');
    if (ls && valid.has(ls)) return ls;
  } catch {}
  return 'off_leash';
})();

const _PREF_LABEL = { off_leash: 'off-leash', on_leash: 'on-leash', either: 'any access' };

// Hour H (0-23) is inside a time_window iff [start, end) covers it.
// Handles wrap-around (e.g. 22:00–06:00 means evening + early morning).
function _tw_contains(tw, hour) {
  if (!tw || !tw.start || !tw.end) return false;
  const startH = parseInt(String(tw.start).slice(0, 2), 10);
  const endH   = parseInt(String(tw.end).slice(0, 2), 10);
  if (Number.isNaN(startH) || Number.isNaN(endH)) return false;
  if (endH > startH) return hour >= startH && hour < endH;
  // Wrap-around
  return hour >= startH || hour < endH;
}

// Effective rule at hour H for a node (region or section). Returns
// the matching time_window rule if any, else node.rule. Null if neither.
function _effectiveRuleAt(node, hour) {
  if (!node) return null;
  const tws = Array.isArray(node.time_windows) ? node.time_windows : [];
  for (const tw of tws) {
    if (_tw_contains(tw, hour)) return tw.rule || null;
  }
  return node.rule || null;
}

// Per-hour availability score 0-100. Walks every region+section in
// zone_rules; returns max across them. 100 = at least one zone
// permits the user's preferred mode at this hour. 50 = a zone permits
// dogs but not the preferred mode (e.g. wants off_leash, gets
// on_leash). 0 = no zone permits dogs at this hour.
function _hourlyAvailability(hour, zoneRules, userPref) {
  if (!zoneRules) return null;
  const seasons = Array.isArray(zoneRules.seasons) && zoneRules.seasons.length
    ? zoneRules.seasons
    : (Array.isArray(zoneRules.regions) ? [{ regions: zoneRules.regions }] : []);
  let best = 0;
  let anyData = false;
  for (const s of seasons) {
    const regions = Array.isArray(s.regions) ? s.regions : [];
    for (const region of regions) {
      anyData = true;
      const regionFallback = _effectiveRuleAt(region, hour);
      const sections = region.sections || {};
      const sectionKeys = Object.keys(sections);
      const ruleSet = sectionKeys.length
        ? sectionKeys.map(k => _effectiveRuleAt(sections[k], hour) || regionFallback)
        : [regionFallback];
      for (const rule of ruleSet) {
        const score = (userPref === 'either')
          ? (rule && rule !== 'not_allowed' ? 100 : 0)
          : rule === userPref ? 100
            : (rule && rule !== 'not_allowed') ? 50
            : 0;
        if (score > best) best = score;
        if (best === 100) return 100;
      }
    }
  }
  return anyData ? best : null;
}

// Fallback when zone_rules is absent — use the rolled-up has_on/off_leash flags.
function _availabilityFromFlags(dogPolicy, userPref) {
  const on = dogPolicy?.has_on_leash === true;
  const off = dogPolicy?.has_off_leash === true;
  if (userPref === 'either') return (on || off) ? 100 : 0;
  if (userPref === 'off_leash') return off ? 100 : (on ? 50 : 0);
  if (userPref === 'on_leash')  return on  ? 100 : (off ? 50 : 0);
  return 0;
}

// Amenities score 0-100. Drinking water + parking weighted 2×.
function _amenitiesScore(amenities) {
  if (!amenities) return 0;
  const weights = {
    has_parking: 2, has_drinking_water: 2,
    has_restrooms: 1, has_showers: 1, has_picnic_area: 1,
    has_lifeguards: 1, has_disabled_access: 1,
    has_fire_pits: 0.5,
  };
  const totalWeight = Object.values(weights).reduce((a, b) => a + b, 0);
  let earned = 0;
  for (const [key, w] of Object.entries(weights)) {
    if (amenities[key] === true) earned += w;
  }
  return Math.round((earned / totalWeight) * 100);
}

// Compose the three component scores + overall. Aggregates hourly
// components (availability, weather) with MAX across daylight hours
// — see project memory for why max over mean for v1.
function _appealScores(beach, dogPolicy, amenities, hoursToday) {
  const pref = USER_PREF;
  const daylight = (hoursToday || []).filter(h => h && h.hour_score != null);
  const availabilities = daylight
    .map(h => _hourlyAvailability(h.local_hour, dogPolicy?.zone_rules, pref))
    .filter(v => v != null);
  let availability = availabilities.length ? Math.max(...availabilities) : null;
  if (availability == null) availability = _availabilityFromFlags(dogPolicy, pref);
  const amenitiesScore = _amenitiesScore(amenities);
  const weatherScore = daylight.length
    ? Math.max(...daylight.map(h => h.hour_score))
    : 0;
  const overall = Math.round(0.60 * availability + 0.20 * amenitiesScore + 0.20 * weatherScore);
  return { availability, amenitiesScore, weatherScore, overall, userPref: pref };
}

function buildAppealCard(beach, dogPolicy, amenities, hoursToday) {
  const s = _appealScores(beach, dogPolicy, amenities, hoursToday);
  const prefLabel = _PREF_LABEL[s.userPref] || s.userPref;
  return `<section class="card appeal-card">
    <div class="appeal-header">
      <h2>Your Fit <span class="appeal-pref">· ${escHtml(prefLabel)}</span></h2>
      <div class="appeal-overall">
        <span class="appeal-overall-num">${s.overall}</span><span class="appeal-overall-max">/100</span>
      </div>
    </div>
  </section>`;
}

// ─── Pack list (rule-based, no LLM) ──────────────────────────────
// Replaces the 2026-05-07 pack-list-via-Scout sentence that was
// dropped because Sonnet hallucinated swim gear on no-dog beaches.
// Deterministic: each item is a (icon, label, reason) triple
// gated by zone-rule + condition checks. Universal items always
// included; conditional items only when the data supports them.

function _zoneSectionPermits(zr, sectionName) {
  if (!zr) return false;
  const seasons = Array.isArray(zr.seasons) && zr.seasons.length
    ? zr.seasons : (Array.isArray(zr.regions) ? [{ regions: zr.regions }] : []);
  for (const s of seasons) {
    for (const reg of (s.regions || [])) {
      const sec = reg?.sections?.[sectionName];
      if (sec && sec.rule && sec.rule !== 'not_allowed') return true;
    }
  }
  return false;
}

// Prose-form pack list — composes the same conditional gear list as
// _packListItems into a single sentence for the Scout card. The chip
// card retains the structured icons + tooltips for at-a-glance use.
function _packListPhrases(beach, dogPolicy, amenities, hoursToday) {
  const phrases = ['water', 'poop bags', 'a leash'];
  const hrs = Array.isArray(hoursToday) ? hoursToday.filter(h => h && h.hour_score != null) : [];
  const numericMax = (key) => hrs.reduce((m, h) => {
    const v = h[key]; return (v != null && v > m) ? v : m;
  }, -Infinity);
  const numericMin = (key) => hrs.reduce((m, h) => {
    const v = h[key]; return (v != null && v < m) ? v : m;
  }, +Infinity);
  const waterAllowed = _zoneSectionPermits(dogPolicy?.zone_rules, 'water_swim');
  const sandAllowed  = _zoneSectionPermits(dogPolicy?.zone_rules, 'sand');
  const maxTemp = numericMax('temp_air');
  const minTemp = numericMin('temp_air');
  if (waterAllowed) {
    phrases.push('a towel for the wet pup');
    if (maxTemp >= 70) phrases.push('a fetch toy');
  } else if (sandAllowed && maxTemp >= 65) {
    phrases.push('a fetch toy');
  }
  const maxUV      = numericMax('uv_index');
  const maxWind    = numericMax('wind_speed');
  const maxSand    = numericMax('sand_temp');
  const maxAsphalt = numericMax('asphalt_temp');
  if (maxUV >= 6) {
    phrases.push(`sunscreen (UV peaks at ${maxUV.toFixed(1)})`);
  }
  if (maxSand >= 115 && maxAsphalt >= 115) {
    phrases.push('paw booties — sand and asphalt are both scorching');
  } else if (maxSand >= 115) {
    phrases.push('paw booties for the hot sand');
  } else if (maxAsphalt >= 115) {
    phrases.push('paw booties for the parking-lot asphalt');
  }
  if ((minTemp !== Infinity && minTemp < 55) || maxWind >= 18) {
    phrases.push(minTemp < 55 ? 'a warm layer for yourself' : 'a windbreaker for yourself');
  }
  return phrases;
}

function _packListItems(beach, dogPolicy, amenities, hoursToday) {
  const items = [];
  // Universal
  items.push({ icon: '💧', label: 'Water',     reason: 'Always' });
  items.push({ icon: '💩', label: 'Poop bags', reason: 'Always' });
  items.push({ icon: '🦮', label: 'Leash',     reason: 'Entry zones' });

  const hrs = Array.isArray(hoursToday) ? hoursToday.filter(h => h && h.hour_score != null) : [];
  const numericMax = (key) => hrs.reduce((m, h) => {
    const v = h[key]; return (v != null && v > m) ? v : m;
  }, -Infinity);
  const numericMin = (key) => hrs.reduce((m, h) => {
    const v = h[key]; return (v != null && v < m) ? v : m;
  }, +Infinity);

  // Zone-conditional
  const waterAllowed = _zoneSectionPermits(dogPolicy?.zone_rules, 'water_swim');
  const sandAllowed  = _zoneSectionPermits(dogPolicy?.zone_rules, 'sand');
  const maxTemp      = numericMax('temp_air');
  const minTemp      = numericMin('temp_air');
  if (waterAllowed) {
    items.push({ icon: '🪣', label: 'Towel', reason: 'Wet dog' });
    if (maxTemp >= 70) {
      items.push({ icon: '🎾', label: 'Fetch toy', reason: 'Water + warm' });
    }
  } else if (sandAllowed && maxTemp >= 65) {
    items.push({ icon: '🎾', label: 'Fetch toy', reason: 'Sand play' });
  }

  // Weather-conditional
  const maxUV       = numericMax('uv_index');
  const maxWind     = numericMax('wind_speed');
  const maxSand     = numericMax('sand_temp');
  const maxAsphalt  = numericMax('asphalt_temp');
  if (maxUV >= 6) {
    items.push({ icon: '🧴', label: 'Sunscreen', reason: `UV ${maxUV.toFixed(1)}` });
  }
  if (maxSand >= 115 && maxAsphalt >= 115) {
    items.push({ icon: '🥾', label: 'Paw booties', reason: `Sand ${Math.round(maxSand)}°F · asphalt ${Math.round(maxAsphalt)}°F` });
  } else if (maxSand >= 115) {
    items.push({ icon: '🥾', label: 'Paw booties', reason: `Hot sand ${Math.round(maxSand)}°F` });
  } else if (maxAsphalt >= 115) {
    items.push({ icon: '🥾', label: 'Paw booties', reason: `Hot asphalt ${Math.round(maxAsphalt)}°F` });
  }
  if ((minTemp !== Infinity && minTemp < 55) || maxWind >= 18) {
    items.push({ icon: '🧥', label: 'Warm layer', reason: minTemp < 55 ? 'Chilly' : 'Windy' });
  }

  return items;
}

function buildPackListCard(beach, dogPolicy, amenities, hoursToday) {
  const items = _packListItems(beach, dogPolicy, amenities, hoursToday);
  if (!items.length) return '';
  const chips = items.map(it => `
    <div class="packlist-chip" data-tip="${escHtml(it.reason)}">
      <span class="packlist-icon">${it.icon}</span>
      <span class="packlist-label">${escHtml(it.label)}</span>
    </div>`).join('');
  return `<section class="card packlist-card">
    <h2>Pack List</h2>
    <div class="packlist-chips">${chips}</div>
  </section>`;
}

// ─── Activities (rule-based, no LLM) ─────────────────────────────
// Deterministic "what to do with your dog" chips. Same shape + CSS as
// the Pack List card. Each chip gated by zone-rule + condition checks
// so Sonnet-hallucination patterns (recommending fetch on no-dog
// beaches) can't reach the consumer surface. Returns empty when
// zone_rules is null or no qualifying activity exists.

function _sectionBestRule(zr, sectionName) {
  if (!zr) return null;
  const RANK = { off_leash: 2, on_leash: 1, not_allowed: 0 };
  const seasons = Array.isArray(zr.seasons) && zr.seasons.length
    ? zr.seasons : (Array.isArray(zr.regions) ? [{ regions: zr.regions }] : []);
  let best = null;
  for (const s of seasons) {
    for (const reg of (s.regions || [])) {
      const sec = reg?.sections?.[sectionName];
      if (!sec || !sec.rule) continue;
      const r = sec.rule;
      if (best == null || (RANK[r] ?? -1) > (RANK[best] ?? -1)) best = r;
    }
  }
  return best;
}

function _activityPhrases(beach, dogPolicy, amenities, hoursToday) {
  const phrases = [];
  const zr = dogPolicy?.zone_rules;
  if (!zr) return phrases;

  const sand      = _sectionBestRule(zr, 'sand');
  const water     = _sectionBestRule(zr, 'water_swim');
  const trails    = _sectionBestRule(zr, 'trails');
  const tidePools = _sectionBestRule(zr, 'tide_pools');
  const picnic    = _sectionBestRule(zr, 'picnic_area');
  const board     = _sectionBestRule(zr, 'boardwalk');

  const hrs = Array.isArray(hoursToday) ? hoursToday.filter(h => h && h.hour_score != null) : [];
  const lowestTide = hrs.reduce((m, h) => {
    const v = h.tide_height; return (v != null && v < m) ? v : m;
  }, +Infinity);
  const maxTemp = hrs.reduce((m, h) => {
    const v = h.temp_air; return (v != null && v > m) ? v : m;
  }, -Infinity);
  const permits = r => r && r !== 'not_allowed';

  if (sand === 'off_leash' || water === 'off_leash') {
    phrases.push('let your pup run off-leash');
  }
  if (permits(sand)) {
    phrases.push(sand === 'off_leash'
      ? 'play fetch on the open sand'
      : 'play leashed fetch on the sand');
  } else if (permits(water)) {
    phrases.push('throw a toy into the surf for a water fetch');
  }
  if (permits(water)) {
    phrases.push(maxTemp >= 65
      ? `splash in the ${Math.round(maxTemp)}°F water`
      : 'wade in the chilly water');
  }
  if (permits(tidePools) && lowestTide !== Infinity && lowestTide < 2) {
    phrases.push(`poke around tide pools at low tide (${lowestTide.toFixed(1)} ft)`);
  }
  if (permits(trails)) {
    const sandRestricted = sand === 'not_allowed' || !sand;
    phrases.push(sandRestricted
      ? 'walk the trails (sand is restricted today)'
      : 'walk the trails');
  }
  if (permits(board)) {
    phrases.push('stroll the boardwalk');
  }
  if (permits(picnic)) {
    phrases.push('share a picnic in the designated area');
  }
  return phrases;
}

function _joinProse(phrases) {
  if (!phrases.length) return '';
  if (phrases.length === 1) return phrases[0];
  if (phrases.length === 2) return phrases.join(' and ');
  return phrases.slice(0, -1).join(', ') + ', and ' + phrases[phrases.length - 1];
}

function buildActivitiesCard(beach, dogPolicy, amenities, hoursToday) {
  const phrases = _activityPhrases(beach, dogPolicy, amenities, hoursToday);
  if (!phrases.length) return '';
  const sentence = `Today you can ${_joinProse(phrases)}.`;
  return `<section class="card activities-card">
    <p class="activities-prose">${escHtml(sentence)}</p>
  </section>`;
}

// Alternatives card — renders when (a) dogs not allowed here, or
// (b) sand/water prohibited (trails-only). Lists top 3 nearby beaches
// from the alternatives array returned by get_beach_info.
function buildAlternativesSection(dogPolicy, alternatives) {
  if (!Array.isArray(alternatives) || alternatives.length === 0) return '';
  const isNoDogs = !!dogPolicy && (
    dogPolicy.dogs_allowed === 'no' ||
    (dogPolicy.has_on_leash === false && dogPolicy.has_off_leash === false)
  );
  const isSandWaterProhibited = _sandOrWaterProhibited(dogPolicy?.zone_rules);
  if (!isNoDogs && !isSandWaterProhibited) return '';

  const alts = alternatives.slice(0, 3);
  const reason = isNoDogs
    ? "Dogs aren't allowed at this beach. Try one of these nearby spots instead."
    : "Dogs can't go on the sand or in the water at this beach. These nearby spots welcome pups in the surf.";

  const rows = alts.map(a => {
    const miles = (a.distance_km || 0) * 0.621371;
    const modes = [];
    if (a.has_off_leash === true) modes.push('off-leash');
    if (a.has_on_leash  === true) modes.push('on-leash');
    return `
      <a class="alt-row" href="beach.html?fid=${a.fid}">
        <div class="alt-row-left">
          <div class="alt-name">${escHtml(a.name)}</div>
          <div class="alt-meta">${miles.toFixed(1)} mi away · ${modes.join(' + ') || 'dogs allowed'}</div>
        </div>
      </a>`;
  }).join('');

  return `<section class="card alt-card">
    <div class="alt-card-header">🐾 Try these instead</div>
    <div class="alt-card-reason">${escHtml(reason)}</div>
    <div class="alt-list">${rows}</div>
  </section>`;
}

function buildDetailsSection(dogPolicy) {
  // Bottom-of-page Details card. Structured / curated facts about the
  // beach. Currently sourced from dog_policy.zone_rules.global_notes
  // (operator + ordinance + sibling context). Distinct from
  // .beach-description which carries the LLM-generated Scout-voice
  // prose at the top of the page.
  const text = dogPolicy?.zone_rules?.global_notes;
  if (!text) return '';
  return `<section class="card">
    <h2>Details</h2>
    <div class="details-prose">${escHtml(text)}</div>
  </section>`;
}

function buildLinksSection(beach, beachFid) {
  const rows = [];
  if (!rows.length) return '';
  return `<section class="card"><h2>More info</h2>${rows.join('')}</section>`;
}


function wireCopyButtons() {
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        btn.classList.add('copied');
        const t = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.classList.remove('copied'); btn.textContent = t; }, 1500);
      } catch {}
    });
  });
}

// Time-window tab click handler now in src/zone-rules-block.js

function initMap(beach) {
  if (beach.lat == null || beach.lng == null) return;
  const mapEl = document.getElementById('map');
  if (!mapEl) return;
  const map = L.map('map', {
    zoomControl: true, scrollWheelZoom: false,
  }).setView([beach.lat, beach.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a>',
    maxZoom: 19,
  }).addTo(map);
  if (beach.geom?.type === 'Polygon' || beach.geom?.type === 'MultiPolygon') {
    const layer = L.geoJSON(beach.geom, {
      style: { color: '#1d4ed8', weight: 2, fillOpacity: 0.15 },
    }).addTo(map);
    map.fitBounds(layer.getBounds(), { padding: [16, 16] });
  } else {
    L.marker([beach.lat, beach.lng]).addTo(map);
  }
  // Map container is in a flex row whose height grows when the sibling
  // photo image loads. Leaflet caches dimensions at init — stale once
  // the photo expands the row. ResizeObserver keeps tiles fresh as the
  // container changes size (photo load, window resize, devtools open).
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => map.invalidateSize());
    ro.observe(mapEl);
  }
  // Belt-and-suspenders: also invalidate after the first paint cycle
  // and after the photo block (if any) likely settles.
  requestAnimationFrame(() => map.invalidateSize());
  setTimeout(() => map.invalidateSize(), 400);
  setTimeout(() => map.invalidateSize(), 1200);
}

load();
</script>
