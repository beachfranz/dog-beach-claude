<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beach — Dog Beach Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/photo-block.css">
<link rel="stylesheet" href="src/zone-rules-block.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f2742;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --accent: #1d4ed8;
    --green: #15803d;
    --red: #b91c1c;
    --amber: #b45309;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .page { max-width: 1200px; margin: 0 auto; }
  .body-grid {
    display: grid;
    grid-template-columns: 1fr;  /* mobile default — single column, stacked */
    gap: 0;
  }
  @media (min-width: 900px) {
    .body-grid {
      grid-template-columns: minmax(260px, 30%) 1fr;  /* 30% left rail / 70% main */
      gap: 16px;
      padding: 0 16px;
    }
    .body-grid > main { padding: 0; }
    .body-grid > aside#left-rail {
      position: sticky;
      top: 96px;  /* below sticky hero */
      align-self: start;
      padding-top: 12px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
    }
    /* Narrow-column overrides for blocks designed for wider layouts. */
    #left-rail .amenity-grid { grid-template-columns: 1fr; }
    #left-rail .zr-sections  { grid-template-columns: 1fr; }
    #left-rail .zr-card { margin: 8px 0; padding: 10px 12px; }
  }
  header.hero {
    padding: 24px 20px 16px; background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .hero-main { flex: 1; min-width: 0; }
  .beach-name {
    font-family: 'Outfit', sans-serif;
    font-size: 24px; font-weight: 700; color: var(--text);
    margin: 0 0 6px;
  }
  /* City · state inlined into the h1 — same font/size/weight,
   * lighter color so it reads as supporting info to the name. */
  .beach-region {
    color: var(--text-muted);
    margin-left: 0.4em;
    font-weight: 600;
  }
  .beach-address {
    font-size: 13px; color: var(--text); display: flex;
    align-items: center; gap: 6px;
  }
  .beach-address a {
    color: var(--accent); text-decoration: none;
  }
  .beach-address a:hover { text-decoration: underline; }
  .copy-btn {
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--card);
    font-size: 11px; color: var(--text-muted);
    transition: all 0.15s;
  }
  .copy-btn:hover { background: var(--bg); color: var(--text); }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }
  .close-btn {
    color: var(--text-muted); text-decoration: none;
    font-size: 22px; line-height: 1; padding: 4px 6px;
    border-radius: 6px; flex-shrink: 0;
  }
  .close-btn:hover { background: var(--bg); }

  section.card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin: 12px 16px;
  }
  section.card h2 {
    font-size: 14px; font-weight: 700; margin: 0 0 10px;
    color: var(--text);
  }

  /* Map block */
  #map {
    height: 200px; border-radius: 8px; border: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .map-actions {
    display: flex; flex-direction: column; gap: 8px;
  }
  .directions-btn {
    background: var(--accent); color: white; padding: 10px 14px;
    border-radius: 8px; text-decoration: none; font-weight: 600;
    font-size: 14px; text-align: center; display: block;
  }
  .directions-btn:hover { opacity: 0.92; }
  .map-address {
    font-size: 12px; color: var(--text-muted);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }

  /* Hours */
  .hours-grid {
    display: grid; grid-template-columns: max-content 1fr;
    gap: 6px 16px; font-size: 13px;
  }
  .hours-grid dt { color: var(--text-muted); font-weight: 500; }
  .hours-grid dd { margin: 0; color: var(--text); }

  /* Amenities */
  .amenity-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  }
  @media (min-width: 480px) {
    .amenity-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .amenity {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px;
    background: var(--card);
  }
  .amenity-icon { font-size: 14px; flex-shrink: 0; }
  .amenity-text { display: flex; flex-direction: column; line-height: 1.2; }
  .amenity-sub {
    font-size: 10px; color: var(--text-muted); font-weight: 500;
    margin-top: 1px;
  }
  .amenity-grid { gap: 4px; }
  /* .amenity.absent and .amenity.unknown no longer rendered — both
   * filter out at the JS layer until the user-feedback affordance
   * lands (project_amenity_user_feedback.md). */

  /* Alternatives card — shows on beaches where dogs aren't allowed
   * or where sand/water access is prohibited. Mirrors detail.html's
   * "Try these instead" card. */
  .alt-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .alt-card-header {
    font-size: 14px; font-weight: 700; color: var(--text);
    margin-bottom: 4px;
  }
  .alt-card-reason {
    font-size: 12px; color: var(--text-muted); margin-bottom: 10px;
  }
  .alt-list { display: flex; flex-direction: column; gap: 8px; }
  .alt-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    text-decoration: none; color: inherit;
    transition: background 0.1s;
  }
  .alt-row:hover { background: rgba(0,0,0,0.02); }
  .alt-row-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .alt-name { font-weight: 600; font-size: 13px; color: var(--text); }
  .alt-meta { font-size: 11px; color: var(--text-muted); }
  .alt-row-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  /* Zone-rules styles now in src/zone-rules-block.css (shared block) */

  /* Links block */
  .link-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; text-decoration: none; color: var(--text);
    font-size: 13px; margin-bottom: 8px;
    transition: background 0.1s;
  }
  .link-row:hover { background: var(--bg); }
  .link-row .arrow { margin-left: auto; color: var(--text-muted); }

  /* Loading / error */
  .state {
    display: flex; flex-direction: column; align-items: center;
    padding: 80px 20px; gap: 12px; color: var(--text-muted);
  }
  .state-icon { font-size: 36px; }

  /* Details narrative — structured / curated facts (zone_rules.global_notes).
     Dimmer than .beach-description so the LLM-generated description at
     top carries the page; details supplement, don't compete. */
  .details-prose {
    font-size: 13px; color: var(--text-muted); line-height: 1.55;
    white-space: pre-wrap;
  }

  /* Beach description (LLM-generated, voice-led) */
  .beach-description {
    font-size: 14px; color: var(--text); line-height: 1.6;
    padding: 14px 16px; margin: 0 16px 12px;
    background: var(--card); border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
  }

  /* Hero photo block — shared component in src/photo-block.css. The
     wrapper just provides page-edge gutter; sizing/layout is owned by
     .photo-block in the shared sheet. */
  .photo-block-wrap { margin: 0 16px 12px; }

  /* Location card — full-width map in main content. */
  .location-card #map {
    height: 360px; border-radius: 8px; border: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .location-card .directions-btn {
    background: var(--accent); color: white; padding: 10px 14px;
    border-radius: 6px; text-decoration: none; font-weight: 600;
    font-size: 14px; text-align: center; display: inline-block;
    margin-right: 8px;
  }
  .location-card .map-address {
    font-size: 12px; color: var(--text-muted); display: inline-flex;
    align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1.3;
    margin-top: 6px;
  }
</style>
</head>
<body>

<div class="page">
  <header class="hero">
    <div class="hero-main">
      <h1 class="beach-name" id="beach-name">Loading...</h1>
      <div class="beach-address" id="beach-address"></div>
    </div>
    <a class="close-btn" id="close-btn" href="index.html">✕</a>
  </header>

  <div class="body-grid" id="body-grid">
    <aside id="left-rail"></aside>
    <main id="main-content">
      <div class="state">
        <div class="state-icon">🏖️</div>
        <div>Loading beach info…</div>
      </div>
    </main>
  </div>
</div>

<script src="src/photo-block.js"></script>
<script src="src/zone-rules-block.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script>
const SUPABASE_URL = 'https://ehlzbwtrsxaaukurekau.supabase.co';
const ANON_KEY     = 'sb_publishable_lAg7YdZ3w7S5fN8jgiExKQ_3-KtW3xk';

const params       = new URLSearchParams(location.search);
const fid          = params.get('fid');
const locationId   = params.get('location_id');
const dateFromQs   = params.get('date');

document.getElementById('close-btn').href =
  fid ? `index.html?fid=${fid}` : (locationId ? `index.html?location=${locationId}` : 'index.html');

// Zone-rules constants + helpers + renderers now live in
// src/zone-rules-block.js (window.ZoneRulesBlock). escHtml is kept here
// because it's used throughout beach.html.

const escHtml = s => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function _currentLocalHour(timezone) {
  const tz = timezone || 'America/Los_Angeles';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: '2-digit', hour12: false,
  }).formatToParts(new Date());
  const h = parts.find(p => p.type === 'hour')?.value;
  return h != null ? (parseInt(h, 10) % 24) : null;
}

async function load() {
  if (!fid && !locationId) return showError('No beach specified.');
  let resolvedFid = fid;
  // Resolve location_id → fid by hitting beaches_gold via PostgREST
  if (!resolvedFid && locationId) {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/beaches_gold?select=fid&location_id=eq.${encodeURIComponent(locationId)}&limit=1`,
      { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` }});
    const rows = await r.json();
    if (!rows?.[0]?.fid) return showError('Beach not found.');
    resolvedFid = rows[0].fid;
  }

  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_beach_info`, {
      method: 'POST',
      headers: {
        apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_fid: parseInt(resolvedFid, 10) }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    if (!data?.beach) return showError('Beach not found.');
    render(data, resolvedFid);
  } catch (err) {
    console.error(err);
    showError(`Failed to load: ${err.message}`);
  }
}

function showError(msg) {
  document.getElementById('beach-name').textContent = 'Beach';
  document.getElementById('main-content').innerHTML = `
    <div class="state"><div class="state-icon">🐕</div><div>${escHtml(msg)}</div></div>`;
}

function render(data, beachFid) {
  const { beach, dog_policy, amenities } = data;
  document.title = `${beach.display_name} — Dog Beach Scout`;
  // Beach name + inline region (city · state) — same h1, lighter color.
  const nameEl = document.getElementById('beach-name');
  nameEl.textContent = beach.display_name;
  const regionParts = [];
  if (beach.county) regionParts.push(beach.county);
  if (beach.state)  regionParts.push(beach.state);
  if (regionParts.length) {
    const span = document.createElement('span');
    span.className = 'beach-region';
    span.textContent = regionParts.join(' · ');
    nameEl.appendChild(span);
  }

  // Address with copy button + native maps deep-link.
  // No address → no row (lat/lng fallback retired).
  const addrEl = document.getElementById('beach-address');
  if (beach.address) {
    const mapsUrl = buildMapsUrl(beach);
    addrEl.innerHTML = `📍 <a href="${escHtml(mapsUrl)}" target="_blank" rel="noopener">${escHtml(beach.address)}</a>
      <button class="copy-btn" type="button" data-copy="${escHtml(beach.address)}">Copy</button>`;
  } else {
    addrEl.style.display = 'none';
  }

  // Two-column layout (desktop):
  //   LEFT RAIL (30%): at-a-glance compact info — amenities + zone rules.
  //   MAIN  (70%): description, photos, hours, MAP, details, links.
  // Mobile collapses to a single stacked column (left rail first).
  // Description = LLM-generated Scout-voice prose.
  // Details = structured / curated facts (currently from
  // dog_policy.zone_rules.global_notes; hidden when empty).
  // Two distinct things — Franz, 2026-05-10.
  const leftRail = [];
  leftRail.push(buildAmenitiesSection(amenities));
  // Pass empty beachName — the page hero already shows it above.
  const _zrHtml = window.ZoneRulesBlock.buildHtml(
    dog_policy?.zone_rules,
    { isToday: true, currentLocalHour: _currentLocalHour(beach.timezone) },
    ''
  );
  if (_zrHtml) leftRail.push(`<section class="card"><h2>Dog Policy</h2>${_zrHtml}</section>`);
  document.getElementById('left-rail').innerHTML = leftRail.filter(Boolean).join('');

  const main = [];
  // Alternatives card first — when current beach prohibits dogs or
  // blocks sand/water access, surface the redirect prominently
  // before description/photos/etc.
  main.push(buildAlternativesSection(dog_policy, data.alternatives));
  main.push(buildDescriptionSection(data.description));
  main.push('<div class="photo-block-wrap" id="photo-block-mount"></div>');
  main.push(buildHoursSection(beach, amenities));
  main.push(buildLocationSection(beach));
  main.push(buildDetailsSection(dog_policy));
  main.push(buildLinksSection(beach, beachFid));
  document.getElementById('main-content').innerHTML = main.filter(Boolean).join('');

  // Shared photo block — 1 hero + 5 thumbs + view-all (src/photo-block.js).
  // Mount AFTER the section HTML has been injected so the target exists.
  PhotoBlock.render(
    document.getElementById('photo-block-mount'),
    data.photos,
    { viewAllHref: `gallery.html?fid=${beachFid}` }
  );

  wireCopyButtons();
  initMap(beach);
}

function buildMapsUrl(beach) {
  const dest = beach.address
    ? encodeURIComponent(beach.address)
    : `${beach.lat},${beach.lng}`;
  return `https://www.google.com/maps/dir/?api=1&destination=${dest}`;
}

function buildDescriptionSection(description) {
  if (!description?.text) return '';
  return `<div class="beach-description">${escHtml(description.text)}</div>`;
}

function buildLocationSection(beach) {
  if (beach.lat == null || beach.lng == null) return '';
  const directionsUrl = buildMapsUrl(beach);
  const addrLine = beach.address
    ? `<span>${escHtml(beach.address)}</span>
       <button class="copy-btn" type="button" data-copy="${escHtml(beach.address)}">Copy</button>`
    : `<span>${beach.lat.toFixed(4)}°, ${beach.lng.toFixed(4)}°</span>`;
  return `<section class="card location-card">
    <h2>Location</h2>
    <div id="map"></div>
    <a class="directions-btn" href="${escHtml(directionsUrl)}" target="_blank" rel="noopener">📍 Get directions</a>
    <div class="map-address">${addrLine}</div>
  </section>`;
}

function buildHoursSection(beach, amenities) {
  const hoursText = amenities?.hours_text;
  const open = beach.open_time, close = beach.close_time;
  // beaches_gold.open_time/close_time is 05:00–22:00 for 1,868 of 1,873
  // scoreable beaches — a universal default seed, not real beach hours.
  // Treat that exact pair as "no data" and rely on Posted hours_text
  // instead. Any non-default pair (or pair where one side is set
  // distinctively) renders as before.
  const isDefault = open === '05:00' && close === '22:00';
  const showStructured = (open || close) && !isDefault && !hoursText;
  if (!hoursText && !showStructured) return '';
  const rows = [];
  if (hoursText) rows.push(`<dt>Posted</dt><dd>${escHtml(hoursText)}</dd>`);
  if (showStructured) {
    const range = (open && close) ? `${escHtml(open)} – ${escHtml(close)}`
                : (open ? `Opens ${escHtml(open)}` : `Closes ${escHtml(close)}`);
    rows.push(`<dt>Gate hours</dt><dd>${range}</dd>`);
  }
  return `<section class="card">
    <h2>Hours</h2>
    <dl class="hours-grid">${rows.join('')}</dl>
  </section>`;
}

const AMENITY_DEFS = [
  { key: 'has_parking',         icon: '🅿️',  label: 'Parking' },
  { key: 'has_restrooms',       icon: '🚻',  label: 'Restrooms' },
  { key: 'has_showers',         icon: '🚿',  label: 'Showers' },
  { key: 'has_drinking_water',  icon: '💧',  label: 'Drinking water' },
  { key: 'has_picnic_area',     icon: '🧺',  label: 'Picnic area' },
  { key: 'has_fire_pits',       icon: '🔥',  label: 'Fire pits' },
  { key: 'has_lifeguards',      icon: '🛟',  label: 'Lifeguards' },
  { key: 'has_food',            icon: '🍔',  label: 'Food / concessions' },
  { key: 'has_disabled_access', icon: '♿',  label: 'ADA access' },
];

const PARKING_TYPE_LABEL = {
  lot: 'Lot', mixed: 'Mixed', metered: 'Metered',
  street: 'Street', none: 'No parking',
};
// OSM-style subtypes — used when parking_type is missing but
// parking_subtype is present (OSM emitter pathway).
const PARKING_SUBTYPE_LABEL = {
  surface: 'Lot', street_side: 'Street', 'multi-storey': 'Garage',
  multi_storey: 'Garage', underground: 'Garage', carports: 'Carport',
  rooftop: 'Rooftop',
};

function _parkingTypeLabel(amenities) {
  // Prefer the LLM enum; fall back to OSM-style subtype mapping.
  if (amenities.parking_type) return PARKING_TYPE_LABEL[amenities.parking_type] || '';
  if (amenities.parking_subtype) return PARKING_SUBTYPE_LABEL[amenities.parking_subtype] || '';
  return '';
}

function _parkingCostLabel(amenities) {
  // Structured signal wins: parking_fee = true → Paid, false → Free.
  if (amenities.parking_fee === true)  return 'Paid';
  if (amenities.parking_fee === false) return 'Free';
  // Fallback: metered is always paid by definition.
  if (amenities.parking_type === 'metered') return 'Paid';
  // Last resort: regex parking_notes prose (LLM-supplied "$5/day" etc).
  const n = String(amenities.parking_notes || '');
  if (/\$|\bfee\b|\bpaid\b/i.test(n)) return 'Paid';
  if (/\bfree\b/i.test(n))           return 'Free';
  return '';
}

function _renderAmenityTile(def, amenities) {
  if (def.key === 'has_parking') {
    const sub = [
      _parkingTypeLabel(amenities),
      _parkingCostLabel(amenities),
    ].filter(Boolean).join(' · ');
    return `<div class="amenity">
      <span class="amenity-icon">${def.icon}</span>
      <span class="amenity-text">
        <span class="amenity-label">${def.label}</span>
        ${sub ? `<span class="amenity-sub">${escHtml(sub)}</span>` : ''}
      </span>
    </div>`;
  }
  return `<div class="amenity">
    <span class="amenity-icon">${def.icon}</span>
    <span class="amenity-label">${def.label}</span>
  </div>`;
}

function buildAmenitiesSection(amenities) {
  if (!amenities) return '';
  // Show only confirmed-present amenities. Confirmed-absent are hidden
  // entirely; unknowns (null/undefined) are also hidden for now —
  // they become visible again once the user-feedback affordance ships
  // (see project_amenity_user_feedback.md).
  //
  // Special-case parking: if we have any parking-derived field (fee /
  // subtype / type / notes), parking obviously exists. Render the tile
  // even when has_parking itself is null. This handles the case where
  // OSM's closest parking POI gave us fee+subtype tags but the
  // consensus on has_parking remained unresolved.
  const cells = AMENITY_DEFS
    .filter(d => {
      if (amenities[d.key] === true) return true;
      if (d.key === 'has_parking') {
        return amenities.parking_fee !== null && amenities.parking_fee !== undefined
            || amenities.parking_subtype
            || amenities.parking_type
            || amenities.parking_notes;
      }
      return false;
    })
    .map(d => _renderAmenityTile(d, amenities)).join('');
  if (!cells) return '';
  return `<section class="card">
    <h2>Amenities</h2>
    <div class="amenity-grid">${cells}</div>
  </section>`;
}

// _renderSectionPill / _renderTimeCell / _renderZoneCard /
// buildZoneRulesSection / time-tab handler all moved to
// src/zone-rules-block.js (shared with detail.html).

// True if zone_rules says any of sand/water/dunes/tide_pools is
// 'not_allowed' — the "trails-only beach" pattern.
function _sandOrWaterProhibited(zr) {
  if (!zr || typeof zr !== 'object') return false;
  const seasons = (Array.isArray(zr.seasons) && zr.seasons.length)
    ? zr.seasons
    : (Array.isArray(zr.regions) ? [{ regions: zr.regions }] : []);
  const blocked = ['sand', 'water_swim', 'dunes', 'tide_pools'];
  for (const s of seasons) {
    const regions = Array.isArray(s.regions) ? s.regions : [];
    for (const reg of regions) {
      const sections = reg.sections || {};
      for (const name of blocked) {
        if (sections[name]?.rule === 'not_allowed') return true;
      }
    }
  }
  return false;
}

// Alternatives card — renders when (a) dogs not allowed here, or
// (b) sand/water prohibited (trails-only). Lists top 3 nearby beaches
// from the alternatives array returned by get_beach_info.
function buildAlternativesSection(dogPolicy, alternatives) {
  if (!Array.isArray(alternatives) || alternatives.length === 0) return '';
  const isNoDogs = !!dogPolicy && (
    dogPolicy.dogs_allowed === 'no' ||
    (dogPolicy.has_on_leash === false && dogPolicy.has_off_leash === false)
  );
  const isSandWaterProhibited = _sandOrWaterProhibited(dogPolicy?.zone_rules);
  if (!isNoDogs && !isSandWaterProhibited) return '';

  const alts = alternatives.slice(0, 3);
  const reason = isNoDogs
    ? "Dogs aren't allowed at this beach. Try one of these nearby spots instead."
    : "Dogs can't go on the sand or in the water at this beach. These nearby spots welcome pups in the surf.";

  const rows = alts.map(a => {
    const miles = (a.distance_km || 0) * 0.621371;
    const modes = [];
    if (a.has_off_leash === true) modes.push('off-leash');
    if (a.has_on_leash  === true) modes.push('on-leash');
    return `
      <a class="alt-row" href="beach.html?fid=${a.fid}">
        <div class="alt-row-left">
          <div class="alt-name">${escHtml(a.name)}</div>
          <div class="alt-meta">${miles.toFixed(1)} mi away · ${modes.join(' + ') || 'dogs allowed'}</div>
        </div>
      </a>`;
  }).join('');

  return `<section class="card alt-card">
    <div class="alt-card-header">🐾 Try these instead</div>
    <div class="alt-card-reason">${escHtml(reason)}</div>
    <div class="alt-list">${rows}</div>
  </section>`;
}

function buildDetailsSection(dogPolicy) {
  // Bottom-of-page Details card. Structured / curated facts about the
  // beach. Currently sourced from dog_policy.zone_rules.global_notes
  // (operator + ordinance + sibling context). Distinct from
  // .beach-description which carries the LLM-generated Scout-voice
  // prose at the top of the page.
  const text = dogPolicy?.zone_rules?.global_notes;
  if (!text) return '';
  return `<section class="card">
    <h2>Details</h2>
    <div class="details-prose">${escHtml(text)}</div>
  </section>`;
}

function buildLinksSection(beach, beachFid) {
  const today = new Date().toISOString().slice(0, 10);
  const detailHref = `detail.html?fid=${beachFid}&date=${today}`;
  const rows = [
    `<a class="link-row" href="${detailHref}">
      <span style="font-size:18px">📊</span>
      <span><strong>Today's conditions</strong><br>
        <span style="color:var(--text-muted);font-size:12px">scoring + best window + Scout</span></span>
      <span class="arrow">→</span>
    </a>`,
  ];
  if (beach.website) {
    rows.push(`<a class="link-row" href="${escHtml(beach.website)}" target="_blank" rel="noopener">
      <span style="font-size:18px">🔗</span>
      <span><strong>Operator website</strong><br>
        <span style="color:var(--text-muted);font-size:12px">${escHtml(new URL(beach.website).hostname)}</span></span>
      <span class="arrow">→</span>
    </a>`);
  }
  return `<section class="card"><h2>More info</h2>${rows.join('')}</section>`;
}


function wireCopyButtons() {
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        btn.classList.add('copied');
        const t = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.classList.remove('copied'); btn.textContent = t; }, 1500);
      } catch {}
    });
  });
}

// Time-window tab click handler now in src/zone-rules-block.js

function initMap(beach) {
  if (beach.lat == null || beach.lng == null) return;
  const map = L.map('map', {
    zoomControl: true, scrollWheelZoom: false,
  }).setView([beach.lat, beach.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a>',
    maxZoom: 19,
  }).addTo(map);
  if (beach.geom?.type === 'Polygon' || beach.geom?.type === 'MultiPolygon') {
    const layer = L.geoJSON(beach.geom, {
      style: { color: '#1d4ed8', weight: 2, fillOpacity: 0.15 },
    }).addTo(map);
    map.fitBounds(layer.getBounds(), { padding: [16, 16] });
  } else {
    L.marker([beach.lat, beach.lng]).addTo(map);
  }
}

load();
