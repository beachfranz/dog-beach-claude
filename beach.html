<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beach — Dog Beach Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/photo-block.css">
<link rel="stylesheet" href="src/zone-rules-block.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f2742;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --accent: #1d4ed8;
    --green: #16a34a;
    --red:   #dc2626;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .page { max-width: 1200px; margin: 0 auto; }
  .body-grid {
    display: grid;
    grid-template-columns: 1fr;  /* mobile default — single column, stacked */
    gap: 0;
  }
  @media (min-width: 900px) {
    .body-grid {
      grid-template-columns: minmax(280px, 34%) 1fr;  /* 34% left rail / 66% main */
      gap: 16px;
      padding: 0 16px;
    }
    .body-grid > main { padding: 0; }
    .body-grid > aside#left-rail {
      position: sticky;
      top: 96px;  /* below sticky hero */
      align-self: start;
      padding-top: 12px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
    }
    /* Narrow-column overrides for blocks designed for wider layouts. */
    #left-rail .amenity-grid { grid-template-columns: repeat(2, 1fr); }
    #left-rail .caution-grid { grid-template-columns: repeat(2, 1fr); }
    #left-rail .zr-sections  { grid-template-columns: 1fr; }
    #left-rail .zr-card { margin: 8px 0; padding: 10px 12px; }
  }
  header.hero {
    padding: 24px 20px 16px; background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .hero-main { flex: 1; min-width: 0; }
  .beach-name {
    font-family: 'Outfit', sans-serif;
    font-size: 24px; font-weight: 700; color: var(--text);
    margin: 0 0 6px;
  }
  /* Today's score badge — composite_score_v2 from the find_beaches /
   * get-beach-summary surface. Same number find.html shows. Colored by
   * score tone matching find.html's pin + disc palette. Neutral grey
   * when no score for today (out-of-season, no scoring tier, etc.). */
  .fit-badge {
    display: inline-block;
    font-size: 19px; font-weight: 700; line-height: 1.1;
    padding: 1px 9px; border-radius: 999px;
    color: white;
    background: #6b7280;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.04em;
    margin-right: 4px;
  }
  .fit-badge.tone-go  { background: #16a34a; }
  .fit-badge.tone-mid { background: #f59e0b; }
  .fit-badge.tone-low { background: #dc2626; }
  .fit-badge.tone-unk { background: #6b7280; }
  /* City · state inlined into the h1 — same font/size/weight,
   * lighter color so it reads as supporting info to the name. */
  .beach-region {
    color: var(--text-muted);
    margin-left: 0.4em;
    font-weight: 600;
  }
  .beach-address {
    font-size: 13px; color: var(--text); display: flex;
    align-items: center; gap: 6px;
  }
  .beach-address a {
    color: var(--accent); text-decoration: none;
  }
  .beach-address a:hover { text-decoration: underline; }
  .copy-btn {
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--card);
    font-size: 11px; color: var(--text-muted);
    transition: all 0.15s;
  }
  .copy-btn:hover { background: var(--bg); color: var(--text); }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }
  .close-btn {
    color: var(--text-muted); text-decoration: none;
    font-size: 22px; line-height: 1; padding: 4px 6px;
    border-radius: 6px; flex-shrink: 0;
  }
  .close-btn:hover { background: var(--bg); }

  section.card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; margin: 8px 16px;
  }
  /* Tooltips on [data-tip] — hover pill on desktop, tap-to-pin on touch. */
  [data-tip] { position: relative; }
  [data-tip]::after {
    content: attr(data-tip);
    white-space: pre-line;
    position: absolute;
    left: 50%; bottom: calc(100% + 4px);
    transform: translateX(-50%);
    background: rgba(15,23,42,0.78);
    color: rgba(255,255,255,0.95);
    padding: 4px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 500; line-height: 1.35;
    width: max-content; max-width: 220px;
    text-align: left;
    z-index: 1000; pointer-events: none;
    opacity: 0;
    transition: opacity 80ms ease-out 0s;
  }
  [data-tip]:hover::after,
  [data-tip][data-tip-open]::after {
    opacity: 1;
    transition-delay: 200ms;
  }
  [data-tip][data-tip-open]::after { transition-delay: 0ms; }

  /* ── V2 tug-of-war chart (mirror of dog-park.html chart bundle) ──
   * Shared visual language; consider extracting to src/v2-chart.css
   * if a 3rd entity type ever needs it. Per Franz 2026-05-28. */
  .hourbars-wrap { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
  .hourbars-meta {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin-bottom: 6px;
    font-size: 11px; color: var(--text-muted);
  }
  .hourbars-chart { display: flex; align-items: stretch; gap: 6px; }
  .hourbars-yaxis {
    position: relative; width: 32px; flex: none;
    font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-muted);
    margin-top: 14px;
  }
  .hourbars-yaxis > span {
    position: absolute; right: 4px; line-height: 1;
    transform: translateY(-50%); white-space: nowrap;
  }
  .hourbars-yaxis-top    { top: 0; }
  .hourbars-yaxis-mid    { top: 25%; opacity: 0.6; }
  .hourbars-yaxis-zero   { top: 50%; opacity: 0.7; }
  .hourbars-yaxis-neg-mid{ top: 75%; opacity: 0.6; }
  .hourbars-yaxis-bot    { top: 100%; }
  .hourbars-track {
    flex: 1 1 auto;
    display: flex; align-items: stretch; justify-content: space-between;
    gap: 6px; height: 180px; padding: 0 2px; position: relative;
  }
  .hourbars-track::before {
    content: ''; position: absolute; left: 0; right: 0;
    top: calc(14px + (100% - 14px) / 2);
    height: 1px; background: var(--text-muted); opacity: 0.4;
    pointer-events: none;
  }
  .hourbars-track::after {
    content: ''; position: absolute; left: 0; right: 0;
    top: 14px; bottom: 0;
    background-image:
      linear-gradient(to bottom,
        transparent calc(25% - 0.5px),
        rgba(100,116,139,0.15) calc(25% - 0.5px),
        rgba(100,116,139,0.15) calc(25% + 0.5px),
        transparent calc(25% + 0.5px),
        transparent calc(75% - 0.5px),
        rgba(100,116,139,0.15) calc(75% - 0.5px),
        rgba(100,116,139,0.15) calc(75% + 0.5px),
        transparent calc(75% + 0.5px));
    pointer-events: none;
  }
  .hourbar-col {
    flex: 1 1 0; min-width: 0; max-width: 22px;
    display: flex; flex-direction: column; height: 100%;
    cursor: help; position: relative;
  }
  .hourbar-col.bar-closed .hourbar-pos,
  .hourbar-col.bar-closed .hourbar-neg {
    background: repeating-linear-gradient(
      45deg,
      rgba(100,116,139,0.18) 0 3px,
      rgba(100,116,139,0.32) 3px 6px);
  }
  .hourbar-col.bar-closed .hourbar-score { color: var(--text-muted); }
  .hourbars-closures {
    margin-top: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 10px; color: var(--text-muted); line-height: 1.4;
  }
  .hourbar-score {
    height: 14px; flex: none; text-align: center;
    font-family: 'DM Mono', monospace; font-size: 10px;
    font-weight: 700; color: var(--text); line-height: 14px;
    font-variant-numeric: tabular-nums;
  }
  .hourbar-pos {
    flex: 1; display: flex; flex-direction: column-reverse;
    width: 100%; overflow: visible; border-radius: 3px 3px 0 0;
    position: relative;
  }
  .hourbar-neg {
    flex: 1; display: flex; flex-direction: column;
    width: 100%; overflow: hidden; border-radius: 0 0 3px 3px;
  }
  .hourbar-col:hover .hourbar-pos,
  .hourbar-col:hover .hourbar-neg { filter: brightness(1.08); }
  .hourbar-marker {
    height: 12px; flex: none; text-align: center;
    font-family: 'DM Mono', monospace; font-size: 9px;
    font-weight: 700; color: var(--text);
    letter-spacing: 0.04em; line-height: 12px;
  }
  .hourbar-dog {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    font-size: 14px; line-height: 1;
    pointer-events: none;
  }
  .hourbar-seg { width: 100%; }
  .hourbar-seg.pos-rank-1 { background: hsl(224, 32%, 33%); }
  .hourbar-seg.pos-rank-2 { background: hsl(226, 35%, 40%); }
  .hourbar-seg.pos-rank-3 { background: hsl(224, 38%, 48%); }
  .hourbar-seg.pos-rank-4 { background: hsl(221, 42%, 53%); }
  .hourbar-seg.pos-rank-5 { background: hsl(217, 46%, 60%); }
  .hourbar-seg.pos-rank-6, .hourbar-seg.pos-rank-7, .hourbar-seg.pos-rank-8,
  .hourbar-seg.pos-rank-9, .hourbar-seg.pos-rank-10, .hourbar-seg.pos-rank-11 { background: hsl(213, 47%, 68%); }
  .hourbar-seg.neg-rank-1 { background: hsl(0, 37%, 42%); }
  .hourbar-seg.neg-rank-2 { background: hsl(0, 36%, 51%); }
  .hourbar-seg.neg-rank-3 { background: hsl(0, 42%, 60%); }
  .hourbar-seg.neg-rank-4 { background: hsl(0, 45%, 71%); }
  .hourbar-axis {
    display: flex; justify-content: space-between; gap: 6px; padding: 4px 2px 0;
    font-family: 'DM Mono', monospace; font-size: 9px; color: var(--text-muted);
  }
  .hourbar-axis-label {
    flex: 1 1 0; min-width: 0; max-width: 22px;
    text-align: center; white-space: nowrap; overflow: hidden;
  }
  .hourbars-legend {
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    margin-top: 10px; padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 10px; color: var(--text-muted);
  }
  .hourbars-legend-group { display: flex; align-items: center; gap: 6px; }
  .hourbars-legend-label { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .legend-icon { display: inline-block; font-size: 12px; line-height: 1; vertical-align: middle; flex: none; margin-right: 2px; }
  .hourbars-legend-sep { color: var(--text-muted); opacity: 0.5; }
  @media (max-width: 480px) {
    .hourbar-axis-label:nth-child(odd) { visibility: hidden; }
  }
  @media (max-width: 600px) {
    .hourbars-yaxis { width: 20px; font-size: 8px; }
    .hourbars-chart { gap: 4px; }
    .hourbars-track { gap: 3px; padding: 0 1px; }
    .hourbar-col { max-width: 18px; touch-action: manipulation; }
    .hourbar-axis-label { font-size: 8px; }
    .hourbars-meta { font-size: 10px; flex-wrap: wrap; }
    [data-tip]::after { font-size: 10px; max-width: 180px; padding: 4px 6px; }
  }

  section.card h2 {
    font-size: 14px; font-weight: 700; margin: 0 0 8px;
    color: var(--text);
  }

  /* Map block */
  #map {
    height: 200px; border-radius: 8px; border: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .map-actions {
    display: flex; flex-direction: column; gap: 8px;
  }
  .directions-btn {
    background: var(--accent); color: white; padding: 10px 14px;
    border-radius: 8px; text-decoration: none; font-weight: 600;
    font-size: 14px; text-align: center; display: block;
  }
  .directions-btn:hover { opacity: 0.92; }
  .map-address {
    font-size: 12px; color: var(--text-muted);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }

  /* Hours */
  .hours-grid {
    display: grid; grid-template-columns: max-content 1fr;
    gap: 6px 16px; font-size: 13px;
  }
  .hours-grid dt { color: var(--text-muted); font-weight: 500; }
  .hours-grid dd { margin: 0; color: var(--text); }
  .hours-range { font-size: 14px; font-weight: 600; color: var(--text); margin: 0; }
  .hours-dogs-prohibited { margin: 8px 0 0; font-size: 13px; color: var(--text); }
  .hours-dogs-suggest    { margin: 2px 0 0; font-size: 13px; color: var(--text-muted); }

  /* Amenities — first card on the LHS, "Amenities" h2 should sit at
   * the same baseline as the first line of Beach text in the main
   * column (which has margin-top 28). With tightened card
   * padding (12) + h2 line-height, this lands ≈ y=28. */
  .amenities-card { margin-top: 16px; }
  .amenities-card h2 { margin-bottom: 6px; }
  .amenity-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  }
  @media (min-width: 480px) {
    .amenity-grid { grid-template-columns: repeat(3, 1fr); }
  }
  /* Sand + Water + their time-window chips claim a full row each so
   * a beach with multiple time windows reads top-down (vertical stack)
   * instead of cramming into the 2-col / 3-col grid. */
  .amenity.amenity-fullwidth { grid-column: 1 / -1; }
  .amenity {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px;
    background: var(--card);
    /* Button reset — amenity tiles became clickable in this pass.
     * Identity styling above; reset native button defaults so the tile
     * looks identical to the prior <div> rendering. */
    font-family: inherit; color: inherit; text-align: left;
    cursor: pointer; position: relative;
  }
  .amenity:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  /* Hazard background overrides dog-policy background entirely.
   * Today's environmental hazard is the dominant signal — when it
   * fires, the tile should scream. The corner ⚠ badge + click-detail
   * panel carry the specifics. Doubled selectors raise specificity
   * above .amenity.rule-* which lives later in this stylesheet. */
  .amenity.amenity.haz-moderate {
    background: rgba(251,146,60,0.55);
    border-color: rgba(154,52,18,0.55);
  }
  .amenity.amenity.haz-severe {
    background: rgba(239,68,68,0.55);
    border-color: rgba(153,27,27,0.55);
  }
  .haz-badge {
    position: absolute; top: 3px; right: 4px;
    font-size: 12px; line-height: 1; pointer-events: none;
    filter: drop-shadow(0 0 1px rgba(255,255,255,0.9));
  }
  /* Detail panel below the amenity grid — mirrors #caution-detail.
   * Single-select: opening one tile closes any other open tile. */
  .amenity-detail {
    margin-top: 6px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    background: rgba(0,0,0,0.02); font-size: 12px;
    color: var(--text); line-height: 1.35;
  }
  .amenity-detail-label { font-weight: 600; margin-bottom: 2px; }
  .amenity-detail-value { font-weight: 500; color: var(--text-muted); margin-left: 6px; }
  .amenity-detail-haz   { margin-top: 4px; color: #991b1b; font-size: 11px; }
  .amenity-icon { font-size: 14px; flex-shrink: 0; }
  .amenity-text { display: flex; flex-direction: column; line-height: 1.2; }
  .amenity-sub {
    font-size: 10px; color: var(--text-muted); font-weight: 500;
    margin-top: 1px;
  }
  .amenity-grid { gap: 4px; }
  /* Long labels wrap inside the narrow 2-col cell. */
  .amenity-label { white-space: normal; line-height: 1.2; }
  /* Tiles tinted by dog-policy rule when the section has one. */
  .amenity.rule-off_leash   { background: rgba(34,197,94,0.45); border-color: rgba(21,128,61,0.42); }
  .amenity.rule-on_leash    { background: rgba(251,191,36,0.53); border-color: rgba(180,83,9,0.42); }
  .amenity.rule-not_allowed { background: rgba(239,68,68,0.45); border-color: rgba(153,27,27,0.42); }
  .amenity.rule-unknown     { background: rgba(0,0,0,0.04); }
  /* Zone-name sub-header inside the unified Amenities card (multi-zone beaches). */
  .amenity-zone-header {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-muted);
    margin: 8px 0 4px;
  }
  .amenity-zone-header:first-child { margin-top: 0; }
  /* .amenity.absent and .amenity.unknown no longer rendered — both
   * filter out at the JS layer until the user-feedback affordance
   * lands (project_amenity_user_feedback.md). */

  /* Time-bucket tiles render as standard .amenity tiles in the grid
   * (Franz 2026-05-20). The existing .amenity.rule-* coloring and
   * .amenity-sub for the time range do all the work — no extra CSS. */

  /* Cautions card — same visual language as amenities (compact tile
   * grid, icon + short label). Click expands a detail panel below
   * the grid with the full dog-impact text. Severity tints mirror
   * .amenity.rule-* color semantics. */
  .cautions-card h2 { margin-bottom: 6px; }
  .caution-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;
  }
  @media (min-width: 480px) {
    .caution-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .caution-tile {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px; background: var(--card);
    text-align: left; cursor: pointer; font-family: inherit;
    color: inherit; width: 100%;
  }
  .caution-tile:hover { filter: brightness(0.97); }
  .caution-tile[aria-expanded="true"] { outline: 2px solid rgba(15,23,42,0.55); outline-offset: -1px; }
  .caution-tile .amenity-icon { font-size: 14px; flex-shrink: 0; }
  .caution-tile .amenity-label { white-space: normal; line-height: 1.2; }
  /* Severity tints: severe/no_go = red, moderate/caution = amber, minor/advisory = neutral */
  .caution-tile.sev-no_go    { background: rgba(239,68,68,0.45);  border-color: rgba(153,27,27,0.42); }
  /* Moderate-severity tint: reddish-amber (orange-400) rather than the
   * pure amber used for rule-on_leash, so cautions read clearly as
   * "warning" not "status." */
  .caution-tile.sev-caution  { background: rgba(251,146,60,0.55); border-color: rgba(154,52,18,0.45); }
  .caution-tile.sev-advisory { background: rgba(0,0,0,0.04); }
  .caution-detail {
    margin-top: 8px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); font-size: 12px; line-height: 1.4;
    text-align: center;
  }
  .caution-detail[hidden] { display: none; }

  /* Weather card — compact icon + chips row, mimics index.html. */
  .weather-card .weather-now {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 4px 0 2px;
  }
  .weather-now-cond {
    font-size: 36px; line-height: 1;
  }
  .weather-chips {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 6px 8px;
  }
  .weather-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; padding: 3px 8px;
    border-radius: 999px;
    background: rgba(0,0,0,0.05); color: var(--text);
  }
  .weather-loading { color: var(--text-muted); font-size: 12px; padding: 8px 0; }

  /* Hourly score bar — ported from detail.html. Renders inside
   * the Best Window card. */
  .score-row {
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px 56px 0; margin-top: 10px;
    border-top: 1px solid var(--border);
  }
  .score-row-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 500;
    color: var(--text-muted); letter-spacing: 0.04em;
  }
  .score-bars-wrap {
    display: flex; align-items: flex-end; gap: 3px;
    height: 58px;
  }
  .score-bar-col {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; flex: 1; min-width: 0;
  }
  .score-bar-value {
    font-family: 'DM Mono', monospace;
    font-size: 9px; color: var(--text-muted);
    white-space: nowrap; line-height: 1;
  }
  .score-bar-dog { font-size: 10px; line-height: 1; min-height: 12px; }
  .score-bar {
    width: 100%; border-radius: 3px 3px 0 0;
    min-height: 4px; transition: opacity 0.15s;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* Stacked segments — same palette as the Your-Fit bar so the two
   * surfaces share visual language. Weather on top, then amenities,
   * then access at the bottom. */
  .score-bar-seg { width: 100%; flex-shrink: 0; }
  .score-bar-seg-weather   { background: #f59e0b; }
  .score-bar-seg-amenities { background: #0ea5e9; }
  .score-bar-seg-access    { background: #16a34a; }
  .score-bar-seg-excluded  { background: rgba(239,68,68,0.45); width: 100%; }
  .score-x-axis { display: flex; gap: 3px; padding: 2px 0 0; }
  .score-x-label {
    flex: 1; text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 9px; color: var(--text-muted);
    white-space: nowrap; overflow: hidden;
  }

  /* Best-time card — same header shape as the Your-Fit card: title
   * left, headline right (the time-range). When hourly detail is
   * available, the headline becomes a clickable affordance that opens
   * the per-hour modal. */
  .besttime-card h2 {
    font-size: 16px; font-weight: 700; margin: 0; color: var(--text);
  }
  .besttime-header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px;
  }
  .besttime-headline {
    font-size: 28px; font-weight: 700; color: var(--text);
    letter-spacing: -0.02em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .besttime-card.clickable .besttime-headline {
    cursor: pointer;
    text-decoration: underline; text-decoration-color: rgba(0,0,0,0.18);
    text-underline-offset: 2px;
  }
  .besttime-card.clickable .besttime-headline:hover {
    text-decoration-color: var(--text);
  }

  /* Detail modal — iframe overlay opened from the Best Window card. */
  .detail-modal {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.72);
    display: none;
    z-index: 9999;
    padding: 24px;
    align-items: center; justify-content: center;
  }
  .detail-modal.open { display: flex; }
  .detail-modal-inner {
    position: relative;

    border-radius: 12px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);

  .detail-modal-inner iframe { width: 100%; height: 100%; border: 0; }
  .detail-modal-close {

    border: 0; width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; font-size: 16px; line-height: 1;
    z-index: 1;

  /* Scout blurb — now nested inside the Best Time card. Paragraph
   * narrative; fades in when LLM call returns. */
  #scout-blurb {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; line-height: 1.55;
    color: var(--text);
    margin-top: 8px;

  /* Advisories list — per-metric advisory/caution/no_go rows.

  .cautions-card ul.advisory-list {
    list-style: none; padding: 0; margin: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 5px;
  }
  .advisory-row {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 6px 8px; border-radius: 0 4px 4px 0;

  .advisory-icon { font-size: 14px; line-height: 1.3; flex-shrink: 0; }

  .advisory-headline { display: flex; align-items: baseline; gap: 6px; }
  .advisory-label { font-weight: 600; }

  .advisory-time  { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  /* Conditions domain: burnt-amber (amber-500 nudged ~7% toward red) for
   * caution; distinct from the amber-400 (yellow-leaning) used by
   * Amenities on_leash tiles so the two domains never collide visually. */
  .advisory-advisory { background: rgba(37,99,235,0.08); border-left-color: #1d4ed8; }
  .advisory-caution  { background: rgba(247,140,18,0.53); border-left-color: rgba(180,83,9,0.58); }
  .advisory-no_go    { background: rgba(239,68,68,0.45);  border-left-color: rgba(153,27,27,0.42); }

  /* Tide card — one smooth line, hi/lo bubbles, NOW dot. */
  .weather-card svg.tide-curve {
    display: block; width: 80%; height: 120px;
    margin: 0 auto;
    border-radius: 8px;
    background: transparent;
  }
  /* Smooth gradient fill under the curve — light at top, deep at bottom */
  .weather-card .tide-fill { fill: url(#tide-grad); }
  .weather-card .tide-stroke {
    fill: none; stroke: #0369a1; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  /* Hi/lo markers — text only, no bubble border */
  .weather-card .tide-marker-arrow { fill: #0369a1; font-size: 11px; font-weight: 700; }
  .weather-card .tide-marker-text  { fill: #0f2742; font-size: 11px; font-weight: 700; }
  /* Zero-tide reference line — dashed charcoal at v=0ft */
  .weather-card .tide-zero-line {
    stroke: rgba(15,39,66,0.55); stroke-width: 1; stroke-dasharray: 3 3;
  }
  .weather-card .tide-zero-label {
    font-size: 9px; fill: rgba(15,39,66,0.55); font-weight: 600;
  }
  /* Hour-scale labels along the bottom */
  .weather-card .tide-hour-axis-label {
    font-size: 9px; fill: rgba(15,39,66,0.55); font-weight: 600;
  }
  /* Hover zones — 48 invisible rects across the chart, each carrying
   * a native SVG <title>. Browser shows a system tooltip on hover. */
  .weather-card .tide-hover-zone { fill: rgba(0,0,0,0); cursor: help; }
  /* NOW marker — vertical line + label at top */
  .weather-card .tide-now-line {
    stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 3 2;
  }
  .weather-card .tide-now-dot { fill: #f59e0b; stroke: #fff; stroke-width: 2; }
  .weather-card .tide-now-label {
    font-size: 10px; font-weight: 700; fill: #92400e;
  }
  /* Hour ticks along the bottom */
  .weather-card .tide-hour-tick   { stroke: rgba(2,132,199,0.18); stroke-width: 1; }
  .weather-card .tide-hour-label  { font-size: 9px; fill: rgba(15,39,66,0.55); }

  .weather-card .tide-events {
    display: flex; flex-wrap: wrap; gap: 4px 10px;
    font-size: 11px; color: var(--text-muted); margin-top: 8px;
  }
  .weather-card .tide-events strong { color: var(--text); font-weight: 600; }
  .weather-card .tide-empty { color: var(--text-muted); font-size: 12px; font-style: italic; }

  /* Alternatives card — shows on beaches where dogs aren't allowed
   * or where sand/water access is prohibited. Mirrors detail.html's
   * "Try these instead" card. */
  .alt-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px;
  }
  .alt-card-header {
    font-size: 14px; font-weight: 700; color: var(--text);
    margin-bottom: 4px;
  }
  .alt-card-reason {
    font-size: 12px; color: var(--text-muted); margin-bottom: 10px;
  }
  .alt-list { display: flex; flex-direction: column; gap: 8px; }
  .alt-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    text-decoration: none; color: inherit;
    transition: background 0.1s;
  }
  .alt-row:hover { background: rgba(0,0,0,0.02); }
  .alt-row-left { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .alt-name { font-weight: 600; font-size: 13px; color: var(--text); }
  .alt-meta { font-size: 11px; color: var(--text-muted); }
  .alt-row-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  /* Dog-park suggestion card — additive ("Extend the day") OR reframed
     ("Better fit right now") depending on trigger tier. Empty mount is
     display:none until loadDogParkSuggestion fills it. */
  .dog-park-card-additive {
    border-left: 3px solid #15803d;
    background: #f0fdf4;
    cursor: pointer;
    transition: background 0.15s;
  }
  .dog-park-card-additive:hover { background: #ecfccb; }
  .dog-park-card-reframed {
    border-left: 4px solid #b45309;

    transition: background 0.15s;
  }
  .dog-park-card-reframed:hover { background: #fef3c7; }
  .dp-card-heading {
    font-size: 14px; font-weight: 700; color: var(--text);
    margin-bottom: 2px;
  }
  .dp-card-reason {
    font-size: 13px; color: var(--text-muted); margin-bottom: 8px;
  }
  .dp-card-llm {
    font-size: 13px; color: var(--text); line-height: 1.5; margin: 6px 0;
  }
  .dp-card-llm:empty { display: none; }
  .dp-card-body { margin-top: 8px; }
  .dp-name { font-weight: 600; font-size: 14px; color: var(--text); }
  .dp-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .dp-verified-badge {

  /* Zone-rules styles now in src/zone-rules-block.css (shared block) */

  /* Links block */
  .link-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; text-decoration: none; color: var(--text);

  .link-row:hover { background: var(--bg); }

  /* Loading / error */
  .state {

  }
  .state-icon { font-size: 36px; }

  /* Details narrative — structured / curated facts (zone_rules.global_notes).
     Dimmer than .beach-description so the LLM-generated description at
     top carries the page; details supplement, don't compete. */
  .details-prose {
    font-size: 13px; color: var(--text-muted); line-height: 1.55;
    white-space: pre-wrap;
  }

  /* Beach description (LLM-generated, voice-led) */
  .beach-description {
    /* legacy class kept for any inline use; the overview card supersedes it. */
    font-size: 14px; color: var(--text); line-height: 1.55;
  }
  /* Appeal card — stacked horizontal bar of contributions (Access +
   * Amenities + Weather), summing to Overall. Empty tail = unfilled

  .appeal-card h2 {
    font-size: 16px; font-weight: 700; margin: 0; color: var(--text);
  }
  .appeal-card .appeal-pref {
    font-size: 12px; font-weight: 500; color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .appeal-header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px;
  }
  .appeal-overall { font-variant-numeric: tabular-nums; line-height: 1; }
  .appeal-overall-num {
    font-size: 28px; font-weight: 700; color: var(--text);
    letter-spacing: -0.02em;
  }
  .appeal-overall-max {
    font-size: 13px; font-weight: 500; color: var(--text-muted);
    margin-left: 1px;
  }
  /* Pack list — chip strip showing rule-derived gear to bring.
   * Hover/long-press a chip for its reason (sunscreen because UV X). */
  .packlist-card h2 {
    font-size: 16px; font-weight: 700; margin: 0 0 10px; color: var(--text);
  }
  .packlist-chips {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  }
  .packlist-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 999px;
    background: rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.06);
    font-size: 13px; color: var(--text);
    cursor: help;
  }
  .packlist-icon { font-size: 15px; line-height: 1; }
  .packlist-label { font-weight: 500; }

  /* Beach text — bare prose at top of main column, no card chrome.
   * Same edge padding as cards so it lines up vertically. */
  .overview-blurb {
    font-size: 14px; color: var(--text); line-height: 1.55;
    margin: 28px 16px 16px;
  }
  /* One-sentence accessibility hint — same edge padding as overview,
   * sits directly under the blurb. Italic to signal it's a tag, not
   * marketing prose. Full detail is in the dedicated card below. */
  .overview-accessibility {
    font-size: 13px; color: var(--text); line-height: 1.5;
    margin: -8px 16px 16px;
    font-style: italic; opacity: 0.85;
  }
  /* Dedicated Accessibility card — sits just above Pack List. Each
   * feature gets its own row with an icon and label. Notes / source
   * appear at the bottom in quieter text. */
  .accessibility-card h2 {
    font-size: 16px; font-weight: 700; margin: 0 0 10px; color: var(--text);
  }
  .acc-rows { display: flex; flex-direction: column; gap: 8px; }
  .acc-row {
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 14px; color: var(--text); line-height: 1.45;
  }
  .acc-icon { font-size: 18px; line-height: 1.2; flex: 0 0 auto; }
  .acc-label { flex: 1 1 auto; }
  .acc-label a { color: var(--text); text-decoration: underline; }
  .acc-notes {
    font-size: 13px; color: var(--text); line-height: 1.5;
    margin: 12px 0 0; opacity: 0.85;
  }
  .acc-sources {
    font-size: 11px; color: var(--text); opacity: 0.55;
    margin: 8px 0 0;
  }
  /* Scout blurb — uniform 14px / 1.55 line-height. */
  .scout-card #scout-blurb {
    font-size: 14px; line-height: 1.55;
    color: var(--text);
    margin: 0; padding: 0;
    opacity: 1;
  }
  /* Today's activities — deterministic prose, lives below the Scout
   * blurb inside the same card. Small top margin separates them. */
  .activities-prose {
    font-size: 14px; line-height: 1.55; color: var(--text);
    margin: 8px 0 0;
  }
  /* Scout CTA — "Wanna go? Drive ~XX min.   [🐾 Let Friends Know] [Get directions →]" */
  .scout-cta {
    margin-top: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 10px;
    font-size: 14px; color: var(--text);
  }
  .scout-cta:empty { display: none; }
  .scout-cta-text { font-weight: 600; }
  .scout-cta-actions {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .scout-cta-btn {
    background: var(--accent); color: white;
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    text-decoration: none; display: inline-block;
    border: 0; cursor: pointer;
    font-family: inherit;
  }
  .scout-cta-btn:hover { opacity: 0.92; }
  .scout-cta-btn-friends {
    background: rgba(34,197,94,0.18); color: var(--text);
    border: 1px solid rgba(34,197,94,0.45);
  }
  .scout-cta-btn-friends:hover { background: rgba(34,197,94,0.28); opacity: 1; }
  #scout-blurb strong { font-weight: 700; }

  /* Hero photo block — shared component in src/photo-block.css. The
     wrapper just provides page-edge gutter; sizing/layout is owned by
     .photo-block in the shared sheet. */
  .photo-block-wrap { margin: 0 16px 12px; }

  /* Photos + Map row — photos take most of the width, map matches
   * the photo's vertical size (align-items: stretch). Photo height
   * is set by photo-block hero max-height (currently 27vh, -20% from
   * 34vh). Map column is fixed-width (220px), height fills the row. */
  .photo-map-row {
    display: flex; gap: 12px; align-items: stretch;
    margin: 0 16px 12px;
  }
  .photo-map-row .pm-photo-col { flex: 1; margin: 0; min-width: 0; }
  /* Kill the hero's bottom margin in this row so the photo image's
   * bottom edge aligns with the map's bottom edge. The "View all"
   * link below the hero was retired; the gap is no longer needed. */
  .photo-map-row .photo-block-hero { margin-bottom: 0; }
  .photo-map-row .pm-map-col {
    flex: 0 0 320px; display: flex;
  }
  .photo-map-row .pm-map-col #map {
    width: 320px; height: 100%; min-height: 240px;
    border-radius: 12px; border: 1px solid var(--border);

  @media (max-width: 720px) {
    .photo-map-row { flex-direction: column; gap: 8px; margin: 0 12px 8px; }
    .photo-map-row .pm-map-col { flex: 0 0 auto; width: 100%; }
    .photo-map-row .pm-map-col #map { width: 100%; height: 180px; }

  /* ─── Phone form factor (≤ 600px) ──────────────────────────────────
   * Brevity-first: tighter padding, smaller type, compacter chips.
   * Most layout already collapses to a single column at 720px; this
   * block pulls the remaining slack so the page is thumb-scrollable

  @media (max-width: 600px) {
    /* Outer chrome */
    section.card { padding: 10px 12px; margin: 5px 10px; border-radius: 10px; }
    section.card h2 { font-size: 13px; margin-bottom: 6px; }

    /* Beach name + badge + region (h1) */
    .beach-name { font-size: 20px; margin: 0 0 4px; }
    .fit-badge { font-size: 16px; padding: 1px 8px; margin-right: 3px; }
    .beach-region { font-size: 13px; margin-left: 0.3em; }

    /* Beach text */
    .overview-blurb { font-size: 13px; line-height: 1.5; margin: 16px 12px 10px; }

    /* Photo + map */
    .photo-block-hero img { max-height: 22vh; }
    .photo-map-row { margin: 0 10px 8px; gap: 6px; }
    .photo-map-row .pm-map-col #map { height: 160px; }

    /* Amenity tiles */
    .amenity { padding: 6px 4px; }
    .amenity-icon { font-size: 18px; }
    .amenity-label { font-size: 11px; line-height: 1.15; }
    .amenity-sub   { font-size: 9px; }
    .amenities-card { margin-top: 8px; }

    /* Cautions rows */
    .cautions-card ul.advisory-list { gap: 4px; }
    .advisory-row { padding: 5px 6px; font-size: 11px; }
    .advisory-icon { font-size: 13px; }
    .advisory-value, .advisory-time { font-size: 10px; }

    /* Hours card */
    .hours-range { font-size: 13px; }
    .hours-dogs-prohibited { font-size: 12px; }
    .hours-dogs-suggest { font-size: 12px; }

    /* Scout corpus */
    .scout-card #scout-blurb { font-size: 13px; line-height: 1.5; }
    .activities-prose { font-size: 13px; line-height: 1.5; margin-top: 6px; }

    /* CTA — keep centered, tighter buttons */
    .scout-cta { margin-top: 10px; gap: 8px; font-size: 13px; }
    .scout-cta-btn { padding: 7px 11px; font-size: 12px; }

    /* Pack list chip card */
    .packlist-chip { padding: 5px 9px; font-size: 12px; }
    .packlist-icon { font-size: 14px; }

    /* Appeal chip group on h1 — keep the badge proportionate */
    .left-rail .amenity-grid,
    #left-rail .amenity-grid { grid-template-columns: repeat(2, 1fr); gap: 4px; }
    .left-rail .caution-grid,
    #left-rail .caution-grid { grid-template-columns: repeat(2, 1fr); gap: 4px; }
  }

  /* Location card — full-width map in main content. */
  .location-card #map {
    height: 360px; border-radius: 8px; border: 1px solid var(--border);
    margin-bottom: 10px;
  }
  .location-card .directions-btn {
    background: var(--accent); color: white; padding: 10px 14px;
    border-radius: 6px; text-decoration: none; font-weight: 600;
    font-size: 14px; text-align: center; display: inline-block;
    margin-right: 8px;
  }
  .location-card .map-address {
    font-size: 12px; color: var(--text-muted); display: inline-flex;
    align-items: center; gap: 6px; flex-wrap: wrap; line-height: 1.3;
    margin-top: 6px;
  }
</style>

<script>
const SUPABASE_URL = 'https://ehlzbwtrsxaaukurekau.supabase.co';
const ANON_KEY     = 'sb_publishable_lAg7YdZ3w7S5fN8jgiExKQ_3-KtW3xk';

const params       = new URLSearchParams(location.search);
const fid          = params.get('fid');
const locationId   = params.get('location_id');
const dateFromQs   = params.get('date');

document.getElementById('close-btn').href =
  fid ? `index.html?fid=${fid}` : (locationId ? `index.html?location=${locationId}` : 'index.html');

// Zone-rules constants + helpers + renderers now live in
// src/zone-rules-block.js (window.ZoneRulesBlock). escHtml is kept here
// because it's used throughout beach.html.

// Render the shared ZoneRulesBlock into its mount card. Pulls the current
// local hour + today's MM-DD so the day-part tabs auto-select correctly
// and only the current season's zones show. Hides the card on empty data.
function _renderZoneRulesBlock(beach, dogPolicy) {
  const mount = document.getElementById('zone-rules-mount');
  if (!mount || !window.ZoneRulesBlock) return;
  const zr = dogPolicy?.zone_rules;
  if (!zr || (Array.isArray(zr.regions) && zr.regions.length === 0)) {
    mount.style.display = 'none';
    return;
  }
  // Context for the block: today + current hour + view date for season.
  const tz = beach?.timezone || 'America/Los_Angeles';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', hour12: false,
  }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t)?.value || '';
  const todayMd = `${get('month')}-${get('day')}`;
  const ctx = {
    isToday: true,
    currentLocalHour: parseInt(get('hour'), 10) % 24,
    viewMonthDay: todayMd,
  };
  // beachName='' suppresses the paw-name prefix — the page already shows
  // the beach name in the h1 above.
  window.ZoneRulesBlock.render(mount, zr, { ...ctx, beachName: '' });
  mount.style.display = '';

  // Time-pill strip in the left rail (Franz 2026-05-21). Empty when the
  // beach has no time windows — then the strip card stays hidden.
  const stripMount = document.getElementById('time-strip-mount');
  if (stripMount && window.ZoneRulesBlock.buildTimeStripHtml) {
    const stripHtml = window.ZoneRulesBlock.buildTimeStripHtml(zr, ctx);
    if (stripHtml) {
      stripMount.innerHTML = stripHtml;
      stripMount.style.display = '';
    } else {
      stripMount.style.display = 'none';
    }
  }
}

const escHtml = s => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

// Tap-to-pin: works on touch (CSS :hover doesn't fire there).
document.addEventListener('click', (e) => {

  document.querySelectorAll('[data-tip-open]').forEach(el => {

    else target.setAttribute('data-tip-open', '');

function _v2FormatHour(h) {
  if (h == null) return '';
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}${ampm}`;
}

function formatClosureLine(c) {
  if (!c || !c.kind) return null;
  const DAY = { mon:'Mon', tue:'Tue', wed:'Wed', thu:'Thu', fri:'Fri', sat:'Sat', sun:'Sun' };
  const MON = { '01':'Jan','02':'Feb','03':'Mar','04':'Apr','05':'May','06':'Jun',
                '07':'Jul','08':'Aug','09':'Sep','10':'Oct','11':'Nov','12':'Dec' };
  const fmtTime = (t) => {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    const ampm = h >= 12 ? 'pm' : 'am';
    const h12 = ((h + 11) % 12) + 1;
    return m === 0 ? `${h12}${ampm}` : `${h12}:${String(m).padStart(2,'0')}${ampm}`;
  };
  const fmtMd = (md) => {
    if (!md) return '';
    const [m, d] = md.split('-');
    return `${MON[m] || m} ${parseInt(d, 10)}`;
  };
  // Section-aware verbs (Franz 2026-05-28 level #2): sand-only closures
  // say "Sand off-limits"; global / unknown say "Closed".
  const section = (c.section || '').toLowerCase();
  const SECTION_NOUN = {
    sand: 'Sand', water: 'Water', water_play: 'Water play',
    playground: 'Playground', picnic_area: 'Picnic area',
  };
  const sectionNoun = SECTION_NOUN[section];
  const verb_open = sectionNoun ? `${sectionNoun} off-limits` : 'Closed';
  const reason = c.reason ? c.reason.replace(/_/g, ' ') : '';
  const reasonClause = reason ? ` for ${reason}` : '';
  const seasonClause = c.season_label
    ? ` · ${c.season_label}`
    : (c.season_from_md && c.season_to_md
        ? ` · ${fmtMd(c.season_from_md)}–${fmtMd(c.season_to_md)}`
        : '');
  if (c.kind === 'weekly') {
    return `🚧 ${verb_open} ${DAY[(c.weekday||'').toLowerCase()] || '?'}${reasonClause}${seasonClause}`;
  }
  if (c.kind === 'weekly_time') {
    return `🚧 ${verb_open} ${DAY[(c.weekday||'').toLowerCase()] || '?'} ${fmtTime(c.start)}–${fmtTime(c.end)}${reasonClause}${seasonClause}`;
  }
  if (c.kind === 'daily_all') {
    if (c.season_label) return `🚧 ${sectionNoun ? `${sectionNoun}: ` : ''}${c.season_label}`;
    if (!seasonClause) {
      if (reason) return `🚧 ${reason.charAt(0).toUpperCase() + reason.slice(1)}`;
      return sectionNoun ? `🚧 ${sectionNoun} off-limits` : '🚧 Closed';
    }
    return `🚧 ${sectionNoun || 'Dogs prohibited'}${seasonClause}`;
  }
  if (c.kind === 'daily_time') {
    if (c.season_label) return `🚧 ${sectionNoun ? `${sectionNoun}: ` : ''}${c.season_label}`;
    return `🚧 ${verb_open} daily ${fmtTime(c.start)}–${fmtTime(c.end)}${seasonClause || reasonClause}`;
  }
  return null;
}

function renderHourlyBarsV2(p, nowH) {
  const hours = p.hours || [];
  // 🐶 marker source depends on whether we're viewing today vs a
  // future day pill:
  //  TODAY → remaining-from-now (chart agrees with the headline,
  //    which restricts to forward hours per Franz 2026-06-07).
  //  FUTURE DAY → full-day window from the payload's
  //    best_window_v2_start/end (the day's overall peak; remaining-
  //    from-now doesn't apply when "now" isn't on this date).
  const _isToday = window.__beachIsToday !== false;
  let bestStart = null, bestEnd = null;
  if (_isToday) {
    const remaining = _bestWindowFromNowV2(hours, nowH);
    bestStart = remaining?.startHour ?? null;
    bestEnd   = remaining?.endHour ?? null;
  } else if (p.best_window_v2_start != null && p.best_window_v2_end != null) {
    bestStart = p.best_window_v2_start;
    bestEnd   = p.best_window_v2_end;
  }
  let maxPos = 0, maxNeg = 0;
  for (const h of hours) {
    const drivePos = Math.max(0, h.drive || 0);
    const driveNeg = Math.max(0, -(h.drive || 0));
    // Sum every positive sub-segment that the payload might carry. Unknown
    // keys are simply 0; this keeps the function entity-agnostic.
    const posTotal =
      (h.pos_fence || 0) + (h.pos_water || 0) + (h.pos_shade || 0)
      + (h.pos_comfort || 0) + (h.pos_agility || 0) + (h.pos_water_play || 0)
      + (h.pos_temp || 0) + (h.pos_wind || 0) + (h.pos_sky || 0)
      + (h.pos_window || 0) + drivePos
      + (h.pos_restroom || 0) + (h.pos_lifeguard || 0) + (h.pos_parking || 0)
      + (h.pos_shower || 0) + (h.pos_picnic || 0) + (h.pos_food || 0)
      + (h.pos_drinking || 0) + (h.pos_disabled || 0) + (h.pos_dog_access || 0);
    const negTotal =
      (h.neg_heat_uv || 0) + (h.neg_harsh || 0) + (h.neg_gotchas || 0)
      + (h.neg_tide || 0) + (h.neg_crowd || 0) + driveNeg;
    if (posTotal > maxPos) maxPos = posTotal;
    if (negTotal > maxNeg) maxNeg = negTotal;
  }
  const niceCeil = v => Math.max(10, Math.ceil(v * 1.1 / 5) * 5);
  const AXIS_MAX = niceCeil(Math.max(maxPos, maxNeg));
  const POS_MAX = AXIS_MAX;
  const NEG_MAX = AXIS_MAX;

  const cols = hours.map(h => {
    const drivePos = Math.max(0, h.drive || 0);
    const driveNeg = Math.max(0, -(h.drive || 0));
    const POS_DEFS = [
      { cls: 'seg-fence',      icon: '🚧', val: h.pos_fence      || 0 },
      { cls: 'seg-water',      icon: '💧', val: h.pos_water      || 0 },
      { cls: 'seg-shade',      icon: '🌳', val: h.pos_shade      || 0 },
      { cls: 'seg-comfort',    icon: '🌿', val: h.pos_comfort    || 0 },
      { cls: 'seg-agility',    icon: '🤸', val: h.pos_agility    || 0 },
      { cls: 'seg-water-play', icon: '💦', val: h.pos_water_play || 0 },
      { cls: 'seg-restroom',   icon: '🚻', val: h.pos_restroom   || 0 },
      { cls: 'seg-lifeguard',  icon: '🛟', val: h.pos_lifeguard  || 0 },
      { cls: 'seg-parking',    icon: '🅿️', val: h.pos_parking    || 0 },
      { cls: 'seg-shower',     icon: '🚿', val: h.pos_shower     || 0 },
      { cls: 'seg-picnic',     icon: '🧺', val: h.pos_picnic     || 0 },
      { cls: 'seg-food',       icon: '🍔', val: h.pos_food       || 0 },
      { cls: 'seg-drinking',   icon: '🚰', val: h.pos_drinking   || 0 },
      { cls: 'seg-disabled',   icon: '♿',  val: h.pos_disabled   || 0 },
      { cls: 'seg-dog-access', icon: '🐕', val: h.pos_dog_access || 0 },
      { cls: 'seg-temp',       icon: '🌡️', val: h.pos_temp       || 0 },
      { cls: 'seg-wind',       icon: '💨', val: h.pos_wind       || 0 },
      { cls: 'seg-sky',        icon: '☀️', val: h.pos_sky        || 0 },
      { cls: 'seg-window',     icon: '⏰', val: h.pos_window     || 0 },
      { cls: 'seg-drive',      icon: '🚗', val: drivePos },
    ];
    const NEG_DEFS = [
      { cls: 'seg-heat_uv',    icon: '🔥', val: h.neg_heat_uv || 0 },
      { cls: 'seg-harsh',      icon: '⛈️', val: h.neg_harsh   || 0 },
      { cls: 'seg-tide',       icon: '🌊', val: h.neg_tide    || 0 },
      { cls: 'seg-crowd',      icon: '👥', val: h.neg_crowd   || 0 },
      { cls: 'seg-gotchas',    icon: '⚠️', val: h.neg_gotchas || 0 },
      { cls: 'seg-drive-neg',  icon: '🚗', val: driveNeg },
    ];
    const posSorted = POS_DEFS.filter(d => d.val > 0).sort((a, b) => b.val - a.val);
    const negSorted = NEG_DEFS.filter(d => d.val > 0).sort((a, b) => b.val - a.val);
    posSorted.forEach((d, i) => { d.rank = i + 1; });
    negSorted.forEach((d, i) => { d.rank = i + 1; });

    const posHtml = posSorted
      .map(d => `<div class="hourbar-seg pos-rank-${d.rank}" style="height:${(d.val / POS_MAX * 100).toFixed(1)}%"></div>`)
      .join('');
    const negHtml = negSorted
      .map(d => `<div class="hourbar-seg neg-rank-${d.rank}" style="height:${(d.val / NEG_MAX * 100).toFixed(1)}%"></div>`)
      .join('');

    // "Now" marker only meaningful for today's view; suppress on future days.
    const isNow = _isToday && h.local_hour === nowH;
    const isInBest = bestStart != null && bestEnd != null
                  && h.local_hour >= bestStart && h.local_hour <= bestEnd;
    // Per-hour positive total drives the dog's float position (10px above
    // the top of this hour's positive bar). Mirrors the maxPos loop above.
    const _drivePosThis = Math.max(0, h.drive || 0);
    const posTotalThis =
      (h.pos_fence || 0) + (h.pos_water || 0) + (h.pos_shade || 0)
      + (h.pos_comfort || 0) + (h.pos_agility || 0) + (h.pos_water_play || 0)
      + (h.pos_temp || 0) + (h.pos_wind || 0) + (h.pos_sky || 0)
      + (h.pos_window || 0) + _drivePosThis
      + (h.pos_restroom || 0) + (h.pos_lifeguard || 0) + (h.pos_parking || 0)
      + (h.pos_shower || 0) + (h.pos_picnic || 0) + (h.pos_food || 0)
      + (h.pos_drinking || 0) + (h.pos_disabled || 0) + (h.pos_dog_access || 0);
    const barTopPct = POS_MAX > 0 ? (posTotalThis / POS_MAX * 100) : 0;
    const dogIcon = isInBest
      ? `<span class="hourbar-dog" style="bottom: calc(${barTopPct.toFixed(1)}% + 6px);">🐶</span>`
      : '';
    const markerHtml = `<div class="hourbar-marker">${isNow ? 'Now' : ''}</div>`;
    const isClosed = h.is_closed === true;
    const closedClass = isClosed ? ' bar-closed' : '';
    const scoreText = isClosed ? '' : (h.score != null ? h.score : '');

    const tipLines = [];
    if (isClosed) {
      tipLines.push(`${h.hour_label} · 🚧 closed`);
    } else {
      tipLines.push(`${h.hour_label} · ${h.score ?? 0}`);
      for (const d of [...posSorted].reverse()) tipLines.push(`${d.icon} +${d.val}%`);
      for (const d of negSorted) tipLines.push(`${d.icon} −${d.val}%`);
    }
    const tip = tipLines.join('\n');

    return `<div class="hourbar-col${closedClass}" data-tip="${escHtml(tip)}">
      <div class="hourbar-score">${scoreText}</div>
      ${markerHtml}
      <div class="hourbar-pos">${isClosed ? '' : posHtml}${isClosed ? '' : dogIcon}</div>
      <div class="hourbar-neg">${isClosed ? '' : negHtml}</div>
    </div>`;
  }).join('');

  const labels = hours.map(h =>
    `<div class="hourbar-axis-label">${escHtml(h.hour_label)}</div>`
  ).join('');

  const driveBadge = p.drive_minutes != null
    ? `<span class="hourbars-drive">🚗 ${p.drive_minutes}min ${p.drive_factor >= 0 ? '+' : ''}${p.drive_factor}</span>`
    : '';

  // Legend — only icons present in this chart
  const hasPos = (k) => hours.some(h => (h[k] || 0) > 0);
  const hasDrivePos = hours.some(h => (h.drive || 0) > 0);
  const hasDriveNeg = hours.some(h => (h.drive || 0) < 0);
  const posItems = [
    { icon: '🚻', label: 'restrooms', show: hasPos('pos_restroom') },
    { icon: '🛟', label: 'lifeguard', show: hasPos('pos_lifeguard') },
    { icon: '🅿️', label: 'parking', show: hasPos('pos_parking') },
    { icon: '🚿', label: 'showers', show: hasPos('pos_shower') },
    { icon: '🧺', label: 'picnic', show: hasPos('pos_picnic') },
    { icon: '🍔', label: 'food', show: hasPos('pos_food') },
    { icon: '🚰', label: 'water', show: hasPos('pos_drinking') },
    { icon: '♿',  label: 'ADA', show: hasPos('pos_disabled') },
    { icon: '🐕', label: 'dog access', show: hasPos('pos_dog_access') },
    { icon: '🚧', label: 'fence', show: hasPos('pos_fence') },
    { icon: '💧', label: 'water', show: hasPos('pos_water') },
    { icon: '🌳', label: 'shade', show: hasPos('pos_shade') },
    { icon: '🌿', label: 'comfort', show: hasPos('pos_comfort') },
    { icon: '🤸', label: 'agility', show: hasPos('pos_agility') },
    { icon: '💦', label: 'water play', show: hasPos('pos_water_play') },
    { icon: '🌡️', label: 'temp', show: hasPos('pos_temp') },
    { icon: '💨', label: 'wind', show: hasPos('pos_wind') },
    { icon: '☀️', label: 'sky', show: hasPos('pos_sky') },
    { icon: '⏰', label: 'window', show: hasPos('pos_window') },
    { icon: '🚗', label: 'short drive', show: hasDrivePos },
  ].filter(x => x.show);
  const negItems = [
    { icon: '🔥', label: 'heat / UV', show: hasPos('neg_heat_uv') },
    { icon: '⛈️', label: 'harsh wx', show: hasPos('neg_harsh') },
    { icon: '🌊', label: 'tide', show: hasPos('neg_tide') },
    { icon: '👥', label: 'crowd', show: hasPos('neg_crowd') },
    { icon: '⚠️', label: 'gotchas', show: hasPos('neg_gotchas') },
    { icon: '🚗', label: 'long drive', show: hasDriveNeg },
  ].filter(x => x.show);
  const legendChip = (icon, label) =>
    `<span class="hourbars-legend-label"><span class="legend-icon">${icon}</span>${label}</span>`;
  const posLegend = posItems.map(i => legendChip(i.icon, i.label)).join('');
  const negLegend = negItems.map(i => legendChip(i.icon, i.label)).join('');
  const legendHtml = (posItems.length || negItems.length)
    ? `<div class="hourbars-legend">
        ${posItems.length ? `<div class="hourbars-legend-group">+ ${posLegend}</div>` : ''}
        ${(posItems.length && negItems.length) ? `<span class="hourbars-legend-sep">·</span>` : ''}
        ${negItems.length ? `<div class="hourbars-legend-group">− ${negLegend}</div>` : ''}
      </div>` : '';

  const closures = Array.isArray(p.closures) ? p.closures : [];
  const closureLines = closures.map(formatClosureLine).filter(Boolean);
  const closuresHtml = closureLines.length
    ? `<div class="hourbars-closures">${closureLines.map(l => `<div>${escHtml(l)}</div>`).join('')}</div>`
    : '';

  return `<div class="hourbars-wrap">
    <div class="hourbars-meta">
      <span>Hourly score · ${_v2FormatHour(p.open_hour)} – ${_v2FormatHour(p.close_hour)}</span>
      <span>${driveBadge}</span>
    </div>
    <div class="hourbars-chart">
      <div class="hourbars-yaxis">
        <span class="hourbars-yaxis-top">+${POS_MAX}%</span>
        <span class="hourbars-yaxis-mid">+${Math.round(POS_MAX / 2)}%</span>
        <span class="hourbars-yaxis-zero">0</span>
        <span class="hourbars-yaxis-neg-mid">−${Math.round(NEG_MAX / 2)}%</span>
        <span class="hourbars-yaxis-bot">−${NEG_MAX}%</span>
      </div>
      <div class="hourbars-track">${cols}</div>
    </div>
    <div class="hourbar-axis">${labels}</div>
    ${legendHtml}
    ${closuresHtml}
  </div>`;
}

async function _fetchBeachHourlyV2(fid) {
  try {
    const userLoc = (() => {
      try {
        const raw = localStorage.getItem('dogbeach.user_loc');
        if (!raw) return null;
        const o = JSON.parse(raw);
        if (Number.isFinite(o?.lat) && Number.isFinite(o?.lng)) return o;
      } catch {}
      return null;
    })();
    const body = { p_fid: parseInt(fid, 10) };
    if (userLoc) { body.p_user_lat = userLoc.lat; body.p_user_lng = userLoc.lng; }
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/compute_beach_hourly_v2`, {
      method: 'POST',
      headers: {
        apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(body),
    });
    if (!r.ok) return null;
    return await r.json();
  } catch (err) {
    console.warn('beach v2 hourly fetch failed', err);
    return null;
  }
}

function applyBeachHourlyV2(payload, todayRec) {
  const hours = payload.hours || [];
  if (!hours.length) return;
  // Use beach timezone (not browser) so a user in a different tz still
  // sees the beach's local "now". _currentLocalHour falls back to LA
  // when timezone is missing.
  const beachTz = window.__beachTimezone || 'America/Los_Angeles';
  const nowH = _currentLocalHour(beachTz) ?? new Date().getHours();
  let current = hours.find(h => h.local_hour === nowH);
  if (!current) current = hours[0];

  // Set the besttime headline. For the open-window case use the STORED
  // best_window_label from beach_day_recommendations (already v2-applied
  // by daily-beach-refresh) so headline + Scout blurb agree. The live RPC
  // computes a fresh window that can disagree with the stored one — using
  // it here led to "6am-9am" in the Scout body and a contradictory "2pm-7pm"
  // (or similar) in the headline. Per Franz 2026-05-30.
  // Closed/reopen states still come from the per-hour chart payload
  // (they're time-sensitive and not pre-stored).
  const headlineEl = document.querySelector('.besttime-headline');
  if (headlineEl) {
    const isNowClosed = current?.is_closed === true;
    const SECTION_NOUN = { sand: 'Sand', water: 'Water', water_play: 'Water play' };
    if (isNowClosed) {
      let reopenLabel = null;
      const idx = hours.findIndex(h => h.local_hour === nowH);
      for (let i = idx + 1; i < hours.length; i++) {
        if (!hours[i].is_closed) {
          reopenLabel = hours[i].hour_label; break;
        }
      }
      const section = (current.closed_section || '').toLowerCase();
      const verbNow = SECTION_NOUN[section]
        ? `${SECTION_NOUN[section]} off-limits right now`
        : 'Closed right now';
      const verbRest = SECTION_NOUN[section]
        ? `${SECTION_NOUN[section]} off-limits for the rest of today`
        : 'Closed for the rest of today';
      headlineEl.textContent = reopenLabel
        ? `${verbNow} — reopens ${reopenLabel}`
        : verbRest;
    } else if (todayRec?.best_window_label) {
      // Two modes:
      //  TODAY → recompute remaining-from-now (so a 10am view of a
      //    passed window correctly says "Today's window has passed",
      //    not a stale label).
      //  FUTURE DAY → use stored full-day best_window_label (passed in
      //    via todayRec; the SQL fn already wrote the day's peak).
      const isToday = window.__beachIsToday !== false;
      if (isToday) {
        const remaining = _bestWindowFromNowV2(hours, nowH);
        headlineEl.textContent = remaining?.label || "Today's window has passed";
      } else {
        headlineEl.textContent = todayRec.best_window_label;
      }
    } else {
      // No v2 window picked. Distinguish "closed all day" from "open but mediocre".
      const anyOpen = hours.some(h => !h.is_closed);
      if (!anyOpen) {
        // All hours closed — usually dogs_allowed='no' beach.
        const firstClosure = (payload.closures || [])[0];
        const section = (firstClosure?.section || '').toLowerCase();
        headlineEl.textContent = SECTION_NOUN[section]
          ? `${SECTION_NOUN[section]} off-limits`
          : (firstClosure?.reason === 'dogs_prohibited' ? 'Dogs prohibited' : 'Closed today');
      } else {
        headlineEl.textContent = 'Open all day';
      }
    }
  }

  // Mount the tug-of-war chart inside the existing besttime-card.
  const target = document.querySelector('.besttime-card');
  if (!target) return;
  // Avoid double-paint if user navigated within the SPA
  const existing = target.querySelector('.hourbars-wrap');
  if (existing) existing.remove();
  target.insertAdjacentHTML('beforeend', renderHourlyBarsV2(payload, nowH));
}

// hoursToday shape variant of _bestWindowFromNowV2. Operates on rows
// from beach_day_hourly_scores (hour_score_v2 column) instead of the
// compute_beach_hourly_v2 RPC payload (score column). Used by Scout
// blurb to anchor the LLM's "best window remaining" reference to the
// actual remaining slice, not the full-day stored label.
function _bestWindowFromNowV2Hours(hours, fromHour) {
  if (!Array.isArray(hours) || hours.length === 0) return null;
  const eligible = hours
    .filter(h =>
      typeof h.local_hour === 'number'
      && h.local_hour >= fromHour
      && h.hour_score_v2 != null
      && Number(h.hour_score_v2) > 0)
    .sort((a, b) => a.local_hour - b.local_hour);
  if (eligible.length < 2) return null;
  const runs = [];
  let cur = [eligible[0]];
  for (let i = 1; i < eligible.length; i++) {
    if (eligible[i].local_hour === cur[cur.length - 1].local_hour + 1) {
      cur.push(eligible[i]);
    } else {
      if (cur.length >= 2) runs.push(cur);
      cur = [eligible[i]];
    }
  }
  if (cur.length >= 2) runs.push(cur);
  if (runs.length === 0) return null;
  const MAX_LEN = 5;
  let best = null;
  for (const run of runs) {
    if (run.length <= MAX_LEN) {
      const avg = run.reduce((s, h) => s + Number(h.hour_score_v2), 0) / run.length;
      if (!best || avg > best.avg) best = { slice: run, avg };
    } else {
      for (let i = 0; i + MAX_LEN <= run.length; i++) {
        const slice = run.slice(i, i + MAX_LEN);
        const avg = slice.reduce((s, h) => s + Number(h.hour_score_v2), 0) / slice.length;
        if (!best || avg > best.avg) best = { slice, avg };
      }
    }
  }
  if (!best) return null;
  const startHour = best.slice[0].local_hour;
  const endHour = best.slice[best.slice.length - 1].local_hour;
  const fmt = h => {
    if (h === 0) return '12am';
    if (h === 12) return '12pm';
    return h < 12 ? `${h}am` : `${h - 12}pm`;
  };
  return { label: `${fmt(startHour)}–${fmt((endHour + 1) % 24)}`, startHour, endHour };
}


// Find best contiguous run of open, non-closed hours from `fromHour`
// forward. Returns { label, startHour, endHour, avgScore } or null when
// no qualifying run of length >= 2 exists. Mirrors the SQL
// _find_best_window_v2 picker but operates on the per-hour payload.
function _bestWindowFromNowV2(hours, fromHour) {
  if (!Array.isArray(hours) || hours.length === 0) return null;
  const eligible = hours
    .filter(h =>
      typeof h.local_hour === 'number'
      && h.local_hour >= fromHour
      && h.is_closed !== true
      && Number.isFinite(Number(h.score)))
    .sort((a, b) => a.local_hour - b.local_hour);
  if (eligible.length < 2) return null;

  // Greedy: find contiguous runs (consecutive local_hour), pick the one
  // with highest avg score, capped at 5 hours. Mirrors the SQL helper.
  const runs = [];
  let cur = [eligible[0]];
  for (let i = 1; i < eligible.length; i++) {
    if (eligible[i].local_hour === cur[cur.length - 1].local_hour + 1) {
      cur.push(eligible[i]);
    } else {
      if (cur.length >= 2) runs.push(cur);
      cur = [eligible[i]];
    }
  }
  if (cur.length >= 2) runs.push(cur);
  if (runs.length === 0) return null;

  // Pick the run with the highest avg score; cap at 5 hours by sliding
  // a 5-wide window inside the run to pick the best slice.
  const MAX_LEN = 5;
  let best = null;
  for (const run of runs) {
    if (run.length <= MAX_LEN) {
      const avg = run.reduce((s, h) => s + Number(h.score), 0) / run.length;
      if (!best || avg > best.avg) best = { slice: run, avg };
    } else {
      for (let i = 0; i + MAX_LEN <= run.length; i++) {
        const slice = run.slice(i, i + MAX_LEN);
        const avg = slice.reduce((s, h) => s + Number(h.score), 0) / slice.length;
        if (!best || avg > best.avg) best = { slice, avg };
      }
    }
  }
  if (!best) return null;
  const startHour = best.slice[0].local_hour;
  const endHour = best.slice[best.slice.length - 1].local_hour;
  const fmt = h => {
    if (h === 0) return '12am';
    if (h === 12) return '12pm';
    return h < 12 ? `${h}am` : `${h - 12}pm`;
  };
  // Display end is the START of the hour AFTER the window's last hour
  // (matches the SQL _format_hour_range convention).
  return {
    label: `${fmt(startHour)}–${fmt((endHour + 1) % 24)}`,
    startHour, endHour, avg: best.avg,
  };
}


function _currentLocalHour(timezone) {
  const tz = timezone || 'America/Los_Angeles';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: '2-digit', hour12: false,
  }).formatToParts(new Date());
  const h = parts.find(p => p.type === 'hour')?.value;
  return h != null ? (parseInt(h, 10) % 24) : null;
}

// Parse "HH:MM" → minutes-since-midnight. Tolerates "9:00", "09:30".
// Returns null for empty / malformed input.
function _hhmmToMinutes(hhmm) {
  if (!hhmm || typeof hhmm !== 'string') return null;
  const m = hhmm.match(/^(\d{1,2}):(\d{2})/);
  if (!m) return null;
  const h = parseInt(m[1], 10);
  const mm = parseInt(m[2], 10);
  if (Number.isNaN(h) || Number.isNaN(mm)) return null;
  return h * 60 + mm;
}

function _currentLocalMinutes(timezone) {
  const tz = timezone || 'America/Los_Angeles';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false,
  }).formatToParts(new Date());
  const h = parseInt(parts.find(p => p.type === 'hour')?.value || '0', 10) % 24;
  const m = parseInt(parts.find(p => p.type === 'minute')?.value || '0', 10);
  return h * 60 + m;
}

// If the beach allows dogs today but the user is currently inside the
// prohibition window (and the window ends later today, not after midnight),
// return a "Come back after Xpm" suggestion. Returns '' otherwise.
function _suggestPostProhibitionTime(start, end, timezone) {
  if (!start || !end) return '';
  const toMin = s => {
    const [h, m] = String(s).split(':').map(Number);
    return h * 60 + (m || 0);
  };
  const startM = toMin(start);
  const endM   = toMin(end);
  // Wrap-around (overnight) and end-of-day midnight windows: no useful
  // same-day suggestion — punt.
  if (endM === 0 || endM <= startM) return '';
  const nowM = _currentLocalMinutes(timezone);
  if (nowM < startM || nowM >= endM) return '';
  const eh = Math.floor(endM / 60), em = endM % 60;
  const ap = eh >= 12 ? 'pm' : 'am';
  const h12 = eh === 0 ? 12 : eh > 12 ? eh - 12 : eh;
  const label = em ? `${h12}:${String(em).padStart(2,'0')}${ap}` : `${h12}${ap}`;
  return `<p class="hours-dogs-suggest">Come back after ${label} now.</p>`;
}

async function load() {
  if (!fid && !locationId) return showError('No beach specified.');
  let resolvedFid = fid;
  // Resolve location_id → fid by hitting beaches_gold via PostgREST
  if (!resolvedFid && locationId) {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/beaches_gold?select=fid&location_id=eq.${encodeURIComponent(locationId)}&limit=1`,
      { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` }});
    const rows = await r.json();
    if (!rows?.[0]?.fid) return showError('Beach not found.');
    resolvedFid = rows[0].fid;
  }

  try {
    // dateFromQs (set at line 975) is now honored — when find.html
    // clicks through with ?date=YYYY-MM-DD from a non-NOW pill, render
    // that day's data. Default (no param) uses RPC's current_date.
    const rpcBody = { p_fid: parseInt(resolvedFid, 10) };
    if (dateFromQs && /^\d{4}-\d{2}-\d{2}$/.test(dateFromQs)) {
      rpcBody.p_date = dateFromQs;
    }
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_beach_info`, {
      method: 'POST',
      headers: {
        apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify(rpcBody),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    if (!data?.beach) return showError('Beach not found.');
    // Surface "is this today?" as a window global so other render fns
    // (renderHourlyBarsV2, applyBeachHourlyV2, _appealScores etc.)
    // can branch without re-parsing the param.
    const beachTzForToday = data.beach?.timezone || 'America/Los_Angeles';
    const localToday = new Date().toLocaleDateString('en-CA',
      { timeZone: beachTzForToday });
    const requestedDate = data.requested_date || localToday;
    window.__beachIsToday = (requestedDate === localToday);
    window.__beachSelectedDate = requestedDate;
    // V2 → V1 alias so existing reads of h.hour_score / day.composite_score
    // transparently get v2 values when present. Mirrors detail.html:644.
    // Lets bulk SQL refresh (which writes v2-only) cut over without touching
    // 10+ downstream render sites.
    for (const h of (data.hours_today || [])) {
      if (h.hour_score_v2 != null) h.hour_score = h.hour_score_v2;
    }
    if (data.today?.composite_score_v2 != null) {
      data.today.composite_score = data.today.composite_score_v2;
    }
    render(data, resolvedFid);
  } catch (err) {
    console.error(err);
    showError(`Failed to load: ${err.message}`);
  }
}

function showError(msg) {
  document.getElementById('beach-name').textContent = 'Beach';
  document.getElementById('main-content').innerHTML = `
    <div class="state"><div class="state-icon">🐕</div><div>${escHtml(msg)}</div></div>`;
}

function render(data, beachFid) {
  const { beach, dog_policy, amenities } = data;
  document.title = `${beach.display_name} — Dog Beach Scout`;
  // Score badge:
  //  TODAY view → current-hour hour_score_v2 (live signal, matches Now
  //    bar on the chart). Falls back to "—" when closed/pre-dawn/etc.
  //  FUTURE day view → composite_score_v2 (that day's peak). There's
  //    no "current hour" for tomorrow, so the peak is the headline.
  // Tone always colors when score available; only NOW-with-null shows
  // grey-with-dash.
  const nameEl = document.getElementById('beach-name');
  nameEl.textContent = '';
  const _isToday = window.__beachIsToday !== false;
  let todayScore, badgeTitle;
  if (_isToday) {
    const _nowH = _currentLocalHour(beach?.timezone);
    const _nowRow = (data.hours_today || []).find(h => h.local_hour === _nowH);
    todayScore = _nowRow?.hour_score_v2 ?? _nowRow?.hour_score ?? null;
    badgeTitle = todayScore != null
      ? `Score now · ${todayScore}/100`
      : 'Closed or no score for this hour';
  } else {
    todayScore = data.today?.composite_score_v2 ?? null;
    badgeTitle = todayScore != null
      ? `Best this day · ${todayScore}/100`
      : 'No score for this day';
  }
  const badge = document.createElement('span');
  const tone = todayScore == null ? 'tone-unk'
             : todayScore >= 70   ? 'tone-go'
             : todayScore >= 45   ? 'tone-mid'
             :                       'tone-low';
  badge.className = `fit-badge ${tone}`;
  badge.textContent = todayScore != null ? todayScore : '—';
  badge.title = badgeTitle;
  nameEl.appendChild(badge);
  nameEl.appendChild(document.createTextNode(' ' + beach.display_name));
  const regionParts = [];
  if (beach.county) regionParts.push(beach.county);
  if (beach.state)  regionParts.push(beach.state);
  if (regionParts.length) {
    const span = document.createElement('span');
    span.className = 'beach-region';
    span.textContent = regionParts.join(' · ');
    nameEl.appendChild(span);
  }

  // Pin-address row retired 2026-05-15 — address still appears on the
  // Location card with its directions button.
  document.getElementById('beach-address')?.remove();

  // Two-column layout (desktop):
  //   LEFT RAIL (30%): at-a-glance compact info — amenities + zone rules.
  //   MAIN  (70%): description, photos, hours, MAP, details, links.
  // Mobile collapses to a single stacked column (left rail first).
  // Description = LLM-generated Scout-voice prose.
  // Details = structured / curated facts (currently from
  // dog_policy.zone_rules.global_notes; hidden when empty).
  // Two distinct things — Franz, 2026-05-10.
  // LEFT RAIL (top → bottom):
  //   Amenities (merged with Dog Policy section-tiles — rule color
  //   tints them in place), Cautions, Hours, Weather and Tides.
  const leftRail = [];
  leftRail.push(buildAmenitiesSection(amenities, dog_policy, beach));
  leftRail.push(buildCautionsSection(data.today, dog_policy, data.hours_today, beach));
  leftRail.push(buildHoursSection(beach, amenities, dog_policy));
  leftRail.push(buildWeatherSection(beach));
  document.getElementById('left-rail').innerHTML = leftRail.filter(Boolean).join('');

  // Wire up amenity tile click-to-detail (once) + apply today's
  // environmental-hazard overlays to Sand + Water tiles. Hours are
  // available synchronously; water-hazard advisories arrive async via
  // loadWaterConditionAdvisories which re-runs the overlay pass.
  setupAmenityDetailDelegation();
  _hoursForOverlay = Array.isArray(data.hours_today) ? data.hours_today : [];
  _applyAmenityHazardOverlays();

  // MAIN (top → bottom):
  //   Appeal, Alternatives (if triggered), Photos (only when present),
  //   Overview, Best Window, Location, Details, Links
  const hasPhotos = Array.isArray(data.photos) && data.photos.length > 0;
  const main = [];
  main.push(buildOverviewCard(beach, data.description, amenities));
  // Zone-rules card removed from main column per Franz 2026-05-21 —
  // section coloring + time pills live in the left-rail Amenities card.
  main.push(buildAlternativesSection(dog_policy, data.alternatives));
  // Photos + Map share a row: photos take most of the width, map is
  // square. Either alone takes the full row. Renders only if at least
  // one is present.
  const hasMap = beach.lat != null && beach.lng != null;
  if (hasPhotos || hasMap) {
    const photoCol = hasPhotos
      ? '<div class="photo-block-wrap pm-photo-col" id="photo-block-mount"></div>'
      : '';
    const mapCol = hasMap ? '<div class="pm-map-col"><div id="map"></div></div>' : '';
    main.push(`<div class="photo-map-row">${photoCol}${mapCol}</div>`);
  }
  main.push(buildScoutCard(data.today, beach, dog_policy, amenities, data.hours_today));
  // DP suggestion mount — async-filled by loadDogParkSuggestion below.
  // Removed entirely if the beach has no nearest_dog_park within 25mi
  // OR if the fetch fails. Otherwise renders additive ("extend the day")
  // OR reframed ("better fit") depending on trigger. Sits next to Pack
  // List so the "what's next" prompts cluster together.
  main.push(`<section class="card dog-park-card-mount" id="dog-park-mount" style="display:none"></section>`);
  main.push(buildAccessibilityCard(amenities));
  main.push(buildPackListCard(beach, dog_policy, amenities, data.hours_today));
  main.push(buildDetailsSection(dog_policy));
  main.push(buildLinksSection(beach, beachFid));
  document.getElementById('main-content').innerHTML = main.filter(Boolean).join('');

  // V2 tug-of-war chart — fetched in parallel with photos/scout/etc.
  // Mounts inside the besttime-card (if present) and overrides the
  // v1-derived headline with the v2 best window when available.
  // Stash beach tz so applyBeachHourlyV2 can compute beach-local "now".
  window.__beachTimezone = beach.timezone || 'America/Los_Angeles';
  _fetchBeachHourlyV2(beachFid).then(payload => {
    if (payload && !payload.error) applyBeachHourlyV2(payload, data.today);
  });

  // _renderZoneRulesBlock removed — zone info is now in the Amenities
  // card (section tiles + per-region time pills).
  // Shared photo block — 1 hero + 5 thumbs + view-all (src/photo-block.js).
  // Mount AFTER the section HTML has been injected so the target exists.
  if (hasPhotos) {
    PhotoBlock.render(
      document.getElementById('photo-block-mount'),
      data.photos,
      {}
    );
  }

  wireCopyButtons();
  initMap(beach);

  // Fire async loads after DOM is mounted.
  loadScoutBlurb(beach, data.today, dog_policy, data.hours_today, amenities);
  loadWeather(beach, data.hours_today);
  loadDogParkSuggestion(beach, beachFid, dog_policy, data.hours_today);
  loadWaterConditionAdvisories(beachFid);
  _wireBestTimeClick();
}

function buildMapsUrl(beach) {
  // Apple Maps universal handler — opens the Apple Maps app on iOS/macOS,
  // falls back to the web map on Android/Windows. `daddr` (destination
  // address) is Apple's directions parameter.
  const dest = beach.address
    ? encodeURIComponent(beach.address)
    : `${beach.lat},${beach.lng}`;
  return `https://maps.apple.com/?daddr=${dest}`;
}

function buildDescriptionSection(description) {
  if (!description?.text) return '';
  return `<div class="beach-description">${escHtml(description.text)}</div>`;
}

function buildLocationSection(beach) {
  if (beach.lat == null || beach.lng == null) return '';
  const directionsUrl = buildMapsUrl(beach);
  const addrLine = beach.address
    ? `<span>${escHtml(beach.address)}</span>
       <button class="copy-btn" type="button" data-copy="${escHtml(beach.address)}">Copy</button>`
    : `<span>${beach.lat.toFixed(4)}°, ${beach.lng.toFixed(4)}°</span>`;
  return `<section class="card location-card">
    <h2>Location</h2>
    <div id="map"></div>
    <a class="directions-btn" href="${escHtml(directionsUrl)}" target="_blank" rel="noopener">📍 Get directions</a>
    <div class="map-address">${addrLine}</div>
  </section>`;
}

// ─── Hours harmonization ────────────────────────────────────────────
// Pick ONE open/close time per beach from the available sources, in
// priority order:
//   1. beach.open_time / close_time (structured, non-default)
//   2. Parse amenities.hours_text for an "8am-6pm" style range
//   3. Detect "sunrise/sunset/dawn/dusk" in hours_text and substitute
//      computed sun times for the beach's lat/lng and today's date
//   4. Else fall through to the raw prose
// Output format: "6:00AM - 8:00PM".

function _fmt12(hour24, minute) {
  const ap = hour24 >= 12 ? 'PM' : 'AM';
  const h12 = hour24 === 0 ? 12 : hour24 > 12 ? hour24 - 12 : hour24;
  return `${h12}:${String(minute || 0).padStart(2, '0')}${ap}`;
}

function _hhmmToFmt(hhmm) {
  const [h, m] = String(hhmm).split(':').map(n => parseInt(n, 10));
  if (Number.isNaN(h)) return null;
  return _fmt12(h % 24, m || 0);
}

// Sunrise / sunset for a lat/lng on a given date, returned as
// { sunriseMin, sunsetMin, dawnMin, duskMin } where each is minutes
// after local midnight. Civil dawn/dusk = sun -6° below horizon
// (~30 min before sunrise / after sunset). Standard NOAA solar
// position math, ±2 min accuracy. Honors beach timezone.
function _sunTimes(lat, lng, dateObj, timezone) {
  if (lat == null || lng == null) return null;
  const rad = Math.PI / 180;
  const start = new Date(dateObj.getFullYear(), 0, 0);
  const doy = Math.floor((dateObj - start) / 86400000);
  const B = rad * (360 / 365) * (doy - 81);
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const decl = 23.45 * rad * Math.sin(rad * (360 / 365) * (doy - 81));
  const latRad = lat * rad;
  // Sunrise/sunset (sun at horizon, refraction-corrected ≈ -0.833°)
  const computeMin = (zenithDeg) => {
    const cosHa = (Math.cos(zenithDeg * rad) - Math.sin(latRad) * Math.sin(decl))
                / (Math.cos(latRad) * Math.cos(decl));
    if (cosHa > 1 || cosHa < -1) return null;
    return Math.acos(cosHa) * 4 / rad;  // minutes (4 min/degree)
  };
  const haRise  = computeMin(90.833);
  const haCivil = computeMin(96);  // civil twilight
  if (haRise == null) return null;
  // Tz offset for the beach (minutes east of UTC). Use Intl trick.
  const tzMinutes = (() => {
    try {
      const local = new Date(dateObj.toLocaleString('en-US', { timeZone: timezone }));
      const utc   = new Date(dateObj.toLocaleString('en-US', { timeZone: 'UTC' }));
      return Math.round((local - utc) / 60000);
    } catch { return -lng * 4; } // fallback: longitude → minutes east of UTC
  })();
  // Solar noon (local minutes after midnight). Sign on 4*lng was wrong
  // (Franz 2026-05-20) — for west-longitude beaches this produced
  // negative noonMin and wrapped sunset into the early-morning hours.
  const noonMin = 12 * 60 - eot + tzMinutes - 4 * lng;
  return {
    sunriseMin: Math.round(noonMin - haRise),
    sunsetMin:  Math.round(noonMin + haRise),
    dawnMin:    haCivil != null ? Math.round(noonMin - haCivil) : null,
    duskMin:    haCivil != null ? Math.round(noonMin + haCivil) : null,
  };
}

function _minutesToFmt(min) {
  if (min == null || !Number.isFinite(min)) return null;
  // Wrap into 0-1439 just in case.
  const wrapped = ((min % 1440) + 1440) % 1440;
  return _fmt12(Math.floor(wrapped / 60), wrapped % 60);
}

// Try to derive a single (openLabel, closeLabel) from the available sources.
function _harmonizedHours(beach, amenities) {
  const open = beach.open_time, close = beach.close_time;
  const isDefault = open === '05:00' && close === '22:00';
  if (open && close && !isDefault) {
    return { openLabel: _hhmmToFmt(open), closeLabel: _hhmmToFmt(close) };
  }
  const text = (amenities?.hours_text || '').trim();
  if (!text) return null;
