<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CCC photo samples — famous CA beaches</title>
<style>
  body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; background: #f8fafc; color: #0f2742; }
  #bar {
    padding: 12px 16px; background: #0f2742; color: #fff;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  #bar label { font-size: 12px; opacity: 0.7; }
  #bar select {
    font-family: inherit; font-size: 13px; padding: 6px 10px;
    border-radius: 6px; border: 1px solid #1e3a5f;
    background: #1e293b; color: #fff; min-width: 320px;
  }
  #meta { margin-left: auto; font-size: 12px; padding: 4px 10px;
          background: rgba(255,255,255,0.08); border-radius: 999px; }
  main { padding: 16px; }
  .beach-header {
    font-size: 18px; font-weight: 700; margin: 0 0 4px;
  }
  .beach-sub {
    font-size: 13px; color: #64748b; margin-bottom: 16px;
  }
  .photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .photo {
    position: relative;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    overflow: hidden;
  }
  .photo img {
    width: 100%; height: 200px; object-fit: cover; display: block;
  }
  .photo-caption {
    padding: 8px 10px; font-size: 11px; color: #64748b;
    border-top: 1px solid #e2e8f0;
  }
  .photo-link { color: #1d4ed8; text-decoration: none; }
  .photo-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<div id="bar">
  <label for="sel">Beach:</label>
  <select id="sel"></select>
  <span id="meta"></span>
</div>
<main>
  <h1 class="beach-header" id="title"></h1>
  <div class="beach-sub" id="sub"></div>
  <div class="photos" id="photos"></div>
  <hr style="margin: 24px 0; border: 0; border-top: 1px solid #e2e8f0">
  <h2 style="font-size: 14px; color: #64748b">Beaches the sandy/rocky filter correctly excluded</h2>
  <ul id="filtered" style="font-size: 12px; color: #64748b"></ul>
</main>

<script>
// Live data from beach_photos after sandy/rocky-only filter (post-fix).
// Surfrider's Adamson House (museum) and Carmel's wrong-coords match
// to Schoolhouse Beach are correctly excluded by the sandy_beach filter.
const DATA = [
  { fid: 8337, name: "Aliso Beach", access: "Aliso Beach Park", dist_m: 30,
    photos: [
      "https://www.coastal.ca.gov/access-photos/15_orange/10_Laguna_Beach_to_Aliso_Beach_Park/Aliso_Beach_Park_2014_01_19_2430.jpg",
      "https://www.coastal.ca.gov/access-photos/15_orange/10_Laguna_Beach_to_Aliso_Beach_Park/Aliso_Beach_Park_2014_01_19_2440.jpg",
      "https://www.coastal.ca.gov/access-photos/15_orange/10_Laguna_Beach_to_Aliso_Beach_Park/Aliso_Beach_Park_south_end_2008_05_01_0117.jpg",
    ] },
  { fid: 8260, name: "Baker Beach", access: "Baker Beach (San Francisco)", dist_m: 94,
    photos: ["https://www.coastal.ca.gov/access-photos/07_san_francisco/04_san_francisco_presidio_to_lands_end/Baker_Bch_2010_04_29_4767.jpg"] },
  { fid: 8359, name: "Ocean Beach (SD)", access: "Ocean Beach Park", dist_m: 8,
    note: "fid 8359 is Ocean Beach San Diego, not OB San Francisco — naming collision in our gold record",
    photos: [
      "https://www.coastal.ca.gov/access-photos/16_san_diego/14_Ocean_Beach_to_Point_Loma/Ocean_Beach_at_end_of_Santa_Cruz_Ave_2013_09_28_8238.jpg",
      "https://www.coastal.ca.gov/access-photos/16_san_diego/14_Ocean_Beach_to_Point_Loma/Ocean_Beach_at_end_of_Santa_Cruz_Ave_2013_09_28_8242.jpg",
    ] },
  { fid: 8617, name: "Pfeiffer Beach", access: "Pfeiffer Beach", dist_m: 167,
    photos: [
      "https://www.coastal.ca.gov/access-photos/10_monterey/12_pfeiffer_beach_to_jpb_sp/Pfeiffer_Beach_SFS_2010_11_16_9104.jpg",
      "https://www.coastal.ca.gov/access-photos/10_monterey/12_pfeiffer_beach_to_jpb_sp/Pfeiffer_Beach_SFS_2010_11_16_9106.jpg",
    ] },
];

// Beaches that WERE in the dropdown but got correctly filtered out by
// the sandy/rocky tag — listed for transparency, no photos to show.
const FILTERED_OUT = [
  { name: "Surfrider Beach", reason: "Closest CCC point was 'Adamson House' (Malibu Lagoon Museum) — not flagged sandy/rocky" },
  { name: "Carmel Beach (suspect gold record)", reason: "Closest CCC was 'Schoolhouse Beach' in Sonoma — wrong-coords gold row" },
  { name: "Stinson Beach", reason: "Closest CCC point within 200m wasn't sandy/rocky tagged" },
  { name: "Zuma Beach", reason: "Closest CCC point within 200m wasn't sandy/rocky tagged" },
  { name: "Ocean Beach Tide Pools", reason: "Closest CCC point was Ocean Beach City Beaches >200m away after re-check" },
];

const sel    = document.getElementById('sel');
const meta   = document.getElementById('meta');
const titleEl = document.getElementById('title');
const subEl  = document.getElementById('sub');
const grid   = document.getElementById('photos');

DATA.forEach((d, i) => {
  const opt = document.createElement('option');
  opt.value = String(i);
  opt.textContent = `${d.name} — ${d.photos.length} photo${d.photos.length>1?'s':''}`;
  sel.appendChild(opt);
});

function show(i) {
  const d = DATA[i]; if (!d) return;
  titleEl.textContent = d.name;
  const noteHtml = d.note ? ` · <span style="color:#b91c1c">${d.note}</span>` : '';
  subEl.innerHTML = `fid ${d.fid} · CCC access point: <strong>${d.access}</strong> · ${d.dist_m}m from beach centroid${noteHtml}`;
  meta.textContent = `${d.photos.length} photo${d.photos.length>1?'s':''}`;
  grid.innerHTML = d.photos.map((url, j) => `
    <div class="photo">
      <a href="${url}" target="_blank" rel="noopener"><img src="${url}" loading="lazy" alt=""></a>
      <div class="photo-caption">
        Photo ${j+1} · <a class="photo-link" href="${url}" target="_blank" rel="noopener">open full</a>
        <br>${url.split('/').pop()}
      </div>
    </div>
  `).join('');
  history.replaceState(null, '', `?b=${d.fid}`);
}

sel.addEventListener('change', () => show(parseInt(sel.value, 10)));
const startFid = parseInt(new URLSearchParams(location.search).get('b') || '0', 10);
const startIdx = Math.max(0, DATA.findIndex(d => d.fid === startFid));
sel.value = String(startIdx);
show(startIdx);

document.getElementById('filtered').innerHTML = FILTERED_OUT.map(f =>
  `<li><strong>${f.name}</strong> — ${f.reason}</li>`).join('');
</script>
</body>
</html>
