function _wireAutoPanel() {
  const panel = document.getElementById('auto-panel');
  if (!panel) return;
  panel.querySelector('#btn-approve-auto').onclick = () => _autoCurateAction('approve');
  panel.querySelector('#btn-clear-auto').onclick   = () => _autoCurateAction('clear');
  panel.querySelector('#btn-approve-state').onclick = () => _autoCurateBulk();
}

async function _autoCurateAction(action) {
  if (!beachData || !beachData.beach) return;
  const fid = beachData.beach.fid;
  const comment = (document.getElementById('auto-comment') || {}).value || null;
  const rpc = action === 'approve'
    ? 'approve_auto_curated_beach'
    : 'clear_auto_curated_beach';
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${rpc}`, {
      method: 'POST',
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}`,
                 'Content-Type': 'application/json' },
      body: JSON.stringify({
        p_beach_fid: fid, p_curator: curatorUser, p_comment: comment,
      }),
    });
    if (!res.ok) {
      const t = await res.text();
      alert(`${action} failed: HTTP ${res.status}\n${t.slice(0,200)}`);
      return;
    }
    const n = await res.json();
    // Drop this fid from the auto-set so the dropdowns + render refresh
    autoFidSet.delete(fid);
    if (autoRowsByFid) autoRowsByFid.delete(fid);
    // Reload the beach to reflect the new curated_by state
    await loadBeach(fid, { fromHistory: true });
    // Optional: refresh the county/beach dropdowns so the removed beach disappears
    renderCountyDropdown();
    renderBeachDropdown();
  } catch (e) {
    alert(`${action} failed: ${e.message}`);
  }
}

async function _autoCurateBulk() {
  if (!currentState) return;
  const expected = autoStateSet
    ? [...autoFidSet].filter(fid => {
        const r = autoRowsByFid ? autoRowsByFid.get(fid) : null;
        return r && r.state === currentState;
      }).length
    : 0;
  if (!expected) return;
  const comment = (document.getElementById('auto-comment') || {}).value || null;
  if (!confirm(`Approve auto-curated photos on all ${expected} beaches in ${currentState}?\n\nThis cannot be undone (clears the auto-curate state).`)) return;
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/approve_auto_curated_state`, {
      method: 'POST',
      headers: { 'apikey': ANON_KEY, 'Authorization': `Bearer ${ANON_KEY}`,
                 'Content-Type': 'application/json' },
      body: JSON.stringify({
        p_state: currentState, p_curator: curatorUser, p_comment: comment,
        p_expected_fid_count: expected,
      }),
    });
    if (!res.ok) {
      const t = await res.text();
      alert(`bulk approve failed: HTTP ${res.status}\n${t.slice(0,200)}`);
      return;
    }
    const n = await res.json();
    alert(`Approved ${n} photo${n===1?'':'s'} across ${expected} beach${expected===1?'':'es'} in ${currentState}.`);
    // Drop all in-state auto-fids from local sets
    for (const fid of [...autoFidSet]) {
      const r = autoRowsByFid ? autoRowsByFid.get(fid) : null;
      if (r && r.state === currentState) {
        autoFidSet.delete(fid);
        if (autoRowsByFid) autoRowsByFid.delete(fid);
      }
    }
    // Re-render
    await loadStates();
    await loadProgress();
  } catch (e) {
    alert(`bulk approve failed: ${e.message}`);
  }
}

function fmtDistance(m) {
  if (m == null || isNaN(m)) return '';
  const meters = Number(m);
  if (meters < 1000) return `${Math.round(meters)} m`;
  const mi = meters / 1609.344;
  return mi < 10 ? `${mi.toFixed(2)} mi` : `${mi.toFixed(1)} mi`;
}

// Extract top-5 tags from the vision-tagged source_meta. Priority:
//   1. quality_issue (a 'bad' tag — warn-styled if present)
//   2. has_X booleans that are true (dog, birds, surfing, active_people,
//      human_face_closeup)
//   3. scene (string)
//   4. atmosphere (string)
//   5. subjects[] / landscape_features[] (first few)
// Returns array of { label, cls } where cls is 'good' / 'warn' / 'bad' / ''.
function extractTopTags(p, max = 5) {
  const v = (p.source_meta || {}).vision || {};
  const out = [];
  if (v.quality_issue && v.quality_issue !== 'none') {
    out.push({ label: v.quality_issue, cls: 'bad' });
  }
  if (v.has_human_face_closeup) out.push({ label: 'face closeup', cls: 'warn' });
  if (v.has_dog)                out.push({ label: 'dog', cls: 'good' });
  if (v.has_birds)              out.push({ label: 'birds', cls: '' });
  if (v.has_surfing)            out.push({ label: 'surf', cls: 'good' });
  if (v.has_active_people)      out.push({ label: 'people', cls: '' });
  if (v.scene)       out.push({ label: v.scene, cls: '' });
  if (v.atmosphere)  out.push({ label: v.atmosphere, cls: '' });
  for (const s of (v.subjects || [])) out.push({ label: s, cls: '' });
  for (const f of (v.landscape_features || [])) out.push({ label: f, cls: '' });
  // De-dupe by label
  const seen = new Set();
  const dedup = out.filter(t => {
    const k = t.label.toLowerCase();
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
  return dedup.slice(0, max);
}

function renderPhotoCard(p, idx) {
  const distLabel = fmtDistance(p.distance_m);
  const distHtml = distLabel
    ? `<span class="photo-distance" title="distance from beach point">📍 ${escHtml(distLabel)}</span>`
    : '';
  const num = (idx ?? 0) + 1;
  const mq = p.match_quality || p.default_match_quality || 'unknown';
  const mqLabel = (MATCH_OPTIONS.find(o => o.v === mq) || {}).label || mq;
  // Photo title/description — helps Franz spot beach names in the metadata
  const meta = p.source_meta || {};
  const mlProb = meta.predicted_keep_prob;
  const mlModel = meta.predicted_keep_model || 'logreg';
  let mlHtml = '';
  if (mlProb != null && !isNaN(mlProb)) {
    const pct = Math.round(mlProb * 100);
    const cls = mlProb >= 0.85 ? 'ml-high'
              : mlProb <= 0.15 ? 'ml-low'
              : 'ml-mid';
    mlHtml = `<span class="ml-badge ${cls}" title="ML keep probability (${escHtml(mlModel)})">🤖 ${pct}%</span>`;
  }
  const title = (meta.title || '').replace(/^File:/,'').replace(/\.(jpe?g|png|tif{1,2}|webp)$/i,'').trim();
  // Description lives at vision.description (Haiku), not at meta.description.
  // Fixed 2026-05-20 — was previously almost always empty.
  const desc = ((meta.vision && meta.vision.description) || meta.description || '').trim();
  const captionText = [title, desc].filter(Boolean).join(' — ');
  const captionHtml = captionText
    ? `<div class="photo-caption" title="${escHtml(captionText)}">${escHtml(captionText)}</div>`
    : '';
  const curatorCls = isCuratorPhoto(p) ? ' is-curator' : '';
  // Source stays as the original loader source (cdpr/flickr/etc.).
  const sourceLabel = p.source;
  // Curator status: gold ★ for human picks, silver ★ for AI picks.
  // 'Curated:Human' is canonical; legacy 'cakers' (pre-edge-function-
  // deploy) treated as human. 'Curated:AI' is canonical; legacy
  // 'auto:%' treated as AI. 'derived:sibling' → no chip (sibling
  // propagation, not a real pick). null → no chip. Franz 2026-05-20.
  const curBy = p.curated_by || '';
  const isAi    = curBy === 'Curated:AI' || curBy.startsWith('auto:');
  const isHuman = !!curBy && !isAi && !curBy.startsWith('derived:');
  const curatorChipHtml =
      isAi    ? `<span class="curator-chip is-ai" title="Curated:AI — picked by the auto-curate model (${escHtml(curBy)})">★ AI</span>`
    : isHuman ? `<span class="curator-chip" title="Curated:Human — picked by a human curator (${escHtml(curBy)})">★ Human</span>`
    : '';
  // Preserve trash/hide state across re-renders (drag reorder rebuilds the
  // grid via renderPhotoCard; without this the visual state from dirtyMap
  // is lost). Source-of-truth for in-flight decisions is dirtyMap.
  const dirtyState = dirtyMap.get(p.id) || {};
  const stateCls = dirtyState.deleted ? ' deleted'
                 : dirtyState.hidden  ? ' hidden'
                 : '';
  const isDecided = dirtyState.deleted || dirtyState.hidden;
  const trashDisp   = isDecided ? 'none' : '';
  const hideDisp    = isDecided ? 'none' : '';
  const restoreDisp = isDecided ? '' : 'none';

  // Distance — shown prominently in the score-row alongside word-match.
  const distScoreHtml = distLabel
    ? `<span class="label">Dist</span><span class="word-match" title="Distance from beach point (used in rank: -0.15 per km).">${escHtml(distLabel)}</span>`
    : `<span class="label">Dist</span><span class="word-match" style="color:var(--muted)">—</span>`;

  // Word-match score. Stored source_meta.name_match_score is often stale
  // (loader version drift) — many obvious matches show 0.0 in the DB
  // (Manchester Beach photos titled "Manchester Beach" all = 0.0).
  // Recompute client-side using the current title + beach name so the
  // displayed value is always fresh. Per Franz 2026-05-20.
  //
  // Title source fallback chain: source_meta.title (Wikimedia/Flickr),
  // source_meta.description (some loaders), p.title direct, source_meta.
  // vision.description (last resort — Haiku output).
  const _bn = (beachData?.beach?.display_name
               || beachData?.beach?.display_name_override
               || beachData?.beach?.name
               || p.beach_name || p.arena_group_name || '');
  const _tt = (meta.title || p.title
               || (meta.vision && meta.vision.description) || '');
  const wordMatch = _wordMatchScore(_bn, _tt);
  const wordMatchPct = wordMatch !== null ? Math.round((wordMatch / 4) * 100) : null;
  const wmTitle = `Beach: "${_bn || '(unknown)'}" vs title: "${(_tt || '(empty)').slice(0,80)}". Token overlap; raw 0-4 shown as % of max.`;
  const wordMatchHtml = wordMatchPct !== null
    ? `<span class="label">Word</span><span class="word-match" title="${escHtml(wmTitle)}">${wordMatchPct}%</span>`
    : `<span class="label">Word</span><span class="word-match" style="color:var(--muted)" title="${escHtml(wmTitle)}">—</span>`;

  // Predicted keep probability (the model's score) — same value the 🤖 badge
  // shows above, repeated on the score-row so dist / word / prob / override
  // sit in one comparison line. Per Franz 2026-05-19.
  //
  // Missingness flag: when the photo has NO vision tags, the keep_prob
  // is an under-evidence guess (no vision penalties applied, model
  // defaults to "kept"). Visually flag with ⚠ so the curator knows
  // not to over-trust the score. Per Franz 2026-05-19.
  const hasVision = !!(meta.vision && meta.vision.model);
  const noVisionWarn = (mlProb != null && !hasVision)
    ? `<span title="No vision tags — keep_prob is an under-evidence guess (no penalty for screenshot/interior/vehicle/etc). Re-tag this photo to sharpen." style="color:#fb923c; cursor:help; margin-left:2px;">⚠</span>`
    : '';
  const probHtml = mlProb != null && !isNaN(mlProb)
    ? `<span class="label">Qual</span><span class="word-match" title="Predicted keep probability from Tier-2 model (${escHtml(mlModel)}).">${mlProb.toFixed(2)}${noVisionWarn}</span>`
    : `<span class="label">Qual</span><span class="word-match" style="color:var(--muted)">—</span>`;

  // Score override input. Pre-fills with override_keep_prob if set, else
  // shows placeholder of current ML prob. Edits update dirtyMap.
  const dirty = dirtyMap.get(p.id) || {};
  const override = dirty.override_keep_prob != null
    ? dirty.override_keep_prob
    : (meta.override_keep_prob != null ? meta.override_keep_prob : '');
  const overrideDirtyCls = dirty.override_keep_prob != null ? ' dirty' : '';
  const overrideHtml = `<span class="label">override</span>
    <input type="number" class="override-input${overrideDirtyCls}"
           data-id="${p.id}" data-action="override-score"
           min="0" max="1" step="0.01"
           value="${escHtml(String(override))}"
           placeholder="${mlProb != null ? mlProb.toFixed(2) : '—'}"
           title="Override the ML keep-prob (0.00-1.00). Empty = use ML.">`;

  // Top-5 tags from vision data
  const tags = extractTopTags(p, 5);
  const tagsHtml = tags.length
    ? `<div class="tags-row">${
        tags.map(t => `<span class="tag-chip${t.cls ? ' ' + t.cls : ''}">${escHtml(t.label)}</span>`).join('')
      }</div>`
    : '';

  return `<div class="photo-card${curatorCls}${stateCls}" data-id="${p.id}" data-num="${num}" draggable="true">
    <div class="photo-num" title="click to highlight on map">${num}</div>
    <img src="${p.image_url || p.thumb_url}" alt="" loading="lazy">
    <div class="photo-meta">
      <div class="meta-row">
        <span class="photo-source${(p.lat == null) ? ' no-geo' : ''}" title="Source: ${escHtml(sourceLabel)}${(p.lat == null) ? ' · ⚠ NO GEO — assigned by park-name match only, may be wrong beach' : ''} · match: ${escHtml(mqLabel)}">${escHtml(sourceLabel)}${(p.lat == null) ? ' ⚠' : ''}</span>
        ${curatorChipHtml}
        ${distScoreHtml}
        ${probHtml}
        ${overrideHtml}
        ${wordMatchHtml}
      </div>
      ${tagsHtml}
      ${captionHtml}
      <div class="photo-actions">
        <button type="button" data-action="hide" data-id="${p.id}" title="Hide from this beach (no negative training signal)" style="display:${hideDisp}">🙈</button>
        <button type="button" data-action="hide-right" data-id="${p.id}" title="Hide this and everything after (no negative training signal)" style="display:${hideDisp}">🙈 →</button>
        <button class="trash" type="button" data-action="trash" data-id="${p.id}" title="Trash this photo (model learns to avoid similar)" style="display:${trashDisp}">🗑</button>
        <button class="trash" type="button" data-action="trash-right" data-id="${p.id}" title="Trash this and everything after (model learns to avoid similar)" style="display:${trashDisp}">🗑 →</button>
        <button class="restore" type="button" data-action="restore" data-id="${p.id}" style="display:${restoreDisp}">↩</button>
        <a href="${p.image_url}" target="_blank" rel="noopener" style="text-decoration:none">
          <button type="button" style="width:100%">🔍</button>
        </a>
      </div>
    </div>
  </div>`;
}

function wireCardEvents() {
  // Number-badge click → highlight matching marker on map.
  document.querySelectorAll('.photo-num').forEach(badge => {
    badge.onclick = (e) => {
      e.stopPropagation();
      const card = badge.closest('.photo-card');
      const id = parseInt(card?.dataset?.id || '0', 10);
      if (id) flashMarker(id);
    };
  });

  // match-label is read-only — no event wiring. The auto-computed
  // default_match_quality is shown as a colored text label.
  // Trash / restore
  document.querySelectorAll('[data-action="trash"]').forEach(b => {
    b.onclick = () => trashPhoto(parseInt(b.dataset.id, 10));
  });
  document.querySelectorAll('[data-action="trash-right"]').forEach(b => {
    b.onclick = () => {
      const startId = parseInt(b.dataset.id, 10);
      const order = beachData.photos.map(p => p.id);
      const startIdx = order.indexOf(startId);
      if (startIdx < 0) return;
      for (let i = startIdx; i < order.length; i++) trashPhoto(order[i]);
    };
  });
  document.querySelectorAll('[data-action="hide"]').forEach(b => {
    b.onclick = () => hidePhoto(parseInt(b.dataset.id, 10));
  });
  document.querySelectorAll('[data-action="hide-right"]').forEach(b => {
    b.onclick = () => {
      const startId = parseInt(b.dataset.id, 10);
      const order = beachData.photos.map(p => p.id);
      const startIdx = order.indexOf(startId);
      if (startIdx < 0) return;
      for (let i = startIdx; i < order.length; i++) hidePhoto(order[i]);
    };
  });
  document.querySelectorAll('[data-action="restore"]').forEach(b => {
    b.onclick = () => restorePhoto(parseInt(b.dataset.id, 10));
  });

  // Score override — text input captures curator's manual keep-prob
  // override. Updates dirtyMap; saved alongside trash/sort_order/match.
  // Empty input clears the override (revert to ML score).
  document.querySelectorAll('[data-action="override-score"]').forEach(inp => {
    inp.addEventListener('change', () => {
      const id = parseInt(inp.dataset.id, 10);
      const raw = inp.value.trim();
      const existing = dirtyMap.get(id) || {};
      if (raw === '') {
        // Clearing the override
        delete existing.override_keep_prob;
        if (Object.keys(existing).length === 0) dirtyMap.delete(id);
        else dirtyMap.set(id, existing);
        inp.classList.remove('dirty');
      } else {
        const v = parseFloat(raw);
        if (isNaN(v) || v < 0 || v > 1) {
          inp.style.borderColor = 'var(--red)';
          setTimeout(() => { inp.style.borderColor = ''; }, 1500);
          return;
        }
        existing.override_keep_prob = v;
        dirtyMap.set(id, existing);
        inp.classList.add('dirty');
      }
      updateSummary();
    });
    // Prevent drag from initiating when typing in the input
    inp.addEventListener('mousedown', e => e.stopPropagation());
    inp.addEventListener('dragstart', e => e.preventDefault());
  });

  // Drag-drop
  document.querySelectorAll('.photo-card').forEach(card => {
    card.ondragstart = (e) => {
      dragSrcId = parseInt(card.dataset.id, 10);
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      document.getElementById('trash-zone').classList.add('visible');
    };
    card.ondragend = () => {
      card.classList.remove('dragging');
      document.querySelectorAll('.drop-target').forEach(c => c.classList.remove('drop-target'));
      document.getElementById('trash-zone').classList.remove('visible', 'over');
      dragSrcId = null;
    };
    card.ondragover = (e) => {
      if (dragSrcId == null || parseInt(card.dataset.id, 10) === dragSrcId) return;
      e.preventDefault();
      card.classList.add('drop-target');
    };
    card.ondragleave = () => card.classList.remove('drop-target');
    card.ondrop = (e) => {
      e.preventDefault();
      card.classList.remove('drop-target');
      if (dragSrcId == null) return;
      reorderPhotos(dragSrcId, parseInt(card.dataset.id, 10));
    };
  });
  // Trash zone
  const tz = document.getElementById('trash-zone');
  tz.ondragover = (e) => { e.preventDefault(); tz.classList.add('over'); };
  tz.ondragleave = () => tz.classList.remove('over');
  tz.ondrop = (e) => {
    e.preventDefault();
    if (dragSrcId != null) trashPhoto(dragSrcId);
    tz.classList.remove('over');
  };
}

function trashPhoto(id) {
  const card = document.querySelector(`.photo-card[data-id="${id}"]`);
  if (card) { card.classList.add('deleted'); card.classList.remove('hidden'); }
  const trashBtn = card?.querySelector('[data-action="trash"]');
  const hideBtn = card?.querySelector('[data-action="hide"]');
  const restoreBtn = card?.querySelector('[data-action="restore"]');
  if (trashBtn) trashBtn.style.display = 'none';
  if (hideBtn) hideBtn.style.display = 'none';
  if (restoreBtn) restoreBtn.style.display = '';
  // {deleted: true} → tombstone + model training signal
  markDirty(id, { deleted: true, hidden: false });
}
function hidePhoto(id) {
  const card = document.querySelector(`.photo-card[data-id="${id}"]`);
  if (card) { card.classList.add('hidden'); card.classList.remove('deleted'); }
  const trashBtn = card?.querySelector('[data-action="trash"]');
  const hideBtn = card?.querySelector('[data-action="hide"]');
  const restoreBtn = card?.querySelector('[data-action="restore"]');
  if (trashBtn) trashBtn.style.display = 'none';
  if (hideBtn) hideBtn.style.display = 'none';
  if (restoreBtn) restoreBtn.style.display = '';
  // {hidden: true} → exclude from this beach's display but DO NOT train against
  markDirty(id, { hidden: true, deleted: false });
}
function restorePhoto(id) {
  const card = document.querySelector(`.photo-card[data-id="${id}"]`);
  if (card) { card.classList.remove('deleted'); card.classList.remove('hidden'); }
  const trashBtn = card?.querySelector('[data-action="trash"]');
  const hideBtn = card?.querySelector('[data-action="hide"]');
  const restoreBtn = card?.querySelector('[data-action="restore"]');
  if (trashBtn) trashBtn.style.display = '';
  if (hideBtn) hideBtn.style.display = '';
  if (restoreBtn) restoreBtn.style.display = 'none';
  markDirty(id, { deleted: false, hidden: false });
}

function reorderPhotos(srcId, targetId) {
  const order = beachData.photos.map(p => p.id);
  const srcIdx = order.indexOf(srcId);
  const tgtIdx = order.indexOf(targetId);
  if (srcIdx < 0 || tgtIdx < 0) return;
  order.splice(srcIdx, 1);
  order.splice(tgtIdx, 0, srcId);
  // Reorder beachData.photos to match
  const byId = new Map(beachData.photos.map(p => [p.id, p]));
  beachData.photos = order.map(id => byId.get(id));
  // Rerender (cheap)
  const grid = document.getElementById('photo-grid');
  grid.innerHTML = beachData.photos.map((p, i) => renderPhotoCard(p, i)).join('');
  wireCardEvents();
  // Mark all reordered as dirty (sort_order changes)
  beachData.photos.forEach((p, i) => {
    const prev = dirtyMap.get(p.id) || {};
    markDirty(p.id, { ...prev, sort_order: 100 + i });
    // Restore deleted state visual
    if (prev.deleted) trashPhoto(p.id);
  });
}

function markDirty(id, patch) {
  const cur = dirtyMap.get(id) || {};
  dirtyMap.set(id, { ...cur, ...patch });
  updateSummary();
}

function updateSummary() {
  const trashed = [...dirtyMap.values()].filter(d => d.deleted).length;
  const reordered = [...dirtyMap.entries()].filter(([_, d]) => d.sort_order != null).length;
  const matched = [...dirtyMap.values()].filter(d => d.match_quality).length;
  const parts = [];
  if (trashed)   parts.push(`${trashed} trashed`);
  if (reordered) parts.push(`${reordered} reordered`);
  if (matched)   parts.push(`${matched} match-rated`);
  document.getElementById('save-summary').textContent =
    parts.length ? parts.join(', ') : 'No pending changes.';
}

document.getElementById('btn-save-next').onclick = saveBeach;

async function saveBeach() {
  if (!beachData) return;
  // Build photos[] payload — every photo gets sort_order + keep + match_quality.
  // sort_order is set by current grid position (left-to-right show order).
  const photos = beachData.photos.map((p, i) => {
    const dirty = dirtyMap.get(p.id) || {};
    return {
      id: p.id,
      sort_order: 100 + i,  // canonical: current grid order = show order
      keep: !dirty.deleted && !dirty.hidden,
      hidden: !!dirty.hidden,            // distinct from deleted; no tombstone
      override_keep_prob: dirty.override_keep_prob,  // may be undefined; edge fn skips if missing
      match_quality: p.match_quality || p.default_match_quality || null,
    };
  });
  const res = await fetch(`${SUPABASE_URL}/functions/v1/admin-curate-beach`, {
    method: 'POST',
    headers: { 'Authorization': `Bearer ${ANON_KEY}`, 'apikey': ANON_KEY,
               'Content-Type': 'application/json', 'x-admin-secret': token },
    body: JSON.stringify({
      fid: beachData.beach.fid,
      photos,
      curated_by: curatorUser,
    }),
  });
  if (!res.ok) {
    const j = await res.json().catch(()=>({error:`HTTP ${res.status}`}));
    alert(`Save failed: ${j.error || res.status}`);
    return;
  }
  // Refresh progress and re-bind to the updated county (so checkmarks
  // and counts reflect the just-saved state). loadProgress only updates
  // the global `progress` array — we still need to re-look-up
  // currentCounty in it and re-render the beach dropdown.
  const savedCountyName = currentCounty?.county;
  const savedFid = currentBeach;
  await loadProgress({ skipAutoSelect: true });
  if (savedCountyName) {
    currentCounty = progress.find(c => c.county === savedCountyName) || currentCounty;
    document.getElementById('sel-county').value = savedCountyName;
    renderBeachDropdown();
    updateProgressLabel();
    document.getElementById('sel-beach').value = String(savedFid);
  }
  // Advance to next pending beach in county
  const beaches = currentCounty.beaches.filter(b => b.photo_count > 0);
  const idx = beaches.findIndex(b => b.fid === savedFid);
  for (let i = idx + 1; i < beaches.length; i++) {
    if (!beaches[i].is_curated) { loadBeach(beaches[i].fid); return; }
  }
  for (let i = 0; i < idx; i++) {
    if (!beaches[i].is_curated) { loadBeach(beaches[i].fid); return; }
  }
  // County complete — jump to the next county with pending work. No alert;
  // just keep the curator moving (Franz, 2026-05-11).
  const nextCounty = progress.find(c =>
    c.county !== currentCounty.county
    && (c.with_photos || 0) - (c.curated || 0) > 0
  );
  if (nextCounty) {
    selectCounty(nextCounty.county);   // sets currentCounty + auto-loads first pending beach
  } else {
    // State complete (no more pending counties). Stay on current beach.
    await loadBeach(savedFid);
  }
}

function escHtml(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
