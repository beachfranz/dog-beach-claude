<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>detail.html — permutation walkthrough</title>
<style>
  body { margin: 0; font-family: 'DM Sans', system-ui, sans-serif; background: #f8fafc; }
  #perm-bar {
    padding: 12px 16px; background: #0f2742; color: #fff;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  #perm-bar label { font-size: 12px; opacity: 0.7; }
  #perm-bar select {
    font-family: inherit; font-size: 13px; padding: 6px 10px;
    border-radius: 6px; border: 1px solid #1e3a5f;
    background: #1e293b; color: #fff; min-width: 360px;
  }
  #perm-bucket {
    margin-left: auto; font-size: 12px; padding: 4px 10px;
    background: rgba(255,255,255,0.08); border-radius: 999px;
    letter-spacing: 0.02em;
  }
  #perm-desc {
    padding: 10px 16px; background: #fff; border-bottom: 1px solid #e2e8f0;
    font-size: 13px; color: #334155;
  }
  iframe { width: 100%; height: calc(100vh - 90px); border: 0; display: block; }
</style>
</head>
<body>

<div id="perm-bar">
  <label for="perm-select">Permutation:</label>
  <select id="perm-select"></select>
  <span id="perm-bucket"></span>
</div>
<div id="perm-desc"></div>
<iframe id="perm-frame" title="detail.html"></iframe>

<script>
  const PERMUTATIONS = [
    { bucket: 'A',
      label: '1 zone (Whole beach), no time-windows',
      desc: 'Coronado Dog Beach — sand=off_leash + trails=on_leash + picnic=on_leash within ONE region. Section-level rule diversity, no time variation.',
      fid: 6202, name: 'Coronado Dog Beach' },
    { bucket: 'B',
      label: '1 zone with time-windows',
      desc: 'Fiesta Island — off-leash 4am–10pm; tabs swap based on now/best-window context.',
      fid: 9716, name: 'Fiesta Island' },
    { bucket: 'C',
      label: 'Multiple all-named zones (no Whole beach)',
      desc: 'Garrapata State Beach — "Gate 19 area" vs "rest of park"; canonical multi-region split when geography is fundamentally distinct.',
      fid: 3407, name: 'Garrapata State Beach' },
    { bucket: 'D',
      label: 'Multi-zone w/ named + Whole beach (dedupe in action)',
      desc: 'Harbor Beach (Santa Cruz) — Seabright + Mitchell\'s Cove named zones; Whole beach card carries parking+restrooms after dedupe drops sand/water.',
      fid: 8894, name: 'Harbor Beach' },
    { bucket: 'E',
      label: 'Multi-season (peak vs off-season)',
      desc: 'Aliso Beach — 2 seasons; season name appended to card header.',
      fid: 8337, name: 'Aliso Beach' },
    { bucket: 'F',
      label: 'Multi-season + time-windows (full complexity)',
      desc: 'Del Mar Dog Beach — 2 seasons × time-windows; both season and time-tabs render.',
      fid: 8560, name: 'Del Mar Dog Beach' },
    { bucket: 'G',
      label: 'Dogs not allowed (Scout short-circuit + alternatives card)',
      desc: 'Point Dume State Beach — "Sorry bud" + nearby dog-friendly alternatives, no LLM blurb call.',
      fid: 9720, name: 'Point Dume State Beach' },
    { bucket: 'H',
      label: 'Deepest extraction (multiple regions × sections × seasons)',
      desc: 'Ocean Beach — 3 regions (main beach + Snowy Plover area + Dog Beach sibling note); heaviest extraction in the cohort.',
      fid: 8359, name: 'Ocean Beach' },
  ];

  const sel    = document.getElementById('perm-select');
  const bucket = document.getElementById('perm-bucket');
  const desc   = document.getElementById('perm-desc');
  const frame  = document.getElementById('perm-frame');

  PERMUTATIONS.forEach((p, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = `${p.bucket}. ${p.label} — ${p.name}`;
    sel.appendChild(opt);
  });

  function load(i) {
    const p = PERMUTATIONS[i];
    if (!p) return;
    bucket.textContent = `Bucket ${p.bucket} · ${p.name} (fid ${p.fid})`;
    desc.textContent = p.desc;
    const today = new Date().toISOString().slice(0, 10);
    frame.src = `detail.html?fid=${p.fid}&date=${today}`;
    history.replaceState(null, '', `?bucket=${p.bucket}`);
  }

  sel.addEventListener('change', () => load(parseInt(sel.value, 10)));

  // Honor ?bucket=A on load
  const startBucket = new URLSearchParams(location.search).get('bucket');
  const startIdx = Math.max(0, PERMUTATIONS.findIndex(p => p.bucket === startBucket));
  sel.value = String(startIdx);
  load(startIdx);
</script>

</body>
</html>
