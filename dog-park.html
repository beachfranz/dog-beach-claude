<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dog Park — Dog Beach Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/photo-block.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f2742;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --accent: #1d4ed8;
    --green: #16a34a;
    --red:   #dc2626;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  .page { max-width: 1200px; margin: 0 auto; }
  .body-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
  }
  @media (min-width: 900px) {
    .body-grid {
      grid-template-columns: minmax(280px, 34%) 1fr;
      gap: 16px;
      padding: 0 16px;
    }
    .body-grid > main { padding: 0; }
    .body-grid > aside#left-rail {
      position: sticky;
      top: 96px;
      align-self: start;
      padding-top: 12px;
      max-height: calc(100vh - 110px);
      overflow-y: auto;
    }
    #left-rail .amenity-grid { grid-template-columns: repeat(2, 1fr); }
  }
  header.hero {
    padding: 24px 20px 16px; background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .hero-main { flex: 1; min-width: 0; }
  .park-name {
    font-family: 'Outfit', sans-serif;
    font-size: 24px; font-weight: 700; color: var(--text);
    margin: 0 0 6px;
  }
  .fit-badge {
    display: inline-block;
    font-size: 19px; font-weight: 700; line-height: 1.1;
    padding: 1px 9px; border-radius: 999px;
    color: white;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.04em;
    margin-right: 4px;
  }
  .fit-badge-go      { background: #16a34a; }
  .fit-badge-caution { background: #f59e0b; }
  .fit-badge-no_go   { background: #dc2626; }
  .park-region {
    color: var(--text-muted);
    margin-left: 0.4em;
    font-weight: 600;
  }
  .close-btn {
    color: var(--text-muted); text-decoration: none;
    font-size: 22px; line-height: 1; padding: 4px 6px;
    border-radius: 6px; flex-shrink: 0;
  }
  .close-btn:hover { background: var(--bg); }

  section.card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; margin: 8px 16px;
  }
  section.card h2 {
    font-size: 14px; font-weight: 700; margin: 0 0 8px;
    color: var(--text);
  }

  /* Tooltip pill — works on hover AND tap-to-pin (mobile). */
  [data-tip] { position: relative; }
  [data-tip]::after {
    content: attr(data-tip);
    white-space: pre-line;            /* honour \n line breaks in data-tip */
    position: absolute;
    left: 50%; bottom: calc(100% + 4px);
    transform: translateX(-50%);
    background: rgba(15,23,42,0.78);
    color: rgba(255,255,255,0.95);
    padding: 4px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 500; line-height: 1.35;
    width: max-content; max-width: 220px;
    text-align: left;
    z-index: 1000; pointer-events: none;
    opacity: 0;
    transition: opacity 80ms ease-out 0s;
  }
  [data-tip]:hover::after,
  [data-tip][data-tip-open]::after {
    opacity: 1;
    transition-delay: 200ms;
  }
  /* On touch — show immediately when pinned (no 200ms delay) */
  [data-tip][data-tip-open]::after {
    transition-delay: 0ms;
  }

  /* Amenities */
  .amenities-card { margin-top: 16px; }
  .amenities-card h2 { margin-bottom: 6px; }
  .amenity-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;
  }
  @media (min-width: 480px) {
    .amenity-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .amenity {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px;
    background: var(--card);
  }
  .amenity-icon { font-size: 14px; flex-shrink: 0; }
  .amenity-text { display: flex; flex-direction: column; line-height: 1.2; }
  .amenity-sub {
    font-size: 10px; color: var(--text-muted); font-weight: 500;
    margin-top: 1px;
  }
  .amenity-label { white-space: normal; line-height: 1.2; }
  /* Tiles tinted by rule. Dog parks are definitionally off-leash so the
   * "rule" here means feature-good (green) / feature-warn (amber) /
   * feature-missing (red). Mirrors beach amenity tinting visually. */
  .amenity.rule-off_leash   { background: rgba(34,197,94,0.45); border-color: rgba(21,128,61,0.42); }
  .amenity.rule-on_leash    { background: rgba(251,191,36,0.53); border-color: rgba(180,83,9,0.42); }
  .amenity.rule-not_allowed { background: rgba(239,68,68,0.45); border-color: rgba(153,27,27,0.42); }
  .amenity.rule-unknown     { background: rgba(0,0,0,0.04); }

  /* Cautions */
  .cautions-card h2 { margin-bottom: 6px; }
  .caution-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px;
  }
  @media (min-width: 480px) {
    .caution-grid { grid-template-columns: repeat(3, 1fr); }
  }
  .caution-tile {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 6px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px; background: var(--card);
    text-align: center; cursor: pointer; font-family: inherit;
    color: inherit; width: 100%;
  }
  .caution-tile:hover { filter: brightness(0.97); }
  .caution-tile[aria-expanded="true"] { outline: 2px solid rgba(15,23,42,0.55); outline-offset: -1px; }
  .caution-tile.sev-no_go    { background: rgba(239,68,68,0.45); border-color: rgba(153,27,27,0.42); }
  .caution-tile.sev-caution  { background: rgba(251,146,60,0.55); border-color: rgba(154,52,18,0.45); }
  .caution-tile.sev-advisory { background: rgba(0,0,0,0.04); }
  .caution-detail {
    margin-top: 8px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--card); font-size: 12px; line-height: 1.4;
    text-align: center;
  }
  .caution-detail[hidden] { display: none; }

  /* Hours */
  .hours-range { font-size: 14px; font-weight: 600; color: var(--text); margin: 0; }
  .hours-sub   { margin: 2px 0 0; font-size: 13px; color: var(--text-muted); }

  /* Weather */
  .weather-card .weather-now {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px; padding: 4px 0 2px;
  }
  .weather-now-cond {
    font-size: 36px; line-height: 1;
  }
  .weather-chips {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: 6px 8px;
  }
  .weather-chip {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; padding: 3px 8px;
    border-radius: 999px;
    background: rgba(0,0,0,0.05); color: var(--text);
  }
  .weather-loading { color: var(--text-muted); font-size: 12px; padding: 8px 0; }

  /* Best-time card */
  .besttime-card h2 {
    font-size: 16px; font-weight: 700; margin: 0; color: var(--text);
  }
  .besttime-header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px;
  }
  .besttime-headline {
    font-size: 28px; font-weight: 700; color: var(--text);
    letter-spacing: -0.02em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }

  /* Scout blurb (in best-time card) */
  #scout-blurb {
    font-family: 'DM Sans', sans-serif;
    font-size: 14px; line-height: 1.55;
    color: var(--text);
    margin-top: 8px;
    opacity: 0.55;
    transition: opacity 0.15s;
  }
  #scout-blurb.loaded { opacity: 1; }
  #scout-blurb strong { font-weight: 700; }
  .scout-card #scout-blurb {
    font-size: 14px; line-height: 1.55;
    color: var(--text);
    margin: 0; padding: 0;
  }
  .scout-cta-btn-friends {
    background: rgba(34,197,94,0.18); color: var(--text);
    border: 1px solid rgba(34,197,94,0.45);
  }
  .scout-cta-btn-friends:hover { background: rgba(34,197,94,0.28); opacity: 1; }
  .activities-prose {
    font-size: 14px; line-height: 1.55; color: var(--text);
    margin: 8px 0 0;
  }
  .scout-cta {
    margin-top: 12px;
    display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 10px;
    font-size: 14px; color: var(--text);
  }
  .scout-cta:empty { display: none; }
  .scout-cta-text { font-weight: 600; }
  .scout-cta-actions {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .scout-cta-btn {
    background: var(--accent); color: white;
    padding: 8px 14px; border-radius: 999px;
    font-size: 13px; font-weight: 600;
    text-decoration: none; display: inline-block;
    border: 0; cursor: pointer;
    font-family: inherit;
  }
  .scout-cta-btn:hover { opacity: 0.92; }

  /* Photos + map row */
  .photo-block-wrap { margin: 0 16px 12px; }
  .photo-map-row {
    display: flex; gap: 12px; align-items: stretch;
    margin: 0 16px 12px;
  }
  .photo-map-row .pm-photo-col { flex: 1; margin: 0; min-width: 0; }
  .photo-map-row .photo-block-hero { margin-bottom: 0; }
  .photo-map-row .pm-map-col {
    flex: 0 0 320px; display: flex;
  }
  .photo-map-row .pm-map-col #map {
    width: 320px; height: 100%; min-height: 260px;
    border-radius: 12px; border: 1px solid var(--border);
  }
  @media (max-width: 720px) {
    .photo-map-row { flex-direction: column; gap: 8px; margin: 0 12px 8px; }
    .photo-map-row .pm-map-col { flex: 0 0 auto; width: 100%; }
    .photo-map-row .pm-map-col #map { width: 100%; height: 180px; }
  }

  /* Overview prose (bare, no card chrome) */
  .overview-blurb {
    font-size: 14px; color: var(--text); line-height: 1.55;
    margin: 28px 16px 16px;
  }

  /* Pack list */
  .packlist-card h2 {
    font-size: 16px; font-weight: 700; margin: 0 0 10px; color: var(--text);
  }
  .packlist-chips {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  }
  .packlist-chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 999px;
    background: rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.06);
    font-size: 13px; color: var(--text);
    cursor: help;
  }
  .packlist-icon { font-size: 15px; line-height: 1; }
  .packlist-label { font-weight: 500; }

  /* Details (curated prose) */
  .details-prose {
    font-size: 13px; color: var(--text-muted); line-height: 1.55;
    white-space: pre-wrap;
  }

  /* Links */
  .link-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; text-decoration: none; color: var(--text);
    font-size: 13px; margin-bottom: 8px;
    transition: background 0.1s;
  }
  .link-row:hover { background: var(--bg); }
  .link-row .arrow { margin-left: auto; color: var(--text-muted); }

  /* Loading state */
  .state {
    display: flex; flex-direction: column; align-items: center;
    padding: 80px 20px; gap: 12px; color: var(--text-muted);
  }
  .state-icon { font-size: 36px; }

  /* Hourly v2 vertical bar chart — one bar per hour from park open to
   * close. Bar height ∝ score (0-100). Color by status. Hover for
   * detail. Centerpiece visualization on the Best-time card. */
  .hourbars-wrap {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .hourbars-meta {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin-bottom: 6px;
    font-size: 11px; color: var(--text-muted);
  }
  .hourbars-chart {
    display: flex; align-items: stretch;
    gap: 6px;
  }
  .hourbars-yaxis {
    position: relative;
    width: 32px;
    flex: none;
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    color: var(--text-muted);
    margin-top: 14px;   /* align with bar area (skip score-label row) */
  }
  .hourbars-yaxis > span {
    position: absolute;
    right: 4px;
    line-height: 1;
    transform: translateY(-50%);
    white-space: nowrap;
  }
  .hourbars-yaxis-top    { top: 0; }
  .hourbars-yaxis-mid    { top: 25%; opacity: 0.6; }
  .hourbars-yaxis-zero   { top: 50%; opacity: 0.7; }
  .hourbars-yaxis-neg-mid{ top: 75%; opacity: 0.6; }
  .hourbars-yaxis-bot    { top: 100%; }
  .hourbars-track {
    flex: 1 1 auto;
    display: flex; align-items: stretch;
    justify-content: space-between;
    gap: 6px;
    height: 180px;          /* score label 14 + pos 80 + axis + neg 80 */
    padding: 0 2px;
    position: relative;
  }
  /* Single horizontal axis line at the midpoint of bar area (offset by label height) */
  .hourbars-track::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: calc(14px + (100% - 14px) / 2);
    height: 1px;
    background: var(--text-muted);
    opacity: 0.4;
    pointer-events: none;
  }
  /* Subtle gridlines at ±25%/±50% of each half (i.e. ±12.5/25 score pts). */
  .hourbars-track::after {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 14px; bottom: 0;
    background-image:
      linear-gradient(to bottom,
        transparent calc(25% - 0.5px),
        rgba(100,116,139,0.15) calc(25% - 0.5px),
        rgba(100,116,139,0.15) calc(25% + 0.5px),
        transparent calc(25% + 0.5px),
        transparent calc(75% - 0.5px),
        rgba(100,116,139,0.15) calc(75% - 0.5px),
        rgba(100,116,139,0.15) calc(75% + 0.5px),
        transparent calc(75% + 0.5px));
    pointer-events: none;
  }
  .hourbar-col {
    flex: 1 1 0;
    min-width: 0;
    max-width: 22px;
    display: flex; flex-direction: column;
    height: 100%;
    cursor: help;
    position: relative;
  }
  /* Closed-hour bar: muted hatch pattern, no positive/negative segments. */
  .hourbar-col.bar-closed .hourbar-pos,
  .hourbar-col.bar-closed .hourbar-neg {
    background: repeating-linear-gradient(
      45deg,
      rgba(100,116,139,0.18) 0 3px,
      rgba(100,116,139,0.32) 3px 6px);
  }
  .hourbar-col.bar-closed .hourbar-score { color: var(--text-muted); }
  /* Closure-context line below chart legend */
  .hourbars-closures {
    margin-top: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    line-height: 1.4;
  }
  .hourbar-score {
    height: 14px;
    flex: none;
    text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    color: var(--text);
    line-height: 14px;
    font-variant-numeric: tabular-nums;
  }
  .hourbar-score.score-cap { color: var(--red); }
  /* Top half: positives stack UP from axis (column-reverse fills bottom→top
   * inside, anchored to the axis line). */
  .hourbar-pos {
    flex: 1;
    display: flex; flex-direction: column-reverse;
    width: 100%;
    overflow: hidden;
    border-radius: 3px 3px 0 0;
  }
  /* Bottom half: negatives stack DOWN from axis (column fills top→bottom). */
  .hourbar-neg {
    flex: 1;
    display: flex; flex-direction: column;
    width: 100%;
    overflow: hidden;
    border-radius: 0 0 3px 3px;
  }
  .hourbar-col:hover .hourbar-pos,
  .hourbar-col:hover .hourbar-neg { filter: brightness(1.08); }
  .hourbar-col.bar-now .hourbar-pos,
  .hourbar-col.bar-now .hourbar-neg { outline: 2px solid #0f172a; outline-offset: 1px; }
  .hourbar-seg { width: 100%; }
  /* Rank-based shading at HALF saturation (Franz 2026-05-27 LATE).
   * Tailwind blue / red HSL values with saturation × 0.5. Lightness
   * preserved so the rank progression still reads dark→light. */
  .hourbar-seg.pos-rank-1 { background: hsl(224, 32%, 33%); }  /* ≈ blue-900 desat — largest */
  .hourbar-seg.pos-rank-2 { background: hsl(226, 35%, 40%); }  /* ≈ blue-800 desat */
  .hourbar-seg.pos-rank-3 { background: hsl(224, 38%, 48%); }  /* ≈ blue-700 desat */
  .hourbar-seg.pos-rank-4 { background: hsl(221, 42%, 53%); }  /* ≈ blue-600 desat */
  .hourbar-seg.pos-rank-5 { background: hsl(217, 46%, 60%); }  /* ≈ blue-500 desat */
  .hourbar-seg.pos-rank-6,
  .hourbar-seg.pos-rank-7,
  .hourbar-seg.pos-rank-8,
  .hourbar-seg.pos-rank-9,
  .hourbar-seg.pos-rank-10,
  .hourbar-seg.pos-rank-11 { background: hsl(213, 47%, 68%); }  /* ≈ blue-400 desat */
  .hourbar-seg.neg-rank-1 { background: hsl(0, 37%, 42%); }    /* ≈ red-700 desat — largest */
  .hourbar-seg.neg-rank-2 { background: hsl(0, 36%, 51%); }    /* ≈ red-600 desat */
  .hourbar-seg.neg-rank-3 { background: hsl(0, 42%, 60%); }    /* ≈ red-500 desat */
  .hourbar-seg.neg-rank-4 { background: hsl(0, 45%, 71%); }    /* ≈ red-400 desat — smallest */
  /* Cap stripe at top of positive stack when safety gate fires */
  .hourbar-cap-marker {
    background: repeating-linear-gradient(
      45deg, var(--red), var(--red) 3px,
      rgba(127,29,29,1) 3px, rgba(127,29,29,1) 6px);
    height: 3px; width: 100%;
  }
  .hourbar-axis {
    display: flex; justify-content: space-between; gap: 6px; padding: 4px 2px 0;
    font-family: 'DM Mono', monospace;
    font-size: 9px; color: var(--text-muted);
  }
  .hourbar-axis-label {
    flex: 1 1 0; min-width: 0;
    max-width: 22px;
    text-align: center;
    white-space: nowrap; overflow: hidden;
  }
  /* Legend below chart */
  .hourbars-legend {
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--border);
    font-size: 10px;
    color: var(--text-muted);
  }
  .hourbars-legend-group {
    display: flex; align-items: center; gap: 6px;
  }
  .hourbars-legend-group + .hourbars-legend-group { }
  .hourbars-legend-label {
    display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap;
  }
  /* Legend uses per-component emoji icons (chart colors are rank-based
   * per-chart, so a fixed-color swatch doesn't apply). */
  .legend-icon {
    display: inline-block;
    font-size: 12px;
    line-height: 1;
    vertical-align: middle;
    flex: none;
    margin-right: 2px;
  }
  .hourbars-legend-sep {
    color: var(--text-muted);
    opacity: 0.5;
  }
  /* Show every other label on narrow screens so they don't overlap */
  @media (max-width: 480px) {
    .hourbar-axis-label:nth-child(odd) { visibility: hidden; }
  }
  .hourbars-score {
    font-family: 'Outfit', sans-serif;
    font-weight: 700; font-size: 26px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .hourbars-drive {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px;
    background: rgba(0,0,0,0.04);
    padding: 2px 8px; border-radius: 999px;
  }
  .hourbars-gate {
    display: inline-block;
    background: #fee2e2; color: #991b1b;
    font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.05em;
  }

  /* Source-attribution footer (operator-verified / OSM-default) */
  .policy-source {
    margin-top: 10px;
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
  }
  .policy-source a { color: var(--text-muted); }

  /* Verified badge in best-time card */
  .verified-badge {
    display: inline-block;
    background: #d1fae5; color: #15803d;
    font-size: 11px; font-weight: 600;
    padding: 2px 7px; border-radius: 4px;
    margin-top: 6px;
  }

  /* Phone breakpoint */
  @media (max-width: 600px) {
    section.card { padding: 10px 12px; margin: 5px 10px; border-radius: 10px; }
    section.card h2 { font-size: 13px; margin-bottom: 6px; }
    /* Slimmer sticky header on phone */
    header.hero { padding: 14px 14px 10px; gap: 8px; }
    .park-name { font-size: 20px; margin: 0 0 4px; }
    .fit-badge { font-size: 16px; padding: 1px 8px; margin-right: 3px; }
    .park-region { font-size: 13px; margin-left: 0.3em; }

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"

<script>
const SUPABASE_URL = 'https://ehlzbwtrsxaaukurekau.supabase.co';
const ANON_KEY     = 'sb_publishable_lAg7YdZ3w7S5fN8jgiExKQ_3-KtW3xk';

const params = new URLSearchParams(location.search);
const fid = params.get('fid') ?? params.get('dog_park_fid');
const useOnFetch = params.get('onfetch') === '1';

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// Tap-to-pin tooltips for touch devices — CSS :hover doesn't fire on
// touch, so this delegate toggles [data-tip-open] on click. Document-
// level once-attach handles dynamically rendered chart bars too.
document.addEventListener('click', (e) => {
  const target = e.target.closest('[data-tip]');
  // Close any other open tooltip
  document.querySelectorAll('[data-tip-open]').forEach(el => {
    if (el !== target) el.removeAttribute('data-tip-open');
  });
  if (target) {
    // Toggle: tap again closes it
    if (target.hasAttribute('data-tip-open')) target.removeAttribute('data-tip-open');
    else target.setAttribute('data-tip-open', '');
  }
});

// Read sticky user location (set by find.html). Returns {lat, lng} or null.
function _getUserLatLng() {
  try {
    const raw = localStorage.getItem('dogbeach.user_loc');
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (Number.isFinite(obj?.lat) && Number.isFinite(obj?.lng)) {
      return { lat: obj.lat, lng: obj.lng };
    }
  } catch {}
  return null;
}

// Server-side v2 per-hour scoring via Postgres RPC. Returns
// {hours: [{local_hour, hour_label, score, status, ...}], drive_factor, ...}
// or null on error. Powers the vertical hourly bar chart + header badge.
async function _fetchHourlyV2(fid) {
  const loc = _getUserLatLng();
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/compute_dog_park_hourly_v2`, {
      method: 'POST',
      headers: {
        apikey: ANON_KEY,
        Authorization: `Bearer ${ANON_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        p_fid: fid,
        p_user_lat: loc?.lat ?? null,
        p_user_lng: loc?.lng ?? null,
        p_date: null,
      }),
    });
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

async function load() {
  if (!fid || !/^\d+$/.test(fid)) {
    document.getElementById('main-content').innerHTML =
      `<div class="state"><div class="state-icon">⚠️</div><div>No park selected.</div></div>`;
    return;
  }

  let data;
  const endpoint = useOnFetch
    ? `${SUPABASE_URL}/functions/v1/dog-park-onfetch?fid=${fid}`
    : `${SUPABASE_URL}/functions/v1/get-dog-park-summary?fid=${fid}`;
  const t0 = performance.now();
  try {
    const r = await fetch(endpoint,
      { headers: { Authorization: `Bearer ${ANON_KEY}`, apikey: ANON_KEY } });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    data = await r.json();
    if (data.error) throw new Error(data.error);
  } catch (e) {
    document.getElementById('main-content').innerHTML =
      `<div class="state"><div class="state-icon">⚠️</div><div>Failed to load: ${escHtml(e.message)}</div></div>`;
    return;
  }
  if (useOnFetch && data._meta) {
    console.log('[onfetch]', data._meta, `wall=${Math.round(performance.now()-t0)}ms`);
  }
  render(data);
  loadPhotos(fid);
  loadWeather(data);
  // Stash park tz so applyHourlyV2 can compute park-local "now".
  window.__parkTimezone = data.dog_park?.timezone || 'America/Los_Angeles';
  // onfetch returns scout_blurb inline; skip the separate LLM call.
  if (useOnFetch && data.scout_blurb) {
    paintScoutBlurb(data.scout_blurb, data.dog_park);
  } else {
    // Fetch hourly v2 FIRST so the live "best window from now" drives both
    // the headline AND the LLM prompt. Previously loadScoutBlurb fired
    // immediately with today.best_window_label (full-day stored window) and
    // _fetchHourlyV2 only narrowed the headline — leaving a header/blurb
    // mismatch (header "1pm-6pm" but Scout text says "3pm-8pm").
    // Per Franz 2026-06-04: live-refresh drives the headline, NOT the other way around.
    _fetchHourlyV2(fid).then(payload => {
      let liveWindowLabel = null;
      if (payload && !payload.error) {
        applyHourlyV2(payload);
        const parkTz = window.__parkTimezone;
        const nowH = _currentLocalHourDP(parkTz) ?? new Date().getHours();
        const remaining = _bestWindowFromNowV2DP(payload.hours || [], nowH);
        liveWindowLabel = remaining?.label || null;
      }
      loadScoutBlurb(data.dog_park, data.days?.[0], data.now, liveWindowLabel);
    }).catch(err => {
      console.warn('_fetchHourlyV2 failed, falling back to stored window:', err);
      loadScoutBlurb(data.dog_park, data.days?.[0], data.now, null);
    });
  }
  // Cautions card — async fill from dog_park_advisory (mirrors beach pattern).
  loadDogParkAdvisories(fid);
}

// Apply hourly v2: status-colored badge (no number) + vertical bar chart
// for the park's open->close window. Per Franz 2026-05-27 — no numerical
// scores visible in the UI; bars + status color carry the meaning.
function applyHourlyV2(payload) {
  const hours = payload.hours || [];
  if (!hours.length) return;

  // Pick the bar for the current local hour, in the park's timezone
  // (not the browser's). Avoids drift for users viewing parks in other tz.
  const parkTz = window.__parkTimezone || 'America/Los_Angeles';
  const nowH = _currentLocalHourDP(parkTz) ?? new Date().getHours();
  let current = hours.find(h => h.local_hour === nowH);
  if (!current) {
    if (nowH < payload.open_hour) current = hours[0];
    else if (nowH > payload.close_hour) current = hours[hours.length - 1];
    else current = hours[0];
  }
  const score = current?.score ?? 0;

  // If the current hour is closed, override headline with a "Closed right
  // now — reopens at X" message. Otherwise prefer the v2 best-window label.
  // Per Franz 2026-05-28 — hour-level closure honored, day still scored.
  const headlineEl = document.querySelector('.besttime-headline');
  if (headlineEl) {
    const isNowClosed = current?.status === 'closed' || current?.is_closed === true;
    if (isNowClosed) {
      // Find the next open hour today (status != closed, score > 0)
      const idx = hours.findIndex(h => h.local_hour === nowH);
      let reopenLabel = null;
      for (let i = idx + 1; i < hours.length; i++) {
        if (hours[i].status !== 'closed' && !hours[i].is_closed) {
          reopenLabel = hours[i].hour_label;
          break;
        }
      }
      headlineEl.textContent = reopenLabel
        ? `Closed right now — reopens ${reopenLabel}`
        : 'Closed for the rest of today';
    } else if (payload.best_window_v2_label) {
      // Today's stored best_window_v2_label is full-day. Recompute from
      // current park-local hour forward so a 7am view of a "6am-9am"
      // window shows "7am-9am", and a 10am view of a passed window
      // shows "Today's window has passed". Per Franz 2026-05-30:
      // "when looking at the current day, we look only at the current
      // hour forward — true of all location types."
      const remaining = _bestWindowFromNowV2DP(hours, nowH);
      if (remaining?.label) {
        headlineEl.textContent = remaining.label;
      } else {
        headlineEl.textContent = "Today's window has passed";
      }
    } else {
      // No qualifying best window today (e.g. fully-closed day)
      const anyOpen = hours.some(h => h.status !== 'closed' && !h.is_closed);
      headlineEl.textContent = anyOpen ? 'Open today (no clear best window)' : 'Closed today';
    }
  }

  // Header badge — colored chip indicating current-hour status.
  // No number; the color (+ tooltip) carries the meaning.
  const badge = document.querySelector('.fit-badge');
  if (badge) {
    badge.textContent = ''; // hide the number
    const cls = score >= 70 ? 'go' : score >= 40 ? 'caution' : 'no_go';
    badge.className = `fit-badge fit-badge-${cls}`;
    badge.title = `${current?.hour_label || 'now'}: ${cls.replace('_',' ')}${current?.gate_fired ? ' (safety cap)' : ''}`;
  }
  // Render bar chart inside Best-time card
  const target = document.querySelector('.besttime-card');
  if (!target) return;
  target.insertAdjacentHTML('beforeend', renderHourlyBars(payload, nowH));
}

function _currentLocalHourDP(timezone) {
  const tz = timezone || 'America/Los_Angeles';
  try {
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour: '2-digit', hour12: false,
    }).formatToParts(new Date());
    const h = parts.find(p => p.type === 'hour')?.value;
    return h != null ? (parseInt(h, 10) % 24) : null;
  } catch { return null; }
}

// Best contiguous run of open hours from `fromHour` forward. Returns
// { label } or null. Mirrors the SQL _find_best_window_v2 picker but
// operates on the v2 hourly payload.
function _bestWindowFromNowV2DP(hours, fromHour) {
  if (!Array.isArray(hours) || hours.length === 0) return null;
  const eligible = hours
    .filter(h =>
      typeof h.local_hour === 'number'
      && h.local_hour >= fromHour
      && h.status !== 'closed'
      && h.is_closed !== true
      && Number.isFinite(Number(h.score)))
    .sort((a, b) => a.local_hour - b.local_hour);
  if (eligible.length < 2) return null;
  const runs = [];
  let cur = [eligible[0]];
  for (let i = 1; i < eligible.length; i++) {
    if (eligible[i].local_hour === cur[cur.length - 1].local_hour + 1) {
      cur.push(eligible[i]);
    } else {
      if (cur.length >= 2) runs.push(cur);
      cur = [eligible[i]];
    }
  }
  if (cur.length >= 2) runs.push(cur);
  if (runs.length === 0) return null;
  const MAX_LEN = 5;
  let best = null;
  for (const run of runs) {
    if (run.length <= MAX_LEN) {
      const avg = run.reduce((s, h) => s + Number(h.score), 0) / run.length;
      if (!best || avg > best.avg) best = { slice: run, avg };
    } else {
      for (let i = 0; i + MAX_LEN <= run.length; i++) {
        const slice = run.slice(i, i + MAX_LEN);
        const avg = slice.reduce((s, h) => s + Number(h.score), 0) / slice.length;
        if (!best || avg > best.avg) best = { slice, avg };
      }
    }
  }
  if (!best) return null;
  const startHour = best.slice[0].local_hour;
  const endHour = best.slice[best.slice.length - 1].local_hour;
  const fmt = h => {
    if (h === 0) return '12am';
    if (h === 12) return '12pm';
    return h < 12 ? `${h}am` : `${h - 12}pm`;
  };
  return { label: `${fmt(startHour)}–${fmt((endHour + 1) % 24)}` };
}


function renderHourlyBars(p, nowH) {
  // Tug-of-war chart: positives stack UP from a center axis, negatives
  // stack DOWN. Each point of any bucket = 1% contribution to the final
  // 0-100 score (tooltips read in %). Scale is DYNAMIC per chart —
  // nice-ceiled to the day's actual max so a mild-day chart zooms in
  // instead of looking tiny vs the 50-pt absolute cap.
  const hours = p.hours || [];
  let maxPos = 0, maxNeg = 0;
  for (const h of hours) {
    const drivePos = Math.max(0, h.drive || 0);
    const driveNeg = Math.max(0, -(h.drive || 0));
    const posTotal = (h.pos_fence || 0) + (h.pos_water || 0) + (h.pos_shade || 0)
                   + (h.pos_comfort || 0) + (h.pos_agility || 0) + (h.pos_water_play || 0)
                   + (h.pos_temp || 0) + (h.pos_wind || 0) + (h.pos_sky || 0)
                   + (h.pos_window || 0) + drivePos;
    const negTotal = (h.neg_heat_uv || 0) + (h.neg_harsh || 0) + (h.neg_gotchas || 0) + driveNeg;
    if (posTotal > maxPos) maxPos = posTotal;
    if (negTotal > maxNeg) maxNeg = negTotal;
  }
  // Nice-ceil to a 5-step boundary, floor at 10 so a flat-zero day
  // still has a usable scale. Both halves share the same scale so the
  // visual axis is symmetric (Franz 2026-05-27 LATE).
  const niceCeil = v => Math.max(10, Math.ceil(v * 1.1 / 5) * 5);
  const AXIS_MAX = niceCeil(Math.max(maxPos, maxNeg));
  const POS_MAX = AXIS_MAX;
  const NEG_MAX = AXIS_MAX;

  const cols = hours.map(h => {
    const drivePos = Math.max(0, h.drive || 0);
    const driveNeg = Math.max(0, -(h.drive || 0));

    // Component icons — used in BOTH chart-segment data attribute and tooltip.
    // Positives green, negatives red (Franz 2026-05-27 LATE).
    const POS_DEFS = [
      { cls: 'seg-fence',      icon: '🚧', val: h.pos_fence      || 0 },
      { cls: 'seg-water',      icon: '💧', val: h.pos_water      || 0 },
      { cls: 'seg-shade',      icon: '🌳', val: h.pos_shade      || 0 },
      { cls: 'seg-comfort',    icon: '🌿', val: h.pos_comfort    || 0 },
      { cls: 'seg-agility',    icon: '🤸', val: h.pos_agility    || 0 },
      { cls: 'seg-water-play', icon: '💦', val: h.pos_water_play || 0 },
      { cls: 'seg-temp',       icon: '🌡️', val: h.pos_temp       || 0 },
      { cls: 'seg-wind',       icon: '💨', val: h.pos_wind       || 0 },
      { cls: 'seg-sky',        icon: '☀️', val: h.pos_sky        || 0 },
      { cls: 'seg-window',     icon: '⏰', val: h.pos_window     || 0 },
      { cls: 'seg-drive',      icon: '🚗', val: drivePos },
    ];
    const NEG_DEFS = [
      { cls: 'seg-heat_uv',    icon: '🔥', val: h.neg_heat_uv || 0 },
      { cls: 'seg-harsh',      icon: '⛈️', val: h.neg_harsh   || 0 },
      { cls: 'seg-gotchas',    icon: '⚠️', val: h.neg_gotchas || 0 },
      { cls: 'seg-drive-neg',  icon: '🚗', val: driveNeg },
    ];
    // Sort by abs(value) desc — rank-1 = largest contribution this chart,
    // gets the darkest shade. Identity is conveyed by tooltip icon, not color.
    const posSorted = POS_DEFS.filter(d => d.val > 0).sort((a, b) => b.val - a.val);
    const negSorted = NEG_DEFS.filter(d => d.val > 0).sort((a, b) => b.val - a.val);
    posSorted.forEach((d, i) => { d.rank = i + 1; });
    negSorted.forEach((d, i) => { d.rank = i + 1; });

    // VISUAL ORDER (reversed per Franz 2026-05-27 LATE): largest contribution
    // sits CLOSEST TO THE AXIS, smaller contributions float to the outer
    // edges. Reading from outer edge inward, both halves go small → large.
    //   posHtml: column-reverse means first HTML child lands at the BOTTOM
    //     of positive stack (= closest to axis). So we put largest FIRST
    //     in HTML (posSorted is already largest-first).
    //   negHtml: column means first HTML child lands at TOP of negative
    //     stack (= closest to axis). Largest first too.
    const posHtml = posSorted
      .map(d => `<div class="hourbar-seg pos-rank-${d.rank}" style="height:${(d.val / POS_MAX * 100).toFixed(1)}%"></div>`)
      .join('');
    const negHtml = negSorted
      .map(d => `<div class="hourbar-seg neg-rank-${d.rank}" style="height:${(d.val / NEG_MAX * 100).toFixed(1)}%"></div>`)
      .join('');

    const capMarker = h.gate_fired
      ? `<div class="hourbar-cap-marker"></div>` : '';
    const isNow = h.local_hour === nowH ? ' bar-now' : '';

    // Tooltip — header + icon-and-value lines. Mirrors the chart.
    const tipLines = [];
    if (h.status === 'closed' || h.is_closed === true) {
      tipLines.push(`${h.hour_label} · 🚧 closed`);
    } else {
      tipLines.push(`${h.hour_label}${h.gate_fired ? ' ⚠️ cap' : ''} · ${h.score ?? 0}`);
      for (const d of [...posSorted].reverse()) tipLines.push(`${d.icon} +${d.val}%`);
      for (const d of negSorted) tipLines.push(`${d.icon} −${d.val}%`);
    }
    const tip = tipLines.join('\n');

    const isClosed = h.status === 'closed' || h.is_closed === true;
    const closedClass = isClosed ? ' bar-closed' : '';
    const scoreClass = h.gate_fired ? 'hourbar-score score-cap' : 'hourbar-score';
    const scoreText = isClosed ? '' : (h.score != null ? h.score : '');
    return `<div class="hourbar-col${isNow}${closedClass}" data-tip="${escHtml(tip)}">
      <div class="${scoreClass}">${scoreText}</div>
      <div class="hourbar-pos">${isClosed ? '' : capMarker + posHtml}</div>
      <div class="hourbar-neg">${isClosed ? '' : negHtml}</div>
    </div>`;
  }).join('');

  const labels = (p.hours || []).map(h =>
    `<div class="hourbar-axis-label">${escHtml(h.hour_label)}</div>`
  ).join('');

  const driveBadge = p.drive_minutes != null
    ? `<span class="hourbars-drive">🚗 ${p.drive_minutes}min ${p.drive_factor >= 0 ? '+' : ''}${p.drive_factor}</span>`
    : '';
  const anyGate = hours.some(h => h.gate_fired);
  const gateBadge = anyGate
    ? `<span class="hourbars-gate" title="One or more hours hit a safety cap">cap ${30}</span>`
    : '';

  // Legend — only show segments that appear at least once in the rendered chart.
  const hasPos = (k) => hours.some(h => (h[k] || 0) > 0);
  const hasDrivePos = hours.some(h => (h.drive || 0) > 0);
  const hasDriveNeg = hours.some(h => (h.drive || 0) < 0);
  const posItems = [
    { icon: '🚧', label: 'fence',       show: hasPos('pos_fence') },
    { icon: '💧', label: 'water',       show: hasPos('pos_water') },
    { icon: '🌳', label: 'shade',       show: hasPos('pos_shade') },
    { icon: '🌿', label: 'comfort',     show: hasPos('pos_comfort') },
    { icon: '🤸', label: 'agility',     show: hasPos('pos_agility') },
    { icon: '💦', label: 'water play',  show: hasPos('pos_water_play') },
    { icon: '🌡️', label: 'temp',        show: hasPos('pos_temp') },
    { icon: '💨', label: 'wind',        show: hasPos('pos_wind') },
    { icon: '☀️', label: 'sky',         show: hasPos('pos_sky') },
    { icon: '⏰', label: 'window',      show: hasPos('pos_window') },
    { icon: '🚗', label: 'short drive', show: hasDrivePos },
  ].filter(x => x.show);
  const negItems = [
    { icon: '🔥', label: 'heat / UV',   show: hasPos('neg_heat_uv') },
    { icon: '⛈️', label: 'harsh wx',    show: hasPos('neg_harsh') },
    { icon: '⚠️', label: 'gotchas',     show: hasPos('neg_gotchas') },
    { icon: '🚗', label: 'long drive',  show: hasDriveNeg },
  ].filter(x => x.show);
  const legendChip = (icon, label) =>
    `<span class="hourbars-legend-label"><span class="legend-icon">${icon}</span>${label}</span>`;
  const posLegend = posItems.map(i => legendChip(i.icon, i.label)).join('');
  const negLegend = negItems.map(i => legendChip(i.icon, i.label)).join('');
  const legendHtml = (posItems.length || negItems.length)
    ? `<div class="hourbars-legend">
        ${posItems.length ? `<div class="hourbars-legend-group">+ ${posLegend}</div>` : ''}
        ${(posItems.length && negItems.length) ? `<span class="hourbars-legend-sep">·</span>` : ''}
        ${negItems.length ? `<div class="hourbars-legend-group">− ${negLegend}</div>` : ''}
       </div>`
    : '';

  // Closure context — single line(s) listing recurring closures, rendered
  // below the legend so users see the constraint without it gating the
  // chart. Handles all 4 closure kinds + optional seasonal MM-DD scope.
  // Per Franz 2026-05-28.
  const closures = Array.isArray(p.closures) ? p.closures : [];
  const closureLines = closures.map(formatClosureLine).filter(Boolean);
  const closuresHtml = closureLines.length
    ? `<div class="hourbars-closures">${closureLines.map(l => `<div>${escHtml(l)}</div>`).join('')}</div>`
    : '';

  return `<div class="hourbars-wrap">
    <div class="hourbars-meta">
      <span>Hourly score · open ${formatHour(p.open_hour)} – ${formatHour(p.close_hour)}</span>
      <span>${driveBadge} ${gateBadge}</span>
    </div>
    <div class="hourbars-chart">
      <div class="hourbars-yaxis">
        <span class="hourbars-yaxis-top">+${POS_MAX}%</span>
        <span class="hourbars-yaxis-mid">+${Math.round(POS_MAX / 2)}%</span>
        <span class="hourbars-yaxis-zero">0</span>
        <span class="hourbars-yaxis-neg-mid">−${Math.round(NEG_MAX / 2)}%</span>
        <span class="hourbars-yaxis-bot">−${NEG_MAX}%</span>
      </div>
      <div class="hourbars-track">${cols}</div>
    </div>
    <div class="hourbar-axis">${labels}</div>
    ${legendHtml}
    ${closuresHtml}
  </div>`;
}

function formatHour(h) {
  if (h == null) return '';
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = ((h + 11) % 12) + 1;
  return `${h12}${ampm}`;
}

// Render one closures-jsonb entry as a human-readable line. Handles all
// four kinds (weekly, weekly_time, daily_all, daily_time) and optional
// seasonal scope (season_from_md/season_to_md or season_label). Shared
// between dog-park and beach chart rendering.
function formatClosureLine(c) {
  if (!c || !c.kind) return null;
  const DAY = { mon:'Mon', tue:'Tue', wed:'Wed', thu:'Thu', fri:'Fri', sat:'Sat', sun:'Sun' };
  const MON = { '01':'Jan','02':'Feb','03':'Mar','04':'Apr','05':'May','06':'Jun',
                '07':'Jul','08':'Aug','09':'Sep','10':'Oct','11':'Nov','12':'Dec' };
  const fmtTime = (t) => {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    const ampm = h >= 12 ? 'pm' : 'am';
    const h12 = ((h + 11) % 12) + 1;
    return m === 0 ? `${h12}${ampm}` : `${h12}:${String(m).padStart(2,'0')}${ampm}`;
  };
  const fmtMd = (md) => {
    if (!md) return '';
    const [m, d] = md.split('-');
    return `${MON[m] || m} ${parseInt(d, 10)}`;
  };
  // Section-aware verbs: sand-only closures say "off-limits", whole-location
  // closures say "Closed". section='global' or absent → "Closed".
  const section = (c.section || '').toLowerCase();
  const SECTION_NOUN = {
    sand: 'Sand', water: 'Water', water_play: 'Water play',
    playground: 'Playground', picnic_area: 'Picnic area',
  };
  const sectionNoun = SECTION_NOUN[section];   // null if unknown / global
  const verb_open = sectionNoun ? `${sectionNoun} off-limits` : 'Closed';
  const reason = c.reason ? c.reason.replace(/_/g, ' ') : '';
  const reasonClause = reason ? ` for ${reason}` : '';
  const seasonClause = c.season_label
    ? ` · ${c.season_label}`
    : (c.season_from_md && c.season_to_md
        ? ` · ${fmtMd(c.season_from_md)}–${fmtMd(c.season_to_md)}`
        : '');

  if (c.kind === 'weekly') {
    return `🚧 ${verb_open} ${DAY[(c.weekday||'').toLowerCase()] || '?'}${reasonClause}${seasonClause}`;
  }
  if (c.kind === 'weekly_time') {
    return `🚧 ${verb_open} ${DAY[(c.weekday||'').toLowerCase()] || '?'} ${fmtTime(c.start)}–${fmtTime(c.end)}${reasonClause}${seasonClause}`;
  }
  if (c.kind === 'daily_all') {
    if (c.season_label) return `🚧 ${sectionNoun ? `${sectionNoun}: ` : ''}${c.season_label}`;
    if (!seasonClause) {
      if (reason) return `🚧 ${reason.charAt(0).toUpperCase() + reason.slice(1)}`;
      return sectionNoun ? `🚧 ${sectionNoun} off-limits` : '🚧 Closed';
    }
    return `🚧 ${sectionNoun || 'Dogs prohibited'}${seasonClause}`;
  }
  if (c.kind === 'daily_time') {
    if (c.season_label) return `🚧 ${sectionNoun ? `${sectionNoun}: ` : ''}${c.season_label}`;
    return `🚧 ${verb_open} daily ${fmtTime(c.start)}–${fmtTime(c.end)}${seasonClause || reasonClause}`;
  }
  return null;
}

// Render a pre-fetched Scout blurb (from dog-park-onfetch). Mirrors
// the tail of loadScoutBlurb (markdown bold + CTA).
function paintScoutBlurb(answer, park) {
  const el = document.getElementById('scout-blurb');
  if (!el) return;
  const safe = escHtml(answer || '');
  el.innerHTML = safe.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
  el.classList.add('loaded');
  _renderScoutCTA(park);
}

function render(data) {
  const park = data.dog_park;
  // Edge function returns latitude/longitude; alias to lat/lng so the
  // verbatim beach.html initMap works without renaming.
  if (park.lat == null && park.latitude != null) park.lat = park.latitude;
  if (park.lng == null && park.longitude != null) park.lng = park.longitude;
  const days = data.days || [];
  const now  = data.now;
  const today = days[0];
  document.title = `${park.display_name} — Dog Beach Scout`;

  // Header: park name + fit badge + region. Badge starts with a
  // placeholder ("--") and gets updated by applyScoreV2() once the RPC
  // returns the real v2 score.
  const nameEl = document.getElementById('park-name');
  nameEl.textContent = '';
  const badge = document.createElement('span');
  badge.className = 'fit-badge fit-badge-caution';
  badge.textContent = '··';
  badge.title = 'Loading score...';
  nameEl.appendChild(badge);
  nameEl.appendChild(document.createTextNode(' ' + park.display_name));
  const regionParts = [];
  if (park.county_name) regionParts.push(park.county_name);
  if (park.state) regionParts.push(park.state);
  if (regionParts.length) {
    const span = document.createElement('span');
    span.className = 'park-region';
    span.textContent = regionParts.join(' · ');
    nameEl.appendChild(span);
  }

  // LEFT RAIL: amenities, cautions, hours, weather
  const left = [];
  left.push(buildAmenitiesSection(park));
  const cautionsHtml = buildCautionsSection(now, today, park);
  if (cautionsHtml) left.push(cautionsHtml);
  left.push(buildHoursSection(park));
  left.push(buildWeatherSection());
  document.getElementById('left-rail').innerHTML = left.filter(Boolean).join('');

  // MAIN: overview, photo+map, scout/best-time, packlist, details, links
  const main = [];
  main.push(buildOverviewBlurb(park));
  const hasMap = park.lat != null && park.lng != null;
  // Photo block is mounted async; reserve the photo column either way so
  // the layout doesn't shift when photos arrive.
  const photoCol = '<div class="photo-block-wrap pm-photo-col" id="photo-block-mount"></div>';
  const mapCol = hasMap ? '<div class="pm-map-col"><div id="map"></div></div>' : '';
  main.push(`<div class="photo-map-row">${photoCol}${mapCol}</div>`);
  main.push(buildScoutCard(park, now, today));
  main.push(buildPackListCard(park, now, today));
  main.push(buildDetailsSection(park));
  main.push(buildLinksSection(park));
  document.getElementById('main-content').innerHTML = main.filter(Boolean).join('');

  if (hasMap) initMap(park);

  // Bind caution-tile click handlers
  document.querySelectorAll('.caution-tile').forEach(tile => {
    tile.addEventListener('click', () => {
      const open = tile.getAttribute('aria-expanded') === 'true';
      document.querySelectorAll('.caution-tile').forEach(t => t.setAttribute('aria-expanded', 'false'));
      const detail = document.getElementById('caution-detail');
      if (open) {
        if (detail) detail.hidden = true;
      } else {
        tile.setAttribute('aria-expanded', 'true');
        if (detail) {
          detail.hidden = false;
          detail.textContent = tile.dataset.detail || '';
        }
      }
    });
  });
}

function buildAmenitiesSection(park) {
  const pol = park.policy ?? {};
  const tiles = [];

  // Off-leash is definitional
  tiles.push(amenityTile('🐕', 'Off-leash', 'rule-off_leash'));

  // Fence
  const fence = pol.has_fence ?? park.has_fence;
  if (fence === true) tiles.push(amenityTile('🚧', 'Fenced', 'rule-off_leash'));
  else if (fence === false) tiles.push(amenityTile('⚠️', 'Unfenced', 'rule-on_leash'));

  // Water
  const water = pol.has_drinking_water ?? park.has_drinking_water;
  if (water === true) tiles.push(amenityTile('💧', 'Water', 'rule-off_leash'));
  else if (water === false) tiles.push(amenityTile('🚱', 'No water', 'rule-on_leash'));

  // Double-gate (airlock entry — major safety feature)
  if (pol.double_gate === true) tiles.push(amenityTile('🚪', 'Double-gate', 'rule-off_leash'));

  // Dog areas
  if (pol.small_dog_area === true) tiles.push(amenityTile('🐶', 'Small-dog area', 'rule-off_leash'));
  if (pol.large_dog_area === true) tiles.push(amenityTile('🐕‍🦺', 'Large-dog area', 'rule-off_leash'));

  // Lighting
  if (pol.lighting === true) tiles.push(amenityTile('💡', 'Lighting', 'rule-off_leash'));

  // v2 enrichment / comfort amenities (Franz 2026-05-27 LATE)
  if (pol.has_shade === true)         tiles.push(amenityTile('🌳', 'Shade',         'rule-off_leash'));
  if (pol.has_agility === true)       tiles.push(amenityTile('🤸', 'Agility',       'rule-off_leash'));
  if (pol.has_water_play === true)    tiles.push(amenityTile('💦', 'Splash pad',    'rule-off_leash'));
  if (pol.has_picnic_tables === true) tiles.push(amenityTile('🧺', 'Picnic tables', 'rule-off_leash'));

  // Surface
  const surface = pol.surface_overlay ?? park.surface;
  if (surface) tiles.push(amenityTile('🌱', surface, ''));

  // Area
  if (park.area_m2) {
    const acres = (park.area_m2 * 0.000247).toFixed(1);
    tiles.push(amenityTile('📐', `${acres} acres`, ''));
  }

  return `<section class="card amenities-card"><h2>Amenities</h2>
    <div class="amenity-grid">${tiles.join('')}</div></section>`;
}

function amenityTile(icon, label, ruleClass, sub) {
  const cls = ruleClass ? `amenity ${ruleClass}` : 'amenity';

  return `<div class="${cls}">
    <span class="amenity-icon">${icon}</span>
    <div class="amenity-text">

}

// Async loader that fetches active+upcoming advisories from
// dog_park_advisory and appends to the existing Cautions card. Mirrors
// beach.html's loadWaterConditionAdvisories pattern exactly so the
// look/placement/interaction is identical between beach.html and
// dog-park.html. Direct PostgREST select (no RPC wrapper) — RLS allows
// anon SELECT on dog_park_advisory.
async function loadDogParkAdvisories(parkFid) {
  const card = document.querySelector('.cautions-card');
  if (!card) return;
  let items = [];
  try {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/dog_park_advisory`
        + `?select=event_type,severity,label,value,icon,dog_impact_text,valid_from,valid_to`
        + `&dog_park_fid=eq.${parseInt(parkFid, 10)}`
        + `&valid_to=gt.${new Date().toISOString()}`
        + `&order=severity.asc`,
      { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` } }
    );
    if (!r.ok) return;
    items = await r.json();
  } catch { return; }

  // Next-24h horizon (NOT today-only as beach does). Dog parks are
  // drive-to-destination — tomorrow morning's "Hot car 95°F" forecast
  // is exactly what a user planning their evening or next-day visit
  // needs to see. Beach decision 2026-05-19 was today-only; dog parks
  // intentionally diverge here. Filter drops only advisories that start
  // > 24h out (anything further is too speculative).
  if (Array.isArray(items)) {
    const horizon = Date.now() + 24 * 3600 * 1000;
    items = items.filter(a => {
      if (!a.valid_from) return true;
      const from = new Date(a.valid_from).getTime();
      return isNaN(from) || from <= horizon;
    });
  }
  if (!Array.isArray(items) || items.length === 0) {
    card.style.display = 'none';
    return;
  }
  card.style.display = '';

  const sevToClass = {
    extreme: 'sev-no_go',   severe: 'sev-no_go',
    moderate: 'sev-caution', minor: 'sev-advisory',
  };

  const tiles = items.map((a, i) => {
    const cls    = sevToClass[a.severity] || 'sev-caution';
    const icon   = a.icon || '⚠️';
    const label  = a.label || a.event_type || 'Advisory';
    const window = _formatDPAdvisoryWindow(a.valid_from, a.valid_to);
    const sub    = window ? `<span class="amenity-sub">${escHtml(window)}</span>` : '';
    return `<button type="button" class="caution-tile ${cls}"
                    data-cidx="${i}" aria-expanded="false">
      <span class="amenity-icon">${icon}</span>
      <span class="amenity-text">
        <span class="amenity-label">${escHtml(label)}</span>
        ${sub}
      </span>
    </button>`;
  }).join('');

  card.innerHTML = `<h2>Cautions</h2>
    <div class="caution-grid">${tiles}</div>
    <div class="caution-detail" id="caution-detail" hidden></div>`;

  const grid   = card.querySelector('.caution-grid');
  const detail = card.querySelector('#caution-detail');
  grid.addEventListener('click', (e) => {
    const btn = e.target.closest('.caution-tile');
    if (!btn) return;
    const wasOpen = btn.getAttribute('aria-expanded') === 'true';
    grid.querySelectorAll('.caution-tile[aria-expanded="true"]')
        .forEach(t => t.setAttribute('aria-expanded', 'false'));
    if (wasOpen) {
      detail.hidden = true;
      detail.innerHTML = '';
      return;
    }
    btn.setAttribute('aria-expanded', 'true');
    const a = items[parseInt(btn.dataset.cidx, 10)];
    const text = a.dog_impact_text || a.label || a.event_type || '';
    const value = a.value || a.event_type || '';
    const window = _formatDPAdvisoryWindow(a.valid_from, a.valid_to);
    detail.innerHTML = `
      <div style="font-weight:600; margin-bottom:2px;">
        ${escHtml(a.label || a.event_type || 'Advisory')}
        ${value ? `<span style="font-weight:500; color:var(--text-muted); margin-left:6px;">${escHtml(value)}</span>` : ''}
      </div>
      <div>${escHtml(text)}</div>
      ${window ? `<div style="margin-top:4px; color:var(--text-muted); font-size:11px;">${escHtml(window)}</div>` : ''}`;
    detail.hidden = false;
  });
}

// Friendly time-window for a dog_park_advisory row. Mirrors beach's
// _formatAdvisoryWindow. Suppresses very long windows (static "Unfenced"
// advisory's 1-year valid_to would otherwise read as a garish date).
function _formatDPAdvisoryWindow(fromIso, toIso) {
  if (!toIso) return '';
  const to = new Date(toIso);
  const from = fromIso ? new Date(fromIso) : null;
  if (isNaN(to.getTime())) return '';
  const now = new Date();
  // Multi-day-spanning static advisory → no window label
  if (from && (to.getTime() - from.getTime()) > 7 * 86400000) return '';
  const fmtT = d => {
    const h = d.getHours(); const m = d.getMinutes();
    const ap = h >= 12 ? 'pm' : 'am';
    const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
    return m ? `${h12}:${String(m).padStart(2,'0')}${ap}` : `${h12}${ap}`;
  };
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  const dayLabel = d => sameDay(d, now) ? 'today'
                    : sameDay(d, new Date(now.getTime() + 86400000)) ? 'tomorrow'
                    : d.toLocaleDateString(undefined, { weekday: 'short' });
  if (from && from <= now) {
    return sameDay(to, now) ? `Until ${fmtT(to)}` : `Until ${dayLabel(to)} ${fmtT(to)}`;
  }
  if (from && sameDay(from, to)) {
    return `${fmtT(from)}–${fmtT(to)}`;
  }
  return '';
}

function buildHoursSection(park) {

function formatTime(t) {
  // "06:00:00" → "6am", "19:30:00" → "7:30pm"
  if (!t) return '';
  const [hRaw, mRaw] = String(t).split(':');
  const h = parseInt(hRaw, 10);
  const m = parseInt(mRaw, 10);
  const ampm = h >= 12 ? 'pm' : 'am';
  const h12 = ((h + 11) % 12) + 1;
  return m ? `${h12}:${String(m).padStart(2,'0')}${ampm}` : `${h12}${ampm}`;
}

function buildWeatherSection() {
  return `<section class="card weather-card"><h2>Weather</h2>
    <div id="weather-mount" class="weather-loading">Loading conditions…</div></section>`;
}

async function loadWeather(data) {
  const mount = document.getElementById('weather-mount');
  if (!mount) return;
  const now = data.now;
  if (!now) {
    mount.innerHTML = '<div class="weather-loading">No live conditions for this park.</div>';
    return;
  }
  const icon = weatherIconFromCode(now.weather_code);
  const chips = [];
  if (now.feels_like != null) chips.push(`<span class="weather-chip">🌡️ ${Math.round(now.feels_like)}°F</span>`);
  if (now.wind_speed != null) chips.push(`<span class="weather-chip">💨 ${Math.round(now.wind_speed)}mph</span>`);
  if (now.uv_index != null)   chips.push(`<span class="weather-chip">☀️ UV ${now.uv_index.toFixed(0)}</span>`);
  if (now.precip_prob != null && now.precip_prob >= 30) chips.push(`<span class="weather-chip">☔ ${Math.round(now.precip_prob)}%</span>`);
  if (now.asphalt_temp != null && now.asphalt_temp >= 105) chips.push(`<span class="weather-chip">🐾 ${Math.round(now.asphalt_temp)}°F</span>`);
  mount.innerHTML = `<div class="weather-now">
    <div class="weather-now-cond">${icon}</div>
    <div class="weather-chips">${chips.join('')}</div>
  </div>`;
}

function weatherIconFromCode(code) {
  // Open-Meteo WMO weather codes
  if (code == null) return '🌤️';
  if (code === 0) return '☀️';
  if (code <= 3) return '🌤️';
  if (code <= 48) return '🌫️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '🌨️';
  if (code <= 82) return '🌧️';
  if (code <= 99) return '⛈️';
  return '🌤️';
}

function buildOverviewBlurb(park) {

function buildScoutCard(park, now, today) {

// Async-fill the Scout narrative via dog-park-chat. Mirrors beach.html's
// loadScoutBlurb. Same markdown-bold rendering, same CTA wiring.
//
// liveWindowOverride: the live "best window from now" computed from the
// hourly v2 payload — supersedes today.best_window_label (which is the
// full-day stored window). Caller should fetch hourly v2 first and pass
// the narrowed window so the LLM sees the same value as the headline.
async function loadScoutBlurb(park, today, now, liveWindowOverride) {
  const el = document.getElementById('scout-blurb');
  if (!el) return;
  // No v1-status short-circuit — the v1 hour_status frequently disagrees
  // with v2 scoring (e.g. v1='no_go' on a 70-scoring hour). The chat LLM
  // has the full current conditions + bands in its system prompt and can
  // frame appropriately (cautious vs upbeat). Per Franz 2026-05-27 LATE.
  const status = (now?.hour_status_v2 ?? now?.hour_status)
              ?? (today?.day_status_v2 ?? today?.day_status);
  const window = liveWindowOverride
    || today?.best_window_label
    || (status === 'go' ? 'right now' : 'during operating hours');
  const question = `Write the Scout intro paragraph for visiting this dog park today. The best time window is '${window}'. Use this EXACT window verbatim in your paragraph — do NOT generate or substitute a different time range. Weave '${window}' naturally into the prose (e.g. "${window} is your window", "hit it ${window}", "${window} is firing"). No need to bold it; the headline above already styles the window.`;
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/dog-park-chat`, {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${ANON_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        dog_park_fid: park.fid,
        question,
        conversation_history: [],
      }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const { answer } = await r.json();
    const safe = escHtml(answer || '');
    el.innerHTML = safe.replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
    el.classList.add('loaded');
  } catch (e) {
    console.warn('scout blurb fetch failed:', e);
    el.textContent = '';
  }
  _renderScoutCTA(park);
}

// CTA — Wanna go? Drive ~XX min. + Friends button + Get directions.
// Drive minutes filled in from cached/qs user location (no auto-prompt).
async function _renderScoutCTA(park) {
  const ctaEl = document.getElementById('scout-cta');
  if (!ctaEl || park.lat == null || park.lng == null) return;
  const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${park.lat},${park.lng}`;
  const friendsBtn = `<button class="scout-cta-btn scout-cta-btn-friends" type="button" data-friends-share="1">🐾 Let Friends Know</button>`;
  const dirsBtn = `<a class="scout-cta-btn" href="${escHtml(mapsUrl)}" target="_blank" rel="noopener">Get directions →</a>`;
  const actions = `<div class="scout-cta-actions">${friendsBtn}${dirsBtn}</div>`;
  const setHtml = (txt) => {
    ctaEl.innerHTML = `<span class="scout-cta-text">${txt}</span>${actions}`;
    const btn = ctaEl.querySelector('[data-friends-share]');
    if (btn) btn.addEventListener('click', () => _shareFriendsPlan(park));
  };
  setHtml('Wanna go?');
  const user = await _getUserLocation();
  if (!user) return;
  const minutes = _estimateDriveMinutes(user, park);
  if (!Number.isFinite(minutes) || minutes <= 0) return;
  setHtml(`Wanna go? Drive ~${minutes} min.`);
}

async function _shareFriendsPlan(park) {
  const url = location.href;
  const title = `${park.display_name || park.name || 'Dog Park'} — Dog Beach Scout`;
  const text  = `Heading to ${park.display_name || park.name || 'the dog park'} today.`;
  if (navigator.share) {
    try { await navigator.share({ title, text, url }); return; } catch {}
  }
  try {
    await navigator.clipboard.writeText(url);
    const btn = document.querySelector('#scout-cta [data-friends-share]');
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = '🐾 Link copied';
      setTimeout(() => { btn.textContent = orig; }, 1600);
    }
  } catch {}
}

function _haversineMiles(a, b) {
  const R = 3958.8;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const s = Math.sin(dLat/2)**2 + Math.sin(dLng/2)**2 * Math.cos(lat1) * Math.cos(lat2);
  return 2 * R * Math.asin(Math.sqrt(s));
}
function _estimateDriveMinutes(user, park) {
  const miles = _haversineMiles(user, { lat: park.lat, lng: park.lng });
  return Math.round(miles * 1.8);
}
async function _getUserLocation() {
  const qp = new URLSearchParams(location.search);
  const ulat = parseFloat(qp.get('user_lat'));
  const ulng = parseFloat(qp.get('user_lng'));
  if (Number.isFinite(ulat) && Number.isFinite(ulng)) return { lat: ulat, lng: ulng };
  try {
    const raw = localStorage.getItem('dogbeach.user_loc');
    if (raw) {
      const cached = JSON.parse(raw);
      if (cached && Number.isFinite(cached.lat) && Number.isFinite(cached.lng)) return cached;
    }
  } catch {}
  return null;
}

function buildPackListCard(park, now, today) {
  const pol = park.policy ?? {};
  const chips = [];

  // Always
  chips.push(packChip('💩', 'Poop bags', 'Pack out what comes out.'));

  // Water — bring if no fountain on site
  const water = pol.has_drinking_water ?? park.has_drinking_water;
  if (water !== true) {
    chips.push(packChip('💧', 'Water bottle', 'No fountain on site.'));
  }

  // Heat-driven items
  if (now?.asphalt_temp != null && now.asphalt_temp >= 105) {
    chips.push(packChip('🐾', 'Paw protection', `Pavement ~${Math.round(now.asphalt_temp)}°F — booties or stick to grass.`));
  }
  if (now?.uv_index != null && now.uv_index >= 8) {
    chips.push(packChip('🕶️', 'Shade', `UV ${now.uv_index.toFixed(1)} — bring something to throw shade.`));
  }
  if (now?.feels_like != null && now.feels_like >= 90) {
    chips.push(packChip('🧊', 'Cooling towel', `Feels like ${Math.round(now.feels_like)}°F.`));
  }
  if (now?.feels_like != null && now.feels_like < 40) {
    chips.push(packChip('🧥', 'Coat (short-hair dogs)', `Feels like ${Math.round(now.feels_like)}°F.`));
  }

  // Safety
  const fence = pol.has_fence ?? park.has_fence;
  if (fence === false) {
    chips.push(packChip('🧷', 'Long line', 'Park is unfenced — recall backup.'));
  }

  // Fun
  chips.push(packChip('🎾', 'A favorite toy', 'Always.'));

  return `<section class="card packlist-card"><h2>Pack list</h2>
    <div class="packlist-chips">${chips.join('')}</div></section>`;
}

function packChip(icon, label, tip) {
  return `<span class="packlist-chip" data-tip="${escHtml(tip)}">
    <span class="packlist-icon">${icon}</span>
    <span class="packlist-label">${escHtml(label)}</span>
  </span>`;
}

function buildDetailsSection(park) {
  const pol = park.policy ?? {};
  const rules = pol.additional_rules;
  if (!rules) return '';
  return `<section class="card details-card">
    <h2>Posted rules</h2>
    <div class="details-prose">${escHtml(rules)}</div>
  </section>`;
}

function buildLinksSection(park) {
  const pol = park.policy ?? {};
  const links = [];

  const opUrl = park.operator?.web_url || park.website;
  if (opUrl) {
    const label = park.operator?.name
      ? `${park.operator.name} parks page`
      : 'Official park page';
    links.push(linkRow('🌐', label, opUrl));
  }

  // Source attribution
  let sourceLine = '';
  if (pol.source === 'operator_posted' || pol.source === 'operator_posted_v2') {
    const opName = park.operator?.name ? `: ${park.operator.name}` : '';
    const link = pol.source_url
      ? ` · <a href="${escHtml(pol.source_url)}" target="_blank" rel="noopener">source</a>` : '';
    sourceLine = `Operator-verified${opName}${link}`;
  } else if (pol.source === 'osm_default') {
    sourceLine = `Default policy (off-leash inside fence, dawn-dusk). Local rules may vary.`;
  } else if (pol.source_url) {
    sourceLine = `Sourced from <a href="${escHtml(pol.source_url)}" target="_blank" rel="noopener">linked page</a>.`;
  }

  if (park.lat != null && park.lng != null) {
    const dir = `https://www.google.com/maps/dir/?api=1&destination=${park.lat},${park.lng}`;
    links.push(linkRow('🗺️', 'Directions in Google Maps', dir));
  }

  if (!links.length && !sourceLine) return '';

  return `<section class="card links-card"><h2>Links</h2>
    ${links.join('')}
    ${sourceLine ? `<div class="policy-source">${sourceLine}</div>` : ''}
  </section>`;
}

function linkRow(icon, label, href) {
  return `<a class="link-row" href="${escHtml(href)}" target="_blank" rel="noopener">
    <span>${icon}</span>
    <span>${escHtml(label)}</span>
    <span class="arrow">→</span>
  </a>`;
}

// ── Map ───────────────────────────────────────────────────────────

// Copied verbatim from beach.html's initMap (incl ResizeObserver +
// invalidateSize belt-and-suspenders for the flex-row sizing race).
// Accepts an object with .lat + .lng — the render() function aliases
// latitude/longitude onto park.lat/lng before calling.
function initMap(park) {
  if (park.lat == null || park.lng == null) return;
  const mapEl = document.getElementById('map');
  if (!mapEl) return;
  const map = L.map('map', {
    zoomControl: true, scrollWheelZoom: false,
  }).setView([park.lat, park.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a>',
    maxZoom: 19,
  }).addTo(map);
  L.marker([park.lat, park.lng]).addTo(map);
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => map.invalidateSize());
    ro.observe(mapEl);
  }
  requestAnimationFrame(() => map.invalidateSize());
  setTimeout(() => map.invalidateSize(), 400);
  setTimeout(() => map.invalidateSize(), 1200);
}

// ── Photos ────────────────────────────────────────────────────────

async function loadPhotos(parkFid) {
  try {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/dog_park_photos?dog_park_fid=eq.${parkFid}` +
      `&select=source,image_url,thumb_url,attribution,license,page_url,captured_at` +
      `&order=sort_order.asc&limit=10`,
      { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` } });
    if (!r.ok) return hidePhotos();
    const photos = await r.json();
    if (!Array.isArray(photos) || !photos.length) return hidePhotos();
    photos[0].is_hero = true;
    if (window.PhotoBlock) {
      PhotoBlock.render(document.getElementById('photo-block-mount'), photos, { minimal: true });
    }
  } catch (_) {
    hidePhotos();
  }
}

function hidePhotos() {
  // Photos column is in a flex row with the map; hide just the photo col
  // so the map can still take its position.
  const mount = document.getElementById('photo-block-mount');
  if (mount) mount.style.display = 'none';
}

load();
</script>
