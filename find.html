  // ─── Normalize into common card shape ───────────────────────────────
  // Returns: { kind, id, fid?, location_id?, name, lat, lng, distanceMi,
  //           score, bestWindow, tone, bacteriaRisk, leashTag, amenities:{has_parking,has_restrooms,has_water,has_shade},
  //           tier, raw }
  function normalizeBeach(b) {
    // Disc semantics:
    //  NOW pill: prefer current_hour_score (live signal, colored tone);
    //  fall back to composite_score_v2 (today's peak) when current is
    //  null — disc renders grey with label "Best" so the user sees the
    //  beach IS scored, just not for this exact hour (tier-3 limited-
    //  access at noon, etc.). Truly unscored → "—" with tone-unk.
    //
    //  Day pills (TDY / TMW / SAT / ...): always show composite_score_v2
    //  for that date — "best window" peak. NOW vs TDY would otherwise
    //  render identically when both query today's date. Disc label
    //  reads "Best" with tone colored by the peak (these dates have no
    //  "right now" so the peak IS the headline signal for the day).
    let score, scoreIsCurrent;
    if (selectedDay === 'now') {
      score = b.current_hour_score ?? b.composite_score_v2 ?? null;
      scoreIsCurrent = b.current_hour_score != null;
    } else {
      score = b.composite_score_v2 ?? null;
      scoreIsCurrent = false;
    }
    const rankScore = score;
    const dMi = b.distance_m != null ? b.distance_m / 1609.34
              : (userLat != null && b.latitude != null
                  ? haversine(userLat, userLng, parseFloat(b.latitude), parseFloat(b.longitude))
                  : null);
    const tier = b.location_tier ?? 'unknown';
    // Surf height (marine wave_height_m → ft for display).
    const surfFt = b.peak_wave_height_m != null
      ? Number((parseFloat(b.peak_wave_height_m) * 3.28084).toFixed(1))
      : null;
    return {
      kind: 'beach',
      id: `b:${b.arena_group_id ?? b.location_id}`,
      fid: b.arena_group_id ?? null,
      location_id: b.location_id ?? null,
      name: b.display_name || 'Beach',
      lat: parseFloat(b.latitude),
      lng: parseFloat(b.longitude),
      distanceMi: dMi,
      score,
      rankScore,
      scoreIsCurrent,
      bestWindow: b.best_window_label || null,
      // Tone rules:
      //  NOW + live current_hour_score → colored (live signal)
      //  NOW + peak fallback           → grey (informational, not "right now")
      //  Day pill (any future day)     → colored (peak IS the headline)
      tone: (selectedDay !== 'now' && score != null) ? scoreTone(score)
          : (scoreIsCurrent ? scoreTone(score) : 'unk'),
      bacteriaRisk: b.bacteria_risk ?? 'none',
      hasOffLeash: b.has_off_leash === true,
      hasOnLeash:  b.has_on_leash === true,
      // Condition-chip inputs (mirror index.html's day-card chips,
      // with UV + sand + asphalt + surf added per 2026-06-10 redesign).
      // Surface chips only render when peak crosses an advisory band;
      // surf chip renders for any coastal beach with a marine_grid cell.
      lowestTideFt: b.lowest_tide_height != null ? parseFloat(b.lowest_tide_height) : null,
      avgTemp:      b.avg_temp != null           ? parseFloat(b.avg_temp)           : null,
      avgWind:      b.avg_wind != null           ? parseFloat(b.avg_wind)           : null,
      avgUv:        b.avg_uv   != null           ? parseFloat(b.avg_uv)             : null,
      peakSand:     b.peak_sand_temp    != null  ? parseFloat(b.peak_sand_temp)     : null,
      peakAsphalt:  b.peak_asphalt_temp != null  ? parseFloat(b.peak_asphalt_temp)  : null,
      surfFt,
      crowdCategory: b.busyness_category ?? null,
      weatherIcon:  getWeatherIcon(b.summary_weather, b.weather_code),
      weatherLabel: getWeatherLabel(b.summary_weather, b.weather_code),
      // Hero photo from find_beaches RPC (LATERAL pick mirroring the
      // diverse selector's prefer-dog-first priority). Falls back to
      // image_url when thumb_url is missing.
      heroThumbUrl: b.hero_thumb_url || b.hero_image_url || null,
      // Amenity presence flags — from find_beaches RPC (extended
      // 2026-06-07 to LEFT JOIN beach_amenities). NULL when the beach
      // has no amenity row yet; consumer treats NULL as unknown.
      // has_shade not tracked for beaches — stays undefined.
      amenities: {
        parking:   b.has_parking,
        restrooms: b.has_restrooms,
        water:     b.has_drinking_water,
        shade:     undefined,
      },
      tier,
      // Dog hour exclusion — when the beach has a prohibited window,
      // surface a chip so users know WHY current_hour_score is null
      // (or why the disc shows "Best" grey at this hour). Computed
      // client-side using the beach's own timezone.
      dogHours: buildDogHoursChip(b),
      raw: b,
    };
  }

  // Returns { state, label, icon } or null. state ∈
  // 'always_no' | 'now_prohibited' | 'now_ok_window' | null.
  //   - always_no       → dogs_allowed='no' (Surfside Beach)
  //   - now_prohibited  → in the daily prohibition window right now
  //   - now_ok_window   → outside the prohibition window, but the beach
  //                       has one (worth telling users the cutoff)
  //   - null            → no prohibition / not enough data → no chip
  function buildDogHoursChip(b) {
    if (b?.dogs_allowed === 'no') {
      return { state: 'always_no', label: 'Dogs not allowed', icon: '🚫' };
    }
    const start = parseHHMM(b?.dogs_prohibited_start);
    const end   = parseHHMM(b?.dogs_prohibited_end);
    if (start == null && end == null) return null;
    const startLbl = start != null ? fmtHourMin(start) : '?';
    const endLbl   = end   != null ? fmtHourMin(end)   : '?';
    const label = start != null && end != null
      ? `Dogs out ${startLbl}–${endLbl}`
      : (start != null ? `Dogs out after ${startLbl}` : `Dogs out before ${endLbl}`);
    // For future-day views (selectedDay !== 'now') the "right now in
    // prohibition" check doesn't apply — surface the chip as informational
    // (neutral). Only color it red when the user is looking at NOW and
    // current local time falls inside the prohibition window.
    if (selectedDay !== 'now') {
      return { state: 'now_ok_window', label, icon: '🐾' };
    }
    const tz = b?.timezone || 'America/Los_Angeles';
    const nowH = currentLocalHour(tz);
    let inProhib;
    if (start != null && end != null) {
      // Range may wrap midnight (unlikely but possible)
      if (start <= end) inProhib = nowH >= start && nowH < end;
      else              inProhib = nowH >= start || nowH < end;
    } else if (start != null) {
      inProhib = nowH >= start;
    } else {
      inProhib = nowH < end;
    }
    return inProhib
      ? { state: 'now_prohibited', label, icon: '🚫' }
      : { state: 'now_ok_window',  label, icon: '🐾' };
  }

  // Parse "HH:MM:SS" → minutes since midnight. Returns null when input
  // is null / malformed.
  function parseHHMM(s) {
    if (!s) return null;
    const m = String(s).match(/^(\d{1,2}):(\d{2})/);
    if (!m) return null;
    const h = parseInt(m[1], 10);
    const mi = parseInt(m[2], 10);
    if (!Number.isFinite(h) || !Number.isFinite(mi)) return null;
    return h * 60 + mi;
  }

  // Format minutes-since-midnight → "10am" or "4:30pm".
  function fmtHourMin(mins) {
    const h24 = Math.floor(mins / 60);
    const m   = mins % 60;
    const ap  = h24 >= 12 ? 'pm' : 'am';
    const h12 = h24 === 0 ? 12 : h24 > 12 ? h24 - 12 : h24;
    return m === 0 ? `${h12}${ap}` : `${h12}:${String(m).padStart(2,'0')}${ap}`;
  }

  // Compare current local time at a TZ to a minutes-since-midnight value.
  // Returns minutes-since-midnight at that TZ.
  function currentLocalHour(tz) {
    // Reuse minutes-since-midnight for the in-prohibition test so we
    // don't get rounding artifacts at half-hour cutoffs like 16:30.
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false,
    }).formatToParts(new Date());
    const h = parseInt(parts.find(p => p.type === 'hour')?.value ?? '0', 10) % 24;
    const m = parseInt(parts.find(p => p.type === 'minute')?.value ?? '0', 10);
    return h * 60 + m;
  }

  function normalizeDogPark(dp) {
    // Dog parks don't carry a daily composite; score the disc as the
    // accent-park tone. distance_miles comes from the RPC.
    return {
      kind: 'dog_park',
      id: `p:${dp.fid}`,
      fid: dp.fid,
      location_id: null,
      name: dp.name || 'Unnamed dog park',
      lat: parseFloat(dp.lat),
      lng: parseFloat(dp.lon),
      distanceMi: dp.distance_miles ?? null,
      score: null,
      rankScore: null,
      bestWindow: dp.hours_text
                  || (dp.hours_open_time && dp.hours_close_time
                      ? `${dp.hours_open_time}–${dp.hours_close_time}`
                      : null),
      tone: 'park',
      bacteriaRisk: 'none',
      hasOffLeash: true,
      hasOnLeash:  false,
      // Dog-park amenities — from nearest_dog_parks RPC (extended
      // 2026-06-07 to surface has_shade + picnic_tables + water_play +
      // agility from dog_park_dog_policy). Parking + restrooms aren't
      // tracked at the policy layer → undefined → chip filter passes through.
      amenities: {
        parking:   undefined,
        restrooms: undefined,
        water:     dp.has_drinking_water,
        shade:     dp.has_shade,
      },
      verified: dp.source === 'operator_posted' || dp.source === 'operator_posted_v2',
      raw: dp,
    };
  }

  function scoreTone(s) {
    if (s == null) return 'unk';
    if (s >= 70)   return 'go';
    if (s >= 45)   return 'mid';
    return 'low';
  }

  // ─── Filter + rank ──────────────────────────────────────────────────
  function matchesSearch(card) {
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    const name = (card.name || '').toLowerCase();
    if (name.includes(q)) return true;
    // Cheap city/region soft-match via raw fields if available
    const raw = card.raw || {};
    const blob = [raw.city, raw.county, raw.state, raw.region, raw.address_city]
      .filter(Boolean).join(' ').toLowerCase();
    return blob.includes(q);
  }

  function matchesDistance(card) {
    if (distanceFilterMi === 'any') return true;
    if (card.distanceMi == null) return true;
    return card.distanceMi <= distanceFilterMi;
  }

  function matchesWant(card) {
    if (card.kind === 'dog_park') return wants.has('dog_park');
    // Beach: depends on chips. Both off + on → either. Only off → has_off_leash.
    // Only on → has_on_leash && !has_off_leash. Neither → exclude beaches.
    const wantOff = wants.has('off_leash_beach');
    const wantOn  = wants.has('on_leash_beach');
    if (!wantOff && !wantOn) return false;
    if (wantOff && wantOn) return true;
    if (wantOff) return card.hasOffLeash;
    if (wantOn)  return card.hasOnLeash && !card.hasOffLeash;
    return true;
  }

  // Amenity hard-filter. Selected chip requires amenities[a] === true.
  // Unknown (undefined/null) passes through — beaches/parks not yet enriched
  // for this signal aren't punished, they just don't get the green ✓ dot.
  // Explicit false filters the entity out.
  //
  // Why hard not soft: composite_score_v2 ALREADY rewards amenities (the
  // bulk SQL apply adds +3 for parking, +4 for restrooms, +1 for drinking
  // water, etc., per 20260606f_apply_v2_best_window_bulk.sql). Soft-blending
  // here would double-count what the score already says. The chip's job is
  // "show me only ones with X" — a filter, not a rerank.
  function matchesAmenities(card) {
    if (amenityFilters.size === 0) return true;
    for (const a of amenityFilters) {
      const v = card.amenities?.[a];
      if (v === false) return false;
      // undefined / null → unknown, pass through
    }
    return true;
  }

  // Hide beaches the user can't actually use at the moment they're
  // looking at. NOW pill → drop beaches currently inside their dog
  // prohibition window (Newport Municipal etc. between 10am–4:30pm).
  // 'always_no' beaches (Surfside) drop on every view — they're not
  // an option any time.
  // Dog parks always pass (never have prohibition windows).
  // Per Franz 2026-06-07: "when now is selected, beaches that exclude
  // dogs during the current hour should be hidden."
  function matchesDogHoursForView(card) {
    if (card.kind !== 'beach') return true;
    const state = card.dogHours?.state;
    if (state === 'always_no') return false;
    if (selectedDay === 'now' && state === 'now_prohibited') return false;
    return true;
  }

  function buildRanked() {
    const all = [
      ...beachResults.map(normalizeBeach),
      ...dogParkResults.map(normalizeDogPark),
    ];
    const filtered = all
      .filter(matchesWant)
      .filter(matchesAmenities)
      .filter(matchesDistance)
      .filter(matchesDogHoursForView)
      .filter(matchesSearch);
    if (!filtered.length) return [];
    // Sort by rankScore (current_hour_score if available, else today's
    // composite_score_v2 — both already amenity/feature-baked at the SQL
    // layer). Distance as tiebreaker so an equal-scored closer pick wins.
    // Dog parks have no v2 composite — anchor them at 60 (slightly above
    // neutral) so verified nearby parks can interleave alongside beaches.
    const sortKey = c => {
      if (c.kind === 'dog_park') return c.rankScore ?? 60;
      return c.rankScore != null ? c.rankScore : 0;
    };
    const cmp = (a, b) => {
      const sa = sortKey(a), sb = sortKey(b);
      if (sb !== sa) return sb - sa;
      const da = a.distanceMi ?? Infinity;
      const db = b.distanceMi ?? Infinity;
      return da - db;
    };
    // Min-quota merge: when both a beach chip AND the dog-park chip are
    // active, reserve up to MIN_DP dog-park slots so a strong beach
    // pool can't crowd out parks entirely. Was: pure rankScore sort,
    // which buried dog parks (anchored at 60) under any nearby region
    // with on-leash beaches scoring 75-93. Reported by Franz 2026-06-07
    // — "toggle on off-leash beaches and dog parks disappear."
    const wantsBeach = wants.has('off_leash_beach') || wants.has('on_leash_beach');
    const wantsPark  = wants.has('dog_park');
    const MIN_DP = 3;
    const sortedBeaches = filtered.filter(c => c.kind === 'beach').sort(cmp);
    const sortedParks   = filtered.filter(c => c.kind === 'dog_park').sort(cmp);
    if (wantsBeach && wantsPark) {
      const reservedParks = sortedParks.slice(0, Math.min(MIN_DP, sortedParks.length));
      const reservedSet = new Set(reservedParks);
      const remaining = [...sortedBeaches, ...sortedParks]
        .filter(c => !reservedSet.has(c))
        .sort(cmp);
      const fillSlots = Math.max(0, DISPLAY_LIMIT - reservedParks.length);
      const merged = [...reservedParks, ...remaining.slice(0, fillSlots)];
      merged.sort(cmp);
      return merged;
    }
    // Single-kind path: plain rank sort
    return [...filtered].sort(cmp).slice(0, DISPLAY_LIMIT);
  }

  // ─── Distance helper ────────────────────────────────────────────────
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 3958.8;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.asin(Math.sqrt(a));
  }

  // ─── Render: result cards ───────────────────────────────────────────
  function renderCards() {
    const cards = buildRanked();
    lastRenderedCards = cards;

    const list = document.getElementById('result-list');
    const head = document.getElementById('results-count');

    if (!cards.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🐾</div>
          <div class="empty-text">No places match — try widening the radius or unpicking an amenity.</div>
        </div>`;
      head.textContent = '0 PLACES';
      renderPins([]);
      renderScoutBlurb(cards);
      return;
    }

    head.textContent = `${cards.length} PLACE${cards.length === 1 ? '' : 'S'}`;
    list.innerHTML = cards.map((c, i) => renderCardHTML(c, i + 1)).join('');
    list.querySelectorAll('[data-card-id]').forEach(el => {
      el.addEventListener('click', e => {
        // Don't navigate when the click was on the dist-link (directions trigger)
        if (e.target.closest('[data-dir]')) return;
        const id = el.getAttribute('data-card-id');
        const card = lastRenderedCards.find(c => c.id === id);
        if (card) navigateToCard(card);
      });
    });
    list.querySelectorAll('[data-dir]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const id = btn.getAttribute('data-dir');
        const card = lastRenderedCards.find(c => c.id === id);
        if (card) openDirections(card);
      });
    });

    renderPins(cards);
    renderScoutBlurb(cards);
  }

  function renderCardHTML(c, rank) {
    const tone = c.tone || 'unk';
    const toneClass = `tone-${tone}`;
    const tierClass = c.kind === 'beach' && c.tier ? `tier-${c.tier}` : '';

    // Left cluster — inline mono score + weather emoji. Dog-park
    // rows use ★ in place of a numeric score; "No data" still gets
    // the inline em-dash so the column stays aligned.
    const scoreVal = c.kind === 'dog_park'
      ? '★'
      : (c.score != null ? c.score : '—');
    const scoreInline = `<span class="score-inline ${toneClass}">${scoreVal}</span>`;
    const weatherInline = c.weatherIcon
      ? `<span class="weather-emoji" title="${escapeAttr(c.weatherLabel ?? '')}">${c.weatherIcon}</span>`
      : '';

    // Name + mileage + window time on one line, same Outfit 16/600.
    // Mileage sits inline (left of window) in charcoal so it reads as
    // a supporting signal next to the name. Window is status-tinted;
    // on day-pills colored, on NOW peak-fallback grey.
    let mileageHtml = '';
    if (c.distanceMi != null) {
      mileageHtml = `<span class="result-name-sep">·</span><span class="result-mileage" data-dir="${c.id}">${c.distanceMi.toFixed(1)} mi</span>`;
    }
    let windowHtml = '';
    if (c.bestWindow) {
      windowHtml = `<span class="result-name-sep">·</span><span class="result-window ${toneClass}">${escapeHtml(c.bestWindow)}</span>`;
    } else if (c.kind === 'beach' && c.score != null) {
      windowHtml = `<span class="result-name-sep">·</span><span class="result-window tone-unk">No window</span>`;
    }

    // Info row — bacteria + dog-hour warnings only (mileage moved up
    // to the name row 2026-06-10). Suppressed entirely on clean days.
    const infoParts = [];
    if (c.bacteriaRisk === 'high' || c.bacteriaRisk === 'moderate') {
      infoParts.push(`<span class="meta-warn">⚠ 72h rain advisory</span>`);
    }
    if (c?.dogHours) {
      const cls = c.dogHours.state === 'now_ok_window' ? 'meta-doghours-ok' : 'meta-doghours-out';
      infoParts.push(`<span class="${cls}">${c.dogHours.icon} ${escapeHtml(c.dogHours.label)}</span>`);
    }
    const infoHtml = infoParts.length
      ? `<div class="result-info">${infoParts.join('<span class="info-sep">·</span>')}</div>`
      : '';

    // Condition chips — tide·surf·temp·wind·UV·[sand]·[asphalt]·crowd.
    // Surface caution chips only render when peak crosses advisory.
    // Dog parks skip the chip row entirely (no daily weather signal).
    const chipsHtml = c.kind === 'dog_park' ? '' : buildCondChips(c);
    const chipsBlock = chipsHtml
      ? `<div class="result-chips">${chipsHtml}</div>`
      : '';

    const amenityHtml = renderAmenityStrip(c);

    // Hero thumb tile — placeholder when no photo so card alignment
    // is consistent across the list.
    const thumbHtml = c.heroThumbUrl
      ? `<div class="result-thumb"><img src="${escapeAttr(c.heroThumbUrl)}" alt="" loading="lazy" onerror="this.parentNode.classList.add('no-photo'); this.remove();"></div>`
      : `<div class="result-thumb no-photo"></div>`;

    return `
      <a class="result-card ${toneClass} ${tierClass}"
         data-card-id="${c.id}"
         href="${navUrl(c)}"
         aria-label="${escapeAttr(c.name)} — rank ${rank}">
        ${thumbHtml}
        <div class="result-left">
          ${scoreInline}
          ${weatherInline}
        </div>
        <div class="result-body">
          <div class="result-name-row">
            <span class="result-name">${escapeHtml(c.name)}</span>
            ${windowHtml}
            ${mileageHtml}
          </div>
          ${infoHtml}
          ${chipsBlock}
          ${amenityHtml}
        </div>
        <div class="result-end">
          <div class="rank-badge">#${rank}</div>
          <div class="chev">›</div>
        </div>
      </a>`;
  }

  // ── Condition-chip helpers ────────────────────────────────────────
  // chipStatus mirrors public.v2_signal_status thresholds (same source
  // of truth as beach-chat's v2StatusFor + the SQL band defs). Keep in
  // sync when bands change.
  function chipStatus(signal, v) {
    if (v == null) return null;
    switch (signal) {
      case 'uv':
        if (v >= 11) return 'no_go';
        if (v >=  9) return 'caution';
        if (v >=  6) return 'advisory';
        return 'go';
      case 'sand':
        if (v >= 145) return 'no_go';
        if (v >= 125) return 'caution';
        if (v >= 115) return 'advisory';
        return null;   // chip suppressed below threshold
      case 'asphalt':
        if (v >= 125) return 'no_go';
        if (v >= 115) return 'advisory';
        return null;
      case 'tide':
        if (v >= 7) return 'no_go';
        if (v >= 5) return 'caution';
        if (v >= 3) return 'advisory';
        return 'go';
      case 'wind':
        if (v >= 35) return 'no_go';
        if (v >= 19) return 'caution';
        if (v >= 13) return 'advisory';
        return 'go';
      case 'surf':
        // v in meters. >2.5m ≈ 8.2ft (overhead+).
        if (v >= 2.5) return 'no_go';
        if (v >= 1.5) return 'caution';
        if (v >= 0.9) return 'advisory';
        return 'go';
      case 'temp':
        if (v >= 125 || v <= 20) return 'no_go';
        if (v >=  95 || v <= 32) return 'caution';
        if (v >=  85 || v <= 50) return 'advisory';
        return 'go';
      default:
        return null;
    }
  }

  function buildCondChips(c) {
    const parts = [];
    if (c.lowestTideFt != null) {
      const st = chipStatus('tide', c.lowestTideFt);
      parts.push(`<span class="cond-chip chip-${st}">🌊 ${c.lowestTideFt}ft</span>`);
    }
    if (c.surfFt != null) {
      const st = chipStatus('surf', c.surfFt / 3.28084);
      parts.push(`<span class="cond-chip chip-${st}">🏄 ${c.surfFt}ft</span>`);
    }
    if (c.avgTemp != null) {
      const st = chipStatus('temp', c.avgTemp);
      parts.push(`<span class="cond-chip chip-${st}">🌡 ${Math.round(c.avgTemp)}°</span>`);
    }
    if (c.avgWind != null) {
      const st = chipStatus('wind', c.avgWind);
      parts.push(`<span class="cond-chip chip-${st}">💨 ${Math.round(c.avgWind)}mph</span>`);
    }
    if (c.avgUv != null) {
      const st = chipStatus('uv', c.avgUv);
      parts.push(`<span class="cond-chip chip-${st}">☀ UV${Math.round(c.avgUv)}</span>`);
    }
    if (c.peakSand != null) {
      const st = chipStatus('sand', c.peakSand);
      if (st) parts.push(`<span class="cond-chip chip-${st}">🌶 Sand ${Math.round(c.peakSand)}°</span>`);
    }
    if (c.peakAsphalt != null) {
      const st = chipStatus('asphalt', c.peakAsphalt);
      if (st) parts.push(`<span class="cond-chip chip-${st}">🛣 Asphalt ${Math.round(c.peakAsphalt)}°</span>`);
    }
    if (c.crowdCategory) {
      const meta = {
        quiet:       { label: '✌️ Quiet',       st: 'go' },
        moderate:    { label: '⚖️ Mod',         st: 'advisory' },
        dog_party:   { label: '🎉 Dog Party',   st: 'go' },
        too_crowded: { label: '🚫 Too Crowded', st: 'no_go' },
      }[c.crowdCategory] || { label: c.crowdCategory, st: 'go' };
      parts.push(`<span class="cond-chip chip-${meta.st}">${meta.label}</span>`);
    }
    return parts.join('<span class="cond-chip-sep">·</span>');
  }

  function getWeatherIcon(summaryWeather, wmoCode) {
    const map = {
      sunny:'☀️', partly_cloudy:'⛅', cloudy:'☁️',
      foggy:'🌫️', rainy:'🌧️', windy:'💨',
    };
    if (summaryWeather && map[summaryWeather]) return map[summaryWeather];
    if (wmoCode == null)  return '';
    if (wmoCode === 0)    return '☀️';
    if (wmoCode <= 2)     return '⛅';
    if (wmoCode === 3)    return '☁️';
    if (wmoCode <= 48)    return '🌫️';
    if (wmoCode <= 67)    return '🌧️';
    if (wmoCode <= 77)    return '🌨️';
    if (wmoCode <= 82)    return '🌧️';
    return '⛈️';
  }

  function getWeatherLabel(summaryWeather, wmoCode) {
    const labels = {
      sunny: 'Sunny', partly_cloudy: 'Partly cloudy', cloudy: 'Cloudy',
      foggy: 'Foggy', rainy: 'Rainy', windy: 'Windy',
    };
    if (summaryWeather && labels[summaryWeather]) return labels[summaryWeather];
    if (wmoCode == null) return '';
    if (wmoCode === 0)   return 'Clear';
    if (wmoCode <= 2)    return 'Partly cloudy';
    if (wmoCode === 3)   return 'Overcast';
    if (wmoCode <= 48)   return 'Fog';
    if (wmoCode <= 57)   return 'Drizzle';
    if (wmoCode <= 67)   return 'Rain';
    if (wmoCode <= 77)   return 'Snow';
    if (wmoCode <= 82)   return 'Showers';
    if (wmoCode <= 86)   return 'Snow showers';
    if (wmoCode <= 99)   return 'Thunderstorm';
    return '';
  }

  function navUrl(c) {
    if (c.kind === 'dog_park') return `dog-park.html?fid=${c.fid}`;
    // Carry the selected day forward when the user clicked a non-NOW
    // pill. beach.html honors ?date= via get_beach_info(p_fid, p_date).
    // NOW pill omits the param so beach.html uses its default
    // (current_date) and renders the live-hour signal.
    const dateQs = selectedDay && selectedDay !== 'now' ? `&date=${selectedDay}` : '';
    return c.fid
      ? `beach.html?fid=${c.fid}${dateQs}`
      : `beach.html?location_id=${c.location_id}${dateQs}`;
  }

  function navigateToCard(c) {
    window.location.href = navUrl(c);
  }

  function renderAmenityStrip(c) {
    if (amenityFilters.size === 0) return '';
    const lookup = {
      parking:   { icon:'🅿️', label:'Parking' },
      restrooms: { icon:'🚻', label:'Restrooms' },
      water:     { icon:'💧', label:'Water' },
      shade:     { icon:'🌳', label:'Shade' },
    };
    const dots = [];
    for (const a of amenityFilters) {
      const def = lookup[a]; if (!def) continue;
      const v = c.amenities?.[a];
      if (v === true) {
        dots.push(`<span class="amenity-dot match" title="${def.label}: yes"><span class="dot-mark">✓</span>${def.icon}</span>`);
      } else if (v === false) {
        dots.push(`<span class="amenity-dot miss" title="${def.label}: no"><span class="dot-mark">×</span>${def.icon}</span>`);
      } else {
        dots.push(`<span class="amenity-dot" title="${def.label}: unknown"><span class="dot-mark">?</span>${def.icon}</span>`);
      }
    }
    return `<div class="amenity-strip">${dots.join('')}</div>`;
  }

  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, '&quot;');
  }

  // ─── Map ────────────────────────────────────────────────────────────
  function initMap() {
    if (map) return;
    map = L.map('map', {
      zoomControl: true,
      attributionControl: false,
      scrollWheelZoom: false,  // less aggressive on a scroll-heavy page
    });
    map.on('click', () => { /* tapping the map background clears highlight */
      activePinId = null;
      Array.from(document.querySelectorAll('.pin.pin-active'))
        .forEach(el => el.classList.remove('pin-active'));
    });
    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      maxZoom: 19,
      // Attribution control disabled above; required attribution still rendered
      // by the included <a> below the map if/when we add a credit row.
    }).addTo(map);
    map.setView([userLat ?? DEFAULT_LAT, userLng ?? DEFAULT_LNG], 11);

    if (userLat != null && userLng != null) {
      const ui = L.divIcon({ html: `<div class="pin-user"></div>`, className: '', iconSize: [22, 22], iconAnchor: [11, 11] });
      userMarker = L.marker([userLat, userLng], { icon: ui, zIndexOffset: 600 }).addTo(map);
    }
  }

  function renderPins(cards) {
    if (!map) return;
    if (pinsLayer) { map.removeLayer(pinsLayer); pinsLayer = null; }
    if (!cards.length) {
      if (userLat != null) map.setView([userLat, userLng], 11);
      return;
    }
    pinsLayer = L.layerGroup().addTo(map);
    const pts = [];
    cards.forEach((c, i) => {
      if (Number.isNaN(c.lat) || Number.isNaN(c.lng)) return;
      pts.push([c.lat, c.lng]);
      const isPark = c.kind === 'dog_park';
      const cls = isPark ? 'pin-park' : `pin-${c.tone}`;
      const inner = isPark
        ? `<span class="pin-park-score">${i + 1}</span>`
        : (c.score != null ? c.score : i + 1);
      const html = `<div class="pin ${cls}" data-pin-id="${c.id}">${inner}</div>`;
      const icon = L.divIcon({ html, className: '', iconSize: [34, 34], iconAnchor: [17, 17] });
      const marker = L.marker([c.lat, c.lng], { icon, riseOnHover: true });
      marker.on('click', () => onPinClick(c.id));
      marker.addTo(pinsLayer);
    });
    if (userLat != null) pts.push([userLat, userLng]);
    if (pts.length === 1) {
      map.setView(pts[0], 12);
    } else if (pts.length > 1) {
      const bounds = L.latLngBounds(pts);
      map.fitBounds(bounds, { padding: [36, 36], maxZoom: 13 });
    }
  }

  function onPinClick(cardId) {
    activePinId = cardId;
    Array.from(document.querySelectorAll('.pin'))
      .forEach(el => el.classList.toggle('pin-active', el.getAttribute('data-pin-id') === cardId));
    const card = document.querySelector(`.result-card[data-card-id="${cardId}"]`);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('highlight');
      setTimeout(() => card.classList.remove('highlight'), 1600);
    }
  }

  // ─── Scout blurb ────────────────────────────────────────────────────
  async function renderScoutBlurb(cards) {
    const el = document.getElementById('scout-blurb');
    if (!cards.length) {
      el.classList.add('empty');
      el.textContent = '';
      return;
    }
    el.classList.remove('empty');

    const first = cards[0];
    const contextLines = cards.slice(0, 5).map((c, i) => {
      const score = c.score != null ? c.score : 'park';
      const distStr = c.distanceMi != null ? `${c.distanceMi.toFixed(1)} mi` : 'distance n/a';
      return `${i + 1}. ${c.name} (${score}, ${distStr})`;
    }).join('; ');

    // Cache key includes selectedDay so flipping pills refreshes the
    // blurb instead of replaying the previous day's text when the top
    // beach happens to be the same.
    const cacheKey = JSON.stringify({
      first: first.id,
      day:   selectedDay,
      wants: [...wants].sort(),
      amen: [...amenityFilters].sort(),
      dist: distanceFilterMi,
    });
    if (scoutCache[cacheKey]) {
      el.classList.remove('loading');
      el.textContent = scoutCache[cacheKey];
      return;
    }

    el.classList.add('loading');
    el.textContent = 'Scout is sniffing the wind…';

    if (_scoutAbortCtrl) _scoutAbortCtrl.abort();
    _scoutAbortCtrl = new AbortController();
    const myCtrl = _scoutAbortCtrl;

    // Day framing for the prompt — drives whether the blurb reads
    // "right now" / "today" / "this Saturday." Only NOW carries the
    // user-coord weather hint since that's all we fetch for non-NOW.
    const todayISO = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
    let dayPhrase, framing;
    if (selectedDay === 'now') {
      dayPhrase = 'right now';
      framing   = 'tell the owner what to expect there right now';
    } else if (selectedDay === todayISO) {
      dayPhrase = 'today';
      framing   = "tell the owner what to expect at the best part of today's window";
    } else {
      const dt = new Date(selectedDay + 'T12:00:00');
      const wk = dt.toLocaleDateString('en-US', { weekday: 'long' });
      dayPhrase = `this ${wk}`;
      framing   = `tell the owner what to plan for ${wk}'s best window`;
    }

    const nowSummary = (selectedDay === 'now' && nowAtUser)
      ? `It's ${Math.round(nowAtUser.tempF)}°F with ${WMO_LABELS[nowAtUser.wmoCode] || 'mixed sky'} where the user is.`
      : '';
    const amenitySummary = amenityFilters.size
      ? ` The user is filtering for ${[...amenityFilters].join(', ')}.`
      : '';

    const question = `${nowSummary}${amenitySummary} Ranked options for ${dayPhrase}: ${contextLines}. In two sentences, recommend ${first.name} (or — if its conditions are weak — call out a better trade-off from this list) and ${framing}.`;

    // For dog-park first picks, we don't have a location_id to anchor
    // beach-chat to; fall back to the highest-ranked beach if one exists.
    const beachAnchor = cards.find(c => c.kind === 'beach');
    if (!beachAnchor) {
      el.classList.remove('loading');
      el.textContent = `Dog parks lead today — ${first.name} is your nearest verified park.`;
      scoutCache[cacheKey] = el.textContent;
      return;
    }

    try {
      const res  = await fetch(`${SUPABASE_URL}/functions/v1/beach-chat`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ANON_KEY}` },
        body:    JSON.stringify({
          location_id: beachAnchor.location_id,
          arena_group_id: beachAnchor.fid,
          question,
        }),
        signal: myCtrl.signal,
      });
      if (myCtrl !== _scoutAbortCtrl) return;
      const data = await res.json();
      if (myCtrl !== _scoutAbortCtrl) return;
      const text = data.answer || '';
      scoutCache[cacheKey] = text;
      el.classList.remove('loading');
      el.textContent = text || `${first.name} is the standout ${dayPhrase}.`;
    } catch (e) {
      if (e.name === 'AbortError') return;
      el.classList.remove('loading');
      el.textContent = '';
      el.classList.add('empty');
    }
  }

  // ─── Filter chip UI sync ────────────────────────────────────────────
  function syncWantChips() {
    document.querySelectorAll('#want-chips .chip').forEach(el => {
      el.classList.toggle('active', wants.has(el.getAttribute('data-want')));
    });
  }
  function syncAmenityChips() {
    document.querySelectorAll('#amenity-chips .chip').forEach(el => {
      el.classList.toggle('active', amenityFilters.has(el.getAttribute('data-amenity')));
    });
  }

  function onWantToggle(want) {
    if (wants.has(want)) wants.delete(want);
    else                 wants.add(want);
    // Don't let the user clear ALL want-chips — leave the last one on
    if (wants.size === 0) wants.add(want);
    persistWants();
    syncWantChips();
    renderCards();
  }
  function onAmenityToggle(amenity) {
    if (amenityFilters.has(amenity)) amenityFilters.delete(amenity);
    else                              amenityFilters.add(amenity);
    persistAmenities();
    syncAmenityChips();
    renderCards();
  }

  function onDistanceChange(val) {
    distanceFilterMi = val === 'any' ? 'any' : parseFloat(val);
    persistDistance();
    renderCards();
  }

  // ─── Day pills ──────────────────────────────────────────────────────
  // NOW + today + next 6 days. Click → set selectedDay, refetch
  // beach/dog-park data for that date, re-render. selectedDay='now'
  // is the live current-hour view (dot indicator on the pill).
  function buildDayList() {
    const days = [];
    days.push({ id: 'now', topLabel: 'LIVE', mainLabel: 'NOW' });
    const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
    days.push({ id: today, topLabel: 'TODAY', mainLabel: dateNum(today) });
    for (let i = 1; i <= 6; i++) {
      const d = new Date(Date.now() + i * 86400000);
      const iso = d.toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
      const wk = d.toLocaleDateString('en-US', { timeZone: 'America/Los_Angeles', weekday: 'short' }).toUpperCase();
      days.push({ id: iso, topLabel: wk, mainLabel: dateNum(iso) });
    }
    return days;
  }
  // "2026-06-07" → "7" (day of month, no leading zero)
  function dateNum(iso) {
    return String(parseInt(iso.slice(-2), 10));
  }

  function renderDayPills() {
    const wrap = document.getElementById('day-pills');
    const days = buildDayList();
    wrap.innerHTML = days.map(d => {
      const isActive = d.id === selectedDay;
      const cls = `day-pill${d.id === 'now' ? ' now-pill' : ''}${isActive ? ' active' : ''}`;
      return `<button type="button" class="${cls}" role="tab"
                       aria-selected="${isActive}" data-day="${d.id}">
        <span class="day-pill-label">${d.topLabel}</span>
        <span class="day-pill-num">${d.mainLabel}</span>
      </button>`;
    }).join('');
    wrap.querySelectorAll('.day-pill').forEach(el => {
      el.addEventListener('click', () => onDayPick(el.getAttribute('data-day')));
    });
  }

  async function onDayPick(dayId) {
    if (dayId === selectedDay) return;
    selectedDay = dayId;
    try { localStorage.setItem(DAY_KEY, dayId); } catch {}
    renderDayPills();
    // Hide the "Now at you" strip when the user is looking at a future
    // day — that widget is about live conditions at the user's location.
    const nowStrip = document.getElementById('now-strip');
    if (nowStrip) nowStrip.style.display = dayId === 'now' ? '' : 'none';
    // Update the results heading to name the day they're viewing
    updateResultsTitle();
    // Refetch beach + park data for the new date and re-render.
    showLoadingSkeletons();
    await Promise.all([loadBeaches(), loadDogParks()]);
    renderCards();
  }

  function updateResultsTitle() {
    const t = document.getElementById('results-title');
    if (!t) return;
    if (selectedDay === 'now') {
      t.textContent = 'Better picks nearby';
      return;
    }
    const todayISO = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
    if (selectedDay === todayISO) {
      t.textContent = "Today's picks";
      return;
    }
    const dt = new Date(selectedDay + 'T12:00:00');
    const wk = dt.toLocaleDateString('en-US', { weekday: 'long' });
    t.textContent = `${wk} picks`;
  }

  function showLoadingSkeletons() {
    const list = document.getElementById('result-list');
    if (!list) return;
    list.innerHTML = Array(4).fill('<div class="skeleton"></div>').join('');
  }

  // ─── Search ─────────────────────────────────────────────────────────
  let _searchDebounce = null;
  function onSearchInput(value) {
    const clear = document.getElementById('search-clear');
    clear.classList.toggle('visible', !!value);
    if (_searchDebounce) clearTimeout(_searchDebounce);
    _searchDebounce = setTimeout(() => {
      searchQuery = (value || '').trim();
      renderCards();
    }, 120);
  }
  function clearSearch() {
    const inp = document.getElementById('search-input');
    inp.value = '';
    document.getElementById('search-clear').classList.remove('visible');
    searchQuery = '';
    renderCards();
    inp.focus();
  }

  // ─── Directions sheet ───────────────────────────────────────────────
  let dirMap = null, dirRoute = null, dirMarkers = null;
  async function openDirections(card) {
    const lat = card.lat, lng = card.lng;
    document.getElementById('dir-beach').textContent = card.name;
    const dist = card.distanceMi != null ? `${card.distanceMi.toFixed(1)} mi` : '';
    document.getElementById('dir-meta').textContent = dist;
    document.getElementById('dir-overlay').classList.add('open');
    document.getElementById('dir-sheet').classList.add('open');

    if (!dirMap) {
      dirMap = L.map('dir-map', { zoomControl: true, attributionControl: false });
      L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', { maxZoom: 19 })
        .addTo(dirMap);
    }
    if (dirRoute)   { dirMap.removeLayer(dirRoute);   dirRoute   = null; }
    if (dirMarkers) { dirMap.removeLayer(dirMarkers); dirMarkers = null; }
    dirMarkers = L.layerGroup().addTo(dirMap);

    const beachIcon = L.divIcon({
      html: `<div class="pin pin-${card.kind === 'dog_park' ? 'park' : (card.tone || 'unk')}">${card.kind === 'dog_park' ? '★' : (card.score ?? '•')}</div>`,
      className: '', iconSize: [34, 34], iconAnchor: [17, 17],
    });
    L.marker([lat, lng], { icon: beachIcon }).addTo(dirMarkers);

    if (userLat != null) {
      const userIcon = L.divIcon({ html: `<div class="pin-user"></div>`, className: '', iconSize: [22, 22], iconAnchor: [11, 11] });
      L.marker([userLat, userLng], { icon: userIcon }).addTo(dirMarkers);
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${userLng},${userLat};${lng},${lat}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes?.[0]) {
          dirRoute = L.geoJSON(data.routes[0].geometry, {
            style: { color: '#1d4ed8', weight: 4, opacity: 0.85 },
          }).addTo(dirMap);
          dirMap.fitBounds(dirRoute.getBounds(), { padding: [28, 28] });
        } else { dirMap.setView([lat, lng], 13); }
      } catch { dirMap.setView([lat, lng], 13); }
    } else {
      dirMap.setView([lat, lng], 13);
    }
    setTimeout(() => dirMap.invalidateSize(), 60);
  }

  function closeDirections() {
    document.getElementById('dir-overlay').classList.remove('open');
    document.getElementById('dir-sheet').classList.remove('open');
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDirections();
  });

  // ─── Orchestrator ───────────────────────────────────────────────────
  async function loadEverything() {
    // Parallel: beach list, dog-park list, user-coord weather
    await Promise.all([
      loadBeaches(),
      loadDogParks(),
      loadNowAtUser(),
    ]);
    initMap();
    if (userMarker) { try { map.removeLayer(userMarker); } catch {} userMarker = null; }
    if (userLat != null) {
      const ui = L.divIcon({ html: `<div class="pin-user"></div>`, className: '', iconSize: [22, 22], iconAnchor: [11, 11] });
      userMarker = L.marker([userLat, userLng], { icon: ui, zIndexOffset: 600 }).addTo(map);
    }
    renderCards();
  }

  // ─── Boot ───────────────────────────────────────────────────────────
  // Wire chips + day pills + selects
  syncWantChips();
  syncAmenityChips();
  renderDayPills();
  updateResultsTitle();
  // If the user landed on a non-NOW day (persisted), hide the live
  // weather strip up front so the page renders correctly even before
  // the first fetch completes.
  if (selectedDay !== 'now') {
    const ns = document.getElementById('now-strip');
    if (ns) ns.style.display = 'none';
  }
  document.getElementById('dist-select').value =
    distanceFilterMi === 'any' ? 'any' : String(distanceFilterMi);

  document.querySelectorAll('#want-chips .chip').forEach(el => {
    el.addEventListener('click', () => onWantToggle(el.getAttribute('data-want')));
  });
  document.querySelectorAll('#amenity-chips .chip').forEach(el => {
    el.addEventListener('click', () => onAmenityToggle(el.getAttribute('data-amenity')));
  });
  document.getElementById('search-input').addEventListener('input', e => onSearchInput(e.target.value));

  // Hydrate location → fetch
  if (hydrateLocationFromCache()) {
    loadEverything();
  } else {
    requestGeolocation();
  }
</script>

<script>
  // Scout chat anchors to the current top-ranked beach. Re-evaluates on each
  // render so the chat panel always opens against the freshest #1.
  window.CHAT_CONFIG = {
    getLocationId: () => {
      const first = lastRenderedCards.find(c => c.kind === 'beach');
      return first ? first.location_id : null;
    },
    placeholder: 'Which beach is best this weekend?',
  };
</script>
<script src="src/chat.js"></script>
</body>
</html>
