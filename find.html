<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Find Your Beach — Dog Beach Scout</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Outfit:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/chat.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #eef4f8;  /* sea fog */
      --surface:      #ffffff;
      --surface-hover:#f5f9fc;
      --border:       #d1dde8;  /* cool gray-blue */
      --text:         #0f2742;  /* marine navy */
      --text-muted:   #5b6b7d;
      --text-dim:     #94a3b8;
      --green:        #15803d;  /* hunter */
      --green-dim:    #d1fae5;
      --advisory:     #0369a1;  /* deep sea blue */
      --advisory-dim: #e0f2fe;
      --amber:        #b45309;  /* burnt orange */
      --amber-dim:    #fed7aa;
      --red:          #9f1239;  /* rose burgundy */
      --red-dim:      #ffe4e6;
      --radius:       14px;
      --radius-sm:    8px;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .app { max-width: 480px; margin: 0 auto; padding: 0 0 40px; }

    /* ── Header ───────────────────────────────────────────────────── */
    .header {
      padding: 16px 16px 0;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
      border-bottom: 1px solid var(--border);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      text-decoration: none;
    }

    .back-link {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--text); }

    .page-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }

    /* ── Day pills ────────────────────────────────────────────────── */
    .day-pills {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 12px;
    }
    .day-pills::-webkit-scrollbar { display: none; }

    .day-pill {
      flex-shrink: 0;
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }
    .day-pill:hover { border-color: #303650; color: var(--text); }
    .day-pill.active { background: var(--surface-hover); border-color: #3b5bdb; color: var(--text); }

    /* ── Want chips (multi-select intent) ─────────────────────────── */
    .want-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px 0 4px;
    }
    .want-chip {
      flex: 0 1 auto;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .want-chip:hover { border-color: #3b5bdb; color: var(--text); }
    .want-chip.active {
      background: #3b5bdb;
      border-color: #3b5bdb;
      color: #fff;
    }
    .want-label {
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      padding: 4px 0 0;
    }

    /* ── Search controls ──────────────────────────────────────────── */
    .search-controls {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .sort-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-label {
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .sort-select {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 7px 10px;
      cursor: pointer;
      outline: none;
    }
    .sort-select:focus { border-color: #3b5bdb; }
    .sort-select option:disabled { color: var(--text-dim); }
    .sort-select.compact { flex: 0 0 auto; }

    .loc-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .location-label {
      flex: 1;
      font-size: 13px;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .loc-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      letter-spacing: 0.06em;
    }
    .loc-input:focus { border-color: #3b5bdb; }
    .loc-input::placeholder { color: var(--text-dim); font-family: 'DM Sans', sans-serif; letter-spacing: 0; }

    .update-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      padding: 7px 12px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .update-btn:hover { border-color: #3b5bdb; color: var(--text); }
    .update-btn.highlighted {
      background: #3b5bdb;
      border-color: #3b5bdb;
      color: #fff;
      font-weight: 600;
    }
    .update-btn.highlighted:hover { background: #4c6ef5; border-color: #4c6ef5; }

    /* ── Scout blurb ─────────────────────────────────────────────── */
    .top-card { padding: 12px 16px 0; }

    .scout-blurb {
      margin: 10px 16px 0;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-muted);
      cursor: pointer;
    }
    .scout-blurb.loading { animation: pulse 1.4s ease-in-out infinite; }

    /* Aggregated product chip strip — sits beneath the Scout blurb,
       chips reflect ANY condition firing across the visible beaches'
       next 7 days. */
    .product-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      margin: 8px 16px 0;
    }
    .product-chip {
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--advisory);
      text-decoration: none;
      white-space: nowrap;
    }
    .product-chip:hover { color: var(--blue); text-decoration: underline; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* ── Beach cards (index.html style) ───────────────────────────── */
    .beach-list {
      padding: 12px 16px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      display: grid;
      grid-template-columns: auto 1fr 20px;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .day-card:hover  { background: var(--surface-hover); border-color: #303650; }
    .day-card:active { transform: scale(0.99); }

    .day-card.status-go       { border-left: 3px solid var(--green); }
    .day-card.status-advisory { border-left: 3px solid var(--advisory); }
    .day-card.status-caution  { border-left: 3px solid var(--amber); }
    .day-card.status-no_go    { border-left: 3px solid var(--red); opacity: 0.7; }

    /* Tier-based display gates: 1+2 normal, 3 muted, 4 grey-no-dog.
       scoring_tier is the cost gate (daily/hourly/none); this is the
       display gate. */
    .day-card.tier-3_limited_access {
      opacity: 0.62;
      filter: grayscale(0.45);
    }
    .day-card.tier-4_no_dogs {
      opacity: 0.50;
      filter: grayscale(0.75);
      border-left-color: var(--text-dim) !important;
    }
    .day-card.tier-4_no_dogs .day-score-value::before { content: '🚫 '; }
    .day-card.tier-unknown {
      opacity: 0.55;
      filter: grayscale(0.55);
    }

    .day-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .rank-label {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      width: 20px;
      text-align: center;
    }

    .day-score {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
    }
    .day-score-value {
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      font-weight: 500;
      line-height: 1;
    }
    .day-score-label {
      font-family: 'DM Mono', monospace;
      font-size: 8px;
      font-weight: 500;
      letter-spacing: 0.06em;
      color: var(--text-dim);
      line-height: 1;
    }
    .day-score.score-go       .day-score-value { color: var(--green); }
    .day-score.score-advisory .day-score-value { color: var(--advisory); }
    .day-score.score-caution  .day-score-value { color: var(--amber); }
    .day-score.score-no_go    .day-score-value { color: var(--red); opacity: 0.6; }
    .day-score.score-none     .day-score-value { color: var(--text-dim); }

    .weather-icon { font-size: 22px; line-height: 1; text-align: center; }

    .day-content { min-width: 0; }

    .beach-name {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .window-sub {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px;
      margin-bottom: 3px;
    }
    .window-sub.status-go       { color: var(--green); }
    .window-sub.status-advisory { color: var(--advisory); }
    .window-sub.status-caution  { color: var(--amber); }
    .window-sub.status-no_go    { color: var(--red); }
    .window-sub.status-none     { color: var(--text-dim); }
    .dist-link { cursor: pointer; color: var(--text) !important; font-weight: 600; }
    .dist-link:hover { opacity: 0.8; }
    /* Row wrapping the window label + distance link for non-NOW cards.
       Window label and 🚗 X.X mi sit next to each other with a small gap,
       matching the visual density of the chip row below. */
    .window-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px;
    }
    .window-row .window-sub { margin-bottom: 0; }

    /* ── Directions modal ─────────────────────────────────────────── */
    .dir-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 299;
    }
    .dir-overlay.open { display: block; }

    .dir-sheet {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      padding: 16px 16px 36px;
      z-index: 300;
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .dir-sheet.open { display: flex; }

    #dir-map {
      width: 100%;
      height: 260px;
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg);
    }

    .dir-handle {
      width: 36px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto -4px;
    }

    .dir-beach {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      text-align: center;
    }

    .dir-meta {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
    }

    .dir-cancel {
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      cursor: pointer;
      text-align: center;
      padding: 4px;
    }
    .dir-cancel:hover { color: var(--text); }

    .bacteria-warning {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 3px;
    }
    .bacteria-warning.risk-moderate { background: rgba(251,191,36,0.15); color: var(--amber); }
    .bacteria-warning.risk-high     { background: rgba(239,68,68,0.15);  color: var(--red);   }

    .chips {
      display: flex;
      flex-wrap: nowrap;
      gap: 2px;
      align-items: center;
      overflow: hidden;
    }

    .chip {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 2px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .chip-sep { color: var(--text-dim); }
    .chip.chip-go       { color: var(--green); }
    .chip.chip-advisory { color: var(--advisory); }
    .chip.chip-caution  { color: var(--amber); }
    .chip.chip-no_go    { color: var(--red); }

    .chevron {
      color: var(--text-dim);
      font-size: 16px;
      line-height: 1;
      flex-shrink: 0;
    }

    /* ── States ───────────────────────────────────────────────────── */
    .no-data { padding: 40px 20px; text-align: center; font-size: 13px; color: var(--text-dim); }

    .skeleton {
      height: 88px;
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface-hover) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: var(--radius);
    }
    @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  </style>
</head>
<body>
<div class="app">

  <header class="header">
    <div class="header-top">
      <a href="index.html" class="wordmark">
        <img src="src/avatar.png" class="scout-trigger" alt="Scout" onclick="event.preventDefault();toggleChat()" title="Ask Scout">
        Dog Beach Scout
      </a>
      <a href="index.html" class="back-link">← Back</a>
    </div>
    <div class="page-title">Find Your Beach</div>
    <div class="day-pills" id="day-pills"></div>
  </header>

  <div class="search-controls">
    <div class="want-label">Show me</div>
    <div class="want-chips" id="want-chips">
      <button type="button" class="want-chip active" data-want="off_leash_beach">Off-leash beaches</button>
      <button type="button" class="want-chip" data-want="on_leash_beach">On-leash beaches</button>
      <button type="button" class="want-chip active" data-want="dog_park">Dog parks</button>
    </div>
    <div class="sort-row">
      <!-- Leash filter merged into want-chips (Off-leash beaches / On-leash beaches / Dog parks).
           Per [[dog-park-subpipeline-scope]] consumer-UI decision 2026-05-25. -->
      <select class="sort-select compact" id="leash-select" onchange="onLeashFilterChange(this.value)" style="display:none">
        <option value="any" selected>Any</option>
        <option value="off_leash">Off-leash</option>
        <option value="on_leash">Required</option>
      </select>
      <span class="sort-label">Within</span>
      <select class="sort-select compact" id="dist-select" onchange="onDistanceFilterChange(this.value)">
        <option value="5">5 mi</option>
        <option value="10" selected>10 mi</option>
        <option value="25">25 mi</option>
        <option value="50">50 mi</option>
        <option value="any">Any</option>
      </select>
      <span class="sort-label">Sort by</span>
      <select class="sort-select" id="sort-select" onchange="onSortChange(this.value)">
        <option value="blend"    id="opt-blend"    selected>Best Nearby</option>
        <option value="conditions">Best Conditions</option>
        <option value="distance" id="opt-distance" disabled>Closest First</option>
      </select>
    </div>
    <div class="loc-row" id="loc-row">
      <span class="location-label" id="location-label">📍 Detecting location…</span>
      <button class="update-btn" id="update-btn" onclick="onUpdateLocation()">Update</button>
    </div>
  </div>

  <div class="top-card" id="top-card"></div>
  <div class="scout-blurb loading" id="scout-blurb" onclick="toggleChat()">...</div>

  <!-- Aggregated product chip strip — populated by loadAggregatedChips()
       across all beaches × next 7 days. Hidden until at least one chip
       is rendered. -->
  <div class="product-chips" id="product-chips" style="display:none;"></div>

  <div class="beach-list" id="beach-list">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

</div>

<div class="dir-overlay" id="dir-overlay" onclick="closeDirections()"></div>
<div class="dir-sheet" id="dir-sheet">
  <div class="dir-handle"></div>
  <div class="dir-beach" id="dir-beach"></div>
  <div class="dir-meta" id="dir-meta"></div>
  <div id="dir-map"></div>
  <button class="dir-cancel" onclick="closeDirections()">Close</button>
</div>

<script>
  const SUPABASE_URL = 'https://ehlzbwtrsxaaukurekau.supabase.co';
  const ANON_KEY     = 'sb_publishable_lAg7YdZ3w7S5fN8jgiExKQ_3-KtW3xk';

  // ── State ──────────────────────────────────────────────────────────
  let beachCache  = {};   // { [date]: BeachFindRow[] } — one entry per date pill
  let nowBeaches  = null; // [{ beach, day }] — cached after first NOW fetch
  let userLat     = null;
  let userLng     = null;
  // 'blend' (Best Nearby) is the default sort. Falls back gracefully
  // when location isn't known (blendScore treats distance=null as 0.5
  // → monotonic in score, so it ranks like 'conditions' pre-location).
  let currentSort = 'blend';
  let leashFilter = 'any';

  // Wants: multi-select intent chips. Per [[dog-park-subpipeline-scope]]
  // 2026-05-25, the consumer UI is "Show me: [chips]" — Off-leash beaches,
  // On-leash beaches, Dog parks. URL ?want=a,b,c takes precedence; falls
  // back to localStorage; else default = off_leash_beach + dog_park
  // ("the off-leash dog experience").
  //
  // Back-compat: still honors legacy ?dest=beach|dog_park for shared links.
  const WANTS_KEY = 'find.wants';
  const ALL_WANTS = ['off_leash_beach', 'on_leash_beach', 'dog_park'];
  let wants = (() => {
    try {
      const params = new URLSearchParams(window.location.search);
      const urlWant = params.get('want');
      if (urlWant) {
        const set = new Set(urlWant.split(',').filter(w => ALL_WANTS.includes(w)));
        if (set.size > 0) return set;
      }
      // Legacy ?dest= → wants
      const urlDest = params.get('dest');
      if (urlDest === 'dog_park') return new Set(['dog_park']);
      if (urlDest === 'beach') return new Set(['off_leash_beach']);
      // localStorage
      const stored = localStorage.getItem(WANTS_KEY);
      if (stored) {
        const set = new Set(stored.split(',').filter(w => ALL_WANTS.includes(w)));
        if (set.size > 0) return set;
      }
      // Default: off-leash dog experience
      return new Set(['off_leash_beach', 'dog_park']);
    } catch { return new Set(['off_leash_beach', 'dog_park']); }
  })();
  let dogParkCache = {}; // { 'YYYY-MM-DD': [...DP rows] } — per-date forecast

  // Derived: what's the effective leash filter for beach queries?
  // - Both chips → 'any'
  // - Only off → 'off_leash'
  // - Only on → 'on_leash'
  // - Neither → 'any' (we won't fetch beaches at all)
  function effectiveBeachLeash() {
    const off = wants.has('off_leash_beach');
    const on = wants.has('on_leash_beach');
    if (off && on) return 'any';
    if (off) return 'off_leash';
    if (on) return 'on_leash';
    return 'any';
  }
  function wantsBeaches() { return wants.has('off_leash_beach') || wants.has('on_leash_beach'); }
  function wantsDogParks() { return wants.has('dog_park'); }

  // Distance filter (miles). 'any' = no cap. Default 10mi. URL ?max_mi=
  // takes precedence; falls back to localStorage; else 10. Numeric string
  // in URL = mi cap; 'any' = uncapped.
  const DIST_KEY = 'find.distanceFilterMi';
  let distanceFilterMi = (() => {
    try {
      const urlMi = new URLSearchParams(window.location.search).get('max_mi');
      if (urlMi === 'any') return 'any';
      const n = parseFloat(urlMi);
      if (!isNaN(n) && n > 0) return n;
      const stored = localStorage.getItem(DIST_KEY);
      if (stored === 'any') return 'any';
      const s = parseFloat(stored);
      return !isNaN(s) && s > 0 ? s : 10;
    } catch { return 10; }
  })();

  // Server-bounded nearest-N set. Client filters/sorts within this set.
  // GIST index on beaches.location makes the server query O(log N) at
  // any catalog size. 10 is enough to show top 5–7 after any sort mode.
  const NEAREST_LIMIT   = 10;
  const DISPLAY_LIMIT   = 10;

  // ── Day pills ──────────────────────────────────────────────────────
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d     = new Date(Date.now() + i * 86_400_000);
    const iso   = d.toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
    const label = i === 0 ? 'TDY' : i === 1 ? 'TMW'
                : d.toLocaleDateString('en-US', { timeZone: 'America/Los_Angeles', weekday: 'short' }).toUpperCase();
    days.push({ iso, label });
  }

  let selectedDate = 'now';

  const pillsEl = document.getElementById('day-pills');

  // NOW pill first
  const nowBtn = document.createElement('button');
  nowBtn.className = 'day-pill active';
  nowBtn.textContent = 'NOW';
  nowBtn.onclick = () => {
    document.querySelectorAll('.day-pill').forEach(p => p.classList.remove('active'));
    nowBtn.classList.add('active');
    selectedDate = 'now';
    sortAndRender();
  };
  pillsEl.appendChild(nowBtn);

  days.forEach(({ iso, label }) => {
    const btn = document.createElement('button');
    btn.className = 'day-pill' + (iso === selectedDate ? ' active' : '');
    btn.textContent = label;
    btn.onclick = () => {
      document.querySelectorAll('.day-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      selectedDate = iso;
      sortAndRender();
    };

    pillsEl.appendChild(btn);
  });

  // ── NOW mode ───────────────────────────────────────────────────────
  // Request-ID guard: each sortAndRender* invocation increments the
  // token. Stale async resumptions check the token before touching DOM
  // and bail silently — kills the "renders twice with different beaches"
  // flicker when geolocation lands mid-render. Per Franz 2026-05-19.
  let _renderToken = 0;

  function _sortCards(cards, mode) {
    if (mode === 'distance') {
      return [...cards].sort((a, b) => (a.distance ?? 9999) - (b.distance ?? 9999));
    }
    if (mode === 'blend') {
      const maxDist = Math.max(...cards.map(c => c.distance ?? 0), 1);
      return [...cards].sort((a, b) => blendScore(b, maxDist) - blendScore(a, maxDist));
    }
    return [...cards].sort((a, b) =>
      (b.day?.composite_score ?? 0) - (a.day?.composite_score ?? 0));
  }

  async function sortAndRenderNow() {
    const myToken = ++_renderToken;
    document.getElementById('top-card').innerHTML   = '<div class="skeleton"></div>';
    document.getElementById('beach-list').innerHTML =
      Array(4).fill('<div class="skeleton"></div>').join('');

    // Pull beach list via loadBeachesForDate so the spatial-bounded
    // nearest-N path is used consistently. distance_m is preserved so
    // NOW cards can render the car icon without the client-side haversine.
    const todayISO = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
    const beachList = (await loadBeachesForDate(todayISO))
      .map(b => ({ location_id: b.location_id, arena_group_id: b.arena_group_id, display_name: b.display_name, latitude: b.latitude, longitude: b.longitude, access_rule: b.access_rule, has_on_leash: b.has_on_leash, has_off_leash: b.has_off_leash, dogs_allowed: b.dogs_allowed, location_tier: b.location_tier, distance_m: b.distance_m, day_status: b.day_status, composite_score: b.composite_score }));
    if (myToken !== _renderToken) return;   // superseded

    // Sort by STATIC beach data first to pick the top-N candidates that
    // need live get-beach-now refinement. Skeleton stays up during the
    // fetch — no card render in this pass (would flicker when live
    // data re-sorts the top card). Per Franz 2026-05-19.
    const staticCards = beachList
      .filter(b => matchesLeashFilter(b))
      .map(b => ({
        beach:    b,
        day:      { composite_score: b.composite_score, day_status: b.day_status },
        distance: resolveDistanceMiles(b),
      }))
      .filter(c => matchesDistanceFilter(c.distance));
    const topN = _sortCards(staticCards, currentSort).slice(0, DISPLAY_LIMIT);

    // Fetch live get-beach-now for top-N only (was: every filtered
    // beach — 30-100 concurrent Edge calls, the "glacial" bottleneck).
    const hasScoring = b => b.day_status && b.day_status !== 'no_data';
    const refined = await Promise.all(topN.map(c =>
      hasScoring(c.beach)
        ? fetch(`${SUPABASE_URL}/functions/v1/get-beach-now?${c.beach.arena_group_id ? 'arena_group_id=' + c.beach.arena_group_id : 'location_id=' + c.beach.location_id}`,
            { headers: { 'Authorization': `Bearer ${ANON_KEY}` } })
            .then(r => r.json())
            .then(d => ({ ...c, day: nowToDay(d) || c.day }))
            .catch(() => c)
        : Promise.resolve(c)
    ));
    if (myToken !== _renderToken) return;   // superseded mid-fetch

    // Single render with live day data — no intermediate flicker.
    nowBeaches = refined;
    renderSorted(_sortCards(refined, currentSort));
  }

  function nowToDay(d) {
    if (!d || d.error) return null;
    return {
      is_now:             true,
      location_id:        d.location_id,
      arena_group_id:     d.arena_group_id,
      local_date:         d.local_date,
      day_status:         d.hour_status,
      best_window_label:  'Right now',
      best_window_status: d.hour_status,
      bacteria_risk:      'none',
      summary_weather:    wmoToSummaryWeather(d.weather_code, d.wind_speed),
      weather_code:       d.weather_code,
      composite_score:    d.hour_score,
      metric_statuses: {
        tide:  d.tide_status,
        wind:  d.wind_status,
        rain:  d.rain_status,
        crowd: d.crowd_status,
        temp:  d.temp_status,
        uv:    d.uv_status,
      },
      lowest_tide_height: d.tide_height,
      tide_direction:     d.tide_direction,
      avg_temp:           d.temp_air,
      avg_wind:           d.wind_speed,
      busyness_category:  d.busyness_category,
    };
  }

  function wmoToSummaryWeather(code, windSpeed) {
    if (windSpeed >= 20)           return 'windy';
    if (code === 0)                return 'sunny';
    if (code <= 2)                 return 'partly_cloudy';
    if (code === 3)                return 'cloudy';
    if (code >= 45 && code <= 48) return 'foggy';
    if (code >= 51)                return 'rainy';
    return 'partly_cloudy';
  }

  // ── Fetch beaches for a specific date (cached) ────────────────────
  // Passes lat/lng+limit when the user has a resolved location, so the
  // server returns only the nearest NEAREST_LIMIT beaches (GIST-indexed
  // KNN). Without coords, returns the full active set for score sorting.
  // ── Dog parks (Phase c — 2026-05-19) ──────────────────────────────
  async function loadDogParks(date) {
    // date: 'YYYY-MM-DD' (preferred) or null/'now' → server uses CURRENT_DATE
    const cacheKey = date || 'today';
    if (dogParkCache[cacheKey]) return dogParkCache[cacheKey];
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/nearest_dog_parks`,
        {
          method:  'POST',
          headers: {
            'apikey':        ANON_KEY,
            'Authorization': `Bearer ${ANON_KEY}`,
            'Content-Type':  'application/json',
          },
          body: JSON.stringify({
            p_lat:   userLat,
            p_lng:   userLng,
            p_limit: NEAREST_LIMIT,
            p_state: null,
            p_date:  date && date !== 'now' ? date : null,
          }),
        }
      );
      if (!res.ok) {
        const txt = await res.text();
        console.warn('nearest_dog_parks HTTP', res.status, txt);
        return [];
      }
      const rows = await res.json();
      // Only cache when call was anchored to a real location — null-coord
      // results have distance_miles=null and break the distance filter for
      // every subsequent location-anchored render.
      if (Array.isArray(rows) && userLat != null && userLng != null) dogParkCache[cacheKey] = rows;
      return rows ?? [];
    } catch (err) {
      console.warn('nearest_dog_parks fetch failed:', err);
      return [];
    }
  }

  function buildDogParkCard(dp, rank) {
    const safeName = (dp.name || 'Unnamed dog park').replace(/'/g, "\\'");
    const verified = dp.source === 'operator_posted' || dp.source === 'operator_posted_v2';
    // Leash is definitional for dog parks — hard-coded "Off-leash" label
    const leashLabel = '🐕 Off-leash';

    const hours = dp.hours_text
                || (dp.hours_open_time && dp.hours_close_time
                    ? `${dp.hours_open_time}–${dp.hours_close_time}`
                    : 'hours unknown');

    const distChip = dp.distance_miles != null
      ? `<div class="window-sub status-none dist-link" onclick="event.stopPropagation();openDirections(${dp.lat},${dp.lon},'${safeName}',${dp.distance_miles})">🚗 ${dp.distance_miles.toFixed(1)} mi</div>`
      : '';

    const operatorLine = verified && dp.operator_short
      ? `<div class="window-sub status-go">Verified: ${dp.operator_short}</div>`
      : verified
      ? `<div class="window-sub status-go">Operator-verified</div>`
      : `<div class="window-sub status-none" style="opacity:0.6">Default — not operator-verified</div>`;

    const chips = [];
    // Overlay wins over raw OSM
    const fence = dp.has_fence_overlay ?? dp.has_fence;
    const water = dp.has_drinking_water_overlay ?? dp.has_drinking_water;
    const surface = dp.surface_overlay ?? dp.surface;
    if (fence)              chips.push('<span class="chip chip-go">🚧 Fenced</span>');
    if (water)              chips.push('<span class="chip chip-go">💧 Water</span>');
    if (dp.double_gate)     chips.push('<span class="chip chip-go">🚪 Double-gate</span>');
    if (dp.small_dog_area)  chips.push('<span class="chip chip-go">🐶 Sm-dog</span>');
    if (dp.large_dog_area)  chips.push('<span class="chip chip-go">🐕‍🦺 Lg-dog</span>');
    if (dp.lighting)        chips.push('<span class="chip">💡 Lit</span>');
    if (surface)            chips.push(`<span class="chip">${surface}</span>`);
    const chipsHtml = chips.length
      ? `<div class="chips">${chips.join('<span class="chip-sep">·</span>')}</div>`
      : '';

    const status = verified ? 'go' : 'advisory';

    return `
      <div class="day-card status-${status}" onclick="window.location.href='dog-park.html?fid=${dp.fid}'">
        <div class="day-left">
          <div class="rank-label">#${rank}</div>
          <div class="day-score">
            <span class="day-score-value">🐾</span>
            <span class="day-score-label">DP</span>
          </div>
        </div>
        <div class="day-content">
          <div class="beach-name">${dp.name || 'Unnamed dog park'}</div>
          <div class="window-row">
            <div class="window-sub status-${verified ? 'go' : 'none'}">${leashLabel} · ${hours}</div>
            ${distChip}
          </div>
          ${operatorLine}
          ${chipsHtml}
        </div>
        <div class="chevron">›</div>
      </div>`;
  }

  async function sortAndRenderDogParks() {
    document.getElementById('top-card').innerHTML   = '<div class="skeleton"></div>';
    document.getElementById('beach-list').innerHTML =
      Array(4).fill('<div class="skeleton"></div>').join('');
    document.getElementById('product-chips').style.display = 'none';
    document.getElementById('day-pills').style.display     = 'none';

    let dps;
    try { dps = await loadDogParks(selectedDate); }
    catch {
      document.getElementById('beach-list').innerHTML =
        '<div class="no-data">Failed to load dog parks.</div>';
      return;
    }

    if (!dps.length) {
      document.getElementById('top-card').innerHTML   = '';
      document.getElementById('beach-list').innerHTML = '<div class="no-data">No dog parks nearby.</div>';
      return;
    }

    // Leash filter applies (off_leash/mixed/on_leash)
    let filtered = dps;
    if (leashFilter === 'off_leash')  filtered = dps.filter(d => d.leash_policy === 'off_leash' || d.leash_policy === 'off_leash_voice_control');
    else if (leashFilter === 'on_leash') filtered = dps.filter(d => d.leash_policy === 'on_leash');
    else if (leashFilter === 'mixed')    filtered = dps.filter(d => d.leash_policy === 'mixed');

    // Distance filter applies in DP mode too
    filtered = filtered.filter(d => matchesDistanceFilter(d.distance_miles));

    if (!filtered.length) {
      document.getElementById('top-card').innerHTML   = '';
      document.getElementById('beach-list').innerHTML = '<div class="no-data">No dog parks match those filters.</div>';
      return;
    }

    // Sort: distance if known; else verified-first then name
    const sorted = [...filtered].sort((a, b) => {
      if (a.distance_miles != null && b.distance_miles != null) return a.distance_miles - b.distance_miles;
      const av = a.source === 'operator_posted' ? 0 : 1;
      const bv = b.source === 'operator_posted' ? 0 : 1;
      if (av !== bv) return av - bv;
      return (a.name || '').localeCompare(b.name || '');
    }).slice(0, DISPLAY_LIMIT);

    const [first, ...rest] = sorted;
    document.getElementById('top-card').innerHTML   = buildDogParkCard(first, 1);
    document.getElementById('beach-list').innerHTML = rest.map((d, i) => buildDogParkCard(d, i + 2)).join('');

    // Replace scout blurb with static DP-mode caption (no LLM call)
    const blurb = document.getElementById('scout-blurb');
    blurb.classList.remove('loading');
    const verifiedCount = filtered.filter(d => d.source === 'operator_posted').length;
    blurb.textContent = verifiedCount
      ? `${filtered.length} dog parks nearby — ${verifiedCount} with operator-verified rules.`
      : `${filtered.length} dog parks nearby. Defaults assume off-leash inside fence (most US dog parks).`;
  }

  // ── Blended render (multi-chip selection includes both types) ────────
  // Fetches beaches + dog parks in parallel, normalizes both to a common
  // {kind, displayName, distance, score, status, ...renderData} shape,
  // ranks by composite_score (with the cross-type wobble noted in
  // [[dog-park-subpipeline-scope]] R5), interleaves heterogeneous cards.
  async function sortAndRenderBlended() {
    const myToken = ++_renderToken;
    document.getElementById('top-card').innerHTML   = '<div class="skeleton"></div>';
    document.getElementById('beach-list').innerHTML =
      Array(4).fill('<div class="skeleton"></div>').join('');
    document.getElementById('product-chips').style.display = 'none';

    const dateForBeach = selectedDate === 'now'
      ? new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' })
      : selectedDate;

    const [beaches, dps] = await Promise.all([
      loadBeachesForDate(dateForBeach).catch(() => []),
      loadDogParks(dateForBeach).catch(() => []),
    ]);
    if (myToken !== _renderToken) return;

    // Beach cards
    const beachCards = (beaches || [])
      .filter(b => matchesLeashFilter(b))
      .map(b => ({
        kind: 'beach',
        beach: b,
        day: beachToDay(b),
        distance: resolveDistanceMiles(b),
        score: b.composite_score ?? 0,
      }))
      .filter(c => matchesDistanceFilter(c.distance));

    // Dog park cards
    const dpCards = (dps || [])
      .filter(d => {
        // Apply leash chip filter to dog parks too — only relevant when
        // user selected on_leash_beach but NOT off_leash_beach + dog_park
        // is also selected. Most dog parks are off-leash by default.
        const off = wants.has('off_leash_beach');
        const on = wants.has('on_leash_beach');
        if (off && !on) return d.leash_policy === 'off_leash' || d.leash_policy === 'off_leash_voice_control';
        if (on && !off) return d.leash_policy === 'on_leash';
        return true;
      })
      .filter(d => matchesDistanceFilter(d.distance_miles))
      .map(d => ({
        kind: 'dog_park',
        dp: d,
        distance: d.distance_miles,
        // Real composite_score from AVG(hour_score). Falls back to verified
        // bias (75/60) only when no forecast row exists for this date.
        score: d.composite_score != null ? d.composite_score
             : (d.source === 'operator_posted' || d.source === 'operator_posted_v2') ? 75 : 60,
      }));

    // Merge + sort. Build a single comparator so both type-streams + the
    // final pass agree on ordering.
    const all = [...beachCards, ...dpCards];
    const maxDist = Math.max(...all.map(c => c.distance ?? 0), 1);
    const cmp = (a, b) => {
      if (currentSort === 'distance') return (a.distance ?? 9999) - (b.distance ?? 9999);
      if (currentSort === 'blend') {
        // Same blend formula for both types now that DP scores are real
        // composite_score values comparable to beach composite_score.
        const aS = blendScore({ day: { composite_score: a.score }, distance: a.distance }, maxDist);
        const bS = blendScore({ day: { composite_score: b.score }, distance: b.distance }, maxDist);
        return bS - aS;
      }
      return (b.score ?? 0) - (a.score ?? 0);
    };

    // Pre-sort each stream, then reserve min-N quota per type as a safety net.
    // With real composite scores both types are comparable, but a 10 vs 5 ratio
    // of beach:DP candidates can still wipe out the smaller stream on tied
    // scores. Quota guarantees mixed results.
    const sortedBeaches = [...beachCards].sort(cmp);
    const sortedDps     = [...dpCards].sort(cmp);
    const MIN_DP    = 2;
    const MIN_BEACH = 2;
    const reservedDps     = sortedDps.slice(0, Math.min(MIN_DP, sortedDps.length));
    const reservedBeaches = sortedBeaches.slice(0, Math.min(MIN_BEACH, sortedBeaches.length));
    const reserved = new Set([...reservedDps, ...reservedBeaches]);
    const remaining = [...sortedBeaches, ...sortedDps].filter(c => !reserved.has(c)).sort(cmp);
    const fillSlots = Math.max(0, DISPLAY_LIMIT - reserved.size);
    let sorted = [...reserved, ...remaining.slice(0, fillSlots)];
    sorted.sort(cmp);

    if (!sorted.length) {
      document.getElementById('top-card').innerHTML = '';
      document.getElementById('beach-list').innerHTML = '<div class="no-data">No matches in selected scope.</div>';
      return;
    }

    const renderCard = (c, i) => c.kind === 'beach'
      ? buildBeachCard(c, i + 1)
      : buildDogParkCard(c.dp, i + 1);

    document.getElementById('top-card').innerHTML = renderCard(sorted[0], 0);
    document.getElementById('beach-list').innerHTML = sorted.slice(1).map((c, i) => renderCard(c, i + 1)).join('');

    // Update scout blurb with mixed-type summary
    const blurb = document.getElementById('scout-blurb');
    blurb.classList.remove('loading');
    const nBeach = sorted.filter(c => c.kind === 'beach').length;
    const nDp = sorted.filter(c => c.kind === 'dog_park').length;
    blurb.textContent = `${nBeach} beach${nBeach !== 1 ? 'es' : ''} and ${nDp} dog park${nDp !== 1 ? 's' : ''} nearby.`;
  }

  async function loadBeachesForDate(date) {
    const cacheKey = date;
    if (beachCache[cacheKey]) return beachCache[cacheKey];
    const params = new URLSearchParams({ date });
    if (userLat !== null && userLng !== null) {
      params.set('lat',   String(userLat));
      params.set('lng',   String(userLng));
      params.set('limit', String(NEAREST_LIMIT));
    }
    // Edge Function default is scored=false (full catalog); opt in here.
    // scored=false (full catalog) so tier-4 no-dog beaches appear with the
    // 🚫 indicator + greyscale styling. Was scored=true which excluded all
    // beaches without scoring rows (i.e., tier 4). Per Franz 2026-05-25 —
    // famous beaches like Venice/Zuma should be discoverable even when dogs
    // aren't allowed. CSS .tier-4_no_dogs already styles the card.
    params.set('scored', 'false');
    const res  = await fetch(
      `${SUPABASE_URL}/functions/v1/get-beaches-find?${params}`,
      { headers: { 'Authorization': `Bearer ${ANON_KEY}` } }
    );
    const data = await res.json();
    if (Array.isArray(data.beaches)) beachCache[cacheKey] = data.beaches;
    return data.beaches ?? [];
  }

  // Convert flat get-beaches-find row into the day shape buildBeachCard expects
  function beachToDay(b) {
    if (!b.day_status || b.day_status === 'no_data') return null;
    return {
      day_status:         b.day_status,
      composite_score:    b.composite_score,
      best_window_label:  b.best_window_label,
      best_window_status: b.best_window_status,
      bacteria_risk:      b.bacteria_risk,
      summary_weather:    b.summary_weather,
      weather_code:       b.weather_code,
      lowest_tide_height: b.lowest_tide_height,
      avg_temp:           b.avg_temp,
      avg_wind:           b.avg_wind,
      busyness_category:  b.busyness_category,
      go_hours_count:     b.go_hours_count,
    };
  }

  // ── Sort and render ────────────────────────────────────────────────
  // Dispatches based on wants Set membership:
  //   - dog_park only       → existing sortAndRenderDogParks (DP-only render)
  //   - beach chip(s) only  → existing beach render with leashFilter from chips
  //   - dog_park + beach    → blended render (parallel fetch, merge by score)
  async function sortAndRender() {
    if (wantsDogParks() && !wantsBeaches()) {
      await sortAndRenderDogParks();
      return;
    }
    // Set leash filter from chips before the beach render reads it
    leashFilter = effectiveBeachLeash();
    // Beach (or blended) flow — restore day pills + chips that DP mode hides
    document.getElementById('day-pills').style.display = '';
    if (wantsDogParks() && wantsBeaches()) {
      await sortAndRenderBlended();
      return;
    }
    if (selectedDate === 'now') {
      await sortAndRenderNow();
      return;
    }

    // Fetch if not yet cached
    let beaches = beachCache[selectedDate];
    if (!beaches) {
      document.getElementById('top-card').innerHTML   = '<div class="skeleton"></div>';
      document.getElementById('beach-list').innerHTML =
        Array(4).fill('<div class="skeleton"></div>').join('');
      try {
        beaches = await loadBeachesForDate(selectedDate);
      } catch {
        document.getElementById('beach-list').innerHTML =
          '<div class="no-data">Failed to load beaches.</div>';
        return;
      }
    }

    // Build cards with server-or-client distance and leash filter
    const cards = beaches
      .filter(b => matchesLeashFilter(b))
      .map(b => ({
        beach:    b,
        day:      beachToDay(b),
        distance: resolveDistanceMiles(b),
      }))
      .filter(c => matchesDistanceFilter(c.distance));

    // Sort
    let sorted;
    if (currentSort === 'distance') {
      sorted = [...cards].sort((a, b) => (a.distance ?? 9999) - (b.distance ?? 9999));
    } else if (currentSort === 'blend') {
      const maxDist = Math.max(...cards.map(c => c.distance ?? 0), 1);
      sorted = [...cards].sort((a, b) => blendScore(b, maxDist) - blendScore(a, maxDist));
    } else {
      sorted = [...cards].sort((a, b) =>
        (b.day?.composite_score ?? 0) - (a.day?.composite_score ?? 0)
      );
    }

    renderSorted(sorted.slice(0, DISPLAY_LIMIT));
  }

  // ── Render sorted list: #1 above blurb, rest in list ──────────────
  function renderSorted(sorted) {
    renderSortedNoScout(sorted);
    if (sorted.length) loadScoutBlurb(sorted);
  }

  // Render without firing the Scout LLM — used by sortAndRenderNow's
  // Pass 1 (static-data render) so the LLM only fires after Pass 2's
  // live data is in. Otherwise we'd burn an LLM call per render token.
  function renderSortedNoScout(sorted) {
    if (!sorted.length) {
      document.getElementById('top-card').innerHTML   = '';
      document.getElementById('beach-list').innerHTML = '<div class="no-data">No data available.</div>';
      return;
    }
    const [first, ...rest] = sorted;
    document.getElementById('top-card').innerHTML   = buildBeachCard(first, 1);
    document.getElementById('beach-list').innerHTML = rest.map((c, i) => buildBeachCard(c, i + 2)).join('');
  }

  // ── Scout blurb ────────────────────────────────────────────────────
  const scoutCache = {};
  // Abort the prior in-flight LLM call when a new render fires. Prevents
  // stale chat responses from clobbering fresh-render text + saves the
  // wasted Anthropic call. Per Franz 2026-05-19.
  let _scoutAbortCtrl = null;

  async function loadScoutBlurb(sorted) {
    const first    = sorted[0];
    const cacheKey = `${first.beach.location_id}_${selectedDate}_${currentSort}`;
    const el       = document.getElementById('scout-blurb');
    el.classList.add('loading');
    el.textContent = '...';

    if (scoutCache[cacheKey]) {
      el.textContent = scoutCache[cacheKey];
      el.classList.remove('loading');
      return;
    }

    // Cancel any prior in-flight chat fetch
    if (_scoutAbortCtrl) _scoutAbortCtrl.abort();
    _scoutAbortCtrl = new AbortController();
    const myCtrl = _scoutAbortCtrl;

    // Full context with scores + distances for all sort modes
    const contextLines = sorted.slice(0, 5).map((c, i) => {
      const score   = c.day?.composite_score ?? '—';
      const status  = c.day?.day_status      ?? 'unknown';
      const distStr = c.distance != null ? `${c.distance.toFixed(1)} mi away` : 'distance unknown';
      return `${i + 1}. ${c.beach.display_name} (score: ${score}, status: ${status}, ${distStr})`;
    }).join('; ');

    const now       = new Date();
    const pacific   = new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', hour: 'numeric', minute: '2-digit', hour12: true });
    const timeStr   = pacific.format(now);
    const isToday   = selectedDate === 'now' || selectedDate === new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
    const dateLabel = isToday ? `right now (it is currently ${timeStr} Pacific — only consider remaining hours of today)` : `on ${selectedDate}`;
    let question;

    if (currentSort === 'conditions') {
      question = `Beach rankings by best conditions ${dateLabel}: ${contextLines}. In two sentences, explain why ${first.beach.display_name} is ranked #1 — what specific conditions (tide, temperature, wind, crowd, weather) make it the standout choice compared to the others?`;

    } else if (currentSort === 'distance') {
      // Check if a nearby beach has materially better conditions (15+ points higher score)
      const topScore   = first.day?.composite_score ?? 0;
      const betterNear = sorted.slice(1, 4).find(c =>
        c.day?.composite_score != null && (c.day.composite_score - topScore) >= 15
      );

      if (betterNear) {
        question = `Beaches sorted by distance from the user ${dateLabel}: ${contextLines}. The closest is ${first.beach.display_name} (${first.distance?.toFixed(1)} mi, score: ${topScore}). Note that ${betterNear.beach.display_name} is only ${betterNear.distance?.toFixed(1)} mi away but has a score of ${betterNear.day.composite_score}. In two sentences, acknowledge the closest beach but point out whether the short extra drive to ${betterNear.beach.display_name} is worth it given the conditions difference.`;
      } else {
        question = `Beaches sorted by distance from the user ${dateLabel}: ${contextLines}. The closest beach is ${first.beach.display_name} at ${first.distance?.toFixed(1)} mi with a score of ${topScore}. In two sentences, explain why ${first.beach.display_name} is a solid nearby choice — focus on its current conditions, not its ranking vs others.`;
      }

    } else {
      // Blend sort (50/50 conditions + proximity)
      question = `Beaches ranked by the best combination of conditions and proximity ${dateLabel}: ${contextLines}. In two sentences, explain why ${first.beach.display_name} hits the sweet spot — it's the best balance of being close and having good conditions compared to the other options.`;
    }

    try {
      const res  = await fetch(`${SUPABASE_URL}/functions/v1/beach-chat`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ANON_KEY}` },
        body:    JSON.stringify({ location_id: first.beach.location_id, question }),
        signal:  myCtrl.signal,
      });
      // If another loadScoutBlurb ran while we were waiting, bail
      if (myCtrl !== _scoutAbortCtrl) return;
      const data  = await res.json();
      if (myCtrl !== _scoutAbortCtrl) return;
      const text  = data.answer ?? '';
      scoutCache[cacheKey] = text;
      el.textContent = text;
    } catch (e) {
      if (e.name === 'AbortError') return;   // expected on supersede
      el.textContent = '';
    }
    el.classList.remove('loading');
  }

  // ── Build a beach card ─────────────────────────────────────────────
  function buildBeachCard({ beach, day, distance }, rank) {
    const status     = day?.day_status ?? 'no_go';
    const score      = day?.composite_score ?? null;
    const scoreClass = score !== null ? `score-${status}` : 'score-none';

    const scoreHtml = `
      <div class="day-score ${scoreClass}">
        <span class="day-score-value">${score !== null ? score : '—'}</span>
        <span class="day-score-label">SCORE</span>
      </div>`;

    const weatherIcon = getWeatherIcon(day?.summary_weather, day?.weather_code);

    const windowStatus = day?.best_window_status ?? status;
    const safeName = beach.display_name.replace(/'/g, "\\'");
    const distLink = distance !== null
      ? `<div class="window-sub status-none dist-link" onclick="event.stopPropagation();openDirections(${beach.latitude},${beach.longitude},'${safeName}',${distance})">🚗 ${distance.toFixed(1)} mi</div>`
      : '';

    let windowHtml;
    if (day?.is_now && distLink) {
      // NOW card with known location: distance replaces the "Right now" label.
      windowHtml = distLink;
    } else if (day?.is_now) {
      windowHtml = `<div class="window-sub status-${windowStatus}">Right now</div>`;
    } else {
      // Non-NOW: window label on the left, distance on the right, same row.
      const labelHtml = day?.best_window_label
        ? `<div class="window-sub status-${windowStatus}">${day.best_window_label}</div>`
        : `<div class="window-sub status-none">No good window</div>`;
      windowHtml = distLink
        ? `<div class="window-row">${labelHtml}${distLink}</div>`
        : labelHtml;
    }

    const bacteriaRisk = day?.bacteria_risk ?? 'none';
    const bacteriaHtml = bacteriaRisk === 'high'
      ? `<div class="bacteria-warning risk-high">⚠ 72h rain advisory</div>`
      : bacteriaRisk === 'moderate'
      ? `<div class="bacteria-warning risk-moderate">⚠ 72h rain advisory</div>`
      : '';

    const chips = buildChips(day, distance);

    // Tier class: display gate. T1+T2 render normally, T3 muted, T4
    // grey-no-dog. Falls back to 'tier-unknown' if the field isn't
    // populated (older client, edge cache, etc.).
    const tier = beach.location_tier ?? 'unknown';
    const tierClass = `tier-${tier}`;

    return `
      <div class="day-card status-${status} ${tierClass}" data-location-id="${beach.location_id}" onclick="window.location.href='detail.html?${beach.arena_group_id ? 'fid=' + beach.arena_group_id : 'location=' + beach.location_id}&date=${selectedDate}'">
        <div class="day-left">
          <div class="rank-label">#${rank}</div>
          ${scoreHtml}
          <div class="weather-icon">${weatherIcon}</div>
        </div>
        <div class="day-content">
          <div class="beach-name">${beach.display_name}</div>
          ${windowHtml}
          ${bacteriaHtml}
          <div class="chips">${chips}</div>
        </div>
        <div class="chevron">›</div>
      </div>`;
  }

  // ── Chips ──────────────────────────────────────────────────────────
  function chipClass(status) {
    if (!status || status === 'go') return 'chip-go';
    if (status === 'advisory')      return 'chip-advisory';
    if (status === 'caution')       return 'chip-caution';
    if (status === 'no_go')         return 'chip-no_go';
    return '';
  }

  function buildChips(day /* distance no longer a chip — rendered in window-row */) {
    const parts = [];
    const ms    = day?.metric_statuses ?? {};

    if (day?.lowest_tide_height != null) {
      const arrow = day.tide_direction === 'rising' ? '↑' : day.tide_direction === 'falling' ? '↓' : '';
      parts.push(`<span class="chip ${chipClass(ms.tide)}">🌊 ${parseFloat(day.lowest_tide_height).toFixed(1)}ft${arrow}</span>`);
    }
    if (day?.avg_temp != null) {
      parts.push(`<span class="chip ${chipClass(ms.temp)}">🌡 ${Math.round(day.avg_temp)}°</span>`);
    }
    if (day?.avg_wind != null) {
      parts.push(`<span class="chip ${chipClass(ms.wind)}">💨 ${Math.round(day.avg_wind)}mph</span>`);
    }
    if (day?.busyness_category) {
      const crowdLabel = {
        quiet:       '✌️ Quiet',
        moderate:    '⚖️ Mod',
        dog_party:   '🎉 Party',
        too_crowded: '🚫 Crowded',
      }[day.busyness_category] ?? day.busyness_category;
      parts.push(`<span class="chip ${chipClass(ms.crowd)}">${crowdLabel}</span>`);
    }

    return parts.join(`<span class="chip-sep">·</span>`);
  }

  // ── Weather icon ───────────────────────────────────────────────────
  function getWeatherIcon(summaryWeather, wmoCode) {
    const map = {
      sunny:         '☀️',
      partly_cloudy: '⛅',
      cloudy:        '☁️',
      foggy:         '🌫️',
      rainy:         '🌧️',
      windy:         '💨',
    };
    if (summaryWeather && map[summaryWeather]) return map[summaryWeather];
    if (wmoCode === 0)              return '☀️';
    if (wmoCode <= 2)               return '⛅';
    if (wmoCode === 3)              return '☁️';
    if (wmoCode <= 48)              return '🌫️';
    if (wmoCode <= 67)              return '🌧️';
    if (wmoCode <= 77)              return '🌨️';
    if (wmoCode <= 82)              return '🌧️';
    return '⛈️';
  }

  // ── Haversine distance (miles) ─────────────────────────────────────
  function haversine(lat1, lon1, lat2, lon2) {
    const R    = 3958.8;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a    = Math.sin(dLat / 2) ** 2 +
                 Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                 Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.asin(Math.sqrt(a));
  }

  // Prefer the server-provided distance_m (set by the find_beaches RPC
  // when lat/lng were passed). Falls back to client haversine using
  // userLat/userLng if the server didn't compute it. Returns miles or
  // null when neither source can produce a value.
  function resolveDistanceMiles(beach) {
    if (beach?.distance_m != null) return beach.distance_m / 1609.34;
    if (userLat !== null && userLng !== null && beach?.latitude != null && beach?.longitude != null) {
      return haversine(userLat, userLng, parseFloat(beach.latitude), parseFloat(beach.longitude));
    }
    return null;
  }

  // ── Blend score (higher = better) ─────────────────────────────────
  function blendScore({ day, distance }, maxDist) {
    const normScore = (day?.composite_score ?? 0) / 100;
    const normDist  = distance !== null ? 1 - (distance / maxDist) : 0.5;
    return (normScore + normDist) / 2;
  }

  // ── Location UI state ─────────────────────────────────────────────
  function showZipInput() {
    const row = document.getElementById('loc-row');
    row.innerHTML = `
      <input class="loc-input" id="loc-input" type="text" inputmode="numeric"
             maxlength="5" placeholder="Enter ZIP code"
             oninput="validateZipInput(this)" onkeydown="if(event.key==='Enter')onUpdateLocation()" />
      <button class="update-btn highlighted" id="update-btn" onclick="onUpdateLocation()">Update</button>`;
  }

  function showLocationLabel(text) {
    const row = document.getElementById('loc-row');
    row.innerHTML = `
      <span class="location-label" id="location-label">${text}</span>
      <button class="update-btn" id="update-btn" onclick="onUpdateLocation()">Update</button>`;
  }

  function validateZipInput(el) {
    el.value = el.value.replace(/\D/g, '').slice(0, 5);
  }

  // ── Update button handler ──────────────────────────────────────────
  function onUpdateLocation() {
    const input = document.getElementById('loc-input');
    if (input) {
      // ZIP mode — validate and geocode
      const zip = input.value.trim();
      if (!/^\d{5}$/.test(zip)) {
        input.style.borderColor = 'var(--red)';
        input.placeholder = '5 digits required';
        setTimeout(() => {
          input.style.borderColor = '';
          input.placeholder = 'Enter ZIP code';
        }, 1800);
        return;
      }
      geocodeZip(zip);
    } else {
      // Label mode — re-request geolocation
      requestGeolocation();
    }
  }

  // ── Geolocation ────────────────────────────────────────────────────
  function requestGeolocation() {
    showLocationLabel('📍 Detecting…');
    navigator.geolocation.getCurrentPosition(
      async pos => {
        setUserLocation(pos.coords.latitude, pos.coords.longitude);
        const name = await reverseGeocode(userLat, userLng);
        showLocationLabel('📍 ' + name);
        enableDistanceSorts();
        sortAndRender();
      },
      () => showZipInput()
    );
  }

  // ── ZIP geocoding ──────────────────────────────────────────────────
  async function geocodeZip(zip) {
    showLocationLabel('📍 Looking up ZIP…');
    try {
      const res  = await fetch(
        `https://nominatim.openstreetmap.org/search?postalcode=${zip}&countrycodes=us&format=json&limit=1`,
        { headers: { 'User-Agent': 'DogBeachScout/1.0' } }
      );
      const data = await res.json();
      if (!data[0]) { showZipInput(); return; }
      setUserLocation(parseFloat(data[0].lat), parseFloat(data[0].lon));
      showLocationLabel(`📍 ZIP ${zip}`);
      enableDistanceSorts();
      sortAndRender();
    } catch {
      showZipInput();
    }
  }

  // Updates the resolved user location and invalidates caches so the next
  // sortAndRender fetches a spatially-bounded result set instead of
  // reusing any location-less response already in the cache.
  function setUserLocation(lat, lng) {
    userLat = lat;
    userLng = lng;
    beachCache = {};
    nowBeaches = null;
    dogParkCache = {};
    Object.keys(scoutCache).forEach(k => delete scoutCache[k]);
  }

  // ── Reverse geocode ────────────────────────────────────────────────
  async function reverseGeocode(lat, lng) {
    try {
      const res  = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
        { headers: { 'User-Agent': 'DogBeachScout/1.0' } }
      );
      const data = await res.json();
      const city  = data.address?.city || data.address?.town || data.address?.village || '';
      const state = (data.address?.state_code || '').replace(/^US-/, '');
      return city && state ? `${city}, ${state}` : 'Your Location';
    } catch {
      return 'Your Location';
    }
  }

  // ── Enable distance sort options ───────────────────────────────────
  // Only 'opt-distance' (Closest First) needs location to be meaningful.
  // 'opt-blend' (Best Nearby) is enabled by default and degrades
  // gracefully to score-only when distance is unknown.
  function enableDistanceSorts() {
    document.getElementById('opt-distance').disabled = false;
  }

  function onSortChange(val) {
    currentSort = val;
    sortAndRender();
  }

  function onLeashFilterChange(val) {
    leashFilter = val;
    nowBeaches  = null; // reset NOW cache so filter applies
    sortAndRender();
  }

  // Toggle one want chip; persist + re-render.
  function onWantChipToggle(want) {
    if (!ALL_WANTS.includes(want)) return;
    if (wants.has(want)) {
      // Disallow deselecting the last chip — user must always have something selected
      if (wants.size <= 1) return;
      wants.delete(want);
    } else {
      wants.add(want);
    }
    persistWants();
    syncWantChipUI();
    dogParkCache = {};
    nowBeaches = null;
    sortAndRender();
  }

  function persistWants() {
    const arr = [...wants];
    try { localStorage.setItem(WANTS_KEY, arr.join(',')); } catch {}
    try {
      const url = new URL(window.location.href);
      url.searchParams.delete('dest'); // drop legacy
      // Default is off+dog_park → omit param when it matches default for cleaner URLs
      const defaultArr = ['off_leash_beach', 'dog_park'];
      const sameAsDefault = arr.length === defaultArr.length
        && defaultArr.every(w => arr.includes(w));
      if (sameAsDefault) url.searchParams.delete('want');
      else url.searchParams.set('want', arr.join(','));
      window.history.replaceState({}, '', url);
    } catch {}
  }

  function syncWantChipUI() {
    document.querySelectorAll('.want-chip').forEach(el => {
      const w = el.getAttribute('data-want');
      el.classList.toggle('active', wants.has(w));
    });
  }

  function onDistanceFilterChange(val) {
    distanceFilterMi = val === 'any' ? 'any' : parseFloat(val);
    try { localStorage.setItem(DIST_KEY, String(distanceFilterMi)); } catch {}
    try {
      const url = new URL(window.location.href);
      if (val === '10') url.searchParams.delete('max_mi');
      else url.searchParams.set('max_mi', val);
      window.history.replaceState({}, '', url);
    } catch {}
    nowBeaches = null;  // re-apply filter to NOW set
    sortAndRender();
  }

  // Distance filter predicate — returns true when item passes.
  // Items without a known distance pass through (no penalty for missing data).
  function matchesDistanceFilter(distanceMi) {
    if (distanceFilterMi === 'any') return true;
    if (distanceMi == null) return true;
    return distanceMi <= distanceFilterMi;
  }

  function matchesLeashFilter(beach) {
    if (leashFilter === 'any') return true;

    // Modern path — binary presence flags from beach_dog_policy
    // (find_beaches RPC returns has_on_leash + has_off_leash as of 2026-05-07).
    // Filter semantics:
    //   "off_leash" → user wants off-leash access → has_off_leash=T (any beach where off-leash is possible)
    //   "on_leash"  → user wants leashed-only beaches → has_on_leash=T AND has_off_leash !== T
    //   "mixed"     → user wants both modes available → both binaries=T
    const hasOn  = beach.has_on_leash;
    const hasOff = beach.has_off_leash;
    if (hasOn !== null && hasOn !== undefined && hasOff !== null && hasOff !== undefined) {
      if (leashFilter === 'off_leash') return hasOff === true;
      if (leashFilter === 'mixed')     return hasOn === true && hasOff === true;
      if (leashFilter === 'on_leash')  return hasOn === true && hasOff !== true;
    }

    // Legacy fallback — for beaches not yet promoted with binaries
    return (beach.access_rule ?? 'off_leash') === leashFilter;
  }

  // ── Directions modal (Leaflet + OSRM) ────────────────────────────
  let dirMap       = null;
  let routeLayer   = null;
  let markersLayer = null;

  async function openDirections(lat, lng, beachName, distance) {
    document.getElementById('dir-beach').textContent = beachName;
    document.getElementById('dir-meta').textContent  = distance != null ? `${distance.toFixed(1)} mi away` : '';
    document.getElementById('dir-overlay').classList.add('open');
    document.getElementById('dir-sheet').classList.add('open');

    // Init map once
    if (!dirMap) {
      dirMap = L.map('dir-map', { zoomControl: true, attributionControl: false });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
      }).addTo(dirMap);
    }

    // Clear previous layers
    if (routeLayer)   { dirMap.removeLayer(routeLayer);   routeLayer   = null; }
    if (markersLayer) { dirMap.removeLayer(markersLayer); markersLayer = null; }

    markersLayer = L.layerGroup().addTo(dirMap);

    // Beach marker
    const beachIcon = L.divIcon({
      html: '🏖️',
      className: '',
      iconSize: [28, 28],
      iconAnchor: [14, 14],
    });
    L.marker([lat, lng], { icon: beachIcon }).addTo(markersLayer);

    if (userLat !== null) {
      // User marker
      const userIcon = L.divIcon({
        html: '📍',
        className: '',
        iconSize: [24, 24],
        iconAnchor: [12, 24],
      });
      L.marker([userLat, userLng], { icon: userIcon }).addTo(markersLayer);

      // Fetch route from OSRM
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${userLng},${userLat};${lng},${lat}?overview=full&geometries=geojson`;
        const res  = await fetch(url);
        const data = await res.json();
        if (data.routes?.[0]) {
          routeLayer = L.geoJSON(data.routes[0].geometry, {
            style: { color: '#4c6ef5', weight: 4, opacity: 0.85 },
          }).addTo(dirMap);
          dirMap.fitBounds(routeLayer.getBounds(), { padding: [24, 24] });
        } else {
          dirMap.setView([lat, lng], 13);
        }
      } catch {
        dirMap.setView([lat, lng], 13);
      }
    } else {
      dirMap.setView([lat, lng], 13);
    }

    // Leaflet needs a size invalidation after the sheet animates in
    setTimeout(() => dirMap.invalidateSize(), 50);
  }

  function closeDirections() {
    document.getElementById('dir-overlay').classList.remove('open');
    document.getElementById('dir-sheet').classList.remove('open');
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDirections();
  });

  // ── Aggregated product chip strip ─────────────────────────────────
  // Single PostgREST fetch across all beaches × next 7 days. Any
  // condition firing anywhere in that window surfaces its product chip.
  // Bowl is the universal fallback so the strip is never empty.
  const CHIP_DEFS = {
    bowl:      { icon: '💧',  label: 'Collapsible Bowl', href: 'https://www.amazon.com/s?k=collapsible+dog+water+bowl' },
    ball:      { icon: '🦴',  label: 'Fetch Ball',       href: 'https://www.amazon.com/s?k=chuckit+ball+launcher' },
    towel:     { icon: '🛍️', label: 'Quick-Dry Towel',  href: 'https://www.amazon.com/s?k=microfiber+dog+towel' },
    sunscreen: { icon: '🌞',  label: 'Dog Sunscreen',    href: 'https://www.amazon.com/s?k=dog+sunscreen' },
    booties:   { icon: '👟',  label: 'Booties',          href: 'https://www.amazon.com/s?k=dog+boots+for+hot+sand' },
    leash:     { icon: '🐕',  label: 'Long Leash',       href: 'https://www.amazon.com/s?k=long+dog+training+leash' },
  };

  async function loadAggregatedChips() {
    const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
    const seventh = new Date(Date.now() + 6 * 86400000)
      .toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
    let rows;
    try {
      const r = await fetch(
        `${SUPABASE_URL}/rest/v1/beach_day_recommendations` +
        `?select=avg_uv,avg_temp,lowest_tide_height,bacteria_risk,busyness_category` +
        `&local_date=gte.${today}&local_date=lte.${seventh}`,
        { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` } });
      if (!r.ok) return;
      rows = await r.json();
    } catch { return; }
    if (!Array.isArray(rows) || rows.length === 0) return;

    // Day-level numeric thresholds mirror scoring_config severity bands
    // (no/caution/advisory): UV {11,8,6}, hot temp {95,85,80}, crowd
    // category, low tide {0, 0.5, 1.0}. Take max intensity across all
    // beach-days for each chip, filter > 0, sort desc, cap at 3.
    const num = (v) => v === null || v === undefined ? null : Number(v);
    const tier = (v, t) => v === null ? 0
                       : v >= t[0] ? 3 : v >= t[1] ? 2 : v >= t[2] ? 1 : 0;
    const tideTier  = (v) => v === null ? 0 : v <= 0 ? 3 : v <= 0.5 ? 2 : v <= 1.0 ? 1 : 0;
    const busyTier  = (c) => c === 'too_crowded' ? 3 : c === 'dog_party' ? 2 : 0;
    const swimSafe  = (d) => !d.bacteria_risk || d.bacteria_risk === 'none' || d.bacteria_risk === 'low';

    const maxBy = (fn) => rows.reduce((m, d) => Math.max(m, fn(d) ?? 0), 0);
    const uvInt    = maxBy(d => tier(num(d.avg_uv),   [11, 8, 6]));
    const tempInt  = maxBy(d => tier(num(d.avg_temp), [95, 85, 80]));
    const crowdInt = maxBy(d => busyTier(d.busyness_category));
    const tideInt  = maxBy(d => swimSafe(d) ? tideTier(num(d.lowest_tide_height)) : 0);

    const candidates = [
      { def: CHIP_DEFS.bowl,      intensity: 0.5 },
      { def: CHIP_DEFS.ball,      intensity: tideInt },
      { def: CHIP_DEFS.towel,     intensity: tideInt },
      { def: CHIP_DEFS.sunscreen, intensity: uvInt    },
      { def: CHIP_DEFS.booties,   intensity: tempInt  },
      { def: CHIP_DEFS.leash,     intensity: crowdInt },
    ];

    const chips = candidates
      .filter(c => c.intensity > 0)
      .sort((a, b) => b.intensity - a.intensity)
      .slice(0, 3);

    const el = document.getElementById('product-chips');
    el.innerHTML = chips.map(c =>
      `<a class="product-chip" href="${c.href}" target="_blank" rel="noopener noreferrer">[ ${c.icon} ${c.label} ]</a>`
    ).join('');
    el.style.display = '';
  }

  // ── Boot ───────────────────────────────────────────────────────────
  requestGeolocation();
  // Pre-fetch today so TDY pill is instant; warms beach list for NOW mode
  const _todayISO = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
  loadBeachesForDate(_todayISO);

  // Wire want-chip click handlers + sync initial visual state
  (function initWantChips() {
    syncWantChipUI();
    document.querySelectorAll('.want-chip').forEach(el => {
      el.addEventListener('click', () => onWantChipToggle(el.getAttribute('data-want')));
    });
  })();

  // Restore distance-filter select
  (function initDistSelect() {
    const el = document.getElementById('dist-select');
    if (el) el.value = distanceFilterMi === 'any' ? 'any' : String(distanceFilterMi);
  })();

  // Initial render dispatch — same dispatcher as user-triggered renders
  leashFilter = effectiveBeachLeash();
  if (wantsDogParks() && !wantsBeaches()) {
    sortAndRenderDogParks();
  } else if (wantsDogParks() && wantsBeaches()) {
    sortAndRenderBlended();
    loadAggregatedChips();
  } else {
    sortAndRenderNow();   // beach-only path
    loadAggregatedChips();
  }
</script>
<script>
  window.CHAT_CONFIG = {
    getLocationId: () => {
      const top = document.getElementById('top-card')?.querySelector('[data-location-id]');
      return top?.dataset.locationId ?? null;
    },
    placeholder: 'Which beach is best this weekend?',
  };
</script>
