<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find a Beach — Dog Beach Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/chat.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="">
<style>
  /* ── Tokens — matched to beach.html ─────────────────────────────── */
  :root {
    --bg:           #f8fafc;
    --card:         #ffffff;
    --card-sunk:    #f1f5f9;
    --text:         #0f2742;
    --text-muted:   #64748b;
    --text-dim:     #94a3b8;
    --border:       #e2e8f0;
    --border-soft:  #eef2f7;
    --accent:       #1d4ed8;
    --accent-soft:  rgba(29,78,216,0.10);
    --green:        #16a34a;
    --green-soft:   rgba(22,163,74,0.13);
    --amber:        #f59e0b;
    --amber-soft:   rgba(245,158,11,0.18);
    --red:          #dc2626;
    --red-soft:     rgba(220,38,38,0.13);
    --advisory:     #0369a1;
    --advisory-soft:rgba(3,105,161,0.10);
    --radius:       14px;
    --radius-sm:    10px;
    --radius-xs:    6px;
    --shadow-sm:    0 1px 2px rgba(15,39,66,0.04);
    --shadow-md:    0 6px 18px rgba(15,39,66,0.08);
    --shadow-lg:    0 18px 40px rgba(15,39,66,0.14);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 0 80px;
    min-height: 100vh;
  }

  /* ── Hero ───────────────────────────────────────────────────────── */
  header.hero {
    padding: 20px 18px 14px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 12px;
  }
  .wordmark {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--text);
    flex: 1; min-width: 0;
  }
  .wordmark-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; flex-shrink: 0;
    box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--accent-soft);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .wordmark-avatar:hover {
    transform: scale(1.05);
    box-shadow: 0 0 0 2px var(--card), 0 0 0 4px rgba(29,78,216,0.30);
  }
  .wordmark-label {
    font-family: 'DM Mono', monospace;
    font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-muted);
    line-height: 1.2;
  }
  .wordmark-title {
    font-family: 'Outfit', sans-serif;
    font-size: 17px; font-weight: 700; color: var(--text);
    line-height: 1.1;
  }
  .close-btn {
    color: var(--text-muted); text-decoration: none;
    font-size: 20px; line-height: 1;
    padding: 6px 8px; border-radius: 6px;
    flex-shrink: 0;
  }
  .close-btn:hover { background: var(--bg); color: var(--text); }

  /* ── Page heading band ──────────────────────────────────────────── */
  .page-band {
    padding: 18px 18px 6px;
  }
  .page-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .page-title {
    font-family: 'Outfit', sans-serif;
    font-size: 30px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.05;
    color: var(--text);
    margin: 0;
  }
  .page-title em {
    font-style: normal;
    color: var(--accent);
  }

  /* ── Search + filters strip ─────────────────────────────────────── */
  .search-strip {
    margin: 12px 14px 8px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }

  .search-bar {
    position: relative;
    display: flex; align-items: center;
  }
  .search-bar svg.search-icon {
    position: absolute;
    left: 11px;
    width: 16px; height: 16px;
    color: var(--text-muted);
    pointer-events: none;
  }
  .search-input {
    flex: 1;
    padding: 11px 14px 11px 36px;
    background: var(--card-sunk);
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    font: 500 14px/1.2 'DM Sans', sans-serif;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  .search-input::placeholder { color: var(--text-dim); font-weight: 400; }
  .search-input:focus {
    background: var(--card);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search-clear {
    position: absolute; right: 4px;
    background: transparent; border: 0;
    width: 28px; height: 28px;
    border-radius: 50%; cursor: pointer;
    color: var(--text-muted); font-size: 16px;
    display: none;
  }
  .search-clear:hover { background: var(--bg); color: var(--text); }
  .search-clear.visible { display: inline-flex; align-items: center; justify-content: center; }

  .filter-row {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 10px;
  }
  .filter-row-section {
    display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center;
  }
  .filter-divider {
    width: 1px; height: 22px;
    background: var(--border);
    margin: 0 4px;
    flex-shrink: 0;
  }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    font: 600 12.5px/1 'DM Sans', sans-serif;
    color: var(--text);
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .chip:hover { background: var(--bg); border-color: var(--text-dim); }
  .chip.active {
    background: var(--text);
    color: white;
    border-color: var(--text);
  }
  .chip.active:hover { background: #1e3a5f; }
  .chip .chip-icon { font-size: 13px; line-height: 1; }

  /* Amenity chip variant — softer when active so they don't compete
   * with want-chips visually. Want-chips dominate; amenity-chips refine. */
  .chip.chip-amenity.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }
  .chip.chip-amenity.active:hover { background: rgba(29,78,216,0.16); }

  .meta-row {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 10px; margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--border-soft);
    font-size: 12.5px; color: var(--text-muted);
  }
  .meta-row .meta-label {
    font-family: 'DM Mono', monospace;
    font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-muted);
  }
  .meta-select {
    padding: 5px 8px; border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: var(--card);
    font: 500 12.5px/1 'DM Sans', sans-serif;
    color: var(--text);
    cursor: pointer;
  }
  .meta-select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  .loc-pill {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: auto;
    padding: 4px 10px 4px 8px;
    background: var(--card-sunk);
    border-radius: 999px;
    font-size: 12.5px; color: var(--text);
    font-weight: 500;
    max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .loc-pill-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
    animation: locPulse 2.6s ease-in-out infinite;
  }
  @keyframes locPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(22,163,74,0.55); }
    60%      { box-shadow: 0 0 0 6px rgba(22,163,74,0);   }
  }
  .loc-pill-text {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .loc-link {
    color: var(--accent); font-size: 12px; font-weight: 600;
    background: transparent; border: 0; cursor: pointer;
    padding: 4px 6px; border-radius: 4px;
    font-family: inherit;
  }
  .loc-link:hover { background: var(--accent-soft); }

  .zip-input {
    width: 110px;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: var(--card);
    font: 500 13px/1.2 'DM Mono', monospace;
    color: var(--text);
    outline: none;
  }
  .zip-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* ── Map block ──────────────────────────────────────────────────── */
  .map-wrap {
    margin: 6px 14px 0;
    border-radius: var(--radius);
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--card);
    box-shadow: var(--shadow-sm);
  }
  #map {
    height: 38vh; min-height: 240px; max-height: 360px;
    width: 100%;
    background: #d9e7f0;
  }
  /* Custom Leaflet pin — score disc */
  .pin {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700;
    font-family: 'DM Mono', monospace;
    font-size: 12.5px; line-height: 1;
    box-shadow: 0 2px 4px rgba(15,39,66,0.25), 0 0 0 3px rgba(255,255,255,0.95);
    transform: translateY(-2px);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    font-variant-numeric: tabular-nums;
  }
  .pin:hover {
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 6px 12px rgba(15,39,66,0.32), 0 0 0 3px rgba(255,255,255,1);
  }
  .pin.pin-active {
    transform: translateY(-4px) scale(1.16);
    box-shadow: 0 8px 16px rgba(15,39,66,0.34), 0 0 0 4px white, 0 0 0 6px var(--accent);
    z-index: 800 !important;
  }
  .pin-go     { background: var(--green); }
  .pin-mid    { background: var(--amber); }
  .pin-low    { background: var(--red); }
  .pin-unk    { background: var(--text-dim); }
  .pin-park   { background: var(--accent); }
  .pin-park::after {
    content: '★';
    font-size: 11px;
    margin-left: 1px;
  }
  .pin-park .pin-park-score { display: none; }
  .pin-user {
    width: 22px; height: 22px;
    background: var(--advisory);
    border-radius: 50%;
    box-shadow: 0 0 0 4px white, 0 0 0 6px rgba(3,105,161,0.45);
    animation: userPulse 2.4s ease-out infinite;
  }
  @keyframes userPulse {
    0%, 100% { box-shadow: 0 0 0 4px white, 0 0 0 6px rgba(3,105,161,0.45); }
    50%      { box-shadow: 0 0 0 4px white, 0 0 0 12px rgba(3,105,161,0); }
  }

  /* ── "Now at you" weather strip ─────────────────────────────────── */
  .now-strip {
    margin: 14px 14px 4px;
    padding: 14px 16px;
    border-radius: var(--radius);
    background: linear-gradient(135deg, rgba(3,105,161,0.06) 0%, rgba(29,78,216,0.05) 100%);
    border: 1px solid rgba(3,105,161,0.18);
    box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 10px;
  }
  .now-strip.now-loading {
    opacity: 0.6;
  }
  .now-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .now-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--advisory);
  }
  .now-time {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .now-body {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px;
    align-items: center;
  }
  .now-icon {
    font-size: 42px; line-height: 1;
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    background: white;
    border-radius: 50%;
    box-shadow: var(--shadow-sm);
    flex-shrink: 0;
  }
  .now-figures {
    display: flex; flex-direction: column; gap: 2px;
    min-width: 0;
  }
  .now-temp {
    font-family: 'Outfit', sans-serif;
    font-size: 32px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .now-temp-deg { color: var(--text-muted); font-weight: 500; }
  .now-summary {
    font-size: 13px; color: var(--text);
    font-weight: 500;
  }
  .now-meta {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--text-muted);
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    font-variant-numeric: tabular-nums;
  }
  .now-cautions {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding-top: 8px;
    border-top: 1px dashed rgba(3,105,161,0.20);
  }
  .now-cautions:empty { display: none; }
  .caution-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11.5px; font-weight: 600;
    line-height: 1;
  }
  .caution-badge.sev-advisory { background: var(--advisory-soft); color: var(--advisory); }
  .caution-badge.sev-caution  { background: var(--amber-soft);    color: #92400e; }
  .caution-badge.sev-no_go    { background: var(--red-soft);      color: var(--red); }
  .caution-badge .caution-icon { font-size: 13px; line-height: 1; }

  /* ── Scout blurb ────────────────────────────────────────────────── */
  .scout-blurb {
    margin: 10px 14px 4px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-left: 3px solid var(--accent);
    font-size: 14px; line-height: 1.55;
    color: var(--text);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    opacity: 1;
    min-height: 44px;
    display: flex; align-items: center;
  }
  .scout-blurb:hover { background: #fbfcfe; }
  .scout-blurb:active { transform: translateY(1px); }
  .scout-blurb.loading {
    color: var(--text-muted);
    font-style: italic;
  }
  .scout-blurb.empty { display: none; }

  /* ── Result list ────────────────────────────────────────────────── */
  .results-head {
    margin: 18px 18px 8px;
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px;
  }
  .results-head h2 {
    font-family: 'Outfit', sans-serif;
    font-size: 17px; font-weight: 700;
    color: var(--text);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .results-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--text-muted);
    letter-spacing: 0.08em; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  .result-list {
    display: flex; flex-direction: column; gap: 8px;
    margin: 0 14px;
  }

  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: grid;
    grid-template-columns: 56px 1fr auto;
    gap: 12px;
    align-items: center;
    cursor: pointer;
    text-decoration: none; color: inherit;
    box-shadow: var(--shadow-sm);
    transition: transform 0.12s, box-shadow 0.15s, border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }
  .result-card::before {
    /* Status-tinted left edge accent */
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--border);
    transition: background 0.15s;
  }
  .result-card.tone-go::before     { background: var(--green); }
  .result-card.tone-mid::before    { background: var(--amber); }
  .result-card.tone-low::before    { background: var(--red); }
  .result-card.tone-park::before   { background: var(--accent); }
  .result-card:hover {
    transform: translateY(-1px);
    border-color: var(--text-dim);
    box-shadow: var(--shadow-md);
  }
  .result-card.highlight {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md);
    animation: highlightPulse 1.6s ease-out;
  }
  @keyframes highlightPulse {
    0%   { box-shadow: 0 0 0 0   var(--accent-soft), var(--shadow-md); }
    40%  { box-shadow: 0 0 0 14px rgba(29,78,216,0); var(--shadow-md); }
    100% { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md); }
  }

  /* Tier-4 (no dogs) — render muted so famous-but-prohibited beaches
   * stay discoverable without being mistaken for a recommendation. */
  .result-card.tier-4_no_dogs {
    background: var(--card-sunk);
    filter: grayscale(0.6);
    opacity: 0.78;
  }
  .result-card.tier-4_no_dogs:hover { opacity: 1; filter: grayscale(0.25); }

  .score-disc {
    width: 56px; height: 56px;
    border-radius: 50%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace;
    font-variant-numeric: tabular-nums;
    color: white;
    box-shadow: 0 2px 6px rgba(15,39,66,0.15);
    flex-shrink: 0;
  }
  .score-disc.tone-go     { background: var(--green); }
  .score-disc.tone-mid    { background: var(--amber); }
  .score-disc.tone-low    { background: var(--red); }
  .score-disc.tone-unk    { background: var(--text-dim); }
  .score-disc.tone-park   { background: var(--accent); }
  .score-disc .score-val  { font-size: 19px; font-weight: 700; line-height: 1; }
  .score-disc .score-lbl  {
    font-size: 8.5px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    opacity: 0.85;
    margin-top: 1px;
  }
  .score-disc.tone-unk .score-val { font-size: 22px; }

  .result-body {
    display: flex; flex-direction: column; gap: 4px;
    min-width: 0;
  }
  .result-name {
    font-family: 'Outfit', sans-serif;
    font-size: 16px; font-weight: 600;
    color: var(--text);
    letter-spacing: -0.005em;
    line-height: 1.2;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .result-meta {
    display: flex; flex-wrap: wrap; gap: 4px 10px;
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .result-meta .meta-dot { opacity: 0.5; }
  .result-meta .meta-dist {
    color: var(--text);
    font-weight: 500;
  }
  .result-meta .meta-window { color: var(--text); }
  .result-meta .meta-warn {
    color: var(--red); font-weight: 500;
  }
  /* Dog-hours chip — currently-prohibited = red, currently-allowed
   * (but with a daily window) = neutral. Pairs with the grey "Best"
   * disc on tier-3 limited-access beaches so the user sees both
   * "92 Best" + "🚫 Dogs out 10am–4:30pm" and understands the gap. */
  .result-meta .meta-doghours-out {
    color: var(--red); font-weight: 500;
  }
  .result-meta .meta-doghours-ok {
    color: var(--text); font-weight: 500;
  }

  .amenity-strip {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-top: 2px;
  }
  .amenity-strip:empty { display: none; }
  .amenity-dot {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 7px 2px 5px;
    border-radius: 999px;
    background: var(--card-sunk);
    font-size: 10.5px; font-weight: 600;
    color: var(--text-muted);
    line-height: 1.2;
  }
  .amenity-dot.match {
    background: var(--green-soft);
    color: #14532d;
  }
  .amenity-dot.match .dot-mark { color: var(--green); font-weight: 700; }
  .amenity-dot.miss {
    background: transparent;
    color: var(--text-dim);
    border: 1px dashed var(--border);
  }
  .amenity-dot .dot-mark { font-size: 11px; line-height: 1; }

  .result-end {
    display: flex; flex-direction: column; align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }
  .rank-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px; font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .chev {
    color: var(--text-dim);
    font-size: 22px; line-height: 1;
    transition: color 0.15s, transform 0.15s;
  }
  .result-card:hover .chev {
    color: var(--accent);
    transform: translateX(2px);
  }

  /* Empty / loading state */
  .skeleton {
    height: 86px;
    border-radius: var(--radius);
    background: linear-gradient(90deg, var(--card-sunk) 0%, #e8eef5 50%, var(--card-sunk) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .empty-state {
    padding: 40px 24px;
    text-align: center;
    color: var(--text-muted);
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }
  .empty-state .empty-icon {
    font-size: 32px;
    margin-bottom: 8px;
    opacity: 0.6;
  }
  .empty-state .empty-text {
    font-size: 14px;
  }

  /* Footer */
  .footer-note {
    margin: 24px 18px 0;
    font-family: 'DM Mono', monospace;
    font-size: 10.5px; color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.08em;
  }

  /* ── Directions overlay (reused pattern from prior find.html) ───── */
  .dir-overlay {
    position: fixed; inset: 0;
    background: rgba(15,39,66,0.55);
    backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    z-index: 1500;
  }
  .dir-overlay.open { opacity: 1; pointer-events: auto; }
  .dir-sheet {
    position: fixed;
    left: 50%; bottom: 0;
    transform: translate(-50%, 100%);
    width: 100%; max-width: 720px;
    background: var(--card);
    border-radius: 18px 18px 0 0;
    box-shadow: var(--shadow-lg);
    padding: 10px 14px 18px;
    z-index: 1600;
    transition: transform 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .dir-sheet.open { transform: translate(-50%, 0); }
  .dir-handle {
    width: 44px; height: 4px; border-radius: 2px;
    background: var(--border); margin: 4px auto 12px;
  }
  .dir-beach {
    font-family: 'Outfit', sans-serif;
    font-size: 17px; font-weight: 700;
    color: var(--text);
  }
  .dir-meta {
    font-family: 'DM Mono', monospace;
    font-size: 12px; color: var(--text-muted);
    margin: 2px 0 10px;
    font-variant-numeric: tabular-nums;
  }
  #dir-map {
    width: 100%; height: 50vh; min-height: 280px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: #d9e7f0;
  }
  .dir-cancel {
    margin-top: 12px;
    width: 100%;
    padding: 11px 14px;
    background: var(--text);
    color: white;
    border: 0; border-radius: var(--radius-sm);
    font: 600 14px/1 'DM Sans', sans-serif;
    cursor: pointer;
  }
  .dir-cancel:hover { background: #1e3a5f; }

  /* ── Phone (≤ 600px) ────────────────────────────────────────────── */
  @media (max-width: 600px) {
    .page-band     { padding: 14px 16px 4px; }
    .page-title    { font-size: 26px; }
    .search-strip  { margin: 10px 12px 6px; padding: 11px 12px; }
    .map-wrap      { margin: 6px 12px 0; }
    #map           { height: 36vh; min-height: 220px; }
    .now-strip     { margin: 12px 12px 4px; padding: 12px 14px; }
    .now-temp      { font-size: 28px; }
    .now-icon      { width: 48px; height: 48px; font-size: 36px; }
    .scout-blurb   { margin: 8px 12px 4px; padding: 10px 14px; font-size: 13.5px; }
    .results-head  { margin: 16px 16px 6px; }
    .result-list   { margin: 0 12px; }
    .result-card   { padding: 11px 12px; gap: 10px; grid-template-columns: 50px 1fr auto; }
    .score-disc    { width: 50px; height: 50px; }
    .score-disc .score-val { font-size: 17px; }
    .result-name   { font-size: 15px; }
  }

  /* ── Tablet+ (≥ 760px) ─────────────────────────────────────────── */
  @media (min-width: 760px) {
    #map { height: 44vh; max-height: 480px; }
    .page-title { font-size: 34px; }
  }

  /* Reduced motion — drop animations users didn't ask for */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    .pin, .result-card:hover, .chev { transition: none; }
  }
</style>

<div class="app">

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script>
  // ─── Config ─────────────────────────────────────────────────────────
  const SUPABASE_URL = 'https://ehlzbwtrsxaaukurekau.supabase.co';
  const ANON_KEY     = 'sb_publishable_lAg7YdZ3w7S5fN8jgiExKQ_3-KtW3xk';

  const DEFAULT_LAT  = 33.665;   // Huntington Dog Beach fallback
  const DEFAULT_LNG  = -118.015;
  const NEAREST_LIMIT = 14;
  const DISPLAY_LIMIT = 12;

  const LOC_CACHE_KEY = 'dogbeach.user_loc';
  const LOC_TTL_MS    = 24 * 60 * 60 * 1000;
  const WANTS_KEY     = 'find.wants';
  const AMENS_KEY     = 'find.amenities';
  const DIST_KEY      = 'find.distanceFilterMi';

  // ─── State ──────────────────────────────────────────────────────────
  let userLat = null;
  let userLng = null;
  let locationLabel = '';

  let wants = restoreWantsFromUrlOrStorage();
  let amenityFilters = restoreAmenitiesFromStorage();
  let distanceFilterMi = restoreDistanceFromStorage();
  let searchQuery = '';

  let beachResults = [];      // raw rows from get-beaches-find
  let dogParkResults = [];    // raw rows from nearest_dog_parks
  let lastRenderedCards = []; // mixed, ranked, filtered

  let nowAtUser = null;       // result of one-off Open-Meteo on user lat/lng
  let _scoutAbortCtrl = null;
  const scoutCache = {};

  let map = null;
  let pinsLayer = null;
  let userMarker = null;
  let activePinId = null;

  // ─── Restore helpers ────────────────────────────────────────────────
  function restoreWantsFromUrlOrStorage() {
    const ALL = ['off_leash_beach', 'on_leash_beach', 'dog_park'];
    try {
      const params = new URLSearchParams(window.location.search);
      const urlWant = params.get('want');
      if (urlWant) {
        const set = new Set(urlWant.split(',').filter(w => ALL.includes(w)));
        if (set.size) return set;
      }
      const stored = localStorage.getItem(WANTS_KEY);
      if (stored) {
        const set = new Set(stored.split(',').filter(w => ALL.includes(w)));
        if (set.size) return set;
      }
    } catch {}
    return new Set(['off_leash_beach', 'dog_park']);
  }
  function restoreAmenitiesFromStorage() {
    const ALL = ['parking', 'restrooms', 'water', 'shade'];
    try {
      const stored = localStorage.getItem(AMENS_KEY);
      if (stored) {
        const set = new Set(stored.split(',').filter(a => ALL.includes(a)));
        return set;
      }
    } catch {}
    return new Set();
  }
  function restoreDistanceFromStorage() {
    try {
      const urlMi = new URLSearchParams(window.location.search).get('max_mi');
      if (urlMi === 'any') return 'any';
      const n = parseFloat(urlMi);
      if (!Number.isNaN(n) && n > 0) return n;
      const stored = localStorage.getItem(DIST_KEY);
      if (stored === 'any') return 'any';
      const s = parseFloat(stored);
      return !Number.isNaN(s) && s > 0 ? s : 10;
    } catch { return 10; }
  }

  function persistWants() {
    try { localStorage.setItem(WANTS_KEY, [...wants].join(',')); } catch {}
    try {
      const url = new URL(window.location.href);
      if (wants.size) url.searchParams.set('want', [...wants].join(','));
      else url.searchParams.delete('want');
      window.history.replaceState({}, '', url);
    } catch {}
  }
  function persistAmenities() {
    try { localStorage.setItem(AMENS_KEY, [...amenityFilters].join(',')); } catch {}
  }
  function persistDistance() {
    try { localStorage.setItem(DIST_KEY, String(distanceFilterMi)); } catch {}
  }

  // ─── Location cache ─────────────────────────────────────────────────
  function _readCachedLocation() {
    try {
      const raw = localStorage.getItem(LOC_CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!Number.isFinite(obj?.lat) || !Number.isFinite(obj?.lng)) return null;
      if (typeof obj.ts !== 'number') return null;
      if (Date.now() - obj.ts > LOC_TTL_MS) return null;
      return obj;
    } catch { return null; }
  }
  function _saveCachedLocation(lat, lng, label) {
    try {
      localStorage.setItem(LOC_CACHE_KEY,
        JSON.stringify({ lat, lng, label, ts: Date.now() }));
    } catch {}
  }

  function setUserLocation(lat, lng, label) {
    userLat = lat;
    userLng = lng;
    if (label) locationLabel = label;
    document.getElementById('loc-pill-text').textContent =
      locationLabel || 'Saved location';
  }

  function setLocationLabelText(text) {
    document.getElementById('loc-pill-text').textContent = text;
  }

  // ─── Geolocation flow ───────────────────────────────────────────────
  function hydrateLocationFromCache() {
    const cached = _readCachedLocation();
    if (!cached) return false;
    setUserLocation(cached.lat, cached.lng, cached.label || 'Saved location');
    return true;
  }

  function requestGeolocation() {
    setLocationLabelText('Detecting…');
    if (!('geolocation' in navigator)) {
      _fallbackToDefault();
      return;
    }
    navigator.geolocation.getCurrentPosition(
      async pos => {
        const { latitude, longitude } = pos.coords;
        const name = await reverseGeocode(latitude, longitude).catch(() => 'Your location');
        setUserLocation(latitude, longitude, name);
        _saveCachedLocation(latitude, longitude, name);
        await loadEverything();
      },
      () => { showZipInput(); _fallbackToDefault(); },
      { timeout: 8000, maximumAge: 5 * 60 * 1000 }
    );
  }

  function _fallbackToDefault() {
    setUserLocation(DEFAULT_LAT, DEFAULT_LNG, 'Huntington (default)');
    loadEverything();
  }

  function showZipInput() {
    const link = document.getElementById('loc-link');
    link.outerHTML = `
      <input class="zip-input" id="zip-input" type="text" inputmode="numeric"
             maxlength="5" placeholder="ZIP"
             oninput="this.value=this.value.replace(/\\D/g,'').slice(0,5)"
             onkeydown="if(event.key==='Enter')submitZip()">
      <button class="loc-link" id="zip-go" onclick="submitZip()">Go</button>`;
  }

  async function submitZip() {
    const inp = document.getElementById('zip-input');
    if (!inp || !/^\d{5}$/.test(inp.value)) {
      if (inp) { inp.placeholder = '5 digits'; inp.style.borderColor = 'var(--red)'; }
      return;
    }
    const zip = inp.value;
    setLocationLabelText('Looking up ZIP…');
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?postalcode=${zip}&countrycodes=us&format=json&limit=1`,
        { headers: { 'User-Agent': 'DogBeachScout/1.0' } });
      const data = await res.json();
      if (!data[0]) { inp.style.borderColor = 'var(--red)'; return; }
      const lat = parseFloat(data[0].lat);
      const lng = parseFloat(data[0].lon);
      const label = `ZIP ${zip}`;
      setUserLocation(lat, lng, label);
      _saveCachedLocation(lat, lng, label);
      // Restore button shape after success
      document.getElementById('zip-input').remove();
      const go = document.getElementById('zip-go');
      go.outerHTML = `<button class="loc-link" id="loc-link" onclick="onUpdateLocation()">Update</button>`;
      await loadEverything();
    } catch {
      setLocationLabelText('Lookup failed');
    }
  }

  async function reverseGeocode(lat, lng) {
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&zoom=10`,
        { headers: { 'User-Agent': 'DogBeachScout/1.0' } });
      const data = await res.json();
      const addr = data?.address ?? {};
      const city = addr.city || addr.town || addr.village || addr.hamlet || addr.suburb;
      const state = addr.state ? abbrevState(addr.state) : null;
      if (city && state) return `${city}, ${state}`;
      if (city) return city;
      if (state) return state;
      return 'Your location';
    } catch { return 'Your location'; }
  }

  function abbrevState(name) {
    const map = {
      'Alabama':'AL','Alaska':'AK','Arizona':'AZ','Arkansas':'AR','California':'CA',
      'Colorado':'CO','Connecticut':'CT','Delaware':'DE','Florida':'FL','Georgia':'GA',
      'Hawaii':'HI','Idaho':'ID','Illinois':'IL','Indiana':'IN','Iowa':'IA','Kansas':'KS',
      'Kentucky':'KY','Louisiana':'LA','Maine':'ME','Maryland':'MD','Massachusetts':'MA',
      'Michigan':'MI','Minnesota':'MN','Mississippi':'MS','Missouri':'MO','Montana':'MT',
      'Nebraska':'NE','Nevada':'NV','New Hampshire':'NH','New Jersey':'NJ','New Mexico':'NM',
      'New York':'NY','North Carolina':'NC','North Dakota':'ND','Ohio':'OH','Oklahoma':'OK',
      'Oregon':'OR','Pennsylvania':'PA','Rhode Island':'RI','South Carolina':'SC',
      'South Dakota':'SD','Tennessee':'TN','Texas':'TX','Utah':'UT','Vermont':'VT',
      'Virginia':'VA','Washington':'WA','West Virginia':'WV','Wisconsin':'WI','Wyoming':'WY'
    };
    return map[name] || name;
  }

  function onUpdateLocation() {
    // Replace the pill with a small picker: either re-request browser geo or
    // open the ZIP entry directly. We just show the ZIP input — cleaner.
    showZipInput();
  }

  // ─── One-off "Now at you" weather ───────────────────────────────────
  async function loadNowAtUser() {
    if (userLat == null || userLng == null) return;
    const strip = document.getElementById('now-strip');
    strip.classList.add('now-loading');
    const url = `https://api.open-meteo.com/v1/forecast`
      + `?latitude=${userLat}&longitude=${userLng}`
      + `&current=temperature_2m,wind_speed_10m,wind_gusts_10m,weather_code,uv_index,relative_humidity_2m,precipitation,apparent_temperature`
      + `&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto`;
    try {
      const res = await fetch(url);
      const data = await res.json();
      const c = data.current ?? {};
      nowAtUser = {
        tempF:    c.temperature_2m,
        feelsF:   c.apparent_temperature,
        windMph:  c.wind_speed_10m,
        gustMph:  c.wind_gusts_10m,
        wmoCode:  c.weather_code,
        uv:       c.uv_index,
        rhPct:    c.relative_humidity_2m,
        precip:   c.precipitation,
        timeISO:  c.time,
        tz:       data.timezone,
      };
      renderNowAtUser();
    } catch {
      document.getElementById('now-summary').textContent = 'Sky reading unavailable.';
      strip.classList.remove('now-loading');
    }
  }

  function renderNowAtUser() {
    const strip = document.getElementById('now-strip');
    strip.classList.remove('now-loading');
    const n = nowAtUser; if (!n) return;
    document.getElementById('now-icon').textContent = wmoIcon(n.wmoCode);
    document.getElementById('now-temp-val').textContent = Math.round(n.tempF);
    document.getElementById('now-summary').textContent = nowSummary(n);
    const meta = [];
    if (n.feelsF != null && Math.abs(n.feelsF - n.tempF) >= 3) meta.push(`Feels ${Math.round(n.feelsF)}°`);
    if (n.windMph != null) meta.push(`Wind ${Math.round(n.windMph)} mph`);
    if (n.uv != null) meta.push(`UV ${n.uv.toFixed(1)}`);
    if (n.rhPct != null) meta.push(`RH ${Math.round(n.rhPct)}%`);
    document.getElementById('now-meta').innerHTML = meta
      .map(t => `<span>${t}</span>`).join(`<span class="meta-dot">·</span>`);
    // Local time
    if (n.timeISO) {
      const dt = new Date(n.timeISO);
      const fmt = new Intl.DateTimeFormat('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: true });
      document.getElementById('now-time').textContent = fmt.format(dt);
    }
    document.getElementById('now-cautions').innerHTML = buildCautionBadges(n);
  }

  function nowSummary(n) {
    const wmoLabel = WMO_LABELS[n.wmoCode] || 'Mild';
    if (n.windMph != null && n.windMph >= 20) return `${wmoLabel}, breezy.`;
    if (n.tempF != null && n.tempF >= 88) return `${wmoLabel}, hot for paws.`;
    if (n.tempF != null && n.tempF <= 40) return `${wmoLabel}, chilly.`;
    return `${wmoLabel}.`;
  }

  function buildCautionBadges(n) {
    const out = [];
    if (n.uv != null && n.uv >= 8) out.push({ sev:'caution', icon:'☀️', text:`High UV (${n.uv.toFixed(1)})` });
    else if (n.uv != null && n.uv >= 6) out.push({ sev:'advisory', icon:'☀️', text:`UV ${n.uv.toFixed(1)}` });
    if (n.windMph != null && n.windMph >= 22) out.push({ sev:'caution', icon:'💨', text:`Windy (${Math.round(n.windMph)} mph)` });
    else if (n.windMph != null && n.windMph >= 15) out.push({ sev:'advisory', icon:'💨', text:`Breezy (${Math.round(n.windMph)} mph)` });
    if (n.tempF != null && n.tempF >= 90) out.push({ sev:'caution', icon:'🌡️', text:`Hot sand (${Math.round(n.tempF)}°)` });
    if (n.tempF != null && n.tempF <= 38) out.push({ sev:'advisory', icon:'🥶', text:`Cold (${Math.round(n.tempF)}°)` });
    if (n.precip != null && n.precip > 0.05) out.push({ sev:'caution', icon:'🌧️', text:'Rain falling' });
    if (SEVERE_WMO.has(n.wmoCode)) out.push({ sev:'no_go', icon:'⛈️', text:'Severe weather' });
    return out.map(b =>
      `<span class="caution-badge sev-${b.sev}"><span class="caution-icon">${b.icon}</span>${b.text}</span>`
    ).join('');
  }

  // ─── WMO maps ────────────────────────────────────────────────────────
  const SEVERE_WMO  = new Set([63,64,65,66,67,71,72,73,74,75,76,77,82,95,96,97,98,99]);
  const CAUTION_WMO = new Set([45,48,51,53,55,56,57,61,80,81]);
  const WMO_LABELS = {
    0:'Clear', 1:'Mostly clear', 2:'Partly cloudy', 3:'Overcast',
    45:'Fog', 48:'Fog',
    51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
    56:'Freezing drizzle', 57:'Freezing drizzle',
    61:'Light rain', 63:'Rain', 65:'Heavy rain',
    66:'Freezing rain', 67:'Freezing rain',
    71:'Light snow', 73:'Snow', 75:'Heavy snow', 77:'Snow grains',
    80:'Light showers', 81:'Showers', 82:'Violent showers',
    95:'Thunderstorm', 96:'Thunderstorm', 99:'Thunderstorm',
  };
  function wmoIcon(code) {
    if (code == null) return '⛅';
    if (code === 0)              return '☀️';
    if (code <= 2)               return '⛅';
    if (code === 3)              return '☁️';
    if (code <= 48)              return '🌫️';
    if (code <= 67)              return '🌧️';
    if (code <= 77)              return '❄️';
    if (code <= 82)              return '🌧️';
    return '⛈️';
  }

  // ─── Fetch beaches + dog parks ──────────────────────────────────────
  async function loadBeaches() {
    const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
    const params = new URLSearchParams({ date: today, scored: 'false' });
    if (userLat != null && userLng != null) {
      params.set('lat',   String(userLat));
      params.set('lng',   String(userLng));
      params.set('limit', String(NEAREST_LIMIT));
    }
    try {
      const res = await fetch(
        `${SUPABASE_URL}/functions/v1/get-beaches-find?${params}`,
        { headers: { 'Authorization': `Bearer ${ANON_KEY}` } });
      const data = await res.json();
      beachResults = Array.isArray(data.beaches) ? data.beaches : [];
    } catch {
      beachResults = [];
    }
  }

  async function loadDogParks() {
    if (userLat == null || userLng == null) { dogParkResults = []; return; }
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/nearest_dog_parks`,
        {
          method: 'POST',
          headers: {
            'apikey':        ANON_KEY,
            'Authorization': `Bearer ${ANON_KEY}`,
            'Content-Type':  'application/json',
          },
          body: JSON.stringify({
            p_lat:   userLat,
            p_lng:   userLng,
            p_limit: NEAREST_LIMIT,
            p_state: null,
            p_date:  null,
          }),
        });
      if (!res.ok) { dogParkResults = []; return; }
      const rows = await res.json();
      dogParkResults = Array.isArray(rows) ? rows : [];
    } catch {
      dogParkResults = [];
    }
  }

  // ─── Normalize into common card shape ───────────────────────────────
  // Returns: { kind, id, fid?, location_id?, name, lat, lng, distanceMi,
  //           score, bestWindow, tone, bacteriaRisk, leashTag, amenities:{has_parking,has_restrooms,has_water,has_shade},
  //           tier, raw }
  function normalizeBeach(b) {
    // Disc semantics:
    //  - current_hour_score present → show it, colored tone (live signal)
    //  - current null, composite_score_v2 present → fall back to peak,
    //    rendered with tone-unk (grey) so users can tell it's a
    //    "best today, not right now" number. Tier-3 limited-access
    //    beaches (off-leash 6am-10am only) have null at noon — without
    //    the fallback they look unscored even though they're rated 92
    //    for their good hours. Per Franz 2026-06-07.
    //  - both null → truly unscored, show "—" with tone-unk.
    // Rank uses the same value so order matches displayed number.
    const score = b.current_hour_score ?? b.composite_score_v2 ?? null;
    const scoreIsCurrent = b.current_hour_score != null;
    const rankScore = score;
    const dMi = b.distance_m != null ? b.distance_m / 1609.34
              : (userLat != null && b.latitude != null
                  ? haversine(userLat, userLng, parseFloat(b.latitude), parseFloat(b.longitude))
                  : null);
    const tier = b.location_tier ?? 'unknown';
    return {
      kind: 'beach',
      id: `b:${b.arena_group_id ?? b.location_id}`,
      fid: b.arena_group_id ?? null,
      location_id: b.location_id ?? null,
      name: b.display_name || 'Beach',
      lat: parseFloat(b.latitude),
      lng: parseFloat(b.longitude),
      distanceMi: dMi,
      score,
      rankScore,
      scoreIsCurrent,
      bestWindow: b.best_window_label || null,
      tone: scoreIsCurrent ? scoreTone(score) : 'unk',
      bacteriaRisk: b.bacteria_risk ?? 'none',
      hasOffLeash: b.has_off_leash === true,
      hasOnLeash:  b.has_on_leash === true,
      // Amenity presence flags — from find_beaches RPC (extended
      // 2026-06-07 to LEFT JOIN beach_amenities). NULL when the beach
      // has no amenity row yet; consumer treats NULL as unknown.
      // has_shade not tracked for beaches — stays undefined.
      amenities: {
        parking:   b.has_parking,
        restrooms: b.has_restrooms,
        water:     b.has_drinking_water,
        shade:     undefined,
      },
      tier,
      // Dog hour exclusion — when the beach has a prohibited window,
      // surface a chip so users know WHY current_hour_score is null
      // (or why the disc shows "Best" grey at this hour). Computed
      // client-side using the beach's own timezone.
      dogHours: buildDogHoursChip(b),
      raw: b,
    };
  }

  // Returns { state, label, icon } or null. state ∈
  // 'always_no' | 'now_prohibited' | 'now_ok_window' | null.
  //   - always_no       → dogs_allowed='no' (Surfside Beach)
  //   - now_prohibited  → in the daily prohibition window right now
  //   - now_ok_window   → outside the prohibition window, but the beach
  //                       has one (worth telling users the cutoff)
  //   - null            → no prohibition / not enough data → no chip
  function buildDogHoursChip(b) {
    if (b?.dogs_allowed === 'no') {
      return { state: 'always_no', label: 'Dogs not allowed', icon: '🚫' };
    }
    const start = parseHHMM(b?.dogs_prohibited_start);
    const end   = parseHHMM(b?.dogs_prohibited_end);
    if (start == null && end == null) return null;
    const tz = b?.timezone || 'America/Los_Angeles';
    const nowH = currentLocalHour(tz);
    const startLbl = start != null ? fmtHourMin(start) : '?';
    const endLbl   = end   != null ? fmtHourMin(end)   : '?';
    // In-prohibition test: if both bounds known, normal range check.
    // If only start known (dogs prohibited from X onward — e.g. after-X)
    // treat now as prohibited when nowH >= start.
    let inProhib;
    if (start != null && end != null) {
      // Range may wrap midnight (unlikely but possible)
      if (start <= end) inProhib = nowH >= start && nowH < end;
      else              inProhib = nowH >= start || nowH < end;
    } else if (start != null) {
      inProhib = nowH >= start;
    } else {
      inProhib = nowH < end;
    }
    if (inProhib) {
      return {
        state: 'now_prohibited',
        label: start != null && end != null
          ? `Dogs out ${startLbl}–${endLbl}`
          : (start != null ? `Dogs out after ${startLbl}` : `Dogs out before ${endLbl}`),
        icon: '🚫',
      };
    }
    return {
      state: 'now_ok_window',
      label: start != null && end != null
        ? `Dogs out ${startLbl}–${endLbl}`
        : (start != null ? `Dogs out after ${startLbl}` : `Dogs out before ${endLbl}`),
      icon: '🐾',
    };
  }

  // Parse "HH:MM:SS" → minutes since midnight. Returns null when input
  // is null / malformed.
  function parseHHMM(s) {
    if (!s) return null;
    const m = String(s).match(/^(\d{1,2}):(\d{2})/);
    if (!m) return null;
    const h = parseInt(m[1], 10);
    const mi = parseInt(m[2], 10);
    if (!Number.isFinite(h) || !Number.isFinite(mi)) return null;
    return h * 60 + mi;
  }

  // Format minutes-since-midnight → "10am" or "4:30pm".
  function fmtHourMin(mins) {
    const h24 = Math.floor(mins / 60);
    const m   = mins % 60;
    const ap  = h24 >= 12 ? 'pm' : 'am';
    const h12 = h24 === 0 ? 12 : h24 > 12 ? h24 - 12 : h24;
    return m === 0 ? `${h12}${ap}` : `${h12}:${String(m).padStart(2,'0')}${ap}`;
  }

  // Compare current local time at a TZ to a minutes-since-midnight value.
  // Returns minutes-since-midnight at that TZ.
  function currentLocalHour(tz) {
    // Reuse minutes-since-midnight for the in-prohibition test so we
    // don't get rounding artifacts at half-hour cutoffs like 16:30.
    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false,
    }).formatToParts(new Date());
    const h = parseInt(parts.find(p => p.type === 'hour')?.value ?? '0', 10) % 24;
    const m = parseInt(parts.find(p => p.type === 'minute')?.value ?? '0', 10);
    return h * 60 + m;
  }

  function normalizeDogPark(dp) {
    // Dog parks don't carry a daily composite; score the disc as the
    // accent-park tone. distance_miles comes from the RPC.
    return {
      kind: 'dog_park',
      id: `p:${dp.fid}`,
      fid: dp.fid,
      location_id: null,
      name: dp.name || 'Unnamed dog park',
      lat: parseFloat(dp.lat),
      lng: parseFloat(dp.lon),
      distanceMi: dp.distance_miles ?? null,
      score: null,
      rankScore: null,
      bestWindow: dp.hours_text
                  || (dp.hours_open_time && dp.hours_close_time
                      ? `${dp.hours_open_time}–${dp.hours_close_time}`
                      : null),
      tone: 'park',
      bacteriaRisk: 'none',
      hasOffLeash: true,
      hasOnLeash:  false,
      // Dog-park amenities — from nearest_dog_parks RPC (extended
      // 2026-06-07 to surface has_shade + picnic_tables + water_play +
      // agility from dog_park_dog_policy). Parking + restrooms aren't
      // tracked at the policy layer → undefined → chip filter passes through.
      amenities: {
        parking:   undefined,
        restrooms: undefined,
        water:     dp.has_drinking_water,
        shade:     dp.has_shade,
      },
      verified: dp.source === 'operator_posted' || dp.source === 'operator_posted_v2',
      raw: dp,
    };
  }

  function scoreTone(s) {
    if (s == null) return 'unk';
    if (s >= 70)   return 'go';
    if (s >= 45)   return 'mid';
    return 'low';
  }

  // ─── Filter + rank ──────────────────────────────────────────────────
  function matchesSearch(card) {
    if (!searchQuery) return true;
    const q = searchQuery.toLowerCase();
    const name = (card.name || '').toLowerCase();
    if (name.includes(q)) return true;
    // Cheap city/region soft-match via raw fields if available
    const raw = card.raw || {};
    const blob = [raw.city, raw.county, raw.state, raw.region, raw.address_city]
      .filter(Boolean).join(' ').toLowerCase();
    return blob.includes(q);
  }

  function matchesDistance(card) {
    if (distanceFilterMi === 'any') return true;
    if (card.distanceMi == null) return true;
    return card.distanceMi <= distanceFilterMi;
  }

  function matchesWant(card) {
    if (card.kind === 'dog_park') return wants.has('dog_park');
    // Beach: depends on chips. Both off + on → either. Only off → has_off_leash.
    // Only on → has_on_leash && !has_off_leash. Neither → exclude beaches.
    const wantOff = wants.has('off_leash_beach');
    const wantOn  = wants.has('on_leash_beach');
    if (!wantOff && !wantOn) return false;
    if (wantOff && wantOn) return true;
    if (wantOff) return card.hasOffLeash;
    if (wantOn)  return card.hasOnLeash && !card.hasOffLeash;
    return true;
  }

  // Amenity hard-filter. Selected chip requires amenities[a] === true.
  // Unknown (undefined/null) passes through — beaches/parks not yet enriched
  // for this signal aren't punished, they just don't get the green ✓ dot.
  // Explicit false filters the entity out.
  //
  // Why hard not soft: composite_score_v2 ALREADY rewards amenities (the
  // bulk SQL apply adds +3 for parking, +4 for restrooms, +1 for drinking
  // water, etc., per 20260606f_apply_v2_best_window_bulk.sql). Soft-blending
  // here would double-count what the score already says. The chip's job is
  // "show me only ones with X" — a filter, not a rerank.
  function matchesAmenities(card) {
    if (amenityFilters.size === 0) return true;
    for (const a of amenityFilters) {
      const v = card.amenities?.[a];
      if (v === false) return false;
      // undefined / null → unknown, pass through
    }
    return true;
  }

  function buildRanked() {
    const all = [
      ...beachResults.map(normalizeBeach),
      ...dogParkResults.map(normalizeDogPark),
    ];
    const filtered = all
      .filter(matchesWant)
      .filter(matchesAmenities)
      .filter(matchesDistance)
      .filter(matchesSearch);
    if (!filtered.length) return [];
    // Sort by rankScore (current_hour_score if available, else today's
    // composite_score_v2 — both already amenity/feature-baked at the SQL
    // layer). Distance as tiebreaker so an equal-scored closer pick wins.
    // Dog parks have no v2 composite — anchor them at 60 (slightly above
    // neutral) so verified nearby parks can interleave alongside beaches.
    const sortKey = c => {
      if (c.kind === 'dog_park') return c.rankScore ?? 60;
      return c.rankScore != null ? c.rankScore : 0;
    };
    return [...filtered]
      .sort((a, b) => {
        const sa = sortKey(a), sb = sortKey(b);
        if (sb !== sa) return sb - sa;
        const da = a.distanceMi ?? Infinity;
        const db = b.distanceMi ?? Infinity;
        return da - db;
      })
      .slice(0, DISPLAY_LIMIT);
  }

  // ─── Distance helper ────────────────────────────────────────────────
  function haversine(lat1, lon1, lat2, lon2) {
    const R = 3958.8;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) ** 2;
    return R * 2 * Math.asin(Math.sqrt(a));
  }

  // ─── Render: result cards ───────────────────────────────────────────
  function renderCards() {
    const cards = buildRanked();
    lastRenderedCards = cards;

    const list = document.getElementById('result-list');
    const head = document.getElementById('results-count');

    if (!cards.length) {
      list.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">🐾</div>
          <div class="empty-text">No places match — try widening the radius or unpicking an amenity.</div>
        </div>`;
      head.textContent = '0 PLACES';
      renderPins([]);
      renderScoutBlurb(cards);
      return;
    }

    head.textContent = `${cards.length} PLACE${cards.length === 1 ? '' : 'S'}`;
    list.innerHTML = cards.map((c, i) => renderCardHTML(c, i + 1)).join('');
    list.querySelectorAll('[data-card-id]').forEach(el => {
      el.addEventListener('click', e => {
        // Don't navigate when the click was on the dist-link (directions trigger)
        if (e.target.closest('[data-dir]')) return;
        const id = el.getAttribute('data-card-id');
        const card = lastRenderedCards.find(c => c.id === id);
        if (card) navigateToCard(card);
      });
    });
    list.querySelectorAll('[data-dir]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const id = btn.getAttribute('data-dir');
        const card = lastRenderedCards.find(c => c.id === id);
        if (card) openDirections(card);
      });
    });

    renderPins(cards);
    renderScoutBlurb(cards);
  }

  function renderCardHTML(c, rank) {
    const tone = c.tone || 'unk';
    const toneClass = `tone-${tone}`;
    const tierClass = c.kind === 'beach' && c.tier ? `tier-${c.tier}` : '';

    // Disc label communicates which signal we're showing:
    //  - Park (dog parks, no daily composite)
    //  - Now (current_hour_score live signal, colored tone)
    //  - Best (composite_score_v2 fallback when current is null but
    //    today's peak is known — grey tone-unk; user sees a number
    //    but the label tells them it's not current)
    //  - No data (both null)
    const discLabel = c.kind === 'dog_park' ? 'Park'
                    : c.score == null       ? 'No data'
                    : c.scoreIsCurrent      ? 'Now'
                    :                          'Best';
    const scoreDiscInner = c.kind === 'dog_park'
      ? `<span class="score-val">★</span><span class="score-lbl">${discLabel}</span>`
      : `<span class="score-val">${c.score != null ? c.score : '—'}</span><span class="score-lbl">${discLabel}</span>`;

    const metaParts = [];
    if (c.distanceMi != null) {
      metaParts.push(`<span class="meta-dist" data-dir="${c.id}" style="cursor:pointer">🚗 ${c.distanceMi.toFixed(1)} mi</span>`);
    }
    if (c.bestWindow) {
      metaParts.push(`<span class="meta-window">${escapeHtml(c.bestWindow)}</span>`);
    } else if (c.kind === 'beach' && c.score != null) {
      metaParts.push(`<span class="meta-window" style="color:var(--text-dim)">No good window today</span>`);
    }
    if (c.bacteriaRisk === 'high' || c.bacteriaRisk === 'moderate') {
      metaParts.push(`<span class="meta-warn">⚠ 72h rain advisory</span>`);
    }
    // Dog-hours chip — explains the grey "Best" disc on tier-3
    // limited-access beaches at noon. now_prohibited = red, currently
    // OK (but with a cutoff coming) = neutral, always-no = red.
    if (c?.dogHours) {
      const cls = c.dogHours.state === 'now_ok_window' ? 'meta-doghours-ok' : 'meta-doghours-out';
      metaParts.push(`<span class="${cls}">${c.dogHours.icon} ${escapeHtml(c.dogHours.label)}</span>`);
    }
    const metaHtml = metaParts.join(`<span class="meta-dot">·</span>`);

    const amenityHtml = renderAmenityStrip(c);

    return `
      <a class="result-card ${toneClass} ${tierClass}"
         data-card-id="${c.id}"
         href="${navUrl(c)}"
         aria-label="${escapeAttr(c.name)} — rank ${rank}">
        <div class="score-disc ${toneClass}" aria-hidden="true">
          ${scoreDiscInner}
        </div>
        <div class="result-body">
          <div class="result-name">${escapeHtml(c.name)}</div>
          <div class="result-meta">${metaHtml}</div>
          ${amenityHtml}
        </div>
        <div class="result-end">
          <div class="rank-badge">#${rank}</div>
          <div class="chev">›</div>
        </div>
      </a>`;
  }

  function navUrl(c) {
    if (c.kind === 'dog_park') return `dog-park.html?fid=${c.fid}`;
    return c.fid
      ? `beach.html?fid=${c.fid}`
      : `beach.html?location_id=${c.location_id}`;
  }

  function navigateToCard(c) {
    window.location.href = navUrl(c);
  }

  function renderAmenityStrip(c) {
    if (amenityFilters.size === 0) return '';
    const lookup = {
      parking:   { icon:'🅿️', label:'Parking' },
      restrooms: { icon:'🚻', label:'Restrooms' },
      water:     { icon:'💧', label:'Water' },
      shade:     { icon:'🌳', label:'Shade' },
    };
    const dots = [];
    for (const a of amenityFilters) {
      const def = lookup[a]; if (!def) continue;
      const v = c.amenities?.[a];
      if (v === true) {
        dots.push(`<span class="amenity-dot match" title="${def.label}: yes"><span class="dot-mark">✓</span>${def.icon}</span>`);
      } else if (v === false) {
        dots.push(`<span class="amenity-dot miss" title="${def.label}: no"><span class="dot-mark">×</span>${def.icon}</span>`);
      } else {
        dots.push(`<span class="amenity-dot" title="${def.label}: unknown"><span class="dot-mark">?</span>${def.icon}</span>`);
      }
    }
    return `<div class="amenity-strip">${dots.join('')}</div>`;
  }

  function escapeHtml(s) {
    return String(s ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escapeAttr(s) {
    return escapeHtml(s).replace(/"/g, '&quot;');
  }

  // ─── Map ────────────────────────────────────────────────────────────
  function initMap() {
    if (map) return;
    map = L.map('map', {
      zoomControl: true,
      attributionControl: false,
      scrollWheelZoom: false,  // less aggressive on a scroll-heavy page
    });
    map.on('click', () => { /* tapping the map background clears highlight */
      activePinId = null;
      Array.from(document.querySelectorAll('.pin.pin-active'))
        .forEach(el => el.classList.remove('pin-active'));
    });
    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      maxZoom: 19,
      // Attribution control disabled above; required attribution still rendered
      // by the included <a> below the map if/when we add a credit row.
    }).addTo(map);
    map.setView([userLat ?? DEFAULT_LAT, userLng ?? DEFAULT_LNG], 11);

    if (userLat != null && userLng != null) {
      const ui = L.divIcon({ html: `<div class="pin-user"></div>`, className: '', iconSize: [22, 22], iconAnchor: [11, 11] });
      userMarker = L.marker([userLat, userLng], { icon: ui, zIndexOffset: 600 }).addTo(map);
    }
  }

  function renderPins(cards) {
    if (!map) return;
    if (pinsLayer) { map.removeLayer(pinsLayer); pinsLayer = null; }
    if (!cards.length) {
      if (userLat != null) map.setView([userLat, userLng], 11);
      return;
    }
    pinsLayer = L.layerGroup().addTo(map);
    const pts = [];
    cards.forEach((c, i) => {
      if (Number.isNaN(c.lat) || Number.isNaN(c.lng)) return;
      pts.push([c.lat, c.lng]);
      const isPark = c.kind === 'dog_park';
      const cls = isPark ? 'pin-park' : `pin-${c.tone}`;
      const inner = isPark
        ? `<span class="pin-park-score">${i + 1}</span>`
        : (c.score != null ? c.score : i + 1);
      const html = `<div class="pin ${cls}" data-pin-id="${c.id}">${inner}</div>`;
      const icon = L.divIcon({ html, className: '', iconSize: [34, 34], iconAnchor: [17, 17] });
      const marker = L.marker([c.lat, c.lng], { icon, riseOnHover: true });
      marker.on('click', () => onPinClick(c.id));
      marker.addTo(pinsLayer);
    });
    if (userLat != null) pts.push([userLat, userLng]);
    if (pts.length === 1) {
      map.setView(pts[0], 12);
    } else if (pts.length > 1) {
      const bounds = L.latLngBounds(pts);
      map.fitBounds(bounds, { padding: [36, 36], maxZoom: 13 });
    }
  }

  function onPinClick(cardId) {
    activePinId = cardId;
    Array.from(document.querySelectorAll('.pin'))
      .forEach(el => el.classList.toggle('pin-active', el.getAttribute('data-pin-id') === cardId));
    const card = document.querySelector(`.result-card[data-card-id="${cardId}"]`);
    if (card) {
      card.scrollIntoView({ behavior: 'smooth', block: 'center' });
      card.classList.add('highlight');
      setTimeout(() => card.classList.remove('highlight'), 1600);
    }
  }

  // ─── Scout blurb ────────────────────────────────────────────────────
  async function renderScoutBlurb(cards) {
    const el = document.getElementById('scout-blurb');
    if (!cards.length) {
      el.classList.add('empty');
      el.textContent = '';
      return;
    }
    el.classList.remove('empty');

    const first = cards[0];
    const contextLines = cards.slice(0, 5).map((c, i) => {
      const score = c.score != null ? c.score : 'park';
      const distStr = c.distanceMi != null ? `${c.distanceMi.toFixed(1)} mi` : 'distance n/a';
      return `${i + 1}. ${c.name} (${score}, ${distStr})`;
    }).join('; ');

    const cacheKey = JSON.stringify({
      first: first.id,
      wants: [...wants].sort(),
      amen: [...amenityFilters].sort(),
      dist: distanceFilterMi,
    });
    if (scoutCache[cacheKey]) {
      el.classList.remove('loading');
      el.textContent = scoutCache[cacheKey];
      return;
    }

    el.classList.add('loading');
    el.textContent = 'Scout is sniffing the wind…';

    if (_scoutAbortCtrl) _scoutAbortCtrl.abort();
    _scoutAbortCtrl = new AbortController();
    const myCtrl = _scoutAbortCtrl;

    const nowSummary = nowAtUser
      ? `It's ${Math.round(nowAtUser.tempF)}°F with ${WMO_LABELS[nowAtUser.wmoCode] || 'mixed sky'} where the user is.`
      : '';
    const amenitySummary = amenityFilters.size
      ? ` The user is filtering for ${[...amenityFilters].join(', ')}.`
      : '';

    const question = `${nowSummary}${amenitySummary} Ranked options: ${contextLines}. In two sentences, recommend ${first.name} (or — if its conditions are weak — call out a better trade-off from this list) and tell the owner what to expect there right now.`;

    // For dog-park first picks, we don't have a location_id to anchor
    // beach-chat to; fall back to the highest-ranked beach if one exists.
    const beachAnchor = cards.find(c => c.kind === 'beach');
    if (!beachAnchor) {
      el.classList.remove('loading');
      el.textContent = `Dog parks lead today — ${first.name} is your nearest verified park.`;
      scoutCache[cacheKey] = el.textContent;
      return;
    }

    try {
      const res  = await fetch(`${SUPABASE_URL}/functions/v1/beach-chat`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${ANON_KEY}` },
        body:    JSON.stringify({
          location_id: beachAnchor.location_id,
          arena_group_id: beachAnchor.fid,
          question,
        }),
        signal: myCtrl.signal,
      });
      if (myCtrl !== _scoutAbortCtrl) return;
      const data = await res.json();
      if (myCtrl !== _scoutAbortCtrl) return;
      const text = data.answer || '';
      scoutCache[cacheKey] = text;
      el.classList.remove('loading');
      el.textContent = text || `${first.name} is the standout right now.`;
    } catch (e) {
      if (e.name === 'AbortError') return;
      el.classList.remove('loading');
      el.textContent = '';
      el.classList.add('empty');
    }
  }

  // ─── Filter chip UI sync ────────────────────────────────────────────
  function syncWantChips() {
    document.querySelectorAll('#want-chips .chip').forEach(el => {
      el.classList.toggle('active', wants.has(el.getAttribute('data-want')));
    });
  }
  function syncAmenityChips() {
    document.querySelectorAll('#amenity-chips .chip').forEach(el => {
      el.classList.toggle('active', amenityFilters.has(el.getAttribute('data-amenity')));
    });
  }

  function onWantToggle(want) {
    if (wants.has(want)) wants.delete(want);
    else                 wants.add(want);
    // Don't let the user clear ALL want-chips — leave the last one on
    if (wants.size === 0) wants.add(want);
    persistWants();
    syncWantChips();
    renderCards();
  }
  function onAmenityToggle(amenity) {
    if (amenityFilters.has(amenity)) amenityFilters.delete(amenity);
    else                              amenityFilters.add(amenity);
    persistAmenities();
    syncAmenityChips();
    renderCards();
  }

  function onDistanceChange(val) {
    distanceFilterMi = val === 'any' ? 'any' : parseFloat(val);
    persistDistance();
    renderCards();
  }

  // ─── Search ─────────────────────────────────────────────────────────
  let _searchDebounce = null;
  function onSearchInput(value) {
    const clear = document.getElementById('search-clear');
    clear.classList.toggle('visible', !!value);
    if (_searchDebounce) clearTimeout(_searchDebounce);
    _searchDebounce = setTimeout(() => {
      searchQuery = (value || '').trim();
      renderCards();
    }, 120);
  }
  function clearSearch() {
    const inp = document.getElementById('search-input');
    inp.value = '';
    document.getElementById('search-clear').classList.remove('visible');
    searchQuery = '';
    renderCards();
    inp.focus();
  }

  // ─── Directions sheet ───────────────────────────────────────────────
  let dirMap = null, dirRoute = null, dirMarkers = null;
  async function openDirections(card) {
    const lat = card.lat, lng = card.lng;
    document.getElementById('dir-beach').textContent = card.name;
    const dist = card.distanceMi != null ? `${card.distanceMi.toFixed(1)} mi` : '';
    document.getElementById('dir-meta').textContent = dist;
    document.getElementById('dir-overlay').classList.add('open');
    document.getElementById('dir-sheet').classList.add('open');

    if (!dirMap) {
      dirMap = L.map('dir-map', { zoomControl: true, attributionControl: false });
      L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', { maxZoom: 19 })
        .addTo(dirMap);
    }
    if (dirRoute)   { dirMap.removeLayer(dirRoute);   dirRoute   = null; }
    if (dirMarkers) { dirMap.removeLayer(dirMarkers); dirMarkers = null; }
    dirMarkers = L.layerGroup().addTo(dirMap);

    const beachIcon = L.divIcon({
      html: `<div class="pin pin-${card.kind === 'dog_park' ? 'park' : (card.tone || 'unk')}">${card.kind === 'dog_park' ? '★' : (card.score ?? '•')}</div>`,
      className: '', iconSize: [34, 34], iconAnchor: [17, 17],
    });
    L.marker([lat, lng], { icon: beachIcon }).addTo(dirMarkers);

    if (userLat != null) {
      const userIcon = L.divIcon({ html: `<div class="pin-user"></div>`, className: '', iconSize: [22, 22], iconAnchor: [11, 11] });
      L.marker([userLat, userLng], { icon: userIcon }).addTo(dirMarkers);
      try {
        const url = `https://router.project-osrm.org/route/v1/driving/${userLng},${userLat};${lng},${lat}?overview=full&geometries=geojson`;
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes?.[0]) {
          dirRoute = L.geoJSON(data.routes[0].geometry, {
            style: { color: '#1d4ed8', weight: 4, opacity: 0.85 },
          }).addTo(dirMap);
          dirMap.fitBounds(dirRoute.getBounds(), { padding: [28, 28] });
        } else { dirMap.setView([lat, lng], 13); }
      } catch { dirMap.setView([lat, lng], 13); }
    } else {
      dirMap.setView([lat, lng], 13);
    }
    setTimeout(() => dirMap.invalidateSize(), 60);
  }

  function closeDirections() {
    document.getElementById('dir-overlay').classList.remove('open');
    document.getElementById('dir-sheet').classList.remove('open');
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDirections();
  });

  // ─── Orchestrator ───────────────────────────────────────────────────
  async function loadEverything() {
    // Parallel: beach list, dog-park list, user-coord weather
    await Promise.all([
      loadBeaches(),
      loadDogParks(),
      loadNowAtUser(),
    ]);
    initMap();
    if (userMarker) { try { map.removeLayer(userMarker); } catch {} userMarker = null; }
    if (userLat != null) {
      const ui = L.divIcon({ html: `<div class="pin-user"></div>`, className: '', iconSize: [22, 22], iconAnchor: [11, 11] });
      userMarker = L.marker([userLat, userLng], { icon: ui, zIndexOffset: 600 }).addTo(map);
    }
    renderCards();
  }

  // ─── Boot ───────────────────────────────────────────────────────────
  // Wire chips + selects
  syncWantChips();
  syncAmenityChips();
  document.getElementById('dist-select').value =
    distanceFilterMi === 'any' ? 'any' : String(distanceFilterMi);

  document.querySelectorAll('#want-chips .chip').forEach(el => {
    el.addEventListener('click', () => onWantToggle(el.getAttribute('data-want')));
  });
  document.querySelectorAll('#amenity-chips .chip').forEach(el => {
    el.addEventListener('click', () => onAmenityToggle(el.getAttribute('data-amenity')));
  });
  document.getElementById('search-input').addEventListener('input', e => onSearchInput(e.target.value));

  // Hydrate location → fetch
  if (hydrateLocationFromCache()) {
    loadEverything();
  } else {
    requestGeolocation();
  }
</script>

<script>
  // Scout chat anchors to the current top-ranked beach. Re-evaluates on each
  // render so the chat panel always opens against the freshest #1.
  window.CHAT_CONFIG = {
    getLocationId: () => {
      const first = lastRenderedCards.find(c => c.kind === 'beach');
      return first ? first.location_id : null;
    },
    placeholder: 'Which beach is best this weekend?',
  };
</script>
<script src="src/chat.js"></script>
</body>
</html>
