<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find a Beach — Dog Beach Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/chat.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="">
<style>
  /* ── Tokens — matched to index.html (sea fog / marine navy POV) ─── */
  :root {
    --bg:           #eef4f8;
    --card:         #ffffff;
    --card-sunk:    #f5f9fc;
    --text:         #0f2742;
    --text-muted:   #5b6b7d;
    --text-dim:     #94a3b8;
    --border:       #d1dde8;
    --border-soft:  #e2ecf3;
    --accent:       #0369a1;
    --accent-soft:  rgba(3,105,161,0.10);
    --green:        #15803d;
    --green-soft:   rgba(21,128,61,0.13);
    --amber:        #b45309;
    --amber-soft:   rgba(180,83,9,0.16);
    --red:          #9f1239;
    --red-soft:     rgba(159,18,57,0.13);
    --advisory:     #0369a1;
    --advisory-soft:rgba(3,105,161,0.10);
    --radius:       14px;
    --radius-sm:    10px;
    --radius-xs:    6px;
    --shadow-sm:    0 1px 2px rgba(15,39,66,0.04);
    --shadow-md:    0 6px 18px rgba(15,39,66,0.08);
    --shadow-lg:    0 18px 40px rgba(15,39,66,0.14);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 0 80px;
    min-height: 100vh;
  }

  /* ── Hero ───────────────────────────────────────────────────────── */
  header.hero {
    padding: 20px 18px 14px;
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 12px;
  }
  .wordmark {
    display: flex; align-items: center; gap: 10px;
    text-decoration: none; color: var(--text);
    flex: 1; min-width: 0;
  }
  .wordmark-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; flex-shrink: 0;
    box-shadow: 0 0 0 2px var(--card), 0 0 0 3px var(--accent-soft);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .wordmark-avatar:hover {
    transform: scale(1.05);
    box-shadow: 0 0 0 2px var(--card), 0 0 0 4px rgba(29,78,216,0.30);
  }
  .wordmark-label {
    font-family: 'DM Mono', monospace;
    font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-muted);
    line-height: 1.2;
  }
  .wordmark-title {
    font-family: 'Outfit', sans-serif;
    font-size: 17px; font-weight: 700; color: var(--text);
    line-height: 1.1;
  }
  .close-btn {
    color: var(--text-muted); text-decoration: none;
    font-size: 20px; line-height: 1;
    padding: 6px 8px; border-radius: 6px;
    flex-shrink: 0;
  }
  .close-btn:hover { background: var(--bg); color: var(--text); }

  /* ── Page heading band ──────────────────────────────────────────── */
  .page-band {
    padding: 18px 18px 6px;
  }
  .page-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .page-title {
    font-family: 'Outfit', sans-serif;
    font-size: 30px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1.05;
    color: var(--text);
    margin: 0;
  }
  .page-title em {
    font-style: normal;
    color: var(--accent);
  }

  /* ── Search + filters strip ─────────────────────────────────────── */
  .search-strip {
    margin: 12px 14px 8px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
  }

  .search-bar {
    position: relative;
    display: flex; align-items: center;
  }
  .search-bar svg.search-icon {
    position: absolute;
    left: 11px;
    width: 16px; height: 16px;
    color: var(--text-muted);
    pointer-events: none;
  }
  .search-input {
    flex: 1;
    padding: 11px 14px 11px 36px;
    background: var(--card-sunk);
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    font: 500 14px/1.2 'DM Sans', sans-serif;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  .search-input::placeholder { color: var(--text-dim); font-weight: 400; }
  .search-input:focus {
    background: var(--card);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .search-clear {
    position: absolute; right: 4px;
    background: transparent; border: 0;
    width: 28px; height: 28px;
    border-radius: 50%; cursor: pointer;
    color: var(--text-muted); font-size: 16px;
    display: none;
  }
  .search-clear:hover { background: var(--bg); color: var(--text); }
  .search-clear.visible { display: inline-flex; align-items: center; justify-content: center; }

  /* ── Day pills (NOW + 7-day forecast) ───────────────────────────── */
  .day-pills {
    margin: 8px 14px 0;
    padding: 8px 4px;
    display: flex; gap: 6px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .day-pills::-webkit-scrollbar { display: none; }
  .day-pill {
    flex: 0 0 auto;
    display: inline-flex; flex-direction: column;
    align-items: center; gap: 1px;
    min-width: 48px;
    padding: 7px 10px 6px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.12s;
    scroll-snap-align: start;
    font-family: 'DM Mono', monospace;
  }
  .day-pill:hover { background: var(--bg); border-color: var(--text-dim); color: var(--text); }
  .day-pill .day-pill-label {
    font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    line-height: 1;
  }
  .day-pill .day-pill-num {
    font-family: 'Outfit', sans-serif;
    font-size: 15px; font-weight: 700; color: var(--text);
    line-height: 1.05; letter-spacing: -0.01em;
    font-variant-numeric: tabular-nums;
  }
  .day-pill.active {
    background: var(--advisory);
    border-color: var(--advisory);
    color: white;
  }
  .day-pill.active .day-pill-num { color: white; }
  .day-pill.active .day-pill-label { color: rgba(255,255,255,0.85); }
  .day-pill.now-pill .day-pill-num::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 5px;
    transform: translateY(-2px);
    animation: nowDot 1.8s ease-in-out infinite;
  }
  .day-pill.now-pill.active .day-pill-num::before {
    background: #fde68a;
    box-shadow: 0 0 6px rgba(253,230,138,0.8);
  }
  @keyframes nowDot {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }

  .filter-row {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-top: 10px;
  }
  .filter-row-section {
    display: flex; flex-wrap: wrap; gap: 6px;
    align-items: center;
  }
  .filter-divider {
    width: 1px; height: 22px;
    background: var(--border);
    margin: 0 4px;
    flex-shrink: 0;
  }

  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 11px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--card);
    font: 600 12.5px/1 'DM Sans', sans-serif;
    color: var(--text);
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .chip:hover { background: var(--bg); border-color: var(--text-dim); }
  .chip.active {
    background: var(--text);
    color: white;
    border-color: var(--text);
  }
  .chip.active:hover { background: #1e3a5f; }
  .chip .chip-icon { font-size: 13px; line-height: 1; }

  /* Amenity chip variant — softer when active so they don't compete
   * with want-chips visually. Want-chips dominate; amenity-chips refine. */
  .chip.chip-amenity.active {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: var(--accent);
  }
  .chip.chip-amenity.active:hover { background: rgba(29,78,216,0.16); }

  .meta-row {
    display: flex; flex-wrap: wrap; align-items: center;
    gap: 10px; margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--border-soft);
    font-size: 12.5px; color: var(--text-muted);
  }
  .meta-row .meta-label {
    font-family: 'DM Mono', monospace;
    font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--text-muted);
  }
  .meta-select {
    padding: 5px 8px; border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: var(--card);
    font: 500 12.5px/1 'DM Sans', sans-serif;
    color: var(--text);
    cursor: pointer;
  }
  .meta-select:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  .loc-pill {
    display: inline-flex; align-items: center; gap: 6px;
    margin-left: auto;
    padding: 4px 10px 4px 8px;
    background: var(--card-sunk);
    border-radius: 999px;
    font-size: 12.5px; color: var(--text);
    font-weight: 500;
    max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .loc-pill-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
    animation: locPulse 2.6s ease-in-out infinite;
  }
  @keyframes locPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(22,163,74,0.55); }
    60%      { box-shadow: 0 0 0 6px rgba(22,163,74,0);   }
  }
  .loc-pill-text {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .loc-link {
    color: var(--accent); font-size: 12px; font-weight: 600;
    background: transparent; border: 0; cursor: pointer;
    padding: 4px 6px; border-radius: 4px;
    font-family: inherit;
  }
  .loc-link:hover { background: var(--accent-soft); }

  .zip-input {
    width: 110px;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: var(--card);
    font: 500 13px/1.2 'DM Mono', monospace;
    color: var(--text);
    outline: none;
  }
  .zip-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* ── Map block — beach.html parity (200px fixed, contained) ─────── */
  .map-wrap {
    margin: 6px 14px 0;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--card);
  }
  #map {
    height: 200px;
    width: 100%;
    background: #d9e7f0;
  }
  /* Custom Leaflet pin — score disc */
  .pin {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700;
    font-family: 'DM Mono', monospace;
    font-size: 12.5px; line-height: 1;
    box-shadow: 0 2px 4px rgba(15,39,66,0.25), 0 0 0 3px rgba(255,255,255,0.95);
    transform: translateY(-2px);
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    font-variant-numeric: tabular-nums;
  }
  .pin:hover {
    transform: translateY(-4px) scale(1.08);
    box-shadow: 0 6px 12px rgba(15,39,66,0.32), 0 0 0 3px rgba(255,255,255,1);
  }
  .pin.pin-active {
    transform: translateY(-4px) scale(1.16);
    box-shadow: 0 8px 16px rgba(15,39,66,0.34), 0 0 0 4px white, 0 0 0 6px var(--accent);
    z-index: 800 !important;
  }
  .pin-go     { background: var(--green); }
  .pin-mid    { background: var(--amber); }
  .pin-low    { background: var(--red); }
  .pin-unk    { background: var(--text-dim); }
  .pin-park   { background: var(--accent); }
  .pin-park::after {
    content: '★';
    font-size: 11px;
    margin-left: 1px;
  }
  .pin-park .pin-park-score { display: none; }
  .pin-user {
    width: 22px; height: 22px;
    background: var(--advisory);
    border-radius: 50%;
    box-shadow: 0 0 0 4px white, 0 0 0 6px rgba(3,105,161,0.45);
    animation: userPulse 2.4s ease-out infinite;
  }
  @keyframes userPulse {
    0%, 100% { box-shadow: 0 0 0 4px white, 0 0 0 6px rgba(3,105,161,0.45); }
    50%      { box-shadow: 0 0 0 4px white, 0 0 0 12px rgba(3,105,161,0); }
  }

  /* ── "Now at you" weather strip ─────────────────────────────────── */
  .now-strip {
    margin: 14px 14px 4px;
    padding: 14px 16px;
    border-radius: var(--radius);
    background: linear-gradient(135deg, rgba(3,105,161,0.06) 0%, rgba(29,78,216,0.05) 100%);
    border: 1px solid rgba(3,105,161,0.18);
    box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 10px;
  }
  .now-strip.now-loading {
    opacity: 0.6;
  }
  .now-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .now-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--advisory);
  }
  .now-time {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .now-body {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px;
    align-items: center;
  }
  /* Walkability score disc inside the now-strip — kept as a filled disc
   * because it's the page's primary live signal. Self-contained styles
   * (result-card scores are inline mono per 2026-06-10 redesign). */
  #now-score-disc {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'DM Mono', monospace;
    font-variant-numeric: tabular-nums;
    color: white;
    box-shadow: 0 2px 6px rgba(15,39,66,0.15);
    flex-shrink: 0;
    background: var(--text-dim);
  }
  #now-score-disc.tone-go     { background: var(--green); }
  #now-score-disc.tone-mid    { background: var(--amber); }
  #now-score-disc.tone-low    { background: var(--red); }
  #now-score-disc.tone-unk    { background: var(--text-dim); }
  #now-score-disc .score-val  { font-size: 17px; font-weight: 700; line-height: 1; }
  #now-score-disc .score-lbl  {
    font-size: 8px; font-weight: 500;
    letter-spacing: 0.1em; text-transform: uppercase;
    opacity: 0.85;
    margin-top: 1px;
  }
  .now-headline {
    display: flex; align-items: baseline; gap: 8px;
    line-height: 1;
  }
  .now-icon {
    font-size: 26px; line-height: 1;
    width: auto; height: auto;
    background: none;
    border-radius: 0;
    box-shadow: none;
    flex-shrink: 0;
  }
  .now-figures {
    display: flex; flex-direction: column; gap: 2px;
    min-width: 0;
  }
  .now-temp {
    font-family: 'Outfit', sans-serif;
    font-size: 28px; font-weight: 700;
    letter-spacing: -0.02em; line-height: 1;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .now-temp-deg { color: var(--text-muted); font-weight: 500; font-size: 0.7em; }
  /* Best-walk-window line — paws icon + label, sits under the headline
   * but above the blurb. Hidden when no good window is found. */
  .now-window {
    font-size: 13px; color: var(--text);
    padding-top: 10px;
    margin-top: 4px;
    border-top: 1px dashed rgba(3,105,161,0.20);
  }
  .now-window-icon { margin-right: 4px; }
  .now-window strong { font-weight: 700; color: var(--advisory); }
  /* Walkability blurb — deterministic 1-2 sentence prose. */
  .now-blurb {
    font-size: 13px; line-height: 1.5;
    color: var(--text); opacity: 0.92;
    margin-top: 2px;
  }
  .now-blurb:empty, .now-window:empty { display: none; }
  .now-summary {
    font-size: 13px; color: var(--text);
    font-weight: 500;
  }
  .now-meta {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--text-muted);
    display: flex; flex-wrap: wrap; gap: 4px 12px;
    font-variant-numeric: tabular-nums;
  }
  .now-cautions {
    display: flex; flex-wrap: wrap; gap: 6px;
    padding-top: 8px;
    border-top: 1px dashed rgba(3,105,161,0.20);
  }
  .now-cautions:empty { display: none; }
  .caution-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 11.5px; font-weight: 600;
    line-height: 1;
  }
  .caution-badge.sev-advisory { background: var(--advisory-soft); color: var(--advisory); }
  .caution-badge.sev-caution  { background: var(--amber-soft);    color: #92400e; }
  .caution-badge.sev-no_go    { background: var(--red-soft);      color: var(--red); }
  .caution-badge .caution-icon { font-size: 13px; line-height: 1; }

  /* ── Scout blurb ────────────────────────────────────────────────── */
  .scout-blurb {
    margin: 10px 14px 4px;
    padding: 12px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    border-left: 3px solid var(--accent);
    font-size: 14px; line-height: 1.55;
    color: var(--text);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    opacity: 1;
    min-height: 44px;
    display: flex; align-items: center;
  }
  .scout-blurb:hover { background: #fbfcfe; }
  .scout-blurb:active { transform: translateY(1px); }
  .scout-blurb.loading {
    color: var(--text-muted);
    font-style: italic;
  }
  .scout-blurb.empty { display: none; }

  /* ── Result list ────────────────────────────────────────────────── */
  .results-head {
    margin: 18px 18px 8px;
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px;
  }
  .results-head h2 {
    font-family: 'Outfit', sans-serif;
    font-size: 17px; font-weight: 700;
    color: var(--text);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .results-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: var(--text-muted);
    letter-spacing: 0.08em; text-transform: uppercase;
    font-variant-numeric: tabular-nums;
  }

  .result-list {
    display: flex; flex-direction: column; gap: 8px;
    margin: 0 14px;
  }

  /* ── Result card — index.html aesthetic ──────────────────────────
   * 4-col grid: hero thumb | left cluster (mono score + weather) |
   * body (name·window·mileage / warns / chips) | end (#rank + chev).
   * Status-tinted via left border (matches index's .day-card
   * status-* pattern). */
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: grid;
    grid-template-columns: auto auto 1fr auto;
    gap: 14px;
    align-items: center;
    cursor: pointer;
    text-decoration: none; color: inherit;
    transition: background 0.15s, border-color 0.15s, transform 0.1s;
    position: relative;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  /* Hero thumb tile — left of score. Square + rounded; mirrors the
   * thumb sizing of the score cluster's visual mass. Empty-state
   * placeholder when no photo so cards stay aligned. */
  .result-thumb {
    width: 60px; height: 60px;
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
    background: var(--card-sunk);
    position: relative;
  }
  .result-thumb img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .result-thumb.no-photo::after {
    content: '🐾';
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    opacity: 0.35;
  }
  .result-card.tone-go       { border-left: 3px solid var(--green); }
  .result-card.tone-mid      { border-left: 3px solid var(--amber); }
  .result-card.tone-low      { border-left: 3px solid var(--red); }
  .result-card.tone-park     { border-left: 3px solid var(--accent); }
  .result-card:hover {
    background: var(--card-sunk);
    border-color: var(--text-dim);
  }
  .result-card.tone-go:hover   { border-left-color: var(--green); }
  .result-card.tone-mid:hover  { border-left-color: var(--amber); }
  .result-card.tone-low:hover  { border-left-color: var(--red); }
  .result-card.tone-park:hover { border-left-color: var(--accent); }
  .result-card:active { transform: scale(0.997); }
  .result-card.highlight {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    animation: highlightPulse 1.6s ease-out;
  }
  @keyframes highlightPulse {
    0%   { box-shadow: 0 0 0 0   var(--accent-soft); }
    40%  { box-shadow: 0 0 0 14px rgba(3,105,161,0); }
    100% { box-shadow: 0 0 0 3px var(--accent-soft); }
  }

  /* Tier-4 (no dogs) — render muted so famous-but-prohibited beaches
   * stay discoverable without being mistaken for a recommendation. */
  .result-card.tier-4_no_dogs {
    background: var(--card-sunk);
    filter: grayscale(0.6);
    opacity: 0.78;
  }
  .result-card.tier-4_no_dogs:hover { opacity: 1; filter: grayscale(0.25); }

  /* Left cluster — inline mono score + weather emoji */
  .result-left {
    display: flex; align-items: center; gap: 10px;
    flex-shrink: 0;
    min-width: 64px;
  }
  .score-inline {
    font-family: 'DM Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--text-dim);
  }
  .score-inline.tone-go     { color: var(--green); }
  .score-inline.tone-mid    { color: var(--amber); }
  .score-inline.tone-low    { color: var(--red); }
  .score-inline.tone-unk    { color: var(--text-dim); }
  .score-inline.tone-park   { color: var(--accent); font-size: 22px; }
  .weather-emoji {
    font-size: 22px;
    line-height: 1;
  }

  /* Body — name+window row / distance+warns / chip row */
  .result-body {
    min-width: 0;
    display: flex; flex-direction: column; gap: 4px;
  }
  /* Beach name + window time inline; same font + size per Franz */
  .result-name-row {
    display: flex; align-items: baseline; flex-wrap: wrap;
    gap: 6px;
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.005em;
    color: var(--text);
    line-height: 1.2;
    min-width: 0;
  }
  .result-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex-shrink: 1; min-width: 0;
  }
  .result-name-sep {
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .result-window         { flex-shrink: 0; color: var(--text); }
  .result-window.tone-go   { color: var(--green); }
  .result-window.tone-mid  { color: var(--amber); }
  .result-window.tone-low  { color: var(--red); }
  .result-window.tone-unk  { color: var(--text-dim); }
  /* Mileage sits inline with name + window. Same Outfit 16/600 as
   * its row neighbors but charcoal so it reads as supporting info,
   * not a primary signal. */
  .result-mileage {
    flex-shrink: 0;
    color: #3a4555;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
  }

  /* Distance + warns row */
  .result-info {
    display: flex; flex-wrap: wrap;
    gap: 4px 8px;
    font-family: 'DM Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--text-muted);
  }
  .result-info .meta-warn {
    color: var(--red); font-weight: 500;
  }
  .result-info .meta-doghours-out {
    color: var(--red); font-weight: 500;
  }
  .result-info .meta-doghours-ok {
    color: var(--text); font-weight: 500;
  }
  .result-info .info-sep {
    color: var(--text-dim); opacity: 0.6;
  }

  /* Condition chip row — terminal-style with · separators, status-tinted */
  .result-chips {
    display: flex; flex-wrap: wrap;
    gap: 2px;
    align-items: center;
    margin-top: 2px;
    font-family: 'DM Mono', monospace;
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--text-muted);
  }
  .cond-chip {
    display: inline-flex; align-items: center; gap: 3px;
    white-space: nowrap;
  }
  .cond-chip.chip-go       { color: var(--green); }
  .cond-chip.chip-advisory { color: var(--advisory); }
  .cond-chip.chip-caution  { color: var(--amber); }
  .cond-chip.chip-no_go    { color: var(--red); }
  .cond-chip-sep {
    color: var(--text-dim);
    opacity: 0.6;
    margin: 0 3px;
  }

  .amenity-strip {
    display: flex; flex-wrap: wrap; gap: 4px;
    margin-top: 2px;
  }
  .amenity-strip:empty { display: none; }
  .amenity-dot {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 7px 2px 5px;
    border-radius: 999px;
    background: var(--card-sunk);
    font-size: 10.5px; font-weight: 600;
    color: var(--text-muted);
    line-height: 1.2;
  }
  .amenity-dot.match {
    background: var(--green-soft);
    color: #14532d;
  }
  .amenity-dot.match .dot-mark { color: var(--green); font-weight: 700; }
  .amenity-dot.miss {
    background: transparent;
    color: var(--text-dim);
    border: 1px dashed var(--border);
  }
  .amenity-dot .dot-mark { font-size: 11px; line-height: 1; }

  .result-end {
    display: flex; flex-direction: column; align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }
  .rank-badge {
    font-family: 'DM Mono', monospace;
    font-size: 10px; font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
  }
  .chev {
    color: var(--text-dim);
    font-size: 18px; line-height: 1;
    transition: color 0.15s, transform 0.15s;
  }
  .result-card:hover .chev {
    color: var(--accent);
    transform: translateX(2px);
  }

  /* Empty / loading state */
  .skeleton {
    height: 86px;
    border-radius: var(--radius);
    background: linear-gradient(90deg, var(--card-sunk) 0%, #e8eef5 50%, var(--card-sunk) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer {
    0%   { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .empty-state {
    padding: 40px 24px;
    text-align: center;
    color: var(--text-muted);
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }
  .empty-state .empty-icon {
    font-size: 32px;
    margin-bottom: 8px;
    opacity: 0.6;
  }
  .empty-state .empty-text {
    font-size: 14px;
  }

  /* Footer */
  .footer-note {
    margin: 24px 18px 0;
    font-family: 'DM Mono', monospace;
    font-size: 10.5px; color: var(--text-dim);
    text-align: center;
    letter-spacing: 0.08em;
  }

  /* ── Directions overlay (reused pattern from prior find.html) ───── */
  .dir-overlay {
    position: fixed; inset: 0;
    background: rgba(15,39,66,0.55);
    backdrop-filter: blur(2px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    z-index: 1500;
  }
  .dir-overlay.open { opacity: 1; pointer-events: auto; }
  .dir-sheet {
    position: fixed;
    left: 50%; bottom: 0;
    transform: translate(-50%, 100%);
    width: 100%; max-width: 720px;
    background: var(--card);
    border-radius: 18px 18px 0 0;
    box-shadow: var(--shadow-lg);
    padding: 10px 14px 18px;
    z-index: 1600;
    transition: transform 0.28s cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .dir-sheet.open { transform: translate(-50%, 0); }
  .dir-handle {
    width: 44px; height: 4px; border-radius: 2px;
    background: var(--border); margin: 4px auto 12px;
  }
  .dir-beach {
    font-family: 'Outfit', sans-serif;
    font-size: 17px; font-weight: 700;
    color: var(--text);
  }
  .dir-meta {
    font-family: 'DM Mono', monospace;
    font-size: 12px; color: var(--text-muted);
    margin: 2px 0 10px;
    font-variant-numeric: tabular-nums;
  }
  #dir-map {
    width: 100%; height: 50vh; min-height: 280px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: #d9e7f0;
  }
  .dir-cancel {
    margin-top: 12px;
    width: 100%;
    padding: 11px 14px;
    background: var(--text);
    color: white;
    border: 0; border-radius: var(--radius-sm);
    font: 600 14px/1 'DM Sans', sans-serif;
    cursor: pointer;
  }
  .dir-cancel:hover { background: #1e3a5f; }

  /* ── Phone (≤ 600px) ────────────────────────────────────────────── */
  @media (max-width: 600px) {
    .page-band     { padding: 14px 16px 4px; }
    .page-title    { font-size: 26px; }
    .search-strip  { margin: 10px 12px 6px; padding: 11px 12px; }
    .map-wrap      { margin: 6px 12px 0; }
    #map           { height: 180px; }
    .now-strip     { margin: 12px 12px 4px; padding: 12px 14px; }
    .now-temp      { font-size: 28px; }
    .now-icon      { width: 48px; height: 48px; font-size: 36px; }
    .scout-blurb   { margin: 8px 12px 4px; padding: 10px 14px; font-size: 13.5px; }
    .results-head  { margin: 16px 16px 6px; }
    .result-list   { margin: 0 12px; }
    .result-card   { padding: 12px 13px; gap: 10px; }
    .result-thumb  { width: 52px; height: 52px; border-radius: 8px; }
    .result-thumb.no-photo::after { font-size: 18px; }
    .result-left   { min-width: 56px; gap: 8px; }
    .score-inline  { font-size: 22px; }
    .weather-emoji { font-size: 20px; }
    .result-name-row { font-size: 15px; }
  }

  /* ── Tablet+ (≥ 760px) ─────────────────────────────────────────── */
  @media (min-width: 760px) {
    #map { height: 240px; }
    .page-title { font-size: 34px; }
  }

  /* Reduced motion — drop animations users didn't ask for */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    .pin, .result-card:hover, .chev { transition: none; }
  }
</style>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""></script>
<script>
  // ─── Config ─────────────────────────────────────────────────────────
  const SUPABASE_URL = 'https://ehlzbwtrsxaaukurekau.supabase.co';
  const ANON_KEY     = 'sb_publishable_lAg7YdZ3w7S5fN8jgiExKQ_3-KtW3xk';

  const DEFAULT_LAT  = 33.665;   // Huntington Dog Beach fallback
  const DEFAULT_LNG  = -118.015;
  const NEAREST_LIMIT = 14;
  const DISPLAY_LIMIT = 12;

  const LOC_CACHE_KEY = 'dogbeach.user_loc';
  const LOC_TTL_MS    = 24 * 60 * 60 * 1000;
  const WANTS_KEY     = 'find.wants';
  const AMENS_KEY     = 'find.amenities';
  const DIST_KEY      = 'find.distanceFilterMi';

  // ─── State ──────────────────────────────────────────────────────────
  let userLat = null;
  let userLng = null;
  let locationLabel = '';

  let wants = restoreWantsFromUrlOrStorage();
  let amenityFilters = restoreAmenitiesFromStorage();
  let distanceFilterMi = restoreDistanceFromStorage();
  let searchQuery = '';

  // selectedDay = 'now' (live current-hour view) | 'YYYY-MM-DD' (forecast).
  // NOW is the default; pill is keyboard/persisted to localStorage so a
  // return visitor lands back on their last pick.
  const DAY_KEY = 'find.selectedDay';
  let selectedDay = (() => {
    try {
      const stored = localStorage.getItem(DAY_KEY);
      if (stored === 'now') return 'now';
      if (stored && /^\d{4}-\d{2}-\d{2}$/.test(stored)) {
        // Only honor stored date if it's today or future (no time travel)
        const today = new Date().toLocaleDateString('en-CA');
        if (stored >= today) return stored;
      }
    } catch {}
    return 'now';
  })();

  let beachResults = [];      // raw rows from get-beaches-find
  let dogParkResults = [];    // raw rows from nearest_dog_parks
  let lastRenderedCards = []; // mixed, ranked, filtered

  let nowAtUser = null;       // result of one-off Open-Meteo on user lat/lng
  let _scoutAbortCtrl = null;
  const scoutCache = {};

  let map = null;
  let pinsLayer = null;
  let userMarker = null;
  let activePinId = null;

  // ─── Restore helpers ────────────────────────────────────────────────
  function restoreWantsFromUrlOrStorage() {
    const ALL = ['off_leash_beach', 'on_leash_beach', 'dog_park'];
    try {
      const params = new URLSearchParams(window.location.search);
      const urlWant = params.get('want');
      if (urlWant) {
        const set = new Set(urlWant.split(',').filter(w => ALL.includes(w)));
        if (set.size) return set;
      }
      const stored = localStorage.getItem(WANTS_KEY);
      if (stored) {
        const set = new Set(stored.split(',').filter(w => ALL.includes(w)));
        if (set.size) return set;
      }
    } catch {}
    return new Set(['off_leash_beach', 'dog_park']);
  }
  function restoreAmenitiesFromStorage() {
    const ALL = ['parking', 'restrooms', 'water', 'shade'];
    try {
      const stored = localStorage.getItem(AMENS_KEY);
      if (stored) {
        const set = new Set(stored.split(',').filter(a => ALL.includes(a)));
        return set;
      }
    } catch {}
    return new Set();
  }
  function restoreDistanceFromStorage() {
    try {
      const urlMi = new URLSearchParams(window.location.search).get('max_mi');
      if (urlMi === 'any') return 'any';
      const n = parseFloat(urlMi);
      if (!Number.isNaN(n) && n > 0) return n;
      const stored = localStorage.getItem(DIST_KEY);
      if (stored === 'any') return 'any';
      const s = parseFloat(stored);
      return !Number.isNaN(s) && s > 0 ? s : 10;
    } catch { return 10; }
  }

  function persistWants() {
    try { localStorage.setItem(WANTS_KEY, [...wants].join(',')); } catch {}
    try {
      const url = new URL(window.location.href);
      if (wants.size) url.searchParams.set('want', [...wants].join(','));
      else url.searchParams.delete('want');
      window.history.replaceState({}, '', url);
    } catch {}
  }
  function persistAmenities() {
    try { localStorage.setItem(AMENS_KEY, [...amenityFilters].join(',')); } catch {}
  }
  function persistDistance() {
    try { localStorage.setItem(DIST_KEY, String(distanceFilterMi)); } catch {}
  }

  // ─── Location cache ─────────────────────────────────────────────────
  function _readCachedLocation() {
    try {
      const raw = localStorage.getItem(LOC_CACHE_KEY);
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!Number.isFinite(obj?.lat) || !Number.isFinite(obj?.lng)) return null;
      if (typeof obj.ts !== 'number') return null;
      if (Date.now() - obj.ts > LOC_TTL_MS) return null;
      return obj;
    } catch { return null; }
  }
  function _saveCachedLocation(lat, lng, label) {
    try {
      localStorage.setItem(LOC_CACHE_KEY,
        JSON.stringify({ lat, lng, label, ts: Date.now() }));
    } catch {}
  }

  function setUserLocation(lat, lng, label) {
    userLat = lat;
    userLng = lng;
    if (label) locationLabel = label;
    document.getElementById('loc-pill-text').textContent =
      locationLabel || 'Saved location';
  }

  function setLocationLabelText(text) {
    document.getElementById('loc-pill-text').textContent = text;
  }

  // ─── Geolocation flow ───────────────────────────────────────────────
  function hydrateLocationFromCache() {
    const cached = _readCachedLocation();
    if (!cached) return false;
    setUserLocation(cached.lat, cached.lng, cached.label || 'Saved location');
    return true;
  }

  function requestGeolocation() {
    setLocationLabelText('Detecting…');
    if (!('geolocation' in navigator)) {
      _fallbackToDefault();
      return;
    }
    navigator.geolocation.getCurrentPosition(
      async pos => {
        const { latitude, longitude } = pos.coords;
        const name = await reverseGeocode(latitude, longitude).catch(() => 'Your location');
        setUserLocation(latitude, longitude, name);
        _saveCachedLocation(latitude, longitude, name);
        await loadEverything();
      },
      () => { showZipInput(); _fallbackToDefault(); },
      { timeout: 8000, maximumAge: 5 * 60 * 1000 }
    );
  }

  function _fallbackToDefault() {
    setUserLocation(DEFAULT_LAT, DEFAULT_LNG, 'Huntington (default)');
    loadEverything();
  }

  function showZipInput() {
    const link = document.getElementById('loc-link');
    link.outerHTML = `
      <input class="zip-input" id="zip-input" type="text" inputmode="numeric"
             maxlength="5" placeholder="ZIP"
             oninput="this.value=this.value.replace(/\\D/g,'').slice(0,5)"
             onkeydown="if(event.key==='Enter')submitZip()">
      <button class="loc-link" id="zip-go" onclick="submitZip()">Go</button>`;
  }

  async function submitZip() {
    const inp = document.getElementById('zip-input');
    if (!inp || !/^\d{5}$/.test(inp.value)) {
      if (inp) { inp.placeholder = '5 digits'; inp.style.borderColor = 'var(--red)'; }
      return;
    }
    const zip = inp.value;
    setLocationLabelText('Looking up ZIP…');
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?postalcode=${zip}&countrycodes=us&format=json&limit=1`,
        { headers: { 'User-Agent': 'DogBeachScout/1.0' } });
      const data = await res.json();
      if (!data[0]) { inp.style.borderColor = 'var(--red)'; return; }
      const lat = parseFloat(data[0].lat);
      const lng = parseFloat(data[0].lon);
      const label = `ZIP ${zip}`;
      setUserLocation(lat, lng, label);
      _saveCachedLocation(lat, lng, label);
      // Restore button shape after success
      document.getElementById('zip-input').remove();
      const go = document.getElementById('zip-go');
      go.outerHTML = `<button class="loc-link" id="loc-link" onclick="onUpdateLocation()">Update</button>`;
      await loadEverything();
    } catch {
      setLocationLabelText('Lookup failed');
    }
  }

  async function reverseGeocode(lat, lng) {
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json&zoom=10`,
        { headers: { 'User-Agent': 'DogBeachScout/1.0' } });
      const data = await res.json();
      const addr = data?.address ?? {};
      const city = addr.city || addr.town || addr.village || addr.hamlet || addr.suburb;
      const state = addr.state ? abbrevState(addr.state) : null;
      if (city && state) return `${city}, ${state}`;
      if (city) return city;
      if (state) return state;
      return 'Your location';
    } catch { return 'Your location'; }
  }

  function abbrevState(name) {
    const map = {
      'Alabama':'AL','Alaska':'AK','Arizona':'AZ','Arkansas':'AR','California':'CA',
      'Colorado':'CO','Connecticut':'CT','Delaware':'DE','Florida':'FL','Georgia':'GA',
      'Hawaii':'HI','Idaho':'ID','Illinois':'IL','Indiana':'IN','Iowa':'IA','Kansas':'KS',
      'Kentucky':'KY','Louisiana':'LA','Maine':'ME','Maryland':'MD','Massachusetts':'MA',
      'Michigan':'MI','Minnesota':'MN','Mississippi':'MS','Missouri':'MO','Montana':'MT',
      'Nebraska':'NE','Nevada':'NV','New Hampshire':'NH','New Jersey':'NJ','New Mexico':'NM',
      'New York':'NY','North Carolina':'NC','North Dakota':'ND','Ohio':'OH','Oklahoma':'OK',
      'Oregon':'OR','Pennsylvania':'PA','Rhode Island':'RI','South Carolina':'SC',
      'South Dakota':'SD','Tennessee':'TN','Texas':'TX','Utah':'UT','Vermont':'VT',
      'Virginia':'VA','Washington':'WA','West Virginia':'WV','Wisconsin':'WI','Wyoming':'WY'
    };
    return map[name] || name;
  }

  function onUpdateLocation() {
    // Replace the pill with a small picker: either re-request browser geo or
    // open the ZIP entry directly. We just show the ZIP input — cleaner.
    showZipInput();
  }

  // ─── One-off "Now at you" weather ───────────────────────────────────
  // Read user-location weather via the W2 reference layer:
  //   1. ensure-user-weather-cell registers the bin-floored cell and
  //      does a one-shot Open-Meteo fetch when cold ([[weather-grid-
  //      reference-layer]] / [[grid-consumers-require-cell-warmth-gate]]).
  //   2. weather_for_point reads the resulting hourly rows.
  //   3. Compute walkability score per hour, pick best window, render.
  // NO direct Open-Meteo fallback per the HARD rule — a cold cell that
  // can't warm shows the loading state until the fn succeeds.
  let nowHourlyRows = [];   // raw rows from weather_for_point
  async function loadNowAtUser() {
    if (userLat == null || userLng == null) return;
    const strip = document.getElementById('now-strip');
    strip.classList.add('now-loading');
    try {
      const ensureRes = await fetch(
        `${SUPABASE_URL}/functions/v1/ensure-user-weather-cell`,
        {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json' },
          body: JSON.stringify({ lat: userLat, lng: userLng }),
        });
      const ensure = await ensureRes.json();
      if (!ensure?.is_warm) {
        document.getElementById('now-summary').textContent = 'Warming up your neighborhood forecast…';
        return;
      }
      const startISO = new Date().toISOString();
      const endISO   = new Date(Date.now() + 24 * 3600_000).toISOString();
      const wfpRes = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/weather_for_point`,
        {
          method: 'POST',
          headers: {
            'apikey':        ANON_KEY,
            'Authorization': `Bearer ${ANON_KEY}`,
            'Content-Type':  'application/json',
          },
          body: JSON.stringify({
            p_lat: userLat, p_lng: userLng,
            p_start_ts: startISO, p_end_ts: endISO,
          }),
        });
      if (!wfpRes.ok) throw new Error(`weather_for_point HTTP ${wfpRes.status}`);
      nowHourlyRows = (await wfpRes.json()) || [];
      if (!Array.isArray(nowHourlyRows) || nowHourlyRows.length === 0) {
        document.getElementById('now-summary').textContent = 'Forecast not ready yet.';
        return;
      }
      // Pick the current/nearest-future hour as "now" for the headline.
      const nowMs = Date.now();
      const sorted = [...nowHourlyRows].sort((a, b) =>
        Math.abs(new Date(a.forecast_ts) - nowMs) - Math.abs(new Date(b.forecast_ts) - nowMs));
      const nh = sorted[0];
      nowAtUser = {
        tempF:    num(nh.temp_air),
        feelsF:   num(nh.feels_like),
        windMph:  num(nh.wind_speed),
        wmoCode:  intOrNull(nh.weather_code),
        uv:       num(nh.uv_index),
        precip:   num(nh.precip_mm),
        timeISO:  nh.forecast_ts,
        tz:       null,  // not returned by weather_for_point; use beach-local for display
      };
      renderNowAtUser();
    } catch (e) {
      document.getElementById('now-summary').textContent = 'Forecast unavailable.';
    } finally {
      strip.classList.remove('now-loading');
    }
  }

  function num(v) {
    if (v == null) return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }
  function intOrNull(v) {
    if (v == null) return null;
    const n = parseInt(v, 10);
    return Number.isFinite(n) ? n : null;
  }

  function renderNowAtUser() {
    const strip = document.getElementById('now-strip');
    strip.classList.remove('now-loading');
    const n = nowAtUser; if (!n) return;
    document.getElementById('now-icon').textContent = wmoIcon(n.wmoCode);
    document.getElementById('now-temp-val').textContent = Math.round(n.tempF);
    document.getElementById('now-summary').textContent = nowSummary(n);
    const meta = [];
    if (n.feelsF != null && Math.abs(n.feelsF - n.tempF) >= 3) meta.push(`Feels ${Math.round(n.feelsF)}°`);
    if (n.windMph != null) meta.push(`Wind ${Math.round(n.windMph)} mph`);
    if (n.uv != null) meta.push(`UV ${n.uv.toFixed(1)}`);
    document.getElementById('now-meta').innerHTML = meta
      .map(t => `<span>${t}</span>`).join(`<span class="meta-dot">·</span>`);
    if (n.timeISO) {
      const dt = new Date(n.timeISO);
      const fmt = new Intl.DateTimeFormat('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', hour12: true });
      document.getElementById('now-time').textContent = fmt.format(dt);
    }
    document.getElementById('now-cautions').innerHTML = buildCautionBadges(n);

    // ── Walkability score, best window, blurb ──
    // Compute over the hourly rows fetched from weather_for_point.
    const hourly = nowHourlyRows.map(walkabilityForRow).sort((a, b) => a.tsMs - b.tsMs);
    const nowMs = Date.now();
    const nowHour = hourly.find(h => h.tsMs >= nowMs - 30 * 60_000) ?? hourly[0];
    const nowScore = nowHour?.score ?? null;
    // Disc
    const disc  = document.getElementById('now-score-disc');
    const dval  = document.getElementById('now-score-val');
    if (nowScore != null) {
      dval.textContent = nowScore;
      const tone = nowScore >= 70 ? 'tone-go' : nowScore >= 45 ? 'tone-mid' : 'tone-low';
      disc.className = `score-disc ${tone}`;
    } else {
      dval.textContent = '—';
      disc.className = 'score-disc tone-unk';
    }
    // Best window from now → end of day at user's local tz (best-effort:
    // use browser local). Same algorithm as beach.html _bestWindowFromNowV2.
    const win = pickBestWalkWindow(hourly, nowMs);
    const winEl = document.getElementById('now-window');
    if (win) {
      winEl.innerHTML = `<span class="now-window-icon">🐾</span> Best walk: <strong>${escapeHtml(win.label)}</strong>`;
      winEl.style.display = '';
    } else {
      winEl.style.display = 'none';
    }
    // Blurb — deterministic rule-based copy keyed on dominant condition.
    const blurbEl = document.getElementById('now-blurb');
    const blurb = walkabilityBlurb(n, hourly, win);
    if (blurb) {
      blurbEl.textContent = blurb;
      blurbEl.style.display = '';
    } else {
      blurbEl.style.display = 'none';
    }
  }

  // Per-row walkability: simplified weather-only v2 mirror. Same band
  // shapes as scoring_config_v2 (temp bell, wind, sky WMO, heat/UV neg,
  // harsh neg) minus amenities/dog-access/tide/crowd which don't apply
  // to a generic neighborhood walk.
  function walkabilityForRow(r) {
    const tempF  = num(r.temp_air);
    const feelsF = num(r.feels_like) ?? tempF;
    const wind   = num(r.wind_speed);
    const uv     = num(r.uv_index);
    const wmo    = intOrNull(r.weather_code);
    const precip = num(r.precip_mm);
    const tsMs   = new Date(r.forecast_ts).getTime();

    // temp_pos: bell around 72°F, ±20° range, max 10
    const tempPos = tempF == null ? 4
      : Math.max(0, Math.round(10 * (1 - Math.min(Math.abs(feelsF - 72), 20) / 20)));
    // wind_pos: 6 at calm, drops 1 per 2 mph, floor 0
    const windPos = wind == null ? 4 : Math.max(0, 6 - Math.round(wind / 2));
    // sky_pos: from WMO (mirrors the SQL switch in apply_v2_best_window_bulk)
    const skyPos = wmoSkyPos(wmo);
    // heat_uv_neg
    const uvNeg = uv == null ? 0 : uv >= 11 ? 8 : uv >= 8 ? 5 : uv >= 6 ? 2 : 0;
    const hotNeg = feelsF == null || feelsF < 90 ? 0
      : Math.min(4, Math.round((feelsF - 90) * 0.4));
    // harsh_neg: strong wind, rain, cold
    const windHarsh = wind == null ? 0 : wind >= 25 ? 8 : wind >= 15 ? 4 : 0;
    const precipNeg = precip == null ? 0 : precip > 1.5 ? 6 : precip > 0.5 ? 3 : 0;
    const coldNeg = feelsF == null || feelsF > 50 ? 0
      : Math.min(6, Math.round((50 - feelsF) * 0.25));

    const positives = Math.min(22, tempPos + windPos + skyPos);
    const negatives = Math.min(20, uvNeg + hotNeg + windHarsh + precipNeg + coldNeg);
    const score = Math.max(0, Math.min(100, 50 + positives - negatives));
    return { tsMs, score, tempF, feelsF, wind, uv, wmo, precip, isDay: r.is_day === true };
  }

  function wmoSkyPos(code) {
    if (code == null) return 2;
    const map = { 0:6, 1:5, 2:4, 3:2, 45:1, 48:0, 51:2, 53:1, 55:0,
                  56:0, 57:0, 61:1, 63:0, 65:0, 66:0, 67:0, 71:0, 73:0, 75:0, 77:0,
                  80:1, 81:0, 82:0, 85:0, 86:0, 95:0, 96:0, 99:0 };
    return map[code] ?? 2;
  }

  // Best daylight window for walking, biased toward sooner.
  //
  // Eligibility: daylight hours from now forward, score ≥ 55 (relaxed
  // from 65 since daylight filter already excludes the trivially-easy
  // post-sunset hours that used to dominate).
  //
  // Ranking: avg score + soonness bonus. Bonus decays from +8 at "right
  // now" linearly at -1.5 per hour out, floor 0 by ~5h+. So a window
  // 4h from now needs to score ≥6 higher than NOW to win — matching
  // Franz's heuristic: "going on a walk now vs a little nicer in a
  // couple of hours is a no-brainer."
  //
  // Cap at 5h, ties broken by earlier start.
  function pickBestWalkWindow(hourly, nowMs) {
    const eligible = hourly.filter(h =>
      h.isDay === true && h.tsMs >= nowMs - 30 * 60_000 && h.score >= 55);
    if (eligible.length < 2) return null;
    const runs = [];
    let cur = [eligible[0]];
    for (let i = 1; i < eligible.length; i++) {
      const dt = eligible[i].tsMs - cur[cur.length - 1].tsMs;
      if (Math.abs(dt - 3600_000) < 60_000) {
        cur.push(eligible[i]);
      } else {
        if (cur.length >= 2) runs.push(cur);
        cur = [eligible[i]];
      }
    }
    if (cur.length >= 2) runs.push(cur);
    if (!runs.length) return null;

    // Soonness bonus: +8 at now, decaying 1.5/hour, floor 0.
    const soonBonus = startMs => {
      const hrs = Math.max(0, (startMs - nowMs) / 3600_000);
      return Math.max(0, 8 - hrs * 1.5);
    };

    const MAX_LEN = 5;
    const candidates = [];
    for (const run of runs) {
      // For runs longer than the cap, every sliding window IS a
      // candidate — picking up the soonness bonus means we can't just
      // pick the highest-sum slice within the run.
      const sliceLen = Math.min(MAX_LEN, run.length);
      for (let i = 0; i + sliceLen <= run.length; i++) {
        const slice = run.slice(i, i + sliceLen);
        const avg = slice.reduce((s, h) => s + h.score, 0) / slice.length;
        const rank = avg + soonBonus(slice[0].tsMs);
        candidates.push({ slice, avg, rank });
      }
    }
    if (!candidates.length) return null;
    // Sort by rank desc, then earliest start.
    candidates.sort((a, b) => {
      if (b.rank !== a.rank) return b.rank - a.rank;
      return a.slice[0].tsMs - b.slice[0].tsMs;
    });
    const best = candidates[0];
    const startMs = best.slice[0].tsMs;
    const endMs   = best.slice[best.slice.length - 1].tsMs + 3600_000;
    return {
      label: `${fmtClockHour(startMs)}–${fmtClockHour(endMs)}`,
      startMs, endMs, avg: Math.round(best.avg),
    };
  }

  function fmtClockHour(ms) {
    const d = new Date(ms);
    return new Intl.DateTimeFormat('en-US', { hour: 'numeric', hour12: true })
      .format(d).toLowerCase().replace(/\s/g, '');
  }

  // Deterministic blurb. Leads with the dominant condition; trailing
  // sentence is upbeat-but-honest (per [[honest-brand-prefers-candor]]).
  function walkabilityBlurb(now, hourly, win) {
    if (!now) return '';
    const t = now.tempF, f = now.feelsF ?? t, w = now.windMph, uv = now.uv, p = now.precip, wmo = now.wmoCode;
    const heads = [];
    if (SEVERE_WMO.has(wmo)) heads.push("Storm's overhead — wait it out.");
    else if (p != null && p > 1) heads.push("Rain's falling — slip out between bands.");
    else if (uv != null && uv >= 8) heads.push("Sun's intense — early or late is kinder on paws.");
    else if (f >= 88) heads.push("Hot one — keep it short, hit the shade.");
    else if (f <= 38) heads.push("Cold one — bundle up if your dog runs cool.");
    else if (w != null && w >= 22) heads.push("Wind's up — head out anyway, just hold the leash tight.");
    else if (wmo === 0) heads.push("Clear and easy — neighborhood walk's a solid pick.");
    else if (wmo === 1 || wmo === 2) heads.push("Mild sky — comfortable walking weather.");
    else if (wmo === 3) heads.push("Overcast and calm — good walking light.");
    else if (wmo === 45 || wmo === 48) heads.push("Fog's in — keep the leash close.");
    else heads.push("Walkable now — neighborhood is in play.");
    if (win) {
      heads.push(`Best stretch looks like ${win.label}.`);
    }
    return heads.join(' ');
  }

  function nowSummary(n) {
    const wmoLabel = WMO_LABELS[n.wmoCode] || 'Mild';
    if (n.windMph != null && n.windMph >= 20) return `${wmoLabel}, breezy.`;
    if (n.tempF != null && n.tempF >= 88) return `${wmoLabel}, hot for paws.`;
    if (n.tempF != null && n.tempF <= 40) return `${wmoLabel}, chilly.`;
    return `${wmoLabel}.`;
  }

  function buildCautionBadges(n) {
    const out = [];
    if (n.uv != null && n.uv >= 8) out.push({ sev:'caution', icon:'☀️', text:`High UV (${n.uv.toFixed(1)})` });
    else if (n.uv != null && n.uv >= 6) out.push({ sev:'advisory', icon:'☀️', text:`UV ${n.uv.toFixed(1)}` });
    if (n.windMph != null && n.windMph >= 22) out.push({ sev:'caution', icon:'💨', text:`Windy (${Math.round(n.windMph)} mph)` });
    else if (n.windMph != null && n.windMph >= 15) out.push({ sev:'advisory', icon:'💨', text:`Breezy (${Math.round(n.windMph)} mph)` });
    if (n.tempF != null && n.tempF >= 90) out.push({ sev:'caution', icon:'🌡️', text:`Hot sand (${Math.round(n.tempF)}°)` });
    if (n.tempF != null && n.tempF <= 38) out.push({ sev:'advisory', icon:'🥶', text:`Cold (${Math.round(n.tempF)}°)` });
    if (n.precip != null && n.precip > 0.05) out.push({ sev:'caution', icon:'🌧️', text:'Rain falling' });
    if (SEVERE_WMO.has(n.wmoCode)) out.push({ sev:'no_go', icon:'⛈️', text:'Severe weather' });
    return out.map(b =>
      `<span class="caution-badge sev-${b.sev}"><span class="caution-icon">${b.icon}</span>${b.text}</span>`
    ).join('');
  }

  // ─── WMO maps ────────────────────────────────────────────────────────
  const SEVERE_WMO  = new Set([63,64,65,66,67,71,72,73,74,75,76,77,82,95,96,97,98,99]);
  const CAUTION_WMO = new Set([45,48,51,53,55,56,57,61,80,81]);
  const WMO_LABELS = {
    0:'Clear', 1:'Mostly clear', 2:'Partly cloudy', 3:'Overcast',
    45:'Fog', 48:'Fog',
    51:'Light drizzle', 53:'Drizzle', 55:'Heavy drizzle',
    56:'Freezing drizzle', 57:'Freezing drizzle',
    61:'Light rain', 63:'Rain', 65:'Heavy rain',
    66:'Freezing rain', 67:'Freezing rain',
    71:'Light snow', 73:'Snow', 75:'Heavy snow', 77:'Snow grains',
    80:'Light showers', 81:'Showers', 82:'Violent showers',
    95:'Thunderstorm', 96:'Thunderstorm', 99:'Thunderstorm',
  };
  function wmoIcon(code) {
    if (code == null) return '⛅';
    if (code === 0)              return '☀️';
    if (code <= 2)               return '⛅';
    if (code === 3)              return '☁️';
    if (code <= 48)              return '🌫️';
    if (code <= 67)              return '🌧️';
    if (code <= 77)              return '❄️';
    if (code <= 82)              return '🌧️';
    return '⛈️';
  }

  // ─── Fetch beaches + dog parks ──────────────────────────────────────
  async function loadBeaches() {
    // selectedDay='now' → today (the RPC will also populate
    // current_hour_score). selectedDay='YYYY-MM-DD' → that forecast
    // day; current_hour_score will be null and disc falls back to
    // composite_score_v2 (peak for that day).
    const today = new Date().toLocaleDateString('en-CA', { timeZone: 'America/Los_Angeles' });
    const date = selectedDay === 'now' ? today : selectedDay;
    const params = new URLSearchParams({ date, scored: 'false' });
    if (userLat != null && userLng != null) {
      params.set('lat',   String(userLat));
      params.set('lng',   String(userLng));
      params.set('limit', String(NEAREST_LIMIT));
    }
    try {
      const res = await fetch(
        `${SUPABASE_URL}/functions/v1/get-beaches-find?${params}`,
        { headers: { 'Authorization': `Bearer ${ANON_KEY}` } });
      const data = await res.json();
      beachResults = Array.isArray(data.beaches) ? data.beaches : [];
    } catch {
      beachResults = [];
    }
  }

  async function loadDogParks() {
    if (userLat == null || userLng == null) { dogParkResults = []; return; }
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/nearest_dog_parks`,
        {
          method: 'POST',
          headers: {
            'apikey':        ANON_KEY,
            'Authorization': `Bearer ${ANON_KEY}`,
            'Content-Type':  'application/json',
          },
          body: JSON.stringify({
            p_lat:   userLat,
            p_lng:   userLng,
            p_limit: NEAREST_LIMIT,
            p_state: null,
            p_date:  selectedDay === 'now' ? null : selectedDay,
          }),
        });
      if (!res.ok) { dogParkResults = []; return; }

    }
