<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beach — Dog Beach Scout (mobile)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/photo-block.css">
<link rel="stylesheet" href="src/zone-rules-block.css">
<link rel="stylesheet" href="src/loader.css">
<script src="src/loader.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin="">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f2742;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --accent: #1d4ed8;
    --green: #16a34a;
    --red:   #dc2626;
    --amber: #f59e0b;
  }
  * { box-sizing: border-box; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body {
    margin: 0; font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5;
  }
  /* Mobile overflow guard — flex/grid containers need min-width: 0
   * to let their children shrink under their content size. */
  .body-grid, main, aside, section.card, .scout-card,
  .combo-row, .beach-secondline, .scout-cta, .hero, .hero-main {
    min-width: 0; max-width: 100%;
  }
  .page { max-width: 1200px; margin: 0 auto; }
  .body-grid {
    display: grid;
    grid-template-columns: 1fr;  /* mobile default — single column, stacked */
    gap: 0;
  }
  /* Mobile-only file: keep a single column at ALL widths since the
   * left rail is now the entire page. On wide screens we just cap
   * width and center, no sidebar. */
  @media (min-width: 600px) {
    .body-grid { max-width: 520px; margin: 0 auto; padding: 0 8px; }
    #main-content { display: none; }
  }
  header.hero {
    padding: 12px 20px 10px; background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .hero-main { flex: 1; min-width: 0; text-align: center; }
  .beach-name {
    font-family: 'Outfit', sans-serif;
    font-size: 24px; font-weight: 700; color: var(--text);
    margin: 0 0 6px;
    text-align: center;
  }
  /* Your-Fit overall as a colored badge to the left of the name.
   * 20% smaller than the h1 (24px → 19px) per Franz; colored by
   * the same go/caution/no_go threshold the bar chart uses. */
  .fit-badge {
    display: inline-block;
    font-size: 19px; font-weight: 700; line-height: 1.1;
    padding: 1px 9px; border-radius: 999px;
    color: white;
    font-variant-numeric: tabular-nums;
    vertical-align: 0.04em;
    margin-right: 4px;
  }
  .fit-badge-go      { background: #16a34a; }
  .fit-badge-caution { background: #f59e0b; }
  .fit-badge-no_go   { background: #dc2626; }
  /* Mobile second-line: park hours + best time + car chip — center
   * justified beneath the h1. */
  .beach-secondline {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    justify-content: center;
    margin: 4px 0 0;
    font-size: 13px; font-weight: 500; color: var(--text);
  }
  .beach-secondline .fit-badge {
    font-size: 13px; padding: 1px 7px; margin-right: 0;
  }
  .secondline-sep { color: var(--text-muted); opacity: 0.55; }
  .secondline-dist { display: inline-flex; align-items: center; gap: 6px; }
  .secondline-pill {
    font-size: 11px; padding: 2px 6px;
    border-radius: 4px; background: rgba(0,0,0,0.05);
    font-variant-numeric: tabular-nums;
  }
  .secondline-pill-best { background: rgba(34,197,94,0.18); }
  .secondline-label {
    font-size: 9px; font-weight: 800; color: var(--text-muted);
    margin-right: 3px; letter-spacing: 0.06em;
  }
  .secondline-map {
    width: 28px; height: 28px;
    border: 1px solid var(--border); background: var(--card);
    border-radius: 6px; padding: 0;
    font-size: 14px; cursor: pointer; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .secondline-map:hover { background: rgba(0,0,0,0.04); }
  /* Car chip — combines 🚗 icon + miles value, tap opens map modal. */
  .secondline-car {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--card);
    font: inherit; cursor: pointer;
    font-size: 12px; color: var(--text); line-height: 1.4;
  }
  .secondline-car:hover { background: rgba(0,0,0,0.04); }
  .secondline-car-icon { font-size: 14px; line-height: 1; }
  .secondline-car-dist { font-variant-numeric: tabular-nums; font-weight: 600; }

  /* Combined Amenities & Activities card — two horizontal rows
   * of icon+tiny-label chips. Each row scrolls if it overflows. */
  .combo-row-label {
    font-size: 9px; font-weight: 700; color: var(--text-muted);
    letter-spacing: 0.08em; text-transform: uppercase;
    margin: 2px 0;
    text-align: center;
  }
  .combo-row-label + .combo-row-label, .combo-row + .combo-row-label { margin-top: 8px; }
  .combo-row {
    display: flex; flex-wrap: nowrap; gap: 6px;
    justify-content: center;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .combo-row::-webkit-scrollbar { display: none; }
  .combo-chip {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    flex: 0 0 auto;
    min-width: 44px;
    padding: 4px 5px 3px;
    border-radius: 6px;
    background: rgba(0,0,0,0.04);
    border: 1px solid var(--border);
  }
  .combo-icon { font-size: 18px; line-height: 1; }
  .combo-icon-row { display: flex; align-items: center; gap: 1px; line-height: 1; }
  .combo-icon-row .amenity-paid { font-size: 11px; }
  .combo-label {
    font-size: 8px; font-weight: 700;
    color: var(--text); margin-top: 2px;
    letter-spacing: 0.04em; text-transform: uppercase;
    white-space: nowrap;
  }
  .combo-chip.rule-off_leash   { background: rgba(34,197,94,0.45); border-color: rgba(21,128,61,0.42); }
  .combo-chip.rule-on_leash    { background: rgba(251,191,36,0.53); border-color: rgba(180,83,9,0.42); }
  .combo-chip.rule-not_allowed { background: rgba(239,68,68,0.45); border-color: rgba(153,27,27,0.42); }
  /* Caution chips reuse the same shape as amenities/activities but get
   * their own palette — reddish-amber (orange-400) for caution, red for
   * no_go — so cautions read clearly as "warning" not "status." */
  .combo-chip.caution-warn { background: rgba(251,146,60,0.55); border-color: rgba(154,52,18,0.45); }
  .combo-chip.caution-no_go { background: rgba(239,68,68,0.45); border-color: rgba(153,27,27,0.42); }
  /* Discrete Cautions card — same combo-chip shape, clickable to expand.
   * Header label mirrors combo-row-label so the card reads as one row
   * of the amenities/activities/cautions visual family. */
  .cautions-card .combo-row { flex-wrap: wrap; justify-content: center; }
  .cautions-card button.combo-chip {
    font: inherit; color: inherit; cursor: pointer;
  }
  .cautions-card button.combo-chip[aria-expanded="true"] {
    outline: 2px solid rgba(15,23,42,0.55); outline-offset: -1px;
  }
  .caution-detail {
    margin-top: 8px; padding: 8px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    background: rgba(0,0,0,0.03); font-size: 12px; line-height: 1.4;
    text-align: center;
  }
  .caution-detail[hidden] { display: none; }

  /* Map modal — full-screen-ish popup with OSRM route + distance/time. */
  .map-modal {
    display: none;
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.7);
    z-index: 10000;
    align-items: center; justify-content: center;
    padding: 16px;
  }
  .map-modal.open { display: flex; }
  .map-modal-inner {
    position: relative;
    background: var(--card); border-radius: 12px;
    width: 100%; max-width: 600px; max-height: 90vh;
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  .map-modal-close {
    position: absolute; top: 8px; right: 8px;
    width: 32px; height: 32px; border-radius: 50%;
    border: 0; background: rgba(0,0,0,0.55); color: white;
    font-size: 18px; cursor: pointer; line-height: 1;
    z-index: 1;
  }
  .map-modal-meta {
    padding: 14px 48px 8px 16px;
    font-size: 14px; color: var(--text);
  }
  .map-modal-map {
    flex: 1 1 auto; min-height: 50vh;
    width: 100%;
  }
  .map-modal-cta {
    display: block; padding: 12px;
    background: var(--accent); color: white;
    text-align: center; text-decoration: none;
    font-weight: 600; font-size: 14px;
  }
  /* City · state inlined into the h1 — same font/size/weight,
   * lighter color so it reads as supporting info to the name. */
  .beach-region {
    color: var(--text-muted);
    margin-left: 0.4em;
    font-weight: 600;
  }
  .beach-address {
    font-size: 13px; color: var(--text); display: flex;
    align-items: center; gap: 6px;
  }
  .beach-address a {
    color: var(--accent); text-decoration: none;
  }
  .beach-address a:hover { text-decoration: underline; }
  .copy-btn {
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
    border: 1px solid var(--border); background: var(--card);
    font-size: 11px; color: var(--text-muted);
    transition: all 0.15s;
  }
  .copy-btn:hover { background: var(--bg); color: var(--text); }
  .copy-btn.copied { color: var(--green); border-color: var(--green); }
  .close-btn {
    color: var(--text-muted); text-decoration: none;
    font-size: 22px; line-height: 1; padding: 4px 6px;
    border-radius: 6px; flex-shrink: 0;
  }
  .close-btn:hover { background: var(--bg); }

  section.card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px; margin: 8px 16px;
  }
  /* Tooltips on [data-tip] — subtle pill above the element with a
   * 200ms hover-in delay (much faster than the native ~600ms) and
   * an instant hover-out. */
  [data-tip] { position: relative; }
  [data-tip]::after {
    content: attr(data-tip);
    position: absolute;
    left: 50%; bottom: calc(100% + 4px);
    transform: translateX(-50%);
    background: rgba(15,23,42,0.78);
    color: rgba(255,255,255,0.95);
    padding: 4px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 500; line-height: 1.35;
    width: max-content; max-width: 220px;
    text-align: center;
    z-index: 1000; pointer-events: none;
    opacity: 0;
    transition: opacity 80ms ease-out 0s;
  }
  [data-tip]:hover::after {
    opacity: 1;
    transition-delay: 200ms;
  }
  section.card h2 {
    font-size: 14px; font-weight: 700; margin: 0 0 8px;
    color: var(--text);
  }

  /* Map block */
  #map {
    height: 200px; border-radius: 8px; border: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .map-actions {
    display: flex; flex-direction: column; gap: 8px;
  }
  .directions-btn {
    background: var(--accent); color: white; padding: 10px 14px;
    border-radius: 8px; text-decoration: none; font-weight: 600;
    font-size: 14px; text-align: center; display: block;
  }
  .directions-btn:hover { opacity: 0.92; }
  .map-address {
    font-size: 12px; color: var(--text-muted);
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }

  /* Hours */
  .hours-grid {
    display: grid; grid-template-columns: max-content 1fr;
    gap: 6px 16px; font-size: 13px;
  }
  .hours-grid dt { color: var(--text-muted); font-weight: 500; }
  .hours-grid dd { margin: 0; color: var(--text); }
  .hours-range { font-size: 14px; font-weight: 600; color: var(--text); margin: 0; }
  /* Mobile Hours card: two side-by-side mini-boxes for Park Hours
   * and Best Time. The card's own h2 is suppressed (each box has
   * its own label). */
  .hours-card h2 { display: none; }
  .hours-boxes { display: flex; gap: 8px; }
  .hours-box {
    flex: 1; min-width: 0;
    background: rgba(0,0,0,0.04);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    text-align: center;
  }
  .hours-box-label {
    font-size: 10px; font-weight: 700; color: var(--text-muted);
    letter-spacing: 0.06em; text-transform: uppercase;
    margin-bottom: 2px;
  }
  .hours-box-val {
    font-size: 14px; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .hours-dogs-prohibited { margin: 8px 0 0; font-size: 13px; color: var(--text); }
  .hours-dogs-suggest    { margin: 2px 0 0; font-size: 13px; color: var(--text-muted); }

  /* Amenities — first card on the LHS, "Amenities" h2 should sit at
   * the same baseline as the first line of Beach text in the main
   * column (which has margin-top 28). With tightened card
   * padding (12) + h2 line-height, this lands ≈ y=28. */
  .amenities-card { margin-top: 16px; }
  .amenities-card h2 { margin-bottom: 6px; }
  /* Mobile amenity grid: tiny icon-only chips on a SINGLE row.
   * Scrolls horizontally if too many to fit. Label moved to tooltip. */
  .amenity-grid {
    display: flex; flex-wrap: nowrap; gap: 4px;
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .amenity-grid::-webkit-scrollbar { display: none; }
  .amenity {
    display: flex; align-items: center; gap: 6px; padding: 6px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 12px;
    background: var(--card);
  }
  .amenity.amenity-iconic {
    display: flex; align-items: center; justify-content: center;
    gap: 1px;
    min-width: 36px; height: 36px;
    padding: 0 5px; flex: 0 0 auto;
    border-radius: 6px;
  }
  .amenity-iconic .amenity-icon { font-size: 20px; line-height: 1; }
  /* Dollar sits inline to the right of the parking icon (not a floating
   * badge). Subtle green so it reads as "paid" without shouting. */
  .amenity-paid {
    font-size: 12px; font-weight: 800; line-height: 1;
    color: #15803d;
  }
  .amenity-icon { font-size: 14px; flex-shrink: 0; }
  .amenity-text { display: flex; flex-direction: column; line-height: 1.2; }
  .amenity-sub {
    font-size: 10px; color: var(--text-muted); font-weight: 500;
    margin-top: 1px;
  }
  .amenity-grid { gap: 4px; }
  /* Long labels wrap inside the narrow 2-col cell. */
  .amenity-label { white-space: normal; line-height: 1.2; }
  /* Tiles tinted by dog-policy rule when the section has one. */
  .amenity.rule-off_leash   { background: rgba(34,197,94,0.45); border-color: rgba(21,128,61,0.42); }
  .amenity.rule-on_leash    { background: rgba(251,191,36,0.53); border-color: rgba(180,83,9,0.42); }
  .amenity.rule-not_allowed { background: rgba(239,68,68,0.45); border-color: rgba(153,27,27,0.42); }
  .amenity.rule-unknown     { background: rgba(0,0,0,0.04); }

  /* Time-of-day pill strip (zone-rules-block). Sits above the zone-rules
   * card on mobile; color = leash policy in that window (Franz 2026-05-21). */
  .zr-time-strip { display: flex; flex-wrap: wrap; gap: 6px; }
  .zr-time-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 999px;
    border: 1px solid rgba(0,0,0,0.08);
    background: rgba(0,0,0,0.04);
    font-size: 13px; font-weight: 600; line-height: 1;
    cursor: pointer; color: #1f2937;
    transition: transform 0.05s, box-shadow 0.15s;
  }
  .zr-time-pill .zr-time-icon  { font-size: 14px; }
  .zr-time-pill .zr-time-range { letter-spacing: -0.01em; }
  .zr-time-pill.off_leash   { background: rgba(34,197,94,0.45);  border-color: rgba(21,128,61,0.42); }
  .zr-time-pill.on_leash    { background: rgba(251,191,36,0.53); border-color: rgba(180,83,9,0.42); }
  .zr-time-pill.not_allowed { background: rgba(239,68,68,0.45);  border-color: rgba(153,27,27,0.42); }
  .zr-time-pill.unknown     { background: rgba(0,0,0,0.04); }
  .zr-time-pill.active {
    box-shadow: 0 0 0 2px rgba(30,64,175,0.45);
    transform: translateY(-1px);
  }
  /* Strip drives the panes — hide the in-card tabs on mobile too. */
  .zr-time-tabs { display: none; }

  /* Zone-name sub-header inside the unified Amenities card (multi-zone beaches). */
  .amenity-zone-header {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-muted);
    margin: 8px 0 4px;
  }
  .amenity-zone-header:first-child { margin-top: 0; }
  /* .amenity.absent and .amenity.unknown no longer rendered — both
   * filter out at the JS layer until the user-feedback affordance
   * lands (project_amenity_user_feedback.md). */

  /* Weather line — lives in the page header now, centered. */
  .weather-line, .weather-card .weather-line {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px;
    justify-content: center;
    font-size: 13px; color: var(--text); padding: 2px 0;
  }
  .hero-weather {
    margin: 4px 0 0;
    font-size: 13px; color: var(--text);
    text-align: center;
  }
  .weather-now-cond { font-size: 16px; line-height: 1; }
  .weather-sep { color: var(--text-muted); opacity: 0.6; }
  .weather-loading { color: var(--text-muted); font-size: 12px; padding: 2px 0; }

  /* Hourly score bar — ported from detail.html. Renders inside
   * the Best Window card. */
  .score-row {
    display: flex; flex-direction: column; gap: 6px;
    padding: 10px 56px 0; margin-top: 10px;
    border-top: 1px solid var(--border);
  }
  .score-row-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px; font-weight: 500;
    color: var(--text-muted); letter-spacing: 0.04em;
  }
  .score-bars-wrap {
    display: flex; align-items: flex-end; gap: 3px;
    height: 58px;
  }
  .score-bar-col {
    display: flex; flex-direction: column; align-items: center;
    gap: 3px; flex: 1; min-width: 0;
  }
  .score-bar-value {
    font-family: 'DM Mono', monospace;
    font-size: 9px; color: var(--text-muted);
    white-space: nowrap; line-height: 1;
  }
  .score-bar-dog { font-size: 10px; line-height: 1; min-height: 12px; }
  .score-bar {
    width: 100%; border-radius: 3px 3px 0 0;
    min-height: 4px; transition: opacity 0.15s;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* Stacked segments — same palette as the Your-Fit bar so the two
   * surfaces share visual language. Weather on top, then amenities,
   * then access at the bottom. */
  .score-bar-seg { width: 100%; flex-shrink: 0; }
  .score-bar-seg-weather   { background: #f59e0b; }
  .score-bar-seg-amenities { background: #0ea5e9; }
  .score-bar-seg-access    { background: #16a34a; }
  .score-bar-seg-excluded  { background: rgba(239,68,68,0.45); width: 100%; }
  .score-x-axis { display: flex; gap: 3px; padding: 2px 0 0; }
  .score-x-label {
    flex: 1; text-align: center;
    font-family: 'DM Mono', monospace;
    font-size: 9px; color: var(--text-muted);
    white-space: nowrap; overflow: hidden;
  }

  /* Best-time card — same header shape as the Your-Fit card: title
   * left, headline right (the time-range). When hourly detail is
   * available, the headline becomes a clickable affordance that opens
   * the per-hour modal. */
  .besttime-card h2 {
    font-size: 16px; font-weight: 700; margin: 0; color: var(--text);
  }
  .besttime-header {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px;
  }
  .besttime-headline {
    font-size: 28px; font-weight: 700; color: var(--text);
    letter-spacing: -0.02em; line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .besttime-card.clickable .besttime-headline {
    cursor: pointer;
    text-decoration: underline; text-decoration-color: rgba(0,0,0,0.18);
    text-underline-offset: 2px;
  }
  .besttime-card.clickable .besttime-headline:hover {
    text-decoration-color: var(--text);
  }

  /* Detail modal — iframe overlay opened from the Best Window card. */
  .detail-modal {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.72);
    display: none;
    z-index: 9999;
    padding: 24px;
    align-items: center; justify-content: center;
  }
  .detail-modal.open { display: flex; }
  .detail-modal-inner {
    position: relative;
    background: var(--bg);
    width: 100%; max-width: 900px; height: 90vh;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .detail-modal-inner iframe { width: 100%; height: 100%; border: 0; }
  .detail-modal-close {
    position: absolute; top: 10px; right: 12px;
    background: rgba(0,0,0,0.55); color: white;
    border: 0; width: 32px; height: 32px; border-radius: 50%;
    cursor: pointer; font-size: 16px; line-height: 1;
    z-index: 1;
  }

  /* Scout blurb — now nested inside the Best Time card. Paragraph

<script>
const SUPABASE_URL = 'https://ehlzbwtrsxaaukurekau.supabase.co';
const ANON_KEY     = 'sb_publishable_lAg7YdZ3w7S5fN8jgiExKQ_3-KtW3xk';

const params       = new URLSearchParams(location.search);
const fid          = params.get('fid');
const locationId   = params.get('location_id');
const dateFromQs   = params.get('date');

document.getElementById('close-btn').href =
  fid ? `index.html?fid=${fid}` : (locationId ? `index.html?location=${locationId}` : 'index.html');

// Zone-rules constants + helpers + renderers now live in
// src/zone-rules-block.js (window.ZoneRulesBlock). escHtml is kept here

// Mirror of beach.html — renders the shared ZoneRulesBlock into its
// mount card. Today + current hour for season + day-part tab autoselect.
function _renderZoneRulesBlock(beach, dogPolicy) {
  const mount = document.getElementById('zone-rules-mount');
  if (!mount || !window.ZoneRulesBlock) return;
  const zr = dogPolicy?.zone_rules;
  if (!zr || (Array.isArray(zr.regions) && zr.regions.length === 0)) {
    mount.style.display = 'none';
    return;
  }
  const tz = beach?.timezone || 'America/Los_Angeles';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', hour12: false,
  }).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t)?.value || '';
  const ctx = {
    isToday: true,
    currentLocalHour: parseInt(get('hour'), 10) % 24,
    viewMonthDay: `${get('month')}-${get('day')}`,
    beachName: '',
  };
  window.ZoneRulesBlock.render(mount, zr, ctx);
  mount.style.display = '';

  // Time-pill strip mount above the zone-rules card (Franz 2026-05-21).
  // Empty when there are no time windows.
  const stripMount = document.getElementById('time-strip-mount');
  if (stripMount && window.ZoneRulesBlock.buildTimeStripHtml) {
    const stripHtml = window.ZoneRulesBlock.buildTimeStripHtml(zr, ctx);
    if (stripHtml) {
      stripMount.innerHTML = stripHtml;
      stripMount.style.display = '';
    } else {
      stripMount.style.display = 'none';
    }
  }
}
// because it's used throughout beach.html.

const escHtml = s => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function _currentLocalHour(timezone) {
  const tz = timezone || 'America/Los_Angeles';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: '2-digit', hour12: false,
  }).formatToParts(new Date());
  const h = parts.find(p => p.type === 'hour')?.value;
  return h != null ? (parseInt(h, 10) % 24) : null;
}

// Parse "HH:MM" → minutes-since-midnight. Tolerates "9:00", "09:30".
// Returns null for empty / malformed input.
function _hhmmToMinutes(hhmm) {
  if (!hhmm || typeof hhmm !== 'string') return null;
  const m = hhmm.match(/^(\d{1,2}):(\d{2})/);
  if (!m) return null;
  const h = parseInt(m[1], 10);
  const mm = parseInt(m[2], 10);
  if (Number.isNaN(h) || Number.isNaN(mm)) return null;
  return h * 60 + mm;
}

function _currentLocalMinutes(timezone) {
  const tz = timezone || 'America/Los_Angeles';
  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, hour: '2-digit', minute: '2-digit', hour12: false,
  }).formatToParts(new Date());
  const h = parseInt(parts.find(p => p.type === 'hour')?.value || '0', 10) % 24;
  const m = parseInt(parts.find(p => p.type === 'minute')?.value || '0', 10);
  return h * 60 + m;
}

// If the beach allows dogs today but the user is currently inside the
// prohibition window (and the window ends later today, not after midnight),
// return a "Come back after Xpm" suggestion. Returns '' otherwise.
function _suggestPostProhibitionTime(start, end, timezone) {
  if (!start || !end) return '';
  const toMin = s => {
    const [h, m] = String(s).split(':').map(Number);
    return h * 60 + (m || 0);
  };
  const startM = toMin(start);
  const endM   = toMin(end);
  // Wrap-around (overnight) and end-of-day midnight windows: no useful
  // same-day suggestion — punt.
  if (endM === 0 || endM <= startM) return '';
  const nowM = _currentLocalMinutes(timezone);
  if (nowM < startM || nowM >= endM) return '';
  const eh = Math.floor(endM / 60), em = endM % 60;
  const ap = eh >= 12 ? 'pm' : 'am';
  const h12 = eh === 0 ? 12 : eh > 12 ? eh - 12 : eh;
  const label = em ? `${h12}:${String(em).padStart(2,'0')}${ap}` : `${h12}${ap}`;
  return `<p class="hours-dogs-suggest">Come back after ${label} now.</p>`;
}

async function load() {
  if (!fid && !locationId) return showError('No beach specified.');
  let resolvedFid = fid;
  // Resolve location_id → fid by hitting beaches_gold via PostgREST
  if (!resolvedFid && locationId) {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/beaches_gold?select=fid&location_id=eq.${encodeURIComponent(locationId)}&limit=1`,
      { headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}` }});
    const rows = await r.json();
    if (!rows?.[0]?.fid) return showError('Beach not found.');
    resolvedFid = rows[0].fid;
  }

  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_beach_info`, {
      method: 'POST',
      headers: {
        apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_fid: parseInt(resolvedFid, 10) }),
    });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    if (!data?.beach) return showError('Beach not found.');
    render(data, resolvedFid);
  } catch (err) {
    console.error(err);
    showError(`Failed to load: ${err.message}`);
  }
}

  document.getElementById('beach-name').textContent = 'Beach';

    <div class="state"><div class="state-icon">🐕</div><div>${escHtml(msg)}</div></div>`;
}

function render(data, beachFid) {
  const { beach, dog_policy, amenities } = data;
  document.title = `${beach.display_name} — Dog Beach Scout`;
  // Mobile header: h1 is JUST the beach name + state (no county). The
  // Your-Fit badge and distance/drive-time move to the second line
  // below the name.

  nameEl.textContent = beach.display_name;
  if (beach.state) {
    const span = document.createElement('span');
    span.className = 'beach-region';
    span.textContent = beach.state;
    nameEl.appendChild(span);
  }
  // Second line: [score badge] · Park 6AM-10PM · Best 2PM-5PM · 12 mi · 32 min · [map]
  const fitScores = _appealScores(beach, dog_policy, amenities, data.hours_today);
  const secondline = document.getElementById('beach-secondline');
  if (secondline) {
    const badgeClass = fitScores.overall >= 70 ? 'go' : fitScores.overall >= 40 ? 'caution' : 'no_go';
    const harmonized = _harmonizedHours(beach, amenities);
    const parkHours = harmonized ? `${harmonized.openLabel || '?'}-${harmonized.closeLabel || '?'}` : null;
    const nowWindow = _bestWindowFromNow(data.hours_today, beach, amenities, dog_policy);
    const bestTime  = nowWindow ? `${_minutesToFmt(nowWindow.start * 60)}-${_minutesToFmt(nowWindow.end * 60)}` : null;
    // Score badge hidden on mobile per Franz. Computed (fitScores) is

    items.push(`<button class="secondline-car" type="button" id="secondline-car-btn" data-tip="Map + drive time" aria-label="Map">

      </button>`);
    secondline.innerHTML = items.join('<span class="secondline-sep">·</span>');

    document.getElementById('secondline-car-btn')
      ?.addEventListener('click', () => _openMapModal(beach));
  }

  // Pin-address row retired 2026-05-15 — address still appears on the

  // Two-column layout (desktop):
  //   LEFT RAIL (30%): at-a-glance compact info — amenities + zone rules.

  // Description = LLM-generated Scout-voice prose.
  // Details = structured / curated facts (currently from

  // Two distinct things — Franz, 2026-05-10.

  const hasPhotos = Array.isArray(data.photos) && data.photos.length > 0;

  if (hasPhotos) leftRail.push('<div class="photo-block-wrap" id="photo-block-mount"></div>');
  // Combo card now hosts three rows: Amenities, Activities, Cautions.

  leftRail.push(buildAmenitiesAndActivitiesCard(beach, dog_policy, amenities, data.hours_today, data.today));
  // Cautions mount — async-filled by loadWaterConditionAdvisories below.
  // Hidden when no active advisories.
  leftRail.push(`<section class="card cautions-card" style="display:none"></section>`);
  leftRail.push(buildAlternativesSection(dog_policy, data.alternatives));
  // Zone-rules block (shared with detail.html + beach.html) — full

  leftRail.push(`<section class="card" id="time-strip-mount" style="display:none"></section>`);
  leftRail.push(`<section class="card" id="zone-rules-mount" style="display:none"></section>`);
  leftRail.push(buildNowBlurbCard(data.today));
  // DP suggestion mount — async-filled by loadDogParkSuggestion below.
  // Sits next to Pack List so the "what's next" prompts cluster.
  leftRail.push(`<section class="card dog-park-card-mount" id="dog-park-mount" style="display:none"></section>`);
  leftRail.push(buildPackListCard(beach, dog_policy, amenities, data.hours_today));

  leftRail.push(buildLinksSection(beach, beachFid));
  document.getElementById('left-rail').innerHTML = leftRail.filter(Boolean).join('');
  // Main column is empty on mobile — the whole page lives in the LHS.
  document.getElementById('main-content').innerHTML = '';

      document.getElementById('photo-block-mount'),

  initMap(beach);

  loadScoutBlurb(beach, data.today, dog_policy, data.hours_today, amenities);

  loadDogParkSuggestion(beach, beachFid, dog_policy, data.hours_today);
  loadWaterConditionAdvisories(beachFid);
  _renderZoneRulesBlock(beach, dog_policy);
  _wireBestTimeClick();

function buildMapsUrl(beach) {
  // Apple Maps universal handler — opens the Apple Maps app on iOS/macOS,
  // falls back to the web map on Android/Windows. `daddr` (destination
  // address) is Apple's directions parameter.
  const dest = beach.address
    ? encodeURIComponent(beach.address)
    : `${beach.lat},${beach.lng}`;
  return `https://maps.apple.com/?daddr=${dest}`;
}

function buildDescriptionSection(description) {
  if (!description?.text) return '';
  return `<div class="beach-description">${escHtml(description.text)}</div>`;
}

function buildLocationSection(beach) {
  if (beach.lat == null || beach.lng == null) return '';
  const directionsUrl = buildMapsUrl(beach);
  const addrLine = beach.address
    ? `<span>${escHtml(beach.address)}</span>
       <button class="copy-btn" type="button" data-copy="${escHtml(beach.address)}">Copy</button>`
    : `<span>${beach.lat.toFixed(4)}°, ${beach.lng.toFixed(4)}°</span>`;
  return `<section class="card location-card">
    <h2>Location</h2>
    <div id="map"></div>
    <a class="directions-btn" href="${escHtml(directionsUrl)}" target="_blank" rel="noopener">📍 Get directions</a>
    <div class="map-address">${addrLine}</div>
  </section>`;
}

// ─── Hours harmonization ────────────────────────────────────────────
// Pick ONE open/close time per beach from the available sources, in
// priority order:
//   1. beach.open_time / close_time (structured, non-default)
//   2. Parse amenities.hours_text for an "8am-6pm" style range
//   3. Detect "sunrise/sunset/dawn/dusk" in hours_text and substitute
//      computed sun times for the beach's lat/lng and today's date
//   4. Else fall through to the raw prose
// Output format: "6:00AM - 8:00PM".

function _fmt12(hour24, minute) {
  const ap = hour24 >= 12 ? 'PM' : 'AM';
  const h12 = hour24 === 0 ? 12 : hour24 > 12 ? hour24 - 12 : hour24;
  // Drop ":00" when on the hour — mobile prefers "6AM" over "6:00AM".
  if (!minute) return `${h12}${ap}`;
  return `${h12}:${String(minute).padStart(2, '0')}${ap}`;
}

function _hhmmToFmt(hhmm) {
  const [h, m] = String(hhmm).split(':').map(n => parseInt(n, 10));
  if (Number.isNaN(h)) return null;
  return _fmt12(h % 24, m || 0);
}

// Sunrise / sunset for a lat/lng on a given date, returned as
// { sunriseMin, sunsetMin, dawnMin, duskMin } where each is minutes
// after local midnight. Civil dawn/dusk = sun -6° below horizon
// (~30 min before sunrise / after sunset). Standard NOAA solar
// position math, ±2 min accuracy. Honors beach timezone.
function _sunTimes(lat, lng, dateObj, timezone) {
  if (lat == null || lng == null) return null;
  const rad = Math.PI / 180;
  const start = new Date(dateObj.getFullYear(), 0, 0);
  const doy = Math.floor((dateObj - start) / 86400000);
  const B = rad * (360 / 365) * (doy - 81);
  const eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
  const decl = 23.45 * rad * Math.sin(rad * (360 / 365) * (doy - 81));
  const latRad = lat * rad;
  // Sunrise/sunset (sun at horizon, refraction-corrected ≈ -0.833°)
  const computeMin = (zenithDeg) => {
    const cosHa = (Math.cos(zenithDeg * rad) - Math.sin(latRad) * Math.sin(decl))
                / (Math.cos(latRad) * Math.cos(decl));
    if (cosHa > 1 || cosHa < -1) return null;
    return Math.acos(cosHa) * 4 / rad;  // minutes (4 min/degree)
  };
  const haRise  = computeMin(90.833);
  const haCivil = computeMin(96);  // civil twilight
  if (haRise == null) return null;
  // Tz offset for the beach (minutes east of UTC). Use Intl trick.
  const tzMinutes = (() => {
    try {
      const local = new Date(dateObj.toLocaleString('en-US', { timeZone: timezone }));
      const utc   = new Date(dateObj.toLocaleString('en-US', { timeZone: 'UTC' }));
      return Math.round((local - utc) / 60000);
    } catch { return -lng * 4; } // fallback: longitude → minutes east of UTC
  })();
  // Solar noon (local minutes after midnight)
  const noonMin = 12 * 60 - eot + tzMinutes + 4 * lng;
  return {
    sunriseMin: Math.round(noonMin - haRise),
    sunsetMin:  Math.round(noonMin + haRise),
    dawnMin:    haCivil != null ? Math.round(noonMin - haCivil) : null,
    duskMin:    haCivil != null ? Math.round(noonMin + haCivil) : null,
  };
}

function _minutesToFmt(min) {
  if (min == null || !Number.isFinite(min)) return null;
  // Wrap into 0-1439 just in case.
  const wrapped = ((min % 1440) + 1440) % 1440;
  return _fmt12(Math.floor(wrapped / 60), wrapped % 60);
}

// Try to derive a single (openLabel, closeLabel) from the available sources.
function _harmonizedHours(beach, amenities) {
  const open = beach.open_time, close = beach.close_time;
  const isDefault = open === '05:00' && close === '22:00';
  if (open && close && !isDefault) {
    return { openLabel: _hhmmToFmt(open), closeLabel: _hhmmToFmt(close) };
  }
  const text = (amenities?.hours_text || '').trim();
  if (!text) return null;

  // Pattern: explicit HH(:MM)? am/pm – HH(:MM)? am/pm
  const rangeRe = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)\s*(?:[-–—]|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i;
  const m = text.match(rangeRe);
  if (m) {
    const to24 = (h, ap) => {
      h = parseInt(h, 10);
      if (/pm/i.test(ap) && h < 12) h += 12;
      if (/am/i.test(ap) && h === 12) h = 0;
      return h;
    };
    return {
      openLabel:  _fmt12(to24(m[1], m[3]), parseInt(m[2] || '0', 10)),
      closeLabel: _fmt12(to24(m[4], m[6]), parseInt(m[5] || '0', 10)),
    };
  }

  // Pattern: sunrise/sunset/dawn/dusk substitution. Look up actual
  // times from the beach lat/lng and today's date.
  const sun = _sunTimes(beach.lat, beach.lng, new Date(), beach.timezone);
  if (sun) {
    const subst = (label) => {
      if (/sunrise/i.test(label)) return _minutesToFmt(sun.sunriseMin);
      if (/sunset/i.test(label))  return _minutesToFmt(sun.sunsetMin);
      if (/dawn/i.test(label))    return _minutesToFmt(sun.dawnMin);
      if (/dusk/i.test(label))    return _minutesToFmt(sun.duskMin);
      return null;
    };
    // "Xam-sunset" / "sunrise-Ypm" / "dawn-dusk" etc.
    const sideRe = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:[-–—]|to)\s*(sunset|sunrise|dawn|dusk)/i;
    const m2 = text.match(sideRe);
    if (m2) {
      const to24 = (h, ap) => {
        h = parseInt(h, 10);
        if (ap && /pm/i.test(ap) && h < 12) h += 12;
        if (ap && /am/i.test(ap) && h === 12) h = 0;
        return h;
      };
      return {
        openLabel:  _fmt12(to24(m2[1], m2[3]), parseInt(m2[2] || '0', 10)),
        closeLabel: subst(m2[4]),
      };
    }
    const sideRe2 = /(sunset|sunrise|dawn|dusk)\s*(?:[-–—]|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i;
    const m3 = text.match(sideRe2);
    if (m3) {
      const to24 = (h, ap) => {
        h = parseInt(h, 10);
        if (ap && /pm/i.test(ap) && h < 12) h += 12;
        if (ap && /am/i.test(ap) && h === 12) h = 0;
        return h;
      };
      return {
        openLabel:  subst(m3[1]),
        closeLabel: _fmt12(to24(m3[2], m3[4]), parseInt(m3[3] || '0', 10)),
      };
    }
    const bothRe = /(sunrise|dawn)\s*(?:[-–—]|to)\s*(sunset|dusk)/i;
    const m4 = text.match(bothRe);
    if (m4) return { openLabel: subst(m4[1]), closeLabel: subst(m4[2]) };
  }

  return null;
}

function buildHoursSection(beach, amenities, dogPolicy, hoursToday) {
  const harmonized = _harmonizedHours(beach, amenities);
  const hoursText = amenities?.hours_text;
  const rangeLabel = harmonized
    ? `${harmonized.openLabel || '?'} - ${harmonized.closeLabel || '?'}`
    : (hoursText || null);
  // Best window — same time-aware computation Scout uses.
  const nowWindow = _bestWindowFromNow(hoursToday, beach, amenities, dogPolicy);
  const bestLabel = nowWindow
    ? `${_minutesToFmt(nowWindow.start * 60)} - ${_minutesToFmt(nowWindow.end * 60)}`
    : null;
  if (!rangeLabel && !bestLabel) {
    const ps = dogPolicy?.dogs_prohibited_start;
    const pe = dogPolicy?.dogs_prohibited_end;
    if (!ps || !pe) return '';
  }
  const prohibStart = dogPolicy?.dogs_prohibited_start;
  const prohibEnd   = dogPolicy?.dogs_prohibited_end;
  const prohibNote  = (prohibStart && prohibEnd)
    ? `<p class="hours-dogs-prohibited"><strong>Dogs not allowed ${escHtml(prohibStart)}–${escHtml(prohibEnd)}</strong></p>`
      + _suggestPostProhibitionTime(prohibStart, prohibEnd, beach.timezone)
    : '';
  const boxes = [];
  if (rangeLabel) boxes.push(`<div class="hours-box"><div class="hours-box-label">Park Hours</div><div class="hours-box-val">${escHtml(rangeLabel)}</div></div>`);
  if (bestLabel)  boxes.push(`<div class="hours-box"><div class="hours-box-label">Best Time</div><div class="hours-box-val">${escHtml(bestLabel)}</div></div>`);
  return `<section class="card hours-card">
    <div class="hours-boxes">${boxes.join('')}</div>
    ${prohibNote}
  </section>`;
}

const AMENITY_DEFS = [
  { key: 'has_parking',         icon: '🅿️',  label: 'Parking' },
  { key: 'has_restrooms',       icon: '🚻',  label: 'Restrooms' },
  { key: 'has_showers',         icon: '🚿',  label: 'Showers' },
  { key: 'has_drinking_water',  icon: '💧',  label: 'Drinking water' },
  { key: 'has_picnic_area',     icon: '🧺',  label: 'Picnic area' },
  { key: 'has_fire_pits',       icon: '🔥',  label: 'Fire pits' },
  { key: 'has_lifeguards',      icon: '🛟',  label: 'Lifeguards' },
  { key: 'has_disabled_access', icon: '♿',  label: 'ADA access' },
];

const PARKING_TYPE_LABEL = {
  lot: 'Lot', mixed: 'Mixed', metered: 'Metered',
  street: 'Street', none: 'No parking',
};
// OSM-style subtypes — used when parking_type is missing but
// parking_subtype is present (OSM emitter pathway).
const PARKING_SUBTYPE_LABEL = {
  surface: 'Lot', street_side: 'Street', 'multi-storey': 'Garage',
  multi_storey: 'Garage', underground: 'Garage', carports: 'Carport',
  rooftop: 'Rooftop',
};

function _parkingTypeLabel(amenities) {
  // Prefer the LLM enum; fall back to OSM-style subtype mapping.
  if (amenities.parking_type) return PARKING_TYPE_LABEL[amenities.parking_type] || '';
  if (amenities.parking_subtype) return PARKING_SUBTYPE_LABEL[amenities.parking_subtype] || '';
  return '';
}

function _parkingCostLabel(amenities) {
  // Structured signal wins: parking_fee = true → Paid, false → Free.
  if (amenities.parking_fee === true)  return 'Paid';
  if (amenities.parking_fee === false) return 'Free';
  // Fallback: metered is always paid by definition.
  if (amenities.parking_type === 'metered') return 'Paid';
  // Last resort: regex parking_notes prose (LLM-supplied "$5/day" etc).
  const n = String(amenities.parking_notes || '');
  if (/\$|\bfee\b|\bpaid\b/i.test(n)) return 'Paid';
  if (/\bfree\b/i.test(n))           return 'Free';
  return '';
}

const _RULE_TOOLTIP = {
  off_leash:   'Dogs off-leash welcome here',
  on_leash:    'Dogs on-leash here',
  not_allowed: 'Dogs not allowed in this zone',
  unknown:     'Rule unclear — verify on-site',
};

function _amenityTooltip(def, rule) {
  const ruleNote = rule ? ` · ${_RULE_TOOLTIP[rule] || rule}` : '';
  return `${def.label}${ruleNote}`;
}

function _renderParkingTile(def, type, subtype, fee, ruleClass, rule) {
  const typeLabel = PARKING_TYPE_LABEL[type] || PARKING_SUBTYPE_LABEL[subtype] || '';
  const costLabel = fee === true ? 'Paid' : fee === false ? 'Free' : '';
  const sub = [typeLabel, costLabel].filter(Boolean).join(' · ');
  const tip = _amenityTooltip(def, rule) + (sub ? ` · ${sub}` : '');
  // Mobile: icon-only tile. Distinct icon for street parking vs lot/
  // mixed. Adds 💲 overlay when paid.
  const t = (type || subtype || '').toLowerCase();
  const isStreet = /street/.test(t);
  const icon = isStreet ? '🚗' : '🅿️';
  const paidIcon = fee === true || /meter/.test(t) ? '<span class="amenity-paid">$</span>' : '';
  return `<div class="amenity${ruleClass || ''} amenity-iconic" data-tip="${escHtml(tip)}">
    <span class="amenity-icon">${icon}</span>${paidIcon}
  </div>`;
}

function _renderAmenityTile(def, amenities) {
  return _renderAmenityTileWithRule(def, amenities, null);
}

// Section-tile and amenity-tile renderer with optional rule color.
// rule: 'off_leash' | 'on_leash' | 'not_allowed' | 'unknown' | null
// Mobile: icon-only — labels suppressed, hover tooltip carries them.
function _renderAmenityTileWithRule(def, amenities, rule) {
  const ruleClass = rule ? ` rule-${rule}` : '';
  const tip = _amenityTooltip(def, rule);
  // Section-only tile (e.g. Sand, Trails) — icon only.
  if (def.sectionName) {
    return `<div class="amenity${ruleClass} amenity-iconic" data-tip="${escHtml(tip)}">
      <span class="amenity-icon">${def.icon}</span>
    </div>`;
  }
  if (def.key === 'has_parking') {
    if (Array.isArray(amenities?.parking_options) && amenities.parking_options.length > 0) {
      return amenities.parking_options
        .map(opt => _renderParkingTile(def, opt.type, opt.subtype, opt.fee, ruleClass, rule))
        .join('');
    }
    return _renderParkingTile(def,
      amenities?.parking_type, amenities?.parking_subtype,
      _parkingCostLabel(amenities) === 'Paid' ? true
        : _parkingCostLabel(amenities) === 'Free' ? false : null,
      ruleClass, rule);
  }
  // Lifeguards always render with the "Seasonal" sublabel — staffing is
  // seasonal at almost every US beach, never year-round (see
  // [[lifeguards-seasonal-not-on-duty]]).
  if (def.key === 'has_lifeguards') {
    return `<div class="amenity${ruleClass} amenity-iconic" data-tip="${escHtml(tip + ' · seasonal, typically Memorial Day–Labor Day')}">
      <span class="amenity-icon">${def.icon}</span>
    </div>`;
  }
  return `<div class="amenity${ruleClass} amenity-iconic" data-tip="${escHtml(tip)}">
    <span class="amenity-icon">${def.icon}</span>
  </div>`;
}

// Map zone-rules section names to amenity keys when they refer to the
// same physical thing. Used for dedup when merging the two lists.
const _SECTION_TO_AMENITY = {
  parking_lot:       'has_parking',
  restrooms:         'has_restrooms',
  restrooms_showers: 'has_restrooms',
  showers:           'has_showers',
  picnic_area:       'has_picnic_area',
};
// Zone-rules sections that aren't represented in AMENITY_DEFS. Each
// gets its own tile, sourced from zone_rules with the dog-policy rule
// as the background color.
const _SECTION_TILE = {
  sand:           { icon: '🏖️', label: 'Sand' },
  trails:         { icon: '🥾', label: 'Trails' },
  water_swim:     { icon: '🌊', label: 'Water' },
  dunes:          { icon: '🏜️', label: 'Dunes' },
  bluff:          { icon: '🏔️', label: 'Bluff' },
  boardwalk:      { icon: '🚶', label: 'Boardwalk' },
  campground:     { icon: '🏕️', label: 'Campground' },
  playground:     { icon: '🤸', label: 'Playground' },
  tide_pools:     { icon: '🐚', label: 'Tide pools' },
  nesting_zones:  { icon: '🪺', label: 'Nesting zones' },
};

// Walk zone_rules and return a map of {sectionName -> mostRestrictiveRule}.
// "Most restrictive" priority: not_allowed > on_leash > off_leash > unknown.
// Multi-region beaches collapse to one rule per section using this priority.
function _ruleMapFromZoneRules(zr) {
  const RANK = { not_allowed: 3, on_leash: 2, off_leash: 1, unknown: 0 };
  const COERCE = {
    off_leash_voice_control: 'off_leash',
    on_leash_or_voice:       'on_leash',
  };
  const out = {};
  const seasons = (Array.isArray(zr?.seasons) && zr.seasons.length)
    ? zr.seasons
    : (Array.isArray(zr?.regions) ? [{ regions: zr.regions }] : []);
  for (const s of seasons) {
    const regs = Array.isArray(s.regions) ? s.regions : [];
    for (const r of regs) {
      const secs = r?.sections || {};
      for (const [name, sec] of Object.entries(secs)) {
        const raw = sec?.rule || 'unknown';
        const rule = COERCE[raw] || raw;
        if (!out[name] || (RANK[rule] ?? 0) > (RANK[out[name]] ?? 0)) {
          out[name] = rule;
        }
      }
    }
  }
  return out;
}

// Get the list of regions from zone_rules. Returns [] if none.
function _zrRegions(zr) {
  if (!zr) return [];
  const seasons = (Array.isArray(zr.seasons) && zr.seasons.length)
    ? zr.seasons
    : (Array.isArray(zr.regions) ? [{ regions: zr.regions }] : []);
  const out = [];
  for (const s of seasons) {
    const regs = Array.isArray(s.regions) ? s.regions : [];
    for (const r of regs) out.push(r);
  }
  return out;
}

// Filter the visible AMENITY_DEFS list (the has_X=true / parking-data
// tiles) into one flat array.
function _visibleAmenityTiles(amenities) {
  if (!amenities) return [];
  return AMENITY_DEFS.map((d, i) => ({ ...d, _i: i })).filter(d => {
    if (amenities[d.key] === true) return true;
    if (d.key === 'has_parking') {
      return (Array.isArray(amenities.parking_options) && amenities.parking_options.length > 0)
          || (amenities.parking_fee != null) || amenities.parking_subtype
          || amenities.parking_type || amenities.parking_notes;
    }
    return false;
  });
}

// Render a tile array. Sort: most-favorable-to-dogs first
// (off_leash → on_leash → unknown/no-rule → not_allowed), parking
// first within the same favorability bucket, then label length.
const _DOG_FAVOR = { off_leash: 0, on_leash: 1, unknown: 2, not_allowed: 3 };
function _renderTileSet(tiles, amenities, ruleFor) {
  const decorated = tiles.map(d => ({
    d,
    rule: ruleFor ? ruleFor(d) : null,
    favor: _DOG_FAVOR[(ruleFor ? ruleFor(d) : null) ?? 'unknown'] ?? 2,
  }));
  decorated.sort((a, b) => {
    if (a.favor !== b.favor) return a.favor - b.favor;
    if (a.d.key === 'has_parking') return -1;
    if (b.d.key === 'has_parking') return 1;
    const la = a.d.label.length, lb = b.d.label.length;
    return la === lb ? a.d._i - b.d._i : la - lb;
  });
  return decorated.map(x => _renderAmenityTileWithRule(x.d, amenities, x.rule)).join('');
}

function buildAmenitiesSection(amenities, dogPolicy) {
  if (!amenities && !dogPolicy?.zone_rules) return '';
  const regions = _zrRegions(dogPolicy?.zone_rules);

  // Build the all-zones amenity tiles (has_X=true items not tied to
  // a specific zone) — lifeguards, drinking_water, fire_pits, food,
  // ADA. Zone-tied amenities (parking, restrooms, showers, picnic_area)
  // appear under their zones; pull them out here.
  const zoneTiedKeys = new Set(Object.values(_SECTION_TO_AMENITY));
  const allAmenityTiles = _visibleAmenityTiles(amenities);
  const sharedAmenityTiles = allAmenityTiles.filter(t => !zoneTiedKeys.has(t.key));
  const zoneTiedAmenityTiles = allAmenityTiles.filter(t => zoneTiedKeys.has(t.key));

  // SINGLE-ZONE (or no zone_rules) — collapse to one grid.
  if (regions.length <= 1) {
    const ruleMap = _ruleMapFromZoneRules(dogPolicy?.zone_rules || {});
    const sectionTiles = [];
    for (const [secName, rule] of Object.entries(ruleMap)) {
      if (_SECTION_TO_AMENITY[secName]) continue;
      const tile = _SECTION_TILE[secName];
      if (!tile) continue;
      sectionTiles.push({
        key: `section:${secName}`, icon: tile.icon, label: tile.label,
        sectionName: secName,
        _i: 100 + Object.keys(_SECTION_TILE).indexOf(secName),
      });
    }
    const all = [...allAmenityTiles, ...sectionTiles];
    if (!all.length) return '';
    const ruleFor = d => {
      if (d.sectionName) return ruleMap[d.sectionName];
      const matching = Object.entries(_SECTION_TO_AMENITY)
        .find(([sec, key]) => key === d.key)?.[0];
      return matching ? ruleMap[matching] : null;
    };
    const cells = _renderTileSet(all, amenities, ruleFor);
    return `<section class="card amenities-card">
      <h2>Amenities</h2>
      <div class="amenity-grid">${cells}</div>
    </section>`;
  }

  // MULTI-ZONE: shared amenities at top, then per-zone groups with
  // header labels. Zone-tied amenities (parking/restrooms/showers/
  // picnic_area) appear under each zone that has the matching section.
  const blocks = [];
  if (sharedAmenityTiles.length) {
    blocks.push(`<div class="amenity-grid">${_renderTileSet(sharedAmenityTiles, amenities, null)}</div>`);
  }
  const _RULE_COERCE = {
    off_leash_voice_control: 'off_leash',
    on_leash_or_voice:       'on_leash',
  };
  for (const reg of regions) {
    const secs = reg?.sections || {};
    const secEntries = Object.entries(secs);
    if (!secEntries.length) continue;
    const ruleHere = name => {
      const raw = secs[name]?.rule || 'unknown';
      return _RULE_COERCE[raw] || raw;
    };
    // Tiles for THIS region only:
    //  - zone-tied amenity tiles where the matching section is in this region
    //  - section-only tiles for everything else in this region
    const tilesForRegion = [];
    for (const t of zoneTiedAmenityTiles) {
      const matchingSection = Object.entries(_SECTION_TO_AMENITY)
        .find(([sec, key]) => key === t.key)?.[0];
      if (matchingSection && secs[matchingSection]) tilesForRegion.push(t);
    }
    for (const [name] of secEntries) {
      if (_SECTION_TO_AMENITY[name]) continue;
      const t = _SECTION_TILE[name];
      if (!t) continue;
      tilesForRegion.push({
        key: `section:${name}`, icon: t.icon, label: t.label,
        sectionName: name,
        _i: 100 + Object.keys(_SECTION_TILE).indexOf(name),
      });
    }
    if (!tilesForRegion.length) continue;
    const zoneName = reg.name || 'Whole beach';
    const ruleFor = d => {
      if (d.sectionName) return ruleHere(d.sectionName);
      const matching = Object.entries(_SECTION_TO_AMENITY)
        .find(([sec, key]) => key === d.key)?.[0];
      return matching ? ruleHere(matching) : null;
    };
    blocks.push(`
      <div class="amenity-zone-header">${escHtml(zoneName)}</div>
      <div class="amenity-grid">${_renderTileSet(tilesForRegion, amenities, ruleFor)}</div>`);
  }

  if (!blocks.length) return '';
  return `<section class="card amenities-card">
    <h2>Amenities</h2>
    ${blocks.join('')}
  </section>`;
}


// _renderSectionPill / _renderTimeCell / _renderZoneCard /
// buildZoneRulesSection / time-tab handler all moved to
// src/zone-rules-block.js (shared with detail.html).

// ─── Weather card ────────────────────────────────────────────────
// Live against Open-Meteo (forecast) + NOAA CO-OPS (tides). No cache.
// Renders empty mount; loadWeather() fills it after fetch.

// WMO weather code → emoji + label.
const WMO_ICON = {
  0:['☀️','Clear'], 1:['🌤️','Mostly sunny'], 2:['⛅','Partly cloudy'], 3:['☁️','Overcast'],
  45:['🌫️','Fog'], 48:['🌫️','Fog'],
  51:['🌦️','Drizzle'], 53:['🌦️','Drizzle'], 55:['🌦️','Drizzle'],
  61:['🌧️','Light rain'], 63:['🌧️','Rain'], 65:['🌧️','Heavy rain'],
  71:['🌨️','Snow'], 73:['🌨️','Snow'], 75:['🌨️','Heavy snow'],
  80:['🌧️','Showers'], 81:['🌧️','Showers'], 82:['🌧️','Heavy showers'],
  95:['⛈️','Thunderstorm'], 96:['⛈️','Thunderstorm'], 99:['⛈️','Thunderstorm'],
};
function wmoIcon(code) { return (WMO_ICON[code] || ['🌡️','—'])[0]; }
function wmoLabel(code) { return (WMO_ICON[code] || ['🌡️','—'])[1]; }

function buildWeatherSection(beach) {
  // Mobile: tide is reduced to a single icon + height in the weather
  // line above; the SVG curve + hi/lo events are dropped entirely.
  return `<section class="card weather-card">
    <h2>Weather and Tides</h2>
    <div id="weather-mount" class="weather-loading">Loading conditions…</div>
  </section>`;
}

function _fmtTideTime(iso) {
  const d = new Date(iso);
  const hh = d.getHours(), mm = d.getMinutes();
  const h = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh;
  const ap = hh >= 12 ? 'pm' : 'am';
  return mm ? `${h}:${String(mm).padStart(2,'0')}${ap}` : `${h}${ap}`;
}

// Mobile weather line — sourced from server data, not a browser fetch.
// Reads the current local hour's row from hours_today for temp/wind/
// UV/tide; falls back to today's averages when the row is missing.
// Weather code icon comes from today.weather_code (daily summary).
function _renderWeatherToday(hoursToday, today, timezone) {
  const mount = document.getElementById('weather-mount');
  if (!mount) return;
  const nowH = _currentLocalHour(timezone);
  const row  = Array.isArray(hoursToday)
    ? hoursToday.find(h => h?.local_hour === nowH) || hoursToday.find(h => h?.is_now)
    : null;
  const code = today?.weather_code ?? null;
  const temp = row?.temp_air ?? today?.avg_temp ?? null;
  const wind = row?.wind_speed ?? today?.avg_wind ?? null;
  const uv   = row?.uv_index ?? today?.avg_uv ?? null;
  const tide = row?.tide_height != null ? parseFloat(row.tide_height) : null;
  const parts = [];
  if (code != null) parts.push(`<span class="weather-now-cond" title="${escHtml(wmoLabel(code))}">${wmoIcon(code)}</span>`);
  if (temp != null) parts.push(`<span>🌡️ ${Math.round(parseFloat(temp))}°</span>`);
  if (wind != null) parts.push(`<span>💨 ${Math.round(parseFloat(wind))}mph</span>`);
  if (uv != null)   parts.push(`<span>☀️ ${Math.round(parseFloat(uv))}</span>`);
  if (Number.isFinite(tide)) parts.push(`<span>🌊 ${tide.toFixed(1)}ft</span>`);
  if (!parts.length) { mount.innerHTML = ''; return; }
  mount.innerHTML = `<div class="weather-line">${parts.join('<span class="weather-sep">·</span>')}</div>`;
  mount.classList.remove('weather-loading');
}

function _renderTidesToday(tides, forecast) {
  const mount = document.getElementById('tide-mount');
  if (!mount) return;
  // NOAA can return predictions that include trailing hours from the
  // next day. Filter to today's local date prefix so the polyline
  // doesn't wrap around (a 24th point dated tomorrow lands back at
  // x=0 and produces a stray diagonal across the whole chart).
  const _today = new Date();
  const _y = _today.getFullYear(),
        _m = String(_today.getMonth()+1).padStart(2,'0'),
        _d = String(_today.getDate()).padStart(2,'0');
  const _todayStr = `${_y}-${_m}-${_d}`;
  const hourly = (tides?.hourly || []).filter(p => p?.t && p.t.startsWith(_todayStr));
  const hilo   = (tides?.hilo   || []).filter(p => p?.t && p.t.startsWith(_todayStr));
  if (!Array.isArray(hourly) || hourly.length === 0) {
    // Fall back to hilo-only text if we got hilo but no hourly.
    if (Array.isArray(hilo) && hilo.length) {
      const rows = hilo.slice(0,4).map(p => `
        <span>${p.type === 'H' ? '⬆' : '⬇'} <strong>${_fmtTideTime(p.t.replace(' ','T'))}</strong> · ${parseFloat(p.v).toFixed(1)}ft</span>`).join('');
      mount.innerHTML = `<div class="tide-events">${rows}</div>`;
    } else {
      mount.innerHTML = `<div class="tide-empty">Tide predictions unavailable.</div>`;
    }
    mount.classList.remove('weather-loading');
    return;
  }

  // Infographic SVG: one tide line, hi/lo text markers, NOW dot,
  // zero-ft reference, hour axis at bottom. Hover anywhere on the
  // curve to see exact time + height (interactive crosshair).
  const W = 280, H = 130, padTop = 22, padBottom = 24;
  const minV = Math.min(...hourly.map(p => parseFloat(p.v)));
  const maxV = Math.max(...hourly.map(p => parseFloat(p.v)));
  const rng  = Math.max(maxV - minV, 0.5);

  const xOf = (t) => {
    const hh = parseInt(t.slice(11,13), 10);
    const mm = parseInt(t.slice(14,16), 10);
    return ((hh + mm/60) / 24) * W;
  };
  const yOf = (v) => H - padBottom - ((parseFloat(v) - minV) / rng) * (H - padTop - padBottom);

  // Single smooth polyline through the hourly points. Tides are
  // naturally smooth so straight segments + stroke-linejoin:round
  // look very close to a sine curve without bezier artifacts.
  const pts = hourly.map(p => ({ x: xOf(p.t), y: yOf(p.v) }));
  const line = 'M ' + pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L ');

  // Hi/lo markers — borderless text only. Includes a <title> for
  // native browser hover showing time + height.
  const markersHtml = Array.isArray(hilo) ? hilo.slice(0,4).map(p => {
    const x = xOf(p.t), y = yOf(p.v);
    const arrow = p.type === 'H' ? '↑' : '↓';
    const heightStr = `${parseFloat(p.v).toFixed(1)}ft`;
    const timeStr = _fmtTideTime(p.t.replace(' ','T'));
    const txtY = p.type === 'H' ? Math.max(y - 6, padTop) : Math.min(y + 14, H - padBottom - 4);
    return `
      <text x="${x.toFixed(1)}" y="${txtY.toFixed(1)}" text-anchor="middle">
        <title>${p.type === 'H' ? 'High tide' : 'Low tide'} · ${escHtml(timeStr)} · ${heightStr}</title>
        <tspan class="tide-marker-arrow">${arrow}</tspan>
        <tspan class="tide-marker-text" dx="2">${heightStr}</tspan>
      </text>`;
  }).join('') : '';

  // Zero-tide horizontal reference line (only if 0 is within the
  // visible range; some lake beaches sit far above MLLW).
  const zeroY = yOf(0);
  const zeroLine = (zeroY >= padTop && zeroY <= H - padBottom)
    ? `<line x1="0" y1="${zeroY.toFixed(1)}" x2="${W}" y2="${zeroY.toFixed(1)}" class="tide-zero-line"/>
       <text x="${W - 4}" y="${(zeroY - 2).toFixed(1)}" text-anchor="end" class="tide-zero-label">0 ft</text>`
    : '';

  // Hour scale along the bottom (12am, 6am, 12pm, 6pm)
  const hourLabels = [0, 6, 12, 18].map(h => {
    const x = (h / 24) * W;
    const lbl = h === 0 ? '12am' : h === 12 ? '12pm' : (h < 12 ? `${h}am` : `${h-12}pm`);
    const anchor = h === 0 ? 'start' : (h === 18 ? 'end' : 'middle');
    return `<text x="${x.toFixed(1)}" y="${H - 4}" text-anchor="${anchor}" class="tide-hour-axis-label">${lbl}</text>`;
  }).join('');

  // NOW marker — filled dot + "NOW" label, with hover title.
  const now = new Date();
  const nowHour = now.getHours() + now.getMinutes()/60;
  const nowX = (nowHour / 24) * W;
  const iLo = Math.floor(nowHour);
  const iHi = Math.min(iLo + 1, pts.length - 1);
  const frac = nowHour - iLo;
  const nowY = (pts[iLo]?.y ?? padTop) * (1 - frac) + (pts[iHi]?.y ?? padTop) * frac;
  const nowHeight = (parseFloat(hourly[iLo]?.v ?? 0) * (1 - frac)
                  + parseFloat(hourly[iHi]?.v ?? 0) * frac).toFixed(1);
  const nowMarker = `
    <circle cx="${nowX.toFixed(1)}" cy="${nowY.toFixed(1)}" r="4" class="tide-now-dot">
      <title>Now · ${nowHeight}ft</title>
    </circle>
    <text x="${nowX.toFixed(1)}" y="${(nowY - 9).toFixed(1)}" text-anchor="middle" class="tide-now-label">NOW</text>`;

  // Precompute 48 static hover zones (one per 30-min bucket). Each
  // is an invisible rect carrying a native SVG <title> with the
  // bucket-center time + interpolated tide height. Zero JS handlers,
  // zero per-frame compute — browser handles the tooltip natively.
  const zonesHtml = (() => {
    const out = [];
    const zoneW = W / 48;
    for (let z = 0; z < 48; z++) {
      const hourFloat = z * 0.5;             // 0.0, 0.5, 1.0, ... 23.5
      const iLo = Math.min(Math.floor(hourFloat), pts.length - 1);
      const iHi = Math.min(iLo + 1, pts.length - 1);
      const f   = hourFloat - iLo;
      const v   = parseFloat(hourly[iLo].v) * (1 - f) + parseFloat(hourly[iHi].v) * f;
      const hh  = Math.floor(hourFloat);
      const mm  = (hourFloat % 1) === 0 ? 0 : 30;
      const ap  = hh >= 12 ? 'pm' : 'am';
      const h12 = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh;
      const tip = `${h12}:${String(mm).padStart(2,'0')}${ap} · ${v.toFixed(1)}ft`;
      out.push(`<rect x="${(z * zoneW).toFixed(2)}" y="${padTop}"
                      width="${zoneW.toFixed(2)}" height="${H - padTop - padBottom}"
                      class="tide-hover-zone"><title>${tip}</title></rect>`);
    }
    return out.join('');
  })();

  mount.innerHTML = `
    <svg class="tide-curve" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      ${zeroLine}
      <path d="${line}" class="tide-stroke"/>
      ${markersHtml}
      ${nowMarker}
      ${hourLabels}
      ${zonesHtml}
    </svg>`;
  mount.classList.remove('weather-loading');
}

// Mobile: NO browser→Open-Meteo fetch. The weather line is rendered
// entirely from server-side data already in the get_beach_info
// payload (today's summary + hours_today), so the page never hits a
// 3rd-party CORS / 502 / network error.
async function loadWeather(beach, hoursToday, today) {
  const weatherMount = document.getElementById('weather-mount');
  if (!weatherMount) return;
  _renderWeatherToday(hoursToday, today, beach.timezone);
}

// Build the {hourly, hilo} shape _renderTidesToday expects, derived
// from hours_today.tide_height. Local minima/maxima of the 24-point
// array become hi/lo events. Replaces the previous NOAA fetch.
function _deriveTideCurveFromHours(hoursToday) {
  if (!Array.isArray(hoursToday)) return null;
  const _t = new Date();
  const _y = _t.getFullYear();
  const _m = String(_t.getMonth() + 1).padStart(2, '0');
  const _d = String(_t.getDate()).padStart(2, '0');
  const datePrefix = `${_y}-${_m}-${_d}`;
  const hourly = hoursToday
    .filter(h => h && h.tide_height != null && h.local_hour != null)
    .sort((a, b) => a.local_hour - b.local_hour)
    .map(h => ({
      t: `${datePrefix} ${String(h.local_hour).padStart(2, '0')}:00`,
      v: String(h.tide_height),
    }));
  if (hourly.length < 3) return { hourly, hilo: [] };
  const hilo = [];
  for (let i = 1; i < hourly.length - 1; i++) {
    const prev = parseFloat(hourly[i - 1].v);
    const cur  = parseFloat(hourly[i].v);
    const next = parseFloat(hourly[i + 1].v);
    if (cur > prev && cur > next) {
      hilo.push({ t: hourly[i].t, v: hourly[i].v, type: 'H' });
    } else if (cur < prev && cur < next) {
      hilo.push({ t: hourly[i].t, v: hourly[i].v, type: 'L' });
    }
  }
  // Cap to 4 (typical day = 2 highs + 2 lows). Hourly resolution
  // means timing precision is to-the-hour, not minutes like NOAA's
  // native 6-min predictions — acceptable for an at-a-glance display.
  return { hourly, hilo: hilo.slice(0, 4) };
}

// Beach overview card. Title = beach display name. Carries the
// LLM static description + async Scout narrative. The best-window
// info lives in its own card (buildBestTimeCard).
function buildOverviewCard(beach, description) {
  const blurb = description?.text;
  if (!blurb) return '';
  // Beach text — bare prose, no card chrome, no title. Beach name
  // already appears in the page header next to the Your-Fit badge.
  return `<p class="overview-blurb">${escHtml(blurb)}</p>`;
}

// Best-window card — standalone, all black text. Status pill keeps
// its tinted background for the at-a-glance signal but pill text is
// black for typographic consistency.
// Hourly score bar — ports detail.html's score row exactly: one
// .score-bar-col per hour with the score value above, dog icon for
// hours in the best window, status-color fill, and x-axis labels
// every other hour.
// Best-fit "from" / "to" hours for the chart x-axis. Priority:
//   1. Gate hours (beach.open_time/close_time, non-default seed)
//   2. Posted prose parse (regex out an "8am-6pm" style range from
//      amenities.hours_text)
//   3. Standard fallback 05:00–22:00 (matches the universal seed)
function _parseHoursText(text) {
  if (!text) return null;
  const m = String(text).match(
    /(\d{1,2})(?::(\d{2}))?\s*(am|pm)\s*(?:[-–]|to)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)/i);
  if (!m) return null;
  const to24 = (h, ap) => {
    h = parseInt(h, 10);
    if (/pm/i.test(ap) && h < 12) h += 12;
    if (/am/i.test(ap) && h === 12) h = 0;
    return h;
  };
  return { startH: to24(m[1], m[3]), endH: to24(m[4], m[6]) };
}
function _hoursWindowForChart(beach, amenities) {
  const open  = beach?.open_time;
  const close = beach?.close_time;
  const isDefault = open === '05:00' && close === '22:00';
  if (open && close && !isDefault) {
    return { startH: parseInt(open.slice(0,2), 10),
             endH:   parseInt(close.slice(0,2), 10) };
  }
  const parsed = _parseHoursText(amenities?.hours_text);
  if (parsed) return parsed;
  return { startH: 5, endH: 22 };
}

function _renderScoreBars(hoursToday, beach, amenities, dogPolicy) {
  if (!Array.isArray(hoursToday) || hoursToday.length === 0) return '';
  const { startH, endH } = _hoursWindowForChart(beach, amenities);
  // One bar per hour in the open window. Null-score hours inside the
  // window (dog-prohibition zones, pre-sunrise, etc.) render as no_go
  // red so the chart stays continuous instead of leaving gaps.
  const hours = hoursToday
    .filter(h => h.local_hour >= startH && h.local_hour <= endH)
    .sort((a, b) => a.local_hour - b.local_hour);
  if (hours.length === 0) return '';

  // Bars display the per-hour appeal Overall (same 60/20/20 mix as the
  // page-level Your-Fit card), STACKED into Access / Amenities /
  // Weather segments — same visual language as the Your-Fit bar.
  // Tall bar = high overall; structural colors signal category.
  const amenitiesScore = _amenitiesScore(amenities);
  const contribsFor = h => {
    if (h.hour_score == null) return null;
    let avail = _hourlyAvailability(h.local_hour, dogPolicy?.zone_rules, USER_PREF);
    if (avail == null) avail = _availabilityFromFlags(dogPolicy, USER_PREF);
    const access  = Math.round(0.60 * avail);
    const amen    = Math.round(0.20 * amenitiesScore);
    const wx      = Math.round(0.20 * h.hour_score);
    return { access, amen, wx, overall: access + amen + wx };
  };

  // Best-window indicator derives from the SAME from-now window the
  // row label + Scout blurb use. Used for the 🐶 emphasis on bars
  // inside the window.
  const nowWindow = _bestWindowFromNow(hoursToday, beach, amenities, dogPolicy);
  const inWindow = h => nowWindow != null
    && h.local_hour >= nowWindow.start && h.local_hour < nowWindow.end;

  const MAX_PX = 35; // bar max height in CSS px (was 22; +60%)
  const fmtHour = hh => {
    const ap = hh >= 12 ? 'pm' : 'am';
    const h12 = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh;
    return `${h12}${ap}`;
  };

  const contribs = hours.map(contribsFor);
  const overalls = contribs.map(c => c?.overall ?? null);
  const maxV = Math.max(...overalls.filter(v => v != null), 1);
  const pxFor = v => Math.max(Math.round((v / maxV) * MAX_PX), 0);

  const barsHtml = hours.map((h, i) => {
    const c = contribs[i];
    const noScore = c == null;
    const dog  = !noScore && inWindow(h) ? '🐶' : '';
    const valueLabel = noScore ? '' : c.overall;
    const title = noScore
      ? `${fmtHour(h.local_hour)} · not allowed`
      : `${fmtHour(h.local_hour)} · ${c.overall} (access ${c.access} + amen ${c.amen} + wx ${c.wx})`;
    // Excluded hours render a single full-height red bar (no segments).
    const innerHtml = noScore
      ? `<div class="score-bar-seg-excluded" style="height:${MAX_PX}px"></div>`
      : `<div class="score-bar-seg score-bar-seg-weather"   style="height:${pxFor(c.wx)}px"></div>
         <div class="score-bar-seg score-bar-seg-amenities" style="height:${pxFor(c.amen)}px"></div>
         <div class="score-bar-seg score-bar-seg-access"    style="height:${pxFor(c.access)}px"></div>`;
    return `
      <div class="score-bar-col" title="${title}">
        <div class="score-bar-dog">${dog}</div>
        <div class="score-bar-value">${valueLabel}</div>
        <div class="score-bar">${innerHtml}</div>
      </div>`;
  }).join('');

  const xAxisHtml = hours.map((h, i) =>
    `<div class="score-x-label">${(i % 2 === 0) ? fmtHour(h.local_hour) : ''}</div>`
  ).join('');

  return `<div class="score-row">
    <div class="score-row-label">Score</div>
    <div class="score-bars-wrap">${barsHtml}</div>
    <div class="score-x-axis">${xAxisHtml}</div>
  </div>`;
}

// Find the longest contiguous block of "good" hours (per-hour Overall
// >= threshold) starting from the current local hour forward.
// User-pref-aware, time-of-day-aware. Returns {start, end} hour ints
// (end is exclusive), or null if no good window remains today.
function _bestWindowFromNow(hoursToday, beach, amenities, dogPolicy, threshold = 70) {
  if (!Array.isArray(hoursToday) || hoursToday.length === 0) return null;
  const nowH = _currentLocalHour(beach?.timezone);
  if (nowH == null) return null;
  const amenitiesScore = _amenitiesScore(amenities);
  const marked = hoursToday
    .filter(h => h && h.local_hour != null && h.local_hour >= nowH && h.hour_score != null)
    .sort((a, b) => a.local_hour - b.local_hour)
    .map(h => {
      let avail = _hourlyAvailability(h.local_hour, dogPolicy?.zone_rules, USER_PREF);
      if (avail == null) avail = _availabilityFromFlags(dogPolicy, USER_PREF);
      const overall = Math.round(0.60 * avail + 0.20 * amenitiesScore + 0.20 * h.hour_score);
      return { local_hour: h.local_hour, good: overall >= threshold };
    });
  let best = null;
  let cur = null;
  const seal = () => {
    if (cur && (!best || (cur.end - cur.start) > (best.end - best.start))) best = cur;
    cur = null;
  };
  for (const m of marked) {
    if (m.good) {
      if (!cur) cur = { start: m.local_hour, end: m.local_hour + 1 };
      else if (m.local_hour === cur.end) cur.end = m.local_hour + 1;
      else { seal(); cur = { start: m.local_hour, end: m.local_hour + 1 }; }
    } else { seal(); }
  }
  seal();
  return best;
}

function _formatHourRange(startH, endH) {
  const fmt = hh => {
    const ap = hh >= 12 ? 'pm' : 'am';
    const h12 = hh === 0 ? 12 : hh > 12 ? hh - 12 : hh;
    return `${h12}${ap}`;
  };
  return `${fmt(startH)}–${fmt(endH)}`;
}

function buildBestTimeCard(today, dogPolicy, beachFid, hoursToday, beach, amenities) {
  // Time-aware best window — recomputed from current local hour
  // forward, using the same per-hour Overall the bar chart uses.
  const nowWindow = _bestWindowFromNow(hoursToday, beach, amenities, dogPolicy);
  const windowLabel = nowWindow ? _formatHourRange(nowWindow.start, nowWindow.end) : null;
  const hasWindow = !!windowLabel;
  const isNoDogs = !!dogPolicy && (
    dogPolicy.dogs_allowed === 'no' ||
    (dogPolicy.has_on_leash === false && dogPolicy.has_off_leash === false)
  );
  const isSandWaterProhibited = _sandOrWaterProhibited(dogPolicy?.zone_rules);
  // Card shows when there's a window OR an apology to convey.
  if (!hasWindow && !isNoDogs && !isSandWaterProhibited) return '';

  // Clickable when hourly detail is available. day_status presence
  // implies the hourly_scores row was computed, so detail.html will
  // render. Skip the clickable affordance when there's no hourly.
  const clickable = !!(today && today.day_status);
  const clickAttr = clickable ? ' data-open-detail="1"' : '';

  // Compact summary header: title left, time-range right. Hourly bars
  // and Scout blurb moved to their own sibling card below.
  const headlineText = windowLabel || (isNoDogs ? 'Not allowed' : 'No window');
  return `<section class="card besttime-card${clickable ? ' clickable' : ''}" data-fid="${beachFid}">
    <div class="besttime-header">
      <h2>Best Time</h2>
      <div class="besttime-headline"${clickAttr}>${escHtml(headlineText)}</div>
    </div>
  </section>`;
}

// Lazily-mounted detail modal — iframe to detail.html for the per-hour
// bar charts. One modal element reused across clicks; appended to body
// the first time we need it.
function _ensureDetailModal() {
  let m = document.getElementById('detail-modal');
  if (m) return m;
  m = document.createElement('div');
  m.id = 'detail-modal';
  m.className = 'detail-modal';
  m.innerHTML = `
    <div class="detail-modal-inner">
      <button class="detail-modal-close" type="button" aria-label="Close">×</button>
      <iframe src="about:blank" loading="lazy"></iframe>
    </div>`;
  document.body.appendChild(m);
  const close = () => {
    m.classList.remove('open');
    // Blank the iframe so audio/animations stop.
    m.querySelector('iframe').src = 'about:blank';
  };
  m.querySelector('.detail-modal-close').addEventListener('click', close);
  m.addEventListener('click', e => { if (e.target === m) close(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && m.classList.contains('open')) close();
  });
  return m;
}

function _wireBestTimeClick() {
  const card = document.querySelector('.besttime-card.clickable');
  if (!card) return;
  const fid = card.dataset.fid;
  const open = (e) => {
    if (!e.target.closest('[data-open-detail]')) return;
    e.preventDefault();
    const today = new Date().toISOString().slice(0, 10);
    const m = _ensureDetailModal();
    m.querySelector('iframe').src = `detail.html?fid=${fid}&date=${today}&embed=charts`;
    m.classList.add('open');
  };
  card.addEventListener('click', open);
}

// Advisories card — per-metric advisory/caution/no_go time blocks
