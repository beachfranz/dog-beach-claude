// Caution tiles for the combo card — same shape as amenity/activity chips
// (icon + tiny label), color-coded by severity. Subset of the items the
// standalone Cautions card builds; we just relabel to single words.
function _cautionTiles(today, dogPolicy, hoursToday, beach) {
  // Unified per Franz 2026-05-19: cautions now flow from beach_advisory
  // RPC via loadWaterConditionAdvisories (async). Combo card's Cautions
  // row hides when this returns []. _cautionItems is still used by the
  // Scout LLM prompt below — leave it intact.
  void today; void dogPolicy; void hoursToday; void beach;
  return [];
}

// Build the raw item list (icon/label/status/value/time). Shared between
// the legacy Cautions card and the new combo-card row. Time-aware.
function _cautionItems(today, dogPolicy, hoursToday, beach) {
  // Time-aware filter: cautions only matter for the rest of the day.
  // If a high tide peaked at 7am and it's now 2pm, nobody needs a
  // warning about it — strip past hours from the metric pass.
  const nowH   = _currentLocalHour(beach?.timezone);
  const nowMin = _currentLocalMinutes(beach?.timezone);
  const remainingHours = (Array.isArray(hoursToday) ? hoursToday : [])
    .filter(h => nowH == null || h.local_hour == null || h.local_hour >= nowH);

  // Day-level signals (already aggregated by daily-refresh).
  // Bacteria risk persists across the day — keep regardless of time.
  // Dogs-prohibited time window drops when the end has already passed.
  const dayItems = [];
  if (today?.bacteria_risk && today.bacteria_risk !== 'none' && today.bacteria_risk !== 'low') {
    dayItems.push({ status: 'caution', icon: '🦠', label: 'Bacteria',
                    value: today.bacteria_risk, time: '' });
  }
  if (dogPolicy?.dogs_prohibited_start && dogPolicy?.dogs_prohibited_end) {
    const endMin = _hhmmToMinutes(dogPolicy.dogs_prohibited_end);
    const stillRelevant = nowMin == null || endMin == null || endMin > nowMin;
    if (stillRelevant) {
      dayItems.push({ status: 'no_go', icon: '🚫', label: 'Dogs prohibited',
                      value: `${dogPolicy.dogs_prohibited_start}–${dogPolicy.dogs_prohibited_end}`, time: '' });
    }
  }

  // Per-metric time-block items from hours_today
  const METRICS = [
    { icon: '🌊',  label: 'Tide',    statusKey: 'tide_status',    valueKey: 'tide_height',    fmt: v => v != null ? `${v.toFixed(1)} ft` : '—' },
    { icon: '💨',  label: 'Wind',    statusKey: 'wind_status',    valueKey: 'wind_speed',     fmt: v => v != null ? `${Math.round(v)} mph` : '—' },
    { icon: '🌧️', label: 'Rain',    statusKey: 'rain_status',    valueKey: 'precip_chance',  fmt: v => v != null ? `${Math.round(v)}%` : '—' },
    { icon: '👥',  label: 'Crowd',   statusKey: 'crowd_status',   valueKey: 'busyness_score', fmt: v => v != null ? `${Math.round(v)}/100` : '—' },
    { icon: '🌡',  label: 'Temp',    statusKey: 'temp_status',    valueKey: 'temp_air',       fmt: v => v != null ? `${Math.round(v)}°F` : '—' },
    { icon: '☀️',  label: 'UV',      statusKey: 'uv_status',      valueKey: 'uv_index',       fmt: v => v != null ? `UV ${v.toFixed(1)}` : '—' },
    { icon: '🏖️', label: 'Sand',    statusKey: 'sand_status',    valueKey: 'sand_temp',      fmt: v => v != null ? `${Math.round(v)}°F` : '—' },
    { icon: '🚶',  label: 'Asphalt', statusKey: 'asphalt_status', valueKey: 'asphalt_temp',   fmt: v => v != null ? `${Math.round(v)}°F` : '—' },
  ];
  const STATUS_RANK = { no_go: 3, caution: 2, advisory: 1 };
  const fmtH = h => h === 0 ? '12am' : h === 12 ? '12pm' : (h < 12 ? `${h}am` : `${h-12}pm`);
  const getBlocks = flagged => {
    if (!flagged.length) return [];
    const blocks = [[flagged[0]]];
    for (let i = 1; i < flagged.length; i++) {
      if (flagged[i].local_hour === flagged[i-1].local_hour + 1) blocks[blocks.length-1].push(flagged[i]);
      else blocks.push([flagged[i]]);
    }
    return blocks;
  };

  const metricItems = [];
  if (remainingHours.length) {
    for (const m of METRICS) {
      // Cautions card surfaces only caution + no_go (advisory excluded).
      // Source is `remainingHours` — past-hour cautions are already dropped.
      const flagged = remainingHours.filter(h => h[m.statusKey] === 'caution' || h[m.statusKey] === 'no_go');
      if (!flagged.length) continue;
      let blocks = getBlocks(flagged);
      if (blocks.length >= 3) {
        blocks = blocks.slice().sort((a,b) => b.length - a.length).slice(0, 2)
                       .sort((a,b) => a[0].local_hour - b[0].local_hour);
      }
      const allHours = blocks.flat();
      const worst = allHours.reduce((w, h) => {
        const s = h[m.statusKey];
        return (STATUS_RANK[s] ?? 0) > (STATUS_RANK[w] ?? 0) ? s : w;
      }, 'caution');
      const vals = allHours.map(h => h[m.valueKey]).filter(v => v != null);
      const worstVal = vals.length
        ? (m.label === 'Temp' ? vals.reduce((a, b) => Math.abs(b - 72) > Math.abs(a - 72) ? b : a, vals[0])
                              : Math.max(...vals))
        : null;
      const times = blocks.map(b => `${fmtH(b[0].local_hour)}–${fmtH(b[b.length-1].local_hour + 1)}`).join(', ');
      metricItems.push({ status: worst, icon: m.icon, label: m.label,
                         value: m.fmt(worstVal), time: times });
    }
  }

  // Per-metric tooltip strings — explain what trips a caution.
  const CAUTION_TIPS = {
    Tide:    'Caution when high tide ≥ 5.0 ft — limited beach access',
    Wind:    'Caution when sustained wind ≥ 15 mph',
    Rain:    'Caution on high precipitation chance / severe weather codes',
    Crowd:   'Caution when busyness 61-84 (packed beach)',
    Temp:    'Caution outside 50-75°F — too cold or too hot',
    UV:      'Caution when UV index ≥ 8',
    Sand:    'Caution when sand temperature ≥ 115°F — paw burn risk',
    Asphalt: 'Caution when asphalt ≥ 115°F — paw burn risk',
    Bacteria:           "Water-quality risk — avoid letting your dog swim or drink seawater",
    'Dogs prohibited':  "Dogs aren't allowed at this beach during these hours",
  };

  // Combined list, sorted: highest severity first, then label alphabetical.
  return [...dayItems, ...metricItems].sort(
    (a, b) => (STATUS_RANK[b.status] ?? 0) - (STATUS_RANK[a.status] ?? 0)
           || a.label.localeCompare(b.label));
}

// Scout blurb — narrative paragraph from beach-chat (Anthropic LLM)
// describing today's conditions. Short-circuits to canned apologies
// when dogs aren't allowed / sand prohibited / no good windows.
async function loadScoutBlurb(beach, today, dogPolicy, hoursToday, amenities) {
  // Mobile splits Scout into BEACH (top) + NOW (after Activities)
  // cards. Single chat call returns both halves separated by markers;
  // we parse and render into the two mounts.
  const beachEl = document.getElementById('scout-beach-blurb');
  const nowEl   = document.getElementById('scout-now-blurb');
  const el = nowEl; // legacy alias used by the short-circuits below
  if (!nowEl && !beachEl) return;

  const isNoDogs = !!dogPolicy && (
    dogPolicy.dogs_allowed === 'no' ||
    (dogPolicy.has_on_leash === false && dogPolicy.has_off_leash === false)
  );
  const isSandWaterProhibited = _sandOrWaterProhibited(dogPolicy?.zone_rules);
  const noGoodWindows = today && today.day_status === 'no_go';

  // Hide the BEACH card during apology cases — single message in NOW.
  const hideBeach = () => {
    const card = document.querySelector('.scout-beach-card');
    if (card) card.style.display = 'none';
  };
  // Helper — any short-circuit path also ends the loader.
  const finishLoader = () => { if (window.Loader) Loader.stop(); };
  if (isNoDogs) {
    if (el) el.textContent = "Sorry bud — dogs aren't allowed here. Check the alternatives below for a nearby spot that welcomes pups.";
    el?.classList.add('loaded'); hideBeach(); finishLoader(); return;
  }
  if (isSandWaterProhibited) {
    if (el) el.textContent = "Sorry bud — dogs aren't allowed on the sand or in the water here. Check the alternatives below for a beach where pups can actually hit the surf.";
    el?.classList.add('loaded'); hideBeach(); finishLoader(); return;
  }
  if (!today) {
    if (el) el.textContent = '';
    hideBeach(); finishLoader(); return;
  }
  if (noGoodWindows) {
    if (el) el.textContent = "Today's looking rough at this beach — no go-quality hours. Check the alternatives below if you can travel.";
    el?.classList.add('loaded'); hideBeach(); finishLoader(); return;
  }

  // Time-aware window: only consider hours from the current local hour
  // forward, using the same per-hour Overall the bar chart uses. If the
  // morning best window already passed, Scout should talk about what's
  // LEFT today, not what was great at 6am.
  const nowWindow = _bestWindowFromNow(hoursToday, beach, amenities, dogPolicy);
  if (!nowWindow) {
    if (el) el.textContent = "Today's good windows have already passed at this beach — check back tomorrow morning.";
    el?.classList.add('loaded'); hideBeach(); finishLoader(); return;
  }
  const windowLabel  = _formatHourRange(nowWindow.start, nowWindow.end);
  const windowStatus = today.best_window_status ?? 'go';

  // ── Deterministic cautions + descriptive metaphors ───────────────
  // Scout's prompt receives a STRICT list of what's actually flagged
  // today, plus an explicit list of conditions that are NOT issues.
  // Stops the LLM from inventing "hot sand" / "paw burn risk" when
  // surface temps are cool. UV is conveyed as a prose metaphor (no
  // raw numeric scores in Scout's output).
  //
  // Time-aware: only consider remaining hours today. Past peaks
  // (e.g. high tide at 7am when it's now 2pm) aren't actionable, so
  // we don't pass them to Scout as "active cautions."
  const _scoutNowH = _currentLocalHour(beach?.timezone);
  const hrs = (Array.isArray(hoursToday) ? hoursToday : [])
    .filter(h => h && h.hour_score != null)
    .filter(h => _scoutNowH == null || h.local_hour == null || h.local_hour >= _scoutNowH);
  const maxOf = key => hrs.reduce((m, h) => (h[key] != null && parseFloat(h[key]) > m ? parseFloat(h[key]) : m), -Infinity);
  const minOf = key => hrs.reduce((m, h) => (h[key] != null && parseFloat(h[key]) < m ? parseFloat(h[key]) : m), +Infinity);
  const maxSand    = maxOf('sand_temp');
  const maxAsphalt = maxOf('asphalt_temp');
  const maxUV      = maxOf('uv_index');
  const maxWind    = maxOf('wind_speed');
  const maxTempAir = maxOf('temp_air');
  const minTempAir = minOf('temp_air');
  const peakTide   = maxOf('tide_height');
  const cautionFacts = [];
  if (peakTide   >= 5)   cautionFacts.push(`HIGH TIDE peaking at ${peakTide.toFixed(1)}ft — less sand exposed`);
  if (maxWind    >= 15)  cautionFacts.push(`WIND ${Math.round(maxWind)}mph — secure loose items`);
  if (maxSand    >= 115) cautionFacts.push(`HOT SAND ${Math.round(maxSand)}°F — paw burn risk`);
  if (maxAsphalt >= 115) cautionFacts.push(`HOT ASPHALT ${Math.round(maxAsphalt)}°F — paw burn risk in parking lot`);
  if (minTempAir !== Infinity && minTempAir < 55) cautionFacts.push(`COLD: ${Math.round(minTempAir)}°F lows`);
  if (maxTempAir >= 90)  cautionFacts.push(`HOT AIR ${Math.round(maxTempAir)}°F`);
  if (maxUV      >= 8)   cautionFacts.push('STRONG UV — sunscreen for the kahu');
  if (today.bacteria_risk && !['none','low'].includes(today.bacteria_risk))
    cautionFacts.push(`BACTERIA: ${today.bacteria_risk}`);
  // Non-issues — explicitly listed so Scout doesn't invent them.
  const nonIssues = [];
  if (maxSand < 115)    nonIssues.push(`sand is cool (${Number.isFinite(maxSand) ? Math.round(maxSand) + '°F' : 'cool'}) — DO NOT mention hot sand or paw burn on sand`);
  if (maxAsphalt < 115) nonIssues.push(`asphalt is fine — DO NOT mention hot asphalt or paw burn on pavement`);
  if (maxUV < 6)        nonIssues.push('UV is moderate — DO NOT push sunscreen hard');
  if (maxWind < 15)     nonIssues.push('wind is calm — DO NOT mention wind concerns');
  if (peakTide < 5)     nonIssues.push('tide is normal — DO NOT mention high tide / cliffs');
  if (!today.bacteria_risk || ['none','low'].includes(today.bacteria_risk)) nonIssues.push('water quality is fine — DO NOT mention bacteria');
  // Descriptive metaphors instead of raw scores.
  const uvMetaphor = maxUV >= 9 ? 'sun is searing'
                   : maxUV >= 7 ? 'sun is punching hard'
                   : maxUV >= 5 ? 'strong sun'
                   : maxUV >= 3 ? 'moderate sun'
                   : Number.isFinite(maxUV) ? 'gentle sun' : null;
  const tempMetaphor = maxTempAir >= 90 ? 'a scorcher'
                     : maxTempAir >= 80 ? 'warm and bright'
                     : maxTempAir >= 70 ? 'sunny and mild'
                     : maxTempAir >= 60 ? 'comfortable'
                     : maxTempAir >= 50 ? 'cool'
                     : Number.isFinite(maxTempAir) ? 'chilly' : null;
  const windMetaphor = maxWind >= 20 ? 'wind is howling'
                     : maxWind >= 15 ? 'wind is blowing through'
                     : maxWind >= 10 ? 'breezy'
                     : Number.isFinite(maxWind) ? 'still air' : null;

  const nowH = _currentLocalHour(beach?.timezone);
  const nowLabel = nowH != null
    ? (nowH === 0 ? '12am' : nowH > 12 ? `${nowH - 12}pm` : nowH === 12 ? '12pm' : `${nowH}am`)
    : null;

  const actPhrases  = _activityPhrases(beach, dogPolicy, amenities, hoursToday);

  // Two-part structure for the mobile blurb:
  //   BEACH (2 sentences) — describe the beach + its zones (static
  //     character; what kind of place this is).
  //   NOW   (2 sentences) — why the remaining window is great today,
  //     with 1-2 activity references woven in + caution guidance for
  //     dog + kahu. Mention how much fun the user and dog will have.
  // Pack-list intentionally NOT mentioned — the Pack List card below
  // handles that. Scout's prose stays about beach + window only.
  const question =
    `Current local time: ${nowLabel || 'now'}. Best window remaining: ${windowLabel} (${windowStatus}).\n\n` +
    `ACTIVE CAUTIONS TODAY (address these and ONLY these):\n${cautionFacts.length ? cautionFacts.map(c => '- ' + c).join('\n') : '- (none — conditions are clean)'}\n\n` +
    `NOT FLAGGED TODAY (you MUST NOT mention these as concerns; they are explicitly NOT issues):\n${nonIssues.length ? nonIssues.map(n => '- ' + n).join('\n') : '- (n/a)'}\n\n` +
    `DESCRIPTIVE METAPHORS — use these phrasings instead of raw numeric scores anywhere in your prose:\n` +
    (uvMetaphor   ? `- UV: "${uvMetaphor}"\n`     : '') +
    (tempMetaphor ? `- Temp: "${tempMetaphor}"\n` : '') +
    (windMetaphor ? `- Wind: "${windMetaphor}"\n` : '') +
    `\nActivities the zone rules ALLOW today (weave 1-2 into NOW; do NOT invent, do NOT list all): ${actPhrases.join(' · ')}\n\n` +
    `Write the response in EXACTLY this two-part format on separate lines:\n\n` +
    `BEACH: <2 short sentences describing the beach and its zones — character, what kind of place it is, what makes it good for dogs. Static features only. NO weather, NO today.>\n\n` +
    `NOW: <2 short sentences on why the **${windowLabel}** window is great today (bold the window in **markdown**). Weave in 1-2 activities + emphasize the FUN the kahu and pup will have. Address ONLY the active cautions listed above with CONCRETE guidance for both dog AND kahu. Use the metaphors instead of numbers.>\n\n` +
    `STRICT RULES:\n` +
    `- Mention only cautions from the ACTIVE CAUTIONS list above. The "NOT FLAGGED" list is what you must NOT mention.\n` +
    `- NEVER write raw UV numbers, raw wind mph, or sand-temperature numbers in the prose. Use the metaphors.\n` +
    `- BOLD only the time window. No headers beyond BEACH:/NOW:, no bullets, no pack list, no gear recommendations.\n` +
    `- Respect DOG POLICY ZONE RULES; never describe activities in sections marked not_allowed.\n` +
    `- Never reference times before the current local time.\n` +
    `- Use ONLY the activities provided — don't invent.`;

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/beach-chat`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ arena_group_id: beach.fid, question, conversation_history: [] }),
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const { answer } = await res.json();
    // Parse the answer into BEACH / NOW halves. The prompt asks the
    // model to emit them on labeled lines; fall back to first-half /
    // second-half split if labels are missing.
    const raw = String(answer || '');
    const mB = raw.match(/^\s*BEACH\s*:\s*([\s\S]*?)\s*(?:\n+\s*)?(?=NOW\s*:|$)/i);
    const mN = raw.match(/NOW\s*:\s*([\s\S]*)$/i);
    let beachText = mB ? mB[1].trim() : '';
    let nowText   = mN ? mN[1].trim() : '';
    if (!beachText && !nowText) {
      const sentences = raw.split(/(?<=[.!?])\s+/);
      const halfIdx = Math.ceil(sentences.length / 2);
      beachText = sentences.slice(0, halfIdx).join(' ').trim();
      nowText   = sentences.slice(halfIdx).join(' ').trim();
    }
    const toHtml = s => escHtml(s).replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>');
    if (beachEl) { beachEl.innerHTML = toHtml(beachText); beachEl.classList.add('loaded'); }
    if (nowEl)   { nowEl.innerHTML   = toHtml(nowText);   nowEl.classList.add('loaded'); }
  } catch (e) {
    console.warn('scout blurb fetch failed:', e);
    if (beachEl) beachEl.textContent = '';
    if (nowEl)   nowEl.textContent   = '';
  }
  _renderScoutCTA(beach);
  // LLM blurb (success or fail) has landed — request the loader to
  // end. The loader still waits for its first list-pass to complete
  // before fading out.
  if (window.Loader) Loader.stop();
}

// ─── Scout CTA ───────────────────────────────────────────────────────
// "Wanna go? Drive ~XX min. [Send directions →]" — drive estimate from
// browser geolocation (one-shot, cached in localStorage for a day).
// Falls back to no-drive-time if user denies or geolocation absent.
async function _renderScoutCTA(beach) {
  const ctaEl = document.getElementById('scout-cta');
  if (!ctaEl || beach.lat == null || beach.lng == null) return;
  const mapsUrl = buildMapsUrl(beach);
  const friendsBtn = `<button class="scout-cta-btn scout-cta-btn-friends" type="button" data-friends-share="1">🐾 Let Friends Know</button>`;
  const dirsBtn = `<a class="scout-cta-btn" href="${escHtml(mapsUrl)}" target="_blank" rel="noopener">Get directions →</a>`;
  const actions = `<div class="scout-cta-actions">${friendsBtn}${dirsBtn}</div>`;
  // Render immediately; drive time fills in below if location is known.
  const setHtml = (txt) => {
    ctaEl.innerHTML = `<span class="scout-cta-text">${txt}</span>${actions}`;
    const btn = ctaEl.querySelector('[data-friends-share]');
    if (btn) btn.addEventListener('click', () => _shareFriendsPlan(beach));
  };
  setHtml('Wanna go?');
  const user = await _getUserLocation();
  if (!user) return;
  const minutes = _estimateDriveMinutes(user, beach);
  if (!Number.isFinite(minutes) || minutes <= 0) return;
  setHtml(`Wanna go? Drive ~${minutes} min.`);
}

// "Let Friends Know" — Web Share API on mobile/PWA; clipboard fallback
// elsewhere. v1 lets the user broadcast the plan to anyone they want.
async function _shareFriendsPlan(beach) {
  const url = location.href;
  const title = `${beach.display_name || beach.name || 'Beach'} — Dog Beach Scout`;
  const text  = `Heading to ${beach.display_name || beach.name || 'the beach'} today.`;
  if (navigator.share) {
    try { await navigator.share({ title, text, url }); return; } catch {}
  }
  // Fallback: copy URL to clipboard.
  try {
    await navigator.clipboard.writeText(url);
    const ctaEl = document.getElementById('scout-cta');
    const btn = ctaEl?.querySelector('[data-friends-share]');
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = '🐾 Link copied';
      setTimeout(() => { btn.textContent = orig; }, 1600);
    }
  } catch {}
}

function _haversineMiles(a, b) {
  const R = 3958.8;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180;
  const lat2 = b.lat * Math.PI / 180;
  const s = Math.sin(dLat / 2) ** 2 + Math.sin(dLng / 2) ** 2 * Math.cos(lat1) * Math.cos(lat2);
  return 2 * R * Math.asin(Math.sqrt(s));
}

function _estimateDriveMinutes(user, beach) {
  const miles = _haversineMiles(user, { lat: beach.lat, lng: beach.lng });
  // 1.8 min/mile: mix of freeway + surface streets with mild traffic.
  return Math.round(miles * 1.8);
}

async function _getUserLocation() {
  // Mobile: solicit browser geolocation on page load (one-shot, cached
  // 24h in localStorage). Per Franz "Solicit location from user".
  // Priority: URL param → cached → browser prompt → null.
  const qp = new URLSearchParams(location.search);
  const ulat = parseFloat(qp.get('user_lat'));
  const ulng = parseFloat(qp.get('user_lng'));
  if (Number.isFinite(ulat) && Number.isFinite(ulng)) return { lat: ulat, lng: ulng };
  try {
    const raw = localStorage.getItem('dogbeach.user_loc');
    if (raw) {
      const cached = JSON.parse(raw);
      if (cached && Number.isFinite(cached.lat) && Number.isFinite(cached.lng)
          && Date.now() - (cached.t || 0) < 86400000) return cached;
    }
  } catch {}
  if (!navigator.geolocation) return null;
  return new Promise(resolve => {
    let settled = false;
    const done = (v) => { if (!settled) { settled = true; resolve(v); } };
    const timeout = setTimeout(() => done(null), 6000);
    navigator.geolocation.getCurrentPosition(
      pos => {
        clearTimeout(timeout);
        const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude, t: Date.now() };
        try { localStorage.setItem('dogbeach.user_loc', JSON.stringify(loc)); } catch {}
        done(loc);
      },
      () => { clearTimeout(timeout); done(null); },
      { timeout: 6000, maximumAge: 86400000 },
    );
  });
}

// Map popup — lazy-mounted modal with Leaflet + OSRM-driven nav route.
async function _openMapModal(beach) {
  if (beach.lat == null || beach.lng == null) return;
  let modal = document.getElementById('map-modal');
  if (!modal) {
    modal = document.createElement('div');
    modal.id = 'map-modal';
    modal.className = 'map-modal';
    modal.innerHTML = `
      <div class="map-modal-inner">
        <button class="map-modal-close" type="button" aria-label="Close">×</button>
        <div class="map-modal-meta" id="map-modal-meta">Calculating route…</div>
        <div id="map-modal-map" class="map-modal-map"></div>
        <a class="map-modal-cta" id="map-modal-dirs" target="_blank" rel="noopener">Get directions →</a>
      </div>`;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => {
      if (e.target === modal) modal.classList.remove('open');
    });
    modal.querySelector('.map-modal-close').addEventListener('click', () => modal.classList.remove('open'));
  }
  modal.classList.add('open');
  document.getElementById('map-modal-dirs').href = buildMapsUrl(beach);
  const meta = document.getElementById('map-modal-meta');
  // Init Leaflet on first open
  if (!modal._map) {
    const m = L.map('map-modal-map', { zoomControl: true, scrollWheelZoom: false })
      .setView([beach.lat, beach.lng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      attribution: '© OSM', maxZoom: 19,
    }).addTo(m);
    L.marker([beach.lat, beach.lng]).addTo(m);
    modal._map = m;
  }
  // Always invalidate after opening — modal display:none → flex
  // means Leaflet had stale dimensions.
  requestAnimationFrame(() => modal._map.invalidateSize());
  setTimeout(() => modal._map.invalidateSize(), 200);

  const user = await _getUserLocation();
  if (!user) {
    meta.textContent = 'Distance unavailable — location not shared';
    modal._map.setView([beach.lat, beach.lng], 13);
    return;
  }
  // User pin
  if (modal._userMarker) modal._userMarker.remove();
  modal._userMarker = L.circleMarker([user.lat, user.lng], {
    radius: 7, color: '#1d4ed8', fillColor: '#3b82f6',
    fillOpacity: 0.9, weight: 2,
  }).addTo(modal._map);
  // Try OSRM public routing; fall back to straight line + haversine.
  try {
    const url = `https://router.project-osrm.org/route/v1/driving/${user.lng},${user.lat};${beach.lng},${beach.lat}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    if (res.ok) {
      const data = await res.json();
      const route = data.routes?.[0];
      if (route && route.geometry?.coordinates) {
        const miles   = (route.distance / 1609.34).toFixed(1);
        const minutes = Math.round(route.duration / 60);
        meta.innerHTML = `<strong>${miles} mi</strong> · <strong>${minutes} min</strong> drive`;
        if (modal._route) modal._route.remove();
        const coords = route.geometry.coordinates.map(([lng, lat]) => [lat, lng]);
        modal._route = L.polyline(coords, { color: '#1d4ed8', weight: 4, opacity: 0.75 }).addTo(modal._map);
        modal._map.fitBounds(modal._route.getBounds(), { padding: [40, 40] });
        return;
      }
    }
    throw new Error('OSRM no route');
  } catch (e) {
    const miles = _haversineMiles(user, { lat: beach.lat, lng: beach.lng });
    const minutes = _estimateDriveMinutes(user, beach);
    meta.innerHTML = `<strong>${miles.toFixed(1)} mi</strong> · ~${minutes} min drive (est.)`;
    if (modal._route) modal._route.remove();
    modal._route = L.polyline(
      [[user.lat, user.lng], [beach.lat, beach.lng]],
      { color: '#1d4ed8', weight: 3, opacity: 0.5, dashArray: '6 6' },
    ).addTo(modal._map);
    modal._map.fitBounds(L.latLngBounds([[beach.lat, beach.lng], [user.lat, user.lng]]), { padding: [40, 40] });
  }
}

async function _populateDistanceAndDrive(beach) {
  const carDistEl = document.getElementById('secondline-car-dist');
  if (!carDistEl || beach.lat == null || beach.lng == null) return;
  const user = await _getUserLocation();
  if (!user) {
    carDistEl.textContent = 'Map';
    return;
  }
  const miles = _haversineMiles(user, { lat: beach.lat, lng: beach.lng });
  if (!Number.isFinite(miles) || miles <= 0) {
    carDistEl.textContent = 'Map';
    return;
  }
  const milesLabel = miles >= 10 ? Math.round(miles) : miles.toFixed(1);
  carDistEl.textContent = `${milesLabel} mi`;
}

// True ONLY if dogs have no sand/water access anywhere on the beach —
// every region's sand/water_swim/dunes/tide_pools section is not_allowed
// AND no time_window inside those sections permits dogs. If ANY region
// or time_window permits dog access to sand/water, this returns false
// (Franz rule 2026-05-15: any zone with dog access means the beach is
// not a no-go).
function _sandOrWaterProhibited(zr) {
  if (!zr || typeof zr !== 'object') return false;
  const seasons = (Array.isArray(zr.seasons) && zr.seasons.length)
    ? zr.seasons
    : (Array.isArray(zr.regions) ? [{ regions: zr.regions }] : []);
  const blocked = ['sand', 'water_swim', 'dunes', 'tide_pools'];
  let sawAnyBlockedSection = false;
  for (const s of seasons) {
    const regions = Array.isArray(s.regions) ? s.regions : [];
    for (const reg of regions) {
      const sections = reg.sections || {};
      for (const name of blocked) {
        const sec = sections[name];
        if (!sec) continue;
        sawAnyBlockedSection = true;
        if (sec.rule && sec.rule !== 'not_allowed') return false;
        const tws = Array.isArray(sec.time_windows) ? sec.time_windows : [];
        if (tws.some(tw => tw.rule && tw.rule !== 'not_allowed')) return false;
      }
    }
  }
  return sawAnyBlockedSection;
}

// ─── Appeal scoring (v1, client-side) ─────────────────────────────
// User-pref-aware fit score for the beach. Three components weighted
// 60/20/20: availability fit (does the beach permit the user's
// preferred leash mode), amenities (dog-relevant facilities),
// weather (best hour today). Page-level aggregate uses MAX across
// daylight hours for hourly components.
//
// Pref source priority: ?pref= URL param, then localStorage, else
// default 'off_leash'. Values: 'off_leash' | 'on_leash' | 'either'.

const USER_PREF = (() => {
  const valid = new Set(['off_leash', 'on_leash', 'either']);
  const qp = new URLSearchParams(location.search).get('pref');
  if (qp && valid.has(qp)) {
    try { localStorage.setItem('dogbeach.user_pref', qp); } catch {}
    return qp;
  }
  try {
    const ls = localStorage.getItem('dogbeach.user_pref');
    if (ls && valid.has(ls)) return ls;
  } catch {}
  return 'off_leash';
})();

const _PREF_LABEL = { off_leash: 'off-leash', on_leash: 'on-leash', either: 'any access' };

// Hour H (0-23) is inside a time_window iff [start, end) covers it
// AND today's date is inside the (optional) effective_from_md/_to_md
// seasonal envelope. Handles wrap-around for both daily and seasonal axes.
// Windows without seasonal envelope apply year-round.
function _tw_contains(tw, hour) {
  if (!tw || !tw.start || !tw.end) return false;
  const startH = parseInt(String(tw.start).slice(0, 2), 10);
  const endH   = parseInt(String(tw.end).slice(0, 2), 10);
  if (Number.isNaN(startH) || Number.isNaN(endH)) return false;
  // Seasonal envelope gate (Phase H4 followup fix 2026-05-17): if
  // effective_from_md / effective_to_md present, today must fall inside
  // the recurring MM-DD range. Without this the 9-6 Jun-Sep prohibition
  // applies year-round, false-suppressing dogs Oct-May.
  const fromMd = tw.effective_from_md;
  const toMd   = tw.effective_to_md;
  if (fromMd || toMd) {
    const now = new Date();
    const today = String(now.getMonth() + 1).padStart(2, '0') + '-' +
                  String(now.getDate()).padStart(2, '0');
    const from = fromMd || '01-01';
    const to   = toMd   || '12-31';
    const inEnvelope = (from <= to)
      ? (today >= from && today <= to)
      : (today >= from || today <= to);  // wrap-around year boundary
    if (!inEnvelope) return false;
  }
  if (endH > startH) return hour >= startH && hour < endH;
  // Wrap-around (daily)
  return hour >= startH || hour < endH;
}

// Effective rule at hour H for a node (region or section). Returns
// the matching time_window rule if any, else node.rule. Null if neither.
function _effectiveRuleAt(node, hour) {
  if (!node) return null;
  const tws = Array.isArray(node.time_windows) ? node.time_windows : [];
  for (const tw of tws) {
    if (_tw_contains(tw, hour)) return tw.rule || null;
  }
  return node.rule || null;
}

// Per-hour availability score 0-100. Walks every region+section in
// zone_rules; returns max across them. 100 = at least one zone
// permits the user's preferred mode at this hour. 50 = a zone permits
// dogs but not the preferred mode (e.g. wants off_leash, gets
// on_leash). 0 = no zone permits dogs at this hour.
function _hourlyAvailability(hour, zoneRules, userPref) {
  if (!zoneRules) return null;
  const seasons = Array.isArray(zoneRules.seasons) && zoneRules.seasons.length
    ? zoneRules.seasons
    : (Array.isArray(zoneRules.regions) ? [{ regions: zoneRules.regions }] : []);
  let best = 0;
  let anyData = false;
  for (const s of seasons) {
    const regions = Array.isArray(s.regions) ? s.regions : [];
    for (const region of regions) {
      anyData = true;
      const regionFallback = _effectiveRuleAt(region, hour);
      const sections = region.sections || {};
      const sectionKeys = Object.keys(sections);
      const ruleSet = sectionKeys.length
        ? sectionKeys.map(k => _effectiveRuleAt(sections[k], hour) || regionFallback)
        : [regionFallback];
      for (const rule of ruleSet) {
        const score = (userPref === 'either')
          ? (rule && rule !== 'not_allowed' ? 100 : 0)
          : rule === userPref ? 100
            : (rule && rule !== 'not_allowed') ? 50
            : 0;
        if (score > best) best = score;
        if (best === 100) return 100;
      }
    }
  }
  return anyData ? best : null;
}

// Fallback when zone_rules is absent — use the rolled-up has_on/off_leash flags.
function _availabilityFromFlags(dogPolicy, userPref) {
  const on = dogPolicy?.has_on_leash === true;
  const off = dogPolicy?.has_off_leash === true;
  if (userPref === 'either') return (on || off) ? 100 : 0;
  if (userPref === 'off_leash') return off ? 100 : (on ? 50 : 0);
  if (userPref === 'on_leash')  return on  ? 100 : (off ? 50 : 0);
  return 0;
}

// Amenities score 0-100. Drinking water + parking weighted 2×.
function _amenitiesScore(amenities) {
  if (!amenities) return 0;
  const weights = {
    has_parking: 2, has_drinking_water: 2,
    has_restrooms: 1, has_showers: 1, has_picnic_area: 1,
    has_lifeguards: 1, has_disabled_access: 1,
    has_fire_pits: 0.5,
  };
  const totalWeight = Object.values(weights).reduce((a, b) => a + b, 0);
  let earned = 0;
  for (const [key, w] of Object.entries(weights)) {
    if (amenities[key] === true) earned += w;
  }
  return Math.round((earned / totalWeight) * 100);
}

// Compose the three component scores + overall. Aggregates hourly
// components (availability, weather) with MAX across daylight hours
// — see project memory for why max over mean for v1.
function _appealScores(beach, dogPolicy, amenities, hoursToday) {
  const pref = USER_PREF;
  const daylight = (hoursToday || []).filter(h => h && h.hour_score != null);
  const availabilities = daylight
    .map(h => _hourlyAvailability(h.local_hour, dogPolicy?.zone_rules, pref))
    .filter(v => v != null);
  let availability = availabilities.length ? Math.max(...availabilities) : null;
  if (availability == null) availability = _availabilityFromFlags(dogPolicy, pref);
  const amenitiesScore = _amenitiesScore(amenities);
  const weatherScore = daylight.length
    ? Math.max(...daylight.map(h => h.hour_score))
    : 0;
  const overall = Math.round(0.60 * availability + 0.20 * amenitiesScore + 0.20 * weatherScore);
  return { availability, amenitiesScore, weatherScore, overall, userPref: pref };
}

function buildAppealCard(beach, dogPolicy, amenities, hoursToday) {
  const s = _appealScores(beach, dogPolicy, amenities, hoursToday);
  const prefLabel = _PREF_LABEL[s.userPref] || s.userPref;
  return `<section class="card appeal-card">
    <div class="appeal-header">
      <h2>Your Fit <span class="appeal-pref">· ${escHtml(prefLabel)}</span></h2>
      <div class="appeal-overall">
        <span class="appeal-overall-num">${s.overall}</span><span class="appeal-overall-max">/100</span>
      </div>
    </div>
  </section>`;
}

// ─── Pack list (rule-based, no LLM) ──────────────────────────────
// Replaces the 2026-05-07 pack-list-via-Scout sentence that was
// dropped because Sonnet hallucinated swim gear on no-dog beaches.
// Deterministic: each item is a (icon, label, reason) triple
// gated by zone-rule + condition checks. Universal items always
// included; conditional items only when the data supports them.

function _zoneSectionPermits(zr, sectionName) {
  if (!zr) return false;
  const seasons = Array.isArray(zr.seasons) && zr.seasons.length
    ? zr.seasons : (Array.isArray(zr.regions) ? [{ regions: zr.regions }] : []);
  for (const s of seasons) {
    for (const reg of (s.regions || [])) {
      const sec = reg?.sections?.[sectionName];
      if (sec && sec.rule && sec.rule !== 'not_allowed') return true;
    }
  }
  return false;
}

// Prose-form pack list — composes the same conditional gear list as
// _packListItems into a single sentence for the Scout card. The chip
// card retains the structured icons + tooltips for at-a-glance use.
function _packListPhrases(beach, dogPolicy, amenities, hoursToday) {
  const phrases = ['water', 'poop bags', 'a leash'];
  const hrs = Array.isArray(hoursToday) ? hoursToday.filter(h => h && h.hour_score != null) : [];
  const numericMax = (key) => hrs.reduce((m, h) => {
    const v = h[key]; return (v != null && v > m) ? v : m;
  }, -Infinity);
  const numericMin = (key) => hrs.reduce((m, h) => {
    const v = h[key]; return (v != null && v < m) ? v : m;
  }, +Infinity);
  const waterAllowed = _zoneSectionPermits(dogPolicy?.zone_rules, 'water_swim');
  const sandAllowed  = _zoneSectionPermits(dogPolicy?.zone_rules, 'sand');
  const maxTemp = numericMax('temp_air');
  const minTemp = numericMin('temp_air');
  if (waterAllowed) {
    phrases.push('a towel for the wet pup');
    if (maxTemp >= 70) phrases.push('a fetch toy');
  } else if (sandAllowed && maxTemp >= 65) {
    phrases.push('a fetch toy');
  }
  const maxUV      = numericMax('uv_index');
  const maxWind    = numericMax('wind_speed');
  const maxSand    = numericMax('sand_temp');
  const maxAsphalt = numericMax('asphalt_temp');
  if (maxUV >= 6) {
    phrases.push(`sunscreen (UV peaks at ${maxUV.toFixed(1)})`);
  }
  if (maxSand >= 115 && maxAsphalt >= 115) {
    phrases.push('paw booties — sand and asphalt are both scorching');
  } else if (maxSand >= 115) {
    phrases.push('paw booties for the hot sand');
  } else if (maxAsphalt >= 115) {
    phrases.push('paw booties for the parking-lot asphalt');
  }
  if ((minTemp !== Infinity && minTemp < 55) || maxWind >= 18) {
    phrases.push(minTemp < 55 ? 'a warm layer for yourself' : 'a windbreaker for yourself');
  }
  return phrases;
}

function _packListItems(beach, dogPolicy, amenities, hoursToday) {
  const items = [];
  // Universal
  items.push({ icon: '💧', label: 'Water',     reason: 'Always' });
  items.push({ icon: '💩', label: 'Poop bags', reason: 'Always' });
  items.push({ icon: '🦮', label: 'Leash',     reason: 'Entry zones' });

  const hrs = Array.isArray(hoursToday) ? hoursToday.filter(h => h && h.hour_score != null) : [];
  const numericMax = (key) => hrs.reduce((m, h) => {
    const v = h[key]; return (v != null && v > m) ? v : m;
  }, -Infinity);
  const numericMin = (key) => hrs.reduce((m, h) => {
    const v = h[key]; return (v != null && v < m) ? v : m;
  }, +Infinity);

  // Zone-conditional
  const waterAllowed = _zoneSectionPermits(dogPolicy?.zone_rules, 'water_swim');
  const sandAllowed  = _zoneSectionPermits(dogPolicy?.zone_rules, 'sand');
  const maxTemp      = numericMax('temp_air');
  const minTemp      = numericMin('temp_air');
  if (waterAllowed) {
    items.push({ icon: '🪣', label: 'Towel', reason: 'Wet dog' });
    if (maxTemp >= 70) {
      items.push({ icon: '🥎', label: 'Fetch toy', reason: 'Water + warm' });
    }
  } else if (sandAllowed && maxTemp >= 65) {
    items.push({ icon: '🥎', label: 'Fetch toy', reason: 'Sand play' });
  }

  // Weather-conditional
  const maxUV       = numericMax('uv_index');
  const maxWind     = numericMax('wind_speed');
  const maxSand     = numericMax('sand_temp');
  const maxAsphalt  = numericMax('asphalt_temp');
  if (maxUV >= 6) {
    items.push({ icon: '🧴', label: 'Sunscreen', reason: `UV ${maxUV.toFixed(1)}` });
  }
  if (maxSand >= 115 && maxAsphalt >= 115) {
    items.push({ icon: '🥾', label: 'Paw booties', reason: `Sand ${Math.round(maxSand)}°F · asphalt ${Math.round(maxAsphalt)}°F` });
  } else if (maxSand >= 115) {
    items.push({ icon: '🥾', label: 'Paw booties', reason: `Hot sand ${Math.round(maxSand)}°F` });
  } else if (maxAsphalt >= 115) {
    items.push({ icon: '🥾', label: 'Paw booties', reason: `Hot asphalt ${Math.round(maxAsphalt)}°F` });
  }
  if ((minTemp !== Infinity && minTemp < 55) || maxWind >= 18) {
    items.push({ icon: '🧥', label: 'Warm layer', reason: minTemp < 55 ? 'Chilly' : 'Windy' });
  }

  return items;
}

// Short labels for the pack-list chip strip — same visual language
// as the amenities + activities combo card on mobile.
const _PACK_SHORT = {
  'Water': 'Water', 'Poop bags': 'Bags', 'Leash': 'Leash',
  'Towel': 'Towel', 'Fetch toy': 'Toy',
  'Sunscreen': 'SPF', 'Paw booties': 'Booties',
  'Warm layer': 'Layer',

function buildPackListCard(beach, dogPolicy, amenities, hoursToday) {

// ─── Activities (rule-based, no LLM) ─────────────────────────────
// Deterministic "what to do with your dog" chips. Same shape + CSS as
// the Pack List card. Each chip gated by zone-rule + condition checks
// so Sonnet-hallucination patterns (recommending fetch on no-dog
// beaches) can't reach the consumer surface. Returns empty when
// zone_rules is null or no qualifying activity exists.

function _sectionBestRule(zr, sectionName) {
  if (!zr) return null;
  const RANK = { off_leash: 2, on_leash: 1, not_allowed: 0 };
  const seasons = Array.isArray(zr.seasons) && zr.seasons.length
    ? zr.seasons : (Array.isArray(zr.regions) ? [{ regions: zr.regions }] : []);
  let best = null;
  for (const s of seasons) {
    for (const reg of (s.regions || [])) {
      const sec = reg?.sections?.[sectionName];
      if (!sec || !sec.rule) continue;
      const r = sec.rule;
      if (best == null || (RANK[r] ?? -1) > (RANK[best] ?? -1)) best = r;
    }
  }
  return best;
}

function _activityPhrases(beach, dogPolicy, amenities, hoursToday) {
  const phrases = [];
  const zr = dogPolicy?.zone_rules;
  if (!zr) return phrases;

  const sand      = _sectionBestRule(zr, 'sand');
  const water     = _sectionBestRule(zr, 'water_swim');
  const trails    = _sectionBestRule(zr, 'trails');
  const tidePools = _sectionBestRule(zr, 'tide_pools');
  const picnic    = _sectionBestRule(zr, 'picnic_area');
  const board     = _sectionBestRule(zr, 'boardwalk');

  const hrs = Array.isArray(hoursToday) ? hoursToday.filter(h => h && h.hour_score != null) : [];
  const lowestTide = hrs.reduce((m, h) => {
    const v = h.tide_height; return (v != null && v < m) ? v : m;
  }, +Infinity);
  const maxTemp = hrs.reduce((m, h) => {
    const v = h.temp_air; return (v != null && v > m) ? v : m;
  }, -Infinity);
  const permits = r => r && r !== 'not_allowed';

  if (sand === 'off_leash' || water === 'off_leash') {
    phrases.push('let your pup run off-leash');
  }
  if (permits(sand)) {
    phrases.push(sand === 'off_leash'
      ? 'play fetch on the open sand'
      : 'play leashed fetch on the sand');
  } else if (permits(water)) {
    phrases.push('throw a toy into the surf for a water fetch');
  }
  if (permits(water)) {
    phrases.push(maxTemp >= 65
      ? `splash in the ${Math.round(maxTemp)}°F water`
      : 'wade in the chilly water');
  }
  if (permits(tidePools) && lowestTide !== Infinity && lowestTide < 2) {
    phrases.push(`poke around tide pools at low tide (${lowestTide.toFixed(1)} ft)`);
  }
  if (permits(trails)) {
    const sandRestricted = sand === 'not_allowed' || !sand;
    phrases.push(sandRestricted
      ? 'walk the trails (sand is restricted today)'
      : 'walk the trails');
  }
  if (permits(board)) {
    phrases.push('stroll the boardwalk');
  }
  if (permits(picnic)) {
    phrases.push('share a picnic in the designated area');
  }
  return phrases;
}

function _joinProse(phrases) {
  if (!phrases.length) return '';
  if (phrases.length === 1) return phrases[0];
  if (phrases.length === 2) return phrases.join(' and ');
  return phrases.slice(0, -1).join(', ') + ', and ' + phrases[phrases.length - 1];
}

// Mobile activities: icon-only chip strip. Each chip = one allowed
// activity (off-leash run, fetch, splash, etc.); tooltip carries the
// reason. Compact + scan-friendly; pairs with Scout's "now" prose
// which adds the narrative.
function _activityIcons(beach, dogPolicy, amenities, hoursToday) {
  const items = [];
  const zr = dogPolicy?.zone_rules;
  if (!zr) return items;
  const sand      = _sectionBestRule(zr, 'sand');
  const water     = _sectionBestRule(zr, 'water_swim');
  const trails    = _sectionBestRule(zr, 'trails');
  const tidePools = _sectionBestRule(zr, 'tide_pools');
  const picnic    = _sectionBestRule(zr, 'picnic_area');
  const board     = _sectionBestRule(zr, 'boardwalk');
  const hrs = Array.isArray(hoursToday) ? hoursToday.filter(h => h && h.hour_score != null) : [];
  const minVal = (k, init) => hrs.reduce((m, h) => (h[k] != null && h[k] < m) ? h[k] : m, init);
  const maxVal = (k, init) => hrs.reduce((m, h) => (h[k] != null && h[k] > m) ? h[k] : m, init);
  const lowestTide = minVal('tide_height', +Infinity);
  const maxTemp    = maxVal('temp_air',    -Infinity);
  const permits = r => r && r !== 'not_allowed';
  // Each chip carries the underlying section's rule so the chip can
  // share the same tint vocabulary as the Amenities tiles.
  if (sand === 'off_leash' || water === 'off_leash') {
    items.push({ icon: '🐾', rule: 'off_leash', tip: 'Off-leash zone today' });
  }
  if (permits(sand)) {
    items.push({ icon: '🥎', rule: sand,
      tip: sand === 'off_leash' ? 'Fetch on open sand' : 'Leashed fetch on sand' });
  } else if (permits(water)) {
    items.push({ icon: '🥎', rule: water, tip: 'Water fetch (sand restricted)' });
  }
  if (permits(water)) {
    items.push({ icon: '🌊', rule: water,
      tip: maxTemp >= 65 ? `Splash · ${Math.round(maxTemp)}°F` : 'Wade (chilly today)' });
  }
  if (permits(tidePools) && lowestTide !== Infinity && lowestTide < 2) {
    items.push({ icon: '🪨', rule: tidePools, tip: `Tide pools · low ${lowestTide.toFixed(1)}ft` });
  }
  if (permits(trails)) {
    const sandRestricted = sand === 'not_allowed' || !sand;
    items.push({ icon: '🥾', rule: trails,
      tip: sandRestricted ? 'Trails open (sand restricted)' : 'Trail walk' });
  }
  if (permits(board))   items.push({ icon: '🚶', rule: board,  tip: 'Boardwalk' });
  if (permits(picnic))  items.push({ icon: '🧺', rule: picnic, tip: 'Picnic area' });
  return items;
}

// Short labels rendered under each icon — tight enough to fit a chip.
const _AMENITY_SHORT = {
  has_parking: 'Park', has_restrooms: 'WC', has_showers: 'Shower',
  has_drinking_water: 'Water', has_picnic_area: 'Tables',
  has_fire_pits: 'Fire', has_lifeguards: 'Guard',
  has_disabled_access: 'ADA',
};
const _SECTION_SHORT = {
  sand: 'Sand', trails: 'Trails', water_swim: 'Water',
  dunes: 'Dunes', bluff: 'Bluff', boardwalk: 'Boardwalk',
  campground: 'Camp', playground: 'Play',
  tide_pools: 'Pools', nesting_zones: 'Nests',
};
const _ACTIVITY_SHORT = {
  '🐾': 'Off-leash', '🥎': 'Fetch', '🌊': 'Splash',
  '🪨': 'Tide pools', '🥾': 'Trails', '🚶': 'Boardwalk', '🧺': 'Picnic',
};

// Section / amenity keys that the Activities row already captures —
// don't double-render them in the Amenities row. Sand and water are
// intentionally NOT dedup'd: "Sand" in Amenities ≠ "Off-leash" in
// Activities; "Water" ≠ "Splash". "Tables" (has_picnic_area) is
// non-redundant — kept as an amenity even though Picnic is also an
// activity (the physical tables are distinct from the act of picnicking).
const _AMENITY_DEDUP_KEYS     = new Set();
const _AMENITY_DEDUP_SECTIONS = new Set(['trails']);

// Sort order for amenity + section tiles — most dog-relevant first.
// Anything not in this map sorts to the end.
const _AMENITY_PRIORITY = {
  has_parking:         1,
  has_drinking_water:  2,
  has_restrooms:       3,
  has_showers:         4,
  has_picnic_area:     5,
  'section:sand':      6,
  'section:water_swim':7,
  'section:tide_pools':8,
  'section:boardwalk': 9,
  has_lifeguards:     10,
  has_disabled_access:11,
  has_fire_pits:      12,
  'section:dunes':    13,
  'section:bluff':    14,
  'section:campground':15,
  'section:playground':16,
  'section:nesting_zones':17,
};

// Top-N flat list of amenity + section tiles for mobile, with the
// most-permissive rule attached and 'unknown' filtered out.
function _flatTopAmenities(amenities, dogPolicy, limit) {
  const ruleMap = _ruleMapFromZoneRules(dogPolicy?.zone_rules || {});
  const out = [];
  for (const a of _visibleAmenityTiles(amenities)) {
    if (_AMENITY_DEDUP_KEYS.has(a.key)) continue;
    const matchingSec = Object.entries(_SECTION_TO_AMENITY)
      .find(([sec, key]) => key === a.key)?.[0];
    const rule = matchingSec ? ruleMap[matchingSec] : null;
    if (rule === 'unknown') continue;
    out.push({
      kind: 'amenity', key: a.key, icon: a.icon, rule,
      short: _AMENITY_SHORT[a.key] || a.label,
      tip: _amenityTooltip(a, rule),
      _amen: amenities,
    });
  }
  for (const [secName, rule] of Object.entries(ruleMap)) {
    if (rule === 'unknown') continue;
    if (_SECTION_TO_AMENITY[secName]) continue;
    if (_AMENITY_DEDUP_SECTIONS.has(secName)) continue;
    const sec = _SECTION_TILE[secName]; if (!sec) continue;
    out.push({
      kind: 'section', sectionName: secName, icon: sec.icon, rule,
      short: _SECTION_SHORT[secName] || sec.label,
      tip: `${sec.label} · ${({off_leash:'Off-leash',on_leash:'On-leash',not_allowed:'Not allowed'})[rule] || rule}`,
    });
  }
  // Sort: dog-favorability first (off_leash > on_leash > neutral > not_allowed),
  // then by the explicit _AMENITY_PRIORITY map. Amenities without a rule
  // (parking, water, restrooms…) live in the middle "neutral" bucket so
  // a no-go section sinks below a plain restroom but an off-leash sand
  // beach floats to the top.
  const ruleRank = r => (
    r === 'off_leash'   ? 0 :
    r === 'on_leash'    ? 1 :
    r == null           ? 2 :
    r === 'not_allowed' ? 3 :
                          4
  );
  out.sort((a, b) => {
    const rA = ruleRank(a.rule);
    const rB = ruleRank(b.rule);
    if (rA !== rB) return rA - rB;
    const keyA = a.kind === 'section' ? `section:${a.sectionName}` : a.key;
    const keyB = b.kind === 'section' ? `section:${b.sectionName}` : b.key;
    return (_AMENITY_PRIORITY[keyA] ?? 99) - (_AMENITY_PRIORITY[keyB] ?? 99);
  });
  return out.slice(0, limit);
}

function _renderComboChip(it) {
  const ruleClass = it.rule ? ` rule-${it.rule}` : '';
  // Parking gets the type-aware icon + inline $ overlay.
  if (it.kind === 'amenity' && it.key === 'has_parking' && it._amen) {
    const a = it._amen;
    const type    = a.parking_type || (Array.isArray(a.parking_options) ? a.parking_options[0]?.type : '');
    const subtype = a.parking_subtype || (Array.isArray(a.parking_options) ? a.parking_options[0]?.subtype : '');
    const fee     = a.parking_fee != null ? a.parking_fee
                  : (Array.isArray(a.parking_options) ? a.parking_options[0]?.fee : null);
    const t = String(type || subtype || '').toLowerCase();
    const isStreet = /street/.test(t);
    const icon = isStreet ? '🚗' : '🅿️';
    const paidIcon = (fee === true || /meter/.test(t)) ? '<span class="amenity-paid">$</span>' : '';
    return `<div class="combo-chip${ruleClass}" data-tip="${escHtml(it.tip)}">
      <div class="combo-icon-row"><span class="combo-icon">${icon}</span>${paidIcon}</div>
      <div class="combo-label">${escHtml(it.short)}</div>
    </div>`;
  }
  return `<div class="combo-chip${ruleClass}" data-tip="${escHtml(it.tip)}">
    <span class="combo-icon">${it.icon}</span>
    <div class="combo-label">${escHtml(it.short)}</div>
  </div>`;
}

function buildAmenitiesAndActivitiesCard(beach, dogPolicy, amenities, hoursToday, today) {
  const amenTiles = _flatTopAmenities(amenities, dogPolicy, 8);
  const actTiles  = _activityIcons(beach, dogPolicy, amenities, hoursToday);
  const cautTiles = _cautionTiles(today, dogPolicy, hoursToday, beach);
  if (!amenTiles.length && !actTiles.length && !cautTiles.length) return '';
  const amenRow = amenTiles.map(_renderComboChip).join('');
  const actRow  = actTiles.map(it => {
    const ruleClass = it.rule ? ` rule-${it.rule}` : '';
    return `<div class="combo-chip${ruleClass}" data-tip="${escHtml(it.tip)}">
      <span class="combo-icon">${it.icon}</span>
      <div class="combo-label">${escHtml(_ACTIVITY_SHORT[it.icon] || it.tip)}</div>
    </div>`;
  }).join('');
  // Cautions row — same chip shape, severity-coded color (caution-warn /
  // caution-no_go). data-tip survives for desktop hover; on mobile the
  // inline label is the surface.
  const cautRow = cautTiles.map(it => {
    const sevClass = it.status === 'no_go' ? ' caution-no_go' : ' caution-warn';
    return `<div class="combo-chip${sevClass}" data-tip="${escHtml(it.tip)}">
      <span class="combo-icon">${it.icon}</span>
      <div class="combo-label">${escHtml(it.short)}</div>
    </div>`;
  }).join('');
  return `<section class="card combo-card">
    ${amenTiles.length ? `<div class="combo-row-label">Amenities</div><div class="combo-row">${amenRow}</div>` : ''}
    ${actTiles.length  ? `<div class="combo-row-label">Activities</div><div class="combo-row">${actRow}</div>`  : ''}
    ${cautTiles.length ? `<div class="combo-row-label">Cautions</div><div class="combo-row">${cautRow}</div>`   : ''}
  </section>`;
}

// Legacy aliases — kept so old callers don't break, but render
// nothing now that the combined card covers both surfaces.
function buildActivitiesCard() { return ''; }

// Alternatives card — renders when (a) dogs not allowed here, or
// (b) sand/water prohibited (trails-only). Lists top 3 nearby beaches
// from the alternatives array returned by get_beach_info.
function buildAlternativesSection(dogPolicy, alternatives) {
  if (!Array.isArray(alternatives) || alternatives.length === 0) return '';
  const isNoDogs = !!dogPolicy && (
    dogPolicy.dogs_allowed === 'no' ||
    (dogPolicy.has_on_leash === false && dogPolicy.has_off_leash === false)
  );
  const isSandWaterProhibited = _sandOrWaterProhibited(dogPolicy?.zone_rules);
  if (!isNoDogs && !isSandWaterProhibited) return '';

  const alts = alternatives.slice(0, 3);
  const reason = isNoDogs
    ? "Dogs aren't allowed at this beach. Try one of these nearby spots instead."
    : "Dogs can't go on the sand or in the water at this beach. These nearby spots welcome pups in the surf.";

  const rows = alts.map(a => {
    const miles = (a.distance_km || 0) * 0.621371;
    const modes = [];
    if (a.has_off_leash === true) modes.push('off-leash');
    if (a.has_on_leash  === true) modes.push('on-leash');
    return `
      <a class="alt-row" href="beach.html?fid=${a.fid}">
        <div class="alt-row-left">
          <div class="alt-name">${escHtml(a.name)}</div>
          <div class="alt-meta">${miles.toFixed(1)} mi away · ${modes.join(' + ') || 'dogs allowed'}</div>
        </div>
      </a>`;
  }).join('');

  return `<section class="card alt-card">
    <div class="alt-card-header">🐾 Try these instead</div>
    <div class="alt-card-reason">${escHtml(reason)}</div>
    <div class="alt-list">${rows}</div>
  </section>`;
}

function buildDetailsSection(dogPolicy) {
  // Bottom-of-page Details card. Structured / curated facts about the
  // beach. Currently sourced from dog_policy.zone_rules.global_notes
  // (operator + ordinance + sibling context). Distinct from
  // .beach-description which carries the LLM-generated Scout-voice
  // prose at the top of the page.
  const text = dogPolicy?.zone_rules?.global_notes;
  if (!text) return '';
  return `<section class="card">
    <h2>Details</h2>
    <div class="details-prose">${escHtml(text)}</div>
  </section>`;
}

function buildLinksSection(beach, beachFid) {
  const rows = [];
  if (!rows.length) return '';
  return `<section class="card"><h2>More info</h2>${rows.join('')}</section>`;
}

// ── Dog Park suggestion (Phase d — 2026-05-19) ──────────────────────
// Mirror of beach.html implementation. Additive ("Extend the day") OR
// reframed ("Better fit right now") based on trigger tier.

async function loadDogParkSuggestion(beach, beachFid, dogPolicy, hoursToday) {
  const mount = document.getElementById('dog-park-mount');
  if (!mount) return;

  let dp = null;
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_nearest_dog_park_for_beach`, {
      method: 'POST',
      headers: {
        apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`,

// ── Water-condition advisories (NWS + marine + deterministic) ───────
// Per docs/water_conditions_advisory_spec.md + Franz 2026-05-19 unified
// beach_advisory store. Mirrors beach.html (desktop). Fills the
// cautions-card mount; hides it when no advisories.
async function loadWaterConditionAdvisories(beachFid) {
  const card = document.querySelector('.cautions-card');
  if (!card) return;
  let items = [];
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/get_beach_advisories`, {
      method:  'POST',
      headers: {
        apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ p_fid: parseInt(beachFid, 10), p_horizon_hours: 24 }),
    });
    if (!r.ok) return;
    items = await r.json();
  } catch { return; }
  // Today-only filter (user's local time). Drop advisories that don't
  // start until after end-of-day today. Per Franz 2026-05-19.
  if (Array.isArray(items)) {
    const eod = new Date(); eod.setHours(23, 59, 59, 999);
    items = items.filter(a => {
      if (!a.valid_from) return true;
      const from = new Date(a.valid_from);
      return isNaN(from.getTime()) || from <= eod;
    });
  }
  if (!Array.isArray(items) || items.length === 0) {
    card.style.display = 'none';
    return;
  }

  // Severity → combo-chip tint class (same palette as amenities/activities).
  const sevToClass = {
    extreme: 'caution-no_go', severe: 'caution-no_go',
    moderate: 'caution-warn', minor: '',
  };

  // Compact chip strip — same combo-chip shape used elsewhere on this card.
  // Click expands the chip and shows its dog-impact text below the row.
  const chips = items.map((a, i) => {
    const cls   = sevToClass[a.severity] ?? 'caution-warn';
    const icon  = a.icon || '⚠️';
    const label = a.label || a.event_type || 'Advisory';
    return `<button type="button" class="combo-chip ${cls}"
                    data-cidx="${i}" aria-expanded="false">
      <span class="combo-icon">${icon}</span>
      <div class="combo-label">${escHtml(label)}</div>
    </button>`;
  }).join('');

  card.style.display = '';
  card.innerHTML = `
    <div class="combo-row-label">Cautions</div>
    <div class="combo-row">${chips}</div>
    <div class="caution-detail" id="caution-detail" hidden></div>`;

  const row    = card.querySelector('.combo-row');
  const detail = card.querySelector('#caution-detail');
  row.addEventListener('click', (e) => {
    const btn = e.target.closest('.combo-chip');
    if (!btn) return;
    const wasOpen = btn.getAttribute('aria-expanded') === 'true';
    row.querySelectorAll('.combo-chip[aria-expanded="true"]')
       .forEach(t => t.setAttribute('aria-expanded', 'false'));
    if (wasOpen) {
      detail.hidden = true; detail.innerHTML = '';
      return;
    }
    btn.setAttribute('aria-expanded', 'true');
    const a = items[parseInt(btn.dataset.cidx, 10)];
    const text  = a.dog_impact_text || a.label || a.event_type || '';
    const value = a.value || a.event_type || '';
    const window = _formatAdvisoryWindow(a.valid_from, a.valid_to);
    detail.innerHTML = `
      <div style="font-weight:600; margin-bottom:2px;">
        ${escHtml(a.label || a.event_type || 'Advisory')}
        ${value ? `<span style="font-weight:500; color:var(--text-muted); margin-left:6px;">${escHtml(value)}</span>` : ''}
      </div>
      <div>${escHtml(text)}</div>
      ${window ? `<div style="margin-top:4px; color:var(--text-muted); font-size:11px;">${escHtml(window)}</div>` : ''}`;
    detail.hidden = false;
  });
}

// Friendly time-window string for a beach_advisory row.
// "Until 9pm" when valid_from is in the past, else "4pm–9pm" same day,
// or "Today 4pm to Tue 9pm" across days. Returns '' on missing data.
function _formatAdvisoryWindow(fromIso, toIso) {
  if (!toIso) return '';
  const to = new Date(toIso);
  const from = fromIso ? new Date(fromIso) : null;
  if (isNaN(to.getTime())) return '';
  const now = new Date();
  const fmtT = d => {
    const h = d.getHours(); const m = d.getMinutes();
    const ap = h >= 12 ? 'pm' : 'am';
    const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
    return m ? `${h12}:${String(m).padStart(2,'0')}${ap}` : `${h12}${ap}`;
  };
  const sameDay = (a, b) => a.toDateString() === b.toDateString();
  const dayLabel = d => sameDay(d, now) ? 'today'
                    : sameDay(d, new Date(now.getTime() + 86400000)) ? 'tomorrow'
                    : d.toLocaleDateString(undefined, { weekday: 'short' });
  if (from && from <= now) {
    return sameDay(to, now) ? `Until ${fmtT(to)}` : `Until ${dayLabel(to)} ${fmtT(to)}`;
  }
  if (!from) {
    return sameDay(to, now) ? `Until ${fmtT(to)}` : `Until ${dayLabel(to)} ${fmtT(to)}`;
  }
  if (sameDay(from, to)) {
    return sameDay(from, now)
      ? `${fmtT(from)}–${fmtT(to)}`
      : `${dayLabel(from)} ${fmtT(from)}–${fmtT(to)}`;
  }
  return `${dayLabel(from)} ${fmtT(from)} to ${dayLabel(to)} ${fmtT(to)}`;
}

function _detectDpTriggerTier(dogPolicy, hoursToday) {
  if (!dogPolicy) return 'none';
  if (dogPolicy.dogs_allowed === 'no' ||
      (dogPolicy.has_on_leash === false && dogPolicy.has_off_leash === false)) {
    return 'no_dogs';
  }
  if (dogPolicy.dogs_prohibited_start && dogPolicy.dogs_prohibited_end) {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const nowHm = `${hh}:${mm}`;
    const s = dogPolicy.dogs_prohibited_start;
    const e = dogPolicy.dogs_prohibited_end;
    if (s <= e ? (nowHm >= s && nowHm < e)
               : (nowHm >= s || nowHm < e)) return 'prohibited_now';
  }
  return 'none';
}

function buildDogParkCard(dp, trigger, beach) {
  const isReframed = trigger !== 'none';
  const verified = dp.source === 'operator_posted';
  const distLabel = dp.distance_miles != null
    ? `${dp.distance_miles.toFixed(1)} mi away` : '';
  const hours = dp.hours_text
              || (dp.hours_open_time && dp.hours_close_time
                  ? `${dp.hours_open_time}–${dp.hours_close_time}` : '');
  const leashMap = {
    off_leash:               'off-leash',
    off_leash_voice_control: 'off-leash (voice control)',
    on_leash:                'on-leash',
  };
  const leash = leashMap[dp.leash_policy] || dp.leash_policy || '';

  const operatorLine = verified && dp.operator_short
    ? `<div class="dp-verified-badge">✓ Verified by ${escHtml(dp.operator_short)}</div>` : '';

  const reasonMap = {
    no_dogs:        'Dogs aren\'t allowed at this beach.',
    closed:         'This beach is closed.',
    prohibited_now: 'Dogs aren\'t allowed here right now.',
  };
  const reasonLine = reasonMap[trigger]
    ? `<div class="dp-card-reason">${escHtml(reasonMap[trigger])}</div>` : '';

  const cardClass = isReframed ? 'dog-park-card-reframed' : 'dog-park-card-additive';
  const heading = isReframed ? '🐕 Better fit right now' : '🐕 Extend the day';

  const mapsUrl = (dp.dp_lat != null && dp.dp_lon != null)
    ? `https://maps.apple.com/?daddr=${dp.dp_lat},${dp.dp_lon}`
    : null;

  const metaBits = [leash, hours, distLabel].filter(Boolean).join(' · ');
  const clickAttr = mapsUrl ? ` onclick="window.open('${mapsUrl}','_blank','noopener')"` : '';

  return `<section class="card ${cardClass}"${clickAttr}>
    <div class="dp-card-heading">${heading}</div>
    ${reasonLine}
    <div class="dp-card-llm" id="dp-card-llm">…</div>
    <div class="dp-card-body">
      <div class="dp-name">${escHtml(dp.dp_name)}</div>
      <div class="dp-meta">${escHtml(metaBits)}</div>
      ${operatorLine}
    </div>
  </section>`;
}

async function loadDpLlmCopy(beach, beachFid, dp, trigger) {
  const llmEl = document.getElementById('dp-card-llm');
  if (!llmEl) return;
  const cacheKey = `dp-llm-${beachFid}-${dp.dp_fid}-${trigger}`;
  try {
    const cached = localStorage.getItem(cacheKey);
    if (cached) { llmEl.textContent = cached; return; }
  } catch {}

  const dist = dp.distance_miles != null ? dp.distance_miles.toFixed(1) : '?';
  const hours = dp.hours_text || '';
  let question;
  if (trigger === 'none') {
    question = `User is at the ${beach.display_name} detail page. Nearby dog park: ${dp.dp_name} (${dist} mi away${hours ? ', ' + hours : ''}). In ONE short conversational sentence, suggest extending their visit by hitting the dog park as a complement to the beach. Friendly tone. Don't restate the dog park name. Don't start with "Consider".`;
  } else if (trigger === 'no_dogs') {
    question = `User wants to visit ${beach.display_name} but dogs aren't allowed there. Nearby dog park: ${dp.dp_name} (${dist} mi away${hours ? ', ' + hours : ''}). In ONE short conversational sentence, redirect them to the dog park as the right move today. Don't restate the dog park name; do mention the distance.`;
  } else if (trigger === 'closed') {
    question = `${beach.display_name} is closed today. Nearby dog park: ${dp.dp_name} (${dist} mi away${hours ? ', ' + hours : ''}). In ONE short sentence, suggest the dog park instead. Don't restate the dog park name.`;
  } else if (trigger === 'prohibited_now') {
    question = `User is looking at ${beach.display_name} right now but dogs aren't allowed here at this hour. Nearby dog park: ${dp.dp_name} (${dist} mi away${hours ? ', open ' + hours : ''}). In ONE short sentence, redirect them now and mention they could return to the beach later. Don't restate the dog park name.`;
  }

  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/beach-chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${ANON_KEY}` },
      body: JSON.stringify({ arena_group_id: parseInt(beachFid, 10), question, conversation_history: [] }),
    });
    if (!r.ok) { llmEl.textContent = ''; return; }
    const data = await r.json();
    const text = (data.answer || '').trim();
    if (text) {
      llmEl.textContent = text;
      try { localStorage.setItem(cacheKey, text); } catch {}
    } else {
      llmEl.textContent = '';
    }
  } catch { llmEl.textContent = ''; }
}


function wireCopyButtons() {
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await navigator.clipboard.writeText(btn.dataset.copy);
        btn.classList.add('copied');
        const t = btn.textContent;
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.classList.remove('copied'); btn.textContent = t; }, 1500);
      } catch {}
    });
  });
}

function initMap(beach) {
  if (beach.lat == null || beach.lng == null) return;
  const mapEl = document.getElementById('map');
  if (!mapEl) return;
  const map = L.map('map', {
    zoomControl: true, scrollWheelZoom: false,
  }).setView([beach.lat, beach.lng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a>',
    maxZoom: 19,
  }).addTo(map);
  if (beach.geom?.type === 'Polygon' || beach.geom?.type === 'MultiPolygon') {
    const layer = L.geoJSON(beach.geom, {
      style: { color: '#1d4ed8', weight: 2, fillOpacity: 0.15 },
    }).addTo(map);
    map.fitBounds(layer.getBounds(), { padding: [16, 16] });
  } else {
    L.marker([beach.lat, beach.lng]).addTo(map);
  }
  // Map container is in a flex row whose height grows when the sibling
  // photo image loads. Leaflet caches dimensions at init — stale once
  // the photo expands the row. ResizeObserver keeps tiles fresh as the
  // container changes size (photo load, window resize, devtools open).
  if (typeof ResizeObserver !== 'undefined') {
    const ro = new ResizeObserver(() => map.invalidateSize());
    ro.observe(mapEl);
  }
  // Belt-and-suspenders: also invalidate after the first paint cycle
  // and after the photo block (if any) likely settles.
  requestAnimationFrame(() => map.invalidateSize());
  setTimeout(() => map.invalidateSize(), 400);
  setTimeout(() => map.invalidateSize(), 1200);
}
