[project]
name = "dog_beach_dagster"
version = "0.2.0"
description = "Dagster project for Dog Beach Scout pipeline (v2, fresh start 2026-05-13)."
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.13",
    "dagster-webserver>=1.13",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "dagster-webserver>=1.13",
]

[tool.dagster]
module_name = "dog_beach"
code_location_name = "dog_beach"

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dog_beach*"]
